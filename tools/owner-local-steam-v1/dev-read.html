<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DEV-only Owner-local Rust typed metadata read</title>
<style>
body{font:16px/1.5 system-ui,sans-serif;max-width:56rem;margin:auto;padding:1.5rem}
label{display:block;margin:1rem 0}
input[type=text]{display:block;box-sizing:border-box;width:100%;padding:.5rem;font:inherit}
button{padding:.5rem 1rem;margin:.25rem}
pre{white-space:pre-wrap;overflow-wrap:anywhere}
</style>
</head>
<body>
<h1>DEV-only Rust metadata read (local)</h1>
<p>This localhost diagnostic is NOT an enabled product Save Consumer.
Only Rust-validated field names, type kinds and byte lengths can be read.
No JSON values, edited copies, Writer, Apply or Cloud access.</p>
<form id="proof">
<label>Original encrypted P1G
<input id="file" type="file" required></label>
<label>Independently observed installed Steam FullVersion
<input id="build" type="text" required autocomplete="off"></label>
<label>Original encrypted P1G SHA-256 (lowercase hex, independently calculated)
<input id="sha" type="text" required pattern="[a-f0-9]{64}"
 maxlength="64" autocomplete="off"></label>
<label><input id="ack" type="checkbox" required>
I obtained the Steam FullVersion and original SHA independently of Save metadata.
This claim is NOT cryptographic physical-Build proof.</label>
<button type="submit">Open read-only Rust Session</button>
<button id="close" type="button">Revoke Session</button>
</form>
<section aria-label="DEV typed metadata">
<button id="player" type="button" disabled>Read next Player metadata page</button>
<button id="world" type="button" disabled>Read next World metadata page</button>
</section>
<p id="status" role="status" aria-live="polite">No file opened</p>
<pre id="receipt" aria-label="Local-only receipt or typed metadata"></pre>
<script type="module" src="./dev-read-page.mjs"></script>
</body>
</html>

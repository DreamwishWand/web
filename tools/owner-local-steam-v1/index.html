<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Owner-only P1G Rust V1 read-only local proof</title>
<style>
body{font:16px/1.5 system-ui,sans-serif;max-width:56rem;margin:auto;padding:1.5rem}
label{display:block;margin:1rem 0}input[type=text]{display:block;width:100%;box-sizing:border-box;padding:.5rem;font:inherit}
button{padding:.5rem 1rem}pre{overflow-wrap:anywhere;white-space:pre-wrap}
</style>
</head>
<body>
<h1>Owner-local P1G Rust V1 read-only proof</h1>
<p>Only run on 127.0.0.1. No Cloud upload, Writer, file replacement,
Save export, Native V3 or product authorization. Physical Build proof remains
external and must not be inferred from the Save schema.</p>
<form id="proof">
<label>Original encrypted P1G (kept on this device)
<input id="file" type="file" required></label>
<label>Installed Steam FullVersion observed independently of the Save
<input id="build" type="text" required autocomplete="off"
placeholder="Paste the exact installed Steam FullVersion from your game installation"></label>
<label>Original file SHA-256 computed independently (64 lowercase hex characters)
<input id="sha" type="text" required autocomplete="off"
pattern="[a-f0-9]{64}" maxlength="64"></label>
<label><input id="ack" type="checkbox" required>
I independently observed the installed Steam FullVersion and obtained the
original SHA outside the Save contents. I understand this is not cryptographic
proof of the installed game build or permission to edit.</label>
<button type="submit">Run local read-only check</button>
<button id="close" type="button">Close &amp; revoke Session</button>
</form>
<p id="status" role="status" aria-live="polite">No file opened</p>
<pre id="receipt" aria-label="Local-only bounded proof receipt"></pre>
<script type="module" src="./page.mjs"></script>
</body>
</html>

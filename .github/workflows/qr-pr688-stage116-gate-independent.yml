name: 04 QR-S PR688 Stage116 E669 independent gate negative QA (NO DB / DEPLOY)
on:
  push:
    branches: [qa/pr688-stage116-gate-independent-20261106]
permissions:
  contents: read
jobs:
  qr-stage116-evidence-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DATABASE_URL: ''
      SUPABASE_ACCESS_TOKEN: ''
      SUPABASE_PROJECT_ID: ''
      SUPABASE_DB_PASSWORD: ''
      PGHOST: ''
      PGSERVICE: ''
      PGPASSWORD: ''
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Freeze exact PR688 Source, three add-only paths, and immutable82 original
        shell: bash
        run: |
          set -euo pipefail
          SOURCE=d560fac647ec46889d465d1919f26d539c0ab3f7
          PARENT=afeaf2955eb5515624d9ab27b8743e59e5a0145c
          git merge-base --is-ancestor "$SOURCE" HEAD
          git diff --name-only "$SOURCE" HEAD | sort >/tmp/qr688-actual
          printf '%s\n' \
            .github/workflows/qr-pr688-stage116-gate-independent.yml \
            tests/qr-pr688-stage116-gate-independent.test.mjs | sort >/tmp/qr688-expected
          diff -u /tmp/qr688-expected /tmp/qr688-actual
          test -z "$(git diff --name-only "$SOURCE" HEAD -- supabase src scripts docs)"
          test "$(git hash-object scripts/comm-stage116-safe-forward-gate.mjs)" = ed3306bdad8bc50db27bb2c4524937824d12d7ab
          test "$(git hash-object tests/comm-stage116-safe-forward-gate.test.mjs)" = 734fef0e2d1db5266d1756a4c3f1fb898d7b6769
          test "$(git hash-object docs/community/stage116-safe-forward-negative-preflight-20261106.md)" = b6b574b7d2dc68dad80f0fc72ae59e1e7662b428
          test "$(git hash-object supabase/migrations/20260930025132_community_core_v0_server_rpc.sql)" = bbf9bc830440d964c5da8b3c3cac7e926d281881
          git diff --name-only "$PARENT" "$SOURCE" | sort >/tmp/qr688-sourcedelta
          printf '%s\n' \
            docs/community/stage116-safe-forward-negative-preflight-20261106.md \
            scripts/comm-stage116-safe-forward-gate.mjs \
            tests/comm-stage116-safe-forward-gate.test.mjs | sort >/tmp/qr688-sourceexpected
          diff -u /tmp/qr688-sourceexpected /tmp/qr688-sourcedelta
          test -z "$DATABASE_URL" && test -z "$SUPABASE_ACCESS_TOKEN" &&
            test -z "$SUPABASE_PROJECT_ID" && test -z "$SUPABASE_DB_PASSWORD" &&
            test -z "$PGHOST" && test -z "$PGSERVICE" && test -z "$PGPASSWORD"
          echo QR688_FROZEN_PR688_AND_QA_TWO_ONLY_NO_SQL_ALTERATION_PASS
      - name: Independent exhaustive E669 forged snapshots and remote CLI denial
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/qr-pr688-stage116-gate-independent.test.mjs | tee /tmp/qr688-test.log
          for marker in \
            QR688_E669_PINNED_HISTORICAL82_R16_MISSING_ALWAYS_HOLD_PASS \
            QR688_ALL_FIELDS_MISSING_TAMPER_TYPE_AND_EXTRA_DENIED_PASS \
            QR688_FAKE_SIGNED_R16_LEGACY_ROLE_APPROVAL_ROLLBACK_NOT_EVIDENCE_PASS \
            QR688_MALFORMED_PROTOTYPE_OPTION_INPUT_FAIL_CLOSED_PASS \
            QR688_CLI_READONLY_INSPECT_ONLY_REMOTE_SECRETS_DENIED_PASS \
            QR688_NO_EXECUTION_OR_SQL_GENERATOR_NO_HISTORY_MUTATION_PASS; do
            grep -q "$marker" /tmp/qr688-test.log
          done
          echo QR688_NEW_ONLY_INDEPENDENT_SIX_CASES_GATE_ALWAYS_HOLD_PASS
      - name: Static CLI preflight status must remain HOLD, no managed run
        shell: bash
        run: |
          set -euo pipefail
          node scripts/comm-stage116-safe-forward-gate.mjs --inspect-recorded-e669 >/tmp/qr688-status.json
          node -e 'const x=JSON.parse(require("node:fs").readFileSync("/tmp/qr688-status.json","utf8")); const k=["mayGenerateSql","mayApplyMigration","mayDeploy","mayMerge","writerEnabled","communityPublicEnabled","providerEnabled","original82RawBootstrapPass","stageEquivalentClonePass","fullSignedGoTrueTwoPgPass","rollbackProven"];if(x.status!=="HOLD_R16_SIGNED_PREREQUISITE"||k.some(a=>x[a]!==false))process.exit(1);'
          test "$(git hash-object supabase/migrations/20260930025132_community_core_v0_server_rpc.sql)" = bbf9bc830440d964c5da8b3c3cac7e926d281881
          echo QR688_E669_CLI_HOLD_ONLY_NO_DEPLOY_OR_MANAGED_SQL_PASS
      - name: Clean synthetic test outputs
        if: always()
        shell: bash
        run: |
          rm -f /tmp/qr688-actual /tmp/qr688-expected /tmp/qr688-sourcedelta /tmp/qr688-sourceexpected /tmp/qr688-test.log /tmp/qr688-status.json
          echo QR688_SYNTHETIC_QA_ARTIFACTS_CLEANED

name: QA ONLY 04 QR-W PR2312 P1G Rust decoded UTF8 borrowed lifetime L2 NEVER MERGE
on:
  pull_request:
    paths:
      - '.github/workflows/qa-qrw-pr2312-rust-decoded-utf8-wipe-l2.yml'
permissions:
  contents: read
jobs:
  actual-p1g-decoded-utf8-borrow-wipe-l2:
    runs-on: ubuntu-24.04
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 04qrw/pr2312-ed25-decoded-utf8-borrowed-plaintext-l2
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install exact package lock
        run: npm ci --no-audit --no-fund
      - name: Pin exact fixed corrected Source2 pre/post and independent QA-only2 GitBlobs
        shell: bash
        run: |
          set -euo pipefail
          base=5e0315356626b9742bcd80f4b99a19143884a9df
          source=ed25b966ee01df77033058ceedeb4d05fd1798f0
          git merge-base --is-ancestor "$base" HEAD
          test "$(git rev-parse "$base:src/lib/ddv/core/save/p1g-rust-worker-readonly-bridge.mjs")" = 3893195fe0b675a80cab36ec788be4ac756a3ac5
          test "$(git rev-parse 'HEAD:src/lib/ddv/core/save/p1g-rust-worker-readonly-bridge.mjs')" = 80be1e270486ba3a5508089503e52e636451f158
          test "$(git rev-parse "$base:tests/p1g-rust-worker-readonly-bridge.test.mjs")" = f36439abd3828bca6dd25dd54f93534e62096e61
          test "$(git rev-parse 'HEAD:tests/p1g-rust-worker-readonly-bridge.test.mjs')" = ccdb43bfd1fc4cbd52af7fd677aba2048215519d
          test "$(git rev-parse 'HEAD:tests/qa-qrw-pr2312-utf8-borrow-wipe-epoch-after-rust-l2.test.mjs')" = ba7237accf89ca42f4316338759580e1dd54eee9
          for f in src/lib/ddv/core/save/p1g-rust-worker-readonly-bridge.mjs tests/p1g-rust-worker-readonly-bridge.test.mjs tests/qa-qrw-pr2312-utf8-borrow-wipe-epoch-after-rust-l2.test.mjs .github/workflows/qa-qrw-pr2312-rust-decoded-utf8-wipe-l2.yml; do
            test "$(git ls-tree HEAD "$f" | awk '{print $1}')" = 100644
          done
          printf '%s\n' src/lib/ddv/core/save/p1g-rust-worker-readonly-bridge.mjs tests/p1g-rust-worker-readonly-bridge.test.mjs | LC_ALL=C sort >/tmp/source
          printf '%s\n' .github/workflows/qa-qrw-pr2312-rust-decoded-utf8-wipe-l2.yml tests/qa-qrw-pr2312-utf8-borrow-wipe-epoch-after-rust-l2.test.mjs | LC_ALL=C sort >/tmp/qa
          git diff --name-only "$base" "$source" | LC_ALL=C sort | diff -u /tmp/source -
          git diff --name-only "$source" HEAD | LC_ALL=C sort | diff -u /tmp/qa -
          git diff --quiet "$source" HEAD -- src/ scripts/ ops/ crates/ static/ package-lock.json
          echo QRW2312_FIXED_SOURCE2_QAONLY2_EXACT_GITBLOBS_PASS
      - name: Run original corrected bridge and independent actual Rust borrow UTF8 adversarial cases
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/p1g-rust-worker-readonly-bridge.test.mjs tests/qa-qrw-pr2312-utf8-borrow-wipe-epoch-after-rust-l2.test.mjs
          echo QRW2312_P1G_RUST_SYNCHRONOUS_BORROW_UTF8_ZEROIZE_L2_PASS

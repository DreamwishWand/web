name: 08 WEB Steam626 Bamboo gated readonly Consumer (Writer OFF)
on:
  pull_request:
    paths:
      - 'src/lib/wep/steam-bamboo-readonly-consumer.mjs'
      - 'src/lib/wep/steam-bamboo-readonly.consumer.worker.mjs'
      - 'src/routes/editor/bamboo/steam/read/+page.svelte'
      - 'tests/web-steam626-bamboo-protected-consumer.test.mjs'
      - 'scripts/web-steam626-bamboo-protected-consumer-chrome.mjs'
      - '.github/workflows/08web-steam626-bamboo-protected-consumer.yml'
permissions:
  contents: read
jobs:
  exact-bamboo-consumer:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - name: Scoped Worker DTO and negative UI authorization boundary
        run: node --test tests/web-steam626-bamboo-protected-consumer.test.mjs tests/web-steam626-bamboo-readonly-off-ui.test.mjs
      - name: Product Svelte TypeScript check and static Pages build
        env:
          BASE_PATH: /web
        run: npm run check && npm run build
      - name: Real Chrome signed-anchor absent and 320/200-percent OFF rollback
        env:
          BASE_PATH: /web
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false playwright-core@1.55.0
          export CHROME_BIN="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium)"
          test -n "$CHROME_BIN"
          npm run preview -- --host 127.0.0.1 --port 4298 --strictPort >/tmp/08web-bamboo-reader-consumer.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4298/web/editor/bamboo/steam/read/ >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4298/web/editor/bamboo/steam/read/ >/dev/null
          node scripts/web-steam626-bamboo-protected-consumer-chrome.mjs

name: 05 QR-C PR1034 fixed epoch independent
on:
  pull_request:
    paths:
      - 'tests/qa/05qrc-pr1034-fixed-epoch.mjs'
      - '.github/workflows/05qrc-pr1034-fixed-epoch.yml'
permissions:
  contents: read
jobs:
  independent:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_TARGET_DIR: /tmp/qa1034-fixed-target
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
          targets: wasm32-unknown-unknown
      - name: Exact fixed Source and historical QA reproduction
        run: |
          git merge-base --is-ancestor b383fb7b07d2e72649d93f4508549d08fc8a399f HEAD
          test "$(git diff --name-only b383fb7b07d2e72649d93f4508549d08fc8a399f HEAD | wc -l)" -eq 2
          test "$(git rev-parse HEAD:src/lib/ddv/core/save/p1g-rust-worker-readonly-bridge.mjs)" = 613950fe59f4cffade0babd572fda8d00e77428d
          test "$(git rev-parse HEAD:tests/official-dev-furniture-zero.mjs)" = a013ae578b8fb78ff7137eec05a15dc0db787cd9
          git show 89afc4418fe1c56744bc5210ccc85592f3c52f8d:tests/qa/05qrc-pr1034-dev-epoch.mjs > tests/qa/05qrc-pr1034-old-replay.mjs
          test "$(git hash-object tests/qa/05qrc-pr1034-old-replay.mjs)" = 6055a1c5ecf99b3bd8b61b3a58d578cd6586cef6
      - name: Generate locked actual DEV WASM and independent tests
        run: |
          cargo generate-lockfile --manifest-path crates/ddv-save-core/Cargo.toml
          echo 'e58486d673df79bfe7e72b80449e39389e57010fe4051edcdcff9b53c2da898c  crates/ddv-save-core/Cargo.lock' | sha256sum -c -
          cargo build --locked --manifest-path crates/ddv-save-core/Cargo.toml --release --target wasm32-unknown-unknown --no-default-features --features worker-wasm,indexed-read,semantic-writer-dev
          cargo install wasm-bindgen-cli --version 0.2.105 --locked --root "$RUNNER_TEMP/bindgen"
          mkdir -p "$RUNNER_TEMP/dev"
          "$RUNNER_TEMP/bindgen/bin/wasm-bindgen" "$CARGO_TARGET_DIR/wasm32-unknown-unknown/release/ddv_save_core.wasm" --target web --out-dir "$RUNNER_TEMP/dev" --no-typescript
          echo '{"type":"module"}' > "$RUNNER_TEMP/dev/package.json"
          node tests/qa/05qrc-pr1034-old-replay.mjs "$RUNNER_TEMP/dev"
          node tests/qa/05qrc-pr1034-fixed-epoch.mjs "$RUNNER_TEMP/dev"
      - name: Public WASM ABI remains read-only
        run: |
          cargo build --locked --manifest-path crates/ddv-save-core/Cargo.toml --release --target wasm32-unknown-unknown --no-default-features --features worker-wasm,indexed-read
          node --input-type=module -e "import {readFileSync} from 'node:fs'; const e=WebAssembly.Module.exports(new WebAssembly.Module(readFileSync(process.env.CARGO_TARGET_DIR+'/wasm32-unknown-unknown/release/ddv_save_core.wasm'))); if(e.some(x=>x.name.includes('_dev_'))) process.exit(2);"

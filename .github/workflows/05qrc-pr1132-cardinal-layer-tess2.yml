name: 05 QR-C PR1132 independent cardinal layer tess2
on:
  pull_request:
    paths:
      - 'crates/ddv-save-core/tests/qa_pr1132_cardinal_layer_tess2.rs'
      - '.github/workflows/05qrc-pr1132-cardinal-layer-tess2.yml'
permissions:
  contents: read
jobs:
  independent:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
          targets: wasm32-unknown-unknown
      - name: Exact Source2 and QA-only2
        run: |
          source=149857806579e00c746316b7d139a5fcf6e781e2
          test "$(git merge-base "$source" HEAD)" = "$source"
          test "$(git diff --name-only "$source" HEAD | wc -l)" -eq 2
          test "$(git diff --diff-filter=A --name-only "$source" HEAD | wc -l)" -eq 2
          test "$(git rev-parse HEAD:crates/ddv-save-core/src/spatial_reference_index.rs)" = 20e93dcae6e219c48de144df74359e97642c861e
          test "$(git rev-parse HEAD:crates/ddv-save-core/tests/steam_native_cardinal_layer_cells.rs)" = df9af6068397692cf05423a83bb3e9226ae3390c
      - name: Locked independent forward oracle and scoped negatives
        run: |
          cp scripts/wasm-distribution/approved-Cargo.lock crates/ddv-save-core/Cargo.lock
          echo 'e58486d673df79bfe7e72b80449e39389e57010fe4051edcdcff9b53c2da898c  crates/ddv-save-core/Cargo.lock' | sha256sum -c -
          cargo test --locked --manifest-path crates/ddv-save-core/Cargo.toml --no-default-features --features indexed-read --test qa_pr1132_cardinal_layer_tess2 -- --nocapture
          cargo test --locked --manifest-path crates/ddv-save-core/Cargo.toml --no-default-features --features indexed-read --test steam_native_cardinal_layer_cells
          cargo check --locked --manifest-path crates/ddv-save-core/Cargo.toml --target wasm32-unknown-unknown --no-default-features --features worker-wasm,indexed-read

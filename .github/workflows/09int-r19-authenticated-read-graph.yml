name: 09 INT Source139 authenticated Read Graph static witness
on:
  pull_request:
    paths:
      - 'tests/09int-r19-authenticated-read-graph-gap.test.mjs'
      - '.github/workflows/09int-r19-authenticated-read-graph.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: New-only SOURCE139 reader gap contract (STATIC; not PG or Provider)
        run: node --test tests/09int-r19-authenticated-read-graph-gap.test.mjs

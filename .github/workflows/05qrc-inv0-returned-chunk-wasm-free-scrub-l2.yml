name: 05 QR-C Inventory0 returned chunk temporary Vec wasm-bindgen free scrub L2 (QA ONLY NEVER MERGE)
on:
  pull_request:
    paths:
      - .github/workflows/05qrc-inv0-returned-chunk-wasm-free-scrub-l2.yml
permissions:
  contents: read
jobs:
  optimized-wasm32-returned-chunk-dealloc:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_TARGET_DIR: /tmp/qrc-inv0-returned-chunk-wasm
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 05qrc-20261120-inv0-returned-chunk-wasm-free-scrub-l2
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
          targets: wasm32-unknown-unknown
      - name: Guard fixed unchanged product Source11 and QA one workflow only
        shell: bash
        run: |
          set -euo pipefail
          source=284a9b664cafd2078e6bd582458bd101c7bcf34b
          path=.github/workflows/05qrc-inv0-returned-chunk-wasm-free-scrub-l2.yml
          test "$(git merge-base "$source" HEAD)" = "$source"
          test "$(git diff --name-only "$source" HEAD)" = "$path"
          test "$(git ls-tree HEAD -- "$path" | awk '{print $1}')" = 100644
          test "$(git rev-parse HEAD:crates/ddv-save-core/src/product_session.rs)" = e53c4930a84f729ea245f38a1b301c7178146ced
          test "$(git rev-parse HEAD:crates/ddv-save-core/src/wasm_worker.rs)" = 775a2766f237d44ae77fa5347e9adf430c8580d2
          test "$(git rev-parse HEAD:crates/ddv-save-core/src/worker_session.rs)" = 254af029304f6a357c8c0a0e7a1376b80313d038
          test "$(git rev-parse HEAD:crates/ddv-save-core/Cargo.toml)" = b3455c36d9d60b4a0e415026a095e47fe577644d
          test "$(git rev-parse HEAD:.github/workflows/01a-steam626-inventory0-dedicated-rust-source.yml)" = 19d7f0c532badecc86f8d36ff89eed1ba0e28bf2
          test ! -e crates/ddv-save-core/Cargo.lock
          cp scripts/wasm-distribution/approved-Cargo.lock crates/ddv-save-core/Cargo.lock
          echo 'e58486d673df79bfe7e72b80449e39389e57010fe4051edcdcff9b53c2da898c  crates/ddv-save-core/Cargo.lock' | sha256sum -c -
          echo QRC_INV0_RETURNED_VEC_FIXED_SOURCE_ONE_QA_ONLY_PASS
      - name: Inject ephemeral exact returned temporary chunk Vec dealloc-before-free witness
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('crates/ddv-save-core/src/wasm_worker.rs')
          s=p.read_text()
          anchor='const MAX_CHUNK:usize=1024*1024;'
          assert s.count(anchor)==1
          probe=r'''
          // Ephemeral CI-only, nonshipped; observe exact temporary returned
          // JS-facing chunk Vec at WASM dealloc, BEFORE memory is freed.
          use std::alloc::{GlobalAlloc,Layout,System};
          use core::sync::atomic::{AtomicUsize,Ordering as QrcOrder};
          static QA_RETURN_CHUNK_ARMED:AtomicUsize=AtomicUsize::new(0);
          static QA_RETURN_CHUNK_PTR:AtomicUsize=AtomicUsize::new(0);
          static QA_RETURN_CHUNK_LEN:AtomicUsize=AtomicUsize::new(0);
          static QA_RETURN_CHUNK_DEALLOC:AtomicUsize=AtomicUsize::new(0);
          struct QaChunkAlloc;
          unsafe impl GlobalAlloc for QaChunkAlloc {
              unsafe fn alloc(&self,l:Layout)->*mut u8{System.alloc(l)}
              unsafe fn dealloc(&self,p:*mut u8,l:Layout){
                  let data=QA_RETURN_CHUNK_PTR.load(QrcOrder::SeqCst);
                  let len=QA_RETURN_CHUNK_LEN.load(QrcOrder::SeqCst);
                  let start=p as usize;
                  if data!=0 && len!=0 && start<=data &&
                     data.checked_add(len).is_some_and(|end|
                       start.checked_add(l.size()).is_some_and(|limit|end<=limit)){
                      let mut nonzero=false;
                      for i in 0..len{
                          if core::ptr::read_volatile((data as *const u8).add(i))!=0{
                              nonzero=true;break;
                          }
                      }
                      QA_RETURN_CHUNK_DEALLOC.store(if nonzero{1}else{2},QrcOrder::SeqCst);
                      QA_RETURN_CHUNK_PTR.store(0,QrcOrder::SeqCst);
                  }
                  System.dealloc(p,l);
              }
          }
          #[global_allocator]
          static QA_CHUNK_ALLOC:QaChunkAlloc=QaChunkAlloc;
          '''
          s=s.replace(anchor,probe+anchor,1)
          anchor='    pub fn append_chunk(&mut self,chunk:&[u8])->Result<(),JsValue>{'
          assert s.count(anchor)==1
          methods=r'''
              // QA-only: only booleans leak to JS, no data or pointers.
              pub fn qa_arm_returned_chunk_dealloc(&self)->bool{
                  if self.scoped_output.is_none(){return false;}
                  QA_RETURN_CHUNK_PTR.store(0,QrcOrder::SeqCst);
                  QA_RETURN_CHUNK_LEN.store(0,QrcOrder::SeqCst);
                  QA_RETURN_CHUNK_DEALLOC.store(0,QrcOrder::SeqCst);
                  QA_RETURN_CHUNK_ARMED.store(1,QrcOrder::SeqCst);
                  true
              }
              pub fn qa_take_returned_chunk_dealloc(&self)->u32{
                  QA_RETURN_CHUNK_DEALLOC.swap(0,QrcOrder::SeqCst) as u32
              }
          '''
          s=s.replace(anchor,methods+anchor,1)
          anchor='        let chunk=out[*pos..end].to_vec();out[*pos..end].fill(0);*pos=end;'
          assert s.count(anchor)==1
          replacement=r'''
                  let chunk=out[*pos..end].to_vec();
                  if QA_RETURN_CHUNK_ARMED.swap(0,QrcOrder::SeqCst)==1 {
                      QA_RETURN_CHUNK_PTR.store(chunk.as_ptr() as usize,QrcOrder::SeqCst);
                      QA_RETURN_CHUNK_LEN.store(chunk.len(),QrcOrder::SeqCst);
                  }
                  out[*pos..end].fill(0);*pos=end;
          '''
          p.write_text(s.replace(anchor,replacement,1))
          print('QRC_INV0_RETURNED_VEC_ONLY_CI_EPHEMERAL_OBSERVER')
          PY
      - name: Compile optimized Rust1.99.1 wasm32 exact Inventory0 source and wasm-bindgen0.2.105
        shell: bash
        run: |
          set -euo pipefail
          test "$(rustc --version | cut -d' ' -f2)" = 1.99.1
          cargo build --locked --release --manifest-path crates/ddv-save-core/Cargo.toml \
            --target wasm32-unknown-unknown --no-default-features \
            --features worker-wasm,product-steam626-catalog0-scoped
          cargo install wasm-bindgen-cli --version 0.2.105 --locked --root /tmp/qrc-inv0-chunk-bindgen
          mkdir -p /tmp/qrc-inv0-chunk-pkg
          /tmp/qrc-inv0-chunk-bindgen/bin/wasm-bindgen \
            "$CARGO_TARGET_DIR/wasm32-unknown-unknown/release/ddv_save_core.wasm" \
            --out-dir /tmp/qrc-inv0-chunk-pkg --target nodejs --no-typescript
      - name: Independently refute returned Vec memory scrub at actual JS boundary dealloc
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          src=Path('.github/workflows/01a-steam626-inventory0-dedicated-rust-source.yml').read_text()
          start=src.index('          const empty=()=>')
          end=src.index('          const hash=bytes=>',start)
          fixture='\n'.join(line[10:] for line in src[start:end].splitlines())+'\n'
          head="""import assert from 'node:assert/strict';
          import {createRequire} from 'node:module';
          import {createHash} from 'node:crypto';
          const {WorkerWasmSource}=createRequire(import.meta.url)('/tmp/qrc-inv0-chunk-pkg/ddv_save_core.js');
          """
          probe=r'''
          const sha=b=>createHash('sha256').update(b).digest('hex');
          const doc=structuredClone(source);
          doc.Unknown.unknownPadding='X'.repeat(1400000);
          const encoded=new TextEncoder().encode(JSON.stringify(doc));
          const originalSha=sha(encoded);
          const BUILD='releases_1.25-v1.25.3-44-g0b41250d9ac0-incremental-22';
          const w=new WorkerWasmSource('steam-windows','steam-full-version',BUILD,626,true,
            new Uint8Array(32).fill(0x58));
          for(let i=0;i<encoded.length;i+=1024*1024)w.append_chunk(encoded.slice(i,i+1024*1024));
          const receipt=JSON.parse(w.finish());
          assert.equal(receipt.writerAuthorized,false);
          const env=x=>[x.sessionId,BigInt(x.revision),BigInt(x.indexGeneration),x.decodedSha256];
          const p=JSON.parse(w.preview_scoped_amount('catalog0-furniture',0,40000048,2,...env(receipt)));
          const st=JSON.parse(w.stage_scoped_amount('catalog0-furniture',0,40000048,3,2,p.entrySha256,...env(receipt)));
          assert.equal(st.exactFieldChangedCount,1);
          const out=JSON.parse(w.begin_scoped_amount_output(...env(st)));
          assert.equal(out.writerAuthorized,false);
          assert.equal(out.originalOverwriteAuthorized,false);
          assert.ok(out.decodedBytes>1024*1024 && out.decodedBytes<4*1024*1024);
          const pieces=[];
          let total=0;
          for(let step=0;step<2;step++){
            assert.equal(w.qa_arm_returned_chunk_dealloc(),true);
            const chunk=w.next_scoped_amount_output_chunk();
            assert.ok(chunk.length>0);
            pieces.push(chunk);total+=chunk.length;
            const status=w.qa_take_returned_chunk_dealloc();
            // status 0: no deallocation observed (inconclusive);
            // status 1: actual nonzero plaintext at free (TRUE_RED);
            // status 2: all returned Vec data zero before free (safe).
            assert.equal(status,1,
              'expected TRUE_RED witness: WASM JS boundary frees Rust returned output chunk with live plaintext');
            console.log('QRC_INV0_RETURNED_CHUNK_ACTUAL_WASM_DEALLOC_NONZERO_TRUE_RED_STEP_'+step);
          }
          assert.equal(total,out.decodedBytes);
          const dst=new Uint8Array(total);let offset=0;
          for(const c of pieces){dst.set(c,offset);offset+=c.length}
          const expected=structuredClone(doc);
          expected.Player.ListInventories['0'].Inventory['40000048'].Amount=2;
          assert.equal(new TextDecoder().decode(dst),JSON.stringify(expected));
          assert.equal(sha(encoded),originalSha,'original decoded input immutable');
          assert.throws(()=>w.next_scoped_amount_output_chunk(),'no double output');
          w.close();w.free();
          console.log('QRC_INV0_RETURNED_CHUNK_TRUE_RED_TWO_ACTUAL_DEALLOCS_NO_OWNER_SAVE');
          '''
          Path('/tmp/qrc-inv0-returned-chunk.mjs').write_text(head+fixture+probe)
          PY
          node --check /tmp/qrc-inv0-returned-chunk.mjs
          node /tmp/qrc-inv0-returned-chunk.mjs
          test "$(git diff --name-only 284a9b664cafd2078e6bd582458bd101c7bcf34b HEAD)" = \
            '.github/workflows/05qrc-inv0-returned-chunk-wasm-free-scrub-l2.yml'

name: "04 QR-W PR615 R39 historical ItemID provenance new-only"
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/04qr-w-pr615-r39-source-new-only.yml'
      - 'tests/04qr-w-pr615-r39-source-new-only.test.mjs'
permissions:
  contents: read
jobs:
  independent-r39-source-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Original private Saves/asset bytes are not a shared CI fixture
        shell: bash
        run: |
          set -euo pipefail
          test -z "${WEP_PRIVATE_P1G_PATH:-}"
          test -z "${WEP_PRIVATE_LOCAL_ONLY_ACK:-}"
          test -z "${WEP_PRIVATE_EXTERNAL_BUILD_CONFIRMED:-}"
          node --check tests/04qr-w-pr615-r39-source-new-only.test.mjs
          node --test tests/04qr-w-pr615-r39-source-new-only.test.mjs

name: 03 COMM Source165 Save Entity Genuine Signed OFF (Disposable)
on:
  push:
    branches: [comm/w-comm-006-source165-save-entity-off-20261105]
permissions:
  contents: read
jobs:
  save-entity-off:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      DDVRE_E2_LOCAL_DISPOSABLE: APPROVED
      DATABASE_URL: ''
      SUPABASE_ACCESS_TOKEN: ''
      SUPABASE_PROJECT_ID: ''
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.0
      - name: Pin earlier migration bytes and Source165 unique suffix
        run: |
          set -euo pipefail
          test "$(find supabase/migrations -name '*.sql' | wc -l)" -eq 165
          test "$(git hash-object supabase/migrations/20261104040000_community_source162_gallery_photo_parent_service_execute_off.sql)" = 6d8ec394b1773c65db88e9b459afc59d6427b5b9
          test "$(git hash-object supabase/migrations/20261104050000_community_source163_help_answer_service_execute_off.sql)" = c02bf514abf51951c19e05f8ca7ef7383f071c70
          test "$(git hash-object supabase/migrations/20261105010000_community_source164_reaction_add_service_execute_off.sql)" = 8a272688b3f85e999e43cb772736dba6bc305606
          python3 -m py_compile tests/comm-source165-save-entity-signed-off-disposable.py
          test -z "$DATABASE_URL" && test -z "$SUPABASE_ACCESS_TOKEN" && test -z "$SUPABASE_PROJECT_ID"
      - name: Local ES256 FULL165 disposable GoTrue two PG
        run: |
          set -euo pipefail
          printf '\n[auth]\nsigning_keys_path = "./signing_keys.json"\n' >> supabase/config.toml
          printf '[]\n' > supabase/signing_keys.json
          supabase gen signing-key --algorithm ES256 --yes >/tmp/comm-save165-key.log 2>&1
          printf 'project_id = "ddvre_save_entity_source165_local"\n' | cat - supabase/config.toml > /tmp/comm-save165-config
          mv /tmp/comm-save165-config supabase/config.toml
          printf 'COMMUNITY_MEDIA_BUCKET=ddvre-save165-local-media\nWEP_PRESET_ARTIFACT_BUCKET=ddvre-save165-local-preset\n' > supabase/functions/.env
          timeout 1800s supabase start >/tmp/comm-save165-start.log 2>&1 || { echo SOURCE165_START_NOT_RUN; tail -n 12 /tmp/comm-save165-start.log; exit 1; }
          timeout 900s supabase db reset --no-seed >/tmp/comm-save165-reset.log 2>&1 || { echo SOURCE165_RESET_NOT_RUN; tail -n 12 /tmp/comm-save165-reset.log; exit 1; }
          echo SOURCE165_FULL165_LOCAL_BOOTSTRAP_PASS
      - run: python3 -m pip install --quiet 'psycopg[binary]==3.2.10'
      - name: Signed A2 409 revoked A1 401 2PG SQL42501 rollback no diff
        run: |
          set -euo pipefail
          python3 tests/comm-source165-save-entity-signed-off-disposable.py | tee /tmp/comm-save165-result.log
          grep -q '"case": "SOURCE165_SAVE_ENTITY_THREE_ROLE_SQL_EXECUTE_OFF"' /tmp/comm-save165-result.log
          grep -q '"case": "SOURCE165_ELIGIBLE_SIGNED_A2_EDGE409_THREE_ROLE_SQL42501_NO_DIFF"' /tmp/comm-save165-result.log
          grep -q '"case": "SOURCE165_REVOKED_A1_ORIGINAL_REFRESH401_TWO_PG_REPLAY_NO_DIFF"' /tmp/comm-save165-result.log
          grep -q '"case": "SOURCE165_TEMP_GRANT_TWO_PG_ROLLBACK_DENIED"' /tmp/comm-save165-result.log
          echo SOURCE165_OWNER_GENUINE_SIGNED_LOCAL_ONLY_NOT_INDEPENDENT_QA
      - name: Dispose local signer and database
        if: always()
        run: |
          supabase stop --no-backup >/dev/null 2>&1 || true
          rm -f supabase/signing_keys.json supabase/functions/.env /tmp/comm-save165-*

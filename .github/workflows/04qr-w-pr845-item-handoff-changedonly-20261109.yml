name: "04 QR-W PR845 Collection to isolated Board changed-risk QA"
on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/04qr-w-pr845-item-handoff-changedonly-20261109.mjs"
      - ".github/workflows/04qr-w-pr845-item-handoff-changedonly-20261109.yml"
  push:
    branches: [qa/04qr-w-pr845-item-handoff-changedonly-1fa5e691-20261109]
permissions:
  contents: read
jobs:
  independent-item-handoff:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm install --no-save --package-lock=false playwright-core@1.55.0
      - name: "Start isolated Vite server + installed Chrome"
        shell: bash
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
          BASE_PATH='' npm run dev -- --host 127.0.0.1 --port 4319 >/tmp/qrw845-vite.log 2>&1 &
          for i in $(seq 1 75); do
            if curl -fsS http://127.0.0.1:4319/collection/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/qrw845-vite.log
          exit 1
      - name: "Independent fixed five Source blobs and changed-risk browser negatives"
        env:
          QRW845_ORIGIN: http://127.0.0.1:4319
        run: node scripts/04qr-w-pr845-item-handoff-changedonly-20261109.mjs
      - name: "Bounded acceptance excludes globally authoritative Board migration"
        run: echo "QRW845_MIXED_STORE_AUTHORITY_WRITER_REAL_SAVE_PUBLIC_RELEASE_NOT_RUN_OFF"

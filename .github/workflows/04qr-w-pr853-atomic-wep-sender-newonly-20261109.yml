name: "04 QR-W PR853 explicit Atomic to WEP sender new-only Chrome"
on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/04qr-w-pr853-atomic-wep-sender-newonly-20261109.mjs"
      - ".github/workflows/04qr-w-pr853-atomic-wep-sender-newonly-20261109.yml"
  push:
    branches: [qa/04qr-w-pr853-explicit-atomic-wep-sender-6a6329-20261109]
permissions:
  contents: read
jobs:
  qrw853-changed-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm install --no-save --package-lock=false playwright-core@1.55.0
      - name: "Disposable Vite + real installed Chrome; no private P1G"
        shell: bash
        run: |
          set -euo pipefail
          test -z "${DDV_PRIVATE_SAVE_PATH:-}"
          test -z "${WEP_PRIVATE_P1G_PATH:-}"
          BIN="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$BIN"
          echo "CHROME_BIN=$BIN" >> "$GITHUB_ENV"
          BASE_PATH='' npm run dev -- --host 127.0.0.1 --port 4337 >/tmp/qrw853.log 2>&1 &
          for i in $(seq 1 75); do
            if curl -fsS http://127.0.0.1:4337/moodboards/atomic/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/qrw853.log
          exit 1
      - name: "Frozen original Source 5 plus changed-only browser negatives"
        env:
          QRW853_ORIGIN: http://127.0.0.1:4337
        run: node scripts/04qr-w-pr853-atomic-wep-sender-newonly-20261109.mjs
      - name: "No migration or Writer/Apply authorized"
        run: echo "QRW853_LOCAL_WEP_HINT_ONLY_NATIVE_PLACEMENT_WRITER_APPLY_OFF"

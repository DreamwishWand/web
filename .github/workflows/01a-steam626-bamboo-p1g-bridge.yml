name: 01A Steam626 Bamboo P1G Single Rust Reader Bridge (Writer OFF)
on:
  pull_request:
    paths:
      - 'src/lib/ddv/core/save/product-wasm-read-owner.mjs'
      - 'src/lib/ddv/core/save/product-wasm-read-owner.d.mts'
      - 'src/lib/ddv/core/save/p1g-rust-worker-readonly-bridge.mjs'
      - 'tests/01a-steam626-bamboo-p1g-single-reader-bridge.test.mjs'
      - '.github/workflows/01a-steam626-bamboo-p1g-bridge.yml'
permissions:
  contents: read
jobs:
  exact-bamboo-worker-private-readonly:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: One Worker private method and no product Writer/Cloud/feature enable
        run: |
          set -euo pipefail
          node --check src/lib/ddv/core/save/product-wasm-read-owner.mjs
          node --check src/lib/ddv/core/save/p1g-rust-worker-readonly-bridge.mjs
          node --check tests/01a-steam626-bamboo-p1g-single-reader-bridge.test.mjs
          test ! -e src/lib/ddv/core/save/product-wasm-distribution-flag-on.js
          grep -Fx 'const PRODUCT_READONLY_CONSUMER_OWNER_ENABLED=false;' src/lib/wep/steam-saved-diffgrids.consumer.worker.ts
          grep -F 'productConsumerEnabled:false' src/lib/ddv/core/save/product-rust-wasm-release-loader.mjs
      - name: Exact Bamboo Worker P1G + existing source regression tests
        run: |
          set -euo pipefail
          node --test tests/01a-steam626-bamboo-p1g-single-reader-bridge.test.mjs tests/p1g-rust-worker-readonly-bridge.test.mjs tests/product-wasm-read-owner.test.mjs
      - name: TypeScript declaration / Svelte project compatibility
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm run check

name: 04 QR D06 Source143 independent negative gate
on:
  pull_request:
    paths:
      - 'tests/qr-issue213-d06-independent-postowner.test.mjs'
      - 'tests/qr-issue213-d06-independent-localpg.sql'
      - 'docs/qa/qr-issue213-d06-independent-postowner-20261027.md'
      - '.github/workflows/qr-issue213-d06-independent.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  independent-source:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/qr-issue213-d06-independent-postowner.test.mjs
      - run: echo 'SOURCE ONLY | NO LIVE SIGNED JWT, CLOUD, CDN, PROVIDER OR STAGING ACCEPTANCE'
  independent-disposable-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_ACCESS_TOKEN: ''
      DATABASE_URL: ''
      DDVRE_PRIVACY_ISOLATED_LOCAL: 'CONFIRMED'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@v1
        with:
          version: 2.81.3
      - name: Force distinct LOCAL-only Supabase project with NO remote link/credentials
        run: |
          set -euo pipefail
          test -z "$SUPABASE_ACCESS_TOKEN"
          test -z "$DATABASE_URL"
          printf 'project_id = "ddvre_qr213_d06_ephemeral"\n' | cat - supabase/config.toml > /tmp/qr213-local.toml
          mv /tmp/qr213-local.toml supabase/config.toml
          echo 'QR213_NO_REMOTE_SUPABASE_LINK_OR_DEPLOY'
      - name: Clean source migrations to disposable ephemeral Postgres
        run: |
          set -euo pipefail
          timeout 1500s supabase start > /tmp/qr213-start.log 2>&1 || { tail -160 /tmp/qr213-start.log; exit 1; }
          echo 'QR213_EMPTY_LOCAL_143_SOURCE_MIGRATIONS_LOADED'
      - name: New-only independent pg_catalog ACL and effective legacy-writer denial
        run: |
          set -euo pipefail
          c=$(docker ps --format '{{.Names}}' | grep '^supabase_db_' | head -1)
          test -n "$c"
          docker exec -i "$c" psql -X -v ON_ERROR_STOP=1 -U postgres -d postgres < tests/qr-issue213-d06-independent-localpg.sql
          echo 'QR213_INDEPENDENT_EFFECTIVE_POSTGRES_DENIAL_ACCEPTED_LOCAL_ONLY'

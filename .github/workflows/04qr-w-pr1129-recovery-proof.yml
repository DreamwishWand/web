name: 04 QR-W PR1129 recovery checkpoint independent
on:
  pull_request:
    paths:
      - '.github/workflows/04qr-w-pr1129-recovery-proof.yml'
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = '0432d0e2d636871848f915e1dfaefe96b379a384'
          test "$(git diff --name-only HEAD^ HEAD)" = '.github/workflows/04qr-w-pr1129-recovery-proof.yml'
          test "$(git diff --name-only 'a09cc73f21a5a2ceacdf79187e7545510715b922' '0432d0e2d636871848f915e1dfaefe96b379a384' | wc -l)" = 2
          test "$(git rev-parse HEAD:src/lib/wep/world-editor-recovery.ts)" = 5f4ebf988990064506bff9e7919972db821841d3
          test "$(git rev-parse HEAD:tests/wep-recovery-checkpoint-preservation.test.mjs)" = 21e26740f2692e9d1abb5d82b08a2df29b0ccd8d
          npm ci --no-audit --no-fund
          npm install --no-save --package-lock=false playwright-core@1.55.0
          export CHROME_BIN="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium)"
          BASE_PATH='' npm run dev -- --host 127.0.0.1 --port 4363 --strictPort >/tmp/qa573.log 2>&1 &
          for i in $(seq 1 75); do if curl -fsS http://127.0.0.1:4363/editor/world/ >/dev/null; then break; fi; sleep 1; done
          curl -fsS http://127.0.0.1:4363/editor/world/ >/dev/null
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {chromium} from 'playwright-core';
          const recoveryProfile={
            GameInfo:{Version:624,InitialVersion:624,LastSaveDeviceInfo:{deviceType:'DeviceType_Switch'}},
            Player:{},
            ProfileWorld:{Stores:[],Shops:[]},
            ConditionalEventHistory:{ActiveEvents:{}},
            World:{
              GridCollection:{
                Grids:{
                  '10':{
                    ID:10,
                    GridDataPath:'GridData/Villages/Village04-BeachLevel-GridData.json',
                    GridDefaultLayoutPath:'',
                    TessellationFactor:2,
                    NextGridObjectID:102,
                    Objects:{
                      '101':{ID:101,ItemID:40000048,X:10,Y:10,Orientation:'GridOrientation_Up',State:null}
                    }
                  }
                },
                DiffGrids:{}
              },
              Villages:[{SceneItemId:1540000000,Areas:{'7':{GridIDs:[10],Unlocked:true,EnvironmentEffectItemID:0,EnvironmentEffectOrientation:'GridOrientation_Up'}}}],
              FloatingIslands:{},
              MissionSlots:{},
              QuestInfo:{},
              Keyholes:{}
            }
          };
          
          
          const root='http://127.0.0.1:4363',idx='dreamwishwand:world-editor:recovery:index:v1',prefix='dreamwishwand:world-editor:recovery:v1:';
          const browser=await chromium.launch({executablePath:process.env.CHROME_BIN,headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
          try{
           const context=await browser.newContext({viewport:{width:1440,height:1100}}),page=await context.newPage();const errors=[],unsafe=[];
           page.on('pageerror',e=>errors.push(String(e)));page.on('request',r=>{if(!r.url().startsWith(root+'/')||r.method()!=='GET')unsafe.push([r.method(),r.url()])});
           await page.goto(root+'/editor/world/',{waitUntil:'networkidle'});
           await page.locator('.platform-select select').selectOption('switch');
           await page.locator('.load-panel input[type="file"]').setInputFiles({name:'qa573-synthetic.json',mimeType:'application/json',buffer:Buffer.from(JSON.stringify(recoveryProfile))});
           await page.getByText(/DDV save loaded locally/).waitFor();await page.getByRole('button',{name:'Open in Canvas'}).first().click();await page.getByText(/Core-bound local draft authoring/).waitFor();
           await page.locator('g[data-editor-object]').first().click();
           const move=page.locator('.toolbar-actions').getByRole('button',{name:'Move right'});
           await move.click();
           const state=await page.evaluate(({idx,prefix})=>{const i=localStorage.getItem(idx),f=JSON.parse(i)[0],k=prefix+f;return {i,f,k,raw:localStorage.getItem(k)}},{idx,prefix});assert.ok(state.raw);
           const cases=[['corrupt','{',state.i,'WEP_RECOVERY_EXISTING_RECORD_INVALID'],['wrong-target',JSON.stringify({...JSON.parse(state.raw),target:{...JSON.parse(state.raw).target,gameVersion:'9.9.9'}}),state.i,'WEP_RECOVERY_EXISTING_TARGET_MISMATCH'],['duplicate-index',state.raw,JSON.stringify([state.f,state.f]),'WEP_RECOVERY_INDEX_INVALID'],['missing-indexed',null,state.i,'WEP_RECOVERY_INDEX_RECORD_MISSING']];
           for(const [name,raw,index,code] of cases){
            const before=await page.evaluate(({k,raw,idx,index,prefix})=>{if(raw===null)localStorage.removeItem(k);else localStorage.setItem(k,raw);localStorage.setItem(idx,index);localStorage.setItem(prefix+'b'.repeat(64),'unrelated-opaque');return [localStorage.getItem(k),localStorage.getItem(idx),localStorage.getItem(prefix+'b'.repeat(64))]},{k:state.k,raw,idx,index,prefix});
            const oldLabel=await page.locator('g[data-editor-object]').first().getAttribute('aria-label');
            await move.click();await page.locator('.recovery-status').filter({hasText:code}).waitFor();
            assert.deepEqual(await page.evaluate(({k,idx,prefix})=>[localStorage.getItem(k),localStorage.getItem(idx),localStorage.getItem(prefix+'b'.repeat(64))],{k:state.k,idx,prefix}),before,name);
            console.log('QA573_REAL_UI_DENY_UNCHANGED',name,code);
           }
           await page.evaluate(({state,idx})=>{localStorage.setItem(state.k,state.raw);localStorage.setItem(idx,state.i)},{state,idx});
           await move.click();await page.waitForFunction(({k,raw})=>localStorage.getItem(k)!==raw,{k:state.k,raw:state.raw});
           assert.equal(await page.evaluate(({idx,prefix})=>localStorage.getItem(prefix+'b'.repeat(64)),{idx,prefix}),'unrelated-opaque');
           // Independent real-browser API checks on actual localStorage, not a fake storage.
           const result=await page.evaluate(async({idx,prefix})=>{
            const m=await import('/src/lib/wep/world-editor-recovery.ts');
            const a='c'.repeat(64),b='d'.repeat(64),key=prefix+a,other=prefix+b;
            const t={platform:'switch',gameVersion:'1.25.0',profileSchemaVersion:624},input={sourceFingerprint:a,target:t,routeKey:'one',sessionSnapshot:{document:{objects:[]},undoStack:[],redoStack:[]},now:'2026-11-14T00:00:00Z'};
            const first=m.createRecoveryRecord(input);localStorage.setItem(key,JSON.stringify(first));localStorage.removeItem(idx);localStorage.setItem(other,'opaque');
            const r=m.saveRecoveryRoute(localStorage,{...input,routeKey:'two'});if(JSON.stringify(r.routes.one)!==JSON.stringify(first.routes.one)||localStorage.getItem(other)!=='opaque')throw Error('legacy preservation');
            const good=localStorage.getItem(key),goodIndex=localStorage.getItem(idx);
            for(const raw of [JSON.stringify([a,a]),JSON.stringify([1]),JSON.stringify(['x']),'{',JSON.stringify(Array.from({length:21},(_,i)=>i.toString(16).padStart(64,'0')))]){
             localStorage.setItem(idx,raw);let denied=false;try{m.saveRecoveryRoute(localStorage,input)}catch(e){denied=String(e).includes('INDEX_INVALID')}if(!denied||localStorage.getItem(key)!==good||localStorage.getItem(idx)!==raw)throw Error('index deny');
            }
            localStorage.setItem(idx,goodIndex);
            return {legacy:true,invalid:5};
           },{idx,prefix});assert.deepEqual(result,{legacy:true,invalid:5});
           assert.deepEqual(errors,[]);assert.deepEqual(unsafe,[]);console.log('QA573_REAL_UI_RECOVERY_4DENY_FRESH_SUCCESS_LEGACY_5INDEX_NEG_PASS');
           await context.close();
          }finally{await browser.close();}
          
          JS

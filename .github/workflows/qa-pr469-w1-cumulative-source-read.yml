name: 05 QR PR469 independent cumulative W1 Native source and Worker READ
on:
  push:
    branches: [qa/05qr-pr469-current-main-a9f-20261104]
  pull_request:
    paths:
      - 'tests/qa-05qr-pr469-w1-cumulative-native-source-read.test.mjs'
      - '.github/workflows/qa-pr469-w1-cumulative-source-read.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  current-main-independent:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Enforce exact PR469+PR451 composition, not sibling or product mutations
        run: |
          set -eu
          SOURCE=36402a3d6d968293928781201d9ace17b87875f6
          MAIN=a9f6793546bf372a5153dba8c838d3332ae75d7b
          test "$(git merge-base "$SOURCE" HEAD)" = "$SOURCE"
          test "$(git merge-base "$MAIN" "$SOURCE")" = "$MAIN"
          test "$(git diff --name-only "$MAIN" "$SOURCE" | wc -l | tr -d ' ')" = 3
          git diff --quiet "$SOURCE" HEAD -- src/ crates/ docs/ supabase/ static/ tests/01e-w1-native-v3-source-evidence.test.mjs
          for path in src/lib/ddv/timing/w1-native-v3-source-evidence.mjs tests/01e-w1-native-v3-source-evidence.test.mjs docs/core/01e-w1-native-v3-source-closure-20261104.md; do
            test "$(git rev-parse "$SOURCE:$path")" = "$(git rev-parse "HEAD:$path")"
          done
          test "$(git rev-parse "$MAIN:src/lib/timing/w1-worker-mandatory-readset.mjs")" = "$(git rev-parse "HEAD:src/lib/timing/w1-worker-mandatory-readset.mjs")"
          test "$(git rev-parse "$MAIN:src/lib/timing/local-worker-read-core.mjs")" = "$(git rev-parse "HEAD:src/lib/timing/local-worker-read-core.mjs")"
          test "$(git rev-parse "$MAIN:src/lib/ddv/core/save/local-save-session-bridge.mjs")" = "$(git rev-parse "HEAD:src/lib/ddv/core/save/local-save-session-bridge.mjs")"
          echo PR469_EXACT_MAIN_COMPOSED_SOURCE_GUARD_PASS
          echo PRIVATE_GENUINE_SAVE_V2=NOT_RUN
          echo NATIVE_V3=NOT_ACCEPTED
          echo ORIGINAL_REPLACEMENT_AND_EDITED_EXPORT=OFF
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm ci --no-audit --no-fund
      - name: Independent new-only registry-to-Worker capability and negative QA
        run: node --test tests/qa-05qr-pr469-w1-cumulative-native-source-read.test.mjs
      - name: Svelte/Type boundary regression guard
        run: npm run check

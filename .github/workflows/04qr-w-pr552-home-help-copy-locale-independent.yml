name: "04QR-W PR552 Stage1 Home eight-locale Help body independent actual visual"
on:
  pull_request:
    branches: ['web/stage1-home-copy-locale-20261105']
    paths:
      - '.github/workflows/04qr-w-pr552-home-help-copy-locale-independent.yml'
      - 'scripts/04qr-w-pr552-home-help-copy-locale-chromium.mjs'
      - 'tests/04qr-w-pr552-home-help-copy-locale-independent.test.mjs'
permissions:
  contents: read
jobs:
  home-eight-locale-source-independent:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm ci --no-audit --no-fund
      - name: Six owner Core and eight-locale Help BODY, not only title
        run: node --test tests/04qr-w-pr552-home-help-copy-locale-independent.test.mjs
      - name: Chrome QA syntax
        run: node --check scripts/04qr-w-pr552-home-help-copy-locale-chromium.mjs
  home-real-browser-eight-locale:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm ci --no-audit --no-fund
      - run: npm install --no-save --package-lock=false playwright-core@1.55.0
      - name: Real system Chrome binary
        id: chrome
        run: |
          set -euo pipefail
          BIN="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$BIN"
          echo "path=$BIN" >> "$GITHUB_OUTPUT"
      - name: Disposable Home exactly on localhost
        run: |
          set -euo pipefail
          BASE_PATH='' npm run dev -- --host 127.0.0.1 --port 4298 >/tmp/04qr-w-pr552-home.log 2>&1 &
          for i in $(seq 1 65); do
            if curl --fail --silent http://127.0.0.1:4298/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/04qr-w-pr552-home.log
          exit 1
      - name: Actual 8-locale six Core plus Help BODY, 320/zoom200 and no unsafe network
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.path }}
          QR552_URL: http://127.0.0.1:4298/
        run: |
          set -euo pipefail
          test -z "${WEP_PRIVATE_P1G_PATH:-}"
          test -z "${WEP_PRIVATE_LOCAL_ONLY_ACK:-}"
          test -z "${WEP_PRIVATE_EXTERNAL_BUILD_CONFIRMED:-}"
          node scripts/04qr-w-pr552-home-help-copy-locale-chromium.mjs

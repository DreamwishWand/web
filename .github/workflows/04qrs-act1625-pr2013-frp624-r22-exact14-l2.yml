name: "04 QR-S ACT1625 FRP624 exact14 R22/Cargo Security L2 (QA ONLY)"
on:
  pull_request:
    paths:
      - ".github/workflows/04qrs-act1625-pr2013-frp624-r22-exact14-l2.yml"
permissions:
  contents: read
jobs:
  focus:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 0bf74d29c531c4879bd0932610b70ff69f1c08fb
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Fetch immutable original FRP624 Source (not any QA-only changes)
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e 3304dcc6270d9551ca94df787b580d725c2ef88f^{commit} || git fetch --no-tags origin 3304dcc6270d9551ca94df787b580d725c2ef88f
      - name: Independent actual Git exact14 positive/negative R22 Cargo scope refutation
        shell: bash
        run: |
          set -euo pipefail
          cat > qa-frp624-r22-exact14.mjs <<'NODE'
          import assert from 'node:assert/strict';
          import {execFileSync} from 'node:child_process';
          import {mkdtempSync,rmSync,writeFileSync} from 'node:fs';
          import {tmpdir} from 'node:os';
          import {join} from 'node:path';
          import {runInNewContext} from 'node:vm';

          const cwd=process.cwd(),
            main='83813a6b0b977758f8fd9def50f9feaa242881c1',
            gate='0bf74d29c531c4879bd0932610b70ff69f1c08fb',
            source='3304dcc6270d9551ca94df787b580d725c2ef88f',
            gatePath='scripts/wasm-distribution/r22-accepted-rust-scope.mjs',
            cfgPath='scripts/wasm-distribution/protected-release-inputs.json',
            preGate='e614ad232a11faff21f8dbef7c7943d1d54369f5',
            postGate='71c8cb77b54dfd1a2a081005c62c852e9201ef25',
            baseCore='82d9500795262b9475160285a2778333d91603ea',
            targetCore='b23f5146efd66765e96c58d7efa6eb351d1e5da7',
            cargoBefore='d66296a76c6c380fb4475c70b20e3ebb00adc7eb',
            cargoAfter='cfd550b690e42e93a48b913457c35a5ea0cb7bc7',
            configBefore='f70ddb4e88900d12fa426519ea7315c2e0812ba2',
            configAfter='865aa54e99d11029250478ba6583bdec226dfa6d',
            expectedTree='e8e7f4187a0e77c0389487df9ab7e834395d6dba';
          const temp=mkdtempSync(join(tmpdir(),'qrs-frp624-r22-'));
          const env={...process.env,GIT_INDEX_FILE:join(temp,'index'),GIT_NO_REPLACE_OBJECTS:'1',
            GIT_AUTHOR_NAME:'QA isolated Git',GIT_AUTHOR_EMAIL:'qa@example.invalid',
            GIT_COMMITTER_NAME:'QA isolated Git',GIT_COMMITTER_EMAIL:'qa@example.invalid'};
          const git=(...args)=>execFileSync('git',args,{cwd,env,encoding:'utf8',maxBuffer:16*1024*1024}).trim();
          const raw=(ref,path)=>execFileSync('git',['show',ref+':'+path],{cwd,env,encoding:'utf8',maxBuffer:16*1024*1024});
          const entry=(ref,path)=>{
            const line=git('ls-tree',ref,'--',path);
            if(!line)return null;
            const match=/^(100644|100755) blob ([0-9a-f]{40})\t(.+)$/.exec(line);
            assert.ok(match&&match[3]===path,'Git exact path/mode '+path);
            return {mode:match[1],blob:match[2]};
          };
          const apply=(path,e)=>e
            ?git('update-index','--add','--cacheinfo',e.mode,e.blob,path)
            :git('update-index','--force-remove','--',path);
          const project=(base,pairs)=>{
            git('read-tree',base);
            for(const [path,e] of pairs)apply(path,e);
            const tree=git('write-tree');
            return {tree,commit:git('commit-tree',tree,'-p',base,'-m','QA-only exact14 isolated candidate')};
          };
          let pos=0,neg=0,verifyAcceptedRustScope;
          const reject=(base,head,label)=>{
            assert.throws(()=>verifyAcceptedRustScope(cwd,base,head),/R22_ACCEPTED_SCOPE|SELECTION|error|Error/i,label);
            neg++;
          };
          try{
            ({verifyAcceptedRustScope}=await import('file://'+cwd+'/'+gatePath));
            assert.equal(git('rev-parse','HEAD'),gate);
            assert.equal(git('rev-parse',gate+'^'),main);
            assert.equal(git('merge-base',main,source),main,'accepted Source descends from exact protected main');
            assert.deepEqual(git('diff','--name-only',main,gate).split('\n'),[gatePath]);
            assert.equal(entry(main,gatePath)?.blob,preGate);
            assert.equal(entry(gate,gatePath)?.blob,postGate);
            pos++;

            const previous=raw(main,gatePath),current=raw(gate,gatePath);
            const decl='const switch624FrpMain838Exact14Entries=';
            const begin=current.indexOf(decl),profilesEnd=current.indexOf('const gatePaths=',begin);
            const pairBegin=current.indexOf(" if(baseCore==='"+baseCore+"')",profilesEnd);
            const pairEnd=current.indexOf(" deny('BASE_CORE_TREE');",pairBegin);
            assert.ok(begin>0&&profilesEnd>begin&&pairBegin>profilesEnd&&pairEnd>pairBegin);
            assert.equal(current.slice(0,begin)+current.slice(profilesEnd,pairBegin)+current.slice(pairEnd),previous,
              'no changes to pre-existing R22 selector, issuer, rejected unknowns or protected checks');
            pos++;

            const open=current.indexOf('[',begin),close=current.indexOf('];',open);
            assert.ok(open>begin&&close>open);
            const pins=JSON.parse(JSON.stringify(runInNewContext('('+current.slice(open,close+1)+')')));
            assert.equal(pins.length,14);
            assert.equal(new Set(pins.map(x=>x.path)).size,14);
            assert.equal(pins.filter(x=>x.before===null).length,5);
            assert.equal(pins.filter(x=>x.before!==null).length,9);
            assert.equal(pins.filter(x=>x.path===cfgPath).length,1);
            assert.deepEqual(git('diff','--name-only',main,source).split('\n').sort(),pins.filter(x=>x.path!==cfgPath).map(x=>x.path).sort());
            pos++;

            const beforeTxt=raw(main,cfgPath),before=JSON.parse(beforeTxt);
            assert.equal(entry(main,cfgPath)?.blob,configBefore);
            assert.equal(before.cargoTomlGitBlob,cargoBefore);
            assert.equal(beforeTxt.split(cargoBefore).length-1,1);
            const amended=beforeTxt.replace(cargoBefore,cargoAfter);
            const futureFile=join(temp,'new-release-inputs.json');writeFileSync(futureFile,amended);
            assert.equal(git('hash-object','-w',futureFile),configAfter);
            const after=JSON.parse(amended);
            assert.deepEqual(after,{...before,cargoTomlGitBlob:cargoAfter});
            assert.deepEqual(after.features,['indexed-read','worker-wasm']);
            assert.equal(after.defaultFeatures,false);
            assert.equal(after.writerEnabled,false);
            assert.equal(after.productConsumerEnabled,false);
            assert.equal(after.approvedCargoLockSha256,before.approvedCargoLockSha256);
            pos++;

            for(const p of pins){
              assert.deepEqual(entry(gate,p.path),p.before,'exact reviewed preimage '+p.path);
              if(p.path===cfgPath)assert.deepEqual(p.after,{mode:'100644',blob:configAfter});
              else assert.deepEqual(entry(source,p.path),p.after,'immutable Source post Git blob '+p.path);
              assert.equal(p.after.mode,'100644');
              assert.equal(git('cat-file','-t',p.after.blob),'blob');
              pos++;
            }
            assert.equal(git('rev-parse',gate+':crates/ddv-save-core'),baseCore);
            assert.equal(git('rev-parse',source+':crates/ddv-save-core'),targetCore);
            const projected=project(gate,pins.map(x=>[x.path,x.after]));
            const preGateProjected=project(main,pins.map(x=>[x.path,x.after]));
            console.log('QRS_ACT1625_PROJECTED_TREE_DIAGNOSTIC',JSON.stringify({
              documentedExpected:expectedTree,preGateSourceTree:preGateProjected.tree,
              actualGateThenExact14Tree:projected.tree,
              expectedMatchedPreGate:expectedTree===preGateProjected.tree,
              expectedMatchedActual:expectedTree===projected.tree
            }));
            const projectedIdentityMismatch=projected.tree!==expectedTree;
            assert.equal(preGateProjected.tree,expectedTree,'reproduce source pre-Gate projection forensics');
            assert.equal(git('rev-parse',projected.commit+':crates/ddv-save-core'),targetCore);
            const receipt=verifyAcceptedRustScope(cwd,gate,projected.commit);
            assert.equal(receipt.entryCount,14);
            assert.equal(receipt.projectedProductTree,expectedTree,'Source Gate exposes pre-Gate metadata even though actual candidate is post-Gate');
            assert.equal(receipt.sourcePr,2012);
            assert.equal(receipt.schema,624);
            assert.equal(receipt.exactSwitchBid,'52BD625D9B4E0053');
            assert.equal(receipt.mergeAuthorized,false);
            assert.equal(receipt.writerAuthorized,false);
            assert.equal(receipt.opOn,false);
            pos++;

            const reverse=project(projected.commit,pins.map(x=>[x.path,x.before]));
            assert.equal(reverse.tree,git('rev-parse',gate+'^{tree}'));
            pos++;

            for(const p of pins){
              reject(gate,project(gate,pins.filter(x=>x.path!==p.path).map(x=>[x.path,x.after])).commit,'missing '+p.path);
              reject(gate,project(gate,pins.map(x=>[x.path,x.path===p.path?{mode:'100755',blob:x.after.blob}:x.after])).commit,'wrong mode '+p.path);
              reject(gate,project(gate,pins.map(x=>[x.path,x.path===p.path?{mode:'100644',blob:x.before?.blob??preGate}:x.after])).commit,'wrong blob '+p.path);
            }
            const extra=[
              '.github/workflows/pages.yml',
              'scripts/int-protected-ci-gate.mjs',
              'scripts/wasm-distribution/verify-protected-release.mjs',
              'scripts/wasm-distribution/approved-Cargo.lock',
              'scripts/int-selection-preflight.mjs',
              gatePath,
              'src/lib/ddv/core/save/product-scoped-placement-release.mjs',
              'unapproved-frp624-build.txt'];
            for(const path of extra){
              reject(gate,project(gate,[...pins.map(x=>[x.path,x.after]),[path,{mode:'100644',blob:preGate}]]).commit,'unauthorized extra '+path);
            }
            reject(main,projected.commit,'R22 profile not already on protected base');
            reject(main,source,'old Source lacks protected config');
            reject(main,gate,'Gate itself cannot authorize product');
            reject(gate,gate,'noop cannot mint release permission');
            reject(projected.commit,gate,'rollback reverse pair');
            for(const path of ['.github/workflows/pages.yml',
              'scripts/int-protected-ci-gate.mjs',
              'scripts/wasm-distribution/approved-Cargo.lock',
              'scripts/wasm-distribution/verify-protected-release.mjs',
              'scripts/int-selection-preflight.mjs']){
              assert.deepEqual(entry(main,path),entry(gate,path),'protected Auth/Lock/issuer SHA changed');
              pos++;
            }
            const beforePairs=[...previous.matchAll(/if\(baseCore==='([0-9a-f]{40})'\)/g)].map(x=>x[1]);
            const afterPairs=[...current.matchAll(/if\(baseCore==='([0-9a-f]{40})'\)/g)].map(x=>x[1]);
            assert.deepEqual(afterPairs.filter(x=>x!==baseCore),beforePairs);
            assert.equal(afterPairs.filter(x=>x===baseCore).length,1);
            assert.equal(afterPairs.length,beforePairs.length+1);
            pos++;
            if(projectedIdentityMismatch){
              console.error('QRS_ACT1625_FRP624_GATE_PRODUCT_TREE_IDENTITY_TRUE_RED',JSON.stringify({
                documentedTree:expectedTree,
                preGateSourceTree:preGateProjected.tree,
                actualPostGateExact14Tree:projected.tree,
                exactScopePositiveAndAdversarialChecksPassed:true,
                publicWriter:false,actualSignedPages:false
              }));
              throw Error('FRP624_R22_PRODUCT_TREE_IDENTITY_TRUE_RED');
            }
            console.log('QRS_ACT1625_FRP624_EXACT14_R22_CARGO_SECURITY_L2_PASS',JSON.stringify({
              positive:pos,negative:neg,pins:14,sourceLeafCount:13,
              oldProfiles:beforePairs.length,corePairVerified:true,
              protectedCargoOnlyOneField:true,unchangedIssuerLockPublicAssets:true,
              exactSchema624AndBidMetadata:true,actualBuildRuntimeNotVerified:true,
              realOriginalSaveV2:false,publicWriter:false,opOn:false,
              actualSignedPages:false}));
          }finally{rmSync(temp,{recursive:true,force:true});}
          NODE
          node qa-frp624-r22-exact14.mjs

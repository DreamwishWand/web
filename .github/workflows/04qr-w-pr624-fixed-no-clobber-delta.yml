name: "04 QR-W PR624 385 no-clobber fixed-HEAD delta"
on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/04qr-w-pr624-fixed-no-clobber-delta.yml"
      - "scripts/04qr-w-pr624-fixed-no-clobber-delta.py"
permissions:
  contents: read
jobs:
  independent-report-target-no-clobber:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install real Pillow and libwebp, never use actual game art
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input Pillow==11.3.0
          python -c "from PIL import features; assert features.check('webp')"
      - name: Fixed original Source-only output-path negative, exclusive and race
        shell: bash
        run: |
          set -euo pipefail
          test -z "${WEP_PRIVATE_P1G_PATH:-}"
          test -z "${WEP_PRIVATE_LOCAL_ONLY_ACK:-}"
          test -z "${WEP_PRIVATE_EXTERNAL_BUILD_CONFIRMED:-}"
          python -m py_compile scripts/04qr-w-pr624-fixed-no-clobber-delta.py
          python scripts/04qr-w-pr624-fixed-no-clobber-delta.py

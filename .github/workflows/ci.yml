name: CI

on:
  push:
    branches:
      - 'dev/**'
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Type and component checks
        run: npm run check
      - name: Contract tests
        run: npm test
      - name: Static build
        env:
          BASE_PATH: /web
        run: npm run build

name: CI

on:
  push:
    branches:
      - main
      - 'dev/**'
      - 'integration/**'
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.1.4
      - name: Edge Function type checks
        run: deno check --node-modules-dir=auto supabase/functions/*/index.ts
      - name: Type and component checks
        run: npm run check
      - name: Shared web accessibility/localization gates
        run: npm run verify:web-foundation
      - name: Canonical baseline integrity
        run: npm run verify:canonical
      - name: Community operations contract
        run: npm run verify:community-ops
      - name: Integrated production tree preflight
        run: npm run verify:community-integrated-tree
      - name: Contract tests
        run: npm test
      - name: Static build
        env:
          BASE_PATH: /web
        run: npm run build

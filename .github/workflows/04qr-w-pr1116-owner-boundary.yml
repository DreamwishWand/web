name: 04 QR-W PR1116 independent Owner CI boundary
on:
  pull_request:
    paths:
      - '.github/workflows/04qr-w-pr1116-owner-boundary.yml'
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact original nine and independent real HTTP stale copy boundary
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess as s,hashlib
          B='514709a1ef554dc25bab488ea205405d8dbea333';H='21e1506e3df766a712b6c16c21c2aff98f2a49de';git=lambda *a:s.check_output(['git',*a])
          def tree(ref):
           return {p.decode():meta.decode() for e in git('ls-tree','-r','-z',ref).split(b'\0') if e for meta,p in [e.split(b'\t',1)]}
          b,h,q=tree(B),tree(H),tree('HEAD')
          removed=["tools/owner-local-steam-v1/index.html","tools/owner-local-steam-v1/page.mjs","tools/owner-local-steam-v1/dev-read.html","tools/owner-local-steam-v1/dev-read-page.mjs"]
          pins={".github/workflows/01a-stageh-dev-metadata-read.yml":"98da4bd917314685b12ee4802097a60117044757","tests/owner-local-steam-v1-ci-boundary.test.mjs":"495d4bcac07193eee2123a5b35122c8988ccff15","tests/stage-g/page.mjs":"229f8b9601fe322b608d727d4d08577cb47a7f13","tests/stage-h/page.mjs":"84d282967131287feac4b2c9b24cc9e3e8aaafb3","tools/owner-local-steam-v1/server.mjs":"1a6cf6fafb0dc3111567bbb50a78577de527496d"}
          added='tests/owner-local-steam-v1-ci-boundary.test.mjs'
          assert set(b)-set(h)==set(removed)
          assert set(h)-set(b)=={added}
          assert {p for p in set(b)&set(h) if b[p]!=h[p]}==set(pins)-{added}
          assert git('merge-base','HEAD',H).decode().strip()==H
          assert set(q)-set(h)=={'.github/workflows/04qr-w-pr1116-owner-boundary.yml'} and all(q[p]==h[p] for p in h)
          for p,v in pins.items():assert h[p].endswith(v)
          for name,v in {"index.html":"fd5d749ada7f9928419b270e28b7d3a9b5133604","page.mjs":"2a8f4e573f69d0d75c716aa2814cfc5b3f0b37b9","dev-read.html":"e0de6b76cfdae45b797f955ea41abeb30948783a","dev-read-page.mjs":"db5cb84d327e5702e861820a02ce7312d4d062a3","server.mjs":"e29a9e677d9cbaaeafd8e937b126223da83ed545","worker.mjs":"1aaebb9eb4044649d1334609fa9646120b1853b4","dev-read.worker.mjs":"f4d23402a362057efe8a4af0a3ae0a4950afa573","worker-core.mjs":"42b717455473cf69c98213dec867571c4a70ede7","attestation.mjs":"854bdf1ce201ed4431165c4f219f730263dab8b7"}.items():assert b['tools/owner-local-steam-v1/'+name].endswith(v)
          for name in ['worker.mjs','dev-read.worker.mjs','worker-core.mjs','attestation.mjs']:
           p='tools/owner-local-steam-v1/'+name;assert b[p]==h[p]
          print('QA564_EXACT4DEL4MOD1ADD_ALL_RETAINED_BLOBS_MODES_PASS',len(b),len(h))
          # These names may be in tests or historical docs; classify instead of assuming no reference.
          for p in removed:
           r=s.run(['git','grep','-I','-l','-F','-e',p,H,'--'],capture_output=True)
           assert r.returncode in [0,1]
           print('QA564_FULL_PATH_REFERENCES',p,r.stdout.decode().splitlines())
          
          PY
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {request} from 'node:http';
          import {writeFile,unlink,readFile} from 'node:fs/promises';
          import {spawnSync} from 'node:child_process';
          import {startOwnerLocalV1Server as start} from './tools/owner-local-steam-v1/server.mjs';
          const dir='tools/owner-local-steam-v1/',prefix='/'+dir;
          const names=['index.html','page.mjs','dev-read.html','dev-read-page.mjs'];
          for(const opts of [undefined,{}, {ciFixture:false},{ciFixture:1},{ciFixture:'true'}])await assert.rejects(start(opts),/OWNER_LOCAL_CI_FIXTURE_REQUIRED/);
          const cli=spawnSync(process.execPath,[dir+'server.mjs'],{encoding:'utf8'});assert.equal(cli.status,12);assert.equal(cli.stdout,'');assert.match(cli.stderr,/OWNER_LOCAL_CI_FIXTURE_REQUIRED/);
          for(const n of names)await writeFile(dir+n,'QA564_SYNTHETIC_STALE_LOCAL_FILE_NOT_PRIVATE',{flag:'wx'});
          const {server,port}=await start({ciFixture:true});
          const req=(path,method='GET',host='127.0.0.1:'+port)=>new Promise((ok,no)=>{const r=request({hostname:'127.0.0.1',port,path,method,headers:{host}},res=>{const xs=[];res.on('data',x=>xs.push(x));res.on('end',()=>ok({status:res.statusCode,headers:res.headers,body:Buffer.concat(xs)}))});r.on('error',no);r.end()});
          try{
           for(const n of names)for(const method of ['GET','HEAD'])for(const p of [prefix+n,prefix+n+'?cache=1',prefix+'%2e/'+n,prefix+n.replaceAll('.','%2e')]){
           const r=await req(p,method);assert.equal(r.status,403,p);assert.equal(r.body.length,0);
           }
           for(const method of ['POST','PUT','PATCH','DELETE','OPTIONS'])assert.equal((await req(prefix+'worker.mjs',method)).status,405);
           for(const host of ['localhost:'+port,'127.0.0.1','evil.invalid','127.0.0.1.evil.invalid:'+port])assert.equal((await req(prefix+'worker.mjs','GET',host)).status,403);
           for(const p of ['/package.json','/tests/stage-f/fixtures/owner.p1g','/tools/owner-local-steam-v1/worker.mjs.bak','/tests/stage-g/unknown.html','/src/lib/ddv/core/save/unknown.js','/tools/owner-local-steam-v1/%2e%2e/%2e%2e/package.json'])assert.equal((await req(p)).status,403,p);
           assert.equal((await req(prefix+'%ZZ')).status,400);
           for(const n of ['worker.mjs','dev-read.worker.mjs','worker-core.mjs','attestation.mjs']){
           const r=await req(prefix+n);assert.equal(r.status,200);assert.deepEqual(r.body,await readFile(dir+n));assert.match(r.headers['content-security-policy'],/worker-src 'self'/);assert.match(r.headers['content-security-policy'],/form-action 'none'/);assert.equal(r.headers['cache-control'],'no-store');assert.equal(r.headers['cross-origin-resource-policy'],'same-origin');
           }
           console.log('QA564_REAL_HTTP_STALE32_METHOD5_HOST4_PATH7_SHARED4_CLI_DENY_PASS');
          }finally{await new Promise(ok=>server.close(ok));for(const n of names)await unlink(dir+n)}
          
          JS
          test -z "$(git status --porcelain)"
      - name: Compare actual static builds before and after deletion (no upload)
        env:
          BASE_PATH: /web
          VITE_SUPABASE_URL: ${{ vars.DREAMWISH_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.DREAMWISH_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          B=514709a1ef554dc25bab488ea205405d8dbea333
          H=21e1506e3df766a712b6c16c21c2aff98f2a49de
          temp="$(mktemp -d)"
          trap 'rm -rf "$temp"' EXIT
          git checkout --detach "$B"
          npm ci --no-audit --no-fund
          # Same test-only explicit version for BOTH builds. The production
          # config leaves Kit's generated build version unspecified.
          grep -R -n 'Date.now().toString()' node_modules/@sveltejs/kit/src/core/config | head -5
          pin_version() {
            node --input-type=module - <<'JS'
            import {readFileSync,writeFileSync} from 'node:fs';
            import assert from 'node:assert/strict';
            const p='svelte.config.js',s=readFileSync(p,'utf8');
            assert.equal(s.split('  kit: {').length,2);
            assert.ok(!s.includes('version:'));
            writeFileSync(p,s.replace('  kit: {','  kit: {\n    version: { name: "qrw1116-fixed-build-version" },'));
          JS
          }
          pin_version
          npm run build > "$temp/base.log" 2>&1 || { tail -40 "$temp/base.log"; exit 1; }
          mv build "$temp/base"
          rm -rf .svelte-kit
          git restore -- svelte.config.js
          git checkout --detach "$H"
          pin_version
          npm run build > "$temp/head.log" 2>&1 || { tail -40 "$temp/head.log"; exit 1; }
          python3 - "$temp/base" build <<'PY'
          import pathlib,sys,hashlib
          a,b=map(pathlib.Path,sys.argv[1:])
          def inv(d):
            return {p.relative_to(d).as_posix():hashlib.sha256(p.read_bytes()).hexdigest() for p in d.rglob('*') if p.is_file()}
          x,y=inv(a),inv(b)
          print('QRW1116_STATIC_COUNTS',len(x),len(y),'html',sum(p.endswith('.html') for p in y))
          print('QRW1116_STATIC_PATH_DELTA',sorted(set(x)-set(y)),sorted(set(y)-set(x)))
          assert set(x)==set(y)
          diff=[p for p in x if x[p]!=y[p]]
          print('QRW1116_STATIC_BYTE_DELTA',len(diff),diff[:30])
          assert not diff, diff[:30]
          stems=['/tools/owner-local-steam-v1/index.html','/tools/owner-local-steam-v1/dev-read.html','/tools/owner-local-steam-v1/dev-read-page.mjs','/tools/owner-local-steam-v1/page.mjs']
          for p in b.rglob('*'):
            if p.is_file():
              data=p.read_bytes()
              assert not any(s in str(p) or s.encode() in data for s in stems),p
          assert all((b/p).is_file() for p in ['index.html','editor/index.html','gallery/dreamsnaps/index.html','dreamsnaps/index.html','community-ops/index.html','404.html'])
          print('QRW1116_ACTUAL_BASE_HEAD_STATIC_SAME_PATHS_NO_DELETED_DOC_REFERENCES_PASS')
          PY
          git restore -- svelte.config.js
          test -z "$(git diff --name-only)"

name: ACT1184 fixed SR03 private-lab executable transport (NO SAVE)
on:
  pull_request:
    paths:
      - '.github/workflows/sr03-private-target-lab-build.yml'
permissions:
  contents: read
jobs:
  build-only:
    if: github.head_ref == '01b/act1184-private-lab-fixed-binder' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b03b4090b153ae9ca1fb8ea7680e81dbad23394d
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Fixed source and approved Lock; add ignored transport-only test in temporary checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = b03b4090b153ae9ca1fb8ea7680e81dbad23394d
          p=crates/ddv-save-core/src/sr03_product_target.rs
          test "$(git hash-object "$p")" = bfa089e55816a8e28ca0b841eab94182c7fb6abe
          test "$(git hash-object scripts/wasm-distribution/approved-Cargo.lock)" = b667b42cfef2032c2925be7b2aa9b7142bff4b52
          cp scripts/wasm-distribution/approved-Cargo.lock crates/ddv-save-core/Cargo.lock
          cat >> "$p" <<'RS'

          #[cfg(all(test,not(target_arch="wasm32")))]
          mod private_lab {
              use super::*;
              use std::{env,fs};
              #[test]
              #[ignore="local authorized decoded input only; never executed in CI"]
              fn genuine_sr03_current_target(){
                  let path=env::var("WAND_SR03_PRIVATE_DECODED").expect("local input path");
                  let expect_path=env::var("WAND_SR03_PRIVATE_EXPECT").expect("local expected receipt path");
                  let bytes=fs::read(&path).expect("local input");
                  let expected:Value=serde_json::from_slice(&fs::read(&expect_path).expect("local receipt")).expect("local receipt JSON");
                  let num=|k:&str|expected[k].as_u64().and_then(|v|u32::try_from(v).ok()).expect("expected uint");
                  assert_eq!(hex(&sha(&bytes)),expected["decodedSha"].as_str().expect("expected decoded SHA"));
                  let mut s=ProductSession::open_decoded_readonly(bytes,crate::BuildIdentity{
                      platform:Platform::SteamWindows,build_kind:BuildKind::SteamFullVersion,
                      build_id:EXACT_STEAM.into(),schema:626,externally_attested:true}).expect("strict actual open");
                  // Existing native test harness binding; not a browser or signed route claim.
                  s.worker_bound=true;
                  let before=s.receipt().expect("receipt");
                  let e=WorkerEnvelope{contract:PRODUCT_WORKER_CONTRACT,session_id:before.session_id,
                      expected_revision:before.revision,expected_index_generation:before.index_generation,
                      expected_decoded_sha256:before.decoded_sha256,action:WorkerAction::ReadDomain};
                  let t=s.mint_sr03_target(e,num("grid"),num("keep"),num("moved")).expect("actual fixed Binder target");
                  let actual=json!({"decodedSha":hex(&before.decoded_sha256),"grid":t.grid,
                      "keep":t.local.keep,"moved":t.local.moved,"next":t.local.next,
                      "stock":t.stock,"pairs":t.pairs,
                      "rootSha":hex(&t.root_sha),"gridSha":hex(&t.grid_sha),
                      "keepSha":hex(&t.keep_sha),"movedSha":hex(&t.moved_sha),
                      "counterSha":hex(&t.counter_sha),"stockSha":hex(&t.stock_sha),
                      "housesSha":hex(&t.houses_sha)});
                  assert_eq!(actual,expected,"actual exact target receipt");
                  assert_eq!(s.receipt().expect("read-only receipt"),before);
                  assert_eq!(hex(&sha(&fs::read(&path).expect("unchanged local input"))),expected["decodedSha"].as_str().unwrap());
                  println!("SR03_PRIVATE_TARGET_ACTUAL_PASS {}",actual);
              }
          }
          RS
          # The only tracked workspace delta is the ignored transport harness.
          test "$(git diff --name-only)" = "$p"
          cargo test --locked --manifest-path crates/ddv-save-core/Cargo.toml --features product-amount-scoped --lib --no-run --message-format=json > "$RUNNER_TEMP/sr03-build.jsonl"
          mkdir -p "$RUNNER_TEMP/sr03-lab"
          python3 - "$RUNNER_TEMP" <<'PY'
          import json, pathlib, shutil, sys, hashlib, subprocess
          p=pathlib.Path(sys.argv[1]); a=[json.loads(l) for l in (p/'sr03-build.jsonl').read_text().splitlines()]
          ex=[v['executable'] for v in a if v.get('reason')=='compiler-artifact' and v.get('executable') and v.get('profile',{}).get('test') and v.get('target',{}).get('name') in ('ddv_save_core','ddv-save-core')]
          assert len(ex)==1, len(ex)
          out=p/'sr03-lab'; exe=out/'sr03-private-target-test';shutil.copy2(ex[0],exe)
          h=lambda q:hashlib.sha256(pathlib.Path(q).read_bytes()).hexdigest()
          m={'source':'b03b4090b153ae9ca1fb8ea7680e81dbad23394d','binder':'bfa089e55816a8e28ca0b841eab94182c7fb6abe','feature':'product-amount-scoped','lockGit':'b667b42cfef2032c2925be7b2aa9b7142bff4b52','lockSha256':h('crates/ddv-save-core/Cargo.lock'),'harnessSha256':h('crates/ddv-save-core/src/sr03_product_target.rs'),'executableSha256':h(exe),'compiler':subprocess.check_output(['rustc','-Vv'],text=True),'purpose':'build-only local ignored test; no actual save in CI'}
          (out/'manifest.json').write_text(json.dumps(m,sort_keys=True,separators=(',',':'))+'\n')
          print('SR03_LAB_BUILD_ONLY',m['source'],m['executableSha256'],m['lockSha256'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: sr03-fixed-private-target-test
          path: ${{ runner.temp }}/sr03-lab/
          if-no-files-found: error
          retention-days: 1

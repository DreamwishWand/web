name: 03 COMM X05 Source153 NEW-ONLY Owner Authority 2PG
on:
  push:
    branches: ['feature/03comm-x05-source153-owner-authority-projection-20261028']
  pull_request:
    branches: ['feature/03comm-x05-source152-first-work-20261028']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source153-newonly:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DDVRE_PRIVACY_ISOLATED_LOCAL: CONFIRMED
      SUPABASE_ACCESS_TOKEN: ''
      DATABASE_URL: ''
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact frozen Source152 ancestry and new-only SQL provenance
        run: |
          set -euo pipefail
          test -z "$SUPABASE_ACCESS_TOKEN" && test -z "$DATABASE_URL"
          git merge-base --is-ancestor 96f92a00e8a0c34983026b602c39557f651f8c47 HEAD
          test "$(git hash-object supabase/migrations/20261028000050_x05_first_work_media_bootstrap_v1.sql)" = cd297f48111afbb315651c6cb7e911afb1bcc03d
          test -z "$(git diff --name-only 96f92a00e8a0c34983026b602c39557f651f8c47 HEAD -- supabase/migrations/202609* supabase/migrations/202610030* supabase/migrations/202610250* supabase/migrations/202610270* supabase/migrations/20261028000000* supabase/migrations/20261028000010* supabase/migrations/20261028000020* supabase/migrations/20261028000030* supabase/migrations/20261028000040* supabase/migrations/20261028000050* supabase/functions/community-media supabase/functions/community-public-query supabase/functions/community-public-media src)"
          python3 - <<'PY'
          from pathlib import Path
          files=sorted(x.name for x in Path('supabase/migrations').glob('*.sql'))
          assert len(files)==153,len(files)
          assert files[-1]=='20261028000060_x05_authoritative_owner_projection_v2.sql'
          print('COMM153_FROZEN_SOURCE152_AND_153_SCHEMA_PASS')
          PY
          node --test tests/comm-x05-source153-owner-authority.test.mjs
      - uses: supabase/setup-cli@v1
        with:
          version: 2.81.3
      - name: Local clean FULL153 migrations without Edge / no external endpoints
        run: |
          set -euo pipefail
          printf 'project_id = "ddvre_comm153_owner_authority_disposable"\n' | cat - supabase/config.toml > /tmp/comm153-config.toml
          mv /tmp/comm153-config.toml supabase/config.toml
          timeout 1500s supabase start -x edge-runtime --debug > /tmp/comm153-start.log 2>&1 || { tail -130 /tmp/comm153-start.log; exit 1; }
          echo COMM153_CLEAN_FULL153_SCHEMA_PASS
      - name: Install isolated Python PG client
        run: python3 -m pip install --quiet 'psycopg[binary]==3.2.10'
      - name: SOURCE153 ONLY independent two actual PG roles/consent/scope/hold/incident negatives
        run: |
          set -euo pipefail
          python3 tests/comm-x05-source153-owner-authority-two-pg.py 2>&1 | tee /tmp/comm153-newonly.log
          grep -q COMM153_FULL153_SOURCE_LOCAL_COMPLETE /tmp/comm153-newonly.log
      - name: Evidence only, disposable synthetic fixture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: comm153-newonly-synthetic-pg-evidence
          path: /tmp/comm153-newonly.log
          if-no-files-found: warn
      - name: Diagnostic only on failure
        if: failure()
        run: tail -130 /tmp/comm153-start.log || true

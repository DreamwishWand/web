name: ACT1395/1403 fixed FD01 FE01 private-lab executable transport (NO SAVE)
on:
  pull_request:
    paths:
      - '.github/workflows/fd01-fe01-private-target-lab-build.yml'
permissions:
  contents: read
jobs:
  build-only:
    if: github.head_ref == '01b/fd01-fe01-private-target-lab' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 280731995de91740bb335ccacd92a6690c5f2472
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Fixed source and approved Lock; add ignored transport-only test in temporary checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 280731995de91740bb335ccacd92a6690c5f2472
          p=crates/ddv-save-core/src/fence_product_target.rs
          test "$(git hash-object "$p")" = 6b98fb7463252b71bd3a8d151f266e235b1bb6aa
          test "$(git hash-object crates/ddv-save-core/src/sr03_installed_geometry.rs)" = 22c18d025f45e972371bee3271404f0361bc0932
          test "$(git hash-object crates/ddv-save-core/src/fence_product_geometry.rs)" = 71957aae82a384ec17f0f36667a31fd2c0915151
          test "$(git hash-object scripts/wasm-distribution/approved-Cargo.lock)" = b667b42cfef2032c2925be7b2aa9b7142bff4b52
          cp scripts/wasm-distribution/approved-Cargo.lock crates/ddv-save-core/Cargo.lock
          cat >> "$p" <<'RS'

          #[cfg(all(test,not(target_arch="wasm32")))]
          mod private_fdfe_lab {
              use super::*;
              use std::{env,fs};
              fn hex32(v:&[u8;32])->String{v.iter().map(|x|format!("{x:02x}")).collect()}
              fn num(v:&Value)->u32{v.as_u64().and_then(|n|u32::try_from(n).ok()).unwrap()}
              fn setup()->(ProductSession,WorkerEnvelope,Value,String){
                  let path=env::var("WAND_FDFE_PRIVATE_DECODED").unwrap();
                  let bytes=fs::read(&path).unwrap();
                  let plan:Value=serde_json::from_slice(&fs::read(env::var("WAND_FDFE_PRIVATE_EXPECT").unwrap()).unwrap()).unwrap();
                  assert_eq!(hex32(&sha(&bytes)),plan["fd01"]["decodedSha"].as_str().unwrap());
                  let mut s=ProductSession::open_decoded_readonly(bytes,crate::BuildIdentity{
                      platform:Platform::Switch,build_kind:BuildKind::SwitchBid,
                      build_id:"9A239D3DB569756D".into(),schema:626,externally_attested:true}).unwrap();
                  s.worker_bound=true;let before=s.receipt().unwrap();
                  let e=WorkerEnvelope{contract:PRODUCT_WORKER_CONTRACT,session_id:before.session_id,
                      expected_revision:before.revision,expected_index_generation:before.index_generation,expected_decoded_sha256:before.decoded_sha256,action:WorkerAction::ReadDomain};
                  (s,e,plan,path)
              }
              #[test]
              #[ignore="authorized local input only; never execute in CI"]
              fn genuine_fd01_current_target(){
                  let(s,e,p,path)=setup();let before=s.receipt().unwrap();let want=&p["fd01"];
                  let t=s.mint_switch626_fd01_target(e,num(&want["grid"]),num(&want["x"]),num(&want["y"])).expect("actual FD01 target");
                  let got=serde_json::json!({"decodedSha":hex32(&before.decoded_sha256),"grid":t.grid,"x":t.x,"y":t.y,"next":t.next,"stock":t.stock,"pairs":t.pairs,"rootSha":hex32(&t.root_sha),"gridSha":hex32(&t.grid_sha),"counterSha":hex32(&t.counter_sha),"stockSha":hex32(&t.stock_sha),"housesSha":hex32(&t.houses_sha)});
                  assert_eq!(&got,want);
                  let bad=&p["fdBlocked"];
                  assert_eq!(s.mint_switch626_fd01_target(e,t.grid,num(&bad["x"]),num(&bad["y"])).unwrap_err().0,"FD01_TARGET_GEOMETRY");
                  assert_eq!(s.receipt().unwrap(),before);
                  assert_eq!(hex32(&sha(&fs::read(path).unwrap())),want["decodedSha"].as_str().unwrap());
                  println!("FD01_PRIVATE_TARGET_ACTUAL_PASS 1POS1NEG12FIELDS");
              }
              #[test]
              #[ignore="authorized local input only; never execute in CI"]
              fn genuine_fe01_current_target(){
                  let(s,e,p,path)=setup();let before=s.receipt().unwrap();let want=&p["fe01"];
                  let ids:[u32;4]=std::array::from_fn(|i|num(&want["ids"][i]));
                  let t=s.mint_switch626_fe01_target(e,num(&want["grid"]),ids).expect("actual FE01 target");
                  let got=serde_json::json!({"decodedSha":hex32(&before.decoded_sha256),"grid":t.grid,"ids":t.ids,"next":t.next,"pairs":t.pairs,"rootSha":hex32(&t.root_sha),"gridSha":hex32(&t.grid_sha),"counterSha":hex32(&t.counter_sha),"housesSha":hex32(&t.houses_sha),"oldRowsSha":t.old_rows_sha.iter().map(hex32).collect::<Vec<_>>()});
                  assert_eq!(&got,want);
                  let bad:[u32;4]=std::array::from_fn(|i|num(&p["feBlockedIds"][i]));
                  assert_eq!(s.mint_switch626_fe01_target(e,t.grid,bad).unwrap_err().0,"FE01_TARGET_GEOMETRY");
                  assert_eq!(s.receipt().unwrap(),before);
                  assert_eq!(hex32(&sha(&fs::read(path).unwrap())),want["decodedSha"].as_str().unwrap());
                  println!("FE01_PRIVATE_TARGET_ACTUAL_PASS 1POS1NEG10FIELDS");
              }
          }
          RS
          # The only tracked workspace delta is the ignored transport harness.
          test "$(git diff --name-only)" = "$p"
          cargo test --locked --manifest-path crates/ddv-save-core/Cargo.toml --features product-amount-scoped --lib switch626_fd01_target_fresh3_no_exemption -- --nocapture
          cargo test --locked --manifest-path crates/ddv-save-core/Cargo.toml --features product-amount-scoped --lib switch626_fe01_target_old4_fresh4_exact_shape -- --nocapture
          cargo test --locked --manifest-path crates/ddv-save-core/Cargo.toml --features product-amount-scoped --lib --no-run --message-format=json > "$RUNNER_TEMP/fdfe-build.jsonl"
          mkdir -p "$RUNNER_TEMP/fdfe-lab"
          python3 - "$RUNNER_TEMP" <<'PY'
          import json, pathlib, shutil, sys, hashlib, subprocess
          p=pathlib.Path(sys.argv[1]); a=[json.loads(l) for l in (p/'fdfe-build.jsonl').read_text().splitlines()]
          ex=[v['executable'] for v in a if v.get('reason')=='compiler-artifact' and v.get('executable') and v.get('profile',{}).get('test') and v.get('target',{}).get('name') in ('ddv_save_core','ddv-save-core')]
          assert len(ex)==1, len(ex)
          out=p/'fdfe-lab'; exe=out/'fdfe-private-target-test';shutil.copy2(ex[0],exe)
          h=lambda q:hashlib.sha256(pathlib.Path(q).read_bytes()).hexdigest()
          m={'source':'280731995de91740bb335ccacd92a6690c5f2472','binder':'6b98fb7463252b71bd3a8d151f266e235b1bb6aa','geometry':'22c18d025f45e972371bee3271404f0361bc0932','feature':'product-amount-scoped','lockGit':'b667b42cfef2032c2925be7b2aa9b7142bff4b52','lockSha256':h('crates/ddv-save-core/Cargo.lock'),'harnessSha256':h('crates/ddv-save-core/src/fence_product_target.rs'),'executableSha256':h(exe),'compiler':subprocess.check_output(['rustc','-Vv'],text=True),'purpose':'build-only local ignored test; no actual save in CI'}
          (out/'manifest.json').write_text(json.dumps(m,sort_keys=True,separators=(',',':'))+'\n')
          print('FDFE_LAB_BUILD_ONLY',m['source'],m['executableSha256'],m['lockSha256'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fdfe-fixed-private-target-test
          path: ${{ runner.temp }}/fdfe-lab/
          if-no-files-found: error
          retention-days: 1

name: 01A Private W1 V2 Research Synthetic Only
on:
  pull_request:
    paths:
      - 'crates/ddv-save-core/src/offline_w1_v2.rs'
      - 'crates/ddv-save-core/src/lib.rs'
      - 'crates/ddv-save-core/tests/w1_private_operation_v2.rs'
      - 'crates/ddv-save-core/examples/w1_private_v2_local.rs'
      - '.github/workflows/01a-private-w1-v2-research.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-native-only:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Evidence flags (do not use private P1G in public CI)
        run: |
          git rev-parse HEAD
          echo PRIVATE_SAVE_IN_CI=NO
          echo PRIVATE_CODEC_KEY_IN_CI=NO
          echo NATIVE_V3=NOT_ACCEPTED
          echo PRODUCT_WRITER=OFF
      - name: Synthetic W1 original-first atomic V2 and negative tests
        run: cargo test --manifest-path crates/ddv-save-core/Cargo.toml --test w1_private_operation_v2 -- --nocapture
      - name: Compile private operator without executing it
        run: cargo check --manifest-path crates/ddv-save-core/Cargo.toml --example w1_private_v2_local
      - name: Product exports remain unconditionally disabled
        run: |
          grep -Fq PRODUCT_P1G_ENCODE_COPY_NOT_AUTHORIZED crates/ddv-save-core/src/session.rs
          grep -Fq PRODUCT_ENCODE_COPY_NOT_AUTHORIZED crates/ddv-save-core/src/trusted_read.rs

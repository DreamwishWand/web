name: 05 QR-C PR1023 independent Avatar dependency readset
on:
  pull_request:
    paths:
      - '.github/workflows/05qr-c-pr1023-avatar-dependency.yml'
      - 'crates/ddv-save-core/tests/qa1023_avatar_dependency.rs'
      - 'tests/qa1023-private-avatar-cli.mjs'
permissions:
  contents: read
jobs:
  independent:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
          targets: wasm32-unknown-unknown
      - name: Exact source three and QA-only three
        run: |
          set -euo pipefail
          s=22082a5c3b2e39b260bf324af8e749c52020f3d0
          b=bfdbbe9e883e84193e90c0669a4855721ddb25e7
          test "$(git merge-base "$s" HEAD)" = "$s"
          while read -r p old new; do
            test "$(git rev-parse "$b:$p")" = "$old"
            test "$(git rev-parse "$s:$p")" = "$new"
            test "$(git rev-parse "HEAD:$p")" = "$new"
          done <<'EOF'
          crates/ddv-save-core/src/indexed_read.rs c4e8ae4d41b786bb6dea7c1451810fc54ce67240 50a1820bed0a5aad5bc9629914fbb486fc3963f2
          crates/ddv-save-core/src/bin/wand-local-rust-v1.rs a8c5b0b38ef9fa6dcd9c041edacfd9c54af43068 d6d1a01a0bc31d77c6864a5f1d5cd773b7967a68
          tests/private-active-avatar-read.mjs a6f9d71108a45cc8750e1501512926740a972443 34f873a052d720f35e7ad73e284a440c7ba454dd
          EOF
          test "$(git diff --name-only "$b" "$s" | wc -l)" = 3
          test "$(git diff --name-only "$s" HEAD | sort)" = "$(printf '%s\n' .github/workflows/05qr-c-pr1023-avatar-dependency.yml crates/ddv-save-core/tests/qa1023_avatar_dependency.rs tests/qa1023-private-avatar-cli.mjs | sort)"
          echo QAC1023_EXACT_SOURCE3_QA3_PASS
      - name: Independent Rust and CLI synthetic actual
        run: |
          cargo test --locked --manifest-path crates/ddv-save-core/Cargo.toml --no-default-features --features private-native-v1 --test qa1023_avatar_dependency
          cargo build --locked --manifest-path crates/ddv-save-core/Cargo.toml --no-default-features --features private-native-v1 --bin wand-local-rust-v1
          node tests/qa1023-private-avatar-cli.mjs crates/ddv-save-core/target/debug/wand-local-rust-v1
      - name: Public WASM build and no private API export
        run: |
          cargo check --locked --manifest-path crates/ddv-save-core/Cargo.toml --target wasm32-unknown-unknown --no-default-features --features worker-wasm,indexed-read
          mkdir -p /tmp/qac1023-probe/src
          printf '%s\n' '[package]' 'name="qac1023-probe"' 'version="0.1.0"' 'edition="2021"' '[dependencies]' "ddv-save-core={path=\"$PWD/crates/ddv-save-core\",default-features=false,features=[\"indexed-read\"]}" > /tmp/qac1023-probe/Cargo.toml
          printf '%s\n' 'fn probe(s:&ddv_save_core::ProductSession,e:ddv_save_core::WorkerEnvelope){let _=s.read_private_avatar_dependencies(e);}' > /tmp/qac1023-probe/src/lib.rs
          if cargo check --offline --manifest-path /tmp/qac1023-probe/Cargo.toml >/tmp/qac1023-probe.log 2>&1; then exit 1; fi
          grep -q 'E0599' /tmp/qac1023-probe.log
          grep -q 'read_private_avatar_dependencies' /tmp/qac1023-probe.log
          echo QAC1023_PRIVATE_API_EXCLUDED_PASS

name: QA ONLY 04 QR-W PR2297 Codec Worker encoded/decoded zeroization L2 NEVER MERGE
on:
  pull_request:
    paths:
      - '.github/workflows/qa-qrw-pr2297-codec-private-memory-l2.yml'
permissions:
  contents: read
jobs:
  codec-worker-ciphertext-private-byte-lifetime:
    runs-on: ubuntu-24.04
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 04qrw/pr2297-44f-codec-worker-private-buffer-l2
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pin original 01A Source4 exact GitBlobs and independent QA-only2
        shell: bash
        run: |
          set -euo pipefail
          base=ef30de7a3eb5cb3560f14b5d50443fe7689747ff
          source=44f49dc6f32d817674f5abcbb09c50fbb6726d23
          git merge-base --is-ancestor "$base" HEAD
          test "$(git rev-parse "$base:src/lib/ddv/core/save/product-scoped-amount-local-adapter.mjs")" = 107a44cfdcfdaf8cd1769bba3e90c0056fb59cc0
          test "$(git rev-parse 'HEAD:src/lib/ddv/core/save/product-scoped-amount-local-adapter.mjs')" = 334a8dc69485981598773923c265e97f16296fb1
          test "$(git rev-parse "$base:src/lib/dev/local-amount-codec-reopen.worker.mjs")" = 955d95056d4c115b24b77db2ec2f31ef90992882
          test "$(git rev-parse 'HEAD:src/lib/dev/local-amount-codec-reopen.worker.mjs')" = 43ac5c02a6b4ff47d6b9a2d7c419fa690285907f
          test "$(git rev-parse "$base:src/lib/dev/local-amount-worker-adapter.mjs")" = 3469316b24acc09a8565b8ee57d031315e524e84
          test "$(git rev-parse 'HEAD:src/lib/dev/local-amount-worker-adapter.mjs')" = 15d510895a1bba4913dc6d13f46ea1f303ba6ff0
          if git cat-file -e "$base:tests/01a-codec-reopen-worker-ciphertext-zeroize.test.mjs" 2>/dev/null; then exit 1; fi
          test "$(git rev-parse 'HEAD:tests/01a-codec-reopen-worker-ciphertext-zeroize.test.mjs')" = 04e906c7ce79167892bdcd9b808fc6b7707b4958
          test "$(git rev-parse 'HEAD:tests/qa-qrw-pr2297-actual-codec-worker-send-receive-zeroize-l2.test.mjs')" = 5f539299b09daa2c50cd9d8fe30e55392187865e
          for f in src/lib/ddv/core/save/product-scoped-amount-local-adapter.mjs src/lib/dev/local-amount-codec-reopen.worker.mjs src/lib/dev/local-amount-worker-adapter.mjs tests/01a-codec-reopen-worker-ciphertext-zeroize.test.mjs tests/qa-qrw-pr2297-actual-codec-worker-send-receive-zeroize-l2.test.mjs .github/workflows/qa-qrw-pr2297-codec-private-memory-l2.yml; do
            test "$(git ls-tree HEAD "$f" | awk '{print $1}')" = 100644
          done
          printf '%s\n' src/lib/ddv/core/save/product-scoped-amount-local-adapter.mjs src/lib/dev/local-amount-codec-reopen.worker.mjs src/lib/dev/local-amount-worker-adapter.mjs tests/01a-codec-reopen-worker-ciphertext-zeroize.test.mjs | LC_ALL=C sort >/tmp/source
          printf '%s\n' .github/workflows/qa-qrw-pr2297-codec-private-memory-l2.yml tests/qa-qrw-pr2297-actual-codec-worker-send-receive-zeroize-l2.test.mjs | LC_ALL=C sort >/tmp/qa
          git diff --name-only "$base" "$source" | LC_ALL=C sort | diff -u /tmp/source -
          git diff --name-only "$source" HEAD | LC_ALL=C sort | diff -u /tmp/qa -
          git diff --quiet "$source" HEAD -- src/ scripts/ ops/ crates/ static/ package-lock.json
          echo QRW2297_SOURCE4_QAONLY2_EXACT_GITBLOBS_PASS
      - name: Actual fresh Codec Worker receive and original DEV/Product send-side fault injections
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/01a-codec-reopen-worker-ciphertext-zeroize.test.mjs tests/qa-qrw-pr2297-actual-codec-worker-send-receive-zeroize-l2.test.mjs
          echo QRW2297_WORKER_PRIVATE_ENCODED_DECODED_CIPHER_ZEROIZE_L2_PASS

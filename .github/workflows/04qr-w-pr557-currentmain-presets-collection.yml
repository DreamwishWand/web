name: "04QR-W PR557 current-main Presets and Collection independent"
on:
  pull_request:
    branches: ['integration/stage1-presets-four-to-two-maine400-20261105']
    paths:
      - '.github/workflows/04qr-w-pr557-currentmain-presets-collection.yml'
      - 'scripts/04qr-w-pr557-presets-collection-chromium.mjs'
      - 'tests/04qr-w-pr557-presets-collection-independent.test.mjs'
permissions:
  contents: read
jobs:
  composed-source-scope-and-denials:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm ci --no-audit --no-fund
      - name: Frozen HEAD six sources and private/Writer denial
        run: node --test tests/04qr-w-pr557-presets-collection-independent.test.mjs
      - name: Actual browser QA script syntax
        run: node --check scripts/04qr-w-pr557-presets-collection-chromium.mjs
  composed-actual-chromium-no-private-save:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm ci --no-audit --no-fund
      - run: npm install --no-save --package-lock=false playwright-core@1.55.0
      - name: Locate installed actual Chrome
        id: chrome
        run: |
          set -euo pipefail
          BIN="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$BIN"
          echo "path=$BIN" >> "$GITHUB_OUTPUT"
      - name: Start localhost source-only product for new main
        run: |
          set -euo pipefail
          BASE_PATH='' npm run dev -- --host 127.0.0.1 --port 4307 >/tmp/qr557-currentmain.log 2>&1 &
          for i in $(seq 1 70); do
            if curl --fail --silent http://127.0.0.1:4307/presets/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/qr557-currentmain.log
          exit 1
      - name: Actual Presets/Collection/Typed Item/Moodboard and 320/200 network negatives
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.path }}
          QR557_URL: http://127.0.0.1:4307
        run: |
          set -euo pipefail
          test -z "${WEP_PRIVATE_P1G_PATH:-}"
          test -z "${WEP_PRIVATE_LOCAL_ONLY_ACK:-}"
          test -z "${WEP_PRIVATE_EXTERNAL_BUILD_CONFIRMED:-}"
          node scripts/04qr-w-pr557-presets-collection-chromium.mjs

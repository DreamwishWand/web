name: QA ONLY PR1666 COMP03 Spatial SR03 shared compatibility (never merge)
on:
  pull_request:
    paths:
      - '.github/workflows/qa-qrw-pr1666-comp03-sr03-shared.yml'
permissions:
  contents: read
jobs:
  sr03-actual:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_TARGET_DIR: /tmp/qrw-sr03-target
    steps:
      - uses: actions/checkout@v4

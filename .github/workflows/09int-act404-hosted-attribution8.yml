name: 09 INT ACT404 Hosted Attribution 8 Locale Chrome (QA ONLY)
on:
  push:
    branches:
      - '09int/qa-act404-hosted-8locale-*'
permissions:
  contents: read
jobs:
  hosted-attribution:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm install --no-save --package-lock=false playwright-core@1.55.0
      - name: ACT404 actual hosted Pages locale, accessibility, NO media Chrome
        env:
          CHROME_BIN: /usr/bin/google-chrome-stable
        run: |
          set -euo pipefail
          test -x "$CHROME_BIN" || export CHROME_BIN="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium)"
          node tests/qa/09int-act404-hosted-attribution8.mjs

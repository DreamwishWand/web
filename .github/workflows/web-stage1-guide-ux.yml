name: WEB Stage1 Guide visible 4-card root (no public content approval)
on:
  push:
    branches:
      - 'web/stage1-guide-four-card-root-*'
  pull_request:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - name: Exact parent and no content/rights/other Product mutation
        shell: bash
        run: |
          set -euo pipefail
          BASE=342823eb03eff6bb7c5d80f4a804249bb174df10
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"
          git diff --name-only "$BASE" HEAD >/tmp/stage1-guide-diff
          test "$(wc -l </tmp/stage1-guide-diff)" -eq 5
          while IFS= read -r f; do
            case "$f" in
              src/routes/guide/+page.svelte|src/lib/guide/copy.js|tests/web-stage1-guide-root.test.mjs|scripts/web-stage1-guide-chrome.mjs|.github/workflows/web-stage1-guide-ux.yml) ;;
              *) echo "OUTSIDE_GUIDE_STAGE1_SCOPE:$f"; exit 1 ;;
            esac
          done </tmp/stage1-guide-diff
          git diff --exit-code "$BASE" HEAD -- src/lib/guide/runtime.js src/lib/community/ src/lib/ddv/ src/lib/wep/ src/lib/timing/ src/lib/collection/ supabase/ static/ .github/workflows/pages.yml
          echo WEB_STAGE1_GUIDE_SCOPE_ONLY_PASS
      - name: Four-card root, no fifth Issues child, no Writer
        run: node --test tests/web-stage1-guide-root.test.mjs
      - name: Existing Node regressions, typecheck and Pages artifact
        env:
          BASE_PATH: /web
        run: |
          npm test
          npm run check
          npm run build
      - name: No unaccepted Guide article SEO prerender
        run: |
          test -f build/guide/index.html
          test ! -f build/ja/entity/quest/12345/index.html
          echo WEB_STAGE1_GUIDE_PUBLIC_POSITIVE_OFF_PASS
  chrome:
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm install --no-save --package-lock=false playwright-core@1.55.0
      - name: Start local Guide and resolve Chrome
        env:
          BASE_PATH: /web
        shell: bash
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
          npm run build
          BASE_PATH='' npm run dev -- --host 127.0.0.1 --port 4286 >/tmp/web-stage1-guide.log 2>&1 &
          for i in $(seq 1 75); do
            if curl -fsS http://127.0.0.1:4286/guide/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/web-stage1-guide.log
          exit 1
      - name: Real Chrome 8 locales, 4 hub cards, keyboard/mobile/zoom
        env:
          STAGE1_GUIDE_URL: http://127.0.0.1:4286
        run: node scripts/web-stage1-guide-chrome.mjs

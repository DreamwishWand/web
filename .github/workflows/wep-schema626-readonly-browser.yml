name: WEP Switch schema626 read-only browser acceptance

on:
  push:
    branches: ['wep/**']
    paths:
      - '.github/workflows/wep-schema626-readonly-browser.yml'
      - 'scripts/wep-schema626-readonly-browser-acceptance.mjs'
      - 'src/routes/editor/world/**'
      - 'src/lib/wep/world-save-source.ts'
      - 'src/lib/wep/world-readonly-copy.js'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/wep-schema626-readonly-browser.yml'
      - 'scripts/wep-schema626-readonly-browser-acceptance.mjs'
      - 'src/routes/editor/world/**'
      - 'src/lib/wep/world-save-source.ts'
      - 'src/lib/wep/world-readonly-copy.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readonly626-browser-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm install --no-save --package-lock=false playwright-core@1.55.0
      - name: Resolve system Chrome
        id: chrome
        shell: bash
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          echo "path=$CHROME_BIN" >> "$GITHUB_OUTPUT"
      - name: Start local app
        shell: bash
        run: |
          set -euo pipefail
          npm run dev -- --host 127.0.0.1 --port 4179 > /tmp/wep-626-vite.log 2>&1 &
          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:4179/editor/world/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/wep-626-vite.log
          exit 1
      - name: Run focused read-only browser acceptance
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.path }}
          WEP_READONLY626_BASE_URL: http://127.0.0.1:4179
        run: node scripts/wep-schema626-readonly-browser-acceptance.mjs
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wep-schema626-readonly-browser
          path: .artifacts/wep-schema626-readonly-browser/
          if-no-files-found: error

name: 04 QR-S PR791 Stage116 nine-definer six-writer metadata independent negative QA
on:
  push:
    branches: [qa/pr791-stage116-privilege-independent-20261108]
permissions:
  contents: read
jobs:
  qr-stage116-lineage:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ''
      SUPABASE_DB_PASSWORD: ''
      SUPABASE_PROJECT_ID: ''
      DATABASE_URL: ''
      PGHOST: ''
      PGPASSWORD: ''
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Pin exact frozen PR791 source 3 blobs and QA-only 2 paths
        shell: bash
        run: |
          set -euo pipefail
          SOURCE=c803854604fa1ec1174b7508413dafeeb2ec98ee
          PARENT=1024d4207245ed99126abedcf3452ef670a44c6a
          git merge-base --is-ancestor "$SOURCE" HEAD
          git diff --name-only "$SOURCE" HEAD | sort >/tmp/qr791-actual
          printf '%s\n' \
            .github/workflows/qr-pr791-stage116-lineage-independent.yml \
            tests/qr-pr791-stage116-privilege-lineage-independent.test.mjs | sort >/tmp/qr791-expected
          diff -u /tmp/qr791-expected /tmp/qr791-actual
          git diff --name-only "$PARENT" "$SOURCE" | sort >/tmp/qr791-source
          printf '%s\n' \
            docs/community/stage116-nine-definer-six-legacy-grants-hold-20261108.md \
            scripts/comm-stage116-privilege-lineage-readonly.mjs \
            tests/comm-stage116-privilege-lineage-readonly.test.mjs | sort >/tmp/qr791-source-expect
          diff -u /tmp/qr791-source-expect /tmp/qr791-source
          test "$(git hash-object scripts/comm-stage116-privilege-lineage-readonly.mjs)" = d0759c4d8e650e2b6a63cbb5ca5da44d5eb4530a
          test "$(git hash-object tests/comm-stage116-privilege-lineage-readonly.test.mjs)" = 8caa0261784af121259724f741e55816136cacb7
          test "$(git hash-object docs/community/stage116-nine-definer-six-legacy-grants-hold-20261108.md)" = 4e9574793c74d85cb24ebee5f276889041354d2c
          test "$(git hash-object supabase/migrations/20260930025132_community_core_v0_server_rpc.sql)" = bbf9bc830440d964c5da8b3c3cac7e926d281881
          test -z "$(git diff --name-only "$SOURCE" HEAD -- src supabase scripts docs)"
          test -z "$SUPABASE_ACCESS_TOKEN" && test -z "$SUPABASE_PROJECT_ID" &&
            test -z "$SUPABASE_DB_PASSWORD" && test -z "$DATABASE_URL" &&
            test -z "$PGHOST" && test -z "$PGPASSWORD"
          echo QR791_FROZEN_SOURCE_THREE_QA_TWO_NO_PROD_DB_OR_SECRET_PASS
      - name: Independent offline nine+six signature/MD5/search_path/role impostor positives and negatives
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/qr-pr791-stage116-privilege-lineage-independent.test.mjs | tee /tmp/qr791-results.log
          for marker in \
            QR791_SOURCE_THREE_BLOBS_IMMUTABLE82_AND_NO_PRODUCTION_CHANGES_PASS \
            QR791_NINE_SIGNATURE_MD5_SIX_PRIVILEGED_TWO_SOURCE_UNKNOWN_PINNED_PASS \
            QR791_STAGE9_SIX_SANDBOX0_THREE_HOLD_NO_PARITY_PASS \
            QR791_ALL_FIFTEEN_STAGED_CATALOG_MD5_IDENTITY_ROLE_SEARCHPATH_TAMPERS_DETECTED_PASS \
            QR791_HOSTILE_MALFORMED_DUPLICATE_OVERLOADED_ROWS_NO_PARITY_PASS \
            QR791_SANDBOX_SAME_ID_FORGED_HASH_SEARCHPATH_PRIVILEGE_DRIFT_REPORTED_PASS \
            QR791_FAKE_FULL_SANDBOX_AND_OWNER_FLAGS_NEVER_AUTHORIZE_PASS \
            QR791_NO_SECRET_URL_JWT_FUNCTION_BODY_SQL_DB_OR_PROD_RUNTIME_PASS; do
            grep -q "$marker" /tmp/qr791-results.log
          done
          echo QR791_INDEPENDENT_EIGHT_CASES_ALL_DENY_AND_DRIFT_DETECTED_PASS
      - name: Clean synthetic logs, no database connection
        if: always()
        shell: bash
        run: |
          rm -f /tmp/qr791-actual /tmp/qr791-expected /tmp/qr791-source /tmp/qr791-source-expect /tmp/qr791-results.log
          echo QR791_SYNTHETIC_QA_TEMP_CLEANED

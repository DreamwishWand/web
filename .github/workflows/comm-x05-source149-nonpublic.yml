name: 03 COMM X05 Source149 NEW-ONLY nonpublic two-backend PostgreSQL
on:
  push:
    branches: ['feature/03comm-x05-nonpublic-owner-controls-20261028']
  pull_request:
    branches: ['fix/03comm-x05-shared-metadata-staged-20261028']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source149-local:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_ACCESS_TOKEN: ''
      DATABASE_URL: ''
      DDVRE_PRIVACY_ISOLATED_LOCAL: CONFIRMED
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exactly one additive private Source149, preserve historic Source141-148
        run: |
          set -euo pipefail
          test -z "$SUPABASE_ACCESS_TOKEN" && test -z "$DATABASE_URL"
          git merge-base --is-ancestor 8d678b53275204fa964cfdbe3de74a61fee8cad0 HEAD
          test "$(git hash-object supabase/migrations/20261028000000_x05_shared_dreamsnap_metadata_staged_v1.sql)" = 5c2b1b85b07821d7e60a84de40d933d59c4cc19d
          test "$(git hash-object supabase/migrations/20261028000010_x05_post_event_staged_liveness_immutable_guard.sql)" = f6438fe596ed2eaca88bdb034173431f6bd511aa
          test -z "$(git diff --name-only 8d678b53275204fa964cfdbe3de74a61fee8cad0 HEAD -- supabase/migrations/202609* supabase/migrations/202610030* supabase/migrations/202610232* supabase/migrations/202610242* supabase/migrations/202610250* supabase/migrations/202610270* supabase/migrations/20261028000000* supabase/migrations/20261028000010*)"
          test -z "$(git diff --name-only 8d678b53275204fa964cfdbe3de74a61fee8cad0 HEAD -- supabase/functions src)"
          python3 - <<'PY'
          from pathlib import Path
          paths=sorted(Path('supabase/migrations').glob('*.sql'))
          assert len(paths)==149,len(paths)
          assert len(set(p.name.split('_')[0] for p in paths))==149
          assert paths[-1].name=='20261028000020_x05_nonpublic_consent_phase_revoke_controls.sql'
          src=paths[-1].read_text()
          for needle in ('public_activation_allowed=false',
                         'from public,anon,authenticated,service_role',
                         'private.dreamsnap_x05_schedule_preflight_v1',
                         'private.dreamsnap_x05_owner_transition_v1',
                         "visibility='private'"):
              assert needle in src,needle
          edge=Path('supabase/functions/community-public-query/index.ts').read_text()
          assert 'dreamsnap_x05_' not in edge
          assert 'dreamsnap_shared_public_work_metadata_v1' not in edge
          print('COMM149_ONLY_NEW_MIGRATION_AND_NO_PUBLIC_ROUTE_PASS')
          PY
          node --test tests/comm-x05-source149-nonpublic.test.mjs
      - uses: supabase/setup-cli@v1
        with:
          version: 2.81.3
      - name: Disposable isolated full149 local Supabase project
        run: |
          set -euo pipefail
          docker version
          printf 'project_id = "ddvre_comm149_nonpublic_disposable"\n' | cat - supabase/config.toml > /tmp/comm149-config.toml
          mv /tmp/comm149-config.toml supabase/config.toml
          timeout 1500s supabase start --debug >/tmp/comm149-start.log 2>&1 || { tail -160 /tmp/comm149-start.log; exit 1; }
          echo COMM149_CLEAN_FULL149_MIGRATION_BOOTSTRAP_PASS
      - name: Install isolated local two-session PostgreSQL client
        run: python3 -m pip install --quiet 'psycopg[binary]==3.2.10'
      - name: Source149 NEW-only actual two-connection PostgreSQL acceptance
        run: |
          set -euo pipefail
          python3 tests/comm-x05-source149-nonpublic-two-pg.py 2>&1 | tee /tmp/comm149-new-only.log
          grep -q COMM149_SOURCE_LOCAL_COMPLETE /tmp/comm149-new-only.log
      - name: Local synthetic trace (never real images or JWT)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: comm149-newonly-synthetic-pg
          path: /tmp/comm149-new-only.log
          if-no-files-found: warn
      - name: Bounded startup error if failed
        if: failure()
        run: tail -140 /tmp/comm149-start.log || true

name: "04 QR-W PR612 independent linked image takedown negative"
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/04qr-w-pr612-image-operator-independent.yml'
      - 'tests/04qr-w-pr612-image-operator-independent.test.mjs'
permissions:
  contents: read
jobs:
  linked-image-hash-takedown-negative:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - name: Independently prove takedown transitive closure and invalid linked derivative deny
        run: |
          set -euo pipefail
          node --check tests/04qr-w-pr612-image-operator-independent.test.mjs
          node --test tests/04qr-w-pr612-image-operator-independent.test.mjs

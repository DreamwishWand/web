name: 09P ACT1581 Inventory0 Gate-first exact Source15 OFF (no sign)
on:
  pull_request:
    paths:
      - 'scripts/wasm-distribution/r22-accepted-rust-scope.mjs'
      - 'tests/09p-r22-inventory0-gate-first15.test.mjs'
      - '.github/workflows/09p-r22-inventory0-gate-first15.yml'
permissions:
  contents: read
jobs:
  trusted-source15-gate-first-off:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 09P immutable Source15 Gate-first, old Bamboo signer unchanged, ten real Git negatives
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY_ID" = 1371485649
          test "$(git rev-parse HEAD:crates/ddv-save-core/Cargo.toml)" = 751a73da41d8b58f7de70643f50b97722a3c1260
          test "$(git rev-parse HEAD:scripts/wasm-distribution/protected-release-inputs.json)" = 30551c7cc566614f64c8ba04748c3aef44b419bb
          test "$(git rev-parse HEAD:scripts/readonly-release/seal-bamboo-public-pages.mjs)" = e6290e890ac205f6486a76567e7ccac90f8d9aba
          node --test 'tests/09p-r22-inventory0-gate-first15.test.mjs'
          test -z "$(git ls-files static/worker-wasm)"
          echo 09P_INVENTORY0_GATE_FIRST_SOURCE15_CANDIDATE_ONLY_SIGNER_WRITER_OP_OFF

name: QA ONLY PR1973 four appearance union cross-scope actual Chrome Worker L2 (NEVER MERGE)
on:
  pull_request:
    paths:
      - '.github/workflows/qa-qrw-pr1973-four-appearance-union-l2.yml'
permissions:
  contents: read
jobs:
  qrw-appearance-four-union:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 077f5e613a88b8dc49772f74a473eff3b587f103
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Immutable PR1973 child Source and all four protected OFF anchors
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '077f5e613a88b8dc49772f74a473eff3b587f103'
          test "$(git merge-base 059ddfd816d3100cd25780eb9082cf4f6bcd06c9 HEAD)" = '059ddfd816d3100cd25780eb9082cf4f6bcd06c9'
          git diff --name-only 059ddfd816d3100cd25780eb9082cf4f6bcd06c9 HEAD | LC_ALL=C sort >/tmp/qrw1973-actual
          cat >/tmp/qrw1973-expected <<'PATHS'
          src/lib/ddv/core/save/p1g-rust-worker-readonly-bridge.mjs
          src/lib/ddv/core/save/product-scoped-amount-local-adapter.mjs
          src/lib/ddv/core/save/product-scoped-makeup-color1-release-anchor.mjs
          src/lib/ddv/core/save/product-scoped-placement-release.mjs
          src/lib/ddv/core/save/product-scoped-switch-makeup-color1-release-anchor.mjs
          src/lib/ddv/core/save/product-steam626-makeup-color1-transport.mjs
          src/lib/ddv/core/save/product-wasm-read-owner.d.mts
          src/lib/ddv/core/save/product-wasm-read-owner.mjs
          src/lib/dev/LocalPlacementEditorDev.svelte
          src/lib/dev/PlacementProductRoute.svelte
          src/lib/dev/local-placement-copy.mjs
          src/lib/dev/local-placement-workflow.mjs
          src/lib/dev/local-scoped-edit-worker-port.mjs
          src/lib/dev/product-makeup-color1.worker.mjs
          src/lib/dev/product-placement-client.mjs
          src/lib/dev/product-switch-makeup-color1.worker.mjs
          src/routes/editor/appearance/makeup-color1/steam/+page.svelte
          src/routes/editor/appearance/makeup-color1/switch/+page.svelte
          tests/product-steam626-makeup-color1-route-off.test.mjs
          tests/product-steam626-makeup-color1-transport.test.mjs
          tests/product-switch626-eyecolor2-route-off.test.mjs
          tests/product-switch626-makeup-color1-build-transport.test.mjs
          tests/product-switch626-makeup-color1-route-off.test.mjs
          tests/stage-e/chrome-smoke.mjs
          tests/stage-f/chrome-smoke.mjs
          tests/wasm-distribution/chrome-smoke.mjs
          tools/owner-local-steam-v1/server.mjs
          PATHS
          diff -u /tmp/qrw1973-expected /tmp/qrw1973-actual
          test "$(git rev-parse HEAD:src/lib/ddv/core/save/product-scoped-placement-release.mjs)" = 'd85b2adfd4da2f0e8c6564b92bdab7ecfd8afc40'
          test "$(git rev-parse HEAD:src/lib/dev/product-placement-client.mjs)" = 'e3d5d040db6c62f69ee3184a2642d2d0b048e629'
          for a in \
            product-scoped-eyecolor2-release-anchor.mjs \
            product-scoped-switch-eyecolor2-release-anchor.mjs \
            product-scoped-makeup-color1-release-anchor.mjs \
            product-scoped-switch-makeup-color1-release-anchor.mjs; do
            grep -Eq 'export const PROTECTED_.*_RELEASE_ANCHOR=null;' "src/lib/ddv/core/save/$a"
          done
          git diff --exit-code 059ddfd816d3100cd25780eb9082cf4f6bcd06c9 HEAD -- crates .github/workflows/product-release.yml
          echo QRW1973_IMMUTABLE_FOUR_SOURCE_AND_OFF_ANCHOR_PASS
      - name: Install pinned Web dependencies
        run: |
          npm ci --no-audit --no-fund
          npm install --no-save --package-lock=false playwright-core@1.55.0
      - name: Actual Chrome four routes plus isolated Worker dual-category and cross-build rejection
        run: |
          set -euo pipefail
          mkdir -p src/routes/test-qrw-appearance-union
          cat >src/routes/test-qrw-appearance-union/qa.worker.mjs <<'WORKER'
          import {createProductWasmReadOwner} from '$lib/ddv/core/save/product-wasm-read-owner.mjs';
          import {createP1gRustWorkerReadOnlyBridge} from '$lib/ddv/core/save/p1g-rust-worker-readonly-bridge.mjs';
          const labels=['eyecolor2','eyecolor2-switch','makeup-color1','makeup-color1-switch'];
          const extras=[
            {allowScopedAmountSource:true},{allowScopedCollectionSource:true},{allowCollectionCandidateSource:true},
            {allowSwitch626ChestSource:true},{allowSteam626ChestSource:true},{allowSwitch626Catalog0Source:true},
            {placementScope:'comp03'},{backpackScope:'steam'},{wardrobeScope:'switch'}
          ];
          const fakeFactory=async()=>{throw Error('UNEXPECTED_WASM_FACTORY_USED')};
          const deny=async(f,n)=>{let ok=false;try{await f()}catch{ok=true}if(!ok)throw Error('UNSAFE_CROSS_SCOPE_GRANTED_'+n);return 1};
          self.onmessage=async({data})=>{if(data?.kind!=='RUN')return;try{
            let positives=0,negatives=0,wrongBuild=0,cleanClosures=0;
            for(const scope of labels){
              const owner=createProductWasmReadOwner(fakeFactory,{appearanceScope:scope});
              const bridge=createP1gRustWorkerReadOnlyBridge(fakeFactory,{appearanceScope:scope});
              const methods=['openScopedEncrypted','verifyScopedOriginalBackup','previewScopedAppearance','stageScopedAppearance','toggleScopedAppearance','exportScopedEditedCopy'];
              if(!methods.every(k=>typeof bridge[k]==='function')||
                 ['previewScopedPlacement','stageScopedPlacement','previewScopedWardrobe','stageScopedBackpack','previewScopedAmount','stageFixedCollection'].some(k=>k in bridge))
                throw Error('UNAUTHORIZED_SURFACE_'+scope);
              if(owner.close().writerAuthorized!==false||bridge.close().writerAuthorized!==false)
                throw Error('CLOSE_AUTHORIZED_'+scope);
              cleanClosures+=2;positives+=2;
              for(const [i,extra] of extras.entries()){
                negatives+=await deny(()=>createProductWasmReadOwner(fakeFactory,{appearanceScope:scope,...extra}),scope+'_owner_'+i);
                negatives+=await deny(()=>createP1gRustWorkerReadOnlyBridge(fakeFactory,{appearanceScope:scope,...extra}),scope+'_bridge_'+i);
              }
              const foreign=scope.endsWith('-switch')?'steam-windows':'switch';
              const file=new File([new Uint8Array(16)],'fixture.p1g',{type:'application/octet-stream'});
              negatives+=await deny(()=>bridge.openScopedEncrypted({
                file,build:{platform:foreign,buildKind:foreign==='switch'?'switch-bid':'steam-full-version',
                  buildId:foreign==='switch'?'9A239D3DB569756D':'releases_1.25-v1.25.3-44-g0b41250d9ac0-incremental-22',
                  schema:626,externallyConfirmed:true},originalSha256:'a'.repeat(64)
              }),scope+'_foreign_build');wrongBuild++;
              const invalid=['eyecolor2|makeup-color1','eyecolor2-switch,makeup-color1-switch','both',[],['eyecolor2','makeup-color1']];
              for(const [i,bad] of invalid.entries())negatives+=await deny(()=>createProductWasmReadOwner(fakeFactory,{appearanceScope:bad}),scope+'_invalid_scope_'+i);
            }
            self.postMessage({kind:'QA_RESULT',positives,negatives,wrongBuild,cleanClosures,actualWorker:true,ownerWasmInstantiated:false,
              fourScopes:labels,originalProductWebUnchanged:true,genuineV2:false,writerOn:false});
          }catch(e){self.postMessage({kind:'QA_ERROR',error:String(e?.stack||e)})}};
          WORKER
          cat >src/routes/test-qrw-appearance-union/+page.svelte <<'SVELTE'
          <script>
          import {onMount} from 'svelte';
          onMount(()=>{
            const w=new Worker(new URL('./qa.worker.mjs',import.meta.url),{type:'module'});
            w.onmessage=e=>{window.__qrw1973=e.data};w.onerror=e=>{window.__qrw1973={kind:'QA_ERROR',error:e.message}};
            w.postMessage({kind:'RUN'});
            return ()=>w.terminate();
          });
          </script>
          <p>Test only, four Appearance scopes isolated in actual Worker</p>
          SVELTE
          cat >tests/.qa-qrw1973-union-chrome.mjs <<'NODE'
          import assert from 'node:assert/strict';
          import {chromium} from 'playwright-core';
          import {spawn,spawnSync} from 'node:child_process';
          const origin='http://127.0.0.1:4186';
          const server=spawn('npm',['run','dev','--','--host','127.0.0.1','--port','4186','--strictPort'],{
            env:{...process.env,BASE_PATH:''},stdio:'inherit'
          });
          let browser;
          try{
            let ready=false;
            for(let i=0;i<160;i++){try{if((await fetch(origin+'/editor/appearance/eyecolor2/steam/')).ok){ready=true;break}}catch{}
              await new Promise(r=>setTimeout(r,250))}
            assert.ok(ready,'Vite SvelteKit route started');
            const bin=['google-chrome-stable','google-chrome','chromium'].find(x=>spawnSync('which',[x]).status===0);
            assert.ok(bin,'real Chrome installed');
            browser=await chromium.launch({headless:true,executablePath:spawnSync('which',[bin],{encoding:'utf8'}).stdout.trim(),
              args:['--no-sandbox','--disable-dev-shm-usage']});
            const page=await browser.newPage({viewport:{width:390,height:844}});
            await page.addInitScript(()=>{
              const Native=window.Worker;window.__qrwProductWorkers=0;
              window.Worker=new Proxy(Native,{construct(target,args,newTarget){
                if(String(args[0]).includes('product-'))window.__qrwProductWorkers++;
                return Reflect.construct(target,args,newTarget)
              }});
            });
            const errors=[];page.on('pageerror',e=>errors.push(String(e)));
            const specs=[
              {op:'eyecolor2',path:'/editor/appearance/eyecolor2/steam/',key:'EYECOLOR2_RELEASE',fn:'createProductEyeColor2Port',mount:'getEyeColor2MountInfo',platform:'steam-windows'},
              {op:'eyecolor2-switch',path:'/editor/appearance/eyecolor2/switch/',key:'SWITCH_EYECOLOR2_RELEASE',fn:'createProductSwitchEyeColor2Port',mount:'getSwitchEyeColor2MountInfo',platform:'switch'},
              {op:'makeup-color1',path:'/editor/appearance/makeup-color1/steam/',key:'MAKEUP_COLOR1_RELEASE',fn:'createProductMakeupColor1Port',mount:'getMakeupColor1MountInfo',platform:'steam-windows'},
              {op:'makeup-color1-switch',path:'/editor/appearance/makeup-color1/switch/',key:'SWITCH_MAKEUP_COLOR1_RELEASE',fn:'createProductSwitchMakeupColor1Port',mount:'getSwitchMakeupColor1MountInfo',platform:'switch'}
            ];
            let routes=0,offDenied=0,forgedReadyDenied=0;
            for(const [i,s] of specs.entries()){
              const other=specs[(i+1)%specs.length];
              await page.goto(origin+s.path+'?mode=public-accepted&writerAuthorized=true&fixedOperation='+encodeURIComponent(other.op));
              const sect=page.locator('[data-placement-product-route="'+s.op+'"]');
              await sect.waitFor({timeout:30000});
              assert.equal(await sect.getAttribute('data-placement-scope'),'off');
              await sect.locator('h1').waitFor();await sect.locator('p[role="status"]').waitFor();
              assert.equal(await sect.locator('[data-dev-placement]').count(),0);
              assert.equal(await sect.locator('input[type=file]').count(),0);
              const check=await page.evaluate(async ({s,other})=>{
                const rel=await import('/src/lib/ddv/core/save/product-scoped-placement-release.mjs');
                const client=await import('/src/lib/dev/product-placement-client.mjs');
                const spec=rel[s.key],otherSpec=rel[other.key];
                if(spec.path!==s.path||spec.platform!==s.platform||spec.operation===otherSpec.operation||
                  spec.methods.length!==13||spec.exports.length!==22||spec.features.length!==2)
                  throw Error('CROSS_SOURCE_CONTRACT_DRIFT_'+s.op);
                let denied=0;
                try{await rel[s.mount]()}catch{denied++}
                const before=window.__qrwProductWorkers;
                try{await client[s.fn]({onFault:()=>{}})}catch{denied++}
                if(window.__qrwProductWorkers!==before)throw Error('PUBLIC_WORKER_INSTANTIATED_'+s.op);
                const scope={releaseId:'f'.repeat(64),operation:spec.operation,mode:'public-accepted',builds:[{
                  platform:spec.platform,buildId:spec.buildId,productV2EvidenceSha256:'a'.repeat(64)}]};
                const ready={kind:'SCOPED_PLACEMENT_RUNTIME_READY',...scope,writerAuthorized:false};
                if(!client.placementReadyOk(ready,scope))throw Error('CORRECT_SCOPE_HANDSHAKE_REJECTED');
                for(const forged of [
                  {...ready,operation:otherSpec.operation},
                  {...ready,writerAuthorized:true},
                  {...ready,builds:[{...ready.builds[0],platform:otherSpec.platform,buildId:otherSpec.buildId}]},
                  {...ready,releaseId:'0'.repeat(64)},
                  {...ready,scopedEditAuthorized:true}
                ])if(!client.placementReadyOk(forged,scope))denied++;
                return {denied,workers:window.__qrwProductWorkers,scope:spec.operation}
              },{s,other});
              assert.equal(check.denied,7,'mount+port+5 forged handshakes denied');
              assert.equal(check.workers,0);routes++;offDenied+=2;forgedReadyDenied+=5;
            }
            await page.goto(origin+'/test-qrw-appearance-union/');
            await page.waitForFunction(()=>!!window.__qrw1973,{},{timeout:30000});
            const result=await page.evaluate(()=>window.__qrw1973);
            if(result.kind!=='QA_RESULT'){console.log('QRW1973_WORKER_RED '+JSON.stringify(result));throw Error(result.error||'wrong result')}
            assert.deepEqual(result.fourScopes,['eyecolor2','eyecolor2-switch','makeup-color1','makeup-color1-switch']);
            assert.equal(result.positives,8);assert.equal(result.negatives,96);
            assert.equal(result.wrongBuild,4);assert.equal(result.cleanClosures,8);
            assert.equal(result.actualWorker,true);assert.equal(result.ownerWasmInstantiated,false);
            assert.equal(result.genuineV2,false);assert.equal(result.writerOn,false);
            assert.deepEqual(errors,[]);
            console.log('QRW1973_FOUR_ROUTE_CROSS_SCOPE_CHROME_ACTUAL_PASS '+JSON.stringify({
              routes,offDenied,forgedReadyDenied,scopeConstructorPositive:result.positives,
              workerCrossScopeNegative:result.negatives,foreignBuildDenied:result.wrongBuild,
              closed:result.cleanClosures,actualIsolatedWorker:true,productWorkerStarted:false,
              allFourAnchorsOff:true,originalProductSource:'PR1973',protectedR22:false,genuinePhysicalV2:false,signedPages:false
            }));
          }finally{await browser?.close();server.kill()}
          NODE
          node --check tests/.qa-qrw1973-union-chrome.mjs
          node tests/.qa-qrw1973-union-chrome.mjs
          git diff --exit-code -- src/lib tests/product-*.mjs

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Build two accepted distinct generated Rust feature profiles without repeating per-Op semantic QA
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '077f5e613a88b8dc49772f74a473eff3b587f103'
          for info in "eye 9c3373f5031fdbdc20ac60019807b8320b886fb9" "makeup 887894abce6da036c9b926dd6ea78af6f096aeff"; do
            read -r op sha <<<"$info"
            git cat-file -e "$sha^{commit}" || git fetch --no-tags origin "$sha"
            git worktree add --detach "/tmp/qrw1973-core-$op" "$sha"
            test "$(git -C "/tmp/qrw1973-core-$op" rev-parse HEAD)" = "$sha"
            cargo generate-lockfile --manifest-path "/tmp/qrw1973-core-$op/crates/ddv-save-core/Cargo.toml"
            sha256sum "/tmp/qrw1973-core-$op/crates/ddv-save-core/Cargo.lock" >"/tmp/qrw1973-$op-lock.sha"
          done
          cargo install wasm-bindgen-cli --version 0.2.105 --locked --root /tmp/qrw1973-bindgen
          for op in eye makeup; do
            case "$op" in
              eye) feature=product-steam626-eyecolor2-scoped; want=1d969d17c648cb5d3a996506eee1958eec99bf30b9130bfa1ffeaf8533f7cf08 ;;
              makeup) feature=product-steam626-makeup-color1-scoped; want=e662abbb8034046dccda4aaf04b1e167ecc67e001adfe585d6a784a8811a6d4e ;;
            esac
            manifest="/tmp/qrw1973-core-$op/crates/ddv-save-core/Cargo.toml"
            CARGO_TARGET_DIR="/tmp/qrw1973-target-$op" cargo build --locked --manifest-path "$manifest" --release --target wasm32-unknown-unknown --no-default-features --features "worker-wasm,$feature"
            wasm="/tmp/qrw1973-target-$op/wasm32-unknown-unknown/release/ddv_save_core.wasm"
            /tmp/qrw1973-bindgen/bin/wasm-bindgen "$wasm" --out-dir "/tmp/qrw1973-node-$op" --target nodejs --no-typescript
            echo "$want  /tmp/qrw1973-node-$op/ddv_save_core_bg.wasm" | sha256sum -c -
            mkdir -p "static/qa-union/$op"
            /tmp/qrw1973-bindgen/bin/wasm-bindgen "$wasm" --out-dir "static/qa-union/$op" --target web --no-typescript
            sha256sum -c "/tmp/qrw1973-$op-lock.sha"
          done
          git diff --exit-code -- src/lib tests/product-*.mjs
      - name: Actual one Chrome realm sequential two Rust Workers and strict cross-Op generated ABI rejection
        run: |
          set -euo pipefail
          mkdir -p src/routes/test-qrw-appearance-union-wasm
          cat >src/routes/test-qrw-appearance-union-wasm/+page.svelte <<'SVELTE'
          <script>
          import {onMount} from 'svelte';
          import {EYECOLOR2_RELEASE,MAKEUP_COLOR1_RELEASE} from '$lib/ddv/core/save/product-scoped-placement-release.mjs';
          import {compileVerifiedWorker} from '$lib/ddv/core/save/product-rust-wasm-candidate-loader.mjs';
          onMount(()=>{(async()=>{try{
            const get=async op=>{
              const [j,w]=await Promise.all([fetch('/qa-union/'+op+'/ddv_save_core.js'),fetch('/qa-union/'+op+'/ddv_save_core_bg.wasm')]);
              if(!j.ok||!w.ok||!w.headers.get('content-type')?.startsWith('application/wasm'))throw Error('WASM_OR_JS_MIME_DENIED_'+op);
              return{js:new Uint8Array(await j.arrayBuffer()),wasm:new Uint8Array(await w.arrayBuffer())};
            };
            const eye=await get('eye'),makeup=await get('makeup');
            const opt=(rel,other)=>({
              deniedSymbol:new RegExp('(?:preview|stage|toggle|begin|next)_steam626_'+other),
              requiredMethods:rel.methods,exactPrototype:true,exactWasmExports:rel.exports
            });
            const eOpt=opt(EYECOLOR2_RELEASE,'makeup_color1'),mOpt=opt(MAKEUP_COLOR1_RELEASE,'eyecolor2');
            const C1=await compileVerifiedWorker(eye.js,eye.wasm,eOpt);
            const C2=await compileVerifiedWorker(makeup.js,makeup.wasm,mOpt);
            const methods=C=>Object.getOwnPropertyNames(C.prototype).filter(k=>!['constructor','free','__destroy_into_raw'].includes(k));
            const a=methods(C1),b=methods(C2);
            const exportsOf=bytes=>WebAssembly.Module.exports(new WebAssembly.Module(bytes)).map(x=>x.name);
            if(a.length!==13||b.length!==13||exportsOf(eye.wasm).length!==22||exportsOf(makeup.wasm).length!==22)throw Error('ABI_COUNT_DRIFT');
            if(!a.includes('preview_steam626_eyecolor2')||a.includes('preview_steam626_makeup_color1')||
               !b.includes('preview_steam626_makeup_color1')||b.includes('preview_steam626_eyecolor2'))
              throw Error('CROSS_ABI_METHOD_LEAK');
            let opens=0,closes=0;
            for(const [C,spec] of [[C1,EYECOLOR2_RELEASE],[C2,MAKEUP_COLOR1_RELEASE]]){
              const w=new C('steam-windows','steam-full-version',spec.buildId,626,true,new Uint8Array(32).fill(7));
              opens++;if(typeof w.finish!=='function'||typeof w.close!=='function'||typeof w.append_chunk!=='function')throw Error('WORKER_ABI_UNCALLABLE');
              w.close();w.free();closes++;
            }
            let neg=0;const deny=async(fn,k)=>{try{await fn()}catch{neg++;return}throw Error('UNSAFE_ACCEPTED_'+k)};
            await deny(()=>compileVerifiedWorker(eye.js,eye.wasm,mOpt),'EYE_WASM_MAKEUP_PROFILE');
            await deny(()=>compileVerifiedWorker(makeup.js,makeup.wasm,eOpt),'MAKEUP_WASM_EYE_PROFILE');
            await deny(()=>compileVerifiedWorker(eye.js,makeup.wasm,eOpt),'CROSS_JS_EYE_MAKEUP_WASM');
            await deny(()=>compileVerifiedWorker(makeup.js,eye.wasm,mOpt),'CROSS_JS_MAKEUP_EYE_WASM');
            const injected=new TextEncoder().encode(new TextDecoder().decode(eye.js)+'\nWorkerWasmSource.prototype.qa_extra=function(){};');
            await deny(()=>compileVerifiedWorker(injected,eye.wasm,eOpt),'INJECTED_EXTRA_METHOD');
            const corrupted=makeup.wasm.slice();corrupted[0]^=255;
            await deny(()=>compileVerifiedWorker(makeup.js,corrupted,mOpt),'CORRUPT_WASM');
            window.__qrw1973Wasm={ok:true,actualGenerated:true,operations:2,workersOpened:opens,workersClosed:closes,
              methodsEye:a.length,methodsMakeup:b.length,wasmEye:exportsOf(eye.wasm).length,
              wasmMakeup:exportsOf(makeup.wasm).length,mixedOrCrossDenied:neg,sameChromeRealm:true,
              simultaneousRustSessions:0,syntheticP1gEdited:false,privatePhysicalV2:false,publicOn:false};
          }catch(e){window.__qrw1973Wasm={error:String(e?.stack||e)}}})()});
          </script>
          <p>QA-only two separate generated Rust profiles loaded into one Chrome realm</p>
          SVELTE
          cat >tests/.qa-qrw1973-generated-cross.mjs <<'NODE'
          import assert from 'node:assert/strict';
          import {chromium} from 'playwright-core';
          import {spawn,spawnSync} from 'node:child_process';
          const origin='http://127.0.0.1:4187';
          const srv=spawn('npm',['run','dev','--','--host','127.0.0.1','--port','4187','--strictPort'],
            {env:{...process.env,BASE_PATH:''},stdio:'inherit'});let browser;
          try{
            let ready=false;
            for(let i=0;i<160;i++){try{if((await fetch(origin+'/test-qrw-appearance-union-wasm/')).ok){ready=true;break}}catch{}
              await new Promise(r=>setTimeout(r,250))}
            assert.ok(ready,'Vite test route started');
            const bin=['google-chrome-stable','google-chrome','chromium'].find(x=>spawnSync('which',[x]).status===0);
            assert.ok(bin,'actual Chrome');
            browser=await chromium.launch({headless:true,executablePath:spawnSync('which',[bin],{encoding:'utf8'}).stdout.trim(),
              args:['--no-sandbox','--disable-dev-shm-usage']});
            const page=await browser.newPage({viewport:{width:390,height:844}}),errors=[];
            page.on('pageerror',e=>errors.push(String(e)));
            await page.goto(origin+'/test-qrw-appearance-union-wasm/');
            await page.waitForFunction(()=>!!window.__qrw1973Wasm,{},{timeout:60000});
            const got=await page.evaluate(()=>window.__qrw1973Wasm);
            if(got.error){console.log('QRW1973_GENERATED_UNION_RED '+got.error);throw Error(got.error)}
            assert.equal(got.ok,true);assert.equal(got.actualGenerated,true);assert.equal(got.operations,2);
            assert.equal(got.workersOpened,2);assert.equal(got.workersClosed,2);
            assert.equal(got.methodsEye,13);assert.equal(got.methodsMakeup,13);
            assert.equal(got.wasmEye,22);assert.equal(got.wasmMakeup,22);
            assert.equal(got.mixedOrCrossDenied,6);assert.equal(got.sameChromeRealm,true);
            assert.equal(got.simultaneousRustSessions,0);assert.equal(got.syntheticP1gEdited,false);
            assert.equal(got.privatePhysicalV2,false);assert.equal(got.publicOn,false);assert.deepEqual(errors,[]);
            console.log('QRW1973_FOUR_APPEARANCE_GENERATED_TWO_RUST_ABI_ISOLATION_CHROME_PASS '+JSON.stringify(got));

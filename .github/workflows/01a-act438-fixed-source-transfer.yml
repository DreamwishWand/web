name: 01A ACT425 immutable public Source transfer (no private data)
on:
  push:
    branches: ['01a/act438-fixed-source-transfer']
    paths: ['.github/workflows/01a-act438-fixed-source-transfer.yml']
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 'd2ce5efc034d52e9ed7ac5d66f12635728a8441b'
      - name: Archive exact tracked public Core and synthetic CLI tests
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 'd2ce5efc034d52e9ed7ac5d66f12635728a8441b'
          git ls-tree -r HEAD crates/ddv-save-core tests/private-collection-cli.mjs tests/private-character-skin-read.mjs tests/private-active-avatar-read.mjs > source-blobs.txt
          git archive --format=tar HEAD crates/ddv-save-core tests/private-collection-cli.mjs tests/private-character-skin-read.mjs tests/private-active-avatar-read.mjs | gzip -n > source.tar.gz
          sha256sum source.tar.gz source-blobs.txt > source.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: act425-fixed-public-source-only
          path: |
            source.tar.gz
            source-blobs.txt
            source.sha256
          retention-days: 1

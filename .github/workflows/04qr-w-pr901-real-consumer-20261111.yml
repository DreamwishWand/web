name: 04 QR-W PR901 public Rust WASM Consumer independent Chrome QA-only
on:
  pull_request:
    paths:
      - '.github/workflows/04qr-w-pr901-real-consumer-20261111.yml'
      - 'scripts/04qr-w-pr901-real-consumer-20261111.mjs'
permissions:
  contents: read
jobs:
  signed-public-rust-chrome-consumer:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Exact Source / Owner Gate / published triple-pin immutable
        run: |
          set -euo pipefail
          test -z "$(git ls-files static/worker-wasm tests/stage-f/fixtures)"
          grep -Fx 'const PRODUCT_READONLY_CONSUMER_OWNER_ENABLED=false;' src/lib/wep/steam-saved-diffgrids.consumer.worker.ts
          ! grep -F 'await import(/* @vite-ignore */ path.href)' src/lib/wep/steam-saved-diffgrids.consumer.worker.ts
          test ! -e src/lib/ddv/core/save/product-wasm-distribution-flag-on.js
      - name: Fetch accepted actual distributed HTTPS 3 Rust assets for UI integration only
        run: |
          mkdir -p static/worker-wasm
          node --input-type=module <<'NODE'
          import {writeFile} from 'node:fs/promises';
          import {createHash} from 'node:crypto';
          const origin='https://dreamwishwand.github.io';
          const names=[
           ['manifest.json',1915,'9a0515d259163ab80ba070f15918dcba1e59c3d5726c8efaeb8934ec5e5f6b50','application/json'],
           ['ddv_save_core.js',16904,'4704a19c6e2962583d03a0bf8e7d5bf5ad2a802fd664259117eff4b2bbcbac0d','text/javascript'],
           ['ddv_save_core_bg.wasm',258719,'5383f76a7228493d720e1e2734a26738d1165f92cbcfae48f3e1df5c38b10207','application/wasm']
          ];
          for(const [name,size,sha,mime] of names){
           const url=origin+'/web/worker-wasm/'+name;
           let response;
           for(let i=0;i<5;i++){
             try{response=await fetch(url,{redirect:'error',cache:'no-store'});if(response.ok)break;}catch{}
             await new Promise(r=>setTimeout(r,600));
           }
           if(response?.status!==200||response.redirected||response.url!==url)
             throw Error('LIVE_RUST_WASM_ORIGIN_STATUS_DENIED_'+name);
           const actualMime=response.headers.get('content-type')?.split(';')[0]?.trim();
           if(actualMime!==mime&&!(mime==='text/javascript'&&actualMime==='application/javascript'))
             throw Error('LIVE_RUST_WASM_MIME_DENIED_'+name);
           const bytes=Buffer.from(await response.arrayBuffer());
           if(bytes.length!==size||createHash('sha256').update(bytes).digest('hex')!==sha)
             throw Error('LIVE_RUST_WASM_SHA_SIZE_DENIED_'+name);
           await writeFile('static/worker-wasm/'+name,bytes,{flag:'wx'});
          }
          const obj=JSON.parse(await (await import('node:fs/promises')).readFile('static/worker-wasm/manifest.json','utf8'));
          if(obj.source?.commit!=='ef0372a58b9619a442c65b31cecbb88c3cca0029'||
             obj.abi?.writerAuthorized!==false||
             obj.release?.productConsumerEnabled!==false)
             throw Error('LIVE_RUST_WASM_PROTECTED_SOURCE_OR_ABI_DENIED');
          console.log('08WEB_PUBLIC_HOSTED_TRIPLE_EXACT_SHA_MIME_SOURCE_ACCEPTED_TEST_ONLY');
          NODE
      - name: Install independent Chrome driver and focused build preflight
        run: |
          npm ci --no-audit --no-fund
          npm install --no-save --package-lock=false playwright-core@1.55.0
          npm run check
      - name: Generate PUBLIC synthetic encrypted P1G locally only
        run: |
          node tests/stage-f/generate-fixture.mjs
          test -s tests/stage-f/fixtures/synthetic626-diffgrids.p1g
          test -s tests/stage-f/fixtures/expected-diffgrids.json
          test -z "$(git ls-files tests/stage-f/fixtures)"
      - name: QA-ONLY ephemeral opt-in (NEVER a product Source commit)
        run: |
          node --input-type=module <<'NODE'
          import {readFile,writeFile} from 'node:fs/promises';
          const edits=[
            ['src/lib/wep/steam-saved-diffgrids.consumer.worker.ts',[
              ['const PRODUCT_READONLY_CONSUMER_OWNER_ENABLED=false;',
               'const PRODUCT_READONLY_CONSUMER_OWNER_ENABLED=true;'],
              ['allowSyntheticFixture:false','allowSyntheticFixture:true']]],
            ['src/lib/wep/steam-saved-diffgrids-ui-client.mjs',[
              ["evidenceKind:'owner-observed-installed-steam-fullversion'",
               "evidenceKind:'ci-synthetic-fixture'"],
              ['observedOutsideSave:true','observedOutsideSave:false']]]
          ];
          for(const [name,changes] of edits){
            let file=await readFile(name,'utf8');
            for(const [before,after] of changes){
              if(file.split(before).length!==2)throw Error('TEST_ONLY_EXACT_REPLACEMENT_DENIED_'+name);
              file=file.replace(before,after);
            }
            await writeFile(name,file);
          }
          console.log('08WEB_QA_ONLY_EPHEMERAL_LOCAL_RUST_READER_ON_SYNTHETIC_NOT_COMMITTED');
          NODE
      - name: Build temporary local UI with signed real Rust byte assets
        env:
          BASE_PATH: /web
        run: |
          npm run check
          npm run build
          test -s build/worker-wasm/manifest.json
          test -s build/worker-wasm/ddv_save_core.js
          test -s build/worker-wasm/ddv_save_core_bg.wasm
          test -f build/editor/timing/index.html
          command -v google-chrome
      - name: INDEPENDENT real Chrome 8 locale 320 zoom2 manual Rust8 paging tamper CSP fail-closed
        run: node scripts/04qr-w-pr901-real-consumer-20261111.mjs
      - name: No runtime ON or original/private Save in Source or outputs
        run: |
          set -euo pipefail
          test -z "$(git ls-files static/worker-wasm tests/stage-f/fixtures)"
          ! git show HEAD:src/lib/wep/steam-saved-diffgrids.consumer.worker.ts | grep -F 'PRODUCT_READONLY_CONSUMER_OWNER_ENABLED=true'
          git show HEAD:src/lib/wep/steam-saved-diffgrids.consumer.worker.ts | grep -Fx 'const PRODUCT_READONLY_CONSUMER_OWNER_ENABLED=false;'
          ! git show HEAD:src/lib/wep/steam-saved-diffgrids-ui-client.mjs | grep -F "evidenceKind:'ci-synthetic-fixture'"
          echo 'QRW901_NEW_QA_ONLY_NEVER_MERGE_REAL_PUBLIC_BYTES_SYNTHETIC_CHROME_PRODUCT_OFF'

name: 04 QR-S PR747 independent user-handle syntax negative QA
on:
  push:
    branches: [qa/pr747-users-handle-independent-20261107]
permissions:
  contents: read
jobs:
  qr-handle:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      DATABASE_URL: ''
      SUPABASE_ACCESS_TOKEN: ''
      SUPABASE_PROJECT_ID: ''
      SUPABASE_DB_PASSWORD: ''
      PGPASSWORD: ''
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Freeze exact PR747 source and QA-only two new paths
        shell: bash
        run: |
          set -euo pipefail
          SOURCE=2e7ca39465ff908c5a483710180b26b8d37a93ea
          PARENT=01f45bd20ab98da2b6dc7c807738c20592621f47
          git merge-base --is-ancestor "$SOURCE" HEAD
          git diff --name-only "$SOURCE" HEAD | sort >/tmp/qr747-actual
          printf '%s\n' \
            .github/workflows/qr-pr747-users-handle-independent.yml \
            tests/qr-pr747-users-handle-independent.test.mjs | sort >/tmp/qr747-expected
          diff -u /tmp/qr747-expected /tmp/qr747-actual
          git diff --name-only "$PARENT" "$SOURCE" | sort >/tmp/qr747-original
          printf '%s\n' \
            docs/community/public-users-handle-security-20261107.md \
            src/lib/community/public-profile-handle-syntax.mjs \
            tests/comm-public-profile-handle-syntax.test.mjs | sort >/tmp/qr747-scope
          diff -u /tmp/qr747-scope /tmp/qr747-original
          test "$(git hash-object src/lib/community/public-profile-handle-syntax.mjs)" = 48009ce9b52ad568b9759b1d9158e4b1f4ccffb1
          test "$(git hash-object tests/comm-public-profile-handle-syntax.test.mjs)" = f9948f8a554749b9e3bdbf927329f8c696c5402e
          test "$(git hash-object docs/community/public-users-handle-security-20261107.md)" = fb4d7affaae99ebb1538f3a8aea0fec3c01dd97d
          test "$(git hash-object src/lib/community/domain.ts)" = 8ddbc9da560ad98a177e3008330ae8c48aaf5461
          test "$(git hash-object supabase/migrations/20260930025132_community_core_v0_server_rpc.sql)" = bbf9bc830440d964c5da8b3c3cac7e926d281881
          test -z "$(git diff --name-only "$SOURCE" HEAD -- src supabase docs scripts)"
          test -z "$DATABASE_URL" && test -z "$SUPABASE_ACCESS_TOKEN" && test -z "$SUPABASE_PROJECT_ID" && test -z "$SUPABASE_DB_PASSWORD" && test -z "$PGPASSWORD"
          echo QR747_FROZEN_SOURCE_3_QA_ONLY_2_NO_LEGACY_MUTATION_PASS
      - name: Independent ASCII fuzz, forged alias, Unicode, reserved and no public authorization
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/qr-pr747-users-handle-independent.test.mjs | tee /tmp/qr747-tests.log
          for marker in \
            QR747_EXACT_THREE_ADD_ONLY_LEGACY_NFKC_ORIGINAL82_UNCHANGED_PASS \
            QR747_ASCII_FUZZ_6500_RAW_CASEFOLD_GRAMMAR_ALL_AUTH_DENIED_PASS \
            QR747_ASCII128_NONASCII_BIDI_PATH_PERCENT_NESTED_ENCODING_DENIED_PASS \
            QR747_ALL_RESERVED_AND_IMPERSONATION_ALLOWED_SYNTAX_NEVER_AUTHORIZED_PASS \
            QR747_PROXY_COERCION_INHERITED_AND_FORGED_CALLER_FLAGS_DENIED_PASS \
            QR747_ASCII_LENGTH_UNDERSCORE_CASEFOLD_PRIVATE_NO_URL_REDIRECT_PASS \
            QR747_STATIC_NO_SQL_AUTH_NETWORK_LEGACY_REWRITE_OR_PUBLIC_ROUTE_PASS; do
            grep -q "$marker" /tmp/qr747-tests.log
          done
          echo QR747_INDEPENDENT_7_NEGATIVE_CASES_SYNTHETIC_ONLY_PASS
      - name: Keep public/private product flags OFF; remove ephemeral test output
        if: always()
        shell: bash
        run: |
          rm -f /tmp/qr747-actual /tmp/qr747-expected /tmp/qr747-original /tmp/qr747-scope /tmp/qr747-tests.log
          echo QR747_QA_EPHEMERAL_OUTPUT_REMOVED

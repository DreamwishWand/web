name: 08 WEB DEC-UX-49 local Moodboard non-destructive Ungroup
on:
  pull_request:
    paths:
      - 'src/routes/moodboards/+page.svelte'
      - 'src/lib/moodboards/copy.js'
      - 'tests/web-moodboard-decux49-ungroup-preserves-refs.test.mjs'
      - 'scripts/web-moodboard-decux49-ungroup-chrome.mjs'
      - '.github/workflows/08web-decux49-moodboard-ungroup.yml'
      - '.github/workflows/web-moodboard-atomic-entry.yml'
permissions:
  contents: read
jobs:
  ungroup-preserve:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - name: Changed Store-reuse non-destructive ungroup positive-negative source
        run: node --test tests/web-moodboard-decux49-ungroup-preserves-refs.test.mjs
      - name: Svelte and public route static build
        env:
          BASE_PATH: /web
        run: npm run check && npm run build
      - name: Actual Chrome 1366 and 320 local groups, backup, independent reopen and restore
        env:
          BASE_PATH: /web
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false playwright-core@1.55.0
          export CHROME_BIN="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium)"
          test -n "$CHROME_BIN"
          npm run preview -- --host 127.0.0.1 --port 4298 --strictPort >/tmp/08web-decux49-preview.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4298/web/moodboards/ >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4298/web/moodboards/ >/dev/null
          node scripts/web-moodboard-decux49-ungroup-chrome.mjs

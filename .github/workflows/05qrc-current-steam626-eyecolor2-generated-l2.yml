name: 05 QR-C ACT1555 current-main EyeColor2 generated ABI L2 (QA ONLY)
on:
  pull_request:
    paths:
      - '.github/workflows/05qrc-current-steam626-eyecolor2-generated-l2.yml'
permissions:
  contents: read
jobs:
  current-eyecolor2-generated:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_TARGET_DIR: /tmp/wand-qrc2203-cargo-target
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 05qrc-act1555-eyecolor2-current-main-generated-l2
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Exact original Source + one QA-only workflow, unchanged product Git Blobs
        shell: bash
        run: |
          set -euo pipefail
          src=e937d18ede5aa354f57d5bbdd335a01105ea2111
          test "$(git merge-base "$src" HEAD)" = "$src"
          test "$(git rev-list --count "$src"..HEAD)" = 1
          git diff --name-only "$src" HEAD >/tmp/qrc2203-actual
          printf '%s\n' '.github/workflows/05qrc-current-steam626-eyecolor2-generated-l2.yml' >/tmp/qrc2203-expected
          diff -u /tmp/qrc2203-expected /tmp/qrc2203-actual
          test "$(git diff --name-only 9157b04a92dfe203d71a9c3977e8f9f50d5ce9b8 "$src" | wc -l)" = 9
          for f in \
            crates/ddv-save-core/Cargo.toml \
            crates/ddv-save-core/src/product_eyeball_color2.rs \
            crates/ddv-save-core/src/wasm_steam626_eyecolor2.rs \
            crates/ddv-save-core/src/wasm_worker.rs \
            crates/ddv-save-core/src/worker_session.rs \
            crates/ddv-save-core/src/worker_steam626_eyecolor2.rs \
            .github/workflows/core-product-session-boundary.yml \
            .github/workflows/09p-bamboo-public-pages-sealer-source.yml \
            tests/09p-bamboo-public-pages-sealer.test.mjs; do
            test "$(git rev-parse "HEAD:$f")" = "$(git rev-parse "$src:$f")"
          done
          echo QRC2203_FIXED_SOURCE_NINE_BLOBS_QA_ONLY_ONE_FILE_PASS
      - name: Reuse immutable accepted 05QR-C source fixture/test on new Worker core
        shell: bash
        run: |
          set -euo pipefail
          old=9c3373f5031fdbdc20ac60019807b8320b886fb9
          git cat-file -e "$old^{commit}" || git fetch --no-tags origin "$old"
          mkdir -p tests/qa
          git show "$old:tests/qa/qrc1918-steam-eyecolor2-generated.cjs" > tests/qa/qrc1918-steam-eyecolor2-generated.cjs
          test "$(git hash-object tests/qa/qrc1918-steam-eyecolor2-generated.cjs)" = 449679d2e5eed4187de6e9c31e255276740a72a9
          python3 - <<'PY'
          from pathlib import Path
          p=Path('crates/ddv-save-core/src/product_eyeball_color2.rs')
          s=p.read_text()
          assert 'qa1918_emit_synthetic_generated_eyecolor2' not in s
          assert s.rstrip().endswith('}')
          insert="""
           #[cfg(feature="product-steam626-eyecolor2-scoped")]
           #[test]
           #[ignore="Independent generated ABI synthetic fixture, not a genuine Save"]
           fn qa1918_emit_synthetic_generated_eyecolor2(){
            let d=doc();let raw=serde_json::to_vec(&d).unwrap();
            assert_eq!(d["GameInfo"]["Version"],json!(626));
            assert_eq!(d["Player"]["MaleAvatar"]["Eyeball"]["ColorIndex2"],json!(64));
            assert!(raw.len()<1024*1024);
            std::fs::write("/tmp/qrc1918-eyecolor2-source.json",&raw).unwrap();
            println!("QRC2203_SYNTHETIC_FIXTURE_ONLY bytes={}",raw.len());
           }
          """
          i=s.rfind('}')
          p.write_text(s[:i]+insert+s[i:])
          PY
          test "$(git rev-parse HEAD:crates/ddv-save-core/src/product_eyeball_color2.rs)" = 717f8f7a2993a80a357928e67bf1066c69e4f491
          cp scripts/wasm-distribution/approved-Cargo.lock crates/ddv-save-core/Cargo.lock
          test "$(git hash-object scripts/wasm-distribution/approved-Cargo.lock)" = b667b42cfef2032c2925be7b2aa9b7142bff4b52
          sha256sum crates/ddv-save-core/Cargo.lock > /tmp/qrc2203-lock.sha
          cargo test --locked --manifest-path crates/ddv-save-core/Cargo.toml --features product-steam626-eyecolor2-scoped --lib qa1918_emit_synthetic_generated_eyecolor2 -- --ignored --nocapture
          test -s /tmp/qrc1918-eyecolor2-source.json
          echo QRC2203_HISTORICAL_QA_REUSE_ON_CHANGED_CURRENT_SOURCE
      - name: Real generated JS/WASM OFF vs OWN vs HAIR MIXED vs MAKEUP/SWITCH MIXED
        shell: bash
        run: |
          set -euo pipefail
          cargo install wasm-bindgen-cli --version 0.2.105 --locked --root /tmp/wand-qrc2203-bindgen
          for mode in off own mixed makeupswitch; do
            case "$mode" in
              off) features=worker-wasm,indexed-read ;;
              own) features=worker-wasm,product-steam626-eyecolor2-scoped ;;
              mixed) features=worker-wasm,product-steam626-eyecolor2-scoped,product-steam626-hair-scoped ;;
              makeupswitch) features=worker-wasm,product-steam626-eyecolor2-scoped,product-steam626-makeup-color1-scoped,product-switch626-eyecolor2-internal ;;
            esac
            cargo build --locked --manifest-path crates/ddv-save-core/Cargo.toml --release --target wasm32-unknown-unknown --no-default-features --features "$features"
            /tmp/wand-qrc2203-bindgen/bin/wasm-bindgen "$CARGO_TARGET_DIR/wasm32-unknown-unknown/release/ddv_save_core.wasm" --out-dir "/tmp/qrc1918-$mode" --target nodejs --no-typescript
          done
          sha256sum -c /tmp/qrc2203-lock.sha
          node --check tests/qa/qrc1918-steam-eyecolor2-generated.cjs
          node tests/qa/qrc1918-steam-eyecolor2-generated.cjs
          node <<'JS'
          const assert=require('node:assert/strict'),fs=require('node:fs');
          const root='/tmp/qrc1918-',s='makeupswitch';
          const W=require(root+s+'/ddv_save_core.js').WorkerWasmSource;
          const js=Object.getOwnPropertyNames(W.prototype);
          const wasm=WebAssembly.Module.exports(new WebAssembly.Module(fs.readFileSync(root+s+'/ddv_save_core_bg.wasm'))).map(x=>x.name);
          const five=['preview','stage','toggle','begin','next'].map(x=>
            ({preview:'preview_steam626_eyecolor2',stage:'stage_steam626_eyecolor2',toggle:'toggle_steam626_eyecolor2',begin:'begin_steam626_eyecolor2_output',next:'next_steam626_eyecolor2_output_chunk'})[x]);
          for(const name of five){
            assert.equal(js.includes(name),false,name+' JS must be absent in mixed');
            assert.equal(wasm.includes('workerwasmsource_'+name),false,name+' WASM must be absent in mixed');
          }
          console.log('QRC2203_REAL_GENERATED_MAKEUP_SWITCH_MIXED_5_METHODS_DENIED_PASS');
          JS
          echo QRC2203_SOURCE_CHANGED_GENERATED_OWN_OFF_MIXED_CAS_REPLAY_INDEPENDENT_REOPEN_PASS

name: 09 INT R17 Preset published Storage discard race source audit
on:
  push:
    branches:
      - validation/09int-r17-owner133-preset-storage-discard-race-20261026
permissions:
  contents: read
jobs:
  bounded-storage-race-source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pinned Owner133 WEP publish/discard source order and mock interleaving
        run: node --test tests/09int-r17-preset-storage-publish-discard-source-race.test.mjs
      - name: Classification boundary
        run: echo 'HIGH_CONFIDENCE_SOURCE_ORDERING_ONLY; NO REAL EDGE, POSTGRES TRANSACTION OR STORAGE PROVIDER CONCURRENCY ACCEPTANCE'

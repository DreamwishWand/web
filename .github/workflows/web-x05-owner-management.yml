name: WEB X05 private owner management acceptance
on:
  push:
    branches:
      - 'web/x05-private-dreamsnaps-owner-management-*'
  pull_request:
    paths:
      - 'src/lib/dreamsnaps/owner-management*'
      - 'src/routes/dreamsnaps/my/**'
      - 'tests/dreamsnaps-owner-management-private.test.mjs'
      - 'scripts/dreamsnaps-owner-browser-acceptance.mjs'
      - '.github/workflows/web-x05-owner-management.yml'
permissions:
  contents: read
concurrency:
  group: web-x05-owner-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: node --test tests/dreamsnaps-owner-management-private.test.mjs
      - run: npm run check
      - run: npm run build
      - name: Protected Owner/Community code stays immutable after QR-accepted PR297
        shell: bash
        run: |
          set -euo pipefail
          BASE=4743a0b46f88a3797432cd5738da499221f8e055
          git merge-base --is-ancestor "$BASE" HEAD
          # The repaired Auth + Owner OFF consumer at PR297 is the new accepted
          # ancestor. Preserve every product/authority implementation byte.
          git diff --exit-code "$BASE" HEAD -- supabase/ src/lib/community/ src/lib/dreamsnaps/ src/routes/dreamsnaps/community/ src/routes/creator/ src/routes/dreamsnaps/my/+page.svelte src/routes/dreamsnaps/my/manage/+page.svelte
          test "$(git hash-object src/lib/community/staging-http-client.ts)" = 593b47818fe31356568e0ac688bc4ae8ef375225
          test "$(git hash-object src/lib/dreamsnaps/source153-owner-consumer-v2.js)" = f981b7596711b47bceb2fa79a2191e79e8f1b459
          test "$(git hash-object src/lib/dreamsnaps/source153-owner-browser-e2.js)" = 7468f9550e3e196d28b84c246ff529d2c5daa66e
          test "$(git hash-object src/lib/dreamsnaps/owner-read-revalidation.js)" = bbf3e99883cb438629f732f5c09534a86a48abc1
          test "$(git hash-object src/lib/dreamsnaps/owner-product-readonly.js)" = 5dcc3e565284011e64a87749b4887743fb0bd6d2
          test "$(git hash-object src/lib/community/browser-client.ts)" = 27716c4e89dcb01aacbf75ea63173f64328c2b93
          grep -q 'OWNER_MANAGEMENT_ENABLED = false' src/lib/dreamsnaps/owner-management.js
          grep -q 'SOURCE153_OWNER_V2_LIVE_ENABLED = false' src/lib/dreamsnaps/source153-owner-consumer-v2.js
          grep -q 'SOURCE153_BROWSER_E2_PRODUCTION_ENABLED = false' src/lib/dreamsnaps/source153-owner-browser-e2.js
          grep -q 'OWNER_REVALIDATION_PRODUCTION_ENABLED = false' src/lib/dreamsnaps/owner-read-revalidation.js
          grep -q 'OWNER_PRODUCT_READONLY_ENABLED = false' src/lib/dreamsnaps/owner-product-readonly.js
          grep -q 'OWNER_PRODUCT_MANAGED_INGRESS_ACCEPTED = false' src/lib/dreamsnaps/owner-product-readonly.js
          # Only this test fixture and the two workflow guards may change.
          git diff --name-only "$BASE" HEAD > /tmp/owner-guard-maintenance-diff
          test "$(wc -l < /tmp/owner-guard-maintenance-diff)" -eq 3
          while IFS= read -r p; do
            case "$p" in
              .github/workflows/web-x05-owner-management.yml|.github/workflows/web-owner-product-readonly-off.yml|scripts/dreamsnaps-owner-browser-acceptance.mjs) ;;
              *) echo UNEXPECTED_GUARD_MAINTENANCE_CHANGE >&2; exit 1 ;;
            esac
          done < /tmp/owner-guard-maintenance-diff
          echo PR297_ACCEPTED_OFF_GUARD_RECONCILED
  chrome:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm install --no-save --package-lock=false playwright-core@1.55.0
      - name: Find actual installed Chrome
        id: chrome
        shell: bash
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          echo "bin=$CHROME_BIN" >> "$GITHUB_OUTPUT"
          "$CHROME_BIN" --version
      - name: Serve disposable UI with synthetic config only
        env:
          VITE_SUPABASE_URL: https://x05-synthetic.invalid
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_X05_FAKE_TEST_ONLY_NO_SECRET
        run: |
          set -euo pipefail
          npm run dev -- --host 127.0.0.1 --port 4175 >/tmp/x05-owner-vite.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4175/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/x05-owner-vite.log
          exit 1
      - name: Real Chrome anonymous and mock session, eight languages, 320px
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.bin }}
          OWNER_TEST_BASE_URL: http://127.0.0.1:4175
        run: node scripts/dreamsnaps-owner-browser-acceptance.mjs
      - name: Vite diagnostic
        if: failure()
        run: cat /tmp/x05-owner-vite.log || true
      - name: Browser results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-x05-private-owner-browser
          path: .artifacts/dreamsnaps-owner-browser/
          if-no-files-found: error

name: 04 QR-S ACT1254 PR1708 placement proof union L2 (QA ONLY)
on:
  pull_request:
    paths:
      - '.github/workflows/04qrs-act1254-pr1708-placement-union.yml'
permissions:
  contents: read
jobs:
  focus:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_TARGET_DIR: /tmp/wand-union-target
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 64d1894547c3730fef43b39a4c5864d77ce3fc50
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
          targets: wasm32-unknown-unknown
      - name: Actual two dedicated subjects, cross-scope and anchor isolation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 64d1894547c3730fef43b39a4c5864d77ce3fc50
          test "$(git rev-parse HEAD:scripts/readonly-release/scoped-placement-proof.mjs)" = 9cc868ec13c66b8cb2530f9e7c151317fff40a14
          test "$(git rev-parse HEAD:src/lib/ddv/core/save/product-scoped-placement-release.mjs)" = 09ac1481977d3034e13dda046f00e5dbaf6bf1e9
          test "$(git rev-parse HEAD:src/lib/ddv/core/save/product-scoped-sr03-release-anchor.mjs)" = 66f9bb63da4bd7d6f8f43aeac3adf4aa7df2c751
          test "$(git rev-parse HEAD:src/lib/ddv/core/save/product-scoped-comp03-spatial-release-anchor.mjs)" = 3dbd5b6bd2268a3a42589364fa06ab09da84565b
          test "$(git rev-parse HEAD:src/lib/ddv/core/save/product-scoped-placement-release-anchor.mjs)" = 8bf869bf71546c467194483955e256cbe104c312
          test "$(git rev-parse HEAD:scripts/readonly-release/seal.mjs)" = 5b86ff1cf2dc009ba1733bf213e4cb979bf500ec
          test "$(git rev-parse HEAD:crates/ddv-save-core)" = c93264e1c060fa1dacba71ad2cd72628ef6dbbc4
          test "$(git rev-parse HEAD:scripts/wasm-distribution/approved-Cargo.lock)" = b667b42cfef2032c2925be7b2aa9b7142bff4b52
          cp scripts/wasm-distribution/approved-Cargo.lock crates/ddv-save-core/Cargo.lock
          cargo install wasm-bindgen-cli --version 0.2.105 --locked --root /tmp/wand-union-tools
          for pair in sr03:product-steam626-sr03-scoped spatial:product-steam626-comp03-spatial-preview; do
            name="${pair%%:*}"; feature="${pair#*:}"
            cargo build --locked --manifest-path crates/ddv-save-core/Cargo.toml --release --target wasm32-unknown-unknown --no-default-features --features "$feature,worker-wasm"
            /tmp/wand-union-tools/bin/wasm-bindgen "$CARGO_TARGET_DIR/wasm32-unknown-unknown/release/ddv_save_core.wasm" --out-dir "/tmp/wand-union-$name" --target web --no-typescript
          done
          cat > qa-placement-union.mjs <<'EOF'
          import assert from 'node:assert/strict';
          import {createHash} from 'node:crypto';
          import {readFileSync,copyFileSync} from 'node:fs';
          import {execFileSync} from 'node:child_process';
          import {pathToFileURL} from 'node:url';
          import {ACTIVE_RELEASE_TUPLE as tuple} from './src/lib/ddv/core/save/product-rust-wasm-release-trust.mjs';
          import {SR03_RELEASE as sr,COMP03_SPATIAL_RELEASE as sp,COMP03_RELEASE as comp,VASE_ADD_RELEASE as vase,placementAnchorShapeOk,placementIdentityText,validatePlacementAnchor} from './src/lib/ddv/core/save/product-scoped-placement-release.mjs';
          import {fixedPlacementProofScope as fixed,inspectPlacementSubjects as inspect,privatePlacementIdentity as identity,replacePrivatePlacementAnchor as replace} from './scripts/readonly-release/scoped-placement-proof.mjs';
          const source='64d1894547c3730fef43b39a4c5864d77ce3fc50',sha=b=>createHash('sha256').update(b).digest('hex'),cargo=readFileSync('crates/ddv-save-core/Cargo.toml'),lock=readFileSync('crates/ddv-save-core/Cargo.lock'),toolchain=execFileSync('rustc',['--version','--verbose'],{encoding:'utf8'});
          assert.equal(sha(lock),'e58486d673df79bfe7e72b80449e39389e57010fe4051edcdcff9b53c2da898c');
          let pos=0,neg=0;const no=f=>{assert.throws(f);neg++};
          const pack=(s,j,w,patch={})=>[Buffer.from(JSON.stringify({contract:s.prefix+'.runtime@1',operation:s.operation,source:{repository:tuple.repository,commit:source,cargoTomlSha256:sha(cargo),cargoLockSha256:sha(lock),cargoLockOrigin:'approved-repository-lock',wasmBindgen:'0.2.105',wasmTarget:'wasm32-unknown-unknown',profile:'release',features:s.features,defaultFeatures:false,toolchain},assets:{js:{path:'ddv_save_core.js',sizeBytes:j.length,sha256:sha(j)},wasm:{path:'ddv_save_core_bg.wasm',sizeBytes:w.length,sha256:sha(w)}},abi:{exportClass:'WorkerWasmSource',methods:s.methods,writerAuthorized:false,originalOverwriteAuthorized:false},release:{productConsumerEnabled:false,writerAuthorized:false,autoUpload:false,originalOverwriteAuthorized:false},...patch})),j,w];
          const common=['append_chunk','finish','read_core_version_witness','issue_typed_cursor','read_typed_page','issue_saved_diffgrids_typed_cursor','read_saved_diffgrids_typed_page'];
          const tail=['toggle_scoped_edit','begin_scoped_edit_output','next_scoped_edit_output_chunk','close'];
          const r=[];
          for(const [s,name,own,extra,marker,file] of [[sr,'sr03','sr03',[], 'PROTECTED_SR03_RELEASE_ANCHOR','product-scoped-sr03-release-anchor.mjs'],[sp,'spatial','comp03',['preview_steam626_comp03_spatial'],'PROTECTED_COMP03_SPATIAL_RELEASE_ANCHOR','product-scoped-comp03-spatial-release-anchor.mjs']]){
            const dir='/tmp/wand-union-'+name,j=readFileSync(dir+'/ddv_save_core.js'),w=readFileSync(dir+'/ddv_save_core_bg.wasm');
            const methods=[...common,'preview_steam626_'+own,'stage_steam626_'+own,...extra,...tail].sort();
            const exports=['memory','__wbg_workerwasmsource_free','workerwasmsource_new',...methods.map(n=>'workerwasmsource_'+n),'__wbindgen_externrefs','__wbindgen_malloc','__externref_table_dealloc','__wbindgen_realloc','__wbindgen_free','__wbindgen_start'].sort();
            copyFileSync(dir+'/ddv_save_core.js',dir+'/glue.mjs');const cls=(await import(pathToFileURL(dir+'/glue.mjs').href)).WorkerWasmSource;
            assert.deepEqual(Object.getOwnPropertyNames(cls.prototype).filter(n=>!['constructor','free','__destroy_into_raw'].includes(n)).sort(),methods);
            assert.deepEqual(WebAssembly.Module.exports(new WebAssembly.Module(w)).map(x=>x.name).sort(),exports);assert.deepEqual(s.methods.slice().sort(),methods);assert.deepEqual(s.exports.slice().sort(),exports);assert.equal(fixed(s.key),s);
            const b=pack(s,j,w),p=inspect(s,b,source),a=identity(s,p,'http://127.0.0.1:4188');
            for(const [i,k] of ['manifest','js','wasm'].entries()){assert.equal(p[k+'Sha256'],sha(b[i]));assert.equal(p[k+'SizeBytes'],b[i].length)}pos++;
            assert.equal(await validatePlacementAnchor(s,a),true);assert.equal(a.releaseId,sha(Buffer.from(placementIdentityText(s,a))));assert.equal(a.builds[0].productV2EvidenceSha256,null);pos++;
            const prior=readFileSync('src/lib/ddv/core/save/'+file,'utf8'),m='export const '+marker+'=null;',out=replace(s,prior,a),[before,after]=prior.split(m);assert.ok(out.startsWith(before)&&out.endsWith(after));assert.ok(out.includes('export const '+marker+'=Object.freeze('));pos++;
            for(const x of [prior.replace(m,''),prior+m,out])no(()=>replace(s,x,a));no(()=>replace(s,prior,{...a,releaseId:'f'.repeat(64)}));no(()=>replace(s,prior,{...a,mode:'public-accepted'}));
            for(const token of ['stage_steam626_chest','preview_switch626_vase_add','stage_fixed_collection','private_native','dev_stage'])no(()=>inspect(s,pack(s,Buffer.concat([j,Buffer.from('\n// '+token)]),w),source));
            const mm=JSON.parse(b[0]);for(const patch of [{operation:'foreign'},{source:{...mm.source,cargoLockSha256:'0'.repeat(64)}},{abi:{...mm.abi,writerAuthorized:true}},{release:{...mm.release,productConsumerEnabled:true}}])no(()=>inspect(s,pack(s,j,w,patch),source));
            no(()=>inspect(s,[b[0],Buffer.concat([j,Buffer.from(' ')]),w],source));no(()=>identity(s,p,tuple.origin));
            r.push({s,j,w,b,p,a,prior,methods,exports});console.log('UNION_GENERATED_SUBJECT',JSON.stringify({key:s.key,methods:methods.length,exports:exports.length,js:sha(j),wasm:sha(w),manifest:p.manifestSha256}));
          }
          for(const [x,y] of [[r[0],r[1]],[r[1],r[0]]]){
            no(()=>inspect(x.s,y.b,source));no(()=>inspect(x.s,pack(x.s,y.j,y.w),source));no(()=>inspect(x.s,pack(x.s,x.j,y.w),source));no(()=>inspect(x.s,pack(x.s,y.j,x.w),source));no(()=>replace(x.s,y.prior,x.a));no(()=>replace(x.s,x.prior,y.a));assert.equal(placementAnchorShapeOk(x.s,y.a),false);neg++;
            for(const token of y.methods.filter(n=>/^(preview|stage)_/.test(n)))no(()=>inspect(x.s,pack(x.s,Buffer.concat([x.j,Buffer.from('\n// '+token)]),x.w),source));
          }
          const legacy=readFileSync('src/lib/ddv/core/save/product-scoped-placement-release-anchor.mjs','utf8');for(const x of r){no(()=>replace(x.s,legacy,x.a));for(const old of [comp,vase]){assert.equal(fixed(old.key),old);no(()=>inspect(old,x.b,source));assert.equal(placementAnchorShapeOk(old,x.a),false);neg++}}
          console.log('ACT1254_PR1708_PLACEMENT_UNION_L2_PASS',JSON.stringify({pos,neg,actualGeneratedWasm:true,approvedLock:true,actualSignature:false,publicGrant:false,source}));
          EOF
          node qa-placement-union.mjs
          test -z "$(git diff --name-only HEAD -- static build src/lib/ddv/core/save)"

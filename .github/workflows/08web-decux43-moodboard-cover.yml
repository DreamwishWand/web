name: 08 WEB DEC-UX-43 local Moodboard cover and management gate
on:
  pull_request:
    paths:
      - 'src/lib/moodboards/cover-preview.mjs'
      - 'src/lib/moodboards/copy.js'
      - 'src/routes/moodboards/+page.svelte'
      - 'tests/web-moodboard-cover-preview.test.mjs'
      - 'scripts/web-moodboard-cover-preview-chrome.mjs'
      - '.github/workflows/08web-decux43-moodboard-cover.yml'
permissions:
  contents: read
jobs:
  moodboard-cover:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - name: Scoped deterministic cover, eight locales and targeted local deletion
        run: node --test tests/web-moodboard-cover-preview.test.mjs
      - name: Svelte TypeScript and static build
        env:
          BASE_PATH: /web
        run: npm run check && npm run build
      - name: Actual browser 1366 and 320 local Moodboard cover, manage, backup and target deletion
        shell: bash
        env:
          BASE_PATH: /web
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false playwright-core@1.55.0
          export CHROME_BIN="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium)"
          test -n "$CHROME_BIN"
          npm run preview -- --host 127.0.0.1 --port 4298 --strictPort >/tmp/08web-decux43-preview.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4298/web/moodboards/ >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4298/web/moodboards/ >/dev/null
          node scripts/web-moodboard-cover-preview-chrome.mjs

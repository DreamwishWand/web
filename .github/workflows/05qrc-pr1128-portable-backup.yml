name: 05 QR-C PR1128 independent portable backup
on:
  pull_request:
    paths:
      - 'crates/ddv-save-core/tests/qa_pr1128_portable_backup.rs'
      - '.github/workflows/05qrc-pr1128-portable-backup.yml'
permissions:
  contents: read
jobs:
  independent:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
          targets: wasm32-unknown-unknown
      - name: Exact fixed source and QA-only additions
        run: |
          source=31afcc0d864e6792ad2dcb36626ef8926842ac36
          test "$(git merge-base "$source" HEAD)" = "$source"
          test "$(git diff --name-only "$source" HEAD | wc -l)" -eq 2
          test "$(git diff --diff-filter=A --name-only "$source" HEAD | wc -l)" -eq 2
          test "$(git rev-parse HEAD:crates/ddv-save-core/src/portable_backup.rs)" = f450062c046a2b68f5529f49e67c1ed309e1671f
          test "$(git rev-parse HEAD:crates/ddv-save-core/src/lib.rs)" = 6e47eb5d2d2c829c0b0fe6a741db550b1faf70e5
          test "$(git rev-parse HEAD:scripts/wasm-distribution/approved-Cargo.lock)" = b667b42cfef2032c2925be7b2aa9b7142bff4b52
      - name: Locked independent parser and boundary tests
        run: |
          cp scripts/wasm-distribution/approved-Cargo.lock crates/ddv-save-core/Cargo.lock
          echo 'e58486d673df79bfe7e72b80449e39389e57010fe4051edcdcff9b53c2da898c  crates/ddv-save-core/Cargo.lock' | sha256sum -c -
          cargo test --locked --manifest-path crates/ddv-save-core/Cargo.toml --no-default-features --test qa_pr1128_portable_backup -- --nocapture
          cargo check --locked --manifest-path crates/ddv-save-core/Cargo.toml --target wasm32-unknown-unknown --no-default-features --features worker-wasm,indexed-read

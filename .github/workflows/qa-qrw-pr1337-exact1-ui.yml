          const script="(async()=>{\n const q=()=>window.__qa,el=s=>document.querySelector(s),need=(v,k)=>{if(!v)throw Error('ACT990_'+k)};\n const wait=async(fn,k)=>{for(let i=0;i<1000;i++){if(q()?.error)throw Error(q().error);if(fn())return;await new Promise(r=>setTimeout(r,25))}throw Error('ACT990_WAIT_'+k+' '+document.body.textContent.slice(0,260))};\n const panel=()=>el('[data-dev-amount-editor]'),input=()=>el('#dev-amount-p1g'),open=()=>el('[data-dev-open]'),close=()=>el('[data-dev-close]'),err=()=>el('[data-dev-error]');\n const noOutput=()=>!el('[data-backup-verified],[data-dev-preview],[data-dev-edited-copy],[data-dev-download-backup],[data-dev-download-edited]');\n await wait(()=>q()?.ready&&input()&&open(),'MOUNT');panel().open=true;\n const profile=q().profile,chest=profile==='linked-crop-chest48';\n const [p,j]=await Promise.all([fetch('/qa-act990/'+profile+'.p1g'),fetch('/qa-act990/'+profile+'.json')]);\n need(p.ok&&j.ok,'FIXTURE');const bytes=new Uint8Array(await p.arrayBuffer()),meta=await j.json();\n const pick=(name='synthetic.p1g')=>{const d=new DataTransfer();d.items.add(new File([bytes],name));input().files=d.files;input().dispatchEvent(new Event('change',{bubbles:true}))};\n const attest=()=>{const s=el('#dev-amount-sha');s.value=meta.originalSha256;s.dispatchEvent(new Event('input',{bubbles:true}));const c=el('.check input');c.checked=true;c.dispatchEvent(new Event('change',{bubbles:true}))};\n const click=s=>{const x=el(s);need(x&&!x.disabled,'CLICK_'+s);x.click()};\n const settled=()=>input()&&!input().disabled;\n need(panel().dataset.productWriter==='off'&&panel().dataset.publicRoute==='off','FLAGS');\n let before=q().closeSettled;q().mode='reject';pick();await wait(()=>q().closeSettled===before+1&&settled()&&err()&&close(),'CLOSE_REJECT');\n need(!open()&&q().opens===0&&noOutput(),'REJECT_NO_OPEN');\n before=q().closeSettled;q().mode='forged';click('[data-dev-close]');await wait(()=>q().closeSettled===before+1&&settled()&&err()&&close(),'FORGED_ACK');\n need(!open()&&q().opens===0&&noOutput(),'FORGED_NO_OPEN');\n before=q().closeSettled;q().mode='ok';click('[data-dev-close]');await wait(()=>q().closeSettled===before+1&&settled()&&open(),'RETRY_CLOSE');\n need(open().disabled&&input().value==='','RETRY_CLOSED');\n q().holdClose=true;pick();await wait(()=>q().closeHeld&&input().disabled,'PENDING_CLOSE');\n need(open().disabled&&noOutput()&&input().value==='','PENDING_BARRIER');\n pick('wrong.p1g');open().dispatchEvent(new MouseEvent('click',{bubbles:true}));\n need(q().opens===0,'PENDING_NO_OPEN');q().closeHeld();\n await wait(()=>settled()&&open(),'SELECTION_SETTLED');attest();await wait(()=>!open().disabled,'ATTEST');open().click();\n await wait(()=>el('[data-dev-backup]:not([disabled])'),'OPEN');need(q().opens===1,'ONE_OPEN');\n click('[data-dev-backup]');await wait(()=>el('#dev-amount-target')&&el('#dev-amount-new')&&el('[data-dev-stage]:not([disabled])'),'TARGETS');\n const target=el('#dev-amount-target'),amount=()=>el('#dev-amount-new');\n need(target.options.length===2&&amount().readOnly&&amount().hasAttribute('data-scoped-exact-one'),'EXACT_MODE');\n need(Number(amount().value)===(chest?49:2),'FIRST_PROPOSAL');\n target.selectedIndex=1;target.dispatchEvent(new Event('change',{bubbles:true}));\n await wait(()=>Number(amount().value)===(chest?49:6),'SECOND_PROPOSAL');\n // DOM tamper must not change the internally computed exact-one command.\n amount().value='1';amount().dispatchEvent(new Event('input',{bubbles:true}));\n click('[data-dev-stage]');await wait(()=>el('[data-dev-preview]'),'STAGE');\n const cmd=q().commands[0]?.[0];\n need(q().commands.length===1&&q().commands[0].length===1&&cmd.newAmount===(chest?49:6)&&cmd.expectedOldAmount===(chest?50:7),'EXACT_COMMAND');\n need(chest?cmd.containerId===12&&cmd.slotIndex===1&&cmd.expectedItemId===30200000:cmd.inventoryId===0&&cmd.canonicalItemId===40000050,'SELECTED_TARGET');\n click('[data-dev-undo]');await wait(()=>el('[data-dev-redo]'),'UNDO');click('[data-dev-redo]');\n await wait(()=>el('[data-dev-export]:not([disabled])'),'REDO');\n let downloadBefore=q().downloadDone;click('[data-dev-download-backup]');await wait(()=>q().downloadDone===downloadBefore+1&&el('[data-dev-download-backup]:not([disabled])'),'BACKUP_DOWNLOAD');\n click('[data-dev-export]');await wait(()=>el('[data-dev-edited-copy]')&&q().exported,'EXPORT');\n need(q().exported.freshWorkerReopenVerified===true&&q().exported.independentProcessReopenVerified===false&&q().exported.writerAuthorized===false,'REOPEN');\n downloadBefore=q().downloadDone;click('[data-dev-download-edited]');await wait(()=>q().downloadDone===downloadBefore+1&&el('[data-dev-download-edited]:not([disabled])'),'EDITED_DOWNLOAD');\n // Fail actual active-session cleanup (wrapper does not forward Close).\n before=q().closeSettled;q().mode='reject';click('[data-dev-close]');await wait(()=>q().closeSettled===before+1&&settled()&&err()&&close(),'ACTIVE_CLOSE_REJECT');\n need(!open()&&noOutput()&&q().opens===1,'ACTIVE_REVOKED');\n q().mode='ok';q().holdClose=true;click('[data-dev-close]');\n await wait(()=>q().closeHeld&&input().disabled,'ACTIVE_CLOSE_HELD');\n need(noOutput()&&q().opens===1,'STALE_OUTPUT');\n pick('wrong.p1g');q().closeHeld();await wait(()=>settled()&&open(),'ACTIVE_RETRY');\n need(open().disabled&&input().value===''&&noOutput(),'FINAL_CLOSED');\n return {pass:true,profile,opens:q().opens,commands:q().commands.length,closes:q().closes,backup:q().backup.backupName,edited:q().exported.editedCopyName,editedSha:q().exported.editedSha256,sourceSha:meta.originalSha256,productWriter:false};\n})()";
          try{

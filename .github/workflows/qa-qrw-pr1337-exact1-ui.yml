          git show 89e9923102fc2991f933cdc31803afa369279374:crates/ddv-save-core/src/product_amount_scoped.rs > 'crates/ddv-save-core/src/product_amount_scoped.rs'
          test "$(git hash-object 'crates/ddv-save-core/src/product_amount_scoped.rs')" = d62bccfcd2f13a184dbe9b3061cda3e616b21ad7

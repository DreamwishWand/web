          test "$(git rev-parse HEAD:src/lib/i18n/runtime.js)" = faed7e6815ad7e3a9b18ae79ff2726ba2bfcc42c
          ! git cat-file -e HEAD:crates/ddv-save-core/data/steam626-amount-layout-reference.jsonl 2>/dev/null
          test "$(git rev-parse 89e9923102fc2991f933cdc31803afa369279374:crates/ddv-save-core/data/steam626-amount-layout-reference.jsonl)" = 82b9e1c3f53ffce85f2277a81d0cab195be1aff8
          git show 89e9923102fc2991f933cdc31803afa369279374:crates/ddv-save-core/data/steam626-amount-layout-reference.jsonl > 'crates/ddv-save-core/data/steam626-amount-layout-reference.jsonl'

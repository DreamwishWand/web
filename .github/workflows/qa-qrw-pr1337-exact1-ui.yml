          <script>
           import {onMount} from 'svelte';
           import LocalAmountEditorDev from '$lib/dev/LocalAmountEditorDev.svelte';
           let adapter=null;
           onMount(()=>{
            const profile=new URL(location.href).searchParams.get('profile');
            const w=new Worker(new URL('./qa.worker.mjs',import.meta.url),{type:'module'});
            let seq=0;const pending=new Map();
            const q={profile,mode:'ok',holdClose:false,closeHeld:null,opens:0,closes:0,closeSettled:0,downloadDone:0,commands:[],backup:null,exported:null,ready:false};
            window.__qa=q;
            w.onmessage=({data:d})=>{const p=pending.get(d.id);if(!p)return;pending.delete(d.id);d.ok?p.resolve(d.value):p.reject(Error(d.error))};
            w.onerror=e=>{for(const p of pending.values())p.reject(Error('QA_WORKER_BOOT:'+e.message));pending.clear();q.error=e.message};
            const rpc=(method,...args)=>new Promise((resolve,reject)=>{const id=++seq;pending.set(id,{resolve,reject});w.postMessage({id,method,args})});
            rpc('init',profile).then(()=>{
             adapter=Object.freeze({
              async open(a){q.opens++;return rpc('open',a)},
              async close(){
               q.closes++;const mode=q.mode;
               try{
                if(mode==='reject')throw Error('QA_CLOSE_REJECT');
                const r=await rpc('close');
                if(q.holdClose){q.holdClose=false;await new Promise(resolve=>q.closeHeld=resolve);q.closeHeld=null}
                if(mode==='forged')return {...r,writerAuthorized:true};
                return r;
               }finally{q.closeSettled++;}
              },
              async backupOriginal(){const r=await rpc('backupOriginal');q.backup=r;return r},
              listVerifiedTargets:()=>rpc('listVerifiedTargets'),
              stageTyped(c){q.commands.push(structuredClone(c));return rpc('stageTyped',c)},
              undo:()=>rpc('undo'),redo:()=>rpc('redo'),
              async exportEditedCopy(){const r=await rpc('exportEditedCopy');q.exported=r;return r},
              async downloadVerifiedCopy(which){try{return await rpc('downloadVerifiedCopy',which)}finally{q.downloadDone++}}
             });q.ready=true;
            }).catch(e=>{q.error=String(e)});
            return ()=>{w.terminate();for(const p of pending.values())p.reject(Error('QA_UNMOUNT'));pending.clear()};
           });
          </script>
          {#if adapter}<LocalAmountEditorDev verifiedLocalDevGate={true} scopedExactOne={true} trustedWorkerAdapter={adapter}/>{/if}
          SVELTE
          cat > src/routes/test-dev-amount-ui/qa.worker.mjs <<'NODE'
          import init,{WorkerWasmSource} from '../../../tests/stage-e/pkg/ddv_save_core.js';
          import {createProductScopedAmountLocalAdapter} from '$lib/ddv/core/save/product-scoped-amount-local-adapter.mjs';
          let adapter=null;
          self.onmessage=async({data:{id,method,args}})=>{
           try{
            let value;
            if(method==='init'){
             if(adapter||!['catalog0-furniture','linked-crop-chest48'].includes(args[0]))throw Error('QA_INIT');
             const wasmResponse=await fetch(new URL('/qa-act990/ddv_save_core_bg.wasm',self.location.origin),{cache:'no-store'});
             if(!wasmResponse.ok)throw Error('QA_WASM_HTTP_'+wasmResponse.status);
             if(!(wasmResponse.headers.get('content-type')||'').startsWith('application/wasm'))throw Error('QA_WASM_MIME');
             await init({module_or_path:await wasmResponse.arrayBuffer()});
             adapter=createProductScopedAmountLocalAdapter({wasmFactory:async()=>({WorkerWasmSource}),allowCoreDiscoverySource:true,coreDiscoveryProfile:args[0]});
             value=true;
            }else{
             if(!adapter||!['open','close','backupOriginal','listVerifiedTargets','stageTyped','undo','redo','exportEditedCopy','downloadVerifiedCopy'].includes(method))throw Error('QA_METHOD');
             value=await adapter[method](...args);
            }
            self.postMessage({id,ok:true,value});
           }catch(e){self.postMessage({id,ok:false,error:String(e?.message||e)})}
          };

            '--user-data-dir='+profile,'about:blank'],{stdio:'ignore'});
           await attach();await rpc('Page.enable');await rpc('Runtime.enable');await rpc('Network.enable');
           await rpc('Browser.setDownloadBehavior',{behavior:'allow',downloadPath,eventsEnabled:true});
           await rpc('Emulation.setDeviceMetricsOverride',{width:320,height:800,
            deviceScaleFactor:1,mobile:false});
           await rpc('Page.navigate',{url:origin+'/test-dev-amount-ui/?profile='+process.env.WAND_QA_PROFILE});
           let ready=false;
           for(let n=0;n<150;n++){
            try{const r=await rpc('Runtime.evaluate',{expression:'location.pathname',
               returnByValue:true});if(r.result?.value==='/test-dev-amount-ui/'){ready=true;break}}catch{}
            await sleep(60);
           }
           if(!ready)throw Error('DEV_CHROME_NAVIGATION_FAILED');
           const controller=new AbortController();
           let evaluation;
           try{evaluation=await Promise.race([
            rpc('Runtime.evaluate',{expression:script,returnByValue:true,awaitPromise:true}),
            sleep(110000,undefined,{signal:controller.signal}).then(()=>{throw Error('DEV_CHROME_TIMEOUT')})
           ])}finally{controller.abort()}
           if(evaluation.exceptionDetails)throw Error(
            'DEV_CHROME_EVAL_'+String(evaluation.exceptionDetails.exception?.description||
              evaluation.exceptionDetails.text).slice(0,800));
           const result=evaluation.result?.value;
           assert.equal(result?.pass,true,'DEV_UI_CHROME_PASS');
          
           const {p1gPackagedProfileCodec}=await import('../../src/lib/ddv/core/save/p1g-packaged-profile-codec.js');
           const {createHash}=await import('node:crypto');
           const meta=JSON.parse(await readFile(join(root,'static/qa-act990',result.profile+'.json'),'utf8'));
           assert.equal(result.opens,1);assert.equal(result.commands,1);assert.equal(result.productWriter,false);
           assert.notEqual(result.backup,result.edited);
           const backupPath=join(downloadPath,result.backup),editedPath=join(downloadPath,result.edited);
           for(let n=0;n<150&&(!existsSync(backupPath)||!existsSync(editedPath));n++)await sleep(100);
           const backup=await readFile(backupPath),edited=await readFile(editedPath);
           assert.deepEqual(backup,await readFile(join(root,'static/qa-act990',result.profile+'.p1g')));
           assert.equal(createHash('sha256').update(edited).digest('hex'),result.editedSha);
           assert.equal((await p1gPackagedProfileCodec.loadProfile(new Uint8Array(edited))).jsonText,meta.expected);
           assert.equal(createHash('sha256').update(backup).digest('hex'),meta.originalSha256);
           assert.equal(downloadGuids.size,2);assert.deepEqual((await readdir(downloadPath)).sort(),[result.backup,result.edited].sort());
           assert.ok(network.every(r=>r.method==='GET'),'NO_POST_PUT_UPLOAD');
           console.log('QRW_ACT990_ACTUAL_UI_CORE_OPFS_EXACT1_CLOSE_PASS',JSON.stringify({profile:result.profile,opens:result.opens,commands:result.commands,closes:result.closes,actualDiskDownloads:2,exactFullDocument:true,writerAuthorized:false}));
          
          }catch(error){
           console.error('08WEB_DEV_UI_CHROME_FAIL',String(error?.stack||error).slice(0,1300));
           process.exitCode=1;
          }finally{
           for(const p of pending.values())p.reject(Error('CLOSED'));pending.clear();
           try{ws?.close()}catch{}
           if(chrome){chrome.kill('SIGTERM');await sleep(180);
            if(chrome.exitCode===null)chrome.kill('SIGKILL')}
           if(server){server.kill('SIGTERM');await sleep(180);
            if(server.exitCode===null)server.kill('SIGKILL')}
           await rm(profile,{recursive:true,force:true,maxRetries:3});
          }
          NODE
          node --check tests/.qa-act990-fixtures.mjs
          node --check tests/dev-amount-ui-chrome/qa-act990.mjs
          node --check src/routes/test-dev-amount-ui/qa.worker.mjs
      - name: Build fixed generated opt-in WASM and synthetic fixtures
        working-directory: /tmp/wand-act990
        run: |
          set -euo pipefail
          sed -i 's/wasm-bindgen = { version = "0.2", optional = true }/wasm-bindgen = { version = "=0.2.105", optional = true }/' crates/ddv-save-core/Cargo.toml
          cp tests/fixtures/ddv-save-core-accepted.Cargo.lock crates/ddv-save-core/Cargo.lock
          printf '%s\n' 'e58486d673df79bfe7e72b80449e39389e57010fe4051edcdcff9b53c2da898c  crates/ddv-save-core/Cargo.lock' | sha256sum -c -
          cargo build --locked --manifest-path crates/ddv-save-core/Cargo.toml --release --target wasm32-unknown-unknown --no-default-features --features worker-wasm,product-amount-scoped
          cargo install wasm-bindgen-cli --version 0.2.105 --locked --root /tmp/wand-act990-tools
          mkdir -p tests/stage-e/pkg
          /tmp/wand-act990-tools/bin/wasm-bindgen "$CARGO_TARGET_DIR/wasm32-unknown-unknown/release/ddv_save_core.wasm" --out-dir tests/stage-e/pkg --target web --no-typescript
          node tests/.qa-act990-fixtures.mjs
          cp tests/stage-e/pkg/ddv_save_core_bg.wasm static/qa-act990/ddv_save_core_bg.wasm
          cmp tests/stage-e/pkg/ddv_save_core_bg.wasm static/qa-act990/ddv_save_core_bg.wasm
          npm ci --no-audit --no-fund
          command -v google-chrome

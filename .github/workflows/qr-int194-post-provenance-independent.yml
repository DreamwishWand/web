name: 04 QR INT194 Post-Provenance Fix Independent
on:
  pull_request:
    paths:
      - 'tests/qr-int194-post-provenance-independent.test.mjs'
      - '.github/workflows/qr-int194-post-provenance-independent.yml'
      - 'docs/qa/qr-int194-post-provenance-independent-20261026.md'
      - 'src/lib/collection/runtime.js'
      - 'src/lib/collection/shared-item-reference.js'
      - 'src/routes/collection/+page.svelte'
      - 'src/routes/explore/+page.svelte'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  new-post-provenance-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      SUPABASE_ACCESS_TOKEN: ''
      DATABASE_URL: ''
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Assert source-only, exact tested commit and no privileged environment
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          test -z "$SUPABASE_ACCESS_TOKEN" && test -z "$DATABASE_URL"
          test "$(git hash-object static/ddv/collection/v1.25/index.json)" = "51e72eb055ef150df060ebeb86bd3dc79bc3cb2c"
      - name: Fresh independent provenance Negative and Positive acceptance
        run: node --test tests/qr-int194-post-provenance-independent.test.mjs
      - name: Deliberately narrow acceptance
        run: echo 'QR_INT194_POST_PROVENANCE_SOURCE_ONLY_NOT_RELEASE_PASS'

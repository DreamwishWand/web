name: 05 QR-C Switch626 Makeup Color1 Build-only L2 (QA ONLY NEVER MERGE)
on:
  pull_request:
    paths:
      - '.github/workflows/05qrc-switch626-makeup-build-l2.yml'
      - 'crates/ddv-save-core/src/product_makeup_color1.rs'
permissions:
  contents: read
jobs:
  qrc1902-switch626-makeup:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CARGO_TARGET_DIR: /tmp/wand-qrc1902-cargo-target
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Fixed Source and QA-only hunk boundary
        run: |
          set -euo pipefail
          git cat-file -e 8be55cc5b7b3aeff12a64ea282e1ee00ad26aa82^{commit}
          test "$(git merge-base 8be55cc5b7b3aeff12a64ea282e1ee00ad26aa82 HEAD)" = 8be55cc5b7b3aeff12a64ea282e1ee00ad26aa82
          git diff --name-only 8be55cc5b7b3aeff12a64ea282e1ee00ad26aa82 HEAD | LC_ALL=C sort > /tmp/qrc1902-actual
          printf '%s\n' '.github/workflows/05qrc-switch626-makeup-build-l2.yml' 'crates/ddv-save-core/src/product_makeup_color1.rs' | LC_ALL=C sort > /tmp/qrc1902-expected
          diff -u /tmp/qrc1902-expected /tmp/qrc1902-actual
          git diff --exit-code 8be55cc5b7b3aeff12a64ea282e1ee00ad26aa82 HEAD -- crates/ddv-save-core/src/semantic_writer.rs crates/ddv-save-core/Cargo.toml crates/ddv-save-core/src/wasm_worker.rs
          echo QRC1902_FIXED_SOURCE_QA_ONLY_PASS
      - name: Independent Switch626 exact Build and scalar CAS
        run: |
          set -euo pipefail
          cargo generate-lockfile --manifest-path crates/ddv-save-core/Cargo.toml
          sha256sum crates/ddv-save-core/Cargo.lock > /tmp/qrc1902-lock.sha
          cargo test --locked --manifest-path crates/ddv-save-core/Cargo.toml --features product-switch626-makeup-color1-internal --lib qa1902_switch_opaque_cas_and_build_exclusion -- --nocapture
          test -s /tmp/qrc1902-switch-makeup-edited.json
          cargo test --locked --manifest-path crates/ddv-save-core/Cargo.toml --features product-switch626-makeup-color1-internal --lib qa1902_switch_makeup_child_reopen -- --ignored --nocapture
          cargo check --locked --manifest-path crates/ddv-save-core/Cargo.toml --target wasm32-unknown-unknown --no-default-features --features worker-wasm,product-switch626-makeup-color1-internal
          cargo check --locked --manifest-path crates/ddv-save-core/Cargo.toml --target wasm32-unknown-unknown --no-default-features --features worker-wasm,product-switch626-makeup-color1-internal,product-steam626-hair-scoped,product-switch626-rm01-scoped
          sha256sum -c /tmp/qrc1902-lock.sha

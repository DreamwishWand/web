name: QA ONLY 04 QR-W ACT1675 PR2080 Moodboard local delete and CI scope L2 NEVER MERGE
on:
  pull_request:
    paths:
      - '.github/workflows/qa-qrw-act1675-pr2080-decux43-local-delete-ci-l2.yml'
permissions:
  contents: read
jobs:
  independent-local-moodboard:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 7d0e30060b01fc45217f7d5d184182bf7f9b8cc3
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact original 7 Source Git blobs, statuses and unchanged Store/Portability
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 7d0e30060b01fc45217f7d5d184182bf7f9b8cc3
          test "$(git merge-base HEAD b233820ac6951f445214eef6956f95b14bc80497)" = b233820ac6951f445214eef6956f95b14bc80497
          cat >/tmp/qrw2080-original <<'PINS'
          9ae826c801d16c43e7ea5ea13a37346f086f2844 .github/workflows/08web-decux43-moodboard-cover.yml A
          c46a50ee70c337f161c293a188e1294d09911a61 .github/workflows/web-moodboard-atomic-entry.yml M
          6f0ed52e669f85094836b57640377d151f1ae951 scripts/web-moodboard-cover-preview-chrome.mjs A
          9c20f3a06d580af6d290e6b8498b6a1bf6f9d831 src/lib/moodboards/copy.js M
          0ef6b9515d79dc252823643f80cf0bd84c3b9b14 src/lib/moodboards/cover-preview.mjs A
          64a448995c0cdd5dce5c54b54b9d5727f2449a4a src/routes/moodboards/+page.svelte M
          f563d0580cd429461ad5f2767821cdca594a7171 tests/web-moodboard-cover-preview.test.mjs A
          PINS
          while read -r sha path status; do
            test "$(git rev-parse "HEAD:$path")" = "$sha"
            test "$(git ls-tree HEAD "$path" | awk '{print $1}')" = 100644
            test "$(git diff --name-status b233820ac6951f445214eef6956f95b14bc80497 HEAD -- "$path" | cut -f1)" = "$status"
          done </tmp/qrw2080-original
          awk '{print $2}' /tmp/qrw2080-original | LC_ALL=C sort >/tmp/qrw2080-expected
          git diff --name-only b233820ac6951f445214eef6956f95b14bc80497 HEAD | LC_ALL=C sort >/tmp/qrw2080-actual
          diff -u /tmp/qrw2080-expected /tmp/qrw2080-actual
          test "$(git rev-parse HEAD:src/lib/moodboards/store.js)" = 530d5b8baae94fb69d037a5bea565a31668f64d0
          git diff --quiet b233820ac6951f445214eef6956f95b14bc80497 HEAD -- src/lib/moodboards/store.js src/lib/moodboards/atomic-first-board.mjs src/lib/moodboards/origin-portability.mjs .github/workflows/pages.yml src/routes/collection src/lib/community
          echo QRW2080_EXACT7_GIT_BLOBS_MODES_STORE_PRESERVED_PASS
      - run: npm ci --no-audit --no-fund
      - name: Existing Moodboard atomic/cover/origin and independent bounded local target negative
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/web-moodboard-cover-preview.test.mjs tests/web-moodboard-atomic-entry.test.mjs tests/web-moodboard-origin-portability.test.mjs
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          import {createEmptyMoodboardDocument,createMoodboard,deleteMoodboard,addMoodboardReference,serializeMoodboardDocument,parseMoodboardDocument} from './src/lib/moodboards/store.js';
          import {moodboardCoverTiles} from './src/lib/moodboards/cover-preview.mjs';
          import {MOODBOARD_COPY} from './src/lib/moodboards/copy.js';
          const path='src/routes/moodboards/+page.svelte',page=readFileSync(path,'utf8');
          let pos=0,neg=0;
          const at='2026-11-18T00:00:00.000Z';
          let doc=createEmptyMoodboardDocument(at);
          const ids=['board_alpha','board_beta','board_gamma'];
          for(const id of ids){const created=createMoodboard(doc,{title:'Owned '+id},{now:at,idFactory:()=>id.slice('board_'.length)});doc=created.document;}
          assert.deepEqual(doc.boards.map(b=>b.id),ids);pos++;
          const prev=serializeMoodboardDocument(doc);
          let deleted=deleteMoodboard(doc,'board_beta',{now:at});
          assert.deepEqual(deleted.boards.map(b=>b.id),['board_alpha','board_gamma']);
          assert.equal(doc.boards.length,3);
          assert.deepEqual(parseMoodboardDocument(prev,at).boards.map(b=>b.id),ids);pos++;
          const gamma=deleteMoodboard(deleted,'board_gamma',{now:at});
          assert.deepEqual(gamma.boards.map(b=>b.id),['board_alpha']);
          assert.equal(deleted.boards.length,2);pos++;
          for(const bad of ['foreign','',null,undefined,'ALPHA',' alpha ','gamma']){
            assert.throws(()=>deleteMoodboard(gamma,bad,{now:at}),RangeError);
            neg++;
          }
          const x=addMoodboardReference(doc,'board_alpha',{type:'NOTE',label:'safe',note:'  light green \n  with  plants '},{now:at,idFactory:()=> 'reference'});
          const after=moodboardCoverTiles(x.document.boards[0]);
          assert.equal(after[0].text,'light green with plants');
          assert.deepEqual(after.slice(1).map(t=>t.type),['EMPTY','EMPTY','EMPTY']);
          assert.ok(Object.isFrozen(after));pos++;
          for(const bad of [
            {type:'URL',label:'should not load remote',url:'https://external.example/secret'},
            {type:'GALLERY_WORK',label:'do not render private'},
            {type:'NOTE',note:'  \t   '},
            null
          ]){assert.deepEqual(moodboardCoverTiles({references:[bad]}).map(t=>t.type),['EMPTY','EMPTY','EMPTY','EMPTY']);neg++;}
          const long=moodboardCoverTiles({references:[{type:'NOTE',note:'x'.repeat(200)}]});
          assert.equal(long[0].text.length,42);pos++;
          assert.match(page,/on:click=\{\(\)=>removeBoard\(board\.id\)\}/);
          assert.match(page,/on:click=\{\(\)=>removeBoard\(selected\.id\)\}/);
          assert.match(page,/if\(selectedId===boardId\)selectedId=next\.boards\[0\]\?\.id\?\?''/);
          assert.match(page,/if\(current\)localStorage\.setItem\(MOODBOARD_BACKUP_KEY,current\)/);
          assert.match(page,/data-moodboard-root-menu/);
          assert.match(page,/data-moodboard-workspace-menu/);
          assert.match(page,/createMoodboardHandoff/);
          assert.match(page,/importPortableMoodboard/);
          assert.match(page,/exportPortableMoodboard/);
          assert.doesNotMatch(page,/on:click=\{removeBoard\}/);
          assert.equal(Object.keys(MOODBOARD_COPY).length,8);
          for(const lang of ['en','de','es-ES','fr','it','ja','pt-BR','zh-CN'])assert.ok(MOODBOARD_COPY[lang].manage&&MOODBOARD_COPY[lang].delete);
          pos++;
          console.log('QRW2080_INDEPENDENT_TARGET_DELETE_SNAPSHOT_COVER_NO_REMOTE_PASS',JSON.stringify({positive:pos,negative:neg}));
          NODE
      - name: Independent exact legacy CI scope profiles and poisoned extra-path refutation
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const code=readFileSync('.github/workflows/web-moodboard-atomic-entry.yml','utf8');
          let pos=0,neg=0;
          const block=name=>{
            const marker='cat >/tmp/'+name+" <<'SCOPE'";
            const start=code.indexOf(marker);
            assert.ok(start>=0,name);
            const text=code.slice(start+marker.length);
            return text.slice(0,text.indexOf('\n          SCOPE')).trim().split('\n').map(x=>x.trim()).sort();
          };
          const original=block('atomic-entry-scope');
          const cover=block('atomic-entry-decux43-scope');
          const migration=block('atomic-entry-migration-scope');
          assert.equal(original.length,5);pos++;
          assert.equal(cover.length,7);
          assert.deepEqual(cover,[
            '.github/workflows/08web-decux43-moodboard-cover.yml',
            '.github/workflows/web-moodboard-atomic-entry.yml',
            'scripts/web-moodboard-cover-preview-chrome.mjs',
            'src/lib/moodboards/copy.js',
            'src/lib/moodboards/cover-preview.mjs',
            'src/routes/moodboards/+page.svelte',
            'tests/web-moodboard-cover-preview.test.mjs'
          ].sort());pos++;
          assert.equal(migration.length,7);
          assert.ok(migration.includes('src/lib/moodboards/origin-portability.mjs'));pos++;
          assert.ok(code.includes('diff -u /tmp/atomic-entry-decux43-expected /tmp/atomic-entry-actual'));
          assert.ok(code.includes("test \"$(git ls-tree HEAD \"$p\" | awk '{print $1}')\" = 100644"));
          assert.ok(code.includes('src/lib/moodboards/store.js'));
          pos++;
          const scopeOK=(actual,expected)=>actual.length===expected.length && actual.slice().sort().every((p,i)=>p===expected[i]);
          assert.equal(scopeOK(cover,cover),true);pos++;
          for(const extra of ['.github/workflows/pages.yml','src/lib/moodboards/store.js','src/lib/community/secret.js',
            'supabase/migrations/0001.sql','src/routes/+layout.svelte','src/lib/moodboards/cover-preview.mjs/',
            'scripts/outside.sh','tests/web-moodboard-cover-preview.test.mjs.bak']){
            assert.equal(scopeOK([...cover,extra],cover),false,extra);neg++;
          }
          for(const missing of cover){assert.equal(scopeOK(cover.filter(x=>x!==missing),cover),false,missing);neg++;}
          for(const swap of [['src/lib/moodboards/store.js','src/lib/moodboards/cover-preview.mjs'],
            ['src/routes/collection/+page.svelte','src/routes/moodboards/+page.svelte']]){
            assert.equal(scopeOK(cover.map(x=>x===swap[1]?swap[0]:x),cover),false);neg++;
          }
          console.log('QRW2080_LEGACY_CI_EXACT7_ALL_OLD5_MIGRATION7_EXTRA_AND_MISSING_REFUTED_PASS',JSON.stringify({positive:pos,negative:neg}));
          NODE
      - name: Real Svelte build and independent Chrome 3-board nonselected delete / backup restore / selected fallback
        shell: bash
        env:
          BASE_PATH: /web
        run: |
          set -euo pipefail
          npm run check && npm run build
          npm install --no-save --package-lock=false playwright-core@1.55.0
          export CHROME_BIN="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium)"
          test -n "$CHROME_BIN"
          npm run preview -- --host 127.0.0.1 --port 4298 --strictPort >/tmp/qrw2080-preview.log 2>&1 &
          for i in $(seq 1 60); do if curl -fsS http://127.0.0.1:4298/web/moodboards/ >/dev/null; then break; fi; sleep 1; done
          curl -fsS http://127.0.0.1:4298/web/moodboards/ >/dev/null
          node scripts/web-moodboard-cover-preview-chrome.mjs
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {chromium} from 'playwright-core';
          const browser=await chromium.launch({executablePath:process.env.CHROME_BIN,args:['--no-sandbox','--disable-dev-shm-usage']});
          let count=0;
          try{
            for(const width of [1366,320]){
              const ctx=await browser.newContext({viewport:{width,height:850},serviceWorkers:'block'});
              const page=await ctx.newPage();
              const requests=[],errors=[];
              ctx.on('request',r=>{const u=new URL(r.url());if(u.origin!=='http://127.0.0.1:4298'||!['GET','HEAD'].includes(r.method()))requests.push(r.method()+' '+u.href);});
              page.on('pageerror',e=>errors.push(String(e)));
              try{
                await page.goto('http://127.0.0.1:4298/web/moodboards/',{waitUntil:'domcontentloaded'});
                const entries=page.locator('[data-moodboard-root-card]'), form=page.locator('form.new-board');
                for(const label of ['A garden','B flowers','C lanterns']){
                  await form.locator('input').fill(label);
                  await form.locator('button[type=submit]').click();
                }
                assert.equal(await entries.count(),3);
                assert.equal(await entries.nth(2).locator('button').first().getAttribute('aria-pressed'),'true');
                const snap=await page.evaluate(()=>JSON.parse(localStorage.getItem('dreamwishwand:moodboards:v1')));
                assert.deepEqual(snap.boards.map(b=>b.title),['A garden','B flowers','C lanterns']);
                const deleteB=entries.nth(1).locator('[data-moodboard-root-menu]');
                await deleteB.locator('summary').click();
                await deleteB.locator('button').click();
                assert.equal(await entries.count(),2);
                assert.ok((await entries.nth(0).innerText()).includes('A garden'));
                assert.ok((await entries.nth(1).innerText()).includes('C lanterns'));
                assert.equal(await entries.nth(1).locator('button').first().getAttribute('aria-pressed'),'true');
                const backups=await page.evaluate(()=>({
                  current:JSON.parse(localStorage.getItem('dreamwishwand:moodboards:v1')),
                  previous:JSON.parse(localStorage.getItem('dreamwishwand:moodboards:v1:backup'))
                }));
                assert.deepEqual(backups.current.boards.map(b=>b.title),['A garden','C lanterns']);
                assert.deepEqual(backups.previous.boards.map(b=>b.title),['A garden','B flowers','C lanterns']);
                await page.locator('.backup-actions button').nth(3).click();
                assert.equal(await entries.count(),3);
                const restored=await page.evaluate(()=>JSON.parse(localStorage.getItem('dreamwishwand:moodboards:v1')));
                assert.deepEqual(restored.boards.map(b=>b.title),['A garden','B flowers','C lanterns']);
                await entries.nth(2).locator('button').first().click();
                assert.equal(await entries.nth(2).locator('button').first().getAttribute('aria-pressed'),'true');
                const selected=page.locator('[data-moodboard-workspace-menu]');
                await selected.locator('summary').click();
                await selected.locator('button').click();
                assert.equal(await entries.count(),2);
                assert.ok((await entries.nth(0).innerText()).includes('A garden'));
                assert.ok((await entries.nth(1).innerText()).includes('B flowers'));
                assert.equal(await entries.nth(0).locator('button').first().getAttribute('aria-pressed'),'true');
                const final=await page.evaluate(()=>({
                  current:JSON.parse(localStorage.getItem('dreamwishwand:moodboards:v1')),
                  previous:JSON.parse(localStorage.getItem('dreamwishwand:moodboards:v1:backup'))
                }));
                assert.deepEqual(final.current.boards.map(b=>b.title),['A garden','B flowers']);
                assert.deepEqual(final.previous.boards.map(b=>b.title),['A garden','B flowers','C lanterns']);
                assert.equal(await page.locator('input[data-moodboard-import-file]').count(),1);
                assert.deepEqual(errors,[]);
                assert.deepEqual(requests,[]);
                count++;
              }finally{await page.close();await ctx.close();}
            }
            console.log('QRW2080_REAL_CHROME_3BOARD_WRONG_TARGET_DELETE_BACKUP_RESTORE_SELECTED_FALLBACK_PASS',JSON.stringify({viewports:count,cloud:false,realProductSave:false}));
          }finally{await browser.close();}
          NODE

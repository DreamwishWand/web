name: 05 QR-C PR819 independent Rust FloatingIslands direct roots native QA
on:
  pull_request:
    paths:
      - 'crates/ddv-save-core/tests/qa_05qrc_pr819_floating_islands.rs'
      - 'tests/qa-05qrc-pr819-floating-island-native-cli.test.mjs'
      - '.github/workflows/05qr-c-pr819-floating-islands-independent.yml'
  push:
    branches:
      - 'qa/05qrc-pr819-floating-islands-7ea2ec3e-20261108'
permissions:
  contents: read
jobs:
  focused-native-floating-island:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_TARGET_DIR: /tmp/wand-05qrc-pr819-native-target
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Require fixed Source PR819 exact FOUR original Git blobs and QA-only THREE additions
        shell: bash
        run: |
          set -euo pipefail
          source=7ea2ec3e7e7c206283e4511d06eece13c6df9c86
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            qa_tip="$(git rev-parse HEAD^2)"
          else
            qa_tip="$(git rev-parse HEAD)"
          fi
          git merge-base --is-ancestor "$source" "$qa_tip"
          test "$(git rev-parse "$qa_tip":crates/ddv-save-core/src/native_reference_slice.rs)" = 6d31c593c282932b8ca266e392a5be6f47aac5e2
          test "$(git rev-parse "$qa_tip":crates/ddv-save-core/src/bin/wand-local-rust-v1.rs)" = e276e02fb9345b13b60ab0c06c8e6fe666d93600
          test "$(git rev-parse "$qa_tip":tests/native-owner-area-grid-slice.test.mjs)" = 8af0a917354a2018279259e6edf23d1bc84fad05
          test "$(git rev-parse "$qa_tip":docs/core/01a-r04-floating-island-direct-grid-index-20261108.md)" = 2a920a47784489e6c1cedadc2f53d8bde18483b0
          actual="$(git diff --name-only "$source" "$qa_tip" | sort)"
          expected="$(printf '%s\n' .github/workflows/05qr-c-pr819-floating-islands-independent.yml crates/ddv-save-core/tests/qa_05qrc_pr819_floating_islands.rs tests/qa-05qrc-pr819-floating-island-native-cli.test.mjs | sort)"
          test "$actual" = "$expected"
          test -z "$(git diff --name-only "$source" "$qa_tip" -- crates/ddv-save-core/src crates/ddv-save-core/Cargo.toml src tools)"
          node --check tests/qa-05qrc-pr819-floating-island-native-cli.test.mjs
          test -z "$(git ls-files | grep -E 'STEAM_SAVE_OWNER_PRIVATE|OWNER_PRIVATE|\.p1g$' || true)"
      - name: Run independently authored exact changed-scope Rust ProductSession native CAS tests
        shell: bash
        run: |
          set -euo pipefail
          cargo test --manifest-path crates/ddv-save-core/Cargo.toml --features private-native-v1 --test qa_05qrc_pr819_floating_islands -- --nocapture
      - name: Build actual ORIGINAL native Rust private V1 CLI with FloatingIsland probe
        shell: bash
        run: |
          set -euo pipefail
          cargo build --manifest-path crates/ddv-save-core/Cargo.toml --features private-native-v1 --release --bin wand-local-rust-v1
          test -x "$CARGO_TARGET_DIR/release/wand-local-rust-v1"
      - name: Run independent compiled Rust native CLI positive and malformed Floating Island negatives
        shell: bash
        env:
          QRC819_NATIVE_V1: /tmp/wand-05qrc-pr819-native-target/release/wand-local-rust-v1
        run: |
          set -euo pipefail
          node --test tests/qa-05qrc-pr819-floating-island-native-cli.test.mjs
      - name: Rust normal core and indexed Native ABI compile
        shell: bash
        run: |
          set -euo pipefail
          cargo check --manifest-path crates/ddv-save-core/Cargo.toml --lib
          cargo check --manifest-path crates/ddv-save-core/Cargo.toml --features indexed-read,private-native-v1 --lib
      - name: Real Worker Rust WASM ABI compile and native feature isolation denial
        shell: bash
        run: |
          set -euo pipefail
          cargo check --manifest-path crates/ddv-save-core/Cargo.toml --target wasm32-unknown-unknown --features worker-wasm,indexed-read --lib
          if cargo check --manifest-path crates/ddv-save-core/Cargo.toml --target wasm32-unknown-unknown --features worker-wasm,private-native-v1 --lib > /tmp/qrc819-forbidden-wasm.txt 2>&1; then
            echo "FATAL: native-only floating islands probe entered product WASM"
            exit 1
          fi
          grep -F "private-native-v1 is native-only and cannot enter WASM" /tmp/qrc819-forbidden-wasm.txt >/dev/null
          rm -f /tmp/qrc819-forbidden-wasm.txt
      - name: QA-only source unchanged, no unreviewed Save transfer, negative authority unchanged
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            qa_tip="$(git rev-parse HEAD^2)"
          else
            qa_tip="$(git rev-parse HEAD)"
          fi
          test "$(git diff --name-only 7ea2ec3e7e7c206283e4511d06eece13c6df9c86 "$qa_tip" | wc -l)" -eq 3
          test -z "$(git diff --name-only 7ea2ec3e7e7c206283e4511d06eece13c6df9c86 "$qa_tip" -- crates/ddv-save-core/src crates/ddv-save-core/Cargo.toml src tools)"
          test -z "$(git ls-files | grep -E 'STEAM_SAVE_OWNER_PRIVATE|OWNER_PRIVATE|\.p1g$' || true)"
          echo "QRC819_SOURCE4_QA3_FLOATING_ISLAND_NATIVE_CAS_UNKNOWN_ROOT_ALIAS_WASM_DENIAL_FOCUSED_PASS"

name: 05 QR-C PR2356 combined Inventory0 Arc final zero at wasm32 Close L2 (QA ONLY NEVER MERGE)
on:
  pull_request:
    paths:
      - .github/workflows/05qrc-pr2356-inv0-arc-final-zero-l2.yml
permissions:
  contents: read
jobs:
  optimized-wasm32-arc-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 44
    env:
      CARGO_TARGET_DIR: /tmp/qrc2360-arc-release
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 05qrc-20261120-pr2356-inv0-arc-final-zero-l2
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
          targets: wasm32-unknown-unknown
      - name: Fixed repaired original ProductSession Rust Source + one QA-only workflow
        shell: bash
        run: |
          set -euo pipefail
          source=4cb4f0e3fe99836cc585e8df89b70bc6831032c2
          base=0e57c6b8585002b1baff91e6de573a835bed6577
          path=.github/workflows/05qrc-pr2356-inv0-arc-final-zero-l2.yml
          test "$(git merge-base "$source" HEAD)" = "$source"
          test "$(git diff --name-only "$source" HEAD)" = "$path"
          test "$(git ls-tree HEAD -- "$path" | awk '{print $1}')" = 100644
          git diff --name-only "$base" "$source" | LC_ALL=C sort > /tmp/qrc-arc-src
          printf '%s\n' \
            '.github/workflows/01a-steam626-inventory0-dedicated-rust-source.yml' \
            'crates/ddv-save-core/Cargo.toml' \
            'crates/ddv-save-core/src/product_session.rs' \
            'crates/ddv-save-core/src/wasm_worker.rs' \
            'src/lib/ddv/core/save/p1g-rust-worker-readonly-bridge.mjs' \
            'src/lib/ddv/core/save/product-scoped-amount-local-adapter.mjs' \
            'src/lib/ddv/core/save/product-scoped-amount-transport.mjs' \
            'src/lib/ddv/core/save/product-wasm-read-owner.mjs' \
            'tests/01a-steam626-catalog0-product-worker-port.test.mjs' \
            'tests/01a-steam626-inventory0-exclusive-rust-feature.test.mjs' \
            'tests/product-steam626-catalog0-local-adapter.test.mjs' | LC_ALL=C sort > /tmp/qrc-arc-expected
          diff -u /tmp/qrc-arc-expected /tmp/qrc-arc-src
          test "$(git rev-parse HEAD:crates/ddv-save-core/src/product_session.rs)" = e53c4930a84f729ea245f38a1b301c7178146ced
          test "$(git rev-parse HEAD:crates/ddv-save-core/src/wasm_worker.rs)" = 775a2766f237d44ae77fa5347e9adf430c8580d2
          test "$(git rev-parse HEAD:crates/ddv-save-core/src/worker_session.rs)" = 254af029304f6a357c8c0a0e7a1376b80313d038
          test "$(git rev-parse HEAD:crates/ddv-save-core/Cargo.toml)" = b3455c36d9d60b4a0e415026a095e47fe577644d
          test ! -e crates/ddv-save-core/Cargo.lock
          cp scripts/wasm-distribution/approved-Cargo.lock crates/ddv-save-core/Cargo.lock
          echo 'e58486d673df79bfe7e72b80449e39389e57010fe4051edcdcff9b53c2da898c  crates/ddv-save-core/Cargo.lock' | sha256sum -c -
          echo QRC2356_ARC_FINAL_CURRENT_SOURCE_QAONLY_ONE_WORKFLOW_PASS
      - name: Inject exact data-span deallocation witness only in ephemeral runner worktree
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('crates/ddv-save-core/src/product_session.rs')
          s=p.read_text()
          anchor='    fn lock(&self) -> CoreResult<MutexGuard<'
          assert s.count(anchor)==1
          p.write_text(s.replace(anchor,'''    // QA ONLY expose the owned session Arc slice span, no bytes or pointer
              // cross the JS boundary; consumed only in a wasm32 observer.
              pub(crate) fn qa_session_decoded_span(&self)->(usize,usize) {
                  (self.decoded.as_ptr() as usize,self.decoded.len())
              }
          '''+anchor,1))
          p=Path('crates/ddv-save-core/src/worker_session.rs')
          s=p.read_text()
          anchor='impl WorkerSessionGuard {'
          assert s.count(anchor)==1
          p.write_text(s.replace(anchor,'''impl WorkerSessionGuard {
              // CI ephemeral test-only access to same single Rust Session Arc.
              pub(crate) fn qa_owned_decoded_span(&self)->(usize,usize){
                  self.session.qa_session_decoded_span()
              }
          ''',1))
          p=Path('crates/ddv-save-core/src/wasm_worker.rs')
          s=p.read_text()
          anchor='const MAX_CHUNK:usize=1024*1024;'
          assert s.count(anchor)==1
          tracker=r'''
          // CI ephemeral only. The exact data pointer is inside Arc's
          // allocated Layout; record original initialized bytes at dealloc
          // (before free), not after. No secrets or pointer values logged.
          use std::alloc::{GlobalAlloc,Layout,System};
          use core::sync::atomic::{AtomicUsize,Ordering as QrcOrdering};
          static QRC_ARC_DATA:AtomicUsize=AtomicUsize::new(0);
          static QRC_ARC_LEN:AtomicUsize=AtomicUsize::new(0);
          static QRC_ARC_DEALLOC:AtomicUsize=AtomicUsize::new(0);
          struct QrcArcAlloc;
          unsafe impl GlobalAlloc for QrcArcAlloc {
              unsafe fn alloc(&self,l:Layout)->*mut u8 {System.alloc(l)}
              unsafe fn dealloc(&self,p:*mut u8,l:Layout){
                  let data=QRC_ARC_DATA.load(QrcOrdering::SeqCst);
                  let len=QRC_ARC_LEN.load(QrcOrdering::SeqCst);
                  let start=p as usize;
                  if data!=0 && len>0 && start<=data &&
                     data.checked_add(len).is_some_and(|end|
                       start.checked_add(l.size()).is_some_and(|limit|end<=limit)){
                      let mut present=false;
                      for i in 0..len {
                          if core::ptr::read_volatile((data as *const u8).add(i))!=0{
                             present=true;break;
                          }
                      }
                      QRC_ARC_DEALLOC.store(if present{1}else{2},QrcOrdering::SeqCst);
                      QRC_ARC_DATA.store(0,QrcOrdering::SeqCst);
                  }
                  System.dealloc(p,l);
              }
          }
          #[global_allocator]
          static QRC_ARC_ALLOC:QrcArcAlloc=QrcArcAlloc;
          '''
          s=s.replace(anchor,tracker+anchor,1)
          anchor='    pub fn append_chunk(&mut self,chunk:&[u8])->Result<(),JsValue>{'
          assert s.count(anchor)==1
          witness=r'''
              // CI-only arm an exact decoded Arc from the existing Worker
              // Session, without giving JS access to any pointer or bytes.
              pub fn qa_arm_session_arc_deallocation(&self)->bool {
                  if let Some(ref guard)=self.session {
                      let (p,n)=guard.qa_owned_decoded_span();
                      if p==0 || n==0{return false;}
                      QRC_ARC_DEALLOC.store(0,QrcOrdering::SeqCst);
                      QRC_ARC_LEN.store(n,QrcOrdering::SeqCst);
                      QRC_ARC_DATA.store(p,QrcOrdering::SeqCst);
                      true
                  } else {false}
              }
              pub fn qa_take_session_arc_deallocation(&self)->u32 {
                  QRC_ARC_DEALLOC.swap(0,QrcOrdering::SeqCst) as u32
              }
          '''
          p.write_text(s.replace(anchor,witness+anchor,1))
          print('QRC2356_ARC_FINAL_WITNESS_EPHEMERAL_NO_PRODUCT_CHANGES')
          PY
      - name: Compile optimized actual Rust1.99.1 wasm32 and instrumented existing Worker
        shell: bash
        run: |
          set -euo pipefail
          test "$(rustc --version | cut -d' ' -f2)" = 1.99.1
          cargo build --locked --release --manifest-path crates/ddv-save-core/Cargo.toml \
            --target wasm32-unknown-unknown --no-default-features --features worker-wasm,product-steam626-catalog0-scoped
          cargo install wasm-bindgen-cli --version 0.2.105 --locked --root /tmp/qrc2360-arc-bindgen
          mkdir -p /tmp/qrc2360-arc-pkg
          /tmp/qrc2360-arc-bindgen/bin/wasm-bindgen \
            "$CARGO_TARGET_DIR/wasm32-unknown-unknown/release/ddv_save_core.wasm" \
            --out-dir /tmp/qrc2360-arc-pkg --target nodejs --no-typescript
      - name: Verify actual Inventory0 Stage CAS and zero decoded Arc at last-owner dealloc
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          src=Path('.github/workflows/01a-steam626-inventory0-dedicated-rust-source.yml').read_text()
          start=src.index('          const empty=()=>')
          end=src.index('          const hash=bytes=>',start)
          fixture='\n'.join(line[10:] for line in src[start:end].splitlines())+'\n'
          head="""import assert from 'node:assert/strict';
          import {createRequire} from 'node:module';
          const {WorkerWasmSource}=createRequire(import.meta.url)('/tmp/qrc2360-arc-pkg/ddv_save_core.js');
          """
          probe=r'''
          const BUILD='releases_1.25-v1.25.3-44-g0b41250d9ac0-incremental-22';
          const worker=new WorkerWasmSource('steam-windows','steam-full-version',
            BUILD,626,true,new Uint8Array(32).fill(0x47));
          worker.append_chunk(encoded);
          const receipt=JSON.parse(worker.finish());
          assert.equal(receipt.fullDocumentJsonValidated,true);
          assert.equal(receipt.writerAuthorized,false);
          const a=[receipt.sessionId,BigInt(receipt.revision),
            BigInt(receipt.indexGeneration),receipt.decodedSha256];
          const list=JSON.parse(worker.discover_scoped_amount('catalog0-furniture',0,...a));
          assert.ok(list.rows.some(r=>r.id===0&&r.selector===40000048&&r.oldAmount===3));
          const pre=JSON.parse(worker.preview_scoped_amount('catalog0-furniture',0,40000048,2,...a));
          assert.equal(pre.oldAmount,3);assert.equal(pre.newAmount,2);
          const stage=JSON.parse(worker.stage_scoped_amount('catalog0-furniture',0,40000048,3,2,
            pre.entrySha256,...a));
          assert.equal(stage.exactFieldChangedCount,1);
          assert.equal(stage.writerAuthorized,false);
          assert.throws(()=>worker.stage_scoped_amount('catalog0-furniture',0,40000048,3,2,
            pre.entrySha256,...a));
          assert.throws(()=>worker.stage_scoped_amount('linked-crop-chest48',12,0,50,49,
            pre.entrySha256,...a));
          assert.equal(worker.qa_arm_session_arc_deallocation(),true);
          worker.close();
          const witness=worker.qa_take_session_arc_deallocation();
          // 0 NOT_OBSERVED, 1 old TRUE_RED, 2 all initialized decoded Arc bytes zero before dealloc.
          assert.equal(witness,2,'ProductSession final-owned decoded Arc must be zero at actual dealloc');
          assert.throws(()=>worker.append_chunk(new Uint8Array([0x66])));
          worker.free();
          console.log('QRC2356_INVENTORY0_CURRENT_RUST_ARC_FINAL_OWNER_ZERO_WASM32');
          console.log('QRC2356_INVENTORY0_CORE_MINTED_STAGE_EXACT1_STALE_FOREIGN_DENIED');
          '''
          Path('/tmp/qrc2356-inventory-arc.mjs').write_text(head+fixture+probe)
          PY
          node --check /tmp/qrc2356-inventory-arc.mjs
          node /tmp/qrc2356-inventory-arc.mjs
          test "$(git diff --name-only 4cb4f0e3fe99836cc585e8df89b70bc6831032c2 HEAD)" = \
            '.github/workflows/05qrc-pr2356-inv0-arc-final-zero-l2.yml'
          echo QRC2356_INVENTORY0_FINAL_OWNER_ARC_ZERO_SCOPED_POSITIVE

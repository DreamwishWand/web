name: 04 QR-W PR1049 independent canary
on:
  pull_request:
    paths:
      - 'scripts/04qr-w-pr1049-canary-independent-20261113.py'
      - '.github/workflows/04qr-w-pr1049-canary-20261113.yml'
permissions:
  contents: read
jobs:
  independent:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pillow==11.3.0
      - run: npm ci --no-audit --no-fund
      - name: Build actual candidate static output (no signing/deploy)
        env:
          BASE_PATH: /web
        run: npm run build
      - run: python scripts/04qr-w-pr1049-canary-independent-20261113.py

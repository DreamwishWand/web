name: "04QR-W PR605 Guide Stage1 4-root Systems7 actual Chrome independent"
on:
  pull_request:
    branches: ['web/stage1-guide-four-root-systems7-20261105']
    paths:
      - '.github/workflows/04qr-w-pr605-guide4-systems7-real-chrome.yml'
      - 'scripts/04qr-w-pr605-guide4-systems7-live-chrome.mjs'
      - 'tests/04qr-w-pr605-guide4-systems7-independent.test.mjs'
permissions:
  contents: read
jobs:
  guide-stage1-new-only-real-chrome:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require private Save, Provider, Cloud disabled in CI
        shell: bash
        run: |
          set -euo pipefail
          test -z "${WEP_PRIVATE_P1G_PATH:-}"
          test -z "${WEP_PRIVATE_LOCAL_ONLY_ACK:-}"
          test -z "${WEP_PRIVATE_EXTERNAL_BUILD_CONFIRMED:-}"
      - run: npm ci --no-audit --no-fund
      - run: npm install --no-save --package-lock=false playwright-core@1.55.0
      - name: Independent new-only Source/rights/8locale/taxonomy Node
        run: |
          node --test tests/04qr-w-pr605-guide4-systems7-independent.test.mjs
          node --check scripts/04qr-w-pr605-guide4-systems7-live-chrome.mjs
      - name: Verify Svelte and exact real system Chrome
        shell: bash
        run: |
          set -euo pipefail
          npm run check
          BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$BIN" || { echo "NOT_RUN: actual installed Chrome not available"; exit 1; }
          "$BIN" --version
          echo "CHROME_BIN=$BIN" >> "$GITHUB_ENV"
      - name: Start isolated local Guide; never public deploy or read private P1G
        shell: bash
        run: |
          set -euo pipefail
          BASE_PATH='' npm run dev -- --host 127.0.0.1 --port 4319 >/tmp/04qrw-guide4-pr605.log 2>&1 &
          for i in $(seq 1 75); do
            if curl -fsS http://127.0.0.1:4319/guide/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/04qrw-guide4-pr605.log
          exit 1
      - name: Actual system Chrome Guide4 Systems7/21 eight locales keyboard320 zoom200 no offsite/noindex
        run: node scripts/04qr-w-pr605-guide4-systems7-live-chrome.mjs

name: WEP isolated IDB to World Editor readonly Draft receiver
on:
  pull_request:
    paths:
      - 'src/lib/wep/WorldEditorStage1DecoratePanel.svelte'
      - 'src/lib/wep/world-editor-stage1-copy.js'
      - 'src/lib/wep/world-editor-atomic-readonly-draft.mjs'
      - 'tests/wep-atomic-readonly-draft.test.mjs'
      - 'scripts/wep-atomic-readonly-draft-chrome.mjs'
      - '.github/workflows/wep-atomic-readonly-draft.yml'
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - name: Exact 2 MOD and 4 ADD WEP-only, no Atomic Sender or Store edits
        shell: bash
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha }}"
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"
          cat >/tmp/wep-atomic-expected <<'SCOPE'
          .github/workflows/wep-atomic-readonly-draft.yml
          scripts/wep-atomic-readonly-draft-chrome.mjs
          src/lib/wep/WorldEditorStage1DecoratePanel.svelte
          src/lib/wep/world-editor-atomic-readonly-draft.mjs
          src/lib/wep/world-editor-stage1-copy.js
          tests/wep-atomic-readonly-draft.test.mjs
          SCOPE
          git diff --name-only "$BASE" HEAD | LC_ALL=C sort >/tmp/wep-atomic-actual
          LC_ALL=C sort /tmp/wep-atomic-expected >/tmp/wep-atomic-expected-sorted
          diff -u /tmp/wep-atomic-expected-sorted /tmp/wep-atomic-actual
          for p in src/lib/wep/WorldEditorStage1DecoratePanel.svelte src/lib/wep/world-editor-stage1-copy.js; do
            test "$(git diff --name-status "$BASE" HEAD -- "$p" | cut -f1)" = M
          done
          for p in src/lib/wep/world-editor-atomic-readonly-draft.mjs tests/wep-atomic-readonly-draft.test.mjs scripts/wep-atomic-readonly-draft-chrome.mjs .github/workflows/wep-atomic-readonly-draft.yml; do
            test "$(git diff --name-status "$BASE" HEAD -- "$p" | cut -f1)" = A
          done
          git diff --exit-code "$BASE" HEAD -- src/routes/moodboards/ src/routes/collection/ src/routes/editor/world/ \
            src/lib/moodboards/ src/lib/collection/ src/lib/wep/world-editor-handoff.ts \
            src/lib/wep/world-editor-moodboard-placement-guard.mjs src/lib/wep/editor-runtime.ts \
            src/lib/wep/canvas-runtime.ts src/lib/ddv/ crates/ src/lib/community/ \
            .github/workflows/pages.yml supabase/ static/
          echo WEP_ATOMIC_DRAFT_READONLY_SIX_SOURCE_PATH_NO_STORE_OR_NATIVE_CHANGE_PASS
      - name: New strict URL/IDB provenance contract, Svelte type checks and Pages base
        env:
          BASE_PATH: /web
        run: |
          node --test tests/wep-atomic-readonly-draft.test.mjs tests/wep-moodboard-stale-handoff.test.mjs
          npm run check
          npm run build
          test -f build/editor/world/index.html
          test -f build/moodboards/atomic/index.html
          test -f build/404.html
          echo WEP_ATOMIC_DRAFT_STATIC_WEB_AND_LEGACY_HANDOFF_INTACT_PASS
  chrome:
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm install --no-save --package-lock=false playwright-core@1.55.0
      - name: Launch real installed Chrome against isolated localhost
        shell: bash
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
          BASE_PATH='' npm run dev -- --host 127.0.0.1 --port 4337 >/tmp/wep-atomic-readonly.log 2>&1 &
          for i in $(seq 1 75); do
            if curl -fsS http://127.0.0.1:4337/editor/world/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/wep-atomic-readonly.log
          exit 1
      - name: Live IDB Board, Revision, Catalog, 8 locale, 320, zoom200, keyboard and no mutation
        env:
          WEP_ATOMIC_DRAFT_ORIGIN: http://127.0.0.1:4337
        run: node scripts/wep-atomic-readonly-draft-chrome.mjs

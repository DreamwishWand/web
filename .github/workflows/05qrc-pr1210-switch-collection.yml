name: 05 QR-C PR1210 Switch626 Furniture collection independent
on:
  pull_request:
    paths:
      - 'tests/qa/05qrc-pr1210-switch-collection.py'
      - '.github/workflows/05qrc-pr1210-switch-collection.yml'
permissions:
  contents: read
jobs:
  independent:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
      - name: Exact Source3 and QA-only2
        run: |
          source=b18c6b2bb96793b285b675e0738453bdebe0cede
          test "$(git merge-base "$source" HEAD)" = "$source"
          test "$(git diff --name-only "$source" HEAD | wc -l)" -eq 2
          test "$(git diff --diff-filter=A --name-only "$source" HEAD | wc -l)" -eq 2
          test "$(git rev-parse HEAD:crates/ddv-save-core/src/bin/wand-local-rust-v1.rs)" = fec37b2f4f4a70a20b3d84fa4b4d13b185f5126a
          test "$(git rev-parse HEAD:crates/ddv-save-core/src/private_collection_read.rs)" = 268852d9490813dee7903f1ff39d77f42642e043
          test "$(git rev-parse HEAD:tests/private-collection-cli.mjs)" = 053a98d134ff36c438b1260fd427e960e4c2cb31
      - name: Locked independent Switch receipt and existing Steam regression
        run: |
          git show e16af9b2d824ba114a1caa56b3b3eb66206d162c:scripts/wasm-distribution/approved-Cargo.lock > crates/ddv-save-core/Cargo.lock
          echo 'e58486d673df79bfe7e72b80449e39389e57010fe4051edcdcff9b53c2da898c  crates/ddv-save-core/Cargo.lock' | sha256sum -c -
          cargo build --locked --manifest-path crates/ddv-save-core/Cargo.toml --no-default-features --features private-native-v1 --bin wand-local-rust-v1
          python3 tests/qa/05qrc-pr1210-switch-collection.py crates/ddv-save-core/target/debug/wand-local-rust-v1
          node tests/private-collection-cli.mjs crates/ddv-save-core/target/debug/wand-local-rust-v1
          cargo test --locked --manifest-path crates/ddv-save-core/Cargo.toml --no-default-features --features private-native-v1 --lib private_collection_read

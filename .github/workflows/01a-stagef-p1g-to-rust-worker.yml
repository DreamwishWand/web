name: 01A Stage F Synthetic P1G to Genuine Rust WASM Chrome Worker (Writer OFF)
on:
  pull_request:
    paths:
      - 'src/lib/ddv/core/save/p1g-rust-worker-readonly-bridge.mjs'
      - 'tests/p1g-rust-worker-readonly-bridge.test.mjs'
      - 'tests/stage-f/**'
      - '.github/workflows/01a-stagef-p1g-to-rust-worker.yml'
      - 'crates/ddv-save-core/**'
  push:
    branches:
      - 'core/p1g-rust-worker-readonly-bridge-*'
permissions:
  contents: read
jobs:
  synthetic-p1g-to-real-rust-chrome:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_TARGET_DIR: /tmp/wand-stagef-core-target
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Existing P1G codec to mock single Rust Worker focused negatives
        run: node --test tests/p1g-rust-worker-readonly-bridge.test.mjs
      - name: Assert Chrome and pinned exact Rust wasm-bindgen
        run: |
          set -euo pipefail
          command -v google-chrome
          grep -Fx 'wasm-bindgen = { version = "=0.2.105", optional = true }' crates/ddv-save-core/Cargo.toml
          grep -Fx 'worker-wasm = ["dep:wasm-bindgen"]' crates/ddv-save-core/Cargo.toml
          grep -Fx 'indexed-read = []' crates/ddv-save-core/Cargo.toml
      - name: Compile accepted Rust Core real WASM for isolated Worker only
        run: |
          cargo build --manifest-path crates/ddv-save-core/Cargo.toml --release --target wasm32-unknown-unknown --features worker-wasm,indexed-read
          test -s "$CARGO_TARGET_DIR/wasm32-unknown-unknown/release/ddv_save_core.wasm"
      - name: Install exact wasm-bindgen CLI 0.2.105
        run: |
          cargo install wasm-bindgen-cli --version 0.2.105 --locked --root /tmp/wand-stagef-bindgen-tool
          /tmp/wand-stagef-bindgen-tool/bin/wasm-bindgen --version | grep -F '0.2.105'
      - name: Generate actual JS glue and WASM in UNCOMMITTED workspace
        run: |
          mkdir -p tests/stage-e/pkg
          /tmp/wand-stagef-bindgen-tool/bin/wasm-bindgen "$CARGO_TARGET_DIR/wasm32-unknown-unknown/release/ddv_save_core.wasm" --out-dir tests/stage-e/pkg --target web --no-typescript
          test -s tests/stage-e/pkg/ddv_save_core.js
          test -s tests/stage-e/pkg/ddv_save_core_bg.wasm
      - name: Generate CI-only public synthetic encrypted P1G from EXISTING Node fixture
        run: |
          node tests/stage-f/generate-fixture.mjs
          test -s tests/stage-f/fixtures/synthetic626.p1g
          test -s tests/stage-f/fixtures/expected.json
          test -z "$(git ls-files tests/stage-f/fixtures)"
      - name: REAL Chrome Module Worker existing P1G Codec to Rust single Session
        run: node tests/stage-f/chrome-smoke.mjs
      - name: No product Editor, Writer or generated binary promoted
        run: |
          test ! -f src/lib/ddv/core/save/p1g-rust-worker-readonly-bridge.js
          test ! -f tests/stage-f/fixtures/synthetic626.p1g.NOT_PRIVATE
          test -z "$(git ls-files tests/stage-e/pkg)"
          ! grep -R -E 'STEAM_SAVE_OWNER_PRIVATE|writerAuthorized: *true|applyAuthorized: *true|include_bytes!' tests/stage-f src/lib/ddv/core/save/p1g-rust-worker-readonly-bridge.mjs

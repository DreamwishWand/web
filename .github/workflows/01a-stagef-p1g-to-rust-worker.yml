name: 01A Stage F Synthetic P1G to Genuine Rust WASM Chrome Worker (Writer OFF)
on:
  pull_request:
    paths:
      - 'src/lib/ddv/core/save/p1g-rust-worker-readonly-bridge.mjs'
      - 'tests/p1g-rust-worker-readonly-bridge.test.mjs'
      - 'tests/stage-f/**'
      - 'tests/wasm-distribution/**'
      - 'scripts/wasm-distribution/**'
      - 'src/lib/ddv/core/save/product-rust-wasm-candidate-loader.mjs'
      - '.github/workflows/01a-stagef-p1g-to-rust-worker.yml'
      - 'crates/ddv-save-core/**'
  push:
    branches:
      - 'core/p1g-rust-worker-readonly-bridge-*'
permissions:
  contents: read
jobs:
  synthetic-p1g-to-real-rust-chrome:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_TARGET_DIR: /tmp/wand-stagef-core-target
    steps:
      - uses: actions/checkout@v4
        with:
          # Compile the exact submitted Source HEAD, not GitHub's synthetic PR merge.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Existing P1G codec to mock single Rust Worker focused negatives
        run: node --test tests/p1g-rust-worker-readonly-bridge.test.mjs
      - name: Assert Chrome and pinned exact Rust wasm-bindgen
        run: |
          set -euo pipefail
          command -v google-chrome
          grep -Fx 'wasm-bindgen = { version = "=0.2.105", optional = true }' crates/ddv-save-core/Cargo.toml
          grep -Fx 'worker-wasm = ["dep:wasm-bindgen"]' crates/ddv-save-core/Cargo.toml
          grep -Fx 'indexed-read = []' crates/ddv-save-core/Cargo.toml
      - name: Compile accepted Rust Core real WASM for isolated Worker only
        run: |
          cargo generate-lockfile --manifest-path crates/ddv-save-core/Cargo.toml
          cargo build --locked --manifest-path crates/ddv-save-core/Cargo.toml --release --target wasm32-unknown-unknown --no-default-features --features worker-wasm,indexed-read
          test -s "$CARGO_TARGET_DIR/wasm32-unknown-unknown/release/ddv_save_core.wasm"
      - name: Install exact wasm-bindgen CLI 0.2.105
        run: |
          cargo install wasm-bindgen-cli --version 0.2.105 --locked --root /tmp/wand-stagef-bindgen-tool
          /tmp/wand-stagef-bindgen-tool/bin/wasm-bindgen --version | grep -F '0.2.105'
      - name: Generate actual JS glue and WASM in UNCOMMITTED workspace
        run: |
          mkdir -p tests/stage-e/pkg
          /tmp/wand-stagef-bindgen-tool/bin/wasm-bindgen "$CARGO_TARGET_DIR/wasm32-unknown-unknown/release/ddv_save_core.wasm" --out-dir tests/stage-e/pkg --target web --no-typescript
          test -s tests/stage-e/pkg/ddv_save_core.js
          test -s tests/stage-e/pkg/ddv_save_core_bg.wasm
      - name: Generate CI-only public synthetic encrypted P1G from EXISTING Node fixture
        run: |
          node tests/stage-f/generate-fixture.mjs
          test -s tests/stage-f/fixtures/synthetic626.p1g
          test -s tests/stage-f/fixtures/expected.json
          test -z "$(git ls-files tests/stage-f/fixtures)"
      - name: REAL Chrome Module Worker existing P1G Codec to Rust single Session
        run: node tests/stage-f/chrome-smoke.mjs
      - name: Build uncommitted source-provenance candidate, both JS and WASM
        env:
          WAND_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          WAND_BINDGEN_CLI: /tmp/wand-stagef-bindgen-tool/bin/wasm-bindgen
        run: |
          node scripts/wasm-distribution/build-candidate.mjs
          test -s static/worker-wasm/ddv_save_core.js
          test -s static/worker-wasm/ddv_save_core_bg.wasm
          test -s static/worker-wasm/manifest.json
          test -s static/worker-wasm/Cargo.lock
          test -z "$(git ls-files static/worker-wasm tests/wasm-distribution/fixtures)"
      - name: Build candidate as same-origin Pages /web, WITHOUT deploying
        env:
          BASE_PATH: /web
        run: |
          npm ci --no-audit --no-fund
          npm run build
          test -s build/worker-wasm/ddv_save_core.js
          test -s build/worker-wasm/ddv_save_core_bg.wasm
          test -s build/worker-wasm/manifest.json
          test -s build/worker-wasm/Cargo.lock
          test -f build/editor/timing/index.html
      - name: TRUE Chrome Worker built JS+WASM /web and tamper/ABI/origin negatives
        env:
          WAND_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          WAND_CANDIDATE_BASE_PATH: /web
        run: node tests/wasm-distribution/chrome-smoke.mjs
      - name: Build same candidate at custom-domain empty base, NOT deploying
        env:
          BASE_PATH: ''
        run: |
          npm run build
          test -s build/worker-wasm/ddv_save_core.js
          test -s build/worker-wasm/ddv_save_core_bg.wasm
          test -s build/worker-wasm/manifest.json
      - name: TRUE Chrome Worker custom-origin root and dual hash negatives
        env:
          WAND_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          WAND_CANDIDATE_BASE_PATH: ''
        run: node tests/wasm-distribution/chrome-smoke.mjs
      - name: Publish auditable candidate ONLY as isolated short-lived CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: r22-source-pinned-rust-wasm-js-and-binary-candidate-unsigned
          path: static/worker-wasm/
          retention-days: 3
          if-no-files-found: error
      - name: Verify distribution still OFF for product and private assets absent
        run: |
          test -z "$(git ls-files static/worker-wasm tests/stage-e/pkg tests/stage-f/fixtures tests/wasm-distribution/fixtures)"
          test ! -f src/lib/ddv/core/save/product-wasm-distribution-flag-on.js
          ! grep -R -E 'STEAM_SAVE_OWNER_PRIVATE|writerAuthorized: *true|applyAuthorized: *true|realOwnerPrivateSave: *true' scripts/wasm-distribution tests/wasm-distribution src/lib/ddv/core/save/product-rust-wasm-candidate-loader.mjs
      - name: No product Editor, Writer or generated binary promoted
        run: |
          test ! -f src/lib/ddv/core/save/p1g-rust-worker-readonly-bridge.js
          test ! -f tests/stage-f/fixtures/synthetic626.p1g.NOT_PRIVATE
          test -z "$(git ls-files tests/stage-e/pkg)"
          ! grep -R -E 'STEAM_SAVE_OWNER_PRIVATE|writerAuthorized: *true|applyAuthorized: *true|include_bytes!' tests/stage-f src/lib/ddv/core/save/p1g-rust-worker-readonly-bridge.mjs

name: QR WEB252 Independent Source150 Service Adapter
on:
  push:
    branches: ['qr/x05-web252-independent-20261028']
  pull_request:
    branches: ['web/x05-source150-strict-service-adapter-20261028']
permissions:
  contents: read
jobs:
  independent:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact Owner pin and protected Source unchanged
        run: |
          set -euo pipefail
          git merge-base --is-ancestor c80b48336fa6b0f5de9afd24b452387116f283f4 HEAD
          test -z "$(git diff --name-only c80b48336fa6b0f5de9afd24b452387116f283f4 HEAD -- src supabase)"
          test -z "$(git diff --name-only e2e965c113fd2fc651b81a21e82b90f1c26d1090 c80b48336fa6b0f5de9afd24b452387116f283f4 -- supabase)"
          node --test tests/qr-x05-web252-independent.test.mjs
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm run build

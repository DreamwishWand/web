name: WEB first Account signup login and private Library fail-closed UI
on:
  push:
    branches:
      - 'web/first-account-ui-*'
  pull_request:
    paths:
      - 'src/lib/account-ui/test-contract.mjs'
      - 'src/lib/account-ui/copy.mjs'
      - 'src/routes/account/+page.svelte'
      - 'tests/web-first-account-local-ui.test.mjs'
      - 'scripts/web-first-account-local-chrome.mjs'
      - '.github/workflows/web-first-account-ui.yml'
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - name: Exactly seven new 08 WEB first Account route/test paths and no existing Auth mutation
        shell: bash
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha || '' }}"
          if test -z "$BASE"; then BASE="$(git merge-base origin/main HEAD)"; fi
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"
          git diff --name-only "$BASE" HEAD >/tmp/wand-account-paths
          test "$(wc -l </tmp/wand-account-paths)" -eq 6
          for required in src/lib/account-ui/test-contract.mjs src/lib/account-ui/copy.mjs src/routes/account/+page.svelte tests/web-first-account-local-ui.test.mjs scripts/web-first-account-local-chrome.mjs .github/workflows/web-first-account-ui.yml; do
            grep -qxF "$required" /tmp/wand-account-paths
          done
          git diff --exit-code "$BASE" HEAD -- src/lib/community/ src/routes/community-lab/ src/routes/collection/ src/lib/ddv/ src/lib/wep/ src/lib/collection/ src/routes/+layout.svelte src/routes/+layout.server.js svelte.config.js .github/workflows/pages.yml static/ supabase/
          echo WEB_ACCOUNT_SOURCE7_AUTH_CLIENT_REUSED_NO_GRANT_OR_PAGES_CHANGE_PASS
      - name: Local synthetic signup confirmation, current signed Account and privacy negatives
        run: node --test tests/web-first-account-local-ui.test.mjs
      - name: Full Node Svelte checks and existing static Pages build
        env:
          BASE_PATH: /web
          VITE_WAND_DISPOSABLE_ACCOUNT_TEST: ''
        run: |
          npm test
          npm run check
          npm run build
          test -f build/account/index.html
          test ! -f build/library/index.html
          test ! -f build/users/example_123/index.html
          test ! -f build/ja/40000047/index.html
          echo WEB_ACCOUNT_OFF_PAGES_STATIC_NO_DYNAMIC_PROFILE_HTTP200_PASS
  chrome:
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm install --no-save --package-lock=false playwright-core@1.55.0
      - name: Build safe default OFF static output and start disposable local preview
        shell: bash
        env:
          BASE_PATH: /web
          VITE_WAND_DISPOSABLE_ACCOUNT_TEST: ''
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          "$CHROME_BIN" --version
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
          npm run build
          BASE_PATH='' npm run dev -- --host 127.0.0.1 --port 4292 >/tmp/wand-first-account.log 2>&1 &
          for i in $(seq 1 75); do
            if curl -fsS http://127.0.0.1:4292/account/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/wand-first-account.log
          exit 1
      - name: Actual Chrome 8 locale Account OFF, Library noindex, 320 and keyboard
        env:
          WAND_ACCOUNT_URL: http://127.0.0.1:4292
        run: node scripts/web-first-account-local-chrome.mjs
      - name: Managed GoTrue Auth RLS user profile and private Library still separate gates
        run: echo WEB_ACCOUNT_MANAGED_AUTH_SIGNED_RLS_401_403_HTTPS_NOT_RUN

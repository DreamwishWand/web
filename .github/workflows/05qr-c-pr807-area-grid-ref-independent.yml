name: 05 QR-C PR807 independent native Area GridID source-scoped CAS QA
on:
  pull_request:
    paths:
      - 'crates/ddv-save-core/tests/qa_05qrc_area_grid_ref_807.rs'
      - 'tests/qa-05qrc-807-native-area-grid-cli.test.mjs'
      - '.github/workflows/05qr-c-pr807-area-grid-ref-independent.yml'
  push:
    branches:
      - 'qa/05qrc-pr807-area-grid-slice-21e709cd-20261108'
permissions:
  contents: read
jobs:
  focused-native-area-grid:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_TARGET_DIR: /tmp/wand-05qrc-pr807-native-target
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Freeze source PR807 original8 blobs and QA-only exact3
        shell: bash
        run: |
          set -euo pipefail
          source=21e709cdc213080539094cd394a342384152ac76
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            qa_tip="$(git rev-parse HEAD^2)"
          else
            qa_tip="$(git rev-parse HEAD)"
          fi
          git merge-base --is-ancestor "$source" "$qa_tip"
          test "$(git rev-parse "$qa_tip":.github/workflows/01a-private-native-rust-v1.yml)" = 3cdad891e739a2a8583a024534885ca88af1ba0f
          test "$(git rev-parse "$qa_tip":crates/ddv-save-core/src/bin/wand-local-rust-v1.rs)" = 923c06594fc91d36acdcd887ee0d7736c4297592
          test "$(git rev-parse "$qa_tip":crates/ddv-save-core/src/indexed_read.rs)" = dccf27ba6eb5b36156e4451c47af56d24ef9054f
          test "$(git rev-parse "$qa_tip":crates/ddv-save-core/src/lib.rs)" = 5367ac0c7822b8dd4a3d728be4e20bbdf71ccebe
          test "$(git rev-parse "$qa_tip":crates/ddv-save-core/src/native_reference_slice.rs)" = 84639ba382f7a35b99b4bd689363ce6a45a668b2
          test "$(git rev-parse "$qa_tip":crates/ddv-save-core/src/product_session.rs)" = 40bcc8cc5e9bfc8e51408a957a22bf35c6ff51cb
          test "$(git rev-parse "$qa_tip":docs/core/01a-native-area-grid-reference-slice-20261108.md)" = 1b5367df9926da54d995e73fa2bbc113454971fe
          test "$(git rev-parse "$qa_tip":tests/native-owner-area-grid-slice.test.mjs)" = a21ec3528e582cceca7677f0287ad4848d3ed18c
          actual="$(git diff --name-only "$source" "$qa_tip" | sort)"
          expected="$(printf '%s\n' .github/workflows/05qr-c-pr807-area-grid-ref-independent.yml crates/ddv-save-core/tests/qa_05qrc_area_grid_ref_807.rs tests/qa-05qrc-807-native-area-grid-cli.test.mjs | sort)"
          test "$actual" = "$expected"
          node --check tests/qa-05qrc-807-native-area-grid-cli.test.mjs
          test -z "$(git diff --name-only "$source" "$qa_tip" -- crates/ddv-save-core/src crates/ddv-save-core/Cargo.toml tools src)"
          test -z "$(git ls-files | grep -E 'STEAM_SAVE_OWNER_PRIVATE|OWNER_PRIVATE|\.p1g$' || true)"
      - name: Independent actual Rust ProductSession Area Grid scope and negatives
        shell: bash
        run: |
          set -euo pipefail
          cargo test --manifest-path crates/ddv-save-core/Cargo.toml --features private-native-v1 --test qa_05qrc_area_grid_ref_807 -- --nocapture
      - name: Build original native-only V1 executable for new slice
        shell: bash
        run: |
          set -euo pipefail
          cargo build --manifest-path crates/ddv-save-core/Cargo.toml --features private-native-v1 --release --bin wand-local-rust-v1
          test -x "$CARGO_TARGET_DIR/release/wand-local-rust-v1"
      - name: Independent actual native CLI positive and forged source input negatives
        shell: bash
        env:
          QRC807_NATIVE_V1: /tmp/wand-05qrc-pr807-native-target/release/wand-local-rust-v1
        run: |
          set -euo pipefail
          node --test tests/qa-05qrc-807-native-area-grid-cli.test.mjs
      - name: Existing worker Rust WASM Indexed Read ABI still compiles
        shell: bash
        run: |
          set -euo pipefail
          cargo check --manifest-path crates/ddv-save-core/Cargo.toml --target wasm32-unknown-unknown --features worker-wasm,indexed-read --lib
      - name: New native Area Grid opt-in MUST fail if linked into WASM
        shell: bash
        run: |
          set -euo pipefail
          if cargo check --manifest-path crates/ddv-save-core/Cargo.toml --target wasm32-unknown-unknown --features worker-wasm,private-native-v1 --lib > /tmp/05qrc-pr807-forbidden-wasm.log 2>&1; then
            echo "SECURITY_ERROR: native-only Area Grid reader WASM linked"
            exit 1
          fi
          grep -F "private-native-v1 is native-only and cannot enter WASM" /tmp/05qrc-pr807-forbidden-wasm.log >/dev/null
          rm -f /tmp/05qrc-pr807-forbidden-wasm.log
      - name: Proof no private Save or product Source/Writer/Worker mutation
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            qa_tip="$(git rev-parse HEAD^2)"
          else
            qa_tip="$(git rev-parse HEAD)"
          fi
          test "$(git diff --name-only 21e709cdc213080539094cd394a342384152ac76 "$qa_tip" | wc -l)" -eq 3
          test -z "$(git diff --name-only 21e709cdc213080539094cd394a342384152ac76 "$qa_tip" -- src tools crates/ddv-save-core/src)"
          test -z "$(git ls-files | grep -E 'STEAM_SAVE_OWNER_PRIVATE|OWNER_PRIVATE|\.p1g$' || true)"
          echo "QRC807_SOURCE8_QA3_RUST_AREAGRID_CAS_NATIVE_WASM_DENY_FOCUSED_PASS"

name: 09P ACT1581 fixed Switch626 Makeup R22 eight-blob Gate source proof only
on:
  pull_request:
    paths:
      - 'scripts/wasm-distribution/r22-accepted-rust-scope.mjs'
      - 'tests/09p-r22-switch626-makeup-gate-exact8.test.mjs'
      - 'tests/09p-r22-trusted-main-preflight.test.mjs'
      - 'scripts/wasm-distribution/r22-trusted-before-candidate.mjs'
      - 'tests/09p-r22-steam626-eyecolor2-repair.test.mjs'
      - 'tests/09p-r22-amount-battlepass-exact1-gate.test.mjs'
      - 'tests/09p-r22-amount-private-bridge-exact3-gate.test.mjs'
      - 'tests/09p-r22-windows-lf-pack-exact1-gate.test.mjs'
      - 'tests/09p-r22-mannequin-windows-dual-one-leaf-gate.test.mjs'
      - '.github/workflows/09p-r22-switch626-makeup-gate-exact8.yml'
permissions:
  contents: read
jobs:
  exact-reviewed-core-pair:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch exact accepted historical Makeup ABI Source Git objects, NEVER merge
        run: |
          git fetch --no-tags origin refs/pull/2217/head
          test "$(git rev-parse FETCH_HEAD)" = b2735bc63884049a5f3d16423e5970553f168766
          git cat-file -e b2735bc63884049a5f3d16423e5970553f168766^{commit}
      - name: Resolve immutable original private 01A bridge historical Git commit from protected ancestry
        run: |
          # PR2267 was merged via nonforce selected commit with original f6e7
          # as preserved parent. refs/pull/2267/head is MOVABLE after merge.
          # Never authorize that moving ref: test only original commit blob.
          git cat-file -e f6e789694323750d0c055a8434718116dba11fc7^{commit}
          test "$(git rev-parse f6e789694323750d0c055a8434718116dba11fc7:crates/ddv-save-core/src/semantic_writer.rs)" = f11c68ca214853c762788ae032710fc4683dd472
      - name: Fetch reviewed Windows LF SHA-pinned pack attribute ORIGINAL one file
        run: |
          git fetch --no-tags origin refs/pull/2276/head
          # Moving refs are discovery only. Original SHA remains immutable.
          git cat-file -e ad210aa3c551615b8c35f8b2970138760a59f5b6^{commit}
          test "$(git rev-parse ad210aa3c551615b8c35f8b2970138760a59f5b6:crates/ddv-save-core/data/.gitattributes)" = f67de2e4316397b93f95088c379f724ea81e9399
      - name: Fetch original 01A reviewed real Mannequin exact one Rust source
        run: |
          # Ref is DISCOVERY only. Verify literal original SHA, path and blob.
          git fetch --no-tags origin refs/pull/2278/head
          git cat-file -e 0778ed44da9b619989a34dde419c686c1934af64^{commit}
          test "$(git rev-parse 0778ed44da9b619989a34dde419c686c1934af64:crates/ddv-save-core/src/product_amount_scoped.rs)" = 522e8e8d6beec597b2e5e176cfbe8a6d8e38a124
      - name: Fixed 8-path Rust Source/core tree release gate POS, forged-bad Git commit NEG
        env:
          WAND_REQUIRE_SWITCH_MAKEUP_GATE_FOCUS: '1'
          WAND_REQUIRE_PRIVATE_AMOUNT_GATE_FOCUS: '1'
          WAND_REQUIRE_WINDOWS_LF_GATE_FOCUS: '1'
          WAND_REQUIRE_MANNEQUIN_GATE_FOCUS: '1'
        run: |
          node --test tests/09p-r22-switch626-makeup-gate-exact8.test.mjs
          node --test tests/09p-r22-trusted-main-preflight.test.mjs
          node --test tests/09p-r22-steam626-eyecolor2-repair.test.mjs
          node --test tests/09p-r22-amount-battlepass-exact1-gate.test.mjs
          node --test tests/09p-r22-amount-private-bridge-exact3-gate.test.mjs
          node --test tests/09p-r22-windows-lf-pack-exact1-gate.test.mjs
          node --test tests/09p-r22-mannequin-windows-dual-one-leaf-gate.test.mjs
      - name: Exactly reviewed Core/Cargo/R22 tuple, no Writer, Consumer or release grant
        shell: bash
        run: |
          set -euo pipefail
          core="$(git rev-parse HEAD:crates/ddv-save-core)"
          cargo="$(git rev-parse HEAD:crates/ddv-save-core/Cargo.toml)"
          config="$(git rev-parse HEAD:scripts/wasm-distribution/protected-release-inputs.json)"
          if [[ "$core" == b5416aa726caea9d311075599ac606e11285b295 &&
                "$cargo" == aa6b1dd771da305bf7a21c6101fb4620a8b74b93 &&
                "$config" == 5d2b35f6bc9f0b8544fc52f25a35614b59913d96 ]]; then
            echo R22_EXACT_STAGE_GATE_ONLY
          elif [[ "$core" == 42086449f9deef26ed48b21d7edab0f5685da7c2 &&
                  "$cargo" == 751a73da41d8b58f7de70643f50b97722a3c1260 &&
                  "$config" == 30551c7cc566614f64c8ba04748c3aef44b419bb ]]; then
            echo R22_EXACT_STAGE_PRODUCT_MAKEUP_ACCEPTED
          elif [[ "$core" == 36be23f81c4558eafd3557c85ac71ea56a1e3459 &&
                  "$cargo" == 751a73da41d8b58f7de70643f50b97722a3c1260 &&
                  "$config" == 30551c7cc566614f64c8ba04748c3aef44b419bb ]]; then
            echo R22_EXACT_STAGE_BATTLEPASS_ONE_LEAF_ACCEPTED
          elif [[ "$core" == 10e9e9bff19ef38c4a3d16def95c0b9448ce1d7c &&
                  "$cargo" == 751a73da41d8b58f7de70643f50b97722a3c1260 &&
                  "$config" == 30551c7cc566614f64c8ba04748c3aef44b419bb ]]; then
            echo R22_EXACT_STAGE_PRIVATE_NATIVE_BRIDGE_GATED
          elif [[ "$core" == 623034400b71179b790ae8eca7b152cd892c898f &&
                  "$cargo" == 751a73da41d8b58f7de70643f50b97722a3c1260 &&
                  "$config" == 30551c7cc566614f64c8ba04748c3aef44b419bb ]]; then
            echo R22_EXACT_STAGE_WINDOWS_LF_ONE_PACK_BLOB_GATED
          elif [[ "$core" == f67531cef7c812757b246a9aef08febb66782200 &&
                  "$cargo" == 751a73da41d8b58f7de70643f50b97722a3c1260 &&
                  "$config" == 30551c7cc566614f64c8ba04748c3aef44b419bb ]]; then
            echo R22_EXACT_STAGE_MANNEQUIN_REAL_MAP_ONE_RUST_GATED
          elif [[ "$core" == 2f712d047e99bc024672e4d7a488baa6276e06f4 &&
                  "$cargo" == 751a73da41d8b58f7de70643f50b97722a3c1260 &&
                  "$config" == 30551c7cc566614f64c8ba04748c3aef44b419bb ]]; then
            echo R22_EXACT_STAGE_WINDOWS_MANNEQUIN_BOTH_IN_ORDER_GATED
          elif [[ "$core" == f8ca1bfe087258376a9cfbc0bfe18385f7d20828 &&
                  "$cargo" == 751a73da41d8b58f7de70643f50b97722a3c1260 &&
                  "$config" == 30551c7cc566614f64c8ba04748c3aef44b419bb &&
                  "$(git rev-parse HEAD:crates/ddv-save-core/src/product_session.rs)" == 34286a10bc726d9195d806b15273792614c99fa6 ]]; then
            echo R22_EXACT_STAGE_FINISH_DECODED_VEC_SCRUB_CORE_ONLY_WRITER_OFF
          elif [[ "$core" == 42bebc4aa5a451abc4a9df29f0bc298df92df6a3 &&
                  "$cargo" == 751a73da41d8b58f7de70643f50b97722a3c1260 &&
                  "$config" == 30551c7cc566614f64c8ba04748c3aef44b419bb &&
                  "$(git rev-parse HEAD:crates/ddv-save-core/src/product_session.rs)" == e53c4930a84f729ea245f38a1b301c7178146ced ]]; then
            echo R22_EXACT_STAGE_FINISH_DECODED_ARC_FINAL_DROP_WIPE_WRITER_OFF
          else
            echo R22_UNAPPROVED_CORE_CARGO_CONFIG_STAGE >&2
            exit 1
          fi
          test "$(git rev-parse HEAD:scripts/wasm-distribution/r22-trusted-before-candidate.mjs)" = 5aefdaff6a46ae9bdf1f5a37c4f0973442308a4a
          node --input-type=module -e "import assert from 'node:assert/strict';import {readFileSync} from 'node:fs';const c=JSON.parse(readFileSync('scripts/wasm-distribution/protected-release-inputs.json','utf8'));assert.equal(c.writerEnabled,false);assert.equal(c.productConsumerEnabled,false);assert.equal(c.approvedCargoLockSha256,'e58486d673df79bfe7e72b80449e39389e57010fe4051edcdcff9b53c2da898c');"
          test ! -e build/worker-wasm-switch626-makeup-color1
          echo R22_EXACT_SCOPED_SOURCE_NO_RELEASE_NO_WRITER_ON

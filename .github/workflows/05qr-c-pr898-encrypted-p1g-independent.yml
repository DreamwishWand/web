name: 05 QR-C PR898 independent encrypted Steam P1G same Rust Worker Chrome
on:
  push:
    branches:
      - 'qa/05qrc-pr898-encrypted-p1g-single-worker-b0f38c02-20261111'
  pull_request:
    paths:
      - 'tests/stage-f/qa-05qrc-pr898-independent.mjs'
      - '.github/workflows/05qr-c-pr898-encrypted-p1g-independent.yml'
permissions:
  contents: read
jobs:
  qa-pr898-changed-nine-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CARGO_TARGET_DIR: /tmp/qa05qrc898-core
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Pin immutable Source original 9 and strictly QA-only 2 added paths
        shell: bash
        run: |
          set -euo pipefail
          source=b0f38c02c976d9c827d31af8808da46ebb939163
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            qa_tip="$(git rev-parse HEAD^2)"
          else
            qa_tip="$(git rev-parse HEAD)"
          fi
          git merge-base --is-ancestor "$source" "$qa_tip"
          declare -A blobs=(
            [".github/workflows/01a-private-native-rust-v1.yml"]="77d76db2c07b8d3b612fcb5fe0ef201c9b153ac6"
            ["src/lib/ddv/core/save/local-steam-p1g-saved-diffgrids-facade.mjs"]="497685240690005dd7c9bbc8e88ec59e58c06be5"
            ["src/lib/ddv/core/save/p1g-rust-worker-readonly-bridge.mjs"]="6b3a527cbde3235643451b42f307348e8fe62592"
            ["src/lib/ddv/core/save/product-wasm-read-owner.d.mts"]="17c1e9db943e6bc8252a94386ff1e276e1106d70"
            ["src/lib/ddv/core/save/product-wasm-read-owner.mjs"]="0cd857d76119558eb42c256f363ef6006e547575"
            ["tests/stage-f/chrome-smoke.mjs"]="e0acb79ece513e98b5f189654d4bf63abf114760"
            ["tests/stage-f/generate-fixture.mjs"]="661c96cac371ca9d573b4e7cb6e7f3f2d3038d5d"
            ["tests/stage-f/saved-diffgrids-facade-real-worker.mjs"]="6e2c1b0c0847b3e90f3183c309e10dfca37e428d"
            ["tests/stage-f/worker.mjs"]="8cfefaf77b3192bcb886b6a84879fc65bdb2d15a"
          )
          for path in "${!blobs[@]}"; do
            test "$(git rev-parse "$qa_tip:$path")" = "${blobs[$path]}"
          done
          actual="$(git diff --name-only "$source" "$qa_tip" | sort)"
          expected="$(printf '%s\n' .github/workflows/05qr-c-pr898-encrypted-p1g-independent.yml tests/stage-f/qa-05qrc-pr898-independent.mjs | sort)"
          test "$actual" = "$expected"
          test -z "$(git ls-files | grep -E 'OWNER_PRIVATE|STEAM_SAVE_OWNER_PRIVATE|\.p1g$' || true)"
      - name: New independent script syntax and existing changed JS boundaries
        run: |
          node --check tests/stage-f/qa-05qrc-pr898-independent.mjs
          node --check src/lib/ddv/core/save/local-steam-p1g-saved-diffgrids-facade.mjs
          node --check src/lib/ddv/core/save/product-wasm-read-owner.mjs
          node --test tests/p1g-rust-worker-readonly-bridge.test.mjs
      - name: Actual Rust ABI and strict single ProductSession feature compile
        run: |
          cargo check --manifest-path crates/ddv-save-core/Cargo.toml --lib
          cargo check --manifest-path crates/ddv-save-core/Cargo.toml --features indexed-read --lib
          cargo build --manifest-path crates/ddv-save-core/Cargo.toml --release --target wasm32-unknown-unknown --features worker-wasm,indexed-read
          test -s "$CARGO_TARGET_DIR/wasm32-unknown-unknown/release/ddv_save_core.wasm"
      - name: Generate exact authentic Rust wasm-bindgen 0.2.105 Worker ESM
        run: |
          cargo install wasm-bindgen-cli --version 0.2.105 --locked --root /tmp/qa05qrc898-bindgen
          /tmp/qa05qrc898-bindgen/bin/wasm-bindgen --version | grep -F '0.2.105'
          mkdir -p tests/stage-e/pkg
          /tmp/qa05qrc898-bindgen/bin/wasm-bindgen "$CARGO_TARGET_DIR/wasm32-unknown-unknown/release/ddv_save_core.wasm" --out-dir tests/stage-e/pkg --target web --no-typescript
          test -s tests/stage-e/pkg/ddv_save_core.js
          test -s tests/stage-e/pkg/ddv_save_core_bg.wasm
      - name: Generate only synthetic encrypted P1G, never private real Save
        run: |
          node tests/stage-f/generate-fixture.mjs
          test -s tests/stage-f/fixtures/synthetic626-diffgrids.p1g
          test -z "$(git ls-files tests/stage-f/fixtures)"
      - name: Inject independent QA into real Chrome Module Worker only in CI working tree
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path=Path('tests/stage-f/worker.mjs')
          src=path.read_text()
          anchor='  const savedDiffGrids=await testRealEncryptedSavedDiffGridsFacade(WorkerWasmSource);'
          assert src.count(anchor)==1
          src="import {independentQrC898} from './qa-05qrc-pr898-independent.mjs';\n"+src
          src=src.replace(anchor,
            "  const independent=await independentQrC898(WorkerWasmSource);\n"
            "  if(!independent.realRustWasm || !independent.realChromeWorker ||\n"
            "     !independent.forgedRustGrantAndPagesDenied || independent.writerAuthorized)\n"
            "    throw Error('QAC898_NEW_SCOPE_NOT_ACCEPTED');\n"
            +anchor)
          path.write_text(src)
          PY
      - name: Real installed Chrome synthetic encrypted P1G to actual Rust WASM Worker QA
        run: |
          command -v google-chrome
          node tests/stage-f/chrome-smoke.mjs
          echo QAC898_REAL_CHROME_ENCRYPTED_P1G_ONE_RUST_SESSION_FORGED_RECEIPT_NEGATIVES_PASS
      - name: Verify no new Reader UI, Owner private data or Writer activated in Source
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const facade=readFileSync('src/lib/ddv/core/save/local-steam-p1g-saved-diffgrids-facade.mjs','utf8');
          const bridge=readFileSync('src/lib/ddv/core/save/p1g-rust-worker-readonly-bridge.mjs','utf8');
          assert.match(facade,/createP1gRustWorkerReadOnlyBridge/);
          assert.match(bridge,/createProductWasmReadOwner/);
          assert.doesNotMatch(facade,/fetch\(|XMLHttpRequest|cloudUploadPerformed:true|writerAuthorized:true/);
          assert.doesNotMatch(bridge,/new Worker\(|createRustDecoder|createProductSession/);
          console.log('QAC898_ONE_DECODER_ONE_RUST_WORKER_NOT_PRODUCT_PUBLIC');
          NODE
          test -z "$(git ls-files | grep -E 'OWNER_PRIVATE|\.p1g$' || true)"
          test -z "$(git diff --name-only b0f38c02c976d9c827d31af8808da46ebb939163 HEAD -- src/lib/ddv/core/save crates/ddv-save-core)"

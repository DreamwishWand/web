          console.log('CURRENT_COLLECTION_PROOF_SUBJECT_L2_PASS',JSON.stringify({pos:1,neg,methods:14,exports:23,actualGeneratedWasm:true,approvedLock:true,actualSignature:false,jsSha256:sha(js),wasmSha256:sha(wasm),manifestSha256:p.manifestSha256}));
          

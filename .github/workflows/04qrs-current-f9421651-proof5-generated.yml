          node qa-current-collection.mjs
          test -z "$(git diff --name-only HEAD -- static build src/lib/ddv/core/save)"
      - name: Current Core with accepted fixed union adapter overlay (QA only)
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = b937c1d2cebcd81dfa7b18a754b46e43da118b13
          test "$(git rev-parse HEAD:crates/ddv-save-core)" = f942165161b98cf7f9de16a1f7459cf3d337dc61
          test "$(git rev-parse HEAD:scripts/wasm-distribution/protected-release-inputs.json)" = 636955805479ed9794896c0d06acbf991c10bf14
          test "$(git rev-parse HEAD:scripts/wasm-distribution/r22-accepted-rust-scope.mjs)" = 83a26102290370bc492417bdc57b1571b5f3c775
          test "$(git rev-parse HEAD:scripts/readonly-release/scoped-placement-proof.mjs)" = 5e0bcc0ed447eea1b020219fe8bafd32a4d49073

name: "04 QR-W PR888 new7 independent Spotlight Tour and approved WEP inventory"
on:
  push:
    branches: [qa/04qr-w-pr888-header-tour-inventory-new7-20261110]
  pull_request:
    paths:
      - ".github/workflows/04qr-w-pr888-header-tour-inventory-new7-20261110.yml"
      - "scripts/04qr-w-pr888-header-tour-inventory-new7-20261110.mjs"
permissions:
  contents: read
jobs:
  independent-typed-tour-chrome:
    runs-on: ubuntu-24.04
    timeout-minutes: 39
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm install --no-save --package-lock=false playwright-core@1.55.0
      - name: "Start standalone new source UI with no private DDV Save"
        shell: bash
        run: |
          set -euo pipefail
          test -z "${DDV_PRIVATE_SAVE_PATH:-}"
          test -z "${WEP_PRIVATE_P1G_PATH:-}"
          test -z "${P1G_PATH:-}"
          BIN="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || true)"
          test -n "$BIN"
          "$BIN" --version
          echo "CHROME_BIN=$BIN" >> "$GITHUB_ENV"
          BASE_PATH='' npm run dev -- --host 127.0.0.1 --port 4396 >/tmp/qrw888.log 2>&1 &
          for i in $(seq 1 85); do
            if curl -fsS http://127.0.0.1:4396/presets/ >/dev/null; then exit 0; fi
            sleep 1
          done
          tail -n 100 /tmp/qrw888.log
          exit 1
      - name: "Independent original seven exact SHA / WEP inventory / installed real Chrome"
        env:
          QRW888_ORIGIN: http://127.0.0.1:4396
        run: node scripts/04qr-w-pr888-header-tour-inventory-new7-20261110.mjs
      - name: "QA-only and all product writer gates OFF"
        run: echo "QRW888_QA_ONLY_NOT_MERGE_WRITER_NATIVEV3_APPLY_CLOUD_PROVIDER_MEDIAPUBLIC_COMMUNITYPUBLIC_OFF"

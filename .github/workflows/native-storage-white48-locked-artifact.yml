name: Native Storage receipt locked executable
on:
  pull_request:
    paths:
      - '.github/workflows/native-storage-white48-locked-artifact.yml'
permissions:
  contents: read
jobs:
  locked-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 656681239b48cb367c24f92c3dc7990d8eb36765
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
      - name: Exact approved source and lock
        run: |
          test "$(git rev-parse HEAD)" = 656681239b48cb367c24f92c3dc7990d8eb36765
          test "$(git rev-parse HEAD:crates/ddv-save-core/src/saved_diffgrids_index.rs)" = 8f7ecce0c41f5fb0fee575e00d11ded06363f9de
          test "$(git rev-parse HEAD:crates/ddv-save-core/examples/wand-private-storage-read.rs)" = 6f1f0624e7fdf17a7a2e368b1cd3a19a88464dc5
          printf '%s' '' | base64 -d | gzip -d > crates/ddv-save-core/Cargo.lock
          echo 'e58486d673df79bfe7e72b80449e39389e57010fe4051edcdcff9b53c2da898c  crates/ddv-save-core/Cargo.lock' | sha256sum -c -
          cargo build --locked --manifest-path crates/ddv-save-core/Cargo.toml --release --no-default-features --features private-native-v1 --example wand-private-storage-read
          echo 'e58486d673df79bfe7e72b80449e39389e57010fe4051edcdcff9b53c2da898c  crates/ddv-save-core/Cargo.lock' | sha256sum -c -
      - name: Verify compiled executable synthetic positive and negative
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,subprocess,tempfile
          exe=pathlib.Path('crates/ddv-save-core/target/release/examples/wand-private-storage-read').resolve()
          assert exe.read_bytes()[:4]==b'\x7fELF'
          sha=lambda b:hashlib.sha256(b).hexdigest()
          item=40001838
          d={"GameInfo":{"Version":626},"Player":{"NextContainerInventoryID":20,
            "ContainerInventories":{"12":{"ID":12,"ParentItemID":item,"BelongsToPlayer":True,
              "BlockMoveTo":False,"Size":48,"ExtraSize":0,"Inventory":[]}},
            "ListInventories":{"0":{"ID":0,"CompatibleItemType":"ItemType_Furniture","Inventory":{str(item):{"Amount":0}}}}},
            "World":{"GridCollection":{"Grids":{"7":{"ID":7,"Objects":{"4":{"ID":4,"ItemID":item,
              "X":2,"Y":1,"Orientation":"GridOrientation_Up","State":{"Storage":{"ContainerInventoryID":12,
              "DefaultContainerInventoryData":"","UnlockKeyItemID":0,"UnlockLocId":"","DesignID":None}}}}}}}}}
          with tempfile.TemporaryDirectory(prefix='wand-synthetic-artifact-') as t:
            p=pathlib.Path(t);p.chmod(0o700)
            raw=json.dumps(d,separators=(',',':')).encode()
            env=dict(os.environ,WAND_LOCAL_INSTALLED_STEAM_FULLVERSION='releases_1.25-v1.25.3-44-g0b41250d9ac0-incremental-22',
                WAND_LOCAL_ORIGINAL_SHA256=sha(b'public-synthetic-placeholder'),WAND_LOCAL_ORIGINAL_SIZE_BYTES='128',
                WAND_LOCAL_DECODED_SHA256=sha(raw))
            out=p/'receipt.json'
            args=[str(exe),'--storage48-white-object','7','4','--out',str(out)]
            r=subprocess.run(args,input=raw,env=env,capture_output=True)
            assert r.returncode==0 and not r.stdout
            v=json.loads(out.read_bytes())
            assert v['contract']=='wand.native.private.storage48-white-stored-readset@1'
            assert v['target']['itemId']==item and v['container']['size']==48
            assert v['container']['physicalSlotCount']==0 and v['writerAuthorized'] is False
            assert out.stat().st_mode&0o777==0o600
            old=out.read_bytes()
            r=subprocess.run(args,input=raw,env=env,capture_output=True)
            assert r.returncode!=0 and not r.stdout and out.read_bytes()==old
            bad=p/'reject.json'
            args[-1]=str(bad);args[2]='8'
            r=subprocess.run(args,input=raw,env=env,capture_output=True)
            assert r.returncode!=0 and not r.stdout and not bad.exists()
          print('LOCKED_STORAGE_ARTIFACT_SYNTHETIC_1POS2NEG_PASS')
          PY
      - name: Package exact source, lock, manifest and executable only
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,subprocess,zipfile
          root=pathlib.Path.cwd()
          bundle=pathlib.Path(os.environ['RUNNER_TEMP'])/'wand-white48-executor.zip'
          sha=lambda b:hashlib.sha256(b).hexdigest()
          def git(*args): return subprocess.check_output(['git',*args],text=True).strip()
          paths=subprocess.check_output(['git','ls-files','-z','crates/ddv-save-core/']).decode().split('\0')
          payload=[]
          with zipfile.ZipFile(bundle,'w',zipfile.ZIP_DEFLATED,compresslevel=9) as z:
            for name in sorted(filter(None,paths)):
              p=root/name
              assert p.is_file() and not p.is_symlink()
              data=p.read_bytes(); blob=git('rev-parse','HEAD:'+name)
              assert git('hash-object',name)==blob
              z.write(p,name)
              payload.append({"path":name,"bytes":len(data),"sha256":sha(data),"gitBlob":blob})
            for source_path,name in [
              ('crates/ddv-save-core/Cargo.lock','crates/ddv-save-core/Cargo.lock'),
              ('crates/ddv-save-core/target/release/examples/wand-private-storage-read','bin/wand-private-storage-read')]:
              p=root/source_path;data=p.read_bytes()
              assert name not in [x['path'] for x in payload]
              z.write(p,name);payload.append({"path":name,"bytes":len(data),"sha256":sha(data)})
            manifest={"contract":"wand.native.storage-executor-build@1","sourceCommit":git('rev-parse','HEAD'),
              "sourceTree":git('rev-parse','HEAD^{tree}'),"rustc":subprocess.check_output(['rustc','--version'],text=True).strip(),
              "cargo":subprocess.check_output(['cargo','--version'],text=True).strip(),"features":["private-native-v1"],
              "build":"release --locked --no-default-features --example wand-private-storage-read",
              "lockSha256":"e58486d673df79bfe7e72b80449e39389e57010fe4051edcdcff9b53c2da898c",
              "syntheticReplay":"1POS2NEG_PASS","payload":payload}
            z.writestr('manifest.json',json.dumps(manifest,sort_keys=True,separators=(',',':')).encode())
          with zipfile.ZipFile(bundle) as z:
            assert z.testzip() is None and len(z.namelist())==len(set(z.namelist()))
            m=json.loads(z.read('manifest.json'))
            for x in m['payload']:
              data=z.read(x['path']);assert len(data)==x['bytes'] and sha(data)==x['sha256']
          print('LOCKED_STORAGE_BUNDLE_BYTES',bundle.stat().st_size,'SHA256',sha(bundle.read_bytes()))
          print('LOCKED_STORAGE_ELF',next(x for x in payload if x['path'].startswith('bin/')))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: wand-white48-locked-native-executor-synthetic-tested
          path: ${{ runner.temp }}/wand-white48-executor.zip
          retention-days: 1
          if-no-files-found: error

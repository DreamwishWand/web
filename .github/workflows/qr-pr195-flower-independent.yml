name: 04 QR PR195 Flower New-Only Independent Guard
on:
  pull_request:
    paths:
      - 'tests/qr-pr195-flower-newonly-crosscontract-independent.test.mjs'
      - 'docs/qa/qr-pr195-flower-newonly-original-acceptance-20261027.md'
      - '.github/workflows/qr-pr195-flower-independent.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  flower-newonly:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      DATABASE_URL: ''
      SUPABASE_ACCESS_TOKEN: ''
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pin exact Owner Flower/accepted prior Activity/CollectionDefinition blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          test -z "$DATABASE_URL" && test -z "$SUPABASE_ACCESS_TOKEN"
          test "$(git hash-object static/ddv/core/collection/v1.25/native-activity-flower-original-predicate-v125.json)" = '8d726747ac06d4cb96b4805e9205dc1870a5f644'
          test "$(git hash-object static/ddv/core/collection/v1.25/native-activity-raw-wire-hastag-fallback-v125.json)" = '457df3a0f0349166957a68621b81578ff43f9354'
          test "$(git hash-object static/ddv/core/collection/v1.25/collection-definition-source-compact-v125.json)" = '7622ff51f6e48315893d7b75f08e51c248d09f2e'
      - name: 3 new-only Flower coverage/gate/release boundary regression cases
        run: node --test tests/qr-pr195-flower-newonly-crosscontract-independent.test.mjs
      - name: Do not equate CI to independent private original game byte replay
        run: echo 'QR_FLOWER_LOCAL_ORIGINAL_SOURCE_NATIVE_PASS__CI_CROSSCONTRACT_ONLY__RUNTIME_UNKNOWN__NO_WRITER'

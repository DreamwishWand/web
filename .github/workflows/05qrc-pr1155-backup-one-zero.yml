name: 05 QR-C PR1155 amount-one catalog-zero independent
on:
  pull_request:
    paths:
      - 'crates/ddv-save-core/tests/qa_pr1155_backup_one_zero.rs'
      - 'tests/qa/05qrc-pr1155-backup-one-zero.py'
      - '.github/workflows/05qrc-pr1155-backup-one-zero.yml'
permissions:
  contents: read
jobs:
  independent:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
          targets: wasm32-unknown-unknown
      - name: Exact child4 and QA-only adds
        run: |
          git merge-base --is-ancestor 3ded8521487ba043e9b23b041443b3aa9470a5b2 HEAD
          test "$(git diff --name-only 3ded8521487ba043e9b23b041443b3aa9470a5b2 HEAD | wc -l)" -eq 3
          test "$(git diff --diff-filter=A --name-only 3ded8521487ba043e9b23b041443b3aa9470a5b2 HEAD | wc -l)" -eq 3
          test "$(git rev-parse HEAD:crates/ddv-save-core/src/semantic_writer.rs)" = d359ee30c911923bb2425b2145c53f1245875d0c
          test "$(git rev-parse HEAD:crates/ddv-save-core/src/portable_backup.rs)" = c075bbf764aa2372eaf2a844d81ca1c10e11c1c3
          test "$(git rev-parse HEAD:crates/ddv-save-core/src/bin/wand-local-rust-v2-noop.rs)" = 6816779abd27eec22f74c4629d3de27b01716554
          test "$(git rev-parse HEAD:tests/native-owner-semantic-writer.test.mjs)" = f398e3536ef6a603b3b09d1e94b64d5d6a56b672
      - name: Locked direct capture review and wire integrity
        run: |
          printf '%s' '' | base64 -d | gzip -d > crates/ddv-save-core/Cargo.lock
          echo 'e58486d673df79bfe7e72b80449e39389e57010fe4051edcdcff9b53c2da898c  crates/ddv-save-core/Cargo.lock' | sha256sum -c -
          cargo test --locked --manifest-path crates/ddv-save-core/Cargo.toml --no-default-features --features private-native-v2,semantic-writer-dev --test qa_pr1155_backup_one_zero -- --nocapture
      - name: Actual parent and candidate native binary comparison
        run: |
          git worktree add --detach "$RUNNER_TEMP/backup-parent" 9a14efd693fb1705949fef884f2c7dede37be6d8
          cp crates/ddv-save-core/Cargo.lock "$RUNNER_TEMP/backup-parent/crates/ddv-save-core/Cargo.lock"
          cargo build --locked --manifest-path "$RUNNER_TEMP/backup-parent/crates/ddv-save-core/Cargo.toml" --target-dir "$RUNNER_TEMP/backup-old-target" --release --no-default-features --features private-native-v2,semantic-writer-dev --bin wand-local-rust-v2-noop
          cargo build --locked --manifest-path crates/ddv-save-core/Cargo.toml --release --no-default-features --features private-native-v2,semantic-writer-dev --bin wand-local-rust-v2-noop
          python3 tests/qa/05qrc-pr1155-backup-one-zero.py crates/ddv-save-core/target/release/wand-local-rust-v2-noop "$RUNNER_TEMP/backup-old-target/release/wand-local-rust-v2-noop"
      - name: Public and DEV WASM isolation
        run: |
          cargo check --locked --manifest-path crates/ddv-save-core/Cargo.toml --target wasm32-unknown-unknown --no-default-features --features worker-wasm,indexed-read
          cargo check --locked --manifest-path crates/ddv-save-core/Cargo.toml --target wasm32-unknown-unknown --no-default-features --features worker-wasm,indexed-read,semantic-writer-dev

name: "04 QR-W PR867 independent F-P04 new7 readonly detached Draft"
on:
  push:
    branches: [qa/04qr-w-pr867-detached-readonly-scene-new7-20261109]
  pull_request:
    branches: [main]
    paths:
      - "scripts/04qr-w-pr867-detached-readonly-scene-new7-20261109.mjs"
      - ".github/workflows/04qr-w-pr867-detached-readonly-scene-new7-20261109.yml"
permissions:
  contents: read
jobs:
  new-fp04-independent:
    runs-on: ubuntu-24.04
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm install --no-save --package-lock=false playwright-core@1.55.0
      - name: "Installed Chrome and disposable browser; no private P1G"
        shell: bash
        run: |
          set -euo pipefail
          test -z "${DDV_PRIVATE_SAVE_PATH:-}"
          test -z "${WEP_PRIVATE_P1G_PATH:-}"
          BIN="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || true)"
          test -n "$BIN"
          "$BIN" --version
          echo "CHROME_BIN=$BIN" >> "$GITHUB_ENV"
          BASE_PATH='' npm run dev -- --host 127.0.0.1 --port 4353 >/tmp/qrw867.log 2>&1 &
          for i in $(seq 1 75); do
            if curl -fsS http://127.0.0.1:4353/editor/world/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/qrw867.log
          exit 1
      - name: "Independent actual Chrome F-P04 changed7 and Node negative projector"
        env:
          QRW867_ORIGIN: http://127.0.0.1:4353
        run: node scripts/04qr-w-pr867-detached-readonly-scene-new7-20261109.mjs
      - name: "No change to product release/Writer/Cloud"
        run: echo QRW867_QA_ONLY_NEW_DETACHED_READONLY_NO_NATIVE_APPLY_EDITOR_MUTATION_WRITER_PUBLIC

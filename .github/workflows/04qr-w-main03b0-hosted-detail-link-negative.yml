name: "04 QR-W main03b0 actual managed HTTPS Detail-link differential"
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/04qr-w-main03b0-hosted-detail-link-negative.yml'
      - 'scripts/04qr-w-main03b0-hosted-detail-link-negative.mjs'
permissions:
  contents: read
jobs:
  genuine-public-pages-chrome:
    runs-on: ubuntu-24.04
    timeout-minutes: 26
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm install --no-save --package-lock=false playwright-core@1.55.0
      - name: Require real system Chrome and no confidential game material
        shell: bash
        run: |
          set -euo pipefail
          test -z "${WEP_PRIVATE_P1G_PATH:-}"
          test -z "${WEP_PRIVATE_LOCAL_ONLY_ACK:-}"
          test -z "${WEP_PRIVATE_EXTERNAL_BUILD_CONFIRMED:-}"
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$CHROME_BIN" || { echo "NOT_RUN Chrome unavailable"; exit 1; }
          "$CHROME_BIN" --version
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
      - name: Actual managed HTTPS direct responses plus changed-only Chrome
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/04qr-w-main03b0-hosted-detail-link-negative.mjs
          node scripts/04qr-w-main03b0-hosted-detail-link-negative.mjs

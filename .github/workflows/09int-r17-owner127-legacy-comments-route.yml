name: 09 INT R17 actual Source127 Gallery metadata independent route contrast
on:
  push:
    branches:
      - validation/09int-r17-owner127-comments-acl-safe-20261026
permissions:
  contents: read
jobs:
  r17-comments-old-route-vs-new-atomic:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SUPABASE_ACCESS_TOKEN: ''
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'psycopg[binary]>=3,<4'
      - uses: supabase/setup-cli@v1
        with:
          version: 2.81.3
      - name: Ensure exactly 127 Source migrations and isolated local config
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('supabase/config.toml')
          s=p.read_text()
          assert not any(x.strip().startswith('project_id =') for x in s.splitlines())
          assert len(list(Path('supabase/migrations').glob('*.sql')))==127
          p.write_text('project_id = "ddvre_09int_r17_comments_actual"\n'+s)
          PY
      - name: Bootstrap exact original Owner127 Source, EMPTY disposable DB
        shell: bash
        run: |
          set -euo pipefail
          timeout 1500s supabase start > /tmp/r17-comments-start.log 2>&1 || {
            grep -Ein -B 4 -A 7 'error|failed|sqlstate|migration' /tmp/r17-comments-start.log | tail -n 90 || true
            tail -n 40 /tmp/r17-comments-start.log || true
            exit 1
          }
      - name: Run actual two-backend new vs old Gallery comments RPCs
        env:
          DDVRE_R17_LOCAL: YES
        run: |
          set -euo pipefail
          python -u tests/09int-r17-source127-legacy-comments-route.py | tee /tmp/r17-comments-result.jsonl
          grep -F '09INT_R17_COMMENTS_SOURCE_GAP_CONFIRMED' /tmp/r17-comments-result.jsonl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r17-source127-comments-route-evidence
          path: |
            /tmp/r17-comments-start.log
            /tmp/r17-comments-result.jsonl
          if-no-files-found: warn
          retention-days: 7
      - name: Destroy isolated local database
        if: always()
        run: supabase stop --no-backup || true

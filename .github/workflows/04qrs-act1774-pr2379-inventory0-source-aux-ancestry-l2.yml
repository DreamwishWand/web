name: 04 QR-S ACT1774 PR2379 Inventory0 Source aux SHA ancestry integrity L2 QA ONLY NEVER MERGE
on:
  pull_request:
    paths:
      - '.github/workflows/04qrs-act1774-pr2379-inventory0-source-aux-ancestry-l2.yml'
permissions:
  contents: read
jobs:
  auxiliary-source-ancestry-adversarial:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 04qrs/act1774-pr2379-inventory0-source-aux-ancestry-l2
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Frozen 09P Source HEAD and one QA-only workflow
        shell: bash
        run: |
          set -euo pipefail
          source=fd888f17220e6019c342550f0fd70a5162f60690
          path=.github/workflows/04qrs-act1774-pr2379-inventory0-source-aux-ancestry-l2.yml
          test "$(git merge-base "$source" HEAD)" = "$source"
          test "$(git diff --name-only "$source" HEAD)" = "$path"
          test "$(git ls-tree HEAD -- "$path" | awk '{print $1}')" = 100644
          test "$(git rev-parse HEAD:scripts/wasm-distribution/r22-inventory0-product-source.mjs)" = 9ff4052391253b2671271bc9b6232b8fb07119fa
          test "$(git rev-parse HEAD:tests/09p-r22-inventory0-product-source.test.mjs)" = c46d257052f58763021a8bfdac231733a9e2c7f4
          test "$(git rev-parse HEAD:.github/workflows/09p-r22-inventory0-product-source.yml)" = 73b5328c3beda23035218a2b9ea96ee1b0fcbb8c
          test "$(git rev-parse HEAD:crates/ddv-save-core/src/product_session.rs)" = e53c4930a84f729ea245f38a1b301c7178146ced
          test "$(git rev-parse HEAD:crates/ddv-save-core/src/wasm_worker.rs)" = 775a2766f237d44ae77fa5347e9adf430c8580d2
          test "$(git rev-parse HEAD:crates/ddv-save-core/Cargo.toml)" = b3455c36d9d60b4a0e415026a095e47fe577644d
          echo QRS2379_ORIGINAL_SOURCE_GIT_BLOBS_MODES_FROZEN
      - name: Actual isolated Git auxiliary Source mode100644 SHA tamper and second-parent denial counterexample
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'QRS_NODE'
          import assert from 'node:assert/strict';
          import {execFileSync} from 'node:child_process';
          import {mkdtempSync,rmSync} from 'node:fs';
          import {tmpdir} from 'node:os';
          import {join} from 'node:path';
          import {verifyR22Inventory0SourceCandidate,verifyR22Inventory0MainFirstSynthetic,INVENTORY0_EXPECTED_SOURCE} from './scripts/wasm-distribution/r22-inventory0-product-source.mjs';
          const SOURCE='fd888f17220e6019c342550f0fd70a5162f60690';
          const PROTECTED='f420bbe72fbc3374f0a3867403c660873ce5f06a';
          const own=[
           '.github/workflows/09p-r22-inventory0-product-source.yml',
           'scripts/wasm-distribution/r22-inventory0-product-source.mjs',
           'tests/09p-r22-inventory0-product-source.test.mjs'];
          const env={...process.env,GIT_NO_REPLACE_OBJECTS:'1',GIT_AUTHOR_NAME:'QRS ephemeral probe',GIT_AUTHOR_EMAIL:'qrs@example.invalid',GIT_COMMITTER_NAME:'QRS ephemeral probe',GIT_COMMITTER_EMAIL:'qrs@example.invalid'};
          const git=(args,input,extra={})=>execFileSync('git',args,{env:{...env,...extra},encoding:'utf8',input,stdio:['pipe','pipe','pipe']}).trim();
          assert.equal(git(['rev-parse','HEAD']),process.env.GITHUB_SHA);
          const approved=verifyR22Inventory0SourceCandidate(SOURCE);
          assert.equal(approved.sourceBytesPinned,true);
          assert.equal(approved.signerAuthorized,false);
          assert.equal(approved.writerAuthorized,false);
          const tmp=mkdtempSync(join(tmpdir(),'qrs-inv0-aux-'));
          const idx={GIT_INDEX_FILE:join(tmp,'index')};
          const makeCommit=(base,firstParent,edits=[],otherParents=[])=>{
           git(['read-tree',base+'^{tree}'],undefined,idx);
           for(const [p,c] of edits){
            const blob=git(['hash-object','-w','--stdin'],c);
            git(['update-index','--add','--cacheinfo','100644',blob,p],undefined,idx);
           }
           const tree=git(['write-tree'],undefined,idx);
           const args=['commit-tree',tree,'-p',firstParent];
           for(const extra of otherParents)args.push('-p',extra);
           return git([...args,'-m','QRS disconnected test source no git ref mutation']);
          };
          let admitted=0;
          try{
           for(const path of own){
            const altered=makeCommit(SOURCE,SOURCE,[[path,'# QRS_UNREVIEWED_AUXILIARY_BYTES_DIFFER\n']]);
            const result=verifyR22Inventory0SourceCandidate(altered);
            assert.equal(result.sourceBytesPinned,true,'source fingerprint returns positive despite changed own SHA');
            assert.equal(result.signerAuthorized,false);
            assert.equal(result.writerAuthorized,false);
            assert.notEqual(git(['rev-parse',altered+':'+path]),git(['rev-parse',SOURCE+':'+path]));
            admitted++;
           }
           const staged=[...Object.keys(INVENTORY0_EXPECTED_SOURCE),...own];
           const mkMain=(edits=[],parents=[])=>{
            const updated=staged.map(path=>[path,git(['show',SOURCE+':'+path])]);
            const changed=Object.fromEntries(edits);
            for(const p of updated)if(Object.hasOwn(changed,p[0]))p[1]=changed[p[0]];
            return makeCommit(PROTECTED,PROTECTED,updated,parents);
           };
           const valid=mkMain();
           const receipt=verifyR22Inventory0MainFirstSynthetic(valid);
           assert.equal(receipt.changedPaths,13);
           assert.equal(receipt.sourceBytesPinned,true);
           assert.equal(receipt.signerAuthorized,false);
           assert.equal(receipt.writerAuthorized,false);
           for(const path of own){
            const altered=mkMain([[path,'# QRS_UNREVIEWED_AUXILIARY_SOURCE_BYTES\n']]);
            const x=verifyR22Inventory0MainFirstSynthetic(altered);
            assert.equal(x.sourceBytesPinned,true);
            assert.equal(x.mergeAuthorized,false);
            assert.equal(x.signerAuthorized,false);
            assert.notEqual(git(['rev-parse',altered+':'+path]),git(['rev-parse',SOURCE+':'+path]));
            admitted++;
           }
           const multiparent=mkMain([],[SOURCE]);
           assert.deepEqual(git(['rev-list','--parents','-n','1',multiparent]).split(/\s+/).slice(1),[PROTECTED,SOURCE]);
           const x=verifyR22Inventory0MainFirstSynthetic(multiparent);
           assert.equal(x.sourceBytesPinned,true);
           assert.equal(x.latestProtectedCASVerified,false);
           assert.equal(x.mergeAuthorized,false);
           admitted++;
           assert.equal(admitted,7);
           assert.equal(git(['rev-parse','HEAD']),process.env.GITHUB_SHA);
           console.log('QRS2379_SOURCE_CLASSIFIER_7_UNREVIEWED_AUX_BLOB_OR_EXTRA_PARENT_ADMISSIONS_TRUE_NEG');
           console.log(JSON.stringify({originalSource:SOURCE,mainFirstBase:PROTECTED,mutatedOwnPaths:3,sourceTamperAccepted:3,mainFirstTamperAccepted:3,extraParentAccepted:1,allSevenHaveReleaseAuthority:false,qaOnly:true,verdict:'SOURCE_PROOF_SCOPE_GAP_NOT_PRODUCT_RELEASE'}));
          }finally{rmSync(tmp,{force:true,recursive:true})}
          QRS_NODE
          test "$(git diff --name-only fd888f17220e6019c342550f0fd70a5162f60690 HEAD)" = .github/workflows/04qrs-act1774-pr2379-inventory0-source-aux-ancestry-l2.yml
          echo QRS2379_QA_ONLY_NO_PRODUCTION_SOURCE_CHANGE_NO_RELEASE_NO_WRITER

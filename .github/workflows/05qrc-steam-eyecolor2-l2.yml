name: 05 QR-C Steam626 EyeColor2 exact1 L2 (QA ONLY NEVER MERGE)
on:
  pull_request:
    paths:
      - '.github/workflows/05qrc-steam-eyecolor2-l2.yml'
      - 'crates/ddv-save-core/src/product_eyeball_color2.rs'
permissions:
  contents: read
jobs:
  qrc1908-steam-eyecolor2:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CARGO_TARGET_DIR: /tmp/wand-qrc1908-cargo-target
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Verify frozen Source and QA-only hunk
        run: |
          set -euo pipefail
          git cat-file -e e3658acd3864172906f4189b5f95cebacaa24caa^{commit}
          test "$(git merge-base e3658acd3864172906f4189b5f95cebacaa24caa HEAD)" = e3658acd3864172906f4189b5f95cebacaa24caa
          git diff --name-only e3658acd3864172906f4189b5f95cebacaa24caa HEAD | LC_ALL=C sort >/tmp/qrc1908-current-paths
          printf '%s\n' '.github/workflows/05qrc-steam-eyecolor2-l2.yml' 'crates/ddv-save-core/src/product_eyeball_color2.rs' | LC_ALL=C sort >/tmp/qrc1908-expected-paths
          diff -u /tmp/qrc1908-expected-paths /tmp/qrc1908-current-paths
          git diff --exit-code e3658acd3864172906f4189b5f95cebacaa24caa HEAD -- crates/ddv-save-core/src/indexed_read.rs crates/ddv-save-core/src/semantic_writer.rs crates/ddv-save-core/Cargo.toml .github/workflows/core-product-session-boundary.yml
          echo QRC1908_SOURCE_FIXED_QA_ONLY_BOUNDARY_PASS
      - name: Independent exact Steam626 Eyeball ColorIndex2 only
        run: |
          set -euo pipefail
          cargo generate-lockfile --manifest-path crates/ddv-save-core/Cargo.toml
          sha256sum crates/ddv-save-core/Cargo.lock >/tmp/qrc1908-lock.sha
          cargo test --locked --manifest-path crates/ddv-save-core/Cargo.toml --features semantic-writer-dev --lib qa1908_eyecolor2_witness_cas_opaque_exact1 -- --nocapture
          test -s /tmp/qrc1908-eyecolor2-source.json
          cargo test --locked --manifest-path crates/ddv-save-core/Cargo.toml --features semantic-writer-dev --lib qa1908_eyecolor2_child_independent_reopen -- --ignored --nocapture
          cargo check --locked --manifest-path crates/ddv-save-core/Cargo.toml --target wasm32-unknown-unknown --no-default-features --features worker-wasm,semantic-writer-dev
          sha256sum -c /tmp/qrc1908-lock.sha

name: 09 INT Source153 + WEB267 FULL153 combined SOURCE LOCAL (NO PUBLIC)
on:
  push:
    branches: ['int/x05-source153-webv2-full153-20261029']
  pull_request:
    branches: ['feature/03comm-x05-source153-owner-authority-projection-20261028']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: int-full153-v2-${{ github.ref }}
  cancel-in-progress: true
jobs:
  combined-full153-source-web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DDVRE_PRIVACY_ISOLATED_LOCAL: CONFIRMED
      SUPABASE_ACCESS_TOKEN: ''
      DATABASE_URL: ''
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Strict immutable Source153, INT263 and WEB267 ancestry plus 153 SQL/Edge/WEB pins
        shell: bash
        run: |
          set -euo pipefail
          test -z "$SUPABASE_ACCESS_TOKEN" && test -z "$DATABASE_URL"
          SOURCE=b24eec2cb4dae4ab30824636670c520d7c6eea40
          INT263=b9bb5f4eed24f751c6b5e607095fd40e9a62b0e5
          WEB267=0402229e6eb481d865082b3b59f11dc65359ec1a
          git merge-base --is-ancestor "$SOURCE" HEAD
          git merge-base --is-ancestor "$INT263" HEAD
          git merge-base --is-ancestor "$WEB267" HEAD
          test -z "$(git diff --name-only "$SOURCE" HEAD -- supabase/)"
          test "$(git hash-object supabase/migrations/20261028000060_x05_authoritative_owner_projection_v2.sql)" = 356cc10138cd351674fde8dd943acc968e26fbbc
          test "$(git hash-object supabase/functions/community-dreamsnap-owner/index.ts)" = 38f6830b88eb37dc612cbc11901812a90b406146
          test "$(git hash-object supabase/migrations/20261028000050_x05_first_work_media_bootstrap_v1.sql)" = cd297f48111afbb315651c6cb7e911afb1bcc03d
          test "$(git hash-object supabase/migrations/20261028000040_x05_private_pregrant_policy_receipt_v1.sql)" = 451735e05b6a18c826851a51000909c40c42bb9f
          test "$(git hash-object supabase/migrations/20261028000030_x05_authenticated_owner_service_v1.sql)" = 85e9de1874ca489133fd39be522f57ee1cfac6ab
          test "$(git hash-object src/lib/dreamsnaps/source153-owner-consumer-v2.js)" = f981b7596711b47bceb2fa79a2191e79e8f1b459
          test "$(git hash-object src/lib/dreamsnaps/source150-owner-service-adapter.js)" = e7f15f866e9383af291a234e57cc84a160cee167
          test "$(git hash-object src/lib/dreamsnaps/source151-private-pregrant-adapter.js)" = 274655aef0cf1c37e85be1649295d6d31a1dc02c
          python3 - <<'PY'
          from pathlib import Path
          names=sorted(p.name for p in Path('supabase/migrations').glob('*.sql'))
          assert len(names)==153,len(names)
          assert len(set(n.split('_')[0] for n in names))==153
          assert names[-1]=='20261028000060_x05_authoritative_owner_projection_v2.sql'
          assert 'owner-authority-projection' in Path('supabase/migrations/20261028000060_x05_authoritative_owner_projection_v2.sql').read_text()
          print('INT153_FULL153_SOURCE153_WEB267_EFFECTIVE_PINS_PASS')
          PY
      - name: NEW combined v2 source-only tests, no activated Owner, Svelte check and build
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          node --test tests/int-x05-source153-webv2-full153.test.mjs
          npm run check
          npm run build
          echo INT153_FULL153_STRICT_WEB_BUILD_PASS
  combined-full153-real-pg-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DDVRE_PRIVACY_ISOLATED_LOCAL: CONFIRMED
      SUPABASE_ACCESS_TOKEN: ''
      DATABASE_URL: ''
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Source153 immutable SQL/Edge and old accepted source tests unchanged
        run: |
          set -euo pipefail
          test -z "$SUPABASE_ACCESS_TOKEN" && test -z "$DATABASE_URL"
          git merge-base --is-ancestor b24eec2cb4dae4ab30824636670c520d7c6eea40 HEAD
          git merge-base --is-ancestor b9bb5f4eed24f751c6b5e607095fd40e9a62b0e5 HEAD
          git merge-base --is-ancestor 0402229e6eb481d865082b3b59f11dc65359ec1a HEAD
          test -z "$(git diff --name-only b24eec2cb4dae4ab30824636670c520d7c6eea40 HEAD -- supabase/ tests/comm-x05-source153-owner-authority-two-pg.py tests/comm-x05-source153-owner-authority.test.mjs)"
      - uses: supabase/setup-cli@v1
        with:
          version: 2.81.3
      - name: Exactly FULL153 disposable PostgreSQL no Stage, Edge or real Provider
        run: |
          set -euo pipefail
          docker version
          printf 'project_id = "ddvre_int_x05_source153_disposable"\n' | cat - supabase/config.toml > /tmp/int153-config.toml
          mv /tmp/int153-config.toml supabase/config.toml
          timeout 1500s supabase start -x edge-runtime --debug >/tmp/int153-start.log 2>&1 || { tail -120 /tmp/int153-start.log; exit 1; }
          echo INT153_FULL153_DISPOSABLE_BOOTSTRAP_PASS
      - name: Local synthetic PostgreSQL client
        run: python3 -m pip install --quiet 'psycopg[binary]==3.2.10'
      - name: NEW Source152 first private Work through Source150 withdraw then Source153 authoritative same-Work proof
        run: |
          set -euo pipefail
          python3 tests/int-x05-source153-webv2-full153-three-pg.py 2>&1 | tee /tmp/int153-source.log
          grep -q INT153_FULL153_REGISTER_TO_SOURCE153_AUTHORITY_ORIGINAL_POST_PASS /tmp/int153-source.log
          grep -q INT153_FULL153_CROSS_WORK_SAME_OWNER_READY_MEDIA_REJECTED /tmp/int153-source.log
          grep -q INT153_FULL153_UNAPPROVED_POLICY_NO_SCOPES_PASS /tmp/int153-source.log
      - name: Actual FULL153 PostgreSQL authority Source JSON into frozen WEB267 pure decoder (no HTTP)
        run: |
          set -euo pipefail
          INT153_FULL153_PG_BRIDGE=/tmp/int-x05-full153-webv2-actual-pg.json node --test tests/int-x05-source153-webv2-full153.test.mjs
          echo INT153_FULL153_ACTUAL_DB_TO_WEBV2_FAILCLOSED_PASS
      - name: Preserve bounded only disposable test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: int-x05-full153-webv2-synthetic-only
          path: /tmp/int153-source.log
          if-no-files-found: warn
      - name: Failure detail
        if: failure()
        run: tail -100 /tmp/int153-start.log || true

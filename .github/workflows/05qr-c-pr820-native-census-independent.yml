name: 05 QR-C PR820 independent same-session native Spatial census QA
on:
  pull_request:
    paths:
      - 'crates/ddv-save-core/tests/qa_05qrc_pr820_native_census.rs'
      - '.github/workflows/05qr-c-pr820-native-census-independent.yml'
  push:
    branches:
      - 'qa/05qrc-pr820-native-census-5e4985c9-20261108'
permissions:
  contents: read
jobs:
  focused-native-census:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_TARGET_DIR: /tmp/wand-05qrc-pr820-native-target
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Freeze original FOUR Source Git Blobs and only TWO QA-only new files
        shell: bash
        run: |
          set -euo pipefail
          source=5e4985c9a8537d0b1c2ba38d0e7f27ee22c94c74
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            qa_tip="$(git rev-parse HEAD^2)"
          else
            qa_tip="$(git rev-parse HEAD)"
          fi
          git merge-base --is-ancestor "$source" "$qa_tip"
          test "$(git rev-parse "$qa_tip":crates/ddv-save-core/src/spatial_reference_index.rs)" = ce7c895193ae3c5c6bff3aace6c5fe190009f7ba
          test "$(git rev-parse "$qa_tip":crates/ddv-save-core/tests/spatial_native_census.rs)" = 47dcee36abf64f305ddd2a076b1c7c3dfb179e1b
          test "$(git rev-parse "$qa_tip":crates/ddv-save-core/src/lib.rs)" = 96ad9334a3d91a71541c1507db8dc23ce69734be
          test "$(git rev-parse "$qa_tip":docs/core/01b-r06-native-census-concordance-20261108.md)" = 60ed5a386ede074ef190685c3b7a019bdc5b1af0
          actual="$(git diff --name-only "$source" "$qa_tip" | sort)"
          expected="$(printf '%s\n' .github/workflows/05qr-c-pr820-native-census-independent.yml crates/ddv-save-core/tests/qa_05qrc_pr820_native_census.rs | sort)"
          test "$actual" = "$expected"
          test -z "$(git diff --name-only "$source" "$qa_tip" -- crates/ddv-save-core/src crates/ddv-save-core/Cargo.toml src tools)"
          test -z "$(git ls-files | grep -E 'STEAM_SAVE_OWNER_PRIVATE|OWNER_PRIVATE|\.p1g$' || true)"
      - name: New independent Rust census count, forged equal IDs, CAS, and cross-platform rejection
        shell: bash
        run: |
          set -euo pipefail
          cargo test --manifest-path crates/ddv-save-core/Cargo.toml --features private-native-v1 --test qa_05qrc_pr820_native_census -- --nocapture
      - name: New native opt-in receipt ABI and default product ABI
        shell: bash
        run: |
          set -euo pipefail
          cargo check --manifest-path crates/ddv-save-core/Cargo.toml --features private-native-v1 --lib
          cargo check --manifest-path crates/ddv-save-core/Cargo.toml --features indexed-read --lib
          cargo check --manifest-path crates/ddv-save-core/Cargo.toml --lib
      - name: Genuine Rust worker WASM ABI and private-native isolation
        shell: bash
        run: |
          set -euo pipefail
          cargo check --manifest-path crates/ddv-save-core/Cargo.toml --target wasm32-unknown-unknown --features worker-wasm,indexed-read --lib
          if cargo check --manifest-path crates/ddv-save-core/Cargo.toml --target wasm32-unknown-unknown --features worker-wasm,private-native-v1 --lib > /tmp/qrc820-forbidden-native-wasm.log 2>&1; then
            echo "FATAL: private-native census feature linked into product WASM"
            exit 1
          fi
          grep -F "private-native-v1 is native-only and cannot enter WASM" /tmp/qrc820-forbidden-native-wasm.log >/dev/null
          rm -f /tmp/qrc820-forbidden-native-wasm.log
      - name: Prove no extra Reader, production diff or Owner-private Save
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            qa_tip="$(git rev-parse HEAD^2)"
          else
            qa_tip="$(git rev-parse HEAD)"
          fi
          test "$(git diff --name-only 5e4985c9a8537d0b1c2ba38d0e7f27ee22c94c74 "$qa_tip" | wc -l)" -eq 2
          test -z "$(git diff --name-only 5e4985c9a8537d0b1c2ba38d0e7f27ee22c94c74 "$qa_tip" -- crates/ddv-save-core/src crates/ddv-save-core/Cargo.toml src tools)"
          test -z "$(git ls-files | grep -E 'STEAM_SAVE_OWNER_PRIVATE|OWNER_PRIVATE|\.p1g$' || true)"
          echo "QRC820_SOURCE4_QA2_EQUAL_COUNT_FORGED_IDS_NATIVE_CAS_BUILD_WASM_FOCUSED_PASS"

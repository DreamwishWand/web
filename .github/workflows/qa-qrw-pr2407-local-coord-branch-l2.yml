name: 04 QR-W PR2407 real local Scene Undo branch and same-Revision tamper L2 QA ONLY NEVER MERGE
on:
  pull_request:
    paths:
      - '.github/workflows/qa-qrw-pr2407-local-coord-branch-l2.yml'
permissions:
  contents: read
jobs:
  exact-source-real-browser-cas:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 04qrw/pr2407-2a25-local-coordinate-branch-cas-l2
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pin original 8 Source files and exact 2 QA-only
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY_ID" = 1371485649
          base=b2c28e8a095f07ba7e6b2c5a1dfa985eca2ca90d
          source=2a254b7f1c9ebd373aa79c4e442b053bdca33b95
          test "$(git merge-base "$base" "$source")" = "$base"
          test "$(git merge-base "$source" HEAD)" = "$source"
          printf '%s\n' \
            .github/workflows/wep-local-scene-coordinate-studio.yml \
            docs/wep/world-editor-localization-inventory-20261002.json \
            scripts/wep-local-scene-coordinate-studio-chrome.mjs \
            src/lib/wep/LocalSceneCoordinateStudio.svelte \
            src/lib/wep/local-scene-coordinate-copy.js \
            src/lib/wep/local-scene-coordinate-review.ts \
            src/routes/editor/world/+page.svelte \
            tests/wep-local-scene-coordinate-review.test.mjs | LC_ALL=C sort >/tmp/qrw2407-src8
          git diff --name-only "$base" "$source" | LC_ALL=C sort | diff -u /tmp/qrw2407-src8 -
          printf '%s\n' .github/workflows/qa-qrw-pr2407-local-coord-branch-l2.yml \
            scripts/qa-qrw-pr2407-coordinate-branch-stale-real-chrome.mjs | LC_ALL=C sort >/tmp/qrw2407-qa2
          git diff --name-only "$source" HEAD | LC_ALL=C sort | diff -u /tmp/qrw2407-qa2 -
          for p in $(cat /tmp/qrw2407-src8) $(cat /tmp/qrw2407-qa2); do
            test "$(git ls-tree HEAD -- "$p" | awk '{print $1}')" = 100644
          done
          test "$(git rev-parse HEAD:src/lib/wep/local-scene-coordinate-review.ts)" = 5370d534f7bbeadf6021981f65666a980f4461cb
          test "$(git rev-parse HEAD:src/lib/wep/LocalSceneCoordinateStudio.svelte)" = f3932e0cabfc51efb70a1a77d71774de6b16dccb
          test "$(git rev-parse HEAD:tests/wep-local-scene-coordinate-review.test.mjs)" = 1cc5ce61db46801123f3e98d051e8907272cc22f
          test "$(git rev-parse HEAD:scripts/qa-qrw-pr2407-coordinate-branch-stale-real-chrome.mjs)" = a81e2318812d64aa15625423398a3eaeb2febd14
          git diff --quiet "$source" HEAD -- src tests docs static crates ops package.json package-lock.json
          echo QRW2407_FIXED_SOURCE8_QA2_EXACT_SHA_MODE_NO_PRODUCT_SAVE_PASS
      - run: npm ci --no-audit --no-fund
      - run: npm install --no-save --package-lock=false playwright-core@1.55.0
      - name: Actual Chrome undo branch fork and same-Rev forged source row fail-closed
        shell: bash
        run: |
          set -euo pipefail
          test -z "${DDV_PRIVATE_SAVE_PATH:-}"
          test -z "${WEP_PRIVATE_P1G_PATH:-}"
          BIN="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || true)"
          test -n "$BIN"
          export CHROME_BIN="$BIN"
          BASE_PATH='' npm run dev -- --host 127.0.0.1 --port 4368 >/tmp/qrw2407-vite.log 2>&1 &
          for i in $(seq 1 75); do
            if curl -fsS http://127.0.0.1:4368/editor/world/ >/dev/null; then break; fi
            sleep 1
          done
          node scripts/qa-qrw-pr2407-coordinate-branch-stale-real-chrome.mjs

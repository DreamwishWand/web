name: "04QR-W protected main90d actual hosted Discover seven-product Chrome"
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/04qr-w-main90d-discover-deployed-real-chrome.yml'
      - 'scripts/04qr-w-main90d-discover-deployed-real-chrome.mjs'
permissions:
  contents: read
jobs:
  actual-hosted-pages-discover-seven-chrome:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm install --no-save --package-lock=false playwright-core@1.55.0
      - name: Require actual installed Chrome without private Save
        shell: bash
        run: |
          set -euo pipefail
          test -z "${WEP_PRIVATE_P1G_PATH:-}"
          test -z "${WEP_PRIVATE_LOCAL_ONLY_ACK:-}"
          test -z "${WEP_PRIVATE_EXTERNAL_BUILD_CONFIRMED:-}"
          BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$BIN" || { echo "NOT_RUN: real system Chrome missing"; exit 1; }
          "$BIN" --version
          echo "CHROME_BIN=$BIN" >> "$GITHUB_ENV"
      - name: Fixed protected main90d actual hosted CDN Discover HTML and Chrome
        run: node scripts/04qr-w-main90d-discover-deployed-real-chrome.mjs

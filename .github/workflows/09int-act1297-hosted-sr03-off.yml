name: INT ACT1297 hosted SR03 and shared OFF (fixed deployment; never merge)
on:
  push:
    branches:
      - '09int/act1297-hosted-sr03-off-7fc87ef2'
    paths:
      - '.github/workflows/09int-act1297-hosted-sr03-off.yml'
permissions:
  contents: read
jobs:
  hosted-off:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: '7fc87ef25ae4eb6f562f9f7c958ae4b90fcb1b0c'
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify fixed source and current deployed manifest
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '7fc87ef25ae4eb6f562f9f7c958ae4b90fcb1b0c'
          test "$(git rev-parse HEAD:src/routes/editor/items/catalog0/+page.svelte)" = bcf517ea94f8c1e0aa0dc2c3c530cc9810444c90
          test "$(git rev-parse HEAD:src/lib/dev/LocalAmountEditorDev.svelte)" = da627ecd86d4435c026e611b241aa489d8259dac
          test "$(git rev-parse HEAD:src/routes/editor/backpack/steam/+page.svelte)" = fb299a0e52ea5872de1eca93a8ceaaddb4f451a7
          test "$(git rev-parse HEAD:src/routes/editor/backpack/switch/+page.svelte)" = f35ffa7cdc5817ceb32a009699e9039192cc60d3
          test "$(git rev-parse HEAD:src/lib/dev/PlacementProductRoute.svelte)" = 29dd56ec075024633f11ab0dcd6841a4f177befe
          test "$(git rev-parse HEAD:src/routes/editor/wardrobe/steam/+page.svelte)" = ba71becc76ad9c4c531465309b72a62ffdbfd8e2
          test "$(git rev-parse HEAD:src/routes/editor/wardrobe/switch/+page.svelte)" = c2f80d35b3cee7ebb2073952cb31f60fb0603206
          test "$(git rev-parse HEAD:src/routes/editor/world/sr03/+page.svelte)" = 1b3d0f9773f43f3c6f0651db543804adfdf2436a
          test "$(git rev-parse HEAD:src/lib/ddv/core/save/product-scoped-sr03-release-anchor.mjs)" = 66f9bb63da4bd7d6f8f43aeac3adf4aa7df2c751
          test "$(git rev-parse HEAD:src/lib/ddv/core/save/product-scoped-placement-release.mjs)" = e9eb94f91a1c4858d0d93f5837e86e7935a5f471
          test "$(git rev-parse HEAD:src/lib/dev/product-placement-client.mjs)" = e236c90ca236385c28d0bfa5e8b87cfda36cad98
          test "$(git rev-parse HEAD:src/lib/dev/product-placement-worker-boot.mjs)" = d054cfdf6ff2e8680ac59cd07daef043921bc0a5
          test -z "$(git ls-files 'static/worker-wasm-scoped-*')"
          curl -fsS --retry 1 --max-time 20 -H 'Cache-Control: no-cache' https://dreamwishwand.github.io/web/worker-wasm/manifest.json -o "$RUNNER_TEMP/catalog0-manifest.json"
          echo "127f5e22aab5b31fef51eef7bfc2f94c84e9753506cf84b1dfeab8152afb19a6  $RUNNER_TEMP/catalog0-manifest.json" | sha256sum -c -
          node --input-type=module -e 'import fs from "node:fs"; import assert from "node:assert/strict"; assert.equal(JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/catalog0-manifest.json","utf8")).source.commit,"7fc87ef25ae4eb6f562f9f7c958ae4b90fcb1b0c")'
      - name: Existing Chrome driver in isolated temp directory
        run: |
          mkdir -p "$RUNNER_TEMP/catalog0-hosted"
          cd "$RUNNER_TEMP/catalog0-hosted"
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright-core@1.55.0
      - name: Actual hydrated SR03 and ten existing OFF routes
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/catalog0-hosted"
          export CHROME_BIN="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium)"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {chromium} from 'playwright-core';
          const root='https://dreamwishwand.github.io/web';
          const browser=await chromium.launch({headless:true,executablePath:process.env.CHROME_BIN,args:['--no-sandbox','--disable-dev-shm-usage']});
          try {
            const context=await browser.newContext({locale:'en-US'});
            await context.addInitScript(()=>{
              window.__catalog0Workers=[];
              window.Worker=new Proxy(window.Worker,{construct(target,args,newTarget){window.__catalog0Workers.push(String(args[0]));return Reflect.construct(target,args,newTarget)}});
              for(const k of ['verifiedLocalDevGate','productCatalog0Enabled','productSwitchCatalog0Enabled','productChestEnabled','productCollectionEnabled','productBackpackEnabled','productSteamBackpackEnabled','productSwitchBackpackEnabled','productWardrobeEnabled','productSteamWardrobeEnabled','productSwitchWardrobeEnabled','productSr03Enabled','productSR03Enabled']) localStorage.setItem(k,'true');
            });
            const page=await context.newPage(),errors=[],scopedRequests=[];
            page.on('pageerror',e=>errors.push(String(e)));
            page.on('request',r=>{if(r.url().includes('/worker-wasm-scoped-'))scopedRequests.push(r.url())});
            const hydrated=async()=>{await page.waitForFunction(()=>!!document.documentElement.dataset.locale);await page.waitForLoadState('networkidle')};
            const routes=[
              ['/editor/items/catalog0/','[data-switch-catalog0-product-route]','data-switch-catalog0-scope'],
              ['/editor/chest/','[data-switch-chest-product-route]','data-switch-chest-scope'],
              ['/editor/chest/steam/','[data-steam-chest-product-route]','data-steam-chest-scope'],
              ['/editor/collection/','[data-collection-product-route]','data-collection-scope'],
              ['/editor/world/comp03/','[data-placement-product-route="comp03"]','data-placement-scope'],
              ['/editor/world/vase/','[data-placement-product-route="vase"]','data-placement-scope'],
              ['/editor/world/sr03/','[data-placement-product-route="sr03"]','data-placement-scope'],
              ['/editor/backpack/steam/','[data-placement-product-route="backpack-steam"]','data-placement-scope'],
              ['/editor/backpack/switch/','[data-placement-product-route="backpack-switch"]','data-placement-scope'],
              ['/editor/wardrobe/steam/','[data-placement-product-route="wardrobe-steam"]','data-placement-scope'],
              ['/editor/wardrobe/switch/','[data-placement-product-route="wardrobe-switch"]','data-placement-scope']
            ];
            let checks=0;
            for(const [suffix,selector,attribute] of routes){
              const off=async()=>{
                await hydrated();
                assert.equal(new URL(page.url()).origin,'https://dreamwishwand.github.io');
                assert.equal(new URL(page.url()).pathname,'/web'+suffix);
                const route=page.locator(selector);
                assert.equal(await route.getAttribute(attribute),'off');
                assert.equal(await route.locator('input[type=file]').count(),0);
                assert.equal(await route.locator('[role=status]').count(),1);
                assert.equal(await page.evaluate(()=>window.__catalog0Workers.length),0);
                checks++;
              };
              for(const tail of ['', '?enable=true&mode=public-accepted&build=9A239D3DB569756D#writer']){
                assert.equal((await page.goto(root+suffix+tail)).status(),200);await off();
              }
              if(suffix.includes('/sr03/')||suffix.includes('catalog0')||suffix.includes('/backpack/')||suffix.includes('/wardrobe/')){await page.reload();await off();}
            }
            assert.equal((await page.goto(root+'/editor/')).status(),200);await hydrated();
            assert.equal(await page.locator('[data-editor-hub] a[href*="/editor/items/catalog0/"], [data-editor-hub] a[href*="/editor/backpack/"], [data-editor-hub] a[href*="/editor/wardrobe/"], [data-editor-hub] a[href*="/editor/world/sr03/"]').count(),0);
            assert.equal(await page.evaluate(()=>window.__catalog0Workers.length),0);
            assert.deepEqual(scopedRequests,[]);assert.deepEqual(errors,[]);
            console.log('ACT1297_HOSTED_SR03_SHARED_OFF_ACTUAL_PASS',JSON.stringify({routes:11,routeChecks:checks,hubLink:false,workerConstructed:0,scopedRequests:0,pageErrors:0,realSignedPositive:false}));
            await context.close();
          }finally{await browser.close()}
          NODE
      - name: Recheck deployed manifest after browser
        run: |
          set -euo pipefail
          curl -fsS --retry 1 --max-time 20 -H 'Cache-Control: no-cache' https://dreamwishwand.github.io/web/worker-wasm/manifest.json -o "$RUNNER_TEMP/catalog0-manifest-after.json"
          echo "127f5e22aab5b31fef51eef7bfc2f94c84e9753506cf84b1dfeab8152afb19a6  $RUNNER_TEMP/catalog0-manifest-after.json" | sha256sum -c -

name: WEB X05 private owner consumer contract (NO BACKEND)
on:
  push:
    branches:
      - 'web/x05-private-owner-consumer-contract-*'
  pull_request:
    paths:
      - 'src/lib/dreamsnaps/private-owner-consumer-contract.js'
      - 'tests/dreamsnaps-private-owner-consumer-contract.test.mjs'
      - 'docs/web/x05-private-owner-consumer-contract-20261028.md'
      - '.github/workflows/web-x05-private-owner-consumer.yml'
permissions:
  contents: read
concurrency:
  group: web-x05-private-contract-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - name: Private owner contract NEW ONLY mock and negative assertions
        run: node --test tests/dreamsnaps-private-owner-consumer-contract.test.mjs
      - name: Svelte type/static check
        run: npm run check
      - name: Static production build
        run: npm run build
      - name: Preserve every accepted PR245 UI and Source/Edge path byte for byte
        shell: bash
        run: |
          set -euo pipefail
          BASE=50a8bd4812df2c9caff04d0a26b58d28042943ab
          git cat-file -e "$BASE^{commit}"
          git diff --exit-code "$BASE" HEAD -- supabase/ src/routes/ src/lib/community/ src/lib/dreamsnaps/owner-management.js src/lib/dreamsnaps/owner-management-copy.js scripts/dreamsnaps-owner-browser-acceptance.mjs tests/dreamsnaps-owner-management-private.test.mjs
          git diff --name-only "$BASE" HEAD > /tmp/changed-x05-contract.txt
          cat /tmp/changed-x05-contract.txt
          while IFS= read -r path; do
            case "$path" in
              src/lib/dreamsnaps/private-owner-consumer-contract.js|tests/dreamsnaps-private-owner-consumer-contract.test.mjs|docs/web/x05-private-owner-consumer-contract-20261028.md|.github/workflows/web-x05-private-owner-consumer.yml) ;;
              *) echo "unexpected changed path: $path" >&2; exit 1 ;;
            esac
          done < /tmp/changed-x05-contract.txt

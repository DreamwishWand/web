          const temp='scripts/readonly-release/qa-old-placement-proof.mjs';writeFileSync(temp,oldAdapter,{flag:'wx'});
          try{const oldInspect=(await import('./'+temp)).inspectPlacementSubjects;for(const s of [comp,vase,sr,sp]){
            const j=Buffer.from('export default function(){}'),w=wasm(s);assert.equal(fixed(s.key),s);assert.deepEqual(inspect(s,pack(s,j,w),head),oldInspect(s,pack(s,j,w),head));pos++;

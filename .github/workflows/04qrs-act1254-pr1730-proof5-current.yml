            assert.equal(entries.length,i<3?count:i===3?38:39);assert.equal(new Set(entries.map(x=>x[0])).size,entries.length);
            for(const [p,h] of entries){assert.equal(git('rev-parse',head+':'+p),h);pins++;assert.notEqual(git('rev-parse',head+':'+p),(h[0]==='0'?'1':'0')+h.slice(1));neg++;
              if(p===adapter){assert.equal(h,'55d9e32cd52ee5845c2f4fbfb51b8b65ac88ab3b');assert.equal(git('rev-parse',main+':'+p),'5e0bcc0ed447eea1b020219fe8bafd32a4d49073')}

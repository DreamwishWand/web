          import {fixedPlacementProofScope as fixed,inspectPlacementSubjects as inspect} from './scripts/readonly-release/scoped-placement-proof.mjs';
          const git=(...args)=>execFileSync('git',args,{encoding:'utf8'}).trim(),head=git('rev-parse','HEAD'),parent='fe0848f572e38b4b551be1dfd1311eeed8fba0b7',main='eb5afaced685da301a5899b3edb8937becb68c30',previous='4858e25ea1e5c18edec8cbad06801c47faf0a16f',raw=(ref,p)=>execFileSync('git',['show',ref+':'+p],{encoding:'utf8'});
          const y=readFileSync('.github/workflows/pages.yml','utf8'),old=raw(parent,'.github/workflows/pages.yml'),adapter='scripts/readonly-release/scoped-placement-proof.mjs',oldAdapter=raw(previous,adapter),newAdapter=raw(head,adapter);

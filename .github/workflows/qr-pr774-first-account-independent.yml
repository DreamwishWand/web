name: 04 QR-S PR774 real CommunityLabClient synthetic First Account independent
on:
  push:
    branches: [qa/pr774-first-account-client-independent-20261108]
permissions:
  contents: read
jobs:
  qr-first-account:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    env:
      DATABASE_URL: ''
      SUPABASE_ACCESS_TOKEN: ''
      SUPABASE_PROJECT_ID: ''
      SUPABASE_DB_PASSWORD: ''
      PGPASSWORD: ''
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Freeze exact PR774 original one file and QA-only two paths
        shell: bash
        run: |
          set -euo pipefail
          SOURCE=7d28ac27dfb29a9da92ec01c6b03859db3bcebfb
          MAIN=b7d86d47125f1764919b67898c39badaf35976d8
          git merge-base --is-ancestor "$SOURCE" HEAD
          git diff --name-only "$SOURCE" HEAD | sort >/tmp/qr774-diff
          printf '%s\n' \
            .github/workflows/qr-pr774-first-account-independent.yml \
            tests/qr-pr774-first-account-client-independent.test.mjs | sort >/tmp/qr774-expected
          diff -u /tmp/qr774-expected /tmp/qr774-diff
          git diff --name-only "$MAIN" "$SOURCE" | sort >/tmp/qr774-source
          printf '%s\n' tests/comm-first-account-existing-client-local-signup.test.mjs >/tmp/qr774-source-expect
          diff -u /tmp/qr774-source-expect /tmp/qr774-source
          test "$(git hash-object tests/comm-first-account-existing-client-local-signup.test.mjs)" = 89ab15832856c486708f792db6922b2672498373
          test "$(git hash-object src/lib/community/staging-http-client.ts)" = 4d988aee5a94f8184c1ec2e8fe831be3013436b3
          test "$(git hash-object supabase/migrations/20260930025132_community_core_v0_server_rpc.sql)" = bbf9bc830440d964c5da8b3c3cac7e926d281881
          test -z "$(git diff --name-only "$SOURCE" HEAD -- src supabase docs scripts)"
          test -z "$DATABASE_URL" && test -z "$SUPABASE_ACCESS_TOKEN" && test -z "$SUPABASE_PROJECT_ID" && test -z "$SUPABASE_DB_PASSWORD"
          echo QR774_EXACT_SOURCE_ONE_QA_TWO_CLIENT_IMMUTABLE_PASS
      - name: Install existing lockfile-only tooling for TypeScript transpile
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Independently run real client against isolated signed in-memory synthetic fixture
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/qr-pr774-first-account-client-independent.test.mjs | tee /tmp/qr774-independent.log
          for marker in \
            QR774_PIN_SOURCE_ONE_CLIENT_ORIGINAL82_AND_NO_CREDENTIAL_LOGS_PASS \
            QR774_REAL_CLIENT_UNCONFIRMED_REPEAT_SIGNUP_ZERO_SESSION_ZERO_WRITES_PASS \
            QR774_REAL_CLIENT_CONFIRMED_OWNER_OTHER_ACCOUNT_FORGED_ID_AND_ALIAS_DENIED_PASS \
            QR774_REAL_EPHEMERAL_ES256_TAMPER_UNTRUSTED_KEY_EXPIRED_REPLAY_ZERO_WRITE_PASS \
            QR774_REVOKED_REFRESH_DIRECT_BEARER_AND_LOGOUT_NO_POSTREVOKE_WRITES_PASS \
            QR774_PASSWORD_MIN_15_HTTPS_ONLY_ORIGIN_DENIED_NO_SECRET_EVENT_LOG_PASS; do
            grep -q "$marker" /tmp/qr774-independent.log
          done
          echo QR774_INDEPENDENT_SIX_SYNTHETIC_FIRST_ACCOUNT_CASES_PASS
      - name: Remove synthetic test output, no external credential or managed DB
        if: always()
        shell: bash
        run: |
          rm -f /tmp/qr774-diff /tmp/qr774-expected /tmp/qr774-source /tmp/qr774-source-expect /tmp/qr774-independent.log
          echo QR774_SYNTHETIC_QA_OUTPUT_CLEANED

name: 05 QR-C PR2356 Inventory0 Rust CAS/mixed-feature independent L2 (QA ONLY NEVER MERGE)
on:
  pull_request:
    paths:
      - '.github/workflows/05qrc-pr2356-inventory0-cas-mixed-feature-neg-l2.yml'
permissions:
  contents: read
jobs:
  independent-scoped-product-abi-cas:
    runs-on: ubuntu-24.04
    timeout-minutes: 43
    env:
      CARGO_TARGET_DIR: /tmp/qrc-pr2356-inv0-cargo
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 05qrc-pr2356-inventory0-rust-cas-mixed-feature-l2
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
          targets: wasm32-unknown-unknown
      - name: Source4 exact immutable Rust and one QA-only changed workflow
        shell: bash
        run: |
          set -euo pipefail
          base=0e57c6b8585002b1baff91e6de573a835bed6577
          source=b06d0db15628f9eb764dfc164625430bc8a89dac
          path=.github/workflows/05qrc-pr2356-inventory0-cas-mixed-feature-neg-l2.yml
          test "$(git merge-base "$source" HEAD)" = "$source"
          test "$(git diff --name-only "$source" HEAD)" = "$path"
          git diff --name-only "$base" "$source" | LC_ALL=C sort > /tmp/actual-source-paths
          printf '%s\n' \
            '.github/workflows/01a-steam626-inventory0-dedicated-rust-source.yml' \
            'crates/ddv-save-core/Cargo.toml' \
            'crates/ddv-save-core/src/wasm_worker.rs' \
            'tests/01a-steam626-inventory0-exclusive-rust-feature.test.mjs' | LC_ALL=C sort > /tmp/expected-source-paths
          diff -u /tmp/expected-source-paths /tmp/actual-source-paths
          test "$(git rev-parse HEAD:crates/ddv-save-core/Cargo.toml)" = b3455c36d9d60b4a0e415026a095e47fe577644d
          test "$(git rev-parse HEAD:crates/ddv-save-core/src/wasm_worker.rs)" = 775a2766f237d44ae77fa5347e9adf430c8580d2
          test "$(git rev-parse HEAD:crates/ddv-save-core/src/product_amount_scoped.rs)" = 522e8e8d6beec597b2e5e176cfbe8a6d8e38a124
          test "$(git rev-parse HEAD:crates/ddv-save-core/src/semantic_writer.rs)" = f11c68ca214853c762788ae032710fc4683dd472
          test "$(git rev-parse "$base:crates/ddv-save-core/src/wasm_worker.rs")" = 6432275d2909e6bc6d39265ae70cc7176fc37106
          test "$(git ls-tree HEAD -- "$path" | awk '{print $1}')" = 100644
          test ! -e crates/ddv-save-core/Cargo.lock
          cp scripts/wasm-distribution/approved-Cargo.lock crates/ddv-save-core/Cargo.lock
          echo 'e58486d673df79bfe7e72b80449e39389e57010fe4051edcdcff9b53c2da898c  crates/ddv-save-core/Cargo.lock' | sha256sum -c -
          echo QRC2356_FROZEN_NEW_RUST_SOURCE4_AND_QAONLY_SINGLE_WORKFLOW_PASS
      - name: Actual mixed-feature Rust compiler rejection must include exact deny code
        shell: bash
        run: |
          set -euo pipefail
          for foreign in product-steam626-chest-scoped product-collection-scoped; do
            if cargo check --locked --manifest-path crates/ddv-save-core/Cargo.toml \
                --target wasm32-unknown-unknown --no-default-features \
                --features "worker-wasm,product-steam626-catalog0-scoped,$foreign" \
                >/tmp/qrc2356-mixed-compiler.log 2>&1; then
              echo QRC2356_MIXED_FOREIGN_FEATURE_WAS_ACCEPTED >&2; exit 1
            fi
            grep -Fq 'STEAM626_CATALOG0_PRODUCT_FEATURE_CONFLICT' /tmp/qrc2356-mixed-compiler.log
          done
          echo QRC2356_REAL_COMPILER_CHEST_COLLECTION_MIXED_FEATURE_2NEG_PASS
      - name: Compile actual only-Inventory0 optimized Rust/WASM one ProductSession
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --release --manifest-path crates/ddv-save-core/Cargo.toml \
            --target wasm32-unknown-unknown --no-default-features \
            --features worker-wasm,product-steam626-catalog0-scoped
          cargo install wasm-bindgen-cli --version 0.2.105 --locked --root /tmp/qrc2356-wasm-bindgen
          mkdir -p /tmp/qrc2356-inventory0-wasm
          /tmp/qrc2356-wasm-bindgen/bin/wasm-bindgen \
            "$CARGO_TARGET_DIR/wasm32-unknown-unknown/release/ddv_save_core.wasm" \
            --out-dir /tmp/qrc2356-inventory0-wasm --target nodejs --no-typescript
      - name: Independent real Rust mint, stage, CAS/foreign selectors negative closure
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          src=Path('.github/workflows/01a-steam626-inventory0-dedicated-rust-source.yml').read_text()
          first=src.index('          const empty=()=>')
          end=src.index('          const hash=bytes=>',first)
          fixture='\n'.join(line[10:] for line in src[first:end].splitlines())+'\n'
          p=Path('/tmp/qrc2356-scoped-test.mjs')
          header="""import assert from 'node:assert/strict';
          import {createRequire} from 'node:module';
          import {readFileSync} from 'node:fs';
          const {WorkerWasmSource}=createRequire(import.meta.url)('/tmp/qrc2356-inventory0-wasm/ddv_save_core.js');
          """
          test=r'''
          const BUILD='releases_1.25-v1.25.3-44-g0b41250d9ac0-incremental-22';
          let negatives=0,positives=0;
          const w=new WorkerWasmSource('steam-windows','steam-full-version',BUILD,626,true,new Uint8Array(32).fill(77));
          w.append_chunk(encoded);
          const session=JSON.parse(w.finish());
          const a=[session.sessionId,BigInt(session.revision),BigInt(session.indexGeneration),session.decodedSha256];
          const m=JSON.parse(w.discover_scoped_amount('catalog0-furniture',0,...a));
          assert.ok(m.rows.some(t=>t.id===0&&t.selector===40000048&&t.oldAmount===3));
          positives++;
          const checked=(fn)=>{assert.throws(fn);negatives++;};
          checked(()=>w.discover_scoped_amount('catalog0-furniture\0linked-crop-chest48',0,...a));
          checked(()=>w.discover_scoped_amount('linked-crop-chest48',0,...a));
          checked(()=>w.preview_scoped_amount('catalog0-furniture',1,40000048,2,...a));
          checked(()=>w.preview_scoped_amount('catalog0-furniture',0,40000049,2,...a));
          checked(()=>w.preview_scoped_amount('catalog0-furniture',0,40000048,0,...a));
          checked(()=>w.stage_scoped_amount('catalog0-furniture',0,40000048,1,0,'0'.repeat(64),...a));
          checked(()=>w.stage_scoped_amount('catalog0-furniture',0,40000048,3,1,'0'.repeat(64),...a));
          const p=JSON.parse(w.preview_scoped_amount('catalog0-furniture',0,40000048,2,...a));
          assert.equal(p.oldAmount,3);assert.equal(p.newAmount,2);positives++;
          checked(()=>w.stage_scoped_amount('catalog0-furniture',0,40000048,3,2,'0'.repeat(64),...a));
          checked(()=>w.stage_scoped_amount('catalog0-furniture',0,40000048,4,3,p.entrySha256,...a));
          checked(()=>w.stage_scoped_amount('catalog0-furniture',0,40000048,3,2,p.entrySha256,
                  a[0],a[1]+1n,a[2],a[3]));
          checked(()=>w.stage_scoped_amount('catalog0-furniture',0,40000048,3,2,p.entrySha256,
                  a[0],a[1],a[2]+1n,a[3]));
          checked(()=>w.stage_scoped_amount('catalog0-furniture',0,40000048,3,2,p.entrySha256,
                  'f'.repeat(32),a[1],a[2],a[3]));
          checked(()=>w.stage_scoped_amount('linked-crop-chest48',12,0,50,49,p.entrySha256,...a));
          // Adversarial denials MUST leave the same Core-minted target usable.
          const staged=JSON.parse(w.stage_scoped_amount('catalog0-furniture',0,40000048,3,2,p.entrySha256,...a));
          assert.equal(staged.exactFieldChangedCount,1);
          assert.equal(staged.writerAuthorized,false);positives++;
          checked(()=>w.stage_scoped_amount('catalog0-furniture',0,40000048,3,2,p.entrySha256,...a));
          w.close();
          assert.equal(negatives,15);
          assert.equal(positives,3);
          console.log('QRC2356_REAL_WASM_INVENTORY0_3POS15NEG_MINT_CAS_REFERENCE_RELEASE_PASS');
          '''
          p.write_text(header+fixture+test)
          print('QRC2356_INDEPENDENT_FIXTURE_REUSED_NO_SOURCE_TEST_REEXECUTED')
          PY
          node --check /tmp/qrc2356-scoped-test.mjs
          node /tmp/qrc2356-scoped-test.mjs
          echo QRC2356_ACTUAL_GENERATED_RUST_PRODUCT_ABI_NEGATIVE_PASS

name: 05 QR-C PR893 independent Worker saved DiffGrids Rust WASM ABI real Chrome
on:
  push:
    branches:
      - 'qa/05qrc-pr893-worker-bridge-8d085fb6-20261110'
  pull_request:
    paths:
      - 'tests/stage-e/qa-05qrc-pr893-independent.mjs'
      - '.github/workflows/05qr-c-pr893-worker-diffgrids-independent.yml'
permissions:
  contents: read
jobs:
  pr893-changed-only-worker-rust-wasm-chrome:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_TARGET_DIR: /tmp/qa05qrc893-cargo
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Pin source 893 original four blobs and QA only TWO added files
        shell: bash
        run: |
          set -euo pipefail
          source=8d085fb64d9ba08521cf9341c233d6df1b1c3c8b
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            qa_tip="$(git rev-parse HEAD^2)"
          else
            qa_tip="$(git rev-parse HEAD)"
          fi
          git merge-base --is-ancestor "$source" "$qa_tip"
          test "$(git rev-parse "$qa_tip":crates/ddv-save-core/src/worker_session.rs)" = "d84fcd08849c9eaae046aeaa16d217b77d0b3b0d"
          test "$(git rev-parse "$qa_tip":crates/ddv-save-core/src/wasm_worker.rs)" = "387afcb5bc151942fcc7f5848e3d9d5722b90de5"
          test "$(git rev-parse "$qa_tip":tests/stage-e/worker.mjs)" = "902993c6641037cc6a6c42c2681290e26c373f4a"
          test "$(git rev-parse "$qa_tip":tests/stage-e/saved-diffgrids-typed-bridge.mjs)" = "4f872d26d8fec198dd12651d40a5a81d7f102473"
          actual="$(git diff --name-only "$source" "$qa_tip" | sort)"
          expected="$(printf '%s\n' \
            .github/workflows/05qr-c-pr893-worker-diffgrids-independent.yml \
            tests/stage-e/qa-05qrc-pr893-independent.mjs | sort)"
          test "$actual" = "$expected"
          test -z "$(git diff --name-only "$source" "$qa_tip" -- crates/ddv-save-core/src src tests/stage-e/worker.mjs)"
          test -z "$(git ls-files | grep -E 'STEAM_SAVE_OWNER_PRIVATE|OWNER_PRIVATE|\.p1g$' || true)"
      - name: Focused Rust WorkerSessionGuard changed-method tests (not ancestors)
        shell: bash
        run: |
          set -euo pipefail
          cargo test --manifest-path crates/ddv-save-core/Cargo.toml --features indexed-read --lib saved_diffgrids_worker_bridge_ -- --nocapture
      - name: Default/typed/native ABI and actual wasm32 Worker compile
        shell: bash
        run: |
          set -euo pipefail
          cargo check --manifest-path crates/ddv-save-core/Cargo.toml --lib
          cargo check --manifest-path crates/ddv-save-core/Cargo.toml --features indexed-read --lib
          cargo check --manifest-path crates/ddv-save-core/Cargo.toml --target wasm32-unknown-unknown --features worker-wasm,indexed-read --lib
          cargo build --manifest-path crates/ddv-save-core/Cargo.toml --release \
            --target wasm32-unknown-unknown --features worker-wasm,indexed-read
          test -s "$CARGO_TARGET_DIR/wasm32-unknown-unknown/release/ddv_save_core.wasm"
      - name: Install exact real wasm-bindgen-cli 0.2.105 (never fake JS glue)
        shell: bash
        run: |
          set -euo pipefail
          cargo install wasm-bindgen-cli --version 0.2.105 --locked --root /tmp/qa05qrc893-wasm-tools
          /tmp/qa05qrc893-wasm-tools/bin/wasm-bindgen --version | grep -F '0.2.105'
      - name: Generate actual Rust wasm-bindgen ESM and append separate independent browser scope ONLY in CI workspace
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tests/stage-e/pkg
          /tmp/qa05qrc893-wasm-tools/bin/wasm-bindgen \
            "$CARGO_TARGET_DIR/wasm32-unknown-unknown/release/ddv_save_core.wasm" \
            --out-dir tests/stage-e/pkg --target web --no-typescript
          test -s tests/stage-e/pkg/ddv_save_core.js
          test -s tests/stage-e/pkg/ddv_save_core_bg.wasm
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/stage-e/worker.mjs')
          s=p.read_text()
          anchor='  const savedDiffGrids=await runSavedDiffGridsBridge(WorkerWasmSource);'
          assert s.count(anchor)==1
          s="import {runIndependentPr893Worker} from './qa-05qrc-pr893-independent.mjs';\n"+s
          s=s.replace(anchor,
             "  const independentQA=await runIndependentPr893Worker(WorkerWasmSource);\n"
             "  if(!independentQA.largeResponseDenied || !independentQA.objectCountDenied ||\n"
             "     independentQA.writerAuthorized || independentQA.productReadAccepted)\n"
             "    throw Error('QA05QRC893_INDEPENDENT_SCOPE_FAILED');\n"
             +anchor)
          p.write_text(s)
          PY
      - name: Independent REAL Chrome module Worker + actual Rust WASM positives and new negatives
        shell: bash
        run: |
          set -euo pipefail
          command -v google-chrome
          node tests/stage-e/chrome-smoke.mjs
          echo QA05QRC893_INDEPENDENT_REAL_CHROME_WORKER_STORED_DIFFGRIDS_ABI_CAS_LIMITS_PASS
      - name: No new JS UI route, second reader, Raw Save or enabled Writer; exact Source four remain pristine in Git
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const worker=readFileSync('crates/ddv-save-core/src/wasm_worker.rs','utf8');
          const guard=readFileSync('crates/ddv-save-core/src/worker_session.rs','utf8');
          const facade=readFileSync('src/lib/ddv/core/save/product-wasm-read-owner.mjs','utf8');
          assert.match(guard,/self\.session\.issue_saved_diffgrids_cursor/);
          assert.match(guard,/self\.session\.read_saved_diffgrids_page/);
          assert.match(worker,/MAX_TYPED_PAGE_JSON_BYTES:usize=512\*1024/);
          assert.match(worker,/MAX_OBJECT_IDS_PER_GRID:usize=2048/);
          assert.doesNotMatch(facade,/issue_saved_diffgrids_typed_cursor|read_saved_diffgrids_typed_page/);
          assert.doesNotMatch(worker,/writerAuthorized":true|productReadAccepted":true/);
          console.log('QA05QRC893_NO_DUPLICATE_READER_PUBLIC_UI_BRIDGE_WRITER');
          NODE
          test -z "$(git ls-files | grep -E 'OWNER_PRIVATE|\.p1g$' || true)"
          echo QA05QRC893_SOURCE4_QA2_FOCUS_NATIVE_ABI_CHROME_PASS

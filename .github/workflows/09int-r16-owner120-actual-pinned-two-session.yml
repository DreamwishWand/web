name: 09 INT R16 independent actual Owner120 Caller SHA two-session acceptance
on:
  push:
    branches:
      - validation/09int-r16-owner120-actual-pinned-two-session-20261026
permissions:
  contents: read
jobs:
  r16-actual-owner-two-backend-stale-fresh-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SUPABASE_ACCESS_TOKEN: ''
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'psycopg[binary]>=3,<4'
      - uses: supabase/setup-cli@v1
        with:
          version: 2.81.3
      - name: Freeze 120 actual Owner migrations in a disposable DB
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('supabase/config.toml')
          s=p.read_text()
          assert not any(x.strip().startswith('project_id =') for x in s.splitlines())
          assert len(list(Path('supabase/migrations').glob('*.sql')))==120
          p.write_text('project_id = "ddvre_09int_r16_pinned_source120"\n'+s)
          PY
          echo 'NO remote database, no Staging/Production secrets'
      - name: Apply exact actual Owner120 Source to empty local Supabase
        shell: bash
        run: |
          set -euo pipefail
          timeout 1500s supabase start > /tmp/r16-source120-start.log 2>&1 || {
            grep -Ein -B 4 -A 7 'error|failed|sqlstate|migration' /tmp/r16-source120-start.log | tail -n 120 || true
            tail -n 40 /tmp/r16-source120-start.log || true
            exit 1
          }
      - name: Run independent two-backend actual owner pinned Caller H0 H1 and replay
        env:
          DDVRE_R16_ISOLATED_LOCAL: CONFIRMED
        run: python -u tests/09int-r16-owner120-actual-pinned-two-session.py | tee /tmp/r16-source120-result.jsonl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r16-owner120-actual-two-backend-evidence
          path: |
            /tmp/r16-source120-start.log
            /tmp/r16-source120-result.jsonl
          if-no-files-found: warn
          retention-days: 7
      - name: Discard disposable DB and test content
        if: always()
        run: supabase stop --no-backup || true

        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '1d7ce707fd844a32fb9f083cd2c2eb4949ec8baa'
          test "$(git rev-parse HEAD^{tree})" = '6b7780d1bdc07ff2f525ca600b7e1a2c2f7d64fc'
          test "$(git diff --name-only '08bb8a8e1a765a6057c2de4e7fef6b8afac2655f' HEAD | wc -l)" = 17
          git diff --name-only '08bb8a8e1a765a6057c2de4e7fef6b8afac2655f' HEAD | sort >/tmp/qrw-paths.actual
          cat >/tmp/qrw-paths.expected <<'PATHS'
          src/lib/ddv/core/save/p1g-rust-worker-readonly-bridge.mjs
          src/lib/ddv/core/save/product-scoped-amount-local-adapter.mjs
          src/lib/ddv/core/save/product-scoped-amount-transport.mjs
          src/lib/ddv/core/save/product-scoped-placement-release.mjs
          src/lib/ddv/core/save/product-scoped-placement-transport.mjs
          src/lib/ddv/core/save/product-scoped-r02-release-anchor.mjs
          src/lib/ddv/core/save/product-wasm-read-owner.d.mts
          src/lib/ddv/core/save/product-wasm-read-owner.mjs
          src/lib/dev/LocalPlacementEditorDev.svelte
          src/lib/dev/PlacementProductRoute.svelte
          src/lib/dev/local-placement-copy.mjs
          src/lib/dev/local-placement-workflow.mjs
          src/lib/dev/local-scoped-edit-worker-port.mjs
          src/lib/dev/product-placement-client.mjs
          src/lib/dev/product-r02.worker.mjs
          src/routes/editor/world/r02/switch/+page.svelte
          tests/product-r02-web.test.mjs
          PATHS
          diff -u /tmp/qrw-paths.expected /tmp/qrw-paths.actual
          git diff --raw '08bb8a8e1a765a6057c2de4e7fef6b8afac2655f' HEAD
          set -euo pipefail
          git cat-file -e 905a48aedfb314563874dae707db8c91bcba58ce^{commit} || git fetch --no-tags origin 905a48aedfb314563874dae707db8c91bcba58ce
          git worktree add --detach /tmp/qrw-core 905a48aedfb314563874dae707db8c91bcba58ce
          test "$(git -C /tmp/qrw-core rev-parse HEAD)" = '905a48aedfb314563874dae707db8c91bcba58ce'
          rustc --version | grep -F 'rustc 1.100.0 (0ef1bc386 2026-11-09)'
          cargo generate-lockfile --manifest-path /tmp/qrw-core/crates/ddv-save-core/Cargo.toml
          echo '6bd3642b96af61a84a0b0d96b7e7e911415f519bcb4683c1092ea0bf191f71ac  /tmp/qrw-core/crates/ddv-save-core/Cargo.lock' | sha256sum -c -
          cargo install wasm-bindgen-cli --version 0.2.105 --locked --root /tmp/qrw-tools
          CARGO_TARGET_DIR=/tmp/qrw-target cargo build --locked --manifest-path /tmp/qrw-core/crates/ddv-save-core/Cargo.toml --release --target wasm32-unknown-unknown --no-default-features --features worker-wasm,product-switch626-r02-scoped
          B=/tmp/qrw-tools/bin/wasm-bindgen
          W=/tmp/qrw-target/wasm32-unknown-unknown/release/ddv_save_core.wasm
          "$B" "$W" --out-dir /tmp/qrw-node --target nodejs --no-typescript
          echo '052bd37353f4dbc5493bc76ad35e2bc59c13a3e7dfdf4716ad51f4d3ab65e385  /tmp/qrw-node/ddv_save_core_bg.wasm' | sha256sum -c -
          mkdir -p tests/qa-op static/qa-op src/routes/test-qrw-op
          "$B" "$W" --out-dir tests/qa-op --target web --no-typescript
          cp tests/qa-op/ddv_save_core_bg.wasm static/qa-op/
          sha256sum tests/qa-op/ddv_save_core.js static/qa-op/ddv_save_core_bg.wasm
      - run: npm ci --no-audit --no-fund
      - run: npm install --no-save --package-lock=false playwright-core@1.55.0

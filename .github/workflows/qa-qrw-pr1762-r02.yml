           const bin=['google-chrome-stable','google-chrome','chromium'].find(x=>spawnSync('which',[x]).status===0);assert.ok(bin);browser=await chromium.launch({headless:true,executablePath:spawnSync('which',[bin],{encoding:'utf8'}).stdout.trim(),args:['--no-sandbox','--disable-dev-shm-usage']});
           const page=await browser.newPage({viewport:{width:390,height:844}}),errors=[];page.on('pageerror',e=>errors.push(String(e)));await page.goto(origin+'/test-qrw-op/');await page.waitForFunction(()=>!!window.__qa,{},{timeout:90000});assert.equal(await page.evaluate(()=>window.__qa.error),undefined);
           const meta=JSON.parse(readFileSync('static/qa-op/meta.json','utf8')),bytes=readFileSync('static/qa-op/input.p1g');assert.equal(sha(bytes),meta.sha);
           const boundary=await page.evaluate(async()=>{const {p,wait,send,trace}=window.__qa,need=(x,k)=>{if(!x)throw Error(k)},sel={gridId:90001,x:204,y:116},args=[sel],build={platform:'switch',buildKind:'switch-bid',buildId:'9A239D3DB569756D',schema:626,externallyConfirmed:true},foreign={platform:'steam-windows',buildKind:'steam-full-version',buildId:'releases_1.25-v1.25.3-44-g0b41250d9ac0-incremental-22',schema:626,externallyConfirmed:true},sha=async b=>Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',b)),x=>x.toString(16).padStart(2,'0')).join('');
           let neg=0;const deny=async(f,k)=>{let d=false;try{await f()}catch{d=true}need(d,k);neg++};
           const get=async n=>{const b=new Uint8Array(await(await fetch('/qa-op/'+n+'.p1g')).arrayBuffer());return {file:new File([b],n+'.p1g'),build,originalSha256:await sha(b)}};

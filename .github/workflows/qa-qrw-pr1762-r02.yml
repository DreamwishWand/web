           await deny(()=>p.previewPlacement(...args),'before open');await deny(()=>p.previewPlacement({gridId:90001,retainedId:10,movedId:11}),'foreign selector');await deny(()=>p.open({...input,build:foreign}),'foreign build');await deny(()=>p.open({...input,build:{...build,buildId:'0000000000000000'}}),'wrong BID');
           await p.open(await get('bad'));await p.backupOriginal();await deny(()=>p.previewPlacement(...args),'wrong old/stock');await deny(()=>p.stagePlacement(),'bad stage');await p.close();
           await p.open(input);await deny(()=>p.previewPlacement(...args),'before backup');await p.backupOriginal();await deny(()=>p.stagePlacement(),'before preview');

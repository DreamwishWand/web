name: 05 QR PR451 independent Main-based Composite Worker/Consumer Chromium
on:
  push:
    branches: [qa/05qr-pr451-cumulative-20261104]
  pull_request:
    paths:
      - 'tests/qa-05qr-pr451-cumulative-newonly.test.mjs'
      - 'scripts/05qr-pr451-composed-worker-browser.mjs'
      - '.github/workflows/qa-pr451-composed-main.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  independent-new-composed:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Pinned exact PR451 Source; preserve all accepted PR394/405/422 paths
        run: |
          test "$(git merge-base 2b9fbe702c66a0da46ed5b621fc4fec8df296bad HEAD)" = 2b9fbe702c66a0da46ed5b621fc4fec8df296bad
          git diff --quiet 2b9fbe702c66a0da46ed5b621fc4fec8df296bad HEAD -- src/ crates/ docs/ tests/local-single-save-session-bridge.test.mjs
          git diff --quiet a6c69b441463431baa5333b07b952bddc62b843b 2b9fbe702c66a0da46ed5b621fc4fec8df296bad -- src/routes/editor/timing/ src/lib/presets/ src/lib/ddv/core/items/ src/lib/wep/
          echo PRIVATE_ORIGINAL_P1G_IN_CI=NO
          echo NATIVE_W1_V3_NOT_ACCEPTED=YES
          echo JS_EXPANDED_200_MIB_NOT_SUPPORTED=YES
          echo ALL_PRODUCT_WRITER=OFF
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm ci --no-audit --no-fund
      - name: Independent single-real-bridge composed readset and facade negatives
        run: node --test tests/qa-05qr-pr451-cumulative-newonly.test.mjs
      - name: Static /web built version + typecheck
        env:
          BASE_PATH: /web
        run: |
          npm run check
          npm run build
          test -f build/editor/timing/index.html
          test -f build/presets/index.html
      - run: npm install --no-save --package-lock=false playwright-core@1.55.0
      - name: Find actual Chromium
        id: chrome
        run: |
          CHROME_BIN="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          echo "path=$CHROME_BIN" >> "$GITHUB_OUTPUT"
      - name: Isolated dev server
        run: |
          npm run dev -- --host 127.0.0.1 --port 4287 > /tmp/qa451-dev.log 2>&1 &
          for i in $(seq 1 65); do
            if curl --silent --fail http://127.0.0.1:4287/editor/timing/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/qa451-dev.log; exit 1
      - name: Actual Chromium encrypted synthetic P1G Worker composed 8 ref diagnostic dev
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.path }}
          QR451_URL: http://127.0.0.1:4287
          QR451_MODE: dev
        run: node scripts/05qr-pr451-composed-worker-browser.mjs
      - name: Compile output /web base static server without deployment
        run: |
          node scripts/01a-pages-base-static-server.mjs > /tmp/qa451-static.log 2>&1 &
          for i in $(seq 1 65); do
            if curl --silent --fail http://127.0.0.1:4181/web/editor/timing/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/qa451-static.log; exit 1
      - name: Actual Chromium encrypted synthetic P1G Worker composed 8 ref diagnostic built Pages
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.path }}
          QR451_URL: http://127.0.0.1:4181/web
          QR451_MODE: pages-web
        run: node scripts/05qr-pr451-composed-worker-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-pr451-private-source-excluded-composed-actual-chromium
          path: .artifacts/05qr-pr451/
          if-no-files-found: ignore

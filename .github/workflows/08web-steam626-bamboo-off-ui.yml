name: 08 WEB Steam626 Bamboo exact ReadDomain OFF UI L1
on:
  pull_request:
    paths:
      - 'src/lib/wep/steam-bamboo-readonly-off-copy.mjs'
      - 'src/routes/editor/bamboo/steam/+page.svelte'
      - 'tests/web-steam626-bamboo-readonly-off-ui.test.mjs'
      - 'scripts/web-steam626-bamboo-readonly-off-chrome.mjs'
      - '.github/workflows/08web-steam626-bamboo-off-ui.yml'
permissions:
  contents: read
jobs:
  bamboo-ui-off:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - name: Exact UI OFF, no P1G File/Worker and eight languages
        run: node --test tests/web-steam626-bamboo-readonly-off-ui.test.mjs
      - name: Svelte check and static product route
        env:
          BASE_PATH: /web
        run: npm run check && npm run build
      - name: Actual 1366 and 320 Chrome OFF route and 200 percent zoom
        env:
          BASE_PATH: /web
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false playwright-core@1.55.0
          export CHROME_BIN="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium)"
          test -n "$CHROME_BIN"
          npm run preview -- --host 127.0.0.1 --port 4298 --strictPort >/tmp/08web-bamboo-off-preview.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4298/web/editor/bamboo/steam/ >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4298/web/editor/bamboo/steam/ >/dev/null
          node scripts/web-steam626-bamboo-readonly-off-chrome.mjs

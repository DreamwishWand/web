name: 05 QR-C PR886 independent DEV Native typed DiffGrids CLI QA
on:
  push:
    branches:
      - 'qa/05qrc-pr886-dev-cli-34f8bb04-20261110'
  pull_request:
    paths:
      - 'tests/qa-05qrc-pr886-dev-diffgrids-cli.test.mjs'
      - '.github/workflows/05qr-c-pr886-dev-diffgrids-cli-independent.yml'
permissions:
  contents: read
jobs:
  pr886-exact-cli-changed-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_TARGET_DIR: /tmp/qrc-pr886-native-dev-cli
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Pin immutable PR886 exact Source THREE blobs; only TWO new QA paths
        shell: bash
        run: |
          set -euo pipefail
          source=34f8bb044b5064105cffaba373af1e96d6c5505b
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            qa_tip="$(git rev-parse HEAD^2)"
          else
            qa_tip="$(git rev-parse HEAD)"
          fi
          git merge-base --is-ancestor "$source" "$qa_tip"
          test "$(git rev-parse "$qa_tip":.github/workflows/01a-private-native-rust-v1.yml)" = "99d61888a01f814cc01f95a6e63014a449d10f55"
          test "$(git rev-parse "$qa_tip":crates/ddv-save-core/src/bin/wand-local-rust-v1.rs)" = "88880753e89a0498b6b49ebf3dec4fe84cc2e772"
          test "$(git rev-parse "$qa_tip":tests/native-owner-saved-diffgrids-typed-cli.test.mjs)" = "7c8d2e87cf007964cb0f5a80d905fc5d7ffa67a3"
          actual="$(git diff --name-only "$source" "$qa_tip" | sort)"
          expected="$(printf '%s\n' \
            .github/workflows/05qr-c-pr886-dev-diffgrids-cli-independent.yml \
            tests/qa-05qrc-pr886-dev-diffgrids-cli.test.mjs | sort)"
          test "$actual" = "$expected"
          test -z "$(git diff --name-only "$source" "$qa_tip" -- crates/ddv-save-core/src src)"
          test -z "$(git ls-files | grep -E 'OWNER_PRIVATE|STEAM_SAVE_OWNER_PRIVATE|\.p1g$' || true)"
      - name: Native V1 CLI fresh compiled binary and new independent QA synthetic cases
        shell: bash
        run: |
          set -euo pipefail
          cargo build --manifest-path crates/ddv-save-core/Cargo.toml --features private-native-v1 --bin wand-local-rust-v1 --release
          test -x "$CARGO_TARGET_DIR/release/wand-local-rust-v1"
          QA05QRC886_REQUIRE_NATIVE=1 WAND_TEST_NATIVE_RUST_V1="$CARGO_TARGET_DIR/release/wand-local-rust-v1" \
            node tests/qa-05qrc-pr886-dev-diffgrids-cli.test.mjs
      - name: Native product ABI default/indexed/read-only CLI and Worker WASM ABI
        shell: bash
        run: |
          set -euo pipefail
          cargo check --manifest-path crates/ddv-save-core/Cargo.toml --lib
          cargo check --manifest-path crates/ddv-save-core/Cargo.toml --features indexed-read --lib
          cargo check --manifest-path crates/ddv-save-core/Cargo.toml --features private-native-v1 --lib --bin wand-local-rust-v1
          cargo check --manifest-path crates/ddv-save-core/Cargo.toml --target wasm32-unknown-unknown --features worker-wasm,indexed-read --lib
      - name: Security partition no new reader/codec/Writer and no Private Save file
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const cli=readFileSync('crates/ddv-save-core/src/bin/wand-local-rust-v1.rs','utf8');
          const wasm=readFileSync('crates/ddv-save-core/src/wasm_worker.rs','utf8');
          assert.match(cli,/issue_saved_diffgrids_cursor/);
          assert.match(cli,/read_saved_diffgrids_page/);
          assert.match(cli,/UnresolvedExternalLayout/);
          assert.doesNotMatch(wasm,/dev-stored-diffgrids-typed-read-only|savedDiffGridsTypedRead/);
          assert.doesNotMatch(cli,/write_all|write_to|export_edited_copy/);
          console.log('QA05QRC886_DEV_NATIVE_CLI_ONLY_NO_NEW_READER_WORKER_WRITER');
          NODE
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            qa_tip="$(git rev-parse HEAD^2)"
          else
            qa_tip="$(git rev-parse HEAD)"
          fi
          test "$(git diff --name-only 34f8bb044b5064105cffaba373af1e96d6c5505b "$qa_tip" | wc -l)" -eq 2
          test -z "$(git diff --name-only 34f8bb044b5064105cffaba373af1e96d6c5505b "$qa_tip" -- crates/ddv-save-core/src src)"
          echo QA05QRC886_SOURCE3_QA2_NATIVE_ABI_WASM_CLI_PUBLIC_SYNTHETIC_PASS

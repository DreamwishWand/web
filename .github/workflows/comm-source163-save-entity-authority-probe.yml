name: 03 COMM Save Entity Legacy SQL Postrevoke FULL163 Probe
on:
  push:
    branches: [comm/w-comm-006-post163-save-entity-revocation-probe-20261105]
permissions:
  contents: read
jobs:
  local-two-pg:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      DDVRE_E2_LOCAL_DISPOSABLE: APPROVED
      DATABASE_URL: ''
      SUPABASE_ACCESS_TOKEN: ''
      SUPABASE_PROJECT_ID: ''
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.0
      - name: Verify pinned Source163 and no remote account
        run: |
          set -euo pipefail
          test "$(find supabase/migrations -name '*.sql' | wc -l)" -eq 163
          test "$(git hash-object supabase/migrations/20261104040000_community_source162_gallery_photo_parent_service_execute_off.sql)" = 6d8ec394b1773c65db88e9b459afc59d6427b5b9
          python3 -m py_compile tests/comm-source163-save-entity-postrevoke-probe-disposable.py
          test -z "$DATABASE_URL" && test -z "$SUPABASE_ACCESS_TOKEN" && test -z "$SUPABASE_PROJECT_ID"
      - name: Run disposable real ES256 GoTrue FULL163 Supabase
        run: |
          set -euo pipefail
          printf '\n[auth]\nsigning_keys_path = "./signing_keys.json"\n' >> supabase/config.toml
          printf '[]\n' > supabase/signing_keys.json
          supabase gen signing-key --algorithm ES256 --yes >/tmp/save-entity-key.log 2>&1
          printf 'project_id = "ddvre_save_entity_local_probe_20261105"\n' | cat - supabase/config.toml > /tmp/save-entity-config
          mv /tmp/save-entity-config supabase/config.toml
          printf 'COMMUNITY_MEDIA_BUCKET=ddvre-save-entity-local-media\nWEP_PRESET_ARTIFACT_BUCKET=ddvre-save-entity-local-artifact\n' > supabase/functions/.env
          timeout 1800s supabase start >/tmp/save-entity-start.log 2>&1 || { echo SAVE_ENTITY_ENV_START_NOT_RUN; tail -n 10 /tmp/save-entity-start.log; exit 1; }
          timeout 900s supabase db reset --no-seed >/tmp/save-entity-reset.log 2>&1 || { echo SAVE_ENTITY_DB_RESET_NOT_RUN; tail -n 10 /tmp/save-entity-reset.log; exit 1; }
      - run: python3 -m pip install --quiet 'psycopg[binary]==3.2.10'
      - name: Check true eligible Save Entity then postrevoke privileged SQL commit
        run: |
          set -euo pipefail
          python3 tests/comm-source163-save-entity-postrevoke-probe-disposable.py | tee /tmp/save-entity-probe.log
          grep -q '"case": "SAVE_ENTITY_ELIGIBLE_SIGNED_A2_DIRECT_SERVICE_SQL_COMMIT"' /tmp/save-entity-probe.log
          grep -q '"case": "SAVE_ENTITY_POSTREVOKE_DIRECT_SERVICE_SQL_COMMIT_TRUE_RED"' /tmp/save-entity-probe.log
      - name: Destroy synthetic local signer and DB
        if: always()
        run: |
          supabase stop --no-backup >/dev/null 2>&1 || true
          rm -f supabase/signing_keys.json supabase/functions/.env /tmp/save-entity-*.log /tmp/save-entity-config

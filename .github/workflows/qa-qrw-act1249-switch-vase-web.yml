name: QA ONLY ACT1249 Switch Vase actual Web (never merge)
on:
  pull_request:
    paths:
      - '.github/workflows/qa-qrw-act1249-switch-vase-web.yml'
permissions:
  contents: read
jobs:
  actual-connection:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_TARGET_DIR: /tmp/qrw-switch-vase-target
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cd961f78394dab3fab04b1d3039b8762d0338089
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Fixed current Web exact14 and accepted Switch Vase Core
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 'cd961f78394dab3fab04b1d3039b8762d0338089'
          test "$(git rev-parse HEAD:src/lib/ddv/core/save/p1g-rust-worker-readonly-bridge.mjs)" = 'e4e526c5d767dd84d0490085f0db057244509fe1'
          test "$(git rev-parse HEAD:src/lib/ddv/core/save/product-scoped-amount-local-adapter.mjs)" = '1e95b0f37bc674c53bd2c88a367557837995cbfc'
          test "$(git rev-parse HEAD:src/lib/ddv/core/save/product-scoped-placement-release.mjs)" = '85d2e6f2183e2d5444eb672cb5f50306281731aa'
          test "$(git rev-parse HEAD:src/lib/ddv/core/save/product-scoped-placement-transport.mjs)" = '1f890d9b0768cff561b3aa044c301b9e6336c998'
          test "$(git rev-parse HEAD:src/lib/ddv/core/save/product-scoped-switch-vase-release-anchor.mjs)" = '8ab6dfca2d6f4d6a73fce710dc4e57973afabcc0'
          test "$(git rev-parse HEAD:src/lib/ddv/core/save/product-wasm-read-owner.d.mts)" = 'e8541186cc046cc1376329365b7c2930409c52a4'
          test "$(git rev-parse HEAD:src/lib/ddv/core/save/product-wasm-read-owner.mjs)" = 'fa46f48fa73b1acd7927f9056d4269a78067029e'
          test "$(git rev-parse HEAD:src/lib/dev/LocalPlacementEditorDev.svelte)" = '7bf312d6f1b6987389c7aef52a01c7dcf21bb84e'
          test "$(git rev-parse HEAD:src/lib/dev/PlacementProductRoute.svelte)" = '4e15dfa22dcab7d5c499cb5d51624a76f57535d8'
          test "$(git rev-parse HEAD:src/lib/dev/local-placement-workflow.mjs)" = '91e46646263582f6bbe7deb41bf8b540faca2d29'
          test "$(git rev-parse HEAD:src/lib/dev/product-placement-client.mjs)" = '9b716d33b469aeeceb3aeae3013c2ccd9948353d'
          test "$(git rev-parse HEAD:src/lib/dev/product-switch-vase-add.worker.mjs)" = 'c2a07f7cbc1f49c56f1cd3d8850c2c26a087cfdf'
          test "$(git rev-parse HEAD:src/routes/editor/world/vase/switch/+page.svelte)" = '6a45d273bb942d9e228daf4e93b7091e38f82158'
          test "$(git rev-parse HEAD:tests/product-switch626-vase-web.test.mjs)" = '4a0f92b79cd107d47529fe376ef398893ed0c448'
          git cat-file -e 6d1fe74a62459d94f96b053f53ec6238fd30fb43^{commit} || git fetch --no-tags origin 6d1fe74a62459d94f96b053f53ec6238fd30fb43
          git worktree add --detach /tmp/qrw-switch-vase-core 6d1fe74a62459d94f96b053f53ec6238fd30fb43
          test "$(git -C /tmp/qrw-switch-vase-core rev-parse HEAD)" = '6d1fe74a62459d94f96b053f53ec6238fd30fb43'
          rustc --version | grep -F 'rustc 1.100.0 (0ef1bc386 2026-11-09)'
          cargo generate-lockfile --manifest-path /tmp/qrw-switch-vase-core/crates/ddv-save-core/Cargo.toml
          echo '6bd3642b96af61a84a0b0d96b7e7e911415f519bcb4683c1092ea0bf191f71ac  /tmp/qrw-switch-vase-core/crates/ddv-save-core/Cargo.lock' | sha256sum -c -
      - name: Reproduce accepted actual artifact then generate Web glue
        run: |
          set -euo pipefail
          cargo install wasm-bindgen-cli --version 0.2.105 --locked --root /tmp/qrw-switch-vase-tools
          cargo build --locked --manifest-path /tmp/qrw-switch-vase-core/crates/ddv-save-core/Cargo.toml --release --target wasm32-unknown-unknown --no-default-features --features worker-wasm,product-switch626-vase-add-scoped
          B=/tmp/qrw-switch-vase-tools/bin/wasm-bindgen
          W="$CARGO_TARGET_DIR/wasm32-unknown-unknown/release/ddv_save_core.wasm"
          "$B" "$W" --out-dir /tmp/qrw-switch-vase-node --target nodejs --no-typescript
          echo 'e79c98a9bfb85c26316b0c527d0195c6616f97403cb6ea6d858509130e32db25  /tmp/qrw-switch-vase-node/ddv_save_core_bg.wasm' | sha256sum -c -
          mkdir -p tests/qa-switch-vase static/qa-switch-vase
          "$B" "$W" --out-dir tests/qa-switch-vase --target web --no-typescript
          cp tests/qa-switch-vase/ddv_save_core_bg.wasm static/qa-switch-vase/
          sha256sum tests/qa-switch-vase/ddv_save_core.js static/qa-switch-vase/ddv_save_core_bg.wasm
      - run: npm ci --no-audit --no-fund
      - run: npm install --no-save --package-lock=false playwright-core@1.55.0
      - name: Temporary synthetic fixture and actual product RPC Worker connection
        run: |
          mkdir -p src/routes/test-qrw-switch-vase
          cat > tests/.qa-switch-vase-fixture.mjs <<'NODE'
          import {readFileSync,writeFileSync} from 'node:fs';import {createHash} from 'node:crypto';import assert from 'node:assert/strict';import {makeSyntheticP1gProfile} from './helpers/p1g-fixture.mjs';
          const item=40000066,G=7,N=9;
          const data=readFileSync('/tmp/qrw-switch-vase-core/crates/ddv-save-core/data/steam626-vase-geometry-quota.jsonl','utf8').trim().split('\n').slice(1).map(JSON.parse);
          const bits=Buffer.concat(data.filter(x=>x[0]==='floor').map(x=>Buffer.from(x[2],'hex')));
          const floor=(x,y)=>{if(x<2||x+4>250||y<2||y+4>175)return false;for(let i=x-2;i<x+4;i++)for(let j=y-2;j<y+4;j++){const n=i*175+j;if(!(bits[n>>3]&(1<<(n%8))))return false;}return true};
          let poses=[];for(let x=2;x<247;x++)for(let y=2;y<172;y++)if(floor(x,y))poses.push([x*2,y*2]);assert.equal(poses.length,9299);
          const [x,y]=poses[0],ox=x<250?480:2,oy=y<175?330:2;
          const d={GameInfo:{Version:626},World:{Villages:[{Areas:{6:{Unlocked:true,GridIDs:[G]}},VillageObjectLimitName:'Village04ObjectLimit',HighEndVillageObjectLimitName:'HighEndVillageObjectLimit',BoughtObjectLimit:{UniqueLimit:0,InstanceLimit:0,Exclusions:[],SpecificItemLimits:[]}}],FloatingIslands:{},ExtraLimitObject:false,GridCollection:{Grids:{[G]:{ID:G,GridDataPath:'GridData/Villages/Village04-DarkLevel-GridData.json',GridDefaultLayoutPath:'',TessellationFactor:2,NextGridObjectID:N,Objects:{4:{ID:4,ItemID:item,X:ox,Y:oy,Orientation:'GridOrientation_Up',State:null}}}},DiffGrids:{}},MissionSlots:{},RecurringEvents:{},TimeLostTreasures:{},NextTimeLostTreasureID:1,Snippets:{},NextSnippetID:0},Player:{ListInventories:{0:{ID:0,CompatibleItemType:'ItemType_Furniture',CompatibleFurnitureTypes:{List:['FurnitureItemType_Default']},Inventory:{[item]:{Amount:3,Marker:'ItemMarker_None'}}}},ContainerInventories:{},AchievementsData:[],EvolveStatesProfile:{EvolveProgressState:{}},BattlePassStates:{Progress:{},FtueProgress:{TasksProgress:[],WeeklyProgress:[],WeeklyTasksProgress:[]}}},ConditionalEventHistory:{ActiveEvents:{}},Opaque:{escaped:'keep'}};
          delete d.Player.BattlePassStates.FtueProgress.WeeklyProgress;
          d.Player.DutySlots={};
          const missing=structuredClone(d);delete missing.Player.DutySlots;const mb=makeSyntheticP1gProfile(missing);writeFileSync('static/qa-switch-vase/missing-duty.p1g',mb);
          const want=structuredClone(d),gr=want.World.GridCollection.Grids[G];gr.Objects[N]={ID:N,ItemID:item,Orientation:'GridOrientation_Up',State:null,X:x,Y:y};gr.NextGridObjectID++;want.Player.ListInventories[0].Inventory[item].Amount--;
          const b=makeSyntheticP1gProfile(d);writeFileSync('static/qa-switch-vase/input.p1g',b);writeFileSync('static/qa-switch-vase/meta.json',JSON.stringify({sha:createHash('sha256').update(b).digest('hex'),expected:want,selector:{gridId:G,x,y}}));
          NODE
          node tests/.qa-switch-vase-fixture.mjs
          cat > src/routes/test-qrw-switch-vase/qa.worker.mjs <<'NODE'
          import init,{WorkerWasmSource} from '../../../tests/qa-switch-vase/ddv_save_core.js';
          import {createProductSwitch626VaseAddLocalAdapter} from '$lib/ddv/core/save/product-scoped-amount-local-adapter.mjs';
          import {installLocalVaseDevWorker} from '$lib/dev/local-scoped-edit-worker-port.mjs';
          try{
           const r=await fetch('/qa-switch-vase/ddv_save_core_bg.wasm');if(!r.ok||!r.headers.get('content-type')?.startsWith('application/wasm'))throw Error('WASM MIME');await init({module_or_path:await r.arrayBuffer()});
           let opens=0,closes=0;
           const factory=async()=>({WorkerWasmSource:class extends WorkerWasmSource{constructor(...args){super(...args);opens++}close(){closes++;return super.close()}}});
           const a=createProductSwitch626VaseAddLocalAdapter({wasmFactory:factory});const adapter={...a,async close(){const ack=await a.close();postMessage({kind:'QA_COUNTS',opens,closes});return ack}};installLocalVaseDevWorker(self,adapter);postMessage({kind:'QA_LOCAL_READY'});
          }catch(e){postMessage({kind:'QA_ERROR',error:String(e?.stack||e)})}
          NODE
          cat > src/routes/test-qrw-switch-vase/+page.svelte <<'SVELTE'
          <script>
          import {onMount} from 'svelte';
          import {createLocalVaseDevPort} from '$lib/dev/local-scoped-edit-worker-port.mjs';
          import {createProductSwitchVaseAddPort} from '$lib/dev/product-placement-client.mjs';
          const need=(v,k)=>{if(!v)throw Error(k)},sha=async b=>Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',b)),x=>x.toString(16).padStart(2,'0')).join('');
          onMount(()=>{let w,p,phase='init';(async()=>{try{
           let neg=0;const deny=async(f,k)=>{let ok=false;try{await f()}catch{ok=true}need(ok,k);neg++};
           const original=window.Worker;let workers=0;window.Worker=new Proxy(original,{construct(t,a,n){workers++;return Reflect.construct(t,a,n)}});
           await deny(()=>createProductSwitchVaseAddPort(),'null anchor');need(workers===0,'no unauthorized Worker');
           const meta=await(await fetch('/qa-switch-vase/meta.json')).json(),bytes=new Uint8Array(await(await fetch('/qa-switch-vase/input.p1g')).arrayBuffer());need(await sha(bytes)===meta.sha,'original');
           w=new Worker(new URL('./qa.worker.mjs',import.meta.url),{type:'module'});let counts=null;
           await new Promise((resolve,reject)=>{w.addEventListener('message',e=>{if(e.data.kind==='QA_LOCAL_READY')resolve();if(e.data.kind==='QA_ERROR')reject(Error(e.data.error));if(e.data.kind==='QA_COUNTS')counts=e.data});w.onerror=()=>reject(Error('Worker error'))});
           p=createLocalVaseDevPort(w);need(p.spatialPreview===undefined&&p.previewBackpack===undefined&&p.previewWardrobe===undefined,'foreign surface');
           const build={platform:'switch',buildKind:'switch-bid',buildId:'9A239D3DB569756D',schema:626,externallyConfirmed:true},file=new File([bytes],'synthetic-switch-vase.p1g'),input={file,build,originalSha256:meta.sha},sel=meta.selector;
           await deny(()=>p.previewPlacement(sel),'before Open');await deny(()=>p.open({...input,build:{...build,buildId:'52BD625D9B4E0053'}}),'old BID');await deny(()=>p.open({...input,build:{platform:'steam-windows',buildKind:'steam-full-version',buildId:'releases_1.25-v1.25.3-44-g0b41250d9ac0-incremental-22',schema:626,externallyConfirmed:true}}),'Steam');
           phase='positive-open';await p.open(input);phase='positive-backup';await deny(()=>p.previewPlacement(sel),'before Backup');await p.backupOriginal();await deny(()=>p.stagePlacement(),'before Preview');await deny(()=>p.previewPlacement({...sel,projectedDecodedSha256:'x'}),'forged selector');
           phase='positive-preview';const pr=await p.previewPlacement(sel);need(pr.exactFieldChangedCount===3&&pr.itemId===40000066&&pr.gridId===sel.gridId&&pr.x===sel.x&&pr.y===sel.y&&pr.oldAmount===3&&pr.newAmount===2&&pr.writerAuthorized===false&&pr.sessionId===undefined,'preview');
           phase='positive-stage';await deny(()=>p.stagePlacement({}),'extra Stage args');need((await p.stagePlacement()).exactFieldChangedCount===3,'stage');await deny(()=>p.previewPlacement(sel),'after Stage');await p.undo();await deny(()=>p.exportEditedCopy(),'undone export');await p.redo();
           phase='positive-export';const out=await p.exportEditedCopy();need(out.freshWorkerReopenVerified===true&&out.writerAuthorized===false,'fresh codec reopen');const b=await p.downloadVerifiedCopy('backup'),e=await p.downloadVerifiedCopy('edited');need(b.name!==e.name&&b.name!==file.name&&e.name!==file.name,'distinct names');need(await sha(b.encryptedBytes)===meta.sha&&await sha(new Uint8Array(await file.arrayBuffer()))===meta.sha,'original Backup');
           const root=await navigator.storage.getDirectory(),bf=await(await root.getFileHandle(b.name)).getFile(),ef=await(await root.getFileHandle(e.name)).getFile();need(await sha(new Uint8Array(await bf.arrayBuffer()))===meta.sha&&await sha(new Uint8Array(await ef.arrayBuffer()))===e.sha256,'actual OPFS');
           phase='positive-close';await deny(()=>p.exportEditedCopy(),'replay');await p.close();await deny(()=>p.previewPlacement(sel),'closed');need(counts?.opens===1&&counts?.closes===1&&workers===1,'one actual owner');phase='missing-duty';const bad=new Uint8Array(await(await fetch('/qa-switch-vase/missing-duty.p1g')).arrayBuffer());await p.open({file:new File([bad],'synthetic-missing-duty.p1g'),build,originalSha256:await sha(bad)});await p.backupOriginal();await deny(()=>p.previewPlacement(sel),'missing DutySlots');await deny(()=>p.stagePlacement(),'missing DutySlots stage');await p.close();need(counts?.opens===2&&counts?.closes===2&&workers===1,'isolated negative close');p.dispose();await deny(()=>p.previewPlacement(sel),'disposed');window.Worker=original;
           window.__qrwSpatial={ok:true,negative:neg,opens:counts.opens,closes:counts.closes,workers,backup:Array.from(b.encryptedBytes),edited:Array.from(e.encryptedBytes)};
           }catch(e){window.__qrwSpatial={error:phase+': '+String(e?.stack||e)};p?.dispose();w?.terminate()}})();return()=>{p?.dispose();w?.terminate()}});
          </script>
          <p>Isolated synthetic QA only</p>
          SVELTE
          cat > tests/.qa-switch-vase-browser.mjs <<'NODE'
          import {chromium} from 'playwright-core';import {spawn,spawnSync} from 'node:child_process';import {readFileSync,writeFileSync} from 'node:fs';import assert from 'node:assert/strict';
          const origin='http://127.0.0.1:4182',server=spawn('npm',['run','dev','--','--host','127.0.0.1','--port','4182','--strictPort'],{env:{...process.env,BASE_PATH:''},stdio:'inherit'});let browser;
          try{
           for(let i=0;i<100;i++){try{if((await fetch(origin+'/test-qrw-switch-vase/')).ok)break}catch{}await new Promise(r=>setTimeout(r,250))}
           const bin=['google-chrome-stable','google-chrome','chromium'].find(x=>spawnSync('which',[x]).status===0);assert.ok(bin);browser=await chromium.launch({headless:true,executablePath:spawnSync('which',[bin],{encoding:'utf8'}).stdout.trim(),args:['--no-sandbox','--disable-dev-shm-usage']});
           const page=await browser.newPage();await page.goto(origin+'/test-qrw-switch-vase/');await page.waitForFunction(()=>!!window.__qrwSpatial,{},{timeout:120000});const q=await page.evaluate(()=>window.__qrwSpatial);assert.ok(q.ok,q.error);assert.equal(q.negative,15);assert.equal(q.opens,2);assert.equal(q.closes,2);assert.equal(q.workers,1);
           assert.deepEqual(Buffer.from(q.backup),readFileSync('static/qa-switch-vase/input.p1g'));writeFileSync('/tmp/qrw-switch-vase-edited.p1g',Buffer.from(q.edited));
           const check=spawnSync(process.execPath,['--input-type=module','-e',"import {readFileSync} from 'node:fs';import assert from 'node:assert/strict';import {p1gPackagedProfileCodec as c} from './src/lib/ddv/core/save/p1g-packaged-profile-codec.js';const p=await c.loadProfile(new Uint8Array(readFileSync('/tmp/qrw-switch-vase-edited.p1g')));assert.deepEqual(JSON.parse(p.jsonText),JSON.parse(readFileSync('static/qa-switch-vase/meta.json','utf8')).expected);"],{stdio:'inherit'});assert.equal(check.status,0);
           console.log('ACT1249_SWITCH_VASE_WEB_ACTUAL_PASS',JSON.stringify({positive:1,negative:q.negative,actualWorker:q.workers,actualRustSessions:q.opens,actualCloses:q.closes,actualOpfs:true,independentReopen:true,exact3:true,signed:false,genuine:false}));
          }finally{if(browser)await browser.close();server.kill()}
          
          NODE
          node tests/.qa-switch-vase-browser.mjs

name: 04 QR-W PR1184 exact Steam common manifest independent
on:
  pull_request:
    paths:
      - '.github/workflows/04qr-w-pr1184-steam-common-independent.yml'
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          set -euo pipefail
          test "$(git merge-base HEAD 'a6fd37a54a0e903cf284d1649ff78f40e3fd3c69')" = 'a6fd37a54a0e903cf284d1649ff78f40e3fd3c69'
          test "$(git diff --name-only 'a6fd37a54a0e903cf284d1649ff78f40e3fd3c69' HEAD)" = '.github/workflows/04qr-w-pr1184-steam-common-independent.yml'
          test "$(git diff --name-only 'af2af991e1d037afe070d80b32312e12c6720ba9' 'a6fd37a54a0e903cf284d1649ff78f40e3fd3c69' | wc -l)" = 2
          test "$(git rev-parse HEAD:src/lib/item-media/switch1253-public-item-images.mjs)" = '73f15d221cede4ce2c195a48e57321a7293ab501'
          test "$(git rev-parse HEAD:tests/web-steam1253-door-primary-contract.test.mjs)" = 'e34ede0c1ef9dcfd072f2511c454795406abed4e'
          npm ci --no-audit --no-fund
          npm install --no-save --package-lock=false playwright-core@1.55.0
          git show af2af991e1d037afe070d80b32312e12c6720ba9:src/lib/item-media/switch1253-public-item-images.mjs > src/lib/item-media/qa-parent.mjs
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';import {createHash} from 'node:crypto';import * as M from './src/lib/item-media/switch1253-public-item-images.mjs';import * as P from './src/lib/item-media/qa-parent.mjs';
          const review=o=>({...o,mediaPublic:true,rightsReview:'OPERATOR_ACCEPTED',receivingContact:'MANAGED_VERIFIED',takedown:'MANAGED_TESTED',managedHttps:'MANAGED_VERIFIED',attribution:'EIGHT_LOCALES_REVIEWED',oldUrlAndCache:'MANAGED_TESTED',rollback:'MANAGED_TESTED',operatorReceiptSha256:'c'.repeat(64),items:{}});
          const fields=['originalNativeStreamSha256','sourcePngSha256','webpSha256','rightsStatus','publicationDecision','visibility'];
          function bind(m,r){for(const [id,e] of Object.entries(m.items)){e.publicationDecision='OWNER_SCOPED_PUBLICATION_ACCEPTED';r.items[id]=Object.fromEntries(fields.map(k=>[k,e[k]]))}const {mediaPublic,items,...p}=r;m.publication={gate:'MEDIA_PUBLIC_SCOPED_ON',...p};return m}
          const sr=review(M.STEAM1253_REVIEWED_RELEASE),wr=review(M.SWITCH1253_REVIEWED_RELEASE),wm=M.prepareSwitch1253ItemImageManifest();wm.items['40006096']={...wm.items['40000047'],...M.SWITCH1253_NATIVE_PINS['40006096']};bind(wm,wr);
          const urlFor=id=>{const p=M.STEAM1253_NATIVE_PINS[id];return '/ddv/item-images/'+M.STEAM1253_ITEM_IMAGE_VARIANT+'/'+p.webpSha256.slice(0,2)+'/'+p.webpSha256+'.webp'};
          
          const pins=M.STEAM1253_NATIVE_PINS,prior=P.STEAM1253_NATIVE_PINS,ids=Object.keys(pins).filter(id=>!Object.hasOwn(prior,id)).sort();assert.equal(ids.length,2);assert.equal(Object.keys(pins).length,5);for(const id of Object.keys(prior))assert.deepEqual(pins[id],prior[id]);assert.deepEqual(M.SWITCH1253_NATIVE_PINS,P.SWITCH1253_NATIVE_PINS);assert.deepEqual(M.SWITCH1253_VISUAL_QUARANTINE,P.SWITCH1253_VISUAL_QUARANTINE);assert.deepEqual(M.STEAM1253_REVIEWED_RELEASE,P.STEAM1253_REVIEWED_RELEASE);assert.equal(M.STEAM1253_REVIEWED_RELEASE.mediaPublic,false);
          const rows=ids.map(id=>{const p=pins[id];return [id,p.iconGuid,p.originalBundleSha256,p.originalNativeStreamSha256,p.sourcePngSha256,p.webpSha256,p.rgba160Sha256,p.bytes,p.fallbackBundleSha256,p.fallbackNativeStreamSha256]});
          assert.deepEqual(ids,['40000047','40006096']);assert.equal(pins[ids[0]].webpSha256,'30ab4e9c59d87e2796a56a2bdda2b87bfc03bb39364b3d2267d31db2804865e0');assert.equal(pins[ids[1]].webpSha256,'75292936edd3ed82fd97e69f7e8e09771ce4c9ec36d867c7703b066a95b1854c');assert.equal(pins[ids[0]].originalNativeStreamSha256,'3667a7212306096b69896e7304be9982fd1f95e718b27f742b3ffe0cabb32972');assert.equal(pins[ids[1]].originalNativeStreamSha256,'7daefc7646df6b25fc07859b28536027323ad12edcbdef4eb19e388ea972e1d4');assert.equal(pins[ids[0]].sourcePngSha256,'1e195cb2c3a28acd7cd6a6d68ede35928c77245fadd1f465b506162ffd3bd474');assert.equal(pins[ids[1]].sourcePngSha256,'e1a6a39a50a38acf6f69b70cf4d53c6092396930c41dc3327510ba307e3969f1');assert.equal(pins[ids[0]].fallbackNativeStreamSha256,M.SWITCH1253_NATIVE_PINS[ids[0]].originalNativeStreamSha256);for(const f of ['fallbackPlatform','fallbackBuildID','fallbackBundleSha256','fallbackNativeStreamSha256'])assert.equal(pins[ids[1]][f],null);assert.equal(pins[ids[1]].fallbackPolicy,'NO_FALLBACK_SWITCH_VISUAL_QUARANTINED');
          assert.equal(new Set(Object.values(pins).map(p=>p.iconGuid)).size,5);assert.equal(new Set(Object.values(pins).map(p=>p.webpSha256)).size,5);
          const sm=bind(M.prepareSteam1253ItemImageManifest(Object.keys(pins)),sr);sm.switch=wm;const cat=M.validateSteam1253ItemImageCatalog(sm,sr,wr);assert.equal(cat.count,5);const hide=['40002422','40006077','40002400','40003299','40300001'];for(const id of hide){assert.equal(M.scopedSwitch1253ItemImageHref('',id,cat),null);const x=structuredClone(sm);x.items[id]={...x.items[ids[0]]};const rr=structuredClone(sr);rr.items[id]={...rr.items[ids[0]]};assert.throws(()=>M.validateSteam1253ItemImageCatalog(x,rr,wr));}
          for(const id of ids){const p=pins[id];assert.ok(Object.isFrozen(p));assert.equal(p.platform,'Steam Windows');assert.equal(p.gameVersion,'1.25.3');assert.equal(p.schema,626);assert.equal(p.visibility,'RELEASED_PLAYER_FACING');assert.equal(p.codec,'WEBP_LOSSLESS_RGBA_EXACT');assert.equal(p.width,160);assert.equal(p.height,160);assert.equal(M.scopedSwitch1253ItemImageHref('/web',id,cat),'/web'+urlFor(id));const single=bind(M.prepareSteam1253ItemImageManifest([id]),sr);single.switch=wm;assert.equal(M.validateSteam1253ItemImageCatalog(single,sr,wr).count,1);const removed=structuredClone(sm);delete removed.items[id];const w=M.validateSteam1253ItemImageCatalog(removed,sr,wr);assert.equal(w.count,4);assert.equal(M.scopedSwitch1253ItemImageHref('',id,w),null);
          for(const f of ['iconGuid','originalNativeStreamSha256','sourcePngSha256','webpSha256','rgba160Sha256','fallbackNativeStreamSha256','visibility','rightsStatus','publicationDecision','fullVersion']){const x=structuredClone(single);x.items[id][f]='FORGED';assert.throws(()=>M.validateSteam1253ItemImageCatalog(x,sr,wr))}
          const x=structuredClone(single);x.items[id]=structuredClone(sm.items[ids.find(i=>i!==id)]);assert.throws(()=>M.validateSteam1253ItemImageCatalog(x,sr,wr));assert.equal(M.scopedSwitch1253ItemImageHref('',p.iconGuid,cat),null);}
          assert.throws(()=>M.validateSteam1253ItemImageCatalog(sm));assert.equal(M.scopedSwitch1253ItemImageHref('', '40006096', {target:M.SWITCH1253_TARGET,assetVariant:M.SWITCH1253_ITEM_IMAGE_VARIANT,codec:'WEBP_LOSSLESS_RGBA_EXACT',items:{'40006096':M.SWITCH1253_NATIVE_PINS['40006096']}}),null);console.log('QA706_EXACT_2_INDEPENDENT_PIN_DIGEST_PARENT_IMMUTABLE_ALL_WITHDRAW_DENY_PASS');
          JS
          rm src/lib/item-media/qa-parent.mjs
          export CHROME_BIN="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium)"
          BASE_PATH='' npm run dev -- --host 127.0.0.1 --port 4375 --strictPort >/tmp/qa.log 2>&1 &
          for i in $(seq 1 75); do if curl -fsS http://127.0.0.1:4375/collection/ >/dev/null; then break; fi; sleep 1; done
          curl -fsS http://127.0.0.1:4375/collection/ >/dev/null
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';import {chromium} from 'playwright-core';
          const root='http://127.0.0.1:4375',browser=await chromium.launch({headless:true,executablePath:process.env.CHROME_BIN,args:['--no-sandbox','--disable-dev-shm-usage']});
          try{const ctx=await browser.newContext({serviceWorkers:'block',viewport:{width:1280,height:900}}),p=await ctx.newPage(),hits=[],errs=[],bad=[];p.setDefaultTimeout(45000);p.on('pageerror',e=>errs.push(e.message));ctx.on('request',r=>{if(!r.url().startsWith(root+'/')||!['GET','HEAD'].includes(r.method()))bad.push(r.method())});
          const ids=["40000047","40006096"];await p.goto(root+'/collection/',{waitUntil:'domcontentloaded'});await p.locator('[data-stage1-category-grid] .category-card').first().waitFor();const cfg=await p.evaluate(async ids=>{const M=await import('/src/lib/item-media/switch1253-public-item-images.mjs');const review=o=>({...o,mediaPublic:true,rightsReview:'OPERATOR_ACCEPTED',receivingContact:'MANAGED_VERIFIED',takedown:'MANAGED_TESTED',managedHttps:'MANAGED_VERIFIED',attribution:'EIGHT_LOCALES_REVIEWED',oldUrlAndCache:'MANAGED_TESTED',rollback:'MANAGED_TESTED',operatorReceiptSha256:'c'.repeat(64),items:{}});
          const fields=['originalNativeStreamSha256','sourcePngSha256','webpSha256','rightsStatus','publicationDecision','visibility'];
          function bind(m,r){for(const [id,e] of Object.entries(m.items)){e.publicationDecision='OWNER_SCOPED_PUBLICATION_ACCEPTED';r.items[id]=Object.fromEntries(fields.map(k=>[k,e[k]]))}const {mediaPublic,items,...p}=r;m.publication={gate:'MEDIA_PUBLIC_SCOPED_ON',...p};return m}
          const sr=review(M.STEAM1253_REVIEWED_RELEASE),wr=review(M.SWITCH1253_REVIEWED_RELEASE),wm=M.prepareSwitch1253ItemImageManifest();wm.items['40006096']={...wm.items['40000047'],...M.SWITCH1253_NATIVE_PINS['40006096']};bind(wm,wr);
          const urlFor=id=>{const p=M.STEAM1253_NATIVE_PINS[id];return '/ddv/item-images/'+M.STEAM1253_ITEM_IMAGE_VARIANT+'/'+p.webpSha256.slice(0,2)+'/'+p.webpSha256+'.webp'};
          
          const paths=Object.fromEntries(ids.map(id=>[id,urlFor(id)]));const cv=document.createElement('canvas');cv.width=cv.height=160;const g=cv.getContext('2d');g.fillStyle='#6376aa';g.fillRect(0,0,160,160);return {paths,swatch:cv.toDataURL('image/webp').split(',')[1]};},ids);
          await ctx.route('**/ddv/item-images/**',r=>{const path=new URL(r.request().url()).pathname;hits.push(path);return Object.values(cfg.paths).includes(path)?r.fulfill({status:200,contentType:'image/webp',body:Buffer.from(cfg.swatch,'base64')}):r.fulfill({status:404,body:'denied'})});
          async function inject(id,withdraw=false){await p.evaluate(async({id,withdraw})=>{const M=await import('/src/lib/item-media/switch1253-public-item-images.mjs');const review=o=>({...o,mediaPublic:true,rightsReview:'OPERATOR_ACCEPTED',receivingContact:'MANAGED_VERIFIED',takedown:'MANAGED_TESTED',managedHttps:'MANAGED_VERIFIED',attribution:'EIGHT_LOCALES_REVIEWED',oldUrlAndCache:'MANAGED_TESTED',rollback:'MANAGED_TESTED',operatorReceiptSha256:'c'.repeat(64),items:{}});
          const fields=['originalNativeStreamSha256','sourcePngSha256','webpSha256','rightsStatus','publicationDecision','visibility'];
          function bind(m,r){for(const [id,e] of Object.entries(m.items)){e.publicationDecision='OWNER_SCOPED_PUBLICATION_ACCEPTED';r.items[id]=Object.fromEntries(fields.map(k=>[k,e[k]]))}const {mediaPublic,items,...p}=r;m.publication={gate:'MEDIA_PUBLIC_SCOPED_ON',...p};return m}
          const sr=review(M.STEAM1253_REVIEWED_RELEASE),wr=review(M.SWITCH1253_REVIEWED_RELEASE),wm=M.prepareSwitch1253ItemImageManifest();wm.items['40006096']={...wm.items['40000047'],...M.SWITCH1253_NATIVE_PINS['40006096']};bind(wm,wr);
          const urlFor=id=>{const p=M.STEAM1253_NATIVE_PINS[id];return '/ddv/item-images/'+M.STEAM1253_ITEM_IMAGE_VARIANT+'/'+p.webpSha256.slice(0,2)+'/'+p.webpSha256+'.webp'};
          
          const m=bind(M.prepareSteam1253ItemImageManifest([id]),sr);m.switch=wm;if(withdraw)delete m.items[id];const c=M.validateSteam1253ItemImageCatalog(m,sr,wr);M.switch1253PublicItemImageSource.set({status:'VERIFIED',catalog:c,reason:''});},{id,withdraw});}
          async function rendered(id,scope){const selector=scope+' [data-item-thumb-id="'+id+'"]';const t=p.locator(selector).first();await t.waitFor();await inject(id);await t.scrollIntoViewIfNeeded();await t.locator('img').waitFor();assert.equal(await t.locator('img').getAttribute('src'),cfg.paths[id]);await p.waitForFunction(s=>{const el=document.querySelector(s);return el?.complete&&el.naturalWidth===160&&el.naturalHeight===160},selector+' img');}
          for(const id of ids){await p.goto(root+'/collection/',{waitUntil:'domcontentloaded'});await p.locator('[data-stage1-category-grid] .category-card').first().waitFor();await p.locator('[data-stage1-search]').fill(id);await p.locator('[data-stage1-search-groups] [data-item-thumb-id="'+id+'"]').first().waitFor();assert.equal(await p.locator('[data-item-thumb-id="'+id+'"] img').count(),0);await rendered(id,'[data-stage1-search-groups]');await p.locator('[data-stage1-search-groups] .item-card').first().click();await rendered(id,'[data-stage1-item-info]');await p.locator('[data-stage1-item-info] .info-actions > a').click();await p.locator('[data-shared-discovery="READY"]').waitFor();await rendered(id,'[data-shared-entity-detail]');await inject(id,true);await p.waitForFunction(id=>!document.querySelector('[data-item-thumb-id="'+id+'"] img'),id);
          await p.goto(root+'/explore/',{waitUntil:'domcontentloaded'});await p.locator('.grid .card').first().waitFor();await p.locator('.controls input[type="search"]').fill(id);await rendered(id,'.grid');console.log('QA706_REAL_CHROME_ID',id,'4_CONSUMERS_WITHDRAW_PASS');}
          assert.ok(ids.every(id=>hits.includes(cfg.paths[id])));assert.ok(hits.every(x=>Object.values(cfg.paths).includes(x)));assert.deepEqual(errs,[]);assert.deepEqual(bad,[]);console.log('QA706_REAL_CHROME_2_SAMPLES_ALL_PASS');await ctx.close();
          }finally{await browser.close()}
          JS

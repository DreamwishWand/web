name: 05 QR-C PR1058 independent Storage scope
on:
  pull_request:
    paths:
      - 'crates/ddv-save-core/tests/qa_pr1058_storage_scope.rs'
      - '.github/workflows/05qrc-pr1058-storage-scope.yml'
permissions:
  contents: read
jobs:
  independent:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
          targets: wasm32-unknown-unknown
      - name: Fixed Source original2 and exact QA-only adds
        run: |
          git merge-base --is-ancestor e4594eef302a182770405740f1d60f283cdaa21e HEAD
          test "$(git diff --name-only e4594eef302a182770405740f1d60f283cdaa21e HEAD | wc -l)" -eq 2
          test "$(git diff --diff-filter=A --name-only e4594eef302a182770405740f1d60f283cdaa21e HEAD | wc -l)" -eq 2
          test "$(git rev-parse HEAD:crates/ddv-save-core/src/saved_diffgrids_index.rs)" = c623d468e70b68703b362ebfad41f986e6036e6e
          test "$(git rev-parse HEAD:crates/ddv-save-core/examples/wand-private-storage-read.rs)" = 3631e6f6c559bcf5922c51103fa8da3b7f9616b6
      - name: Native independent scope, close race and raw witnesses
        run: |
          cargo generate-lockfile --manifest-path crates/ddv-save-core/Cargo.toml
          echo 'e58486d673df79bfe7e72b80449e39389e57010fe4051edcdcff9b53c2da898c  crates/ddv-save-core/Cargo.lock' | sha256sum -c -
          cargo test --locked --manifest-path crates/ddv-save-core/Cargo.toml --no-default-features --features private-native-v1 --test qa_pr1058_storage_scope -- --nocapture
          cargo test --locked --manifest-path crates/ddv-save-core/Cargo.toml --no-default-features --features private-native-v1,semantic-writer-dev --test qa_pr1058_storage_scope -- --nocapture
      - name: Public and DEV WASM feature isolation
        run: |
          cargo check --locked --manifest-path crates/ddv-save-core/Cargo.toml --target wasm32-unknown-unknown --no-default-features --features worker-wasm,indexed-read
          cargo check --locked --manifest-path crates/ddv-save-core/Cargo.toml --target wasm32-unknown-unknown --no-default-features --features worker-wasm,indexed-read,semantic-writer-dev

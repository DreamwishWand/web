name: QA ONLY 04 QR-W PR2243 shared Disney owner image policy signed gate L2 NEVER MERGE
on:
  pull_request:
    paths:
      - '.github/workflows/qa-qrw-pr2243-owner-image-common-policy-l2.yml'
permissions:
  contents: read
jobs:
  actual-steam-switch-shared-media-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 04qrw/pr2243-89bd-common-image-owner-policy-l2
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pin 3 original product Source and 2 independent QA-only exact GitBlobs and modes
        shell: bash
        run: |
          set -euo pipefail
          base=f256f59b60f8c59c989e6a44ab9675ba5fc06a2c
          source=89bd8c2183394916b0fd448c3cb2b2038b3370df
          git merge-base --is-ancestor "$base" HEAD
          test "$(git rev-parse "$base:src/lib/item-media/switch1253-public-item-images.mjs")" = 73f15d221cede4ce2c195a48e57321a7293ab501
          test "$(git rev-parse "$base:.github/workflows/web-shared-catalog-detail.yml")" = 969b5ecf5f5967e9e16f3357d9bf9877f4d8a0ba
          test "$(git rev-parse 'HEAD:src/lib/item-media/switch1253-public-item-images.mjs')" = 3b884a71ecf49b169565e2c1e24873061a818059
          test "$(git rev-parse 'HEAD:.github/workflows/web-shared-catalog-detail.yml')" = e358be842eb4ff0aa798828059b4055fa799339f
          test "$(git rev-parse 'HEAD:tests/web-shared-item-image-owner-policy-gate.test.mjs')" = 3da3210587497b3fcbb7c0dc176498899b39c7a4
          test "$(git rev-parse 'HEAD:tests/qa-qrw-pr2243-owner-image-common-signed-policy-l2.test.mjs')" = b7a889b80c7c5f3cecb9c3ac7a5459bef38d39b9
          for f in .github/workflows/web-shared-catalog-detail.yml src/lib/item-media/switch1253-public-item-images.mjs tests/web-shared-item-image-owner-policy-gate.test.mjs tests/qa-qrw-pr2243-owner-image-common-signed-policy-l2.test.mjs .github/workflows/qa-qrw-pr2243-owner-image-common-policy-l2.yml; do
            test "$(git ls-tree HEAD "$f" | awk '{print $1}')" = 100644
          done
          printf '%s\n' .github/workflows/web-shared-catalog-detail.yml src/lib/item-media/switch1253-public-item-images.mjs tests/web-shared-item-image-owner-policy-gate.test.mjs | LC_ALL=C sort >/tmp/source
          printf '%s\n' .github/workflows/qa-qrw-pr2243-owner-image-common-policy-l2.yml tests/qa-qrw-pr2243-owner-image-common-signed-policy-l2.test.mjs | LC_ALL=C sort >/tmp/qa
          git diff --name-only "$base" "$source" | LC_ALL=C sort | diff -u /tmp/source -
          git diff --name-only "$source" HEAD | LC_ALL=C sort | diff -u /tmp/qa -
          git diff --quiet "$source" HEAD -- src/ scripts/ ops/ crates/ static/ package-lock.json
          echo QRW2243_ORIGINAL3_QAONLY2_SOURCE_PINS_PASS
      - name: Install original Svelte store dependency for actual product validator imports
        run: npm ci --no-audit --no-fund
      - name: Execute changed-only common-owner-policy vs forged Signed Media consumer gate
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/qa-qrw-pr2243-owner-image-common-signed-policy-l2.test.mjs tests/web-shared-item-image-owner-policy-gate.test.mjs
          echo QRW2243_ACTUAL_STEAM_SWITCH_OWNER_COMMON_POLICY_DENIAL_L2_PASS

name: 04 QR-W PR2383 Steam1261 private native ItemID IconGUID provenance L2 QA ONLY NEVER MERGE
on:
  pull_request:
    paths:
      - '.github/workflows/qa-qrw-pr2383-steam1261-source-provenance-l2.yml'
permissions:
  contents: read
jobs:
  exact-original-synthetic-source-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 04qrw/pr2383-29e3-steam1261-source-provenance-l2
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact original three Source leaves, independent QA2 and no release mutation
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY_ID" = 1371485649
          base=f420bbe72fbc3374f0a3867403c660873ce5f06a
          source=29e39fd9ace94963db5fc437b15212fa65e29b0d
          test "$(git merge-base "$base" "$source")" = "$base"
          test "$(git merge-base "$source" HEAD)" = "$source"
          printf '%s\n' scripts/asset-research/01d-steam-native-icon-delta.py tests/01d-steam-native-icon-delta.test.py tests/01d-steam-native-icon-delta.test.mjs | LC_ALL=C sort >/tmp/qrw2383-src3
          git diff --name-only "$base" "$source" | LC_ALL=C sort | diff -u /tmp/qrw2383-src3 -
          printf '%s\n' .github/workflows/qa-qrw-pr2383-steam1261-source-provenance-l2.yml tests/qa-qrw-pr2383-steam1261-source-provenance-l2.test.py | LC_ALL=C sort >/tmp/qrw2383-qa2
          git diff --name-only "$source" HEAD | LC_ALL=C sort | diff -u /tmp/qrw2383-qa2 -
          for f in $(cat /tmp/qrw2383-src3) $(cat /tmp/qrw2383-qa2); do
            test "$(git ls-tree HEAD -- "$f" | awk '{print $1}')" = 100644
          done
          test "$(git rev-parse "$base":scripts/asset-research/01d-steam-native-icon-delta.py)" = d121bcd5d0dc6a35d03d0b3aab270f3efbe4efaa
          test "$(git rev-parse "$base":tests/01d-steam-native-icon-delta.test.py)" = aefb3502ec17fec1e4e79db5611e6407a6b5e602
          test "$(git rev-parse "$base":tests/01d-steam-native-icon-delta.test.mjs)" = 4333ce6404eb8341693addf1fa4e9d3b2d3e06a5
          test "$(git rev-parse HEAD:scripts/asset-research/01d-steam-native-icon-delta.py)" = b95f5e25bbf45dfad0a6b6c0a423927718928776
          test "$(git rev-parse HEAD:tests/01d-steam-native-icon-delta.test.py)" = 447b388e25316468d690fafebc65765825178819
          test "$(git rev-parse HEAD:tests/01d-steam-native-icon-delta.test.mjs)" = 8eadf9a6f298b1458d5037c195fc39700076c8b9
          test "$(git rev-parse HEAD:tests/qa-qrw-pr2383-steam1261-source-provenance-l2.test.py)" = f3184b910f5f011a89a73b704c6b55333c65da47
          git diff --quiet "$source" HEAD -- src scripts static ops crates package.json package-lock.json
          test -z "$(git ls-files '*.p1g' '*.png' '*.webp')"
          echo QRW2383_SOURCE3_QA2_GITBLOB_MODE_NO_PRIVATE_ASSETS_PASS
      - name: Independent synthetic opt-in/source SHA/CLI artifact/rights fail closed
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/qa-qrw-pr2383-steam1261-source-provenance-l2.test.py
          echo QRW2383_STEAM1261_SOURCE_ONLY_PROVENANCE_6TEST_PASS

name: 05 QR-C Steam626 Makeup corrected physical saved-shape generated ABI L2 (QA ONLY NEVER MERGE)
on:
  pull_request:
    paths:
      - '.github/workflows/05qrc-steam-makeup-realshape-generated-abi-l2.yml'
      - 'tests/qa/qrc1953-steam-makeup-realshape-generated.cjs'
      - 'crates/ddv-save-core/src/product_makeup_color1.rs'
permissions:
  contents: read
jobs:
  qrc1953-generated-makeup:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CARGO_TARGET_DIR: /tmp/wand-qrc1953-cargo-target
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Exact fixed Source and QA-only delta
        run: |
          set -euo pipefail
          git cat-file -e 0d3ee41f74488157e0d87c4b1cd0e67a426e3987^{commit}
          test "$(git merge-base 0d3ee41f74488157e0d87c4b1cd0e67a426e3987 HEAD)" = 0d3ee41f74488157e0d87c4b1cd0e67a426e3987
          git diff --name-only 0d3ee41f74488157e0d87c4b1cd0e67a426e3987 HEAD | LC_ALL=C sort >/tmp/qrc1953-actual
          printf '%s\n' '.github/workflows/05qrc-steam-makeup-realshape-generated-abi-l2.yml' 'crates/ddv-save-core/src/product_makeup_color1.rs' 'tests/qa/qrc1953-steam-makeup-realshape-generated.cjs' | LC_ALL=C sort >/tmp/qrc1953-expected
          diff -u /tmp/qrc1953-expected /tmp/qrc1953-actual
          git diff --exit-code 0d3ee41f74488157e0d87c4b1cd0e67a426e3987 HEAD -- crates/ddv-save-core/Cargo.toml crates/ddv-save-core/src/wasm_steam626_makeup_color1.rs crates/ddv-save-core/src/wasm_worker.rs crates/ddv-save-core/src/worker_session.rs crates/ddv-save-core/src/worker_steam626_makeup_color1.rs
          echo QRC1953_FIXED_SOURCE_QA_ONLY_BOUNDARY_PASS
      - name: Actual generated opt-in Steam626 Makeup ABI synthetic scoped test
        run: |
          set -euo pipefail
          cargo generate-lockfile --manifest-path crates/ddv-save-core/Cargo.toml
          sha256sum crates/ddv-save-core/Cargo.lock >/tmp/qrc1953-lock.sha
          cargo test --locked --manifest-path crates/ddv-save-core/Cargo.toml --features product-steam626-makeup-color1-scoped --lib qa1953_emit_corrected_realshape_generated_fixture -- --ignored --nocapture
          test -s /tmp/qrc1953-makeup-source.json
          cargo install wasm-bindgen-cli --version 0.2.105 --locked --root /tmp/wand-qrc1953-bindgen
          for mode in off own mixed; do
            case "$mode" in
              off) features=worker-wasm,indexed-read ;;
              own) features=worker-wasm,product-steam626-makeup-color1-scoped ;;
              mixed) features=worker-wasm,product-steam626-makeup-color1-scoped,product-steam626-hair-scoped ;;
            esac
            cargo build --locked --manifest-path crates/ddv-save-core/Cargo.toml --release --target wasm32-unknown-unknown --no-default-features --features "$features"
            /tmp/wand-qrc1953-bindgen/bin/wasm-bindgen "$CARGO_TARGET_DIR/wasm32-unknown-unknown/release/ddv_save_core.wasm" --out-dir "/tmp/qrc1953-$mode" --target nodejs --no-typescript
          done
          sha256sum -c /tmp/qrc1953-lock.sha
          node --check tests/qa/qrc1953-steam-makeup-realshape-generated.cjs
          node tests/qa/qrc1953-steam-makeup-realshape-generated.cjs

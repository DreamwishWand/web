name: 04 QR PR381 Source159 independent ES256 four Workspace SQL OFF
on:
  push:
    branches: [qa/pr381-source159-four-workspace-20261104]
  pull_request:
    branches: [comm/w-comm-006-source159-workspace-four-rpc-off-20261104]
permissions:
  contents: read
jobs:
  qr159:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      DDVRE_E2_LOCAL_DISPOSABLE: APPROVED
      DATABASE_URL: ''
      SUPABASE_ACCESS_TOKEN: ''
      SUPABASE_PROJECT_ID: ''
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Exact source159 and only two QA paths; legacy migration SHA freezes
        shell: bash
        run: |
          set -euo pipefail
          SRC=2d1d25c3fc784578a7bb8e007f48d0f503c4eb81
          git merge-base --is-ancestor "$SRC" HEAD
          git diff --name-only "$SRC" HEAD | sort >/tmp/qr159-actual
          printf '%s\n' .github/workflows/qr-pr381-source159-independent.yml tests/qr-pr381-source159-workspace-independent.py | sort >/tmp/qr159-expected
          diff -u /tmp/qr159-expected /tmp/qr159-actual
          test -z "$(git diff --name-only "$SRC" HEAD -- supabase src static docs)"
          test "$(find supabase/migrations -name '*.sql' | wc -l)" -eq 159
          test "$(git hash-object supabase/migrations/20261102010000_community_source155_verified_first_account_bootstrap.sql)" = 115f2c0f7224984acd8830cfc606af8c6a1bf3af
          test "$(git hash-object supabase/migrations/20261103010000_community_source156_signed_gallery_r16_atomic_writer.sql)" = 3000d66c193b996e4ece785deaf5180955ec3bc6
          test "$(git hash-object supabase/migrations/20261103020000_community_source157_legacy_comments_v2_service_execute_off.sql)" = b9c44a501189857dff9fc6446dea21717d58b785
          test "$(git hash-object supabase/migrations/20261103030000_community_source158_r15_gallery_pinned_service_execute_off.sql)" = 033920ee79a3dd07b32854f0bbfb3b225167f3e2
          test "$(git hash-object supabase/migrations/20261104010000_community_source159_workspace_identity_legacy_service_execute_off.sql)" = 6bf78322e70406272125f245fcd525feb9347652
          test "$(git hash-object supabase/functions/community-command/index.ts)" = ad8b0bb6e74d7d8ae0ee1a148b6749feadbcf974
          test -z "$DATABASE_URL" && test -z "$SUPABASE_ACCESS_TOKEN" && test -z "$SUPABASE_PROJECT_ID"
          python3 -m py_compile tests/qr-pr381-source159-workspace-independent.py
          echo QR_159_FROZEN_SOURCE159_AND_MIGRATION_154_158_PASS
      - uses: supabase/setup-cli@v1
        with: {version: 2.109.0}
      - name: Independent genuine local-only ES256 issuer
        shell: bash
        run: |
          set -euo pipefail
          printf '\n[auth]\nsigning_keys_path = "./signing_keys.json"\n' >> supabase/config.toml
          printf '[]\n' > supabase/signing_keys.json
          supabase gen signing-key --algorithm ES256 --yes >/tmp/qr159-signer.log 2>&1
      - name: Disposable FULL159 migrations and clean reset
        shell: bash
        run: |
          set -euo pipefail
          printf 'project_id = "ddvre_qr159_independent_20261104"\n' | cat - supabase/config.toml >/tmp/qr159-config
          mv /tmp/qr159-config supabase/config.toml
          printf 'COMMUNITY_MEDIA_BUCKET=ddvre-qr159-local-media\nWEP_PRESET_ARTIFACT_BUCKET=ddvre-qr159-local-preset\n' > supabase/functions/.env
          timeout 1800s supabase start >/tmp/qr159-start.log 2>&1 || {
            echo QR_159_START_FAIL
            tail -n 25 /tmp/qr159-start.log | sed -E 's/(token|secret|key)[=:][^ ]+/\1=[REDACTED]/Ig'; exit 1;
          }
          timeout 900s supabase db reset --no-seed >/tmp/qr159-reset.log 2>&1 || {
            echo QR_159_RESET_FAIL
            tail -n 25 /tmp/qr159-reset.log | sed -E 's/(token|secret|key)[=:][^ ]+/\1=[REDACTED]/Ig'; exit 1;
          }
          echo QR_159_DISPOSABLE_FULL159_RESET_PASS
      - run: python3 -m pip install --quiet 'psycopg[binary]==3.2.10'
      - name: Independent live409 revoked401 4 RPC 3-role SQL42501 2PG replay rollback
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/qr-pr381-source159-workspace-independent.py | tee /tmp/qr159-independent.log
          for marker in \
            QR_159_FOUR_RPC_THREE_ROLE_ACL_SIGNED_DELETE_READ_R16_PRESERVED_PASS \
            QR_159_A2_FOUR_EDGE409_TWELVE_SQL42501_DB_SNAPSHOT_UNCHANGED_PASS \
            QR_159_REVOKED_A1_OLD_REFRESHED_401_SIBLING_200_TWO_PG_REPLAY_DB_UNCHANGED_PASS \
            QR_159_TWO_PG_GRANT_ROLLBACK_FOUR_WRITERS_STILL_OFF_PASS \
            QR_159_INDEPENDENT_ES256_FULL159_SOURCE_ONLY_TARGETED_PASS; do
            grep -q "$marker" /tmp/qr159-independent.log
          done
      - name: Dispose isolated signer/SQL/source secrets
        if: always()
        shell: bash
        run: |
          supabase stop --no-backup >/dev/null 2>&1 || true
          rm -f supabase/functions/.env supabase/signing_keys.json /tmp/qr159-*
          echo QR_159_EPHEMERAL_CLEANUP_ATTEMPTED

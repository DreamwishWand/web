name: QA ONLY PR1911 FRP624 exact7 Web L2 (never merge)
on:
  pull_request:
    paths:
      - '.github/workflows/qa-qrw-pr1911-frp624-web-l2.yml'
permissions:
  contents: read
jobs:
  frp624-actual:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CARGO_TARGET_DIR: /tmp/qrw1911-rust-target
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2349b51ac7d59d36f6ff21418de3ee86ea3afcdf
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

          test "$(git merge-base 753b50252880cb96b4b9019cbf7cee149abdc132 HEAD)" = '753b50252880cb96b4b9019cbf7cee149abdc132'
          test "$(git diff --name-only 753b50252880cb96b4b9019cbf7cee149abdc132 HEAD | wc -l)" = 21

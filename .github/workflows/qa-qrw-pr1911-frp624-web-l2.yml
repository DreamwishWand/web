          cmp tests/qa-op/ddv_save_core_bg.wasm static/qa-op/ddv_save_core_bg.wasm
          sha256sum -c /tmp/qrw1911-lock.sha
          git diff --exit-code -- src/lib tests/helpers/p1g-fixture.mjs

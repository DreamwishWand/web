name: 04 QR-S ACT1331 RM01 foreign closure6 (QA ONLY)
on:
  pull_request:
    paths:
      - '.github/workflows/04qrs-act1331-rm01-closure6.yml'
permissions:
  contents: read
jobs:
  focus:
    strategy:
      fail-fast: false
      matrix:
        scope:
          - '["collection","2936213ee9b2ae7b3579788af557692bdb0183e2","d67f8b8a1cc55250b94e9e33ca49dec7d860ec97","seal-scoped-collection-private","product-scoped-collection-release","SCOPED_COLLECTION","inspectScopedCollectionSubjects","f4eae0a1c49ba66790a4a12719c6f7b0c21a6b52","3bbeb6dd0f7a6f86da67ac0619c61b798dd0c74e",null]'
          - '["switch-chest","2936213ee9b2ae7b3579788af557692bdb0183e2","d67f8b8a1cc55250b94e9e33ca49dec7d860ec97","seal-scoped-switch-chest-private","product-scoped-switch-chest-release","SCOPED_SWITCH_CHEST","inspectScopedSwitchChestSubjects","6c8dfc4afea309eac4af94da778b01dde43b3f1c","11672ae569e2a64a58e997bf22b93ae2c337e681",null]'
          - '["steam-chest","c2621b86344f41be20811dfb0d00e9e4d8d67497","08407a82238686526ac89422046233e0efe0ca02","seal-scoped-steam-chest-private","product-scoped-steam-chest-release","SCOPED_STEAM_CHEST","inspectScopedSteamChestSubjects","f0d27044af7edcbd9e614f23a90da1e9deb4a023","7456a905b51f541993b6e26e298527fac00928c3",null]'
          - '["catalog0","99d20f9499b480fc95707dc77be54c40c4c258ac","b5ada239f4eb5fa37cbdf74402059339c2f11042","seal-scoped-switch-catalog0-private","product-scoped-switch-catalog0-release","SCOPED_SWITCH_CATALOG0","inspectScopedSwitchCatalog0Subjects","f663523f74f57d7b4b33f06c3733103e52368cc5","6fa4c43ffbd1f6dda942115678bae22a1830d321",null]'
          - '["backpack","1e0d1a58a96aa95875ce6ae15b0311dfba1e47df","b0f0e064da6ef60589b73b1752a6149720aa6775","scoped-backpack-proof","product-scoped-placement-release","BACKPACK","inspectBackpackSubjects","55a0cd725acc1c0116a902c3007025dd86e7de99","f56e1ee45ff19997ce0534dd3b713bf6c87309f9","BACKPACK"]'
          - '["wardrobe","2de43e68416e8cbfd71d221ae0306fa112e81d75","1eda09743b7de3777672ee8347295acd73ece51d","scoped-wardrobe-proof","product-scoped-placement-release","WARDROBE","inspectWardrobeSubjects","c84f36b88f88acbeac2adb76b4a9254f7ac985d5","c66a899e14291afc3b0e74bb9d3ff0c7f87e99e7","WARDROBE"]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ fromJSON(matrix.scope)[1] }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Independent old/new inspector and exact byte delta
        shell: bash
        env:
          SCOPE: ${{ matrix.scope }}
        run: |
          set -euo pipefail
          cat > qa-act1331.mjs <<'EOF'
          import assert from 'node:assert/strict';
          import {createHash} from 'node:crypto';
          import {execFileSync} from 'node:child_process';
          import {readFileSync,writeFileSync,unlinkSync} from 'node:fs';
          import {ACTIVE_RELEASE_TUPLE as tuple} from './src/lib/ddv/core/save/product-rust-wasm-release-trust.mjs';
          const [name,ref,parent,file,spec,prefix,fn,newBlob,oldBlob,dual]=JSON.parse(process.env.SCOPE);
          const p='scripts/readonly-release/'+file+'.mjs',oldPath='scripts/readonly-release/qa-old-'+file+'.mjs';
          const git=(...a)=>execFileSync('git',a,{encoding:'utf8'}).trim();
          assert.equal(git('rev-parse','HEAD'),ref);assert.equal(git('rev-parse','HEAD:'+p),newBlob);assert.equal(git('rev-parse',parent+':'+p),oldBlob);
          const old=execFileSync('git',['show',parent+':'+p],{encoding:'utf8'}),cur=readFileSync(p,'utf8'),delta='|(?:preview|stage)_switch626_rm01';
          assert.equal(cur.split(delta).length,2);assert.equal(cur.replace(delta,''),old);
          writeFileSync(oldPath,old,{flag:'wx'});
          try{
          const prev=(await import('./'+oldPath))[fn],next=(await import('./'+p))[fn],s=await import('./src/lib/ddv/core/save/'+spec+'.mjs');
          const scopes=dual?[s['STEAM_'+dual+'_RELEASE'],s['SWITCH_'+dual+'_RELEASE']]:[{prefix:'wand.scoped-'+(name==='catalog0'?'switch-catalog0':name),operation:s[prefix+'_RELEASE_OP'],methods:s[prefix+'_METHODS'],exports:s[prefix+'_WASM_EXPORTS'],features:s[prefix+'_FEATURES']}];
          const u=n=>{const a=[];do{let v=n&127;n>>>=7;a.push(v|(n?128:0))}while(n);return a};
          const str=s=>[...u(Buffer.byteLength(s)),...Buffer.from(s)],sec=(id,b)=>[id,...u(b.length),...b];
          const wasm=names=>{const es=names.flatMap(n=>[...str(n),n==='memory'?2:n==='__wbindgen_externrefs'?1:0,0]);return Buffer.from([0,97,115,109,1,0,0,0,...sec(1,[1,96,0,0]),...sec(3,[1,0]),...sec(4,[1,111,0,1]),...sec(5,[1,0,1]),...sec(7,[...u(names.length),...es]),...sec(10,[1,2,0,11])])};
          const sha=x=>createHash('sha256').update(x).digest('hex'),source='a'.repeat(40);
          let pos=0,oldAccepted=0,newDenied=0,extraDenied=0,oldGuard=0;
          for(const x of scopes){
           const w=wasm(x.exports);assert.equal(WebAssembly.Module.exports(new WebAssembly.Module(w)).length,x.exports.length);
           const clean=Buffer.from('export default class WorkerWasmSource {}');
           const make=(js=clean,mod=w)=>[Buffer.from(JSON.stringify({contract:x.prefix+'.runtime@1',operation:x.operation,source:{repository:tuple.repository,commit:source,cargoTomlSha256:'b'.repeat(64),cargoLockSha256:'e58486d673df79bfe7e72b80449e39389e57010fe4051edcdcff9b53c2da898c',cargoLockOrigin:'approved-repository-lock',wasmBindgen:'0.2.105',wasmTarget:'wasm32-unknown-unknown',profile:'release',features:x.features,defaultFeatures:false,toolchain:'rustc 1.99.1 (test)'},assets:{js:{path:'ddv_save_core.js',sizeBytes:js.length,sha256:sha(js)},wasm:{path:'ddv_save_core_bg.wasm',sizeBytes:mod.length,sha256:sha(mod)}},abi:{exportClass:'WorkerWasmSource',methods:x.methods,writerAuthorized:false,originalOverwriteAuthorized:false},release:{productConsumerEnabled:false,writerAuthorized:false,autoUpload:false,originalOverwriteAuthorized:false}})),js,mod];
           const run=(f,b)=>dual?f(x,b,source):f(b,source);
           const b=make();assert.deepEqual(run(prev,b),run(next,b));assert.equal(run(next,b).wasmSha256,sha(w));pos++;
           for(const t of ['preview_switch626_rm01','stage_switch626_rm01']){
            for(const js of [Buffer.from(t),Buffer.from('export class WorkerWasmSource { '+t+'(){} }')]){const z=make(js);assert.equal(run(prev,z).jsSha256,sha(js));oldAccepted++;assert.throws(()=>run(next,z));newDenied++}
            const z=make(clean,wasm([...x.exports,'workerwasmsource_'+t]));assert.throws(()=>run(prev,z));assert.throws(()=>run(next,z));extraDenied++;
           }
           for(const t of ['private_native','dev_stage','preview_steam626_sr03','stage_steam626_sr03']){const z=make(Buffer.from(t));assert.throws(()=>run(prev,z));assert.throws(()=>run(next,z));oldGuard++}
          }
          console.log('ACT1331_RM01_CLOSURE6_L2_PASS',JSON.stringify({name,pos,oldAccepted,newDenied,extraDenied,oldGuard,actualWasmModule:true,actualSignature:false}));
          }finally{unlinkSync(oldPath)}
          
          EOF
          node qa-act1331.mjs

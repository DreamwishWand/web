name: 04 QR PR195 Meal Getter and Ingredient New-Only Independent QA
on:
  pull_request:
    paths:
      - 'docs/qa/qr-pr195-meal-getter-ingredient-newonly-original-acceptance-20261027.md'
      - 'tests/qr-pr195-meal-getter-ingredient-newonly-independent.test.mjs'
      - '.github/workflows/qr-pr195-meal-getter-ingredient-independent.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  newonly:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      DATABASE_URL: ''
      SUPABASE_ACCESS_TOKEN: ''
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pin exact Owner's new evidence blob and QR203 accepted baseline source without rebuilding older tests
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          test -z "$DATABASE_URL" && test -z "$SUPABASE_ACCESS_TOKEN"
          test "$(git hash-object static/ddv/core/collection/v1.25/native-meal-getter-ingredient-selector-original-v125.json)" = 'c8dcf9d1375c60efd219530c24348804c5563447'
          test "$(git hash-object static/ddv/core/collection/v1.25/native-activity-meal-original-predicate-v125.json)" = 'd7a65dc4e6525e2efad6a82d65cc0589e1c66717'
      - name: Six independent new-only Meal static getter and Ingredient fail-closed contract cases
        run: node --test tests/qr-pr195-meal-getter-ingredient-newonly-independent.test.mjs
      - name: Preserve distinct provenance
        run: echo 'Original Switch native+raw protobuf SHA verified locally only; CI never accesses private game binary; Runtime ItemDB and CollectionSets UNKNOWN, all writers OFF'

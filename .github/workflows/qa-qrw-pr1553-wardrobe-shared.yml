            for(const other of [{allowSwitch626ChestSource:true},{allowSteam626ChestSource:true},{allowScopedAmountSource:true},{allowScopedCollectionSource:true},{allowCollectionCandidateSource:true},{placementScope:'comp03'},{placementScope:'vase'}]){
              const opts={allowSwitch626Catalog0Source:true,...other};

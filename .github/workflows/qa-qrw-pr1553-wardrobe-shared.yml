            const file=new File([bytes],'synthetic.p1g'),input={file,build:sw,originalSha256:meta.sha};
            const root=await navigator.storage.getDirectory();
            // Count only actual Rust constructor use, never substitute fake receipts.
            const factory=async()=>({WorkerWasmSource:class extends WorkerWasmSource{constructor(...a){super(...a);opens++}close(){if(failClose){failClose=false;throw Error('QA close failure before actual cleanup')}closes++;return super.close()}}});
            const noFactory=async()=>{throw Error('must not construct')};
            // ACT1212 new Wardrobe scope exclusively denies all existing scoped domains.
            for(const wardrobeScope of ['steam','switch'])for(const other of [{allowSwitch626ChestSource:true},{allowSteam626ChestSource:true},{allowScopedAmountSource:true},{allowScopedCollectionSource:true},{allowCollectionCandidateSource:true},{placementScope:'comp03'},{placementScope:'vase'},{allowSwitch626Catalog0Source:true},{backpackScope:'steam'},{backpackScope:'switch'}]){

name: 05 QR-C PR458 exact EndDate null mandatory W1 source witness
on:
  push:
    branches: [qa/05qr-c-pr458-enddate-null-sparse-newonly-20261105]
  pull_request:
    paths:
      - '.github/workflows/qa-05qr-c-pr458-enddate-null.yml'
      - 'crates/ddv-save-core/tests/qa_05qr_c_pr458_enddate_null_newonly.rs'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  frozen-source-null-witness:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Pin only original parent and repaired two-source EndDate paths
        run: |
          set -eu
          PARENT=a6ad9d32cb18a97e225a3e155a1fd3e67ecb7664
          SOURCE=df2d961e69fe32d91d819ab85ab287d5cf4d874e
          test "$(git merge-base "$PARENT" "$SOURCE")" = "$PARENT"
          test "$(git merge-base "$SOURCE" HEAD)" = "$SOURCE"
          test "$(git diff --name-only "$PARENT" "$SOURCE" | wc -l | tr -d ' ')" = 2
          test "$(git diff --name-only "$PARENT" "$SOURCE" | sort)" = "$(printf '%s\n' crates/ddv-save-core/src/trusted_read.rs crates/ddv-save-core/tests/w1_core_native_readset.rs | sort)"
          git diff --quiet "$SOURCE" HEAD -- src/ crates/ddv-save-core/src/ crates/ddv-save-core/tests/w1_core_native_readset.rs docs/ static/ supabase/
          test "$(git rev-parse HEAD:crates/ddv-save-core/src/trusted_read.rs)" = 1d8d847ac1f8ab34e81337a4909b55814e013933
          test "$(git rev-parse HEAD:crates/ddv-save-core/tests/w1_core_native_readset.rs)" = 2c7d27d2b610494c6c7dfa5076b1e5a570fe8293
          echo QA437_ACCEPTED_PARENT_REUSED_NO_RETEST
          echo PR458_EXACT_SOURCE_TWO_CHANGED_PATHS
          echo PRIVATE_ENCRYPTED_OWNER_P1G=NOT_RUN
          echo NATIVE_W1_V3=UNKNOWN
          echo PRODUCT_WRITER_EDITEDCOPY_APPLY_OVERWRITE=OFF
      - name: Independent five NEW exact lexical null, false, size and cross-source negatives
        run: cargo test --manifest-path crates/ddv-save-core/Cargo.toml --test qa_05qr_c_pr458_enddate_null_newonly -- --nocapture
      - name: Rust compile native
        run: cargo check --manifest-path crates/ddv-save-core/Cargo.toml
      - name: Product Rust export unchanged denied
        run: grep -Fq PRODUCT_ENCODE_COPY_NOT_AUTHORIZED crates/ddv-save-core/src/trusted_read.rs

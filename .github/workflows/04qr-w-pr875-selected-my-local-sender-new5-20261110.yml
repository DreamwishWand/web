name: "04 QR-W independent 08 WEB PR875 one-shot selected Scene sender new5"
on:
  push:
    branches: [qa/04qr-w-pr875-selected-my-local-sender-new5-20261110]
  pull_request:
    paths:
      - ".github/workflows/04qr-w-pr875-selected-my-local-sender-new5-20261110.yml"
      - "scripts/04qr-w-pr875-selected-my-local-sender-new5-20261110.mjs"
permissions:
  contents: read
jobs:
  actual-independent-selected-sender:
    runs-on: ubuntu-24.04
    timeout-minutes: 33
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm install --no-save --package-lock=false playwright-core@1.55.0
      - name: "Run real installed Chrome only in disposable synthetic Browser profile"
        shell: bash
        run: |
          set -euo pipefail
          test -z "${DDV_PRIVATE_SAVE_PATH:-}"
          test -z "${WEP_PRIVATE_P1G_PATH:-}"
          test -z "${P1G_PATH:-}"
          BIN="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || true)"
          test -n "$BIN"
          "$BIN" --version
          echo "CHROME_BIN=$BIN" >> "$GITHUB_ENV"
          BASE_PATH='' npm run dev -- --host 127.0.0.1 --port 4356 >/tmp/qrw875.log 2>&1 &
          for i in $(seq 1 75); do
            if curl -fsS http://127.0.0.1:4356/presets/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/qrw875.log
          exit 1
      - name: "Only 08 WEB new five changed scope independent Node and Chrome"
        env:
          QRW875_ORIGIN: http://127.0.0.1:4356
        run: node scripts/04qr-w-pr875-selected-my-local-sender-new5-20261110.mjs
      - name: "Read-only operation release Gate OFF"
        run: echo QRW875_QA_ONLY_NATIVE_APPLY_WRITER_CLOUD_PROVIDER_COMMUNITYPUBLIC_OFF

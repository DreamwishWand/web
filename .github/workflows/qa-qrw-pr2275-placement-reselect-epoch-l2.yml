name: QA ONLY 04 QR-W PR2275 Placement file reselect epoch barrier L2 NEVER MERGE
on:
  pull_request:
    paths:
      - '.github/workflows/qa-qrw-pr2275-placement-reselect-epoch-l2.yml'
permissions:
  contents: read
jobs:
  original-placement-svelte-file-reselect-closed-races:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 04qrw/pr2275-ec0-placement-reselect-epoch-barrier-l2
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned dependencies for original Svelte compiler
        run: npm ci --no-audit --no-fund
      - name: Source original exact2 GitBlobs and QA-only exact2
        shell: bash
        run: |
          set -euo pipefail
          base=9a5c72ebafe45987b762a8fcb6ecaa198e7a7fd9
          source=ec0ab13b3d7f3f5d739191fda7df7e4051ea54b4
          git merge-base --is-ancestor "$base" HEAD
          test "$(git rev-parse "$base:src/lib/dev/LocalPlacementEditorDev.svelte")" = 34d087c11e6bc30d36ac8f6d3f841c9ad57cd5a2
          test "$(git rev-parse 'HEAD:src/lib/dev/LocalPlacementEditorDev.svelte')" = 4d5c44eb8cc45dc6544dc6174c58c1abafc2294f
          if git cat-file -e "$base:tests/web-placement-file-reselect-close-barrier.test.mjs" 2>/dev/null; then exit 1; fi
          test "$(git rev-parse 'HEAD:tests/web-placement-file-reselect-close-barrier.test.mjs')" = 8c4503915d042c925c2fcd05f5e63ce56b630f09
          test "$(git rev-parse 'HEAD:tests/qa-qrw-pr2275-placement-file-reselect-epoch-race-l2.test.mjs')" = b3ff112a78fe98c24c220eba799206fee4b6a64f
          for f in src/lib/dev/LocalPlacementEditorDev.svelte tests/web-placement-file-reselect-close-barrier.test.mjs tests/qa-qrw-pr2275-placement-file-reselect-epoch-race-l2.test.mjs .github/workflows/qa-qrw-pr2275-placement-reselect-epoch-l2.yml; do
            test "$(git ls-tree HEAD "$f" | awk '{print $1}')" = 100644
          done
          printf '%s\n' src/lib/dev/LocalPlacementEditorDev.svelte tests/web-placement-file-reselect-close-barrier.test.mjs | LC_ALL=C sort >/tmp/source
          printf '%s\n' .github/workflows/qa-qrw-pr2275-placement-reselect-epoch-l2.yml tests/qa-qrw-pr2275-placement-file-reselect-epoch-race-l2.test.mjs | LC_ALL=C sort >/tmp/qa
          git diff --name-only "$base" "$source" | LC_ALL=C sort | diff -u /tmp/source -
          git diff --name-only "$source" HEAD | LC_ALL=C sort | diff -u /tmp/qa -
          git diff --quiet "$source" HEAD -- src/ scripts/ ops/ crates/ static/ package-lock.json
          echo QRW2275_SOURCE2_QAONLY2_IMMUTABLE_GIT_BLOBS_PASS
      - name: Run actual compiled Placement Svelte and original/independent event/close epoch tests
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/web-placement-file-reselect-close-barrier.test.mjs tests/qa-qrw-pr2275-placement-file-reselect-epoch-race-l2.test.mjs
          echo QRW2275_PLACEMENT_FILE_RESELECT_CLOSE_BARRIER_EPOCH_L2_PASS

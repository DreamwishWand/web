name: 05 QR-L Bamboo40700007 genuine Owner original Rust private read-only runner QA-ONLY
on:
  pull_request:
    paths:
      - '.github/workflows/05-qrl-act1599-bamboo-owner-private-rust-read-driver.yml'
permissions:
  contents: read
jobs:
  compile-isolated-real-owner-readonly-runner:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      QRL_BASE: 'd8fb979fc7719a79d8c5ac5efcf35e8fb4437419'
      QRL_SOURCE: 'e7d9f5c4fecdb12b7dd8800b7912606a7571e6db'
      QRL_PATH: '.github/workflows/05-qrl-act1599-bamboo-owner-private-rust-read-driver.yml'
      CARGO_TARGET_DIR: /tmp/qrl-bamboo-actual-rust-target
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify one QA-only file and immutable accepted Rust source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git diff --name-only "$QRL_BASE" HEAD | wc -l)" -eq 1
          git diff --name-only "$QRL_BASE" HEAD | grep -Fx "$QRL_PATH"
          test -z "$(git diff --name-only "$QRL_BASE" HEAD -- crates src static scripts)"
          git fetch --no-tags origin "$QRL_SOURCE"
          test "$(git rev-parse FETCH_HEAD)" = "$QRL_SOURCE"
          git worktree add --detach /tmp/qrl-bamboo-source "$QRL_SOURCE"
          test "$(git -C /tmp/qrl-bamboo-source rev-parse HEAD:crates/ddv-save-core/src/steam_bamboo_single_product_target.rs)" = 'a5aef59173ee99454f7f108af58fa7c46dac6f19'
          test "$(git -C /tmp/qrl-bamboo-source rev-parse HEAD:crates/ddv-save-core/src/sr03_product_target.rs)" = '6dd98b385ab0f263cc2eef4cb6e9f59461f31a5d'
          test "$(git -C /tmp/qrl-bamboo-source rev-parse HEAD:crates/ddv-save-core/src/sr03_installed_geometry.rs)" = '52ac23928c24bab83ba02bc9f44eaac8e91c076b'
          test "$(git -C /tmp/qrl-bamboo-source rev-parse HEAD:scripts/wasm-distribution/approved-Cargo.lock)" = 'b667b42cfef2032c2925be7b2aa9b7142bff4b52'
          test ! -e /tmp/qrl-bamboo-source/owner-original.json
      - name: Add no-secret test runner into disposable historical worktree only
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/qrl-bamboo-source
          cat >> crates/ddv-save-core/src/steam_bamboo_single_product_target.rs <<'RUST'
          // QRL QA-ONLY private Owner original Rust true target. This exists ONLY under /tmp on CI.
          // CI compiles, NEVER runs or receives the original, decoded JSON or official Codec.
          #[cfg(test)]
          mod qrl_private_owner_original_rust_readonly {
              use super::*;
              use sha2::{Digest,Sha256};
              #[test]
              fn qrl_owner_bamboo626_grid7_294_0_real_target() {
                  let path=std::env::var("WAND_QRL_OWNER_DECODED")
                      .expect("PRIVATE_ORIGINAL_PATH_REQUIRED_ONLY_IN_ISOLATED_OWNER_LAB");
                  let decoded=std::fs::read(&path).expect("PRIVATE_DECODED_READ_DENIED");
                  let digest=Sha256::digest(&decoded);
                  let actual:String=digest.iter().map(|b|format!("{b:02x}")).collect();
                  assert_eq!(actual,"cf6a264382f1d9eb69334fdf370755539443b8191978f2890a23da705e8863cc",
                      "ORIGINAL_DECODED_WITNESS_NOT_MATCHED");
                  let input_size=decoded.len();
                  let identity=crate::BuildIdentity{
                      platform:Platform::SteamWindows,
                      build_kind:BuildKind::SteamFullVersion,
                      build_id:EXACT_STEAM.to_owned(),
                      schema:626,
                      externally_attested:true,
                  };
                  let mut s=ProductSession::open_decoded_readonly(decoded.clone(),identity)
                      .expect("ORIGINAL_RUST_PRODUCT_SESSION_OPEN_FAILED");
                  s.worker_bound=true;
                  let before=s.receipt().expect("ORIGINAL_RUST_RECEIPT_FAILED");
                  let env=WorkerEnvelope{
                      contract:PRODUCT_WORKER_CONTRACT,
                      session_id:before.session_id,
                      expected_revision:before.revision,
                      expected_index_generation:before.index_generation,
                      expected_decoded_sha256:before.decoded_sha256,
                      action:WorkerAction::ReadDomain,
                  };
                  let minted=s.mint_steam626_bamboo_single_target(env,7,294,0)
                      .unwrap_or_else(|err|panic!("GENUINE_RUST_TARGET_DENIED_{}",err.0));
                  assert_eq!((minted.grid,minted.x,minted.y,minted.next,minted.stock),
                      (7,294,0,15949,9140),"GENUINE_RUST_TYPED_TARGET_CHANGED");
                  assert_eq!(s.receipt().unwrap(),before,"GENUINE_ORIGINAL_SESSION_MUTATED");
                  let denied=[
                      ("BAD_STAGE",s.mint_steam626_bamboo_single_target(
                          WorkerEnvelope{action:WorkerAction::Stage,..env},7,294,0).is_err()),
                      ("STALE_REV",s.mint_steam626_bamboo_single_target(
                          WorkerEnvelope{expected_revision:before.revision+1,..env},7,294,0).is_err()),
                      ("STALE_GENERATION",s.mint_steam626_bamboo_single_target(
                          WorkerEnvelope{expected_index_generation:before.index_generation+1,..env},7,294,0).is_err()),
                      ("BAD_SHA",s.mint_steam626_bamboo_single_target(
                          WorkerEnvelope{expected_decoded_sha256:[0;32],..env},7,294,0).is_err()),
                      ("BAD_SESSION",s.mint_steam626_bamboo_single_target(
                          WorkerEnvelope{session_id:[0;16],..env},7,294,0).is_err()),
                      ("ADJACENT_295",s.mint_steam626_bamboo_single_target(env,7,295,0).is_err()),
                      ("EDGE_392",s.mint_steam626_bamboo_single_target(env,7,392,0).is_err()),
                  ];
                  for(label,ok)in denied{assert!(ok,"OWNER_RUST_EXPECTED_DENIAL_{label}");}
                  let foreign=crate::BuildIdentity{
                      platform:Platform::Switch,
                      build_kind:BuildKind::SwitchBid,
                      build_id:"9A239D3DB569756D".to_owned(),
                      schema:626,
                      externally_attested:true,
                  };
                  if let Ok(mut v)=ProductSession::open_decoded_readonly(decoded,foreign){
                      v.worker_bound=true;let r=v.receipt().unwrap();
                      let foreign_env=WorkerEnvelope{
                          contract:PRODUCT_WORKER_CONTRACT,
                          session_id:r.session_id,expected_revision:r.revision,
                          expected_index_generation:r.index_generation,
                          expected_decoded_sha256:r.decoded_sha256,
                          action:WorkerAction::ReadDomain
                      };
                      assert!(v.mint_steam626_bamboo_single_target(foreign_env,7,294,0).is_err(),
                          "FOREIGN_PLATFORM_RUST_TARGET_GRANTED");
                  }
                  assert_eq!(s.receipt().unwrap(),before,"OWNER_RUST_SESSION_MUTATED_AFTER_NEGATIVES");
                  let raw_again=std::fs::read(&path).expect("OWNER_SOURCE_READBACK_DENIED");
                  let final_sha=Sha256::digest(&raw_again);
                  let final_hex:String=final_sha.iter().map(|b|format!("{b:02x}")).collect();
                  assert_eq!(actual,final_hex,"ORIGINAL_DECODED_BYTES_CHANGED");
                  assert_eq!(input_size,raw_again.len(),"ORIGINAL_DECODED_LENGTH_CHANGED");
                  println!("QRL_PRIVATE_OWNER_BAMBOO_REAL_RUST_READ_SCOPE_PASS {}",serde_json::json!({
                      "source":"PR2003_FIXED_HISTORICAL_ONLY",
                      "platform":"SteamWindows","schema":626,"grid":7,
                      "x":294,"y":0,"next":minted.next,"stock":minted.stock,
                      "decodedSha256":actual,
                      "negatives":8,"originalUnchanged":true,
                      "Stage":false,"Export":false,"publicWriter":false,"productV2":"NOT_RUN"
                  }));
              }
          }
          RUST
          cp scripts/wasm-distribution/approved-Cargo.lock crates/ddv-save-core/Cargo.lock
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
      - name: Build fixed Rust genuine Owner test binary but NEVER RUN in public CI
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/qrl-bamboo-source
          test -z "${WAND_QRL_OWNER_DECODED:-}"
          cargo test --locked --manifest-path crates/ddv-save-core/Cargo.toml \
            --lib --no-run --features product-steam626-sr03-scoped --message-format=json \
            > /tmp/qrl-bamboo-cargo-compiler-artifacts.jsonl
          python3 - <<'PY'
          import json,os,shutil
          from pathlib import Path
          records=Path('/tmp/qrl-bamboo-cargo-compiler-artifacts.jsonl').read_text().splitlines()
          candidates=[]
          all_test=[]
          for line in records:
            try: a=json.loads(line)
            except json.JSONDecodeError: continue
            if a.get('reason')=='compiler-artifact' and a.get('profile',{}).get('test'):
              all_test.append({'target':a.get('target',{}).get('name'),
                               'kind':a.get('target',{}).get('kind'),
                               'hasExecutable':bool(a.get('executable'))})
              if a.get('executable') and a.get('target',{}).get('name') in ('ddv_save_core','ddv-save-core'):
                candidates.append(a['executable'])
          assert len(candidates)==1,('NATIVE_TEST_BINARY_CENSUS',len(candidates),all_test)
          target=Path('/tmp/qrl-bamboo-artifact');target.mkdir(mode=0o700,exist_ok=False)
          executable=target/'qrl-bamboo-owner-real-rust-test'
          shutil.copy2(candidates[0],executable);executable.chmod(0o700)
          assert executable.is_file() and executable.stat().st_size>100000
          print('PRIVATE_BAMBOO_RUST_TEST_RUNNER_COMPILED_NO_OWNER_DATA',
                {'source':'e7d9f5c4fecdb12b7dd8800b7912606a7571e6db','binaryBytes':executable.stat().st_size,
                 'privateOriginalRead':'NOT_RUN','publicWriter':False})
          PY
          test ! -e /tmp/qrl-bamboo-source/owner-original.json
      - name: Create no-secret immutable Source receipt
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          b=Path('/tmp/qrl-bamboo-artifact/qrl-bamboo-owner-real-rust-test')
          rec={'contract':'wand.05qrl.bamboo40700007.private-rust-runner@1',
               'sourceHead':'e7d9f5c4fecdb12b7dd8800b7912606a7571e6db', 'sourceTargetBlob':'a5aef59173ee99454f7f108af58fa7c46dac6f19',
               'qaOnlyBranchHead':'${{ github.event.pull_request.head.sha }}',
               'sourceFeature':'product-steam626-sr03-scoped','rust':'1.99.1',
               'os':'ubuntu-24.04','realOwnerOriginal':'NOT_RUN',
               'binarySha256':hashlib.sha256(b.read_bytes()).hexdigest(),
               'signed':False,'pages':False,'writer':False,'currentMainIntegrated':False,
               'sourcePrivateDataInCI':False}
          (b.parent/'receipt.json').write_text(json.dumps(rec,indent=2)+'\n')
          print('QRL_OWNER_RUST_BINARY_CI_PROVENANCE_NO_REAL_SAVE',
                {'source':rec['sourceHead'],'binarySha256':rec['binarySha256'],
                 'realOwnerOriginal':rec['realOwnerOriginal']})
          PY
      - name: Upload unsigned private-execution-only test runner NEVER Merge/Pages
        uses: actions/upload-artifact@v4
        with:
          name: qrl-act1599-bamboo-private-native-rust-runner-UNSIGNED-NO-SAVE
          retention-days: 2
          if-no-files-found: error
          path: |
            /tmp/qrl-bamboo-artifact/qrl-bamboo-owner-real-rust-test
            /tmp/qrl-bamboo-artifact/receipt.json

name: 05 QR-C PR782 independent native Rust V1/V2 CAS and WASM isolation NEW_ONLY
on:
  pull_request:
    paths:
      - 'crates/ddv-save-core/tests/qa_05qrc_native_private_v2.rs'
      - 'tests/qa-05qrc-native-private-cli.test.mjs'
      - '.github/workflows/05qr-c-pr782-native-private-independent.yml'
  push:
    branches:
      - 'qa/05qrc-pr782-native-semantic-cas-c40a305-20261108'
permissions:
  contents: read
jobs:
  independent-native-v1-v2:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CARGO_TARGET_DIR: /tmp/wand-05qrc-pr782-synthetic-target
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Frozen Source PR782 exact 10 blobs + 3 QA-only paths; no other source changes
        shell: bash
        run: |
          set -euo pipefail
          source=c40a305ba835de366726d6d3288184c0c109a49c
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            qa_tip="$(git rev-parse HEAD^2)"
          else
            qa_tip="$(git rev-parse HEAD)"
          fi
          git merge-base --is-ancestor "$source" "$qa_tip"
          test "$(git rev-parse "$qa_tip":.github/workflows/01a-private-native-rust-v1.yml)" = 9a0d8fc6e05ef1eb0bb32e22ae8f778bb4b5b240
          test "$(git rev-parse "$qa_tip":crates/ddv-save-core/Cargo.toml)" = f61af649e46cb69db5419563f280219021b354f3
          test "$(git rev-parse "$qa_tip":crates/ddv-save-core/src/bin/wand-local-rust-v1.rs)" = e8e28a1bf681328b812650987b1f6a58291b9b31
          test "$(git rev-parse "$qa_tip":crates/ddv-save-core/src/bin/wand-local-rust-v2-noop.rs)" = b4120271204a3a139d652b54c23ee7e1025dc0ac
          test "$(git rev-parse "$qa_tip":crates/ddv-save-core/src/lib.rs)" = aeb34af3e8272e5d7fea5c42096a30d6fd461b43
          test "$(git rev-parse "$qa_tip":crates/ddv-save-core/src/private_native_v2.rs)" = b24a1e764a808b9854727c4eb0f3d6ccf52073f3
          test "$(git rev-parse "$qa_tip":crates/ddv-save-core/src/product_session.rs)" = 18442600f3b2b93512176a035e4c571649e0232e
          test "$(git rev-parse "$qa_tip":docs/core/01a-private-native-steam-rust-v1-v2-20261108.md)" = 2028eb106cc6fbbe1e677fc67f0be82881be6305
          test "$(git rev-parse "$qa_tip":tests/native-owner-rust-v1.test.mjs)" = d58976a2a4d17582ecc264d47d2ba5b8ecdc5f52
          test "$(git rev-parse "$qa_tip":tests/native-owner-rust-v2-noop.test.mjs)" = 9b0816c7ad54b2c5e3ade3de444b33de3ad718b8
          actual="$(git diff --name-only "$source" "$qa_tip" | sort)"
          expected="$(printf '%s\n' .github/workflows/05qr-c-pr782-native-private-independent.yml crates/ddv-save-core/tests/qa_05qrc_native_private_v2.rs tests/qa-05qrc-native-private-cli.test.mjs | sort)"
          test "$actual" = "$expected"
          node --check tests/qa-05qrc-native-private-cli.test.mjs
          test -z "$(git diff --name-only "$source" "$qa_tip" -- crates/ddv-save-core/src crates/ddv-save-core/Cargo.toml tools src)"
          ! git ls-files | grep -E 'STEAM_SAVE_OWNER_PRIVATE|OWNER_PRIVATE|\.p1g$'
      - name: Independent Rust ProductSession CAS / Undo Redo / forged scope 4 tests
        shell: bash
        run: |
          set -euo pipefail
          cargo test --manifest-path crates/ddv-save-core/Cargo.toml --features private-native-v2 --test qa_05qrc_native_private_v2 -- --nocapture
      - name: Build only original native Rust V1 and V2 semantic-noop executables
        shell: bash
        run: |
          set -euo pipefail
          cargo build --manifest-path crates/ddv-save-core/Cargo.toml --release --features private-native-v2 --bin wand-local-rust-v1 --bin wand-local-rust-v2-noop
          test -x "$CARGO_TARGET_DIR/release/wand-local-rust-v1"
          test -x "$CARGO_TARGET_DIR/release/wand-local-rust-v2-noop"
      - name: Independent PUBLIC SYNTHETIC native CLI plus fresh-process CAS/format negative suite
        shell: bash
        env:
          WAND_QRC_NATIVE_V1: /tmp/wand-05qrc-pr782-synthetic-target/release/wand-local-rust-v1
          WAND_QRC_NATIVE_V2: /tmp/wand-05qrc-pr782-synthetic-target/release/wand-local-rust-v2-noop
        run: |
          set -euo pipefail
          node --test tests/qa-05qrc-native-private-cli.test.mjs
      - name: Existing public Worker WASM feature remains compileable with native gates OFF
        shell: bash
        run: |
          set -euo pipefail
          cargo check --manifest-path crates/ddv-save-core/Cargo.toml --target wasm32-unknown-unknown --features worker-wasm,indexed-read --lib
      - name: Native private V1 and V2 features MUST fail closed when compiled into WASM
        shell: bash
        run: |
          set -euo pipefail
          for feature in private-native-v1 private-native-v2; do
            if cargo check --manifest-path crates/ddv-save-core/Cargo.toml --target wasm32-unknown-unknown --features "worker-wasm,$feature" --lib > /tmp/05qrc-wasm-native-forbidden.log 2>&1; then
              echo "UNSAFE_NATIVE_PRIVATE_FEATURE_ACCEPTED_IN_WASM: $feature"
              exit 1
            fi
            grep -F "$feature is native-only and cannot enter WASM" /tmp/05qrc-wasm-native-forbidden.log >/dev/null
          done
          rm -f /tmp/05qrc-wasm-native-forbidden.log
      - name: No private Save binary artifact or Writer / Cloud / Product authorization
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            qa_tip="$(git rev-parse HEAD^2)"
          else
            qa_tip="$(git rev-parse HEAD)"
          fi
          test "$(git diff --name-only c40a305ba835de366726d6d3288184c0c109a49c "$qa_tip" | wc -l)" -eq 3
          test -z "$(git ls-files | grep -E 'STEAM_SAVE_OWNER_PRIVATE|OWNER_PRIVATE|\.p1g
 || true)"
          test -f tools/owner-local-steam-v1/worker-core.mjs
          test -z "$(git diff --name-only c40a305ba835de366726d6d3288184c0c109a49c "$qa_tip" -- src tools crates/ddv-save-core/src)"

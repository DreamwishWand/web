name: QA ONLY ACT1153 Switch626 Catalog0 real local binding (never merge)
on:
  pull_request:
    paths:
      - '.github/workflows/qa-qrw-act1153-catalog0-local.yml'
permissions:
  contents: read
jobs:
  real-local:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_TARGET_DIR: /tmp/wand-qrw1490local-target
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f0ec3bc752e1e88202f90abd1de2f5b6367b17e3
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Fixed Web and accepted Core source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 'f0ec3bc752e1e88202f90abd1de2f5b6367b17e3'
          test "$(git rev-parse HEAD:src/lib/ddv/core/save/product-scoped-amount-transport.mjs)" = 0fa3c76eaa65dfd1b74eb88b026e5bc95a142469
          test "$(git rev-parse HEAD:src/lib/ddv/core/save/product-scoped-amount-local-adapter.mjs)" = 2a154988aee80802554ac7f313f5b8e3f81d6079
          test "$(git rev-parse HEAD:src/lib/ddv/core/save/product-wasm-read-owner.mjs)" = 26821c49628dbfa10288724ded9efd41412e5a74
          test "$(git rev-parse HEAD:src/lib/ddv/core/save/p1g-rust-worker-readonly-bridge.mjs)" = f152788281c9752b50c759df7885e01007e1c2fd
          test "$(git rev-parse HEAD:src/lib/ddv/core/save/local-encrypted-copy-store.mjs)" = 67f6579622e5d8903d3798d5921d2ea525980eda
          test "$(git rev-parse HEAD:src/lib/dev/local-scoped-edit-worker-port.mjs)" = c0f81cb0b6cda895714c83e5bbf765b86c34acf8
          test "$(git rev-parse HEAD:src/lib/dev/local-amount-workflow.mjs)" = 54a5dc90fb0b82ec51f1716089d4fd607eecceb9
          git cat-file -e c8dd2b3f838080abae00991ba93dcd67c683f6a4^{commit} || git fetch --no-tags origin c8dd2b3f838080abae00991ba93dcd67c683f6a4
          git worktree add --detach /tmp/wand-qrw1490local-core c8dd2b3f838080abae00991ba93dcd67c683f6a4
          test "$(git -C /tmp/wand-qrw1490local-core rev-parse HEAD)" = 'c8dd2b3f838080abae00991ba93dcd67c683f6a4'
          test "$(git -C /tmp/wand-qrw1490local-core rev-parse HEAD:crates/ddv-save-core/src/wasm_worker.rs)" = 14b489156c7209cf8c2b192df900cb5b98a8524b
          test "$(git -C /tmp/wand-qrw1490local-core rev-parse HEAD:crates/ddv-save-core/src/product_switch626_catalog0.rs)" = 8ded31e59787211547f0f21ca02eb31f04f54d09
          test "$(git -C /tmp/wand-qrw1490local-core rev-parse HEAD:crates/ddv-save-core/Cargo.toml)" = 0939c989984ff49aff466da35e427289758d8d4f
          cp tests/fixtures/ddv-save-core-accepted.Cargo.lock /tmp/wand-qrw1490local-core/crates/ddv-save-core/Cargo.lock
          echo 'e58486d673df79bfe7e72b80449e39389e57010fe4051edcdcff9b53c2da898c  /tmp/wand-qrw1490local-core/crates/ddv-save-core/Cargo.lock' | sha256sum -c -
      - name: Generate actual locked repaired Switch Catalog0 WASM
        run: |
          cargo build --locked --manifest-path /tmp/wand-qrw1490local-core/crates/ddv-save-core/Cargo.toml --release --target wasm32-unknown-unknown --no-default-features --features worker-wasm,product-amount-scoped
          cargo install wasm-bindgen-cli --version 0.2.105 --locked --root /tmp/wand-qrw1490local-tools
          mkdir -p tests/stage-e/pkg
          /tmp/wand-qrw1490local-tools/bin/wasm-bindgen "$CARGO_TARGET_DIR/wasm32-unknown-unknown/release/ddv_save_core.wasm" --out-dir tests/stage-e/pkg --target web --no-typescript
      - run: npm ci --no-audit --no-fund
      - run: npm install --no-save --package-lock=false playwright-core@1.55.0
      - name: Temporary synthetic fixture and actual browser worker (no tracked product route)
        run: |
          mkdir -p src/routes/test-qrw1490local static/qa-qrw1490local
          cat > tests/.qa-qrw1490local-fixture.mjs <<'NODE'
          import {readFileSync,writeFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          import {makeSyntheticP1gProfile} from './helpers/p1g-fixture.mjs';
          const item=40000076;
          const layout=readFileSync('/tmp/wand-qrw1490local-core/crates/ddv-save-core/data/steam626-amount-layout-reference.jsonl','utf8').trim().split('\n').slice(1).map(JSON.parse);
          const a=layout.find(x=>x[0].includes('AliceHouse'));
          const overlay=x=>({ID:19,GridDefaultLayoutPath:x[0],GridDefaultLayoutType:x[1],DefaultLayoutGridID:x[4][0][0],DefaultGridHashCode:-4,DefaultGridDataHashCode:6,ModifiedObjects:{},RemovedObjects:[]});
          const date='2024-02-29T23:59:59.123456789Z';
          const reps=[[2010000003,'ItemSpawning'],[2010200014,'FishSpawningInVillage'],[2010400001,'WildCropsSpawningInVillage'],[2010500008,'FlowerSpawningInVillage'],[2010600000,'FlowerDryingInVillage'],[2010700000,'ChooseVillageArea'],[2010800000,'MiningRockTurningSpecial'],[2010900000,'PendingFishUpgrade'],[2011000000,'TimeLostTreasureSpawning'],[2011100000,'ChooseItem'],[2011200000,'MakeCharacterEager'],[2011300000,'SnippetSpawning']];
          const event=(id,kind)=>({[kind]:{RecurringEventItemID:id,NextOccurrence:date,EndDate:null,...(kind==='ItemSpawning'?{LastOccurrence:null}:{}),...(kind==='ChooseVillageArea'?{ChosenVillageArea:'VillageAreaType_Meadow'}:{}),...(kind==='ChooseItem'?{ChosenItemID:30200001}:{}),...(kind==='SnippetSpawning'?{Tokens:0,Snippets:[]}: {})}});
          const filter=()=>({Data:{Type:'ItemType_ActivityItem',ActivityItemType:'ActivityItemType_Crop',Item:0,ItemList:[],AnyActivityItem:false}});
          const duty=id=>({State:'DutySlotState_OnGoing',DutyId:id,DifficultyLayer:0,ItemsUsed:[],StepData:{ItemFilter:filter()}});
          function doc(asset=a){return {GameInfo:{Version:626},ConditionalEventHistory:{ActiveEvents:{}},World:{GridCollection:{Grids:{},DiffGrids:{19:overlay(asset)}},MissionSlots:{},RecurringEvents:{1:event(...reps[0])},Villages:[]},Player:{ListInventories:{0:{ID:0,CompatibleItemType:'ItemType_Furniture',CompatibleFurnitureTypes:{List:['FurnitureItemType_Default']},Inventory:{[item]:{Amount:999,Marker:'ItemMarker_None',Unknown:'keep'}}}},ContainerInventories:{},BackpackOverflow:{Items:[]},AchievementsData:[],EvolveStatesProfile:{EvolveProgressState:{}},DutySlots:{0:{Slots:[duty(2110000038),duty(2110000161)]}},BattlePassStates:{Progress:{},FtueProgress:{TasksProgress:[],WeeklyTasksProgress:[]}}},Opaque:{keep:'x'.repeat(1100000),n:7}};}
          const crop=d=>d.Player.DutySlots[0].Slots[0].StepData.ItemFilter.Data,body=d=>d.World.RecurringEvents[1].ItemSpawning;
          const inactive=(k,v)=>({UseField:false,Random:false,ShowRandomCheckbox:false,[k]:v});
          function full(d){Object.assign(crop(d),{SubType:'',Set:0,Complexity:inactive('Complexity','Complexity_Lavish'),Mood:inactive('Mood','Mood_Calm'),Sturdiness:inactive('Sturdiness','Sturdiness_Strong'),Normality:inactive('Normality','Normality_Wondrous'),MinRarity:0,MaxRarity:0,FishLocation:inactive('VillageAreas',{AreaList:[]}),FishRarity:inactive('FishRarities',{FishRarities:[]}),Constraint:'',FishIncludeTrash:false,FishWeather:'',TagCondition:'TagFilterCondition_AllTags',Tags:[],CropType:'CropTypeCondition_Any',SeedType:'SeedTypeCondition_Any',FlowerRarity:'FlowerRarityCondition_Any',IngredientsType:[],MinMealStarRating:0,MinUnlockLevel:0,MaxUnlockLevel:0,MineralRoughness:'MineralRoughness_Any',EphemeralType:'EphemeralTypeCondition_Any',Profession:0,OnlySeedCrop:false});}
          const d=doc();full(d);Object.assign(crop(d),{CropType:'CropTypeCondition_Fruit',MaxUnlockLevel:100});
          const want=structuredClone(d);want.Player.ListInventories[0].Inventory[item].Amount=998;
          const b=makeSyntheticP1gProfile(d);
          writeFileSync('static/qa-qrw1490local/input.p1g',b);
          writeFileSync('static/qa-qrw1490local/meta.json',JSON.stringify({sha:createHash('sha256').update(b).digest('hex'),expected:want}));
          NODE
          node tests/.qa-qrw1490local-fixture.mjs
          cp tests/stage-e/pkg/ddv_save_core_bg.wasm static/qa-qrw1490local/
          cat > src/routes/test-qrw1490local/+page.svelte <<'SVELTE'
          <script>
          import {onMount} from 'svelte';
          onMount(()=>{
            const w=new Worker(new URL('./qa.worker.mjs',import.meta.url),{type:'module'});
            w.onmessage=e=>{window.__qrw1490local=e.data};
            w.onerror=e=>{window.__qrw1490local={error:e.message}};
            return ()=>w.terminate();
          });
          </script>
          <p>Isolated synthetic QA only</p>
          SVELTE
          cat > src/routes/test-qrw1490local/qa.worker.mjs <<'NODE'
          import init,{WorkerWasmSource} from '../../../tests/stage-e/pkg/ddv_save_core.js';
          import {createProductSwitch626Catalog0LocalAdapter} from '$lib/ddv/core/save/product-scoped-amount-local-adapter.mjs';
          const need=(v,k)=>{if(!v)throw Error(k)};
          const hash=async b=>Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',b)),x=>x.toString(16).padStart(2,'0')).join('');
          const sw={platform:'switch',buildKind:'switch-bid',buildId:'9A239D3DB569756D',schema:626,externallyConfirmed:true};
          const steam={platform:'steam-windows',buildKind:'steam-full-version',buildId:'releases_1.25-v1.25.3-44-g0b41250d9ac0-incremental-22',schema:626,externallyConfirmed:true};
          const cmd={kind:'InventoryExistingAmountDecrease',inventoryId:0,canonicalItemId:40000076,compatibleItemType:'ItemType_Furniture',expectedOldAmount:999,newAmount:998};
          let neg=0,opens=0;
          const deny=async(f,k)=>{let rejected=false;try{await f()}catch{rejected=true}need(rejected,k);neg++};
          try{
            const r=await fetch('/qa-qrw1490local/ddv_save_core_bg.wasm');need(r.ok&&r.headers.get('content-type')?.startsWith('application/wasm'),'WASM MIME');
            await init({module_or_path:await r.arrayBuffer()});
            const bytes=new Uint8Array(await (await fetch('/qa-qrw1490local/input.p1g')).arrayBuffer()),meta=await (await fetch('/qa-qrw1490local/meta.json')).json();
            need(await hash(bytes)===meta.sha,'source sha');
            const file=new File([bytes],'synthetic.p1g'),input={file,build:sw,originalSha256:meta.sha};
            const root=await navigator.storage.getDirectory();
            // Count only actual Rust constructor use, never substitute fake receipts.
            const factory=async()=>({WorkerWasmSource:class extends WorkerWasmSource{constructor(...a){super(...a);opens++}}});
            await deny(()=>createProductSwitch626Catalog0LocalAdapter({wasmFactory:factory,coreDiscoveryProfile:'linked-crop-chest48'}),'Chest constructor');
            await deny(()=>createProductSwitch626Catalog0LocalAdapter({wasmFactory:factory,discoverScopedTargets:()=>[]}),'forged discovery');
            const a=createProductSwitch626Catalog0LocalAdapter({wasmFactory:factory});
            await deny(()=>a.open({...input,build:steam}),'foreign build');
            await deny(()=>a.open({...input,build:{...sw,buildId:'wrong'}}),'wrong BID');
            need(opens===0,'foreign build constructed');
            await a.open(input);need(opens===1,'one session');
            await deny(()=>a.stageTyped([cmd]),'no backup');
            const b=await a.backupOriginal(),targets=await a.listVerifiedTargets();
            need(targets.targets.length===1&&targets.targets[0].targetId===0&&targets.targets[0].slotIndex===0&&targets.targets[0].itemId===40000076&&targets.targets[0].oldAmount===999,'exact target');
            await a.stageTyped([cmd]);await a.undo();await deny(()=>a.exportEditedCopy(),'undo export');await a.redo();
            const o=await a.exportEditedCopy();need(o.freshWorkerReopenVerified===true&&o.writerAuthorized===false&&o.originalOverwriteAuthorized===false,'export fresh worker');
            const backup=await a.downloadVerifiedCopy('backup'),edit=await a.downloadVerifiedCopy('edited');
            need(backup.name!==edit.name&&backup.name!==file.name&&edit.name!==file.name,'names');
            need(await hash(backup.encryptedBytes)===meta.sha&&await hash(new Uint8Array(await file.arrayBuffer()))===meta.sha,'backup/source bytes');
            const bfile=await (await root.getFileHandle(backup.name)).getFile(),efile=await (await root.getFileHandle(edit.name)).getFile();
            need(await hash(new Uint8Array(await bfile.arrayBuffer()))===meta.sha&&await hash(new Uint8Array(await efile.arrayBuffer()))===edit.sha256,'actual OPFS readback');
            await deny(()=>a.exportEditedCopy(),'replay output');
            need((await a.close()).kind==='CLOSED','close');
            await deny(()=>a.downloadVerifiedCopy('edited'),'closed download');
            await a.open(input);await a.backupOriginal();await a.listVerifiedTargets();
            await deny(()=>a.stageTyped([{...cmd,expectedOldAmount:1000}]),'old CAS');
            await deny(()=>a.stageTyped([cmd]),'revoked session');
            await a.open(input);await a.backupOriginal();await a.listVerifiedTargets();
            await deny(()=>a.stageTyped([{...cmd,newAmount:997}]),'nonexact');await a.close();
            await a.open(input);const b2=await a.backupOriginal();await a.listVerifiedTargets();await a.stageTyped([cmd]);
            const w=await (await root.getFileHandle(b2.backupName)).createWritable();await w.write(new Uint8Array([1,2,3]));await w.close();
            await deny(()=>a.exportEditedCopy(),'tampered durable backup');await a.close();
            need(await hash(new Uint8Array(await file.arrayBuffer()))===meta.sha,'final original');
            postMessage({ok:true,neg,opens,actualOpfs:true,freshCodecWorker:true,backup:Array.from(backup.encryptedBytes),edited:Array.from(edit.encryptedBytes),backupName:backup.name,editedName:edit.name,writer:false});
          }catch(e){postMessage({error:String(e?.stack||e)})}
          NODE
      - name: Actual Chrome OPFS and independent process encrypted Reopen
        run: |
          cat > tests/.qa-qrw1490local-browser.mjs <<'NODE'
          import {chromium} from 'playwright-core';
          import {spawn,spawnSync} from 'node:child_process';
          import {writeFileSync,readFileSync} from 'node:fs';
          import assert from 'node:assert/strict';
          const port=4182,origin='http://127.0.0.1:'+port;
          const server=spawn('npm',['run','dev','--','--host','127.0.0.1','--port',String(port),'--strictPort'],{env:{...process.env,BASE_PATH:''},stdio:'inherit'});
          let browser;
          try{
            for(let i=0;i<100;i++){try{if((await fetch(origin+'/test-qrw1490local/')).ok)break}catch{}await new Promise(r=>setTimeout(r,250))}
            const bin=['google-chrome-stable','google-chrome','chromium'].find(x=>spawnSync('which',[x]).status===0);
            assert.ok(bin);browser=await chromium.launch({headless:true,executablePath:spawnSync('which',[bin],{encoding:'utf8'}).stdout.trim(),args:['--no-sandbox','--disable-dev-shm-usage']});
            const page=await browser.newPage();await page.goto(origin+'/test-qrw1490local/');
            await page.waitForFunction(()=>!!window.__qrw1490local,{},{timeout:90000});
            const q=await page.evaluate(()=>window.__qrw1490local);assert.ok(q.ok,q.error);assert.equal(q.neg,12);assert.equal(q.opens,4);assert.equal(q.actualOpfs,true);assert.equal(q.freshCodecWorker,true);assert.equal(q.writer,false);
            writeFileSync('/tmp/qrw1490local-backup.p1g',Buffer.from(q.backup));writeFileSync('/tmp/qrw1490local-edited.p1g',Buffer.from(q.edited));
            assert.deepEqual(readFileSync('/tmp/qrw1490local-backup.p1g'),readFileSync('static/qa-qrw1490local/input.p1g'));
            const check=spawnSync(process.execPath,['--input-type=module','-e',"import {readFileSync} from 'node:fs';import assert from 'node:assert/strict';import {p1gPackagedProfileCodec as c} from './src/lib/ddv/core/save/p1g-packaged-profile-codec.js';const p=await c.loadProfile(new Uint8Array(readFileSync('/tmp/qrw1490local-edited.p1g')));assert.deepEqual(JSON.parse(p.jsonText),JSON.parse(readFileSync('static/qa-qrw1490local/meta.json','utf8')).expected);console.log('QRW1490LOCAL_INDEPENDENT_FULL_DOCUMENT_REOPEN_PASS')"],{stdio:'inherit'});
            assert.equal(check.status,0);
            console.log('QRW1490LOCAL_REAL_CHROME_OPFS_PASS',JSON.stringify({positive:1,negative:q.neg,actualRustSessions:q.opens,actualOpfs:true,freshCodecWorker:true,independentProcessReopen:true,writer:false}));
          }finally{if(browser)await browser.close();server.kill()}
          NODE
          node tests/.qa-qrw1490local-browser.mjs

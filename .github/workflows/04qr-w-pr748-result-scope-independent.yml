name: "04 QR-W PR748 Collection result-scope independent changed-only"
on:
  pull_request:
    paths:
      - ".github/workflows/04qr-w-pr748-result-scope-independent.yml"
      - "scripts/04qr-w-pr748-result-scope-chrome.mjs"
      - "tests/04qr-w-pr748-result-scope-independent.test.mjs"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  independent-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Freeze original four Source blobs and assert post-tick stale guards and modal defer
        run: node --test tests/04qr-w-pr748-result-scope-independent.test.mjs
  independent-chrome:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --no-audit --no-fund
      - run: npm install --no-save --package-lock=false playwright-core@1.55.0
      - name: Boot disposable localhost Collection public catalog, NO private Save or Provider
        shell: bash
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
          BASE_PATH="" npm run dev -- --host 127.0.0.1 --port 4299 >/tmp/qr748-result.log 2>&1 &
          for i in $(seq 1 75); do
            if curl -fsS http://127.0.0.1:4299/collection/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/qr748-result.log
          exit 1
      - name: Independent actual Chrome deep search/category/facet, async race and mobile deferred scroll
        env:
          QR748_URL: http://127.0.0.1:4299
        run: node scripts/04qr-w-pr748-result-scope-chrome.mjs

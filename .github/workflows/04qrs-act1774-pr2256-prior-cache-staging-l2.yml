name: 04 QR-S ACT1774 PR2256 Pages prior-ON cache staging Security L2 QA ONLY
on:
  push:
    branches:
      - '04qrs/act1774-pr2256-signed-pages-prior-cache-staging-l2'
    paths:
      - '.github/workflows/04qrs-act1774-pr2256-prior-cache-staging-l2.yml'
permissions:
  contents: read
jobs:
  signed-pages-registry-trust:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Trust exactly reviewed Pages Source plus one QA-only YAML
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor baa8337c71f194b379bdd147354def9e55b0f2e8 HEAD
          test "$(git diff --name-only baa8337c71f194b379bdd147354def9e55b0f2e8 HEAD)" = ".github/workflows/04qrs-act1774-pr2256-prior-cache-staging-l2.yml"
          test "$(git rev-parse HEAD:.github/workflows/pages.yml)" = f428f95f047a9564e2d5febd646b02461854f5ac
          test "$(git rev-parse HEAD:ops/ddv-steam-public-media-prior-on-cache.json)" = 1adb23565fc693b3e255f7a82be1f8f9bf7fce3b
      - name: Execute exact Pages staging Shell positive and fail-closed hostile prior cache proof
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'QRS2256_TEST'
          import assert from 'node:assert/strict';
          import {execFileSync,spawnSync} from 'node:child_process';
          import {readFileSync,mkdirSync,mkdtempSync,rmSync,symlinkSync,lstatSync,writeFileSync,realpathSync} from 'node:fs';
          import {tmpdir} from 'node:os';
          import {join,resolve} from 'node:path';
          const repo=process.cwd();
          const source='baa8337c71f194b379bdd147354def9e55b0f2e8';
          const original='b27819af3ea4d3d8e45a126ba5981e0dfbdc5db5';
          const expectedNew='f428f95f047a9564e2d5febd646b02461854f5ac';
          const registryPath='ops/ddv-steam-public-media-prior-on-cache.json';
          const registryBlob='1adb23565fc693b3e255f7a82be1f8f9bf7fce3b';
          const git=(...args)=>execFileSync('git',args,{cwd:repo,encoding:'utf8',env:{...process.env,GIT_NO_REPLACE_OBJECTS:'1'}}).trim();
          assert.equal(git('rev-parse',source+':.github/workflows/pages.yml'),expectedNew);
          assert.equal(git('rev-parse',source+':'+registryPath),registryBlob);
          assert.equal(git('rev-parse',original+':'+registryPath),registryBlob);
          assert.equal(git('rev-parse',original+':.github/workflows/pages.yml'),'ed8aabff1dc8c8b426054c7dff0d88faa2b02da4');
          const before=git('show',original+':.github/workflows/pages.yml');
          const changed=git('show',source+':.github/workflows/pages.yml');
          const oldLines=before.split('\n');
          const newLines=changed.split('\n');
          const targetBegin='          mkdir -p "$RUNNER_TEMP/wand-steam-media-proof/scripts" "$RUNNER_TEMP/wand-steam-media-proof/ops"';
          const targetFinish='          test "$(git hash-object --no-filters "$RUNNER_TEMP/wand-steam-media-proof/ops/ddv-steam-public-media-prior-on-cache.json")" = "$(git -C "$dir" rev-parse "$GITHUB_SHA:ops/ddv-steam-public-media-prior-on-cache.json")"';
          const begin=newLines.indexOf(targetBegin);
          const finish=newLines.indexOf(targetFinish);
          assert.ok(begin>0&&finish>begin,'actual new protected Pages snippet not found');
          assert.ok(!oldLines.includes(targetFinish),'old failed protected Pages already had staging fix?');
          const stage=newLines.slice(begin,finish+1).map(s=>s.slice(10)).join('\n');
          assert.match(stage,/git -C "\$dir" show "\$GITHUB_SHA:ops\/ddv-steam-public-media-prior-on-cache.json"/);
          assert.match(stage,/git hash-object --no-filters/);
          const t=mkdtempSync(join(tmpdir(),'qrs2256-prior-cache-'));
          const isolate=join(t,'isolated');
          const sourceRepo=repo;
          const env={...process.env,GIT_NO_REPLACE_OBJECTS:'1',GIT_CONFIG_GLOBAL:'/dev/null',GIT_CONFIG_NOSYSTEM:'1',
           GIT_AUTHOR_NAME:'04QRS isolated QA',GIT_AUTHOR_EMAIL:'test@example.invalid',
           GIT_COMMITTER_NAME:'04QRS isolated QA',GIT_COMMITTER_EMAIL:'test@example.invalid'};
          const run=(str,repoDir,temps,head)=>spawnSync('bash',['-euo','pipefail','-c',str],{
           cwd:repoDir,env:{...env,dir:repoDir,RUNNER_TEMP:temps,GITHUB_SHA:head},
           encoding:'utf8',timeout:60000,maxBuffer:6*1024*1024});
          const mustPass=(label,r)=>assert.equal(r.status,0,label+': '+r.stderr.slice(-1500));
          const mustFail=(label,r)=>assert.notEqual(r.status,0,'SECURITY_TRUE_RED_'+label+'_STAGING_FALSE_ACCEPT');
          let pos=0,neg=0,red=0;
          try{
           const clone=spawnSync('git',['clone','--no-hardlinks','-q',sourceRepo,isolate],{encoding:'utf8'});
           mustPass('clone',clone);
           const fake=(name)=>join(t,name);
           const successDir=fake('positive');
           mkdirSync(successDir);
           mustPass('real_same_commit_registry',run(stage,isolate,successDir,source));
           const staged=join(successDir,'wand-steam-media-proof/ops/ddv-steam-public-media-prior-on-cache.json');
           assert.equal(git('hash-object','--no-filters',staged),registryBlob);
           assert.equal(JSON.parse(readFileSync(staged,'utf8')).records.length,0);
           pos++;
           console.log('QRS2256_REAL_SAME_PROTECTED_COMMIT_STAGING_POS_PASS');
           // Missing registry in the source commit must not become a zero-byte
           // provisional accepted file. Use an unreferenced detached Git tree.
           const index=join(t,'index');
           const gitEnv={...env,GIT_INDEX_FILE:index};
           const x=(args)=>execFileSync('git',args,{cwd:isolate,env:gitEnv,encoding:'utf8'}).trim();
           x(['read-tree',source+'^{tree}']);
           x(['update-index','--force-remove',registryPath]);
           const tree=x(['write-tree']);
           const missing=x(['commit-tree',tree,'-p',source,'-m','isolated missing protected prior-ON registry']);
           const md=fake('missing');mkdirSync(md);
           mustFail('MISSING_PINNED_REGISTRY',run(stage,isolate,md,missing));
           neg++;
           console.log('QRS2256_MISSING_PROTECTED_COMMIT_REGISTRY_DENIED');
           // Worktree spoof does not override immutable source blobs.
           const worktree=join(isolate,registryPath);
           const origBytes=readFileSync(worktree);
           try{
            writeFileSync(worktree,'{"schema":"invalid","records":[{"spoof":true}]}\n');
            const wd=fake('worktree');mkdirSync(wd);
            mustPass('worktree_untrusted_override_did_not_change_exact_blob',run(stage,isolate,wd,source));
            assert.equal(readFileSync(join(wd,'wand-steam-media-proof/ops/ddv-steam-public-media-prior-on-cache.json'),'utf8'),origBytes.toString('utf8'));
            pos++;
            console.log('QRS2256_WORKTREE_SPOOF_OVERRIDDEN_BY_GIT_OBJECT_POS_PASS');
           }finally{writeFileSync(worktree,origBytes)}
           // A preexisting symlink in the disposable proof tree must not be
           // followed to an untrusted outside location. The core verifier uses
           // only the resulting bytes; equality by itself cannot prove path trust.
           const scenarios=['OPS_PARENT_OUTSIDE_SYMLINK','PRIOR_REGISTRY_LEAF_OUTSIDE_SYMLINK','SCRIPTS_PARENT_OUTSIDE_SYMLINK'];
           for(const name of scenarios){
            const tmp=fake(name);mkdirSync(tmp);
            const proof=join(tmp,'wand-steam-media-proof');
            mkdirSync(proof);
            const outside=fake('outside-'+name);mkdirSync(outside);
            if(name==='OPS_PARENT_OUTSIDE_SYMLINK'){
             symlinkSync(outside,join(proof,'ops'),'dir');
            }else if(name==='SCRIPTS_PARENT_OUTSIDE_SYMLINK'){
             symlinkSync(outside,join(proof,'scripts'),'dir');
            }else{
             mkdirSync(join(proof,'ops'));
             writeFileSync(join(outside,'registry.json'),'UNTRUSTED_PREEXISTING_BYTES');
             symlinkSync(join(outside,'registry.json'),join(proof,'ops/ddv-steam-public-media-prior-on-cache.json'));
            }
            const r=run(stage,isolate,tmp,source);
            if(r.status===0){
             red++;
             console.log('QRS2256_SECURITY_TRUE_RED_OUTSIDE_REPO_SYMLINK_FALSE_ACCEPT_'+name,{
              outsideTampered:readFileSync(
               name==='PRIOR_REGISTRY_LEAF_OUTSIDE_SYMLINK'?join(outside,'registry.json'):
               join(outside,name==='SCRIPTS_PARENT_OUTSIDE_SYMLINK'?'int-steam-public-media-signed-batch.mjs':'ddv-steam-public-media-prior-on-cache.json')
              ).length>0,
              stageExit:r.status
             });
            }else{
             neg++;
             console.log('QRS2256_OUTSIDE_REPO_SYMLINK_DENIED_'+name);
            }
           }
           console.log('QRS2256_FINAL_POS_NEG_TRUE_RED',JSON.stringify({pos,neg,red}));
           assert.equal(red,0,'SECURITY_TRUE_RED_PROTECTED_PAGES_STAGING_OUTSIDE_REPO_SYMLINK_FOLLOWED');
          }finally{rmSync(t,{recursive:true,force:true})}
          QRS2256_TEST
      - name: QA-only never merge/sign/publish
        shell: bash
        run: echo QRS2256_QAONLY_NO_MERGE_NO_PAGES_NO_ON

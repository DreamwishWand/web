name: 05 QR-C Steam626 Inventory0 independent Undo-Redo ABA One-time Export L2 (QA ONLY NEVER MERGE)
on:
  pull_request:
    paths:
      - .github/workflows/05qrc-pr2356-inv0-undo-redo-aba-output-l2.yml
permissions:
  contents: read
jobs:
  optimized-wasm32-history-aba:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_TARGET_DIR: /tmp/qrc-inv0-aba-wasm32
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 05qrc-20261120-pr2356-inv0-undo-redo-aba-output-l2
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
          targets: wasm32-unknown-unknown
      - name: Pin unchanged original Inventory0 product source and one QA-only workflow
        shell: bash
        run: |
          set -euo pipefail
          source=284a9b664cafd2078e6bd582458bd101c7bcf34b
          base=0e57c6b8585002b1baff91e6de573a835bed6577
          path=.github/workflows/05qrc-pr2356-inv0-undo-redo-aba-output-l2.yml
          test "$(git merge-base "$source" HEAD)" = "$source"
          test "$(git diff --name-only "$source" HEAD)" = "$path"
          test "$(git ls-tree HEAD -- "$path" | awk '{print $1}')" = 100644
          git diff --name-only "$base" "$source" | LC_ALL=C sort > /tmp/qrc-inv0-changed
          printf '%s\n' \
            '.github/workflows/01a-steam626-inventory0-dedicated-rust-source.yml' \
            'crates/ddv-save-core/Cargo.toml' \
            'crates/ddv-save-core/src/product_session.rs' \
            'crates/ddv-save-core/src/wasm_worker.rs' \
            'src/lib/ddv/core/save/p1g-rust-worker-readonly-bridge.mjs' \
            'src/lib/ddv/core/save/product-scoped-amount-local-adapter.mjs' \
            'src/lib/ddv/core/save/product-scoped-amount-transport.mjs' \
            'src/lib/ddv/core/save/product-wasm-read-owner.mjs' \
            'tests/01a-steam626-catalog0-product-worker-port.test.mjs' \
            'tests/01a-steam626-inventory0-exclusive-rust-feature.test.mjs' \
            'tests/product-steam626-catalog0-local-adapter.test.mjs' | LC_ALL=C sort > /tmp/qrc-inv0-expected
          diff -u /tmp/qrc-inv0-expected /tmp/qrc-inv0-changed
          test "$(git rev-parse HEAD:crates/ddv-save-core/src/product_session.rs)" = e53c4930a84f729ea245f38a1b301c7178146ced
          test "$(git rev-parse HEAD:crates/ddv-save-core/src/wasm_worker.rs)" = 775a2766f237d44ae77fa5347e9adf430c8580d2
          test "$(git rev-parse HEAD:crates/ddv-save-core/src/worker_session.rs)" = 254af029304f6a357c8c0a0e7a1376b80313d038
          test "$(git rev-parse HEAD:crates/ddv-save-core/Cargo.toml)" = b3455c36d9d60b4a0e415026a095e47fe577644d
          test "$(git rev-parse HEAD:.github/workflows/01a-steam626-inventory0-dedicated-rust-source.yml)" = 19d7f0c532badecc86f8d36ff89eed1ba0e28bf2
          test ! -e crates/ddv-save-core/Cargo.lock
          cp scripts/wasm-distribution/approved-Cargo.lock crates/ddv-save-core/Cargo.lock
          echo 'e58486d673df79bfe7e72b80449e39389e57010fe4051edcdcff9b53c2da898c  crates/ddv-save-core/Cargo.lock' | sha256sum -c -
          echo QRC_INV0_ABA_ORIGINAL11_ONE_QA_ONLY_MODE100644_SHA_GUARD
      - name: Compile actual optimized Rust1.99.1 Inventory0 scoped WASM
        shell: bash
        run: |
          set -euo pipefail
          test "$(rustc --version | cut -d' ' -f2)" = 1.99.1
          cargo build --locked --release --manifest-path crates/ddv-save-core/Cargo.toml \
            --target wasm32-unknown-unknown --no-default-features \
            --features worker-wasm,product-steam626-catalog0-scoped
          cargo install wasm-bindgen-cli --version 0.2.105 --locked --root /tmp/qrc-inv0-aba-bindgen
          mkdir -p /tmp/qrc-inv0-aba-pkg
          /tmp/qrc-inv0-aba-bindgen/bin/wasm-bindgen \
            "$CARGO_TARGET_DIR/wasm32-unknown-unknown/release/ddv_save_core.wasm" \
            --out-dir /tmp/qrc-inv0-aba-pkg --target nodejs --no-typescript
      - name: Independent native Rust-backed ABA after undo-redo, cross-session and exact-once output
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          src=Path('.github/workflows/01a-steam626-inventory0-dedicated-rust-source.yml').read_text()
          start=src.index('          const empty=()=>')
          end=src.index('          const hash=bytes=>',start)
          fixture='\n'.join(line[10:] for line in src[start:end].splitlines())+'\n'
          head="""import assert from 'node:assert/strict';
          import {createRequire} from 'node:module';
          import {createHash} from 'node:crypto';
          const {WorkerWasmSource}=createRequire(import.meta.url)('/tmp/qrc-inv0-aba-pkg/ddv_save_core.js');
          """
          proof=r'''
          const sha=b=>createHash('sha256').update(b).digest('hex');
          const originalHash=sha(encoded);
          const BUILD='releases_1.25-v1.25.3-44-g0b41250d9ac0-incremental-22';
          const w=new WorkerWasmSource('steam-windows','steam-full-version',BUILD,626,true,
            new Uint8Array(32).fill(0x52));
          w.append_chunk(encoded);
          const receipt=JSON.parse(w.finish());
          assert.equal(receipt.writerAuthorized,false);
          const scope=x=>[x.sessionId,BigInt(x.revision),BigInt(x.indexGeneration),x.decodedSha256];
          const a=scope(receipt);
          assert.throws(()=>w.begin_scoped_amount_output(...a),'no export on unopened ledger');
          const pre=JSON.parse(w.preview_scoped_amount('catalog0-furniture',0,40000048,2,...a));
          assert.equal(pre.oldAmount,3);assert.equal(pre.newAmount,2);
          const staged=JSON.parse(w.stage_scoped_amount('catalog0-furniture',0,40000048,3,2,pre.entrySha256,...a));
          assert.equal(staged.exactFieldChangedCount,1);
          assert.equal(staged.writerAuthorized,false);
          const s=scope(staged);
          assert.throws(()=>w.toggle_scoped_amount(true,...s),'cannot redo before undo');
          const undone=JSON.parse(w.toggle_scoped_amount(false,...s));
          const u=scope(undone);
          assert.notEqual(undone.revision,staged.revision,'undo rev must advance');
          assert.throws(()=>w.toggle_scoped_amount(false,...s),'stale pre-undo CAS must not replay');
          assert.throws(()=>w.begin_scoped_amount_output(...s),'stale pre-undo export must deny');
          const redone=JSON.parse(w.toggle_scoped_amount(true,...u));
          const r=scope(redone);
          assert.notEqual(redone.revision,staged.revision,'redo must not restore old revision ABA');
          assert.throws(()=>w.toggle_scoped_amount(true,...u),'repeat redo old generation denied');
          assert.throws(()=>w.begin_scoped_amount_output(...s),'ABA old stage receipt export denied after redo');
          assert.throws(()=>w.stage_scoped_amount('catalog0-furniture',0,40000048,3,2,pre.entrySha256,...a),
            'original stale stage cannot replay after ABA');
          const another=new WorkerWasmSource('steam-windows','steam-full-version',BUILD,626,true,
            new Uint8Array(32).fill(0x63));
          another.append_chunk(encoded);
          const two=JSON.parse(another.finish());
          const otherScope=scope(two);
          assert.notEqual(two.sessionId,receipt.sessionId,'independent entropy creates distinct session');
          assert.throws(()=>another.stage_scoped_amount('catalog0-furniture',0,40000048,3,2,
            pre.entrySha256,...r),'cross-session forged receipt rejected');
          assert.throws(()=>w.stage_scoped_amount('linked-crop-chest48',12,0,50,49,pre.entrySha256,...r),
            'foreign Chest category rejected even with current valid session');
          another.close();
          const out=JSON.parse(w.begin_scoped_amount_output(...r));
          assert.equal(out.writerAuthorized,false);
          assert.equal(out.originalOverwriteAuthorized,false);
          assert.ok(out.decodedBytes>0 && out.decodedBytes<32*1024*1024);
          let cursor=0;const chunks=[];
          while(cursor<out.decodedBytes){
            const chunk=w.next_scoped_amount_output_chunk();
            assert.ok(chunk.length>0);
            chunks.push(chunk);cursor+=chunk.length;
          }
          assert.equal(cursor,out.decodedBytes);
          const copied=new Uint8Array(cursor);let off=0;
          for(const part of chunks){copied.set(part,off);off+=part.length}
          const expected=structuredClone(source);
          expected.Player.ListInventories['0'].Inventory['40000048'].Amount=2;
          assert.equal(new TextDecoder().decode(copied),JSON.stringify(expected),
            'redo requires original-known/unknown exact one allowed field');
          assert.equal(sha(copied),out.decodedSha256);
          assert.equal(sha(encoded),originalHash,'original byte buffer remains immutable');
          assert.throws(()=>w.next_scoped_amount_output_chunk(),'no double output chunk after completion');
          assert.throws(()=>w.begin_scoped_amount_output(...r),'no repeat export after session consumed');
          w.close();w.free();another.free();
          console.log('QRC_INV0_ABA_NATIVE_RUST_WASM32_UNDO_REDO_STALE_REV_EXPORT_REJECTED');
          console.log('QRC_INV0_ABA_ONE_TIME_COPY_ONLY_ONE_FIELD_UNKNOWN_PRESERVED_ORIGINAL_SHA_UNCHANGED');
          '''
          Path('/tmp/qrc-inv0-aba.mjs').write_text(head+fixture+proof)
          PY
          node --check /tmp/qrc-inv0-aba.mjs
          node /tmp/qrc-inv0-aba.mjs
          test "$(git diff --name-only 284a9b664cafd2078e6bd582458bd101c7bcf34b HEAD)" = \
            '.github/workflows/05qrc-pr2356-inv0-undo-redo-aba-output-l2.yml'

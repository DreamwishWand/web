name: 05 QR-C PR1034 DEV epoch repair independent
on:
  pull_request:
    paths:
      - 'tests/qa/05qrc-pr1034-dev-epoch-repair.mjs'
      - '.github/workflows/05qrc-pr1034-dev-epoch-repair.yml'
permissions:
  contents: read
jobs:
  independent:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
          targets: wasm32-unknown-unknown
      - name: Exact repaired source and QA-only delta
        run: |
          set -euo pipefail
          s=b383fb7b07d2e72649d93f4508549d08fc8a399f
          old=a6aaf877e0949b036a7e1ec592039d1b8affe11c
          base=f3c9312878d673923fb353bc194906c9e1ad3ad5
          test "$(git merge-base "$s" HEAD)" = "$s"
          test "$(git diff --name-only "$base" "$s" | wc -l)" = 6
          test "$(git diff --name-only "$old" "$s" | sort)" = "$(printf '%s\n' src/lib/ddv/core/save/p1g-rust-worker-readonly-bridge.mjs tests/official-dev-furniture-zero.mjs | sort)"
          test "$(git rev-parse HEAD:src/lib/ddv/core/save/p1g-rust-worker-readonly-bridge.mjs)" = 613950fe59f4cffade0babd572fda8d00e77428d
          test "$(git rev-parse HEAD:tests/official-dev-furniture-zero.mjs)" = a013ae578b8fb78ff7137eec05a15dc0db787cd9
          test "$(git rev-parse HEAD:tests/qa/05qrc-pr1034-dev-epoch.mjs)" = 6055a1c5ecf99b3bd8b61b3a58d578cd6586cef6
          test "$(git diff --name-only "$s" HEAD | sort)" = "$(printf '%s\n' .github/workflows/05qrc-pr1034-dev-epoch-repair.yml tests/qa/05qrc-pr1034-dev-epoch.mjs tests/qa/05qrc-pr1034-dev-epoch-repair.mjs | sort)"
          echo QAC1034_REPAIR2_ORIGINAL6_QA3_PASS
      - name: Generate exact DEV WASM
        run: |
          cargo generate-lockfile --manifest-path crates/ddv-save-core/Cargo.toml
          echo 'e58486d673df79bfe7e72b80449e39389e57010fe4051edcdcff9b53c2da898c  crates/ddv-save-core/Cargo.lock' | sha256sum -c -
          cargo build --locked --manifest-path crates/ddv-save-core/Cargo.toml --release --target wasm32-unknown-unknown --no-default-features --features worker-wasm,indexed-read,semantic-writer-dev
          cargo install wasm-bindgen-cli --version 0.2.105 --locked --root "$RUNNER_TEMP/bindgen"
          mkdir -p "$RUNNER_TEMP/dev"
          "$RUNNER_TEMP/bindgen/bin/wasm-bindgen" crates/ddv-save-core/target/wasm32-unknown-unknown/release/ddv_save_core.wasm --target web --out-dir "$RUNNER_TEMP/dev" --no-typescript
          echo '{"type":"module"}' > "$RUNNER_TEMP/dev/package.json"
      - name: Reuse historical causal tests and new independent actual races
        run: |
          timeout 45s node tests/qa/05qrc-pr1034-dev-epoch.mjs "$RUNNER_TEMP/dev"
          timeout 45s node tests/qa/05qrc-pr1034-dev-epoch-repair.mjs "$RUNNER_TEMP/dev"
      - name: Public WASM exclusion
        run: |
          cargo build --locked --manifest-path crates/ddv-save-core/Cargo.toml --release --target wasm32-unknown-unknown --no-default-features --features worker-wasm,indexed-read
          node --input-type=module -e 'import {readFileSync} from "node:fs"; const m=new WebAssembly.Module(readFileSync("crates/ddv-save-core/target/wasm32-unknown-unknown/release/ddv_save_core.wasm")); if(WebAssembly.Module.exports(m).some(x=>x.name.includes("dev_")))process.exit(1);console.log("QAC1034_PUBLIC_DEV_EXPORTS_ZERO");'

name: 05 QR-C ACT1581 main-d37 Switch626 Makeup generated ABI L2 (QA ONLY NEVER MERGE)
on:
  pull_request:
    paths:
      - '.github/workflows/05qrc-act1581-main-d37-switch626-makeup-generated-l2.yml'
permissions:
  contents: read
jobs:
  qrc-act1581-main:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_TARGET_DIR: /tmp/wand-qrc2217-cargo-target
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 05qrc-act1581-switch626-makeup-main-d37-generated-l2
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Fixed product Source exact7 and one QA-only workflow
        shell: bash
        run: |
          set -euo pipefail
          src=b2735bc63884049a5f3d16423e5970553f168766
          parent=107e088aeebc95c06e0041f794c2e1c57a15cf6c
          test "$(git merge-base "$src" HEAD)" = "$src"
          test "$(git rev-list --count "$src"..HEAD)" = 1
          git diff --name-only "$src" HEAD > /tmp/qrc2217-actual
          printf '%s\n' '.github/workflows/05qrc-act1581-main-d37-switch626-makeup-generated-l2.yml' > /tmp/qrc2217-expected
          diff -u /tmp/qrc2217-expected /tmp/qrc2217-actual
          test "$(git diff --name-only "$parent" "$src" | wc -l)" = 7
          for f in \
            .github/workflows/core-product-session-boundary.yml \
            crates/ddv-save-core/Cargo.toml \
            crates/ddv-save-core/src/product_makeup_color1.rs \
            crates/ddv-save-core/src/wasm_switch626_makeup_color1.rs \
            crates/ddv-save-core/src/wasm_worker.rs \
            crates/ddv-save-core/src/worker_session.rs \
            crates/ddv-save-core/src/worker_switch626_makeup_color1.rs; do
            test "$(git rev-parse "HEAD:$f")" = "$(git rev-parse "$src:$f")"
          done
          echo QRC2217_FIXED_SOURCE_EXACT7_QAONLY_ONEFILE_PASS
      - name: Reuse accepted independent QA script and inject bounded synthetic fixture in workspace only
        shell: bash
        run: |
          set -euo pipefail
          old=12c5811e45e4e73deb734ea97cbfefedae887336
          git cat-file -e "$old^{commit}" || git fetch --no-tags origin "$old"
          mkdir -p tests/qa
          git show "$old:tests/qa/qrc1954-switch-makeup-realshape-generated.cjs" > tests/qa/qrc1954-switch-makeup-realshape-generated.cjs
          test "$(git hash-object tests/qa/qrc1954-switch-makeup-realshape-generated.cjs)" = 24bc3eda7cc296b2ccc8aa485428a279e24e311c
          test "$(git rev-parse HEAD:crates/ddv-save-core/src/product_makeup_color1.rs)" = 749831d8c41a24585a490b5ed23640fc8d50fc3d
          python3 - <<'PY'
          from pathlib import Path
          p=Path('crates/ddv-save-core/src/product_makeup_color1.rs')
          s=p.read_text()
          assert 'qa1954_emit_corrected_switch_makeup_generated_fixture' not in s
          assert s.rstrip().endswith('}')
          insert=r'''
           #[cfg(feature="product-switch626-makeup-color1-scoped")]
           #[test]
           #[ignore="QA-only bounded physical saved-shape fixture, not encrypted owner P1G"]
           fn qa1954_emit_corrected_switch_makeup_generated_fixture(){
            let mut d=doc();
            d["World"]["UnknownNotEdited"]=json!({"keep":[true,null,31]});
            d["Player"]["MaleAvatar"]["Makeup"]["1"]["KeepOpaque"]=json!({"nested":[8,9]});
            let male=&d["Player"]["MaleAvatar"]["Makeup"]["1"];
            let female=&d["Player"]["FemaleAvatar"]["Makeup"]["1"];
            assert_eq!(male["MakeupItemID"],json!(140100014));
            assert_eq!(male["ColorIndex1"],json!(53));
            assert_eq!(female["MakeupItemID"],json!(140100011));
            assert_eq!(female["ColorIndex1"],json!(60));
            for avatar in ["MaleAvatar","FemaleAvatar"]{
             assert_eq!(d["Player"][avatar]["Makeup"]["1"]["ColorIndex2"],json!(0));
             assert_eq!(d["Player"][avatar]["Makeup"]["1"]["ColorIndex3"],json!(0));
            }
            let inv=&d["Player"]["ListInventories"]["3"]["Inventory"];
            assert_eq!(inv["140100014"]["Amount"],json!(2));
            assert_eq!(inv["140100011"]["Amount"],json!(1));
            let bytes=serde_json::to_vec(&d).unwrap();
            assert!(bytes.len()<1024*1024);
            std::fs::write("/tmp/qrc1954-makeup-source.json",&bytes).unwrap();
            println!("QRC2217_SWITCH626_CORRECTED_FIXTURE_SYNTHETIC bytes={}",bytes.len());
           }
          '''
          pos=s.rfind('}')
          p.write_text(s[:pos]+insert+s[pos:])
          PY
          cp scripts/wasm-distribution/approved-Cargo.lock crates/ddv-save-core/Cargo.lock
          test "$(git hash-object scripts/wasm-distribution/approved-Cargo.lock)" = b667b42cfef2032c2925be7b2aa9b7142bff4b52
          sha256sum crates/ddv-save-core/Cargo.lock > /tmp/qrc2217-lock.sha
          cargo test --locked --manifest-path crates/ddv-save-core/Cargo.toml --features product-switch626-makeup-color1-scoped --lib qa1954_emit_corrected_switch_makeup_generated_fixture -- --ignored --nocapture
          test -s /tmp/qrc1954-makeup-source.json
          echo QRC2217_HISTORIC_QA_TEST_INPUT_ON_NEW_SOURCE_PASS
      - name: Genuine generated JS and WASM OFF OWN HAIR MIXED and STEAM MAKEUP/EYE MIXED
        shell: bash
        run: |
          set -euo pipefail
          cargo install wasm-bindgen-cli --version 0.2.105 --locked --root /tmp/wand-qrc2217-bindgen
          for mode in off own mixed makeup_eye_mixed; do
            case "$mode" in
              off) features=worker-wasm,indexed-read ;;
              own) features=worker-wasm,product-switch626-makeup-color1-scoped ;;
              mixed) features=worker-wasm,product-switch626-makeup-color1-scoped,product-steam626-hair-scoped ;;
              makeup_eye_mixed) features=worker-wasm,product-switch626-makeup-color1-scoped,product-steam626-makeup-color1-scoped,product-switch626-eyecolor2-internal ;;
            esac
            cargo build --locked --manifest-path crates/ddv-save-core/Cargo.toml --release --target wasm32-unknown-unknown --no-default-features --features "$features"
            /tmp/wand-qrc2217-bindgen/bin/wasm-bindgen "$CARGO_TARGET_DIR/wasm32-unknown-unknown/release/ddv_save_core.wasm" --out-dir "/tmp/qrc1954-$mode" --target nodejs --no-typescript
          done
          sha256sum -c /tmp/qrc2217-lock.sha
          node --check tests/qa/qrc1954-switch-makeup-realshape-generated.cjs
          node tests/qa/qrc1954-switch-makeup-realshape-generated.cjs
          node <<'JS'
          const a=require('node:assert/strict'), fs=require('node:fs'), root='/tmp/qrc1954-makeup_eye_mixed/';
          const W=require(root+'ddv_save_core.js').WorkerWasmSource;
          const js=Object.getOwnPropertyNames(W.prototype);
          const wasm=WebAssembly.Module.exports(new WebAssembly.Module(fs.readFileSync(root+'ddv_save_core_bg.wasm'))).map(x=>x.name);
          const five=['preview_switch626_makeup_color1','stage_switch626_makeup_color1','toggle_switch626_makeup_color1','begin_switch626_makeup_color1_output','next_switch626_makeup_color1_output_chunk'];
          for(const f of five){
           a.equal(js.includes(f),false,f+' absent JS');
           a.equal(wasm.includes('workerwasmsource_'+f),false,f+' absent WASM');
          }
          console.log('QRC2217_REAL_WASM_MAKEUP_EYE_MIXED_FIVE_EXPORT_DENIAL_PASS');
          JS
          echo QRC2217_CURRENT_MAIN_NEW_SHARED_WORKER_GENERATED_ABI_AND_INDEPENDENT_REOPEN_PASS

name: QA ONLY PR1536 Wardrobe dual Build OFF routes (never merge)
on:
  pull_request:
    paths:
      - '.github/workflows/qa-qrw-pr1536-wardrobe-off.yml'
permissions:
  contents: read
jobs:
  off-routes:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f5291755d75fcf3de22895ce28d7429dcc95f691
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pin fixed Web and null anchor scope
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 'f5291755d75fcf3de22895ce28d7429dcc95f691'
          test "$(git rev-parse HEAD:src/routes/editor/wardrobe/steam/+page.svelte)" = ba71becc76ad9c4c531465309b72a62ffdbfd8e2
          test "$(git rev-parse HEAD:src/routes/editor/wardrobe/switch/+page.svelte)" = c2f80d35b3cee7ebb2073952cb31f60fb0603206
          test "$(git rev-parse HEAD:src/lib/dev/PlacementProductRoute.svelte)" = 11cb70c60664b9327718409248ebd29868431a4b
          test "$(git rev-parse HEAD:src/lib/dev/LocalPlacementEditorDev.svelte)" = d12f770061e9a17a8fc88d0d5bb7293568bbb4f7
          test "$(git rev-parse HEAD:src/lib/dev/local-placement-copy.mjs)" = 6ba8502e79a27e3d2860374b5e6d0bebde4ff383
          test "$(git rev-parse HEAD:src/lib/dev/product-placement-client.mjs)" = 4ace4cdbd6fa7a8e28872e2dc0cddde4b357cfb7
          test "$(git rev-parse HEAD:src/lib/ddv/core/save/product-scoped-placement-release.mjs)" = 381adcff34bc7d9110e3a47ba26895220bbc92c1
          test "$(git rev-parse HEAD:src/lib/ddv/core/save/product-scoped-wardrobe-release-anchor.mjs)" = f3f12518965dde92617962b5505b8212f4e04980
          test "$(git rev-parse HEAD:src/lib/dev/product-steam-wardrobe.worker.mjs)" = cd12fad9e42487dc3e45531c18a0610d27a95660
          test "$(git rev-parse HEAD:src/lib/dev/product-switch-wardrobe.worker.mjs)" = b1c412fd2b8b0858058200a3e60de9616203efb6
          test "$(git rev-parse HEAD:src/routes/editor/+page.svelte)" = 8081007529fe99eecfb1ba1d0e19d0df6ff4d501
          test -z "$(git ls-files static/worker-wasm-scoped-steam626-wardrobe static/worker-wasm-scoped-switch626-wardrobe)"
      - run: npm ci --no-audit --no-fund
      - name: Independent affected client brand and cross Build denial
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {STEAM_WARDROBE_RELEASE as steam,SWITCH_WARDROBE_RELEASE as sw,getSteamWardrobeMountInfo,getSwitchWardrobeMountInfo} from './src/lib/ddv/core/save/product-scoped-placement-release.mjs';
          import {createProductSteamWardrobePort,createProductSwitchWardrobePort,productPlacementPortScope,placementReadyOk} from './src/lib/dev/product-placement-client.mjs';
          import {PROTECTED_STEAM_WARDROBE_RELEASE_ANCHOR as a,PROTECTED_SWITCH_WARDROBE_RELEASE_ANCHOR as b} from './src/lib/ddv/core/save/product-scoped-wardrobe-release-anchor.mjs';
          assert.equal(a,null);assert.equal(b,null);
          Object.defineProperty(globalThis,'document',{configurable:true,value:{}});
          let constructed=0;Object.defineProperty(globalThis,'Worker',{configurable:true,value:class{constructor(){constructed++;throw Error('unexpected Worker')}}});
          let neg=0;
          for(const [own,other,create,mount] of [[steam,sw,createProductSteamWardrobePort,getSteamWardrobeMountInfo],[sw,steam,createProductSwitchWardrobePort,getSwitchWardrobeMountInfo]]){
            Object.defineProperty(globalThis,'location',{configurable:true,value:new URL('https://dreamwishwand.github.io/web'+own.path+'?enable=true')});
            const scope={releaseId:'a'.repeat(64),operation:own.operation,mode:'private-product-v2',builds:[{platform:own.platform,buildId:own.buildId,productV2EvidenceSha256:null}]};
            const ready={kind:'SCOPED_PLACEMENT_RUNTIME_READY',...scope,writerAuthorized:false};
            assert.equal(placementReadyOk(ready,scope),true); // shape only, not authority
            for(const patch of [{operation:other.operation},{builds:[{...scope.builds[0],platform:other.platform,buildId:other.buildId}]},{mode:'public-accepted'},{mode:'invalid'},{writerAuthorized:true},{releaseId:'b'.repeat(64)},{kind:'OTHER'},{extra:true}]){assert.equal(placementReadyOk({...ready,...patch},scope),false);neg++}
            for(const fake of [ready,Object.freeze({...ready}),{...ready,open(){},dispose(){}}]){assert.equal(productPlacementPortScope(fake),null);neg++}
            const ac=new AbortController();ac.abort();
            for(const options of [{},{anchor:scope,verifiedLocalDevGate:true,workerFactory:()=>{}},{signal:ac.signal},{onFault:1}]){await assert.rejects(create(options));neg++}
            await assert.rejects(mount());neg++;
          }
          assert.equal(neg,32);assert.equal(constructed,0);console.log('QRW1536_WARDROBE_OFF_CLIENT_PASS',JSON.stringify({negative:neg,workerConstructed:constructed,signedPositive:false}));
          NODE
      - name: Build actual static public OFF routes
        env:
          BASE_PATH: /web
        run: |
          set -euo pipefail
          npm run build
          test -f build/editor/wardrobe/steam/index.html
          test -f build/editor/wardrobe/switch/index.html
          test ! -e build/worker-wasm-scoped-steam626-wardrobe
          test ! -e build/worker-wasm-scoped-switch626-wardrobe
      - run: npm install --no-save --package-lock=false playwright-core@1.55.0
      - name: Serve actual static output
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/qrw1536-static"
          ln -s "$PWD/build" "$RUNNER_TEMP/qrw1536-static/web"
          python3 -m http.server 4177 --bind 127.0.0.1 --directory "$RUNNER_TEMP/qrw1536-static" >/tmp/qrw1536-http.log 2>&1 &
          for i in $(seq 1 30);do if curl -fsS http://127.0.0.1:4177/web/editor/wardrobe/steam/ >/dev/null;then exit 0;fi;sleep 1;done
          cat /tmp/qrw1536-http.log;exit 1
      - name: Actual Chrome hydrated 8 locale / fixed routes / inherited OFF smoke
        run: |
          set -euo pipefail
          export CHROME_BIN="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium)"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {chromium} from 'playwright-core';
          import {localPlacementCopy} from './src/lib/dev/local-placement-copy.mjs';
          const root='http://127.0.0.1:4177/web',locales=['en','ja','fr','de','it','es-ES','zh-CN','pt-BR'];
          const browser=await chromium.launch({headless:true,executablePath:process.env.CHROME_BIN,args:['--no-sandbox','--disable-dev-shm-usage']});
          let checked=0,localeChecked=0,prior=0;
          try{
            for(const locale of locales){
              const ctx=await browser.newContext({locale});
              await ctx.addInitScript(code=>{window.__workers=0;window.Worker=new Proxy(window.Worker,{construct(t,a,n){window.__workers++;return Reflect.construct(t,a,n)}});localStorage.setItem('dreamwishwand-locale-manual-v1',code);for(const k of ['verifiedLocalDevGate','productSteamWardrobeEnabled','productSwitchWardrobeEnabled','productPlacementEnabled'])localStorage.setItem(k,'true')},locale);
              const page=await ctx.newPage(),errors=[],requests=[];page.on('pageerror',e=>errors.push(String(e)));page.on('request',r=>{if(r.url().includes('/worker-wasm-scoped-'))requests.push(r.url())});
              const hydrate=async()=>{await page.waitForFunction(l=>document.documentElement.dataset.locale===l,locale);await page.waitForLoadState('networkidle')};
              const off=async(op,title)=>{await hydrate();const route=page.locator('[data-placement-product-route="'+op+'"]');assert.equal(await route.getAttribute('data-placement-scope'),'off');assert.equal(await route.locator('input[type=file]').count(),0);assert.equal(await route.locator('[data-dev-placement]').count(),0);assert.equal(await route.locator('[role=status]').count(),1);if(title)assert.equal((await route.locator('h1').innerText()).trim(),title.split(' — ')[0]);assert.equal(await page.evaluate(()=>window.__workers),0);checked++};
              for(const platform of ['steam','switch']){
                const op='wardrobe-'+platform,title=localPlacementCopy(locale)[platform==='steam'?'wardrobeSteamTitle':'wardrobeSwitchTitle'];
                const path='/editor/wardrobe/'+platform+'/';
                const r=await page.goto(root+path+'?enable=true&mode=public-accepted&platform='+(platform==='steam'?'switch':'steam-windows')+'&operation='+ (platform==='steam'?'wardrobe-switch':'wardrobe-steam'));
                assert.equal(r.status(),200);await off(op,title);localeChecked++;
                if(locale==='en'){await page.reload();await off(op,title);const r2=await page.goto(root+path+'?mode=invalid&build=foreign#writer');assert.equal(r2.status(),200);await off(op,title)}
              }
              if(locale==='en'){
                const h=await page.goto(root+'/editor/');assert.equal(h.status(),200);await hydrate();assert.equal(await page.locator('a[href*="/editor/wardrobe/"]').count(),0);
                for(const [p,op] of [['world/comp03/','comp03'],['world/vase/','vase'],['backpack/steam/','backpack-steam'],['backpack/switch/','backpack-switch']]){const r=await page.goto(root+'/editor/'+p);assert.equal(r.status(),200);await off(op);prior++}
              }
              assert.deepEqual(errors,[]);assert.deepEqual(requests,[]);await ctx.close();
            }
            assert.equal(localeChecked,16);assert.equal(prior,4);console.log('QRW1536_WARDROBE_OFF_CHROME_PASS',JSON.stringify({routeChecks:checked,localeChecks:localeChecked,priorOffSmoke:prior,workers:0,scopedRequests:0,pageErrors:0,hubLink:false,signedPositive:false}));
          }finally{await browser.close()}
          NODE

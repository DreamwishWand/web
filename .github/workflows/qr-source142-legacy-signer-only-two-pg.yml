name: 04 QR Source142 Legacy Media Signer independent local SQL 2PG
on:
  pull_request:
    paths:
      - 'tests/qr-source142-legacy-signer-only-two-pg.py'
      - '.github/workflows/qr-source142-legacy-signer-only-two-pg.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local-signer-only:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DDVRE_PRIVACY_ISOLATED_LOCAL: CONFIRMED
      DATABASE_URL: ''
      SUPABASE_ACCESS_TOKEN: ''
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Pin source tree, exact SQL and unchanged Edge authorization path
        run: |
          set -euo pipefail
          test -z "$DATABASE_URL" && test -z "$SUPABASE_ACCESS_TOKEN"
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(find supabase/migrations -maxdepth 1 -name '*.sql' | wc -l)" -eq 142
          test "$(git hash-object supabase/migrations/20261025003060_r19_legacy_media_signer_authority.sql)" = "b7563d68348f27591a20a98760534fa7d399b160"
          python3 - <<'PY'
          from pathlib import Path
          t=Path('supabase/functions/community-media/index.ts').read_text()
          start=t.index("if (action === 'read' || action === 'galleryReadBytes')")
          v=t[start:]
          guard=v.index("'community_preset_storage_assert_media_not_quarantined_r19'")
          gallery=v.index("'community_gallery_owner_media_read_v1'")
          legacy=v.index("'community_get_media_storage_key'")
          signed=v.index('.createSignedUrl(media.storageKey, 300)')
          assert guard<gallery<legacy<signed
          judge=t.index("if (action === 'dreamsnapJudgeRead')")
          assert judge<start
          assert "'community_get_dreamsnap_judge_media_storage_v1'" in t[judge:start]
          src=Path('supabase/migrations/20261025003060_r19_legacy_media_signer_authority.sql').read_text()
          assert src.index('private.resolve_active_account')<src.index('private.can_access_entity')<src.index('community_preset_storage_assert_media_not_quarantined_r19')<src.index("from public.media_assets")
          PY
      - uses: supabase/setup-cli@v1
        with:
          version: 2.81.3
      - name: Bootstrap disposable exact Source142 PostgreSQL
        run: |
          set -euo pipefail
          printf 'project_id = "ddvre_qr142_legacy_media_local"\n' | cat - supabase/config.toml >/tmp/qr142-supabase.toml
          mv /tmp/qr142-supabase.toml supabase/config.toml
          timeout 1500s supabase start >/tmp/qr142-start.log 2>&1 || { tail -n 80 /tmp/qr142-start.log; exit 1; }
      - name: Execute new-only Legacy SQL Owner B Moderator Privacy Retired Historical and unaffected 2 PG
        run: |
          set -euo pipefail
          python3 -m pip install --quiet 'psycopg[binary]>=3.2,<4'
          python3 tests/qr-source142-legacy-signer-only-two-pg.py
      - name: Destroy local stack
        if: always()
        run: supabase stop --no-backup || true

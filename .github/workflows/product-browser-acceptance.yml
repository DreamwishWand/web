name: Product primary-job browser acceptance

on:
  push:
    branches: ['dev/product-surfaces-*']
    paths:
      - '.github/workflows/product-browser-acceptance.yml'
      - 'scripts/product-primary-job-browser-acceptance.mjs'
      - 'src/routes/+page.svelte'
      - 'src/routes/moodboards/**'
      - 'src/routes/collection/**'
      - 'src/routes/guide/**'
      - 'src/routes/explore/**'
      - 'src/routes/presets/**'
      - 'src/lib/product-home/**'
      - 'src/lib/moodboards/**'
      - 'src/lib/collection/**'
      - 'src/lib/guide/**'
      - 'src/lib/explore/**'
      - 'src/lib/presets/**'
      - 'static/ddv/collection/**'
      - 'static/ddv/guide/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - name: Install browser driver library only
        run: npm install --no-save --package-lock=false playwright-core@1.55.0
      - name: Install CJK fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-cache -f
      - name: Resolve system Chrome
        id: chrome
        shell: bash
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          echo "path=$CHROME_BIN" >> "$GITHUB_OUTPUT"
          "$CHROME_BIN" --version
      - name: Start local Product tree
        shell: bash
        run: |
          set -euo pipefail
          npm run dev -- --host 127.0.0.1 --port 4174 > /tmp/product-vite.log 2>&1 &
          echo $! > /tmp/product-vite.pid
          for i in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:4174/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/product-vite.log
          exit 1
      - name: Run Product primary-job browser acceptance
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.path }}
          PRODUCT_BASE_URL: http://127.0.0.1:4174
        run: node scripts/product-primary-job-browser-acceptance.mjs
      - name: Upload Product acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: product-primary-job-browser-acceptance
          path: .artifacts/product-browser/
          if-no-files-found: error

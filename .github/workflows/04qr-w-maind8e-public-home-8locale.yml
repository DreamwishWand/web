name: "04QR-W protected main d8e deployed Pages Home 8-locale visible BODY"
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/04qr-w-maind8e-public-home-8locale.mjs'
      - '.github/workflows/04qr-w-maind8e-public-home-8locale.yml'
permissions:
  contents: read
jobs:
  actual-published-github-pages-chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm install --no-save --package-lock=false playwright-core@1.55.0
      - name: Require installed real system Chrome, not synthetic HTML
        shell: bash
        run: |
          set -euo pipefail
          BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$BIN" || { echo "NOT_RUN: real Chrome absent"; exit 1; }
          "$BIN" --version
          echo "CHROME_BIN=$BIN" >> "$GITHUB_ENV"
      - name: Public CDN direct HTTP and real eight-locale Home/Help BODY current-main smoke
        shell: bash
        run: |
          set -euo pipefail
          test -z "${WEP_PRIVATE_P1G_PATH:-}"
          test -z "${WEP_PRIVATE_LOCAL_ONLY_ACK:-}"
          test -z "${WEP_PRIVATE_EXTERNAL_BUILD_CONFIRMED:-}"
          node scripts/04qr-w-maind8e-public-home-8locale.mjs

name: 04 QR-S ACT1774 PR2303 C312 Bridge one pin changed-only L2 QA ONLY
on:
  push:
    branches:
      - '04qrs/act1774-pr2303-c312-current-bridge-one-pin-l2'
    paths:
      - '.github/workflows/04qrs-act1774-pr2303-c312-bridge-one-pin-l2.yml'
permissions:
  contents: read
jobs:
  bridge-sha-closed-world-negative:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Frozen source one-pin SHA and Git object negative refutation
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'QRS_C312_JS'
          import assert from 'node:assert/strict';
          import {spawnSync} from 'node:child_process';
          import {mkdtempSync,rmSync} from 'node:fs';
          import {tmpdir} from 'node:os';
          import {join} from 'node:path';
          const source='c312682f8867aa7b9eb7b3e5f2718610dc35612f';
          const previous='0ade5a354bc66d3a2fa6fb50a4ce333aad409452';
          const main='5ac76e59f67b3f14e1dbfe0ef0fe0745ac428468';
          const bridge='src/lib/ddv/core/save/p1g-rust-worker-readonly-bridge.mjs';
          const oldBridge='3893195fe0b675a80cab36ec788be4ac756a3ac5';
          const newBridge='f76418235f302c2cdcc52de7f4b771e4c6f193f6';
          const pages='.github/workflows/pages.yml';
          const test='tests/scoped-steam-chest-proof-workflow.test.mjs';
          const temp=mkdtempSync(join(tmpdir(),'qrs-act1774-bridge-'));
          const repo=join(temp,'repo');
          const env={...process.env,GIT_CONFIG_GLOBAL:'/dev/null',GIT_CONFIG_NOSYSTEM:'1',
           GIT_NO_REPLACE_OBJECTS:'1',GIT_TERMINAL_PROMPT:'0',
           GIT_AUTHOR_NAME:'04 QR-S isolated',GIT_AUTHOR_EMAIL:'qrs@example.invalid',
           GIT_COMMITTER_NAME:'04 QR-S isolated',GIT_COMMITTER_EMAIL:'qrs@example.invalid'};
          const call=(args,extra={})=>spawnSync('git',args,{cwd:repo,env:{...env,...extra.env},
           input:extra.input,encoding:'utf8',timeout:90000,maxBuffer:12*1024*1024});
          const git=(...args)=>{const x=call(args);assert.equal(x.status,0,args.join(' ')+':'+x.stderr);return x.stdout.trim()};
          const entry=(tree,path)=>git('ls-tree',tree,'--',path);
          const put=s=>{const x=call(['hash-object','-w','--stdin'],{input:s});assert.equal(x.status,0,x.stderr);return x.stdout.trim()};
          let count=0;
          const alter=(mode,sha,extra=[])=>{
           const index=join(temp,'index'+(++count));
           const exec=args=>{const x=call(args,{env:{GIT_INDEX_FILE:index}});assert.equal(x.status,0,x.stderr);return x.stdout.trim()};
           exec(['read-tree',source+'^{tree}']);
           if(sha===null)exec(['update-index','--force-remove','--',bridge]);
           else exec(['update-index','--add','--cacheinfo',mode,sha,bridge]);
           for(const [path,m,s] of extra)exec(['update-index','--add','--cacheinfo',m,s,path]);
           return exec(['write-tree']);
          };
          try{
           const c=spawnSync('git',['clone','--no-hardlinks','--no-checkout','-q',process.cwd(),repo],
           {cwd:process.cwd(),env,encoding:'utf8',timeout:90000});
           assert.equal(c.status,0,c.stderr);
           assert.equal(git('rev-parse',source+'^1'),main);
           assert.equal(git('rev-parse',source+'^2'),previous);
           assert.equal(git('rev-parse','HEAD^'),source);
           assert.deepEqual(git('diff','--name-only',source,'HEAD').split('\n'),
            ['.github/workflows/04qrs-act1774-pr2303-c312-bridge-one-pin-l2.yml']);
           assert.deepEqual(git('diff','--name-only',main,source).split('\n'),[pages,test]);
           assert.equal(git('rev-parse',source+':'+pages),'7dfb41f48cdc2156c01479048caf6365b6854cac');
           assert.equal(git('rev-parse',source+':'+test),'67a1d82155467ebf10f6876b7078e0d420221399');
           assert.equal(entry(main,bridge),'100644 blob '+newBridge+'\t'+bridge);
           const readProof=rev=>{
             const y=git('show',rev+':'+pages);
             const a=y.indexOf('  scoped_steam_chest_proof:\n'), b=y.indexOf('  scoped_sr03_proof:\n');
             assert.ok(a>=0&&b>a);
             const proof=y.slice(a,b);
             const pins=[...proof.matchAll(/test "\$\(git rev-parse HEAD:([^)]*)\)" = ([a-f0-9]{40})/g)].map(m=>[m[1],m[2]]);
             return {y,proof,pins};
           };
           const fixed=readProof(source),older=readProof(previous);
           assert.equal(fixed.pins.length,25);
           assert.equal(new Set(fixed.pins.map(x=>x[0])).size,25);
           assert.equal(older.pins.length,25);
           const changes=fixed.pins.map((p,i)=>({i,before:older.pins[i],after:p})).filter(x=>x.before[0]!==x.after[0]||x.before[1]!==x.after[1]);
           assert.deepEqual(changes,[{i:15,before:[bridge,oldBridge],after:[bridge,newBridge]}]);
           assert.deepEqual(fixed.proof.replace(newBridge,oldBridge),older.proof,
             'scoped signed trust job has only one new Bridge SHA compared to previous 25-pin contract');
           assert.equal(git('show',source+':'+test).replace(newBridge,oldBridge),
             git('show',previous+':'+test),'test source differs only by matching Bridge SHA');
           const helper='src/lib/dev/product-amount-release-v2-evidence.mjs';
           assert.deepEqual(fixed.pins.find(x=>x[0]===helper),[helper,'6fb10799fbb4eea54def1712c7eed42c6bef321f']);
           assert.ok(fixed.proof.includes('test "$(git ls-tree HEAD -- '+helper+" | awk '{print $1}')"+'" = 100644'));
           assert.ok(fixed.proof.includes('test "$WAND_PROOF_EXPECTED_SOURCE" = "$GITHUB_SHA"'));
           assert.ok(fixed.proof.includes('test "$GITHUB_WORKFLOW_SHA" = "$GITHUB_SHA"'));
           assert.ok(fixed.proof.includes('test "$GITHUB_REF" = refs/heads/main'));
           assert.ok(fixed.proof.includes('test "$GITHUB_REPOSITORY_ID" = 1371485649'));
           assert.ok(fixed.proof.includes('node scripts/int-protected-ci-gate.mjs build'));
           assert.ok(fixed.proof.includes('node scripts/int-protected-ci-gate.mjs deploy'));
           assert.ok(fixed.proof.includes('actions/attest-build-provenance@v2'));
           assert.ok(!/actions\/(?:deploy-pages|upload-pages-artifact)@|permissions:/.test(fixed.proof));
           const upload=fixed.proof.slice(fixed.proof.indexOf('actions/upload-artifact@v4'));
           assert.match(upload,/wand-steam-chest-proof\/pins.json/);
           assert.match(upload,/wand-steam-chest-proof\/attestation-bundle.jsonl/);
           assert.doesNotMatch(upload,/ddv_save_core|fixtures\/scoped-steam-chest|static\/|build\//);
           const compare=(tree,pins)=>{for(const [path,sha] of pins){
             const wanted=(path==='crates/ddv-save-core'?'040000 tree ':'100644 blob ')+sha+'\t'+path;
             assert.equal(entry(tree,path),wanted,'QRS_SHA_MODE_'+path);
           }};
           compare(source,fixed.pins);
           compare(main,fixed.pins);
           console.log('QRS_ACT1774_C312_SOURCE_AND_MAIN_25OF25_SHA_MODE_PASS');
           const original=git('show',main+':'+bridge);
           assert.ok(original.includes('Uint8Array.prototype.fill.call(chunk,0)'),
             'accepted new Rust chunk zeroize source identity present');
           const variants=[
            ['BRIDGE_BYTE_TAMPER','100644',put(original+'\n// synthetic tampered byte\n')],
            ['BRIDGE_EXECUTABLE','100755',newBridge],
            ['BRIDGE_SYMLINK','120000',put('./not-reviewed.mjs')],
            ['BRIDGE_MISSING',null,null],
            ['BRIDGE_STALE_BLOB','100644',oldBridge]
           ];
           for(const [label,mode,sha] of variants){
             const t=alter(mode,sha);
             assert.throws(()=>compare(t,fixed.pins),/QRS_SHA_MODE_/,
                'frozen signer must reject '+label);
             console.log('QRS_ACT1774_C312_REJECT_'+label);
           }
           const spoofBlob=put(fixed.y.replace(newBridge,variants[0][2]));
           const spoofTree=alter('100644',variants[0][2],[[pages,'100644',spoofBlob]]);
           assert.notEqual(entry(spoofTree,pages),entry(source,pages),
             'candidate self-authorization requires modified unaccepted signer Source');
           assert.throws(()=>compare(spoofTree,fixed.pins),/QRS_SHA_MODE_/);
           assert.ok(fixed.proof.includes('test "$GITHUB_WORKFLOW_SHA" = "$GITHUB_SHA"'));
           console.log('QRS_ACT1774_C312_REJECT_CANDIDATE_SELF_AUTHORIZED_WORKFLOW');
           console.log('QRS_ACT1774_C312_CHANGED_ONE_SECURITY_L2_PASS',JSON.stringify({
             protectedMain:main,fixedSource:source,oldSource:previous,immutablePins:25,
             onlyChangedPin:bridge,negativeVariants:variants.length+1,
             exclusiveProofDispatch:'NOT_RUN',productOwnerGenuineV2:'NOT_RUN',
             signerIssued:false,writerOn:false,sourceCodeChanged:false}));
          }finally{rmSync(temp,{recursive:true,force:true})}
          QRS_C312_JS
      - name: No signing, deploy, private Save, Writer or operation ON
        run: |
          echo 'QRS_ACT1774_C312_CHANGED_ONLY_L2_FOCUS_DONE_QA_ONLY_NEVER_MERGE'
          echo 'Genuine official Owner encrypted edited-copy independent process V2 NOT_RUN'

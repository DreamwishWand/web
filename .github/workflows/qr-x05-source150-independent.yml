name: QR Source150 Independent Full150 2PG Security
on:
  push:
    branches: ['qr/x05-source150-independent-20261028']
  pull_request:
    branches: ['feature/03comm-x05-private-owner-service-20261028']
permissions:
  contents: read
jobs:
  independent-source150:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DDVRE_PRIVACY_ISOLATED_LOCAL: CONFIRMED
      DATABASE_URL: ''
      SUPABASE_ACCESS_TOKEN: ''
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify frozen exact Source150 and no Owner source edits
        run: |
          set -euo pipefail
          test -z "$DATABASE_URL" && test -z "$SUPABASE_ACCESS_TOKEN"
          git merge-base --is-ancestor 4117d98666a3c3c2ae5891c043e9a83756f92fdc HEAD
          test "$(git hash-object supabase/migrations/20261028000030_x05_authenticated_owner_service_v1.sql)" = 85e9de1874ca489133fd39be522f57ee1cfac6ab
          test -z "$(git diff --name-only 4117d98666a3c3c2ae5891c043e9a83756f92fdc HEAD -- supabase src)"
          node --test tests/qr-x05-source150-independent.test.mjs
      - uses: supabase/setup-cli@v1
        with:
          version: 2.81.3
      - name: Disposable actual full150 PostgreSQL local-only
        run: |
          set -euo pipefail
          printf 'project_id = "ddvre_qr150_independent_disposable"\n' | cat - supabase/config.toml > /tmp/qr150-config.toml
          mv /tmp/qr150-config.toml supabase/config.toml
          timeout 1500s supabase start -x edge-runtime --debug >/tmp/qr150-start.log 2>&1 || { tail -120 /tmp/qr150-start.log; exit 1; }
      - run: python3 -m pip install --quiet 'psycopg[binary]==3.2.10'
      - name: Independently verify JWT GUC security, definer privileges, two real DB sessions
        run: |
          set -euo pipefail
          python3 tests/qr-x05-source150-two-pg-independent.py 2>&1 | tee /tmp/qr150-independent.log
          grep -q QR150_INDEPENDENT_FULL150_LOCAL_COMPLETE /tmp/qr150-independent.log
      - name: Isolated synthetic QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qr150-independent-local-synthetic
          path: /tmp/qr150-independent.log
          if-no-files-found: warn
      - name: Diagnostic only
        if: failure()
        run: tail -120 /tmp/qr150-start.log || true

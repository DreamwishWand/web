name: 05 QR-C PR1201 independent diagonal tranche A
on:
  pull_request:
    paths:
      - 'tests/qa/05qrc-pr1201-diagonal.py'
      - '.github/workflows/05qrc-pr1201-diagonal.yml'
permissions:
  contents: read
jobs:
  independent:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
      - name: Exact child2 and QA-only2
        run: |
          source=8c23466aafa6a5c2437bfcfe792382811c0536f3
          test "$(git merge-base "$source" HEAD)" = "$source"
          test "$(git diff --name-only "$source" HEAD | wc -l)" -eq 2
          test "$(git diff --diff-filter=A --name-only "$source" HEAD | wc -l)" -eq 2
          test "$(git rev-parse HEAD:crates/ddv-save-core/src/bin/wand-local-rust-v2-noop.rs)" = 213d73aded9d3787c2990e61223b096b22154b48
          test "$(git rev-parse HEAD:crates/ddv-save-core/src/switch624_fence_fe01.rs)" = 98deab96a3a1846adb49ad448525cd73b00a1fa4
          test "$(git rev-parse HEAD:tests/qa/05qrc-pr1201-diagonal.py)" = b225c48573ee718d5419e389b054f26f8b2becab
      - name: Locked native independent lexical and affected regressions
        run: |
          git show 08fd6694ec95ad2c6d648722f8e8c204b6115f9d:scripts/wasm-distribution/approved-Cargo.lock > crates/ddv-save-core/Cargo.lock
          echo 'e58486d673df79bfe7e72b80449e39389e57010fe4051edcdcff9b53c2da898c  crates/ddv-save-core/Cargo.lock' | sha256sum -c -
          cargo build --locked --manifest-path crates/ddv-save-core/Cargo.toml --no-default-features --features private-native-v2,semantic-writer-dev --bin wand-local-rust-v2-noop
          python3 tests/qa/05qrc-pr1201-diagonal.py crates/ddv-save-core/target/debug/wand-local-rust-v2-noop
          cargo test --locked --manifest-path crates/ddv-save-core/Cargo.toml --no-default-features --features semantic-writer-dev --lib switch624_fence_fe01

name: 05 QR-C PR1217 independent Switch626 FD01
on:
  pull_request:
    paths:
      - 'tests/qa/05qrc-pr1217-fd01.py'
      - '.github/workflows/05qrc-pr1217-fd01.yml'
permissions:
  contents: read
jobs:
  independent:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
      - name: Exact child2 and QA-only2
        run: |
          source=59c297219319ae3f80195ea950cb1261794faf6d
          test "$(git merge-base "$source" HEAD)" = "$source"
          test "$(git diff --name-only "$source" HEAD | wc -l)" -eq 2
          test "$(git diff --diff-filter=A --name-only "$source" HEAD | wc -l)" -eq 2
          test "$(git rev-parse HEAD:crates/ddv-save-core/src/bin/wand-local-rust-v2-noop.rs)" = 0e5ba8c13248c9b5d3fd1dd7d41f082b4001da73
          test "$(git rev-parse HEAD:crates/ddv-save-core/src/switch624_fence_fe01.rs)" = 41b15a7603a077d2e7eeae0a7a7014e87f13fcff

      - name: Locked native independent lexical and affected regressions
        run: |
          git show 08fd6694ec95ad2c6d648722f8e8c204b6115f9d:scripts/wasm-distribution/approved-Cargo.lock > crates/ddv-save-core/Cargo.lock
          echo 'e58486d673df79bfe7e72b80449e39389e57010fe4051edcdcff9b53c2da898c  crates/ddv-save-core/Cargo.lock' | sha256sum -c -
          cargo build --locked --manifest-path crates/ddv-save-core/Cargo.toml --no-default-features --features private-native-v2,semantic-writer-dev --bin wand-local-rust-v2-noop
          python3 tests/qa/05qrc-pr1217-fd01.py crates/ddv-save-core/target/debug/wand-local-rust-v2-noop
          cargo test --locked --manifest-path crates/ddv-save-core/Cargo.toml --no-default-features --features semantic-writer-dev --lib switch624_fence_fe01

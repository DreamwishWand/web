name: "04 QR-W PR751 host404 contract independent source-only privacy"
on:
  pull_request:
    paths:
      - ".github/workflows/04qr-w-pr751-host404-independent.yml"
      - "tests/04qr-w-pr751-host404-independent.test.mjs"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  independent-host-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Exact Source3 Git blobs and spec-only failclosed HTTPS/privacy acceptance negatives
        run: node --test tests/04qr-w-pr751-host404-independent.test.mjs

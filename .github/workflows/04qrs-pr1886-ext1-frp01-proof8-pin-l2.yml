name: "[04 QR-S][ACT1530] PR1886 EXT1 FRP01 Proof8 pin L2 (QA ONLY)"
on:
  pull_request:
    paths:
      - '.github/workflows/04qrs-pr1886-ext1-frp01-proof8-pin-l2.yml'
permissions:
  contents: read
jobs:
  focus:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 0fe2aba5d5783b30b7a3beb60ac88c2dfaa76dd6
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reuse unchanged core/product tests
        run: |
          set -euo pipefail
          node --test tests/scoped-collection-proof-workflow.test.mjs tests/scoped-steam-chest-proof-workflow.test.mjs tests/scoped-switch-chest-proof-workflow.test.mjs
      - name: Changed only independent negative and pin checks
        run: |
          set -euo pipefail
          cat > qa-independent.mjs <<'EOF'
          import assert from 'node:assert/strict';
          import {execFileSync} from 'node:child_process';
          const g=(...a)=>execFileSync('git',a,{encoding:'utf8',maxBuffer:16*1024*1024}).trim(),raw=(r,p)=>execFileSync('git',['show',r+':'+p],{encoding:'utf8',maxBuffer:16*1024*1024});
          const head='0fe2aba5d5783b30b7a3beb60ac88c2dfaa76dd6',base='1c6240aa2c4b0633fb3c748ca2e3fd69c0225c83';
          assert.equal(g('rev-parse','HEAD'),head);assert.equal(g('rev-parse','HEAD^'),base);
          const paths=g('diff','--name-only',base,head).split('\n');assert.equal(paths.length,7);
          const rust=['crates/ddv-save-core/src/fence_add_shape.rs','crates/ddv-save-core/src/switch624_fence_fe01.rs'];for(const p of rust)assert.ok(paths.includes(p));
          const pins=paths.filter(p=>!rust.includes(p));assert.equal(pins.length,5);const wf='.github/workflows/pages.yml';assert.ok(pins.includes(wf));
          const oldCore='9d779873e935cbdd7b1b11b372a318af7ebc68b5',newCore='63d1b9f88a07c79c54cb433f4d1cbd9cf1e1ed4b';assert.equal(g('rev-parse',head+':crates/ddv-save-core'),newCore);
          let count=0,pos=0,neg=0;
          for(const p of pins){const before=raw(base,p),after=raw(head,p);assert.notEqual(before,after);
           const hits=after.split(newCore).length-1;assert.ok(hits>0);assert.equal(after.replaceAll(newCore,oldCore),before);count+=hits;pos++;assert.notEqual(after.replace(newCore,'e'+newCore.slice(1)),after);neg++;
          }
          assert.equal(count,17);
          const y=raw(head,wf),old=raw(base,wf),sections=s=>[...s.matchAll(/^  (scoped_[a-z0-9_]+_proof):\n/gm)].map(x=>({n:x[1],at:x.index})).map((x,i,a)=>({name:x.n,body:s.slice(x.at, i+1<a.length?a[i+1].at:s.length)}));
          const newSec=sections(y),oldSec=sections(old);assert.equal(newSec.length,8);assert.deepEqual(newSec.map(x=>x.name),oldSec.map(x=>x.name));
          const getPins=s=>[...s.matchAll(/test "\$\(git rev-parse HEAD:([^)]+)\)" = ([0-9a-f]{40})/g)].map(m=>[m[1],m[2]]);
          let newPins=0,changedPins=0;
          for(let i=0;i<8;i++){const curr=getPins(newSec[i].body),oldp=getPins(oldSec[i].body);assert.equal(curr.length,oldp.length);for(let j=0;j<curr.length;j++){assert.equal(curr[j][0],oldp[j][0]);if(curr[j][0]==='crates/ddv-save-core'){assert.equal(curr[j][1],newCore);assert.equal(oldp[j][1],oldCore);changedPins++;}else{assert.equal(curr[j][1],oldp[j][1]);}newPins++}pos++;}
          assert.equal(changedPins,8);assert.equal(newPins,252);
          // Counterexamples for stale Core, protected CI, issuer and subjects.
          for(const section of newSec){
           const pinList=getPins(section.body);
           assert.equal(pinList.filter(([path])=>path==='crates/ddv-save-core').length,1);
           assert.equal(pinList.find(([path])=>path==='crates/ddv-save-core')[1],newCore);
           assert.notEqual(pinList.find(([path])=>path==='crates/ddv-save-core')[1],oldCore);neg++;
           for(const fragment of ['node scripts/int-protected-ci-gate.mjs build','node scripts/int-protected-ci-gate.mjs deploy','actions/attest-build-provenance@v2','actions/upload-artifact@v4'])assert.ok(section.body.includes(fragment),fragment);
           assert.doesNotMatch(section.body,/actions\/(?:deploy-pages|upload-pages-artifact)@|seal-private-v2/);
           const sub=section.body.slice(section.body.indexOf('subject-path: |'),section.body.indexOf('      - name: Verify exact signer'));
           assert.equal([...sub.matchAll(/ddv_save_core(?:_bg)?\.(?:js|wasm)|manifest\.json/g)].length,3);
           const upload=section.body.slice(section.body.indexOf('actions/upload-artifact@v4'));
           assert.match(upload,/pins\.json/);
           assert.match(upload,/attestation-bundle\.jsonl/);
           assert.doesNotMatch(upload,/ddv_save_core|fixtures\/scoped-|static\/|build\//);
          }
          assert.equal(raw(head,'scripts/wasm-distribution/protected-release-inputs.json'),raw(base,'scripts/wasm-distribution/protected-release-inputs.json'));
          assert.equal(raw(head,'scripts/readonly-release/scoped-placement-proof.mjs'),raw(base,'scripts/readonly-release/scoped-placement-proof.mjs'));
          assert.equal(raw(head,'src/lib/ddv/core/save/product-scoped-appearance-release-anchor.mjs'),raw(base,'src/lib/ddv/core/save/product-scoped-appearance-release-anchor.mjs'));
          assert.equal(g('rev-parse',head+':scripts/wasm-distribution/r22-accepted-rust-scope.mjs'),g('rev-parse',base+':scripts/wasm-distribution/r22-accepted-rust-scope.mjs'));pos++;
          assert.equal(g('rev-parse',head+':scripts/wasm-distribution/approved-Cargo.lock'),g('rev-parse',base+':scripts/wasm-distribution/approved-Cargo.lock'));pos++;
          for(const p of paths.filter(p=>p.startsWith('tests/'))){assert.ok(raw(head,p).includes(newCore));neg++}
          console.log('QRS_PR1886_EXT1_FRP01_PROOF8_PIN_L2_PASS',JSON.stringify({pos,neg,paths:7,pinPaths:5,swaps:17,pins:newPins,changed:changedPins,unchanged:newPins-changedPins,oldCore,newCore,protectedAcceptance:false,actualSignature:false}));
          EOF
          node qa-independent.mjs

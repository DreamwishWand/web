name: 05 QR PR398 independent Collection UNKNOWN and local PC preset import
on:
  push:
    branches: [qa/05qr-pr398-item-preset-20261104]
  pull_request:
    paths:
      - '.github/workflows/qa-pr398-item-preset.yml'
      - 'tests/qa-05qr-pr398-new-only.test.mjs'
      - 'scripts/05qr-pr398-local-preset-browser.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  independent-synthetic-pc:
    runs-on: ubuntu-24.04
    timeout-minutes: 19
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Fixed PR398 no product diff and separate Source624/626
        run: |
          test "$(git merge-base 8f0682999b559e125e0b8aed6ead8a7411cb321d HEAD)" = 8f0682999b559e125e0b8aed6ead8a7411cb321d
          git diff --quiet 8f0682999b559e125e0b8aed6ead8a7411cb321d HEAD -- src/ docs/ tests/01d-local-item-overlay-read-contract.test.mjs tests/01d-native-preset-local-file-import-contract.test.mjs
          echo PRIVATE_GAME_SAVE=NOT_RUN
          echo PRODUCT_WRITER_AND_PROVIDER=OFF
          echo NATIVE_TOM_FORMAT=NOT_ACCEPTED
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm ci --no-audit --no-fund
      - name: Independent 01D reference UNKNOWN/UTF8/rights/local Source fail closed
        run: node --test tests/qa-05qr-pr398-new-only.test.mjs
      - name: Build real /web adapter-static
        env: { BASE_PATH: '/web' }
        run: |
          npm run check
          npm run build
          test -f build/presets/index.html
      - run: npm install --no-save --package-lock=false playwright-core@1.55.0
      - name: Find Chromium
        id: chrome
        run: |
          CHROME_BIN="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          echo "path=$CHROME_BIN" >> "$GITHUB_OUTPUT"
      - name: Local isolated Vite dev
        run: |
          npm run dev -- --host 127.0.0.1 --port 4251 > /tmp/qr398-dev.log 2>&1 &
          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:4251/presets/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/qr398-dev.log
          exit 1
      - name: Real Chrome local Import/Backup/ToM denial no Upload
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.path }}
          QR398_URL: http://127.0.0.1:4251
          QR398_MODE: dev
        run: node scripts/05qr-pr398-local-preset-browser.mjs
      - name: Serve static /web exact compiled output
        run: |
          node scripts/01a-pages-base-static-server.mjs > /tmp/qr398-pages.log 2>&1 &
          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:4181/web/presets/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/qr398-pages.log
          exit 1
      - name: Real Chrome compiled /web static local preset import/export
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.path }}
          QR398_URL: http://127.0.0.1:4181/web
          QR398_MODE: pages-web
        run: node scripts/05qr-pr398-local-preset-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-pr398-local-pc-preset-browser-synthetic
          path: .artifacts/05qr-pr398/
          if-no-files-found: ignore

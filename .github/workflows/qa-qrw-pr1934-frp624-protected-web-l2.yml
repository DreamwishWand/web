name: QA ONLY PR1934 FRP624 protected Web exact15JS24WASM L2
on:
  pull_request:
    paths:
      - '.github/workflows/qa-qrw-pr1934-frp624-protected-web-l2.yml'
permissions:
  contents: read
jobs:
  frp-protected:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CARGO_TARGET_DIR: /tmp/qrf-rust-target
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2d3eb658e87a6eaa8cd641ed3c921078177eba59
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fixed repaired Rust Source4 and fixed product Web Source21 generated own/off WASM
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '2d3eb658e87a6eaa8cd641ed3c921078177eba59'
          git diff --name-only c27e34dd1528405c71e6ba109a06018601859384 HEAD | LC_ALL=C sort > /tmp/qrf-core.actual
          cat >/tmp/qrf-core.expected <<'E'
          crates/ddv-save-core/Cargo.toml
          crates/ddv-save-core/src/semantic_writer.rs
          crates/ddv-save-core/src/wasm_worker.rs
          crates/ddv-save-core/src/worker_session.rs
          E
          diff -u /tmp/qrf-core.expected /tmp/qrf-core.actual
          git cat-file -e 2349b51ac7d59d36f6ff21418de3ee86ea3afcdf^{commit} || git fetch --no-tags origin 2349b51ac7d59d36f6ff21418de3ee86ea3afcdf
          git worktree add --detach /tmp/qrf-web 2349b51ac7d59d36f6ff21418de3ee86ea3afcdf
          test "$(git -C /tmp/qrf-web rev-parse HEAD)" = '2349b51ac7d59d36f6ff21418de3ee86ea3afcdf'
          git -C /tmp/qrf-web diff --name-only 753b50252880cb96b4b9019cbf7cee149abdc132 HEAD | LC_ALL=C sort >/tmp/qrf-web.actual
          cat >/tmp/qrf-web.expected <<'E'
          src/lib/ddv/core/save/p1g-rust-worker-readonly-bridge.mjs
          src/lib/ddv/core/save/product-scoped-amount-local-adapter.mjs
          src/lib/ddv/core/save/product-scoped-frp01-release-anchor.mjs
          src/lib/ddv/core/save/product-scoped-placement-release.mjs
          src/lib/ddv/core/save/product-wasm-read-owner.d.mts
          src/lib/ddv/core/save/product-wasm-read-owner.mjs
          src/lib/dev/LocalPlacementEditorDev.svelte
          src/lib/dev/PlacementProductRoute.svelte
          src/lib/dev/local-placement-copy.mjs
          src/lib/dev/local-placement-workflow.mjs
          src/lib/dev/local-scoped-edit-worker-port.mjs
          src/lib/dev/product-frp01.worker.mjs
          src/lib/dev/product-placement-client.mjs
          src/routes/editor/world/frp01/switch624/+page.svelte
          tests/product-switch624-frp01-route-off.test.mjs
          tests/stage-e/chrome-smoke.mjs
          tests/stage-f/chrome-smoke.mjs
          tests/wasm-distribution/chrome-smoke.mjs
          tests/wep-comp03-reference-consumer.test.mjs
          tests/wep-comp03-spatial-review-consumer.test.mjs
          tools/owner-local-steam-v1/server.mjs
          E
          diff -u /tmp/qrf-web.expected /tmp/qrf-web.actual
          grep -F 'PROTECTED_FRP01_RELEASE_ANCHOR=null' /tmp/qrf-web/src/lib/ddv/core/save/product-scoped-frp01-release-anchor.mjs
          cargo generate-lockfile --manifest-path crates/ddv-save-core/Cargo.toml
          sha256sum crates/ddv-save-core/Cargo.lock >/tmp/qrf-lock
          cargo install wasm-bindgen-cli --version 0.2.105 --locked --root /tmp/qrf-tools
          for mode in own off; do
           if [ "$mode" = own ]; then features=worker-wasm,product-switch624-frp01-scoped; else features=worker-wasm,indexed-read; fi
           cargo build --locked --manifest-path crates/ddv-save-core/Cargo.toml --release --target wasm32-unknown-unknown --no-default-features --features "$features"
           mkdir -p /tmp/qrf-web/static/qrf/$mode
           /tmp/qrf-tools/bin/wasm-bindgen /tmp/qrf-rust-target/wasm32-unknown-unknown/release/ddv_save_core.wasm --out-dir /tmp/qrf-web/static/qrf/$mode --target web --no-typescript
          done
          sha256sum /tmp/qrf-web/static/qrf/{own,off}/ddv_save_core_bg.wasm
          sha256sum -c /tmp/qrf-lock
          git diff --exit-code -- crates/ddv-save-core/Cargo.toml crates/ddv-save-core/src
      - name: Pinned Web installation
        run: |
          cd /tmp/qrf-web
          npm ci --no-audit --no-fund
          npm install --no-save --package-lock=false playwright-core@1.55.0
      - name: Actual Chrome strict product loader positive and three negatives
        run: |
          set -euo pipefail
          mkdir -p /tmp/qrf-web/src/routes/test-qrf
          cat >/tmp/qrf-web/src/routes/test-qrf/+page.svelte <<'S'
          <script>import{onMount}from'svelte';import{FRP01_RELEASE}from'$lib/ddv/core/save/product-scoped-placement-release.mjs';import{compileVerifiedWorker}from'$lib/ddv/core/save/product-rust-wasm-candidate-loader.mjs';
          onMount(()=>{(async()=>{try{
          const load=async k=>{const j=await fetch('/qrf/'+k+'/ddv_save_core.js'),w=await fetch('/qrf/'+k+'/ddv_save_core_bg.wasm');if(!j.ok||!w.ok||!w.headers.get('content-type')?.startsWith('application/wasm'))throw Error('WASM_MIME');return{js:new Uint8Array(await j.arrayBuffer()),wasm:new Uint8Array(await w.arrayBuffer())}};
          const own=await load('own'),off=await load('off'),exp=b=>WebAssembly.Module.exports(new WebAssembly.Module(b)).map(x=>x.name);
          const oe=exp(own.wasm),fe=exp(off.wasm),req={deniedSymbol:/(?!)/,requiredMethods:FRP01_RELEASE.methods,exactPrototype:true,exactWasmExports:FRP01_RELEASE.exports};
          if(oe.length!==24||fe.length!==17||req.requiredMethods.length!==15||req.exactWasmExports.length!==24)throw Error('GENERATED_ABI_DRIFT');
          const W=await compileVerifiedWorker(own.js,own.wasm,req),names=Object.getOwnPropertyNames(W.prototype).filter(x=>!['constructor','free','__destroy_into_raw'].includes(x));
          if(names.length!==15||!req.requiredMethods.every(x=>names.includes(x)))throw Error('WEB_EXACT_PROTO');
          const w=new W('switch','switch-bid','52BD625D9B4E0053',624,true,new Uint8Array(32).fill(7));
          if(typeof w.append_chunk!=='function'||typeof w.finish_switch624_frp01_readonly!=='function')throw Error('WASM_INTERFACE');
          w.close();w.free();
          let neg=0;const deny=async(f,k)=>{try{await f()}catch{neg++;return}throw Error('UNSAFE_ACCEPT_'+k)};
          await deny(()=>compileVerifiedWorker(off.js,off.wasm,req),'OFF');
          const mutated=new TextEncoder().encode(new TextDecoder().decode(own.js)+'\nWorkerWasmSource.prototype.qa_extra=function(){};');
          await deny(()=>compileVerifiedWorker(mutated,own.wasm,req),'EXTRA');
          const broken=own.wasm.slice();broken[0]^=255;await deny(()=>compileVerifiedWorker(own.js,broken,req),'BAD_WASM');
          window.__qrf={ok:true,methods:names.length,wasm:oe.length,off:fe.length,neg,instance:true};
          }catch(e){window.__qrf={error:String(e?.stack||e)}}})()});
          </script><p>Protected FRP624 original product Web verifier (QA only).</p>
          S
          cat >/tmp/qrf-web/tests/.qa-frp-protected.mjs <<'N'
          import assert from'node:assert/strict';import{chromium}from'playwright-core';import{spawn,spawnSync}from'node:child_process';
          const origin='http://127.0.0.1:4186',s=spawn('npm',['run','dev','--','--host','127.0.0.1','--port','4186','--strictPort'],{cwd:'/tmp/qrf-web',env:{...process.env,BASE_PATH:''},stdio:'inherit'});let b;
          try{let ready=false;for(let i=0;i<120;i++){try{if((await fetch(origin+'/test-qrf/')).ok){ready=true;break}}catch{}await new Promise(r=>setTimeout(r,250))}assert.ok(ready);
          const cmd=['google-chrome-stable','google-chrome','chromium'].find(x=>spawnSync('which',[x]).status===0);assert.ok(cmd);
          b=await chromium.launch({headless:true,executablePath:spawnSync('which',[cmd],{encoding:'utf8'}).stdout.trim(),args:['--no-sandbox','--disable-dev-shm-usage']});
          const page=await b.newPage({viewport:{width:390,height:844}}),errors=[];page.on('pageerror',e=>errors.push(String(e)));
          await page.goto(origin+'/test-qrf/');await page.waitForFunction(()=>!!window.__qrf,{},{timeout:60000});
          const a=await page.evaluate(()=>window.__qrf);if(a.error){console.log('QRW1934_PROTECTED_WEB_RED',a.error);throw Error(a.error)}
          assert.deepEqual(a,{ok:true,methods:15,wasm:24,off:17,neg:3,instance:true});assert.deepEqual(errors,[]);
          console.log('QRW1934_FRP624_PROTECTED_RUNTIME_ACTUAL_PASS '+JSON.stringify({...a,actualChrome:true,publicWriter:false,signed:false,genuine:false,webSource:'PR1911',coreSource:'PR1934'}));
          }finally{await b?.close();s.kill()}
          N
          cd /tmp/qrf-web
          node --check tests/.qa-frp-protected.mjs
          node tests/.qa-frp-protected.mjs
          git diff --exit-code -- src/lib tests/product-switch624-frp01-route-off.test.mjs

name: "04 QR-W COL-UX-42 repaired mobile anchor independent fixed HEAD"
on:
  pull_request:
    paths:
      - ".github/workflows/04qr-w-col42-repaired-anchor-20261107.yml"
      - "scripts/04qr-w-col42-repaired-anchor-20261107.mjs"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  independent-repaired-collection-chrome:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --no-audit --no-fund
      - run: npm install --no-save --package-lock=false playwright-core@1.55.0
      - name: Start disposable localhost Collection with synthetic public catalog
        shell: bash
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
          BASE_PATH="" npm run dev -- --host 127.0.0.1 --port 4299 >/tmp/qrw-col42-fixed.log 2>&1 &
          for i in $(seq 1 75); do
            if curl -fsS http://127.0.0.1:4299/collection/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/qrw-col42-fixed.log
          exit 1
      - name: Exact original Source blobs and independent changed-only installed Chrome negatives
        env:
          QRW_COL42_URL: http://127.0.0.1:4299
        run: node scripts/04qr-w-col42-repaired-anchor-20261107.mjs

name: 01A Native Steam Rust ProductSession V1 Offline Source-only
on:
  pull_request:
    paths:
      - 'crates/ddv-save-core/**'
      # Run the unchanged native Rust contract when the new Worker-local
      # encrypted P1G ingress consumes that single Rust ProductSession.
      - 'src/lib/ddv/core/save/local-steam-p1g-saved-diffgrids-facade.mjs'
      - 'tests/native-owner-rust-v1.test.mjs'
      - 'tests/native-owner-rust-v2-noop.test.mjs'
      - 'tests/native-owner-area-grid-slice.test.mjs'
      - '.github/workflows/01a-private-native-rust-v1.yml'
  push:
    branches:
      - 'core/native-private-steam-rust-v1-v2-*'
permissions:
  contents: read
jobs:
  build-private-native-runtime-with-public-synthetic-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CARGO_TARGET_DIR: /tmp/wand-native-private-v1-target
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify native feature is excluded from default WASM feature
        run: |
          set -euo pipefail
          grep -Fx 'private-native-v1 = ["indexed-read"]' crates/ddv-save-core/Cargo.toml
          grep -Fx 'required-features = ["private-native-v1"]' crates/ddv-save-core/Cargo.toml
          ! git ls-files | grep -E 'STEAM_SAVE_OWNER_PRIVATE|OWNER_PRIVATE|\.p1g$'
      - name: Compile accepted Rust Session native CLI (never input real Save)
        run: |
          cargo build --manifest-path crates/ddv-save-core/Cargo.toml --features private-native-v1 --bin wand-local-rust-v1 --release
          test -x "$CARGO_TARGET_DIR/release/wand-local-rust-v1"
          cargo build --manifest-path crates/ddv-save-core/Cargo.toml --features private-native-v2 --bin wand-local-rust-v2-noop --release
          test -x "$CARGO_TARGET_DIR/release/wand-local-rust-v2-noop"
      - name: Rust full document, indexed read, CAS negative tests
        run: |
          cargo test --manifest-path crates/ddv-save-core/Cargo.toml --features private-native-v2
          WAND_TEST_NATIVE_RUST_V1="$CARGO_TARGET_DIR/release/wand-local-rust-v1" node tests/native-owner-rust-v1.test.mjs
          WAND_TEST_NATIVE_RUST_V1="$CARGO_TARGET_DIR/release/wand-local-rust-v1" node tests/native-owner-area-grid-slice.test.mjs
          WAND_TEST_NATIVE_RUST_V1="$CARGO_TARGET_DIR/release/wand-local-rust-v1" WAND_TEST_NATIVE_RUST_V2="$CARGO_TARGET_DIR/release/wand-local-rust-v2-noop" node tests/native-owner-rust-v2-noop.test.mjs
      - name: Export COMPILED BINARY ONLY for authorized local private proof
        uses: actions/upload-artifact@v4
        with:
          name: wand-native-rust-v1-v2-noop-linux-x86_64-synthetic-tested
          path: |
            /tmp/wand-native-private-v1-target/release/wand-local-rust-v1
            /tmp/wand-native-private-v1-target/release/wand-local-rust-v2-noop
          retention-days: 1
          if-no-files-found: error
      - name: Assert no private Save and no product feature enabled
        run: |
          test -z "$(git ls-files | grep -E 'STEAM_SAVE_OWNER_PRIVATE|OWNER_PRIVATE|\.p1g$' || true)"
          test -f tools/owner-local-steam-v1/worker-core.mjs

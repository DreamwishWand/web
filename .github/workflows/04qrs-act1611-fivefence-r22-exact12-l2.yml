name: "04 QR-S ACT1611 FiveFence current exact12 R22/Cargo Security L2 (QA ONLY)"
on:
  pull_request:
    paths:
      - ".github/workflows/04qrs-act1611-fivefence-r22-exact12-l2.yml"
permissions:
  contents: read
jobs:
  focus:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d78e01e7c9ee9c888c93d6f5226a2d251e578984
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Fetch unchanged approved source refs (not QA-only Source)
        shell: bash
        run: |
          set -euo pipefail
          for sha in aa48ef10152c181059745415836956eab861168f 88c1b08464201b85a90880c442ec2526bd2dda05; do
            git cat-file -e "$sha^{commit}" || git fetch --no-tags origin "$sha"
          done
      - name: Independently verify fixed Gate/Source exact12 and fail-closed negative counterexamples
        shell: bash
        run: |
          cat > /tmp/qrs-fivefence-l2.mjs <<'NODE'
          import assert from 'node:assert/strict';
          import {execFileSync} from 'node:child_process';
          import {mkdtempSync,rmSync,writeFileSync} from 'node:fs';
          import {tmpdir} from 'node:os';
          import {join} from 'node:path';
          import {runInNewContext} from 'node:vm';
          const repo=process.cwd(), main='7f18c74f86c2f74eccc0d7d498ed0c22041e635b',
            gate='d78e01e7c9ee9c888c93d6f5226a2d251e578984',
            source='aa48ef10152c181059745415836956eab861168f',
            historic='88c1b08464201b85a90880c442ec2526bd2dda05',
            gatePath='scripts/wasm-distribution/r22-accepted-rust-scope.mjs',
            configPath='scripts/wasm-distribution/protected-release-inputs.json',
            prevGate='57ae8395c280bb48b8ade0f134b445485b9de15f',
            nextGate='dbada6f40c564b9a151eeea6a83580f7f02e5271',
            oldCore='bfea42aa4f2097deffe73d2016de62b1103c0723',
            newCore='fa23c80199225e20639be7da80c8236b4b82a013';
          const tmp=mkdtempSync(join(tmpdir(),'qrs-fivefence-'));
          const env={...process.env,GIT_INDEX_FILE:join(tmp,'index'),GIT_NO_REPLACE_OBJECTS:'1',GIT_AUTHOR_NAME:'Independent QA',GIT_AUTHOR_EMAIL:'qa@example.invalid',GIT_COMMITTER_NAME:'Independent QA',GIT_COMMITTER_EMAIL:'qa@example.invalid'};
          const g=(...args)=>execFileSync('git',args,{cwd:repo,env,encoding:'utf8',maxBuffer:16*1024*1024}).trim();
          const raw=(ref,path)=>execFileSync('git',['show',ref+':'+path],{cwd:repo,env,encoding:'utf8',maxBuffer:16*1024*1024});
          const entry=(ref,path)=>{
            const line=g('ls-tree',ref,'--',path);
            if(!line)return null;
            const m=/^(100644|100755) blob ([0-9a-f]{40})\t(.+)$/.exec(line);
            assert.ok(m&&m[3]===path,'unexpected file/mode '+path);
            return {mode:m[1],blob:m[2]};
          };
          const apply=(path,e)=>e?g('update-index','--add','--cacheinfo',e.mode,e.blob,path):g('update-index','--force-remove','--',path);
          const project=(base,pairs)=>{
            g('read-tree',base);for(const [p,e] of pairs)apply(p,e);
            const tree=g('write-tree'),commit=g('commit-tree',tree,'-p',base,'-m','qa-only isolated refutation');
            return {tree,commit};
          };
          let pos=0,neg=0,verifyAcceptedRustScope;
          const bad=(base,candidate,label)=>{
            assert.throws(()=>verifyAcceptedRustScope(repo,base,candidate),/R22_ACCEPTED_SCOPE|SELECTION|error|Error/i,label);
            neg++;
          };
          try{
            ({verifyAcceptedRustScope}=await import('file://'+repo+'/'+gatePath));
            assert.equal(g('rev-parse','HEAD'),gate);
            assert.equal(g('rev-parse',gate+'^'),main);
            assert.equal(g('rev-parse',source+'^'),gate);
            assert.deepEqual(g('diff','--name-only',main,gate).split('\n'),[gatePath]);
            assert.equal(entry(main,gatePath)?.blob,prevGate);
            assert.equal(entry(gate,gatePath)?.blob,nextGate);
            pos++;
            const original=raw(main,gatePath),fixed=raw(gate,gatePath);
            const marker='// ACT-20261117-09PCODE-FIVEFENCE-MAIN7F-COMPOSED-EXACT12-R22.';
            const block=fixed.indexOf(marker),paths=fixed.indexOf('const gatePaths=',block);
            const selected=fixed.indexOf(" if(baseCore==='"+oldCore+"')",paths);
            const denied=fixed.indexOf(" deny('BASE_CORE_TREE');",selected);
            assert.ok(block>0&&paths>block&&selected>paths&&denied>selected);
            assert.equal(fixed.slice(0,block)+fixed.slice(paths,selected)+fixed.slice(denied),original,'R22 only contains exact additive new profile');
            pos++;
            const decl=fixed.indexOf('const switch626FiveFenceComposedMain7fExact12Entries=');
            const open=fixed.indexOf('[',decl),close=fixed.indexOf('];',open);
            assert.ok(decl>0&&close>open);
            const pins=JSON.parse(JSON.stringify(runInNewContext('('+fixed.slice(open,close+1)+')')));
            assert.equal(pins.length,12);
            assert.equal(new Set(pins.map(x=>x.path)).size,12);
            assert.equal(pins.filter(x=>x.before===null).length,2);
            assert.equal(pins.filter(x=>x.before!==null).length,10);pos++;
            assert.deepEqual(g('diff','--name-only',gate,source).split('\n').sort(),pins.map(x=>x.path).sort());
            let historicExact=0,changedShared=0;
            for(const x of pins){
              assert.deepEqual(entry(gate,x.path),x.before,'preimage '+x.path);
              assert.deepEqual(entry(source,x.path),x.after,'approved postimage '+x.path);
              assert.equal(x.after.mode,'100644');
              assert.equal(g('cat-file','-t',x.after.blob),'blob');
              if(x.path!==configPath){
                if(x.after.blob===entry(historic,x.path)?.blob)historicExact++;
                else changedShared++;
              }
              pos++;
            }
            assert.equal(historicExact,7);
            assert.equal(changedShared,4);
            const before=JSON.parse(raw(main,configPath)),after=JSON.parse(raw(source,configPath));
            assert.deepEqual(after,{...before,cargoTomlGitBlob:'2f8452ee3c7a45bab9bb6cb7ab62010120e37c44'});
            assert.equal(before.cargoTomlGitBlob,'a5bdd2af0a3f33b827fb55f87d6e0637ef50fd67');
            assert.equal(entry(source,configPath)?.blob,'f81df4334a4d75760f33607eeca4385adffc966c');
            assert.equal(after.writerEnabled,false);assert.equal(after.productConsumerEnabled,false);pos++;
            assert.equal(g('rev-parse',main+':crates/ddv-save-core'),oldCore);
            assert.equal(g('rev-parse',source+':crates/ddv-save-core'),newCore);
            assert.equal(g('rev-parse',source+'^{tree}'),'29e048d6b30d1b908fbf1a67c2be3d0827dd4a4a');pos++;
            const actual=verifyAcceptedRustScope(repo,gate,source);
            assert.equal(actual.entryCount,12);
            assert.equal(actual.inheritedOnlyGitLeaves,7);
            assert.equal(actual.composedCurrentSharedLeaves,4);
            assert.equal(actual.mergeAuthorized,false);assert.equal(actual.writerAuthorized,false);pos++;
            const rec=project(gate,pins.map(x=>[x.path,x.after]));
            assert.equal(rec.tree,g('rev-parse',source+'^{tree}'));pos++;
            const inverse=project(rec.commit,pins.map(x=>[x.path,x.before]));
            assert.equal(inverse.tree,g('rev-parse',gate+'^{tree}'));pos++;
            for(const pin of pins){
              const omit=project(gate,pins.filter(x=>x.path!==pin.path).map(x=>[x.path,x.after])).commit;
              bad(gate,omit,'missing '+pin.path);
              const mod=project(gate,pins.map(x=>[x.path,x.path===pin.path?{mode:'100755',blob:x.after.blob}:x.after])).commit;
              bad(gate,mod,'mode '+pin.path);
              const replace=project(gate,pins.map(x=>[x.path,x.path===pin.path?{mode:'100644',blob:x.before?.blob??prevGate}:x.after])).commit;
              bad(gate,replace,'blob '+pin.path);
            }
            const extra=[
              ['.github/workflows/pages.yml',prevGate],
              ['scripts/wasm-distribution/approved-Cargo.lock',prevGate],
              ['scripts/wasm-distribution/verify-protected-release.mjs',prevGate],
              ['scripts/wasm-distribution/r22-accepted-rust-scope.mjs',prevGate],
              ['scripts/int-selection-preflight.mjs',prevGate],
              ['src/lib/ddv/core/save/product-scoped-placement-release.mjs',prevGate],
              ['unapproved-fence-grant.txt',prevGate]
            ];
            for(const [path,blob] of extra){
              bad(gate,project(gate,[...pins.map(x=>[x.path,x.after]),[path,{mode:'100644',blob}]]).commit,'unapproved '+path);
            }
            bad(main,source,'gate not on base');
            bad(gate,gate,'noop not accepted');
            bad(source,gate,'reversal');
            bad(main,historic,'foreign old original');
            for(const path of ['.github/workflows/pages.yml','scripts/wasm-distribution/approved-Cargo.lock','scripts/wasm-distribution/verify-protected-release.mjs','scripts/int-selection-preflight.mjs','scripts/int-protected-ci-gate.mjs']){
              assert.deepEqual(entry(main,path),entry(gate,path));pos++;
            }
            const oldPairs=[...original.matchAll(/if\(baseCore==='([0-9a-f]{40})'\)/g)].map(x=>x[1]);
            const newPairs=[...fixed.matchAll(/if\(baseCore==='([0-9a-f]{40})'\)/g)].map(x=>x[1]);
            assert.deepEqual(newPairs.filter(x=>x!==oldCore),oldPairs);
            assert.equal(newPairs.filter(x=>x===oldCore).length,1);pos++;
            console.log('QRS_ACT1611_FIVEFENCE_CURRENT_EXACT12_R22_L2_PASS',JSON.stringify({
              pos,neg,pins:12,sourceExact12:true,oldSourceBlobs7:true,sharedComposed4:true,
              oneCargoPinOnly:true,gateAdditive:true,inverse:true,issuerLockUnchanged:true,
              priorProfiles:oldPairs.length,productWriterEnabled:false,
              realSignedPages:false,privateOriginalV2:false
            }));
          }finally{rmSync(tmp,{recursive:true,force:true})}
          NODE
          # The import above is intentionally pinned to Gate HEAD; QA never signs or deploys.
          cp /tmp/qrs-fivefence-l2.mjs ./qa-fivefence-l2.mjs
          node ./qa-fivefence-l2.mjs

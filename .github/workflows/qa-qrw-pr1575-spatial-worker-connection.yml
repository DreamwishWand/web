name: QA ONLY PR1575 actual spatial Worker connection (never merge)
on:
  pull_request:
    paths:
      - '.github/workflows/qa-qrw-pr1575-spatial-worker-connection.yml'
permissions:
  contents: read
jobs:
  actual-connection:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_TARGET_DIR: /tmp/qrw-spatial-connection-target
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 4a335a359689738fb3f8b572232f981898345c95
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Fixed current Web exact13 and accepted optional Core
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '4a335a359689738fb3f8b572232f981898345c95'
          test "$(git rev-parse HEAD:src/lib/ddv/core/save/p1g-rust-worker-readonly-bridge.mjs)" = 'f6603e6afc1a01a5c748549eb2bd1c00f5d3d5f8'
          test "$(git rev-parse HEAD:src/lib/ddv/core/save/product-scoped-amount-local-adapter.mjs)" = '77502255e9bb2b28d048ec6aab6d4fd22859c60e'
          test "$(git rev-parse HEAD:src/lib/ddv/core/save/product-scoped-comp03-spatial-release-anchor.mjs)" = '3dbd5b6bd2268a3a42589364fa06ab09da84565b'
          test "$(git rev-parse HEAD:src/lib/ddv/core/save/product-scoped-placement-release.mjs)" = 'cddd6e98c8ef461349c96205140dc1f2a9d47a95'
          test "$(git rev-parse HEAD:src/lib/ddv/core/save/product-scoped-placement-transport.mjs)" = '2be98e17bf3941ccf0a727b920d9dfb0ad3357b6'
          test "$(git rev-parse HEAD:src/lib/ddv/core/save/product-wasm-read-owner.d.mts)" = 'a3f44c61c1f5e12213844eae1077ca1884c431a9'
          test "$(git rev-parse HEAD:src/lib/ddv/core/save/product-wasm-read-owner.mjs)" = '09ef40c1b41f053052dd2b0a4a42dbc181f9b09f'
          test "$(git rev-parse HEAD:src/lib/dev/local-scoped-edit-worker-port.mjs)" = 'd52e38c1140ed13b8fb10b5c70e09fb9af99439d'
          test "$(git rev-parse HEAD:src/lib/dev/product-comp03-spatial.worker.mjs)" = '5f905509d1b1de216bf6e780da68d3c6358c1cab'
          test "$(git rev-parse HEAD:src/lib/dev/product-placement-client.mjs)" = '85d258ab428ad1eb72e2c7cf9d52f956f607b8cb'
          test "$(git rev-parse HEAD:src/lib/dev/product-placement-worker-boot.mjs)" = 'cbbb2839705b192b15505169787739b21b9190c5'
          test "$(git rev-parse HEAD:tests/product-comp03-spatial-connection.test.mjs)" = '850dcb0b0e94d54a81bbf91e95762293622c5b66'
          test "$(git rev-parse HEAD:tests/product-comp03-spatial-transport.test.mjs)" = '998ca6eb05f2b5dd7567fcbe9c884340f8bc931f'
          git cat-file -e 7fe14c7f2d227d50263ab98d00d0467947247de8^{commit} || git fetch --no-tags origin 7fe14c7f2d227d50263ab98d00d0467947247de8
          git worktree add --detach /tmp/qrw-spatial-connection-core 7fe14c7f2d227d50263ab98d00d0467947247de8
          test "$(git -C /tmp/qrw-spatial-connection-core rev-parse HEAD)" = '7fe14c7f2d227d50263ab98d00d0467947247de8'
          rustc --version | grep -F 'rustc 1.100.0 (0ef1bc386 2026-11-09)'
          cargo generate-lockfile --manifest-path /tmp/qrw-spatial-connection-core/crates/ddv-save-core/Cargo.toml
          echo '6bd3642b96af61a84a0b0d96b7e7e911415f519bcb4683c1092ea0bf191f71ac  /tmp/qrw-spatial-connection-core/crates/ddv-save-core/Cargo.lock' | sha256sum -c -
      - name: Reproduce accepted actual artifact then generate Web glue
        run: |
          set -euo pipefail
          cargo install wasm-bindgen-cli --version 0.2.105 --locked --root /tmp/qrw-spatial-connection-tools
          cargo build --locked --manifest-path /tmp/qrw-spatial-connection-core/crates/ddv-save-core/Cargo.toml --release --target wasm32-unknown-unknown --no-default-features --features worker-wasm,product-steam626-comp03-spatial-preview
          B=/tmp/qrw-spatial-connection-tools/bin/wasm-bindgen
          W="$CARGO_TARGET_DIR/wasm32-unknown-unknown/release/ddv_save_core.wasm"
          "$B" "$W" --out-dir /tmp/qrw-spatial-connection-node --target nodejs --no-typescript
          echo '41fb5ee0b41fdd3238302411a9cf150db16df65214aaeb76e55369d633f38bdd  /tmp/qrw-spatial-connection-node/ddv_save_core_bg.wasm' | sha256sum -c -
          mkdir -p tests/qa-spatial-connection static/qa-spatial-connection
          "$B" "$W" --out-dir tests/qa-spatial-connection --target web --no-typescript
          cp tests/qa-spatial-connection/ddv_save_core_bg.wasm static/qa-spatial-connection/
          sha256sum tests/qa-spatial-connection/ddv_save_core.js static/qa-spatial-connection/ddv_save_core_bg.wasm
      - run: npm ci --no-audit --no-fund
      - run: npm install --no-save --package-lock=false playwright-core@1.55.0
      - name: Temporary synthetic fixture and actual product RPC Worker connection
        run: |
          mkdir -p src/routes/test-qrw-spatial-connection
          cat > tests/.qa-spatial-connection-fixture.mjs <<'NODE'
          import {writeFileSync} from 'node:fs';import {createHash} from 'node:crypto';import {makeSyntheticP1gProfile} from './helpers/p1g-fixture.mjs';
          const item=40100038,G=301,N=92,seed=82;
          const root=(name,id,g)=>({SceneItemId:id,Unlocked:true,GridIDs:[g],CustomLocationPositionsPath:'SceneLayouts/FloatingIslands/FloatingIsland_'+name+'/CustomLocations.json'});
          const grid=(name,id,next,objects)=>({ID:id,GridDefaultLayoutPath:'',GridDataPath:'GridData/FloatingIslands/FloatingIsland_'+name+'/FloatingIsland_'+name+'Grid-GridData.json',TessellationFactor:2,NextGridObjectID:next,Objects:objects});
          const well={ID:0,ItemID:20300048,X:120,Y:120,Orientation:'GridOrientation_Down',State:{BuildingWithSkinData:{UpgradeState:{Level:1},CurrentSkinItemID:170200005}}};
          const d={GameInfo:{Version:626},World:{Villages:[],FloatingIslands:{1540000150:root('Snow',1540000150,G),1540000153:root('Savannah',1540000153,742)},GridCollection:{Grids:{[G]:grid('Snow',G,N,{0:structuredClone(well),[seed]:{ID:seed,ItemID:item,X:16,Y:24,Orientation:'GridOrientation_Down',State:null}}),742:grid('Savannah',742,12,{0:structuredClone(well)})},DiffGrids:{}},MissionSlots:{},RecurringEvents:{}},Player:{ListInventories:{0:{ID:0,CompatibleItemType:'ItemType_Furniture',CompatibleFurnitureTypes:{List:['FurnitureItemType_GroundAlteration']},Inventory:{[item]:{Amount:99,Marker:'ItemMarker_None'}}}},AchievementsData:[],DutySlots:{},EvolveStatesProfile:{EvolveProgressState:{}},BattlePassStates:{Progress:{},FtueProgress:{TasksProgress:[],WeeklyTasksProgress:[]}}},ConditionalEventHistory:{ActiveEvents:{}},Opaque:{escaped:'keep'}};
          const want=structuredClone(d),gr=want.World.GridCollection.Grids[G],coords=[[20,24],[24,24],[16,28],[20,28],[24,28],[16,32],[20,32],[24,32]];
          coords.forEach(([X,Y],i)=>gr.Objects[N+i]={ID:N+i,ItemID:item,Orientation:'GridOrientation_Down',State:null,X,Y});gr.NextGridObjectID+=coords.length;
          const anchors=[{objectId:seed,x:16,y:24,role:'retained'},...coords.map(([x,y],i)=>({objectId:N+i,x,y,role:'proposed'}))];
          const b=makeSyntheticP1gProfile(d);writeFileSync('static/qa-spatial-connection/input.p1g',b);writeFileSync('static/qa-spatial-connection/meta.json',JSON.stringify({sha:createHash('sha256').update(b).digest('hex'),expected:want,anchors}));
          
          NODE
          node tests/.qa-spatial-connection-fixture.mjs
          cat > src/routes/test-qrw-spatial-connection/qa.worker.mjs <<'NODE'
          import init,{WorkerWasmSource} from '../../../tests/qa-spatial-connection/ddv_save_core.js';
          import {createProductSteam626Comp03SpatialLocalAdapter} from '$lib/ddv/core/save/product-scoped-amount-local-adapter.mjs';
          import {installLocalComp03SpatialDevWorker} from '$lib/dev/local-scoped-edit-worker-port.mjs';
          try{
           const r=await fetch('/qa-spatial-connection/ddv_save_core_bg.wasm');
           if(!r.ok||!r.headers.get('content-type')?.startsWith('application/wasm'))throw Error('WASM MIME');
           await init({module_or_path:await r.arrayBuffer()});
           let opens=0,closes=0;
           const factory=async()=>({WorkerWasmSource:class extends WorkerWasmSource{constructor(...args){super(...args);opens++}close(){closes++;return super.close()}}});
           const a=createProductSteam626Comp03SpatialLocalAdapter({wasmFactory:factory});
           // Only QA instrumentation reports actual lifecycle counts; never fabricate product readiness/signature.
           const adapter={...a,async close(){const ack=await a.close();postMessage({kind:'QA_COUNTS',opens,closes});return ack}};
           installLocalComp03SpatialDevWorker(self,adapter);
           postMessage({kind:'QA_LOCAL_READY'});
          }catch(e){postMessage({kind:'QA_ERROR',error:String(e?.stack||e)})}
          
          NODE
          cat > src/routes/test-qrw-spatial-connection/+page.svelte <<'SVELTE'
          <script>
          import {onMount} from 'svelte';
          import {createLocalComp03SpatialDevPort,createLocalComp03DevPort,createLocalVaseDevPort} from '$lib/dev/local-scoped-edit-worker-port.mjs';
          import {createProductComp03SpatialPort} from '$lib/dev/product-placement-client.mjs';
          const need=(v,k)=>{if(!v)throw Error(k)},sha=async b=>Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',b)),x=>x.toString(16).padStart(2,'0')).join('');
          onMount(()=>{
           let w,p,disposed=false;
           (async()=>{try{
            let neg=0;const deny=async(f,k)=>{let ok=false;try{await f()}catch{ok=true}need(ok,k);neg++};
            const originalWorker=window.Worker;let constructors=0;window.Worker=new Proxy(originalWorker,{construct(t,a,n){constructors++;return Reflect.construct(t,a,n)}});
            await deny(()=>createProductComp03SpatialPort(),'null signed optional anchor');need(constructors===0,'null anchor Worker');
            const meta=await(await fetch('/qa-spatial-connection/meta.json')).json(),bytes=new Uint8Array(await(await fetch('/qa-spatial-connection/input.p1g')).arrayBuffer());
            need(await sha(bytes)===meta.sha,'fixture sha');
            w=new Worker(new URL('./qa.worker.mjs',import.meta.url),{type:'module'});let counts=null;
            await new Promise((resolve,reject)=>{w.addEventListener('message',e=>{if(e.data.kind==='QA_LOCAL_READY')resolve();if(e.data.kind==='QA_ERROR')reject(Error(e.data.error));if(e.data.kind==='QA_COUNTS')counts=e.data});w.onerror=()=>reject(Error('worker start'));});
            p=createLocalComp03SpatialDevPort(w);
            // Actual local port explicit only; foreign legacy/Vase port constructors expose no spatial RPC.
            for(const make of [createLocalComp03DevPort,createLocalVaseDevPort]){const other=make({postMessage(){throw Error('unexpected post')},terminate(){}});need(other.spatialPreview===undefined,'legacy capability');other.dispose()}
            need(p.previewBackpack===undefined&&p.previewWardrobe===undefined&&p.stageTyped===undefined,'foreign surface');
            const build={platform:'steam-windows',buildKind:'steam-full-version',buildId:'releases_1.25-v1.25.3-44-g0b41250d9ac0-incremental-22',schema:626,externallyConfirmed:true},file=new File([bytes],'synthetic-comp03.p1g'),input={file,build,originalSha256:meta.sha};
            await deny(()=>p.spatialPreview(),'before Open');
            await deny(()=>p.open({...input,build:{platform:'switch',buildKind:'switch-bid',buildId:'9A239D3DB569756D',schema:626,externallyConfirmed:true}}),'wrong Build');
            await p.open(input);await deny(()=>p.spatialPreview(),'before Backup');await p.backupOriginal();await deny(()=>p.spatialPreview(),'before Preview');
            await deny(()=>p.spatialPreview({seedId:82}),'arguments');await deny(()=>p.previewPlacement({seedId:82,projectedDecodedSha256:'x'}),'forged selector');
            const pr=await p.previewPlacement({seedId:82});need(pr.exactFieldChangedCount===9&&pr.seedId===82,'preview');
            const r=await p.spatialPreview();need(JSON.stringify(r.anchors)===JSON.stringify(meta.anchors),'actual exact anchors');need(r.rootSceneItemId===1540000150&&r.gridId===301&&r.seedId===82&&r.nextObjectId===92,'identity');
            need(r.writerAuthorized===false&&r.editedCopyAuthorized===false&&Object.keys(r).sort().join(',')==='anchors,editedCopyAuthorized,gridId,nextObjectId,rootSceneItemId,seedId,writerAuthorized','sanitized data');
            r.anchors[0].x=0;const again=await p.spatialPreview();need(JSON.stringify(again.anchors)===JSON.stringify(meta.anchors),'clone isolation');
            need((await p.stagePlacement()).exactFieldChangedCount===9,'stage');await deny(()=>p.spatialPreview(),'after Stage');
            await p.undo();await deny(()=>p.spatialPreview(),'after Undo');await deny(()=>p.exportEditedCopy(),'undone export');await p.redo();
            const out=await p.exportEditedCopy();need(out.freshWorkerReopenVerified===true&&out.writerAuthorized===false,'fresh codec reopen');
            const b=await p.downloadVerifiedCopy('backup'),e=await p.downloadVerifiedCopy('edited');need(b.name!==e.name&&b.name!==file.name&&e.name!==file.name,'separate names');need(await sha(b.encryptedBytes)===meta.sha&&await sha(new Uint8Array(await file.arrayBuffer()))===meta.sha,'original backup');
            const root=await navigator.storage.getDirectory(),bf=await(await root.getFileHandle(b.name)).getFile(),ef=await(await root.getFileHandle(e.name)).getFile();
            need(await sha(new Uint8Array(await bf.arrayBuffer()))===meta.sha&&await sha(new Uint8Array(await ef.arrayBuffer()))===e.sha256,'actual OPFS');
            await deny(()=>p.exportEditedCopy(),'replay');await p.close();await deny(()=>p.spatialPreview(),'closed');need(counts?.opens===1&&counts?.closes===1&&constructors===1,'one actual owner/Worker/close');
            p.dispose();await deny(()=>p.spatialPreview(),'disposed');disposed=true;window.Worker=originalWorker;
            window.__qrwSpatial={ok:true,negative:neg,opens:counts.opens,closes:counts.closes,workers:constructors,backup:Array.from(b.encryptedBytes),edited:Array.from(e.encryptedBytes)};
           }catch(e){window.__qrwSpatial={error:String(e?.stack||e)};p?.dispose();w?.terminate()}})();
           return ()=>{if(!disposed){p?.dispose();w?.terminate()}};
          });
          </script>
          <p>Isolated synthetic QA only</p>
          SVELTE
          cat > tests/.qa-spatial-connection-browser.mjs <<'NODE'
          import {chromium} from 'playwright-core';import {spawn,spawnSync} from 'node:child_process';import {readFileSync,writeFileSync} from 'node:fs';import assert from 'node:assert/strict';
          const origin='http://127.0.0.1:4182',server=spawn('npm',['run','dev','--','--host','127.0.0.1','--port','4182','--strictPort'],{env:{...process.env,BASE_PATH:''},stdio:'inherit'});let browser;
          try{
           for(let i=0;i<100;i++){try{if((await fetch(origin+'/test-qrw-spatial-connection/')).ok)break}catch{}await new Promise(r=>setTimeout(r,250))}
           const bin=['google-chrome-stable','google-chrome','chromium'].find(x=>spawnSync('which',[x]).status===0);assert.ok(bin);browser=await chromium.launch({headless:true,executablePath:spawnSync('which',[bin],{encoding:'utf8'}).stdout.trim(),args:['--no-sandbox','--disable-dev-shm-usage']});
           const page=await browser.newPage();await page.goto(origin+'/test-qrw-spatial-connection/');await page.waitForFunction(()=>!!window.__qrwSpatial,{},{timeout:120000});const q=await page.evaluate(()=>window.__qrwSpatial);assert.ok(q.ok,q.error);assert.equal(q.negative,12);assert.equal(q.opens,1);assert.equal(q.closes,1);assert.equal(q.workers,1);
           assert.deepEqual(Buffer.from(q.backup),readFileSync('static/qa-spatial-connection/input.p1g'));writeFileSync('/tmp/qrw-spatial-connection-edited.p1g',Buffer.from(q.edited));
           const check=spawnSync(process.execPath,['--input-type=module','-e',"import {readFileSync} from 'node:fs';import assert from 'node:assert/strict';import {p1gPackagedProfileCodec as c} from './src/lib/ddv/core/save/p1g-packaged-profile-codec.js';const p=await c.loadProfile(new Uint8Array(readFileSync('/tmp/qrw-spatial-connection-edited.p1g')));assert.deepEqual(JSON.parse(p.jsonText),JSON.parse(readFileSync('static/qa-spatial-connection/meta.json','utf8')).expected);"],{stdio:'inherit'});assert.equal(check.status,0);
           console.log('QRW1575_SPATIAL_WORKER_CONNECTION_ACTUAL_PASS',JSON.stringify({positive:1,negative:q.negative,actualWorker:q.workers,actualRustSessions:q.opens,actualCloses:q.closes,actualOpfs:true,independentReopen:true,exact9:true,signed:false,genuine:false}));
          }finally{if(browser)await browser.close();server.kill()}
          
          NODE
          node tests/.qa-spatial-connection-browser.mjs

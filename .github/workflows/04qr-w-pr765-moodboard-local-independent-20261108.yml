name: "04 QR-W PR765 independent Collection local Moodboard new-only real Chrome"
on:
  pull_request:
    paths:
      - ".github/workflows/04qr-w-pr765-moodboard-local-independent-20261108.yml"
      - "scripts/04qr-w-pr765-moodboard-local-independent-20261108.mjs"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  independent-collection-inspire:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --no-audit --no-fund
      - run: npm install --no-save --package-lock=false playwright-core@1.55.0
      - name: Launch isolated local Source and require installed Chrome (no private Save)
        shell: bash
        run: |
          set -euo pipefail
          test -z "${WEP_PRIVATE_P1G_PATH:-}"
          test -z "${DDV_PRIVATE_SAVE_PATH:-}"
          BIN="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || true)"
          test -n "$BIN" || { echo 'NOT_RUN: system Chrome missing'; exit 1; }
          "$BIN" --version
          echo "CHROME_BIN=$BIN" >> "$GITHUB_ENV"
          BASE_PATH='' npm run dev -- --host 127.0.0.1 --port 4296 >/tmp/qrw-pr765-vite.log 2>&1 &
          for i in $(seq 1 75); do
            if curl -fsS http://127.0.0.1:4296/collection/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/qrw-pr765-vite.log; exit 1
      - name: Exact 5 immutable Source blobs and actual Chrome independent negative QA
        env:
          QRW_PR765_URL: http://127.0.0.1:4296
        run: node scripts/04qr-w-pr765-moodboard-local-independent-20261108.mjs

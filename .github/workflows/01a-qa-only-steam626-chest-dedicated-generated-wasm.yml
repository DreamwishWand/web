name: 01A QA ONLY Steam626 dedicated Chest generated WASM exact ABI and P1G
on:
  pull_request:
    paths:
      - '.github/workflows/01a-qa-only-steam626-chest-dedicated-generated-wasm.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  generated-steam-chest-wasm:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CARGO_TARGET_DIR: /tmp/wand-01a-steam-chest-qa-target
      WAND_GENERATED_MODULE: /tmp/wand-01a-steam-chest-qa-pkg/ddv_save_core.js
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Frozen original reviewed ProductScoped Rust and one added QA workflow
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:crates/ddv-save-core/src/product_amount_scoped.rs)" = 522e8e8d6beec597b2e5e176cfbe8a6d8e38a124
          test "$(git rev-parse HEAD:crates/ddv-save-core/src/semantic_writer.rs)" = f11c68ca214853c762788ae032710fc4683dd472
          test "$(git rev-parse HEAD:crates/ddv-save-core/src/bin/wand-local-rust-v2-noop.rs)" = 9f783e64ec44fdc2d863a4634f3d334a89cf7f62
          test "$(git rev-parse HEAD:crates/ddv-save-core/Cargo.toml)" = 751a73da41d8b58f7de70643f50b97722a3c1260
          test "$(git rev-parse HEAD:crates/ddv-save-core/src/wasm_worker.rs)" = 5fbb1f3d393df127da67f1eafe9796fbb7ce3a56
          test "$(git diff --name-only 0778ed44da9b619989a34dde419c686c1934af64 HEAD)" = '.github/workflows/01a-qa-only-steam626-chest-dedicated-generated-wasm.yml'
          test ! -e crates/ddv-save-core/Cargo.lock
          cp scripts/wasm-distribution/approved-Cargo.lock crates/ddv-save-core/Cargo.lock
          echo 'e58486d673df79bfe7e72b80449e39389e57010fe4051edcdcff9b53c2da898c  crates/ddv-save-core/Cargo.lock' | sha256sum -c -
          grep -Fq -- '--features worker-wasm,indexed-read' .github/workflows/pages.yml
          test -z "$(git ls-files '*.p1g')"
          echo 01A_STEAM_CHEST_WASM_FIXED_SOURCE_AND_PUBLIC_WRITER_OFF
      - name: Compile actual dedicated Steam Chest-only Rust WASM and bindgen ABI
        run: |
          set -euo pipefail
          cargo build --locked --manifest-path crates/ddv-save-core/Cargo.toml --release --target wasm32-unknown-unknown --no-default-features --features worker-wasm,product-steam626-chest-scoped
          cargo install wasm-bindgen-cli --version 0.2.105 --locked --root /tmp/wand-01a-steam-chest-qa-bin
          mkdir -p /tmp/wand-01a-steam-chest-qa-pkg
          /tmp/wand-01a-steam-chest-qa-bin/bin/wasm-bindgen "$CARGO_TARGET_DIR/wasm32-unknown-unknown/release/ddv_save_core.wasm" --out-dir /tmp/wand-01a-steam-chest-qa-pkg --target nodejs --no-typescript
      - name: Real generated dedicated WASM ABI and synthetic encrypted original backup to Rust exact1
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFile} from 'node:fs/promises';
          import {createHash} from 'node:crypto';
          import {createRequire} from 'node:module';
          import {makeSyntheticP1gProfile} from './tests/helpers/p1g-fixture.mjs';
          import {p1gPackagedProfileCodec} from './src/lib/ddv/core/save/p1g-packaged-profile-codec.js';
          import {createP1gRustWorkerReadOnlyBridge} from './src/lib/ddv/core/save/p1g-rust-worker-readonly-bridge.mjs';
          import {SCOPED_STEAM_CHEST_WASM_EXPORTS,SCOPED_STEAM_CHEST_METHODS,scopedSteamChestWasmExportsOk} from './src/lib/ddv/core/save/product-scoped-steam-chest-release.mjs';
          const req=createRequire(import.meta.url);
          const {WorkerWasmSource}=req(process.env.WAND_GENERATED_MODULE);
          const raw=await readFile('/tmp/wand-01a-steam-chest-qa-pkg/ddv_save_core_bg.wasm');
          const exports=WebAssembly.Module.exports(new WebAssembly.Module(raw)).map(x=>x.name).sort();
          assert.equal(scopedSteamChestWasmExportsOk(new WebAssembly.Module(raw)),true);
          assert.deepEqual(exports,SCOPED_STEAM_CHEST_WASM_EXPORTS);
          assert.deepEqual(Object.getOwnPropertyNames(WorkerWasmSource.prototype).sort(),
            ['constructor','__destroy_into_raw','free',...SCOPED_STEAM_CHEST_METHODS].sort());
          const sha=b=>createHash('sha256').update(b).digest('hex');
          const empty=()=>({ItemID:0,Amount:0,State:null});
          const d={GameInfo:{Version:626},ConditionalEventHistory:{ActiveEvents:{}},
            World:{GridCollection:{Grids:{'7':{ID:7,GridDefaultLayoutPath:'',Objects:{
              '4':{ID:4,ItemID:40001680,State:{Storage:{
                ContainerInventoryID:12,DefaultContainerInventoryData:'',UnlockKeyItemID:0,UnlockLocId:'',DesignID:null}}},
              '8':{ID:8,ItemID:40009998,State:{Mannequin:{
                BodyType:0,Clothes:{'0':50000001},ClothingCustomization:{'50000001':-1,'50000002':0},
                HairColorIndex:0,HairHighlightColor:0,IsMale:true}}}
            }}},DiffGrids:{}},MissionSlots:{},Villages:[{Areas:{'2':{GridIDs:[7],Unlocked:true}}}]},
            Player:{ListInventories:{
              '0':{ID:0,CompatibleItemType:'ItemType_Furniture',
                CompatibleFurnitureTypes:{List:['FurnitureItemType_Default']},
                Inventory:{'40000048':{Amount:3,Marker:'ItemMarker_None'}}},
              '2':{ID:2,CompatibleItemType:'ItemType_ActivityItem',
                Inventory:{'30200000':{Amount:2}}}},
              ContainerInventories:{
                '0':{ID:0,BelongsToPlayer:true,Size:1,ExtraSize:0,Inventory:[{ItemID:30200000,Amount:5,State:{}}]},
                '1':{ID:1,BelongsToPlayer:true,Size:1,ExtraSize:0,Inventory:[empty()]},
                '12':{ID:12,ParentItemID:40001680,BelongsToPlayer:true,BlockMoveTo:false,Size:48,ExtraSize:0,
                  Inventory:[{ItemID:30200000,Amount:50,State:null,Unknown:7},...Array.from({length:47},empty)]}
              },BackpackOverflow:{Items:[]},AchievementsData:[],EvolveStatesProfile:{EvolveProgressState:{}},
              DutySlots:{},BattlePassStates:{Progress:{},FtueProgress:{TasksProgress:[],WeeklyTasksProgress:[]}}},
            Unknown:{neverOverwrite:true}};
          const original=makeSyntheticP1gProfile(d),originalSha=sha(original);
          const source=new File([original],'original-synthetic.p1g');
          const backup=new File([original],'verified-durable-original.p1g');
          const build={platform:'steam-windows',buildKind:'steam-full-version',
            buildId:'releases_1.25-v1.25.3-44-g0b41250d9ac0-incremental-22',
            schema:626,externallyConfirmed:true};
          const worker=createP1gRustWorkerReadOnlyBridge(async()=>({WorkerWasmSource}),
            {allowSteam626ChestSource:true,
              readDurableOriginalBackup:async()=>backup});
          assert.equal((await worker.openScopedEncrypted({file:source,build,originalSha256:originalSha})).writerAuthorized,false);
          await worker.verifyScopedOriginalBackup(backup);
          const rows=worker.discoverScopedTargets('linked-crop-chest48');
          assert.ok(rows.some(r=>r.id===12&&r.selector===0&&r.itemId===30200000&&r.oldAmount===50));
          const selection={profile:'linked-crop-chest48',id:12,selector:0,newAmount:49};
          const preview=worker.previewScopedAmount(selection);
          assert.equal(preview.oldAmount,50);
          assert.equal(preview.writerAuthorized,false);
          const staged=await worker.stageScopedAmount();
          assert.equal(staged.exactFieldChangedCount,1);
          assert.equal(staged.writerAuthorized,false);
          assert.equal(worker.toggleScopedAmount(false).applied,false);
          assert.equal(worker.toggleScopedAmount(true).applied,true);
          const out=await worker.exportScopedEditedCopy();
          assert.equal(out.independentProcessReopenVerified,false);
          assert.equal(out.codecReopenVerified,true);
          const decoded=await p1gPackagedProfileCodec.loadProfile(out.encryptedBytes);
          const wanted=structuredClone(d);
          wanted.Player.ContainerInventories['12'].Inventory[0].Amount=49;
          assert.equal(decoded.jsonText,JSON.stringify(wanted));
          assert.equal(sha(new Uint8Array(await source.arrayBuffer())),originalSha);
          assert.equal(sha(new Uint8Array(await backup.arrayBuffer())),originalSha);
          const forbidden=createP1gRustWorkerReadOnlyBridge(async()=>({WorkerWasmSource}),
            {allowSteam626ChestSource:true,readDurableOriginalBackup:async()=>backup});
          await forbidden.openScopedEncrypted({file:source,build,originalSha256:originalSha});
          await forbidden.verifyScopedOriginalBackup(backup);
          assert.throws(()=>forbidden.previewScopedAmount({profile:'catalog0-furniture',id:0,selector:40000048,newAmount:2}));
          console.log('01A_ACTUAL_GENERATED_DEDICATED_STEAM626_CHEST_WASM_EXACT_ABI_ONEFIELD_P1G_PASS');
          NODE
      - name: Strict no product public route, no Owner keys and no artifact
        run: |
          set -euo pipefail
          grep -Fq -- '--features worker-wasm,indexed-read' .github/workflows/pages.yml
          test -z "$(git ls-files '*.p1g')"
          echo '01A_PRODUCT_CHEST_GENERATED_WASM_QA_ONLY_WRITER_OP_OFF'

name: "04 QR-W PR683 Steam626 multi-Village UNKNOWN independent"
on:
  pull_request:
    paths:
      - ".github/workflows/04qr-w-pr683-steam626-independent.yml"
      - "scripts/04qr-w-pr683-steam626-chrome.mjs"
      - "tests/04qr-w-pr683-steam626-independent.test.mjs"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  wep-steam626-qr-independent:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --no-audit --no-fund
      - name: Independent exactly six Source Git blobs and multi-Village Grid UNKNOWN
        run: node --test tests/04qr-w-pr683-steam626-independent.test.mjs
      - run: npm install --no-save --package-lock=false playwright-core@1.55.0
      - name: Resolve genuine Chrome and start isolated local editor
        shell: bash
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          "$CHROME_BIN" --version
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
          npm run dev -- --host 127.0.0.1 --port 4187 >/tmp/qr683-wep.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4187/editor/world/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/qr683-wep.log
          exit 1
      - name: Independent actual Chrome Steam626 later corrupt Village/Grid, Zoom, reset source
        env:
          QR683_E2E_URL: http://127.0.0.1:4187
        run: node scripts/04qr-w-pr683-steam626-chrome.mjs

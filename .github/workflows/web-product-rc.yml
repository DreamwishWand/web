name: WAND cumulative Source156 + WEB Product RC isolated acceptance
on:
  push:
    branches: ['int/wand-rc-source156-accepted-base-20261103']
  pull_request:
    paths:
      - 'src/lib/product-home/**'
      - 'src/routes/+page.svelte'
      - 'src/routes/rc-status/**'
      - 'tests/web-product-rc-route-safety.test.mjs'
      - 'scripts/web-product-rc-browser-acceptance.mjs'
      - '.github/workflows/web-product-rc.yml'
permissions:
  contents: read
jobs:
  source-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - name: Product RC route and fail-closed source
        run: node --test tests/web-product-rc-route-safety.test.mjs
      - name: Svelte static validation
        run: npm run check && npm run build
      - name: Exact migration ancestor and all Owner flags OFF
        shell: bash
        run: |
          set -euo pipefail
          echo INT_GUARD_STATIC_BEGIN
          test -f build/index.html
          test -f build/rc-status/index.html
          test -f build/help/index.html
          for d in decorate collection guide presets gallery dreamsnaps; do test -f "build/$d/index.html"; done
          echo INT_GUARD_STATIC_PASS
          echo INT_GUARD_OWNER_SOURCE_IDENTITY_BEGIN
          # Unlike the WEB313 ancestry, Source156 holds the accepted Owner flags.
          # Exact byte-identity (not a hardcoded filename/flag lookup) is required.
          git diff --exit-code 75a944ff644547badc7dc11e4293a1a166a87490 HEAD -- src/lib/dreamsnaps/
          echo INT_GUARD_OWNER_SOURCE_IDENTITY_PASS
          echo INT_GUARD_FROZEN_SOURCE_BEGIN
          git diff --exit-code 75a944ff644547badc7dc11e4293a1a166a87490 HEAD -- supabase/ src/lib/community/ src/lib/dreamsnaps/ src/lib/wep/
          echo INT_GUARD_FROZEN_SOURCE_PASS
          echo INT_GUARD_LEDGER_BEGIN
          find supabase/migrations -maxdepth 1 -name '*.sql' | wc -l
          test "$(find supabase/migrations -maxdepth 1 -name '*.sql' | wc -l)" -eq 156
          test -f supabase/migrations/20261102010000_community_source155_verified_first_account_bootstrap.sql
          test -f supabase/migrations/20261103010000_community_source156_signed_gallery_r16_atomic_writer.sql
          test ! -f supabase/migrations/20261102000010_source155_atomic_legacy_writer_draft.sql
          echo INT_GUARD_LEDGER_PASS
          echo WAND_INT_SOURCE156_WEB_UI_OFF_PROVENANCE_PASS
  actual-chromium:
    needs: source-and-build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm install --no-save --package-lock=false playwright-core@1.55.0
      - name: Resolve real Chromium
        shell: bash
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          "$CHROME_BIN" --version
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
      - name: Start isolated loopback Vite
        shell: bash
        run: |
          set -euo pipefail
          npm run dev -- --host 127.0.0.1 --port 4176 >/tmp/wand-int-vite.log 2>&1 &
          for i in $(seq 1 75); do
            if curl -fsS http://127.0.0.1:4176/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/wand-int-vite.log
          exit 1
      - name: Exact UI Chrome no-leak/OFF negative
        env:
          WEB_RC_BASE_URL: http://127.0.0.1:4176
        run: node scripts/web-product-rc-browser-acceptance.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wand-int-source156-web-rc-chrome
          path: .artifacts/web-rc/
          if-no-files-found: warn

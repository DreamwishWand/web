          test ! -e build/worker-wasm-scoped-steam626-comp03
      - name: Require exact successful protected-main CI before proof build
        id: scoped_ci
        run: node scripts/int-protected-ci-gate.mjs build
      - name: Fixed approved Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
          targets: wasm32-unknown-unknown
      - name: Verify unchanged R22 approved inputs and generate scoped proof subjects
        run: |
          set -euo pipefail
          cp scripts/wasm-distribution/approved-Cargo.lock crates/ddv-save-core/Cargo.lock
          node scripts/wasm-distribution/verify-protected-release.mjs inputs
          cargo build --locked --manifest-path crates/ddv-save-core/Cargo.toml --release --target wasm32-unknown-unknown --no-default-features --features product-steam626-comp03-scoped,worker-wasm
          cargo install wasm-bindgen-cli --version 0.2.105 --locked --root /tmp/wand-scoped-steam626-comp03-proof-bindgen
          mkdir -p tests/stage-e/pkg
          "$WAND_BINDGEN_CLI" "$CARGO_TARGET_DIR/wasm32-unknown-unknown/release/ddv_save_core.wasm" --out-dir tests/stage-e/pkg --target web --no-typescript
          node scripts/readonly-release/scoped-placement-proof.mjs build steam626-comp03 "$GITHUB_SHA"
          test "$(find tests/wasm-distribution/fixtures/scoped-steam626-comp03 -maxdepth 1 -type f | wc -l)" -eq 3
          test ! -e static/worker-wasm-scoped-steam626-comp03
          test ! -e build/worker-wasm-scoped-steam626-comp03
      - name: Revalidate exact predecessor and live main immediately before signing
        env:
          WAND_CI_RECEIPT: ${{ steps.scoped_ci.outputs.ci_receipt }}
        run: node scripts/int-protected-ci-gate.mjs deploy
      - name: Attest only three scoped proof subjects with existing Pages issuer
        id: scoped_sigstore
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            tests/wasm-distribution/fixtures/scoped-steam626-comp03/ddv_save_core.js
            tests/wasm-distribution/fixtures/scoped-steam626-comp03/ddv_save_core_bg.wasm
            tests/wasm-distribution/fixtures/scoped-steam626-comp03/manifest.json
      - name: Verify exact signer and subject bytes; stage only bundle and pins
        env:
          GH_TOKEN: ${{ github.token }}
          WAND_SCOPED_BUNDLE: ${{ steps.scoped_sigstore.outputs.bundle-path }}
          WAND_CI_RECEIPT: ${{ steps.scoped_ci.outputs.ci_receipt }}
        run: |
          set -euo pipefail
          test -s "$WAND_SCOPED_BUNDLE"
          mkdir "$RUNNER_TEMP/wand-steam626-comp03-proof"
          node scripts/readonly-release/scoped-placement-proof.mjs verify-protected-candidate steam626-comp03 "$GITHUB_SHA" tests/wasm-distribution/fixtures/scoped-steam626-comp03 "$WAND_SCOPED_BUNDLE" > "$RUNNER_TEMP/wand-steam626-comp03-verified.txt"
          node --input-type=module -e 'import fs from "node:fs"; import assert from "node:assert/strict"; const p=JSON.parse(fs.readFileSync("tests/wasm-distribution/fixtures/scoped-steam626-comp03-pins.json","utf8")); const prefix="SCOPED_PLACEMENT_PROTECTED_CANDIDATE_SIGNED_PROOF_ONLY "; const lines=fs.readFileSync(process.env.RUNNER_TEMP+"/wand-steam626-comp03-verified.txt","utf8").trim().split("\n").filter(l=>l.startsWith(prefix)); assert.equal(lines.length,1); assert.deepEqual(JSON.parse(lines[0].slice(prefix.length)),p); assert.equal(p.sourceHead,process.env.GITHUB_SHA); fs.writeFileSync(process.env.RUNNER_TEMP+"/wand-steam626-comp03-proof/pins.json",JSON.stringify(p)+"\n",{flag:"wx"});'
          cp "$WAND_SCOPED_BUNDLE" "$RUNNER_TEMP/wand-steam626-comp03-proof/attestation-bundle.jsonl"
          test "$(find "$RUNNER_TEMP/wand-steam626-comp03-proof" -maxdepth 1 -type f | wc -l)" -eq 2
          test ! -e static/worker-wasm-scoped-steam626-comp03
          test ! -e build/worker-wasm-scoped-steam626-comp03
          test -z "$(git diff --name-only HEAD -- src/lib/ddv/core/save/product-scoped-placement-release-anchor.mjs)"
          node scripts/int-protected-ci-gate.mjs deploy
      - name: Upload proof metadata only (never executable subjects)
        uses: actions/upload-artifact@v4
        with:
          name: scoped-steam626-comp03-proof-${{ github.sha }}
          path: |
            ${{ runner.temp }}/wand-steam626-comp03-proof/pins.json
            ${{ runner.temp }}/wand-steam626-comp03-proof/attestation-bundle.jsonl
          if-no-files-found: error


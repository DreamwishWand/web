name: Build and deploy Dreamwish Wand

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      scoped_collection_proof_source:
        description: 'Exact accepted protected-main SHA for proof-only Collection (leave empty for normal Pages)'
        type: string
        required: false
        default: ''
      scoped_switch_chest_proof_source:
        description: 'Exact accepted protected-main SHA for proof-only Switch626 Chest (exclusive with Collection)'
        type: string
        required: false
        default: ''
      scoped_steam_chest_proof_source:
        description: 'Exact accepted protected-main SHA for proof-only Steam626 Chest (exclusive with Collection and Switch Chest)'
        type: string
        required: false
        default: ''
      scoped_sr03_proof_source:
        description: 'Exact accepted protected-main SHA for proof-only Steam626 SR03 (exclusive)'
        type: string
        required: false
        default: ''
      scoped_comp03_spatial_proof_source:
        description: 'Exact accepted protected-main SHA for proof-only Steam626 COMP03 Spatial (exclusive)'
        type: string
        required: false
        default: ''
      scoped_rm01_proof_source:
        description: 'Exact accepted protected-main SHA for proof-only Switch626 RM01 (exclusive)'
        type: string
        required: false
        default: ''
      scoped_hair_proof_source:
        description: 'Exact accepted protected-main SHA for proof-only Steam626 Hair (exclusive)'
        type: string
        required: false
        default: ''
      scoped_skin_proof_source:
        description: 'Exact accepted protected-main SHA for proof-only Steam626 Skin (exclusive)'
        type: string
        required: false
        default: ''
      scoped_comp03_proof_source:
        description: 'Exact accepted protected-main SHA for proof-only Steam626 standard COMP03 (exclusive)'
        type: string
        required: false
        default: ''

permissions:
  contents: read
  # Only the build job attests the three Owner-approved read-only binaries.
  id-token: write
  attestations: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_dispatch' || (inputs.scoped_collection_proof_source == '' && inputs.scoped_switch_chest_proof_source == '' && inputs.scoped_steam_chest_proof_source == '' && inputs.scoped_sr03_proof_source == '' && inputs.scoped_comp03_spatial_proof_source == '' && inputs.scoped_rm01_proof_source == '' && inputs.scoped_hair_proof_source == '' && inputs.scoped_skin_proof_source == '' && inputs.scoped_comp03_proof_source == '')
    runs-on: ubuntu-latest
    env:
      # Owner 2026-11-11 explicitly authorized only these 3 inert assets.
      WAND_PUBLIC_READONLY_ASSET_GATE: OWNER_APPROVED_THREE_FILES_20261111
      WAND_APPROVED_RELEASE_LOCK: '1'
      WAND_SOURCE_HEAD: ${{ github.sha }}
      CARGO_TARGET_DIR: /tmp/wand-pages-r22-rust
    outputs:
      js_sha: ${{ steps.asset_pins.outputs.js_sha }}
      wasm_sha: ${{ steps.asset_pins.outputs.wasm_sha }}
      manifest_sha: ${{ steps.asset_pins.outputs.manifest_sha }}
      expected_root: ${{ steps.release_tuple.outputs.root }}
      ci_receipt: ${{ steps.protected_ci.outputs.ci_receipt }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read committed active release tuple (not caller or environment selection)
        id: release_tuple
        run: |
          # ACT505 staging keeps the existing /web build. A future cutover
          # must explicitly change BOTH the committed selector and Pages base.
          node --input-type=module -e 'import {ACTIVE_RELEASE_TUPLE as t} from "./src/lib/ddv/core/save/product-rust-wasm-release-trust.mjs"; console.log("base="+t.basePath); console.log("root="+t.origin+t.basePath)' >> "$GITHUB_OUTPUT"
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi
      - name: Type and component checks
        run: npm run check
      - name: Shared web accessibility/localization gates
        run: npm run verify:web-foundation
      - name: Canonical baseline integrity
        run: npm run verify:canonical
      - name: Community operations contract
        run: npm run verify:community-ops
      - name: Integrated production tree preflight
        run: npm run verify:community-integrated-tree -- --require-ready
      - name: Starter tests
        run: npm test
      - name: Fixed attested Rust compiler and WebAssembly target
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
          targets: wasm32-unknown-unknown
      - name: Verify exact protected-main release inputs and dependency lock
        env:
          WAND_RELEASE_BASE_PATH: /web
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$WAND_SOURCE_HEAD"
          cp scripts/wasm-distribution/approved-Cargo.lock crates/ddv-save-core/Cargo.lock
          test "$WAND_RELEASE_BASE_PATH" = "${{ steps.release_tuple.outputs.base }}"
          node scripts/wasm-distribution/verify-protected-release.mjs inputs
      - name: Generate genuine read-only Rust wasm32 from this protected main
        run: |
          set -euo pipefail
          cargo build --locked --manifest-path crates/ddv-save-core/Cargo.toml \
            --release --target wasm32-unknown-unknown --no-default-features \
            --features worker-wasm,indexed-read
          test -s "$CARGO_TARGET_DIR/wasm32-unknown-unknown/release/ddv_save_core.wasm"
      - name: Bind exact generated WASM to JavaScript with wasm-bindgen 0.2.105
        run: |
          set -euo pipefail
          cargo install wasm-bindgen-cli --version 0.2.105 --locked \
            --root /tmp/wand-pages-bindgen
          /tmp/wand-pages-bindgen/bin/wasm-bindgen --version | grep -Fx 'wasm-bindgen 0.2.105'
          mkdir -p tests/stage-e/pkg
          /tmp/wand-pages-bindgen/bin/wasm-bindgen \
            "$CARGO_TARGET_DIR/wasm32-unknown-unknown/release/ddv_save_core.wasm" \
            --out-dir tests/stage-e/pkg --target web --no-typescript
      - name: Stage exactly three Owner-approved public read-only files
        env:
          WAND_BINDGEN_CLI: /tmp/wand-pages-bindgen/bin/wasm-bindgen
        run: |
          set -euo pipefail
          node scripts/wasm-distribution/build-candidate.mjs
          test -s static/worker-wasm/ddv_save_core.js
          test -s static/worker-wasm/ddv_save_core_bg.wasm
          test -s static/worker-wasm/manifest.json
          test ! -e static/worker-wasm/Cargo.lock
          test "$(find static/worker-wasm -maxdepth 1 -type f | wc -l)" -eq 3
          test -z "$(git ls-files static/worker-wasm)"
      - name: GitHub OIDC Sigstore attests the ACTUAL three Pages input bytes
        id: asset_sigstore
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            static/worker-wasm/ddv_save_core.js
            static/worker-wasm/ddv_save_core_bg.wasm
            static/worker-wasm/manifest.json
      - name: Seal exact signed release identity into the trusted Worker build input
        env:
          GH_TOKEN: ${{ github.token }}
          WAND_SIGSTORE_BUNDLE: ${{ steps.asset_sigstore.outputs.bundle-path }}
        run: node scripts/readonly-release/seal.mjs seal
      - name: Build static site
        env:
          BASE_PATH: /web
          VITE_SUPABASE_URL: ${{ vars.DREAMWISH_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.DREAMWISH_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build
      - name: Verify Pages physical JS, WASM and Manifest equal protected-main source
        env:
          WAND_RELEASE_BASE_PATH: /web
        run: |
          set -euo pipefail
          node scripts/wasm-distribution/verify-protected-release.mjs built
          test "$(find build/worker-wasm -maxdepth 1 -type f | wc -l)" -eq 3
          node scripts/readonly-release/seal.mjs check-built
      - name: Verify all three signatures before Pages artifact upload
        env:
          GH_TOKEN: ${{ github.token }}
          WAND_RELEASE_BASE_PATH: /web
          WAND_SIGSTORE_BUNDLE: ${{ steps.asset_sigstore.outputs.bundle-path }}
        run: |
          set -euo pipefail
          test -s "$WAND_SIGSTORE_BUNDLE"
          gh attestation verify static/worker-wasm/ddv_save_core.js \
            --repo "$GITHUB_REPOSITORY" --bundle "$WAND_SIGSTORE_BUNDLE"
          gh attestation verify static/worker-wasm/ddv_save_core_bg.wasm \
            --repo "$GITHUB_REPOSITORY" --bundle "$WAND_SIGSTORE_BUNDLE"
          gh attestation verify static/worker-wasm/manifest.json \
            --repo "$GITHUB_REPOSITORY" --bundle "$WAND_SIGSTORE_BUNDLE"
          # Final byte comparison takes place AFTER successful authentic signatures.
          node scripts/wasm-distribution/verify-protected-release.mjs built
          echo 'R22_OWNER_APPROVED_PUBLIC_READONLY_THREE_SIGNED_BYTES_MATCH_PAGES'
      - name: Pin all three real signed asset digests for post-deploy HTTPS check
        id: asset_pins
        run: |
          set -euo pipefail
          echo "js_sha=$(sha256sum build/worker-wasm/ddv_save_core.js | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "wasm_sha=$(sha256sum build/worker-wasm/ddv_save_core_bg.wasm | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "manifest_sha=$(sha256sum build/worker-wasm/manifest.json | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Verify static routes
        run: |
          test -f build/index.html
          test -f build/editor/index.html
          test -f build/editor/items/index.html
          test -f build/editor/world/index.html
          test -f build/editor/timing/index.html
          test -f build/explore/index.html
          test -f build/decorate/index.html
          test -f build/discover/index.html
          test -f build/presets/index.html
          test -f build/projects/index.html
          test -f build/help/index.html
          test -f build/gallery/index.html
          test -f build/gallery/publish/index.html
          test -f build/gallery/my/index.html
          test -f build/gallery/interact/index.html
          test -f build/gallery/dreamsnaps/index.html
          test -f build/qa/index.html
          test -f build/qa/ask/index.html
          test -f build/qa/participate/index.html
          test -f build/qa/tip/index.html
          test -f build/qa/my/index.html
          test -f build/creator/index.html
          test -f build/dreamsnaps/index.html
          test -f build/dreamsnaps/submit/index.html
          test -f build/dreamsnaps/judge/index.html
          test -f build/dreamsnaps/results/index.html
          test -f build/dreamsnaps/my/index.html
          test -f build/community-lab/index.html
          test -f build/community-lab/account/index.html
          test -f build/community-lab/profiles/index.html
          test -f build/community-lab/recovery/index.html
          test -f build/community-ops/index.html
          test -f build/404.html
      - name: Require successful exact protected-main CI before Pages upload
        id: protected_ci
        run: node scripts/int-protected-ci-gate.mjs build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Set up Node.js for exact deploy-time CI revalidation
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refuse stale main or CI receipt immediately before Pages deployment
        env:
          WAND_CI_RECEIPT: ${{ needs.build.outputs.ci_receipt }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY_ID" == 1371485649 && "$GITHUB_REF" == refs/heads/main ]]
          [[ "$GITHUB_REPOSITORY" == DreamwishWand/web || "$GITHUB_REPOSITORY" == DreamwishWand/site ]]
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ && -n "$WAND_CI_RECEIPT" ]]
          # Public exact commit, no token and no additional job permissions.
          # Read only the two pinned scripts from a disposable Git repository.
          dir="$(mktemp -d)"
          trap 'rm -rf "$dir"' EXIT
          export GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_TERMINAL_PROMPT=0
          git -C "$dir" init -q
          git -C "$dir" -c core.hooksPath=/dev/null -c core.fsmonitor=false fetch --no-tags --no-recurse-submodules --depth=1 "https://github.com/$GITHUB_REPOSITORY.git" "$GITHUB_SHA"
          test "$(git -C "$dir" rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git -C "$dir" -c core.hooksPath=/dev/null update-ref HEAD "$GITHUB_SHA"
          mkdir "$dir/scripts"
          for script in int-protected-ci-gate.mjs int-ci-evidence-preflight.mjs; do
            git -C "$dir" show "$GITHUB_SHA:scripts/$script" > "$dir/scripts/$script"
          done
          (cd "$dir" && node scripts/int-protected-ci-gate.mjs deploy)
      - name: Deploy existing Pages including only verified three read-only assets
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify actual same-origin HTTPS bytes, status, MIME and no redirect
        env:
          WAND_DEPLOYED_BASE_URL: ${{ steps.deployment.outputs.page_url }}
          WAND_EXPECTED_BASE_URL: ${{ needs.build.outputs.expected_root }}
          WAND_JS_SHA256: ${{ needs.build.outputs.js_sha }}
          WAND_WASM_SHA256: ${{ needs.build.outputs.wasm_sha }}
          WAND_MANIFEST_SHA256: ${{ needs.build.outputs.manifest_sha }}
        shell: bash
        run: |
          set -euo pipefail
          root="${WAND_DEPLOYED_BASE_URL%/}"
          [[ "$root" == "$WAND_EXPECTED_BASE_URL" ]] || { echo 'LIVE_RELEASE_TUPLE_MISMATCH'; exit 1; }
          for spec in "ddv_save_core.js:$WAND_JS_SHA256:js" \
                      "ddv_save_core_bg.wasm:$WAND_WASM_SHA256:wasm" \
                      "manifest.json:$WAND_MANIFEST_SHA256:json"; do
            IFS=: read -r file sha typ <<< "$spec"
            ok=0
            for attempt in 1 2 3 4 5 6 7 8; do
              response="$(mktemp)"
              headers="$(mktemp)"
              code="$(curl --silent --show-error --max-time 25 --max-redirs 0 \
                -H 'Cache-Control: no-cache' -D "$headers" -o "$response" \
                -w '%{http_code}' "$root/worker-wasm/$file" || true)"
              if [[ "$code" == 200 && "$(sha256sum "$response" | cut -d' ' -f1)" == "$sha" ]]; then
                mime="$(awk 'tolower($1)=="content-type:" {print tolower($2)}' "$headers" | tr -d '\r' | tail -1)"
                case "$typ:$mime" in
                  js:text/javascript*|js:application/javascript*|wasm:application/wasm*|json:application/json*) ok=1 ;;
                  *) echo "LIVE_BAD_MIME $file $mime";;
                esac
              fi
              rm -f "$response" "$headers"
              [[ "$ok" == 1 ]] && break
              sleep 6
            done
            [[ "$ok" == 1 ]] || { echo "LIVE_TRIPLE_ASSET_PROVENANCE_FAIL $file"; exit 1; }
            echo "R22_PUBLIC_HTTPS_SIGNED_ASSET_VERIFIED $file"
          done
          echo 'R22_PUBLIC_READONLY_THREE_ASSETS_REAL_HTTPS_DEPLOY_PASS_PRODUCT_UI_OFF'

  # Explicit protected proof-only dispatch. No normal Pages build/deploy, no
  # public scoped files, no generated anchor, no executable artifact upload.
  scoped_collection_proof:
    if: github.event_name == 'workflow_dispatch' && inputs.scoped_collection_proof_source != '' && inputs.scoped_switch_chest_proof_source == '' && inputs.scoped_steam_chest_proof_source == '' && inputs.scoped_sr03_proof_source == '' && inputs.scoped_comp03_spatial_proof_source == '' && inputs.scoped_rm01_proof_source == '' && inputs.scoped_hair_proof_source == '' && inputs.scoped_skin_proof_source == '' && inputs.scoped_comp03_proof_source == '' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      WAND_SOURCE_HEAD: ${{ github.sha }}
      WAND_PROOF_EXPECTED_SOURCE: ${{ inputs.scoped_collection_proof_source }}
      WAND_PUBLIC_READONLY_ASSET_GATE: OWNER_APPROVED_THREE_FILES_20261111
      WAND_APPROVED_RELEASE_LOCK: '1'
      WAND_RELEASE_BASE_PATH: /web
      WAND_CANDIDATE_BASE_PATH: /web
      WAND_SCOPED_CORE_DIR: ${{ github.workspace }}
      CARGO_TARGET_DIR: /tmp/wand-scoped-collection-proof-rust
      WAND_BINDGEN_CLI: /tmp/wand-scoped-collection-proof-bindgen/bin/wasm-bindgen
    steps:
      - name: Check out exact protected source in separate proof-only job
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require exact accepted source and immutable scoped proof inputs
        run: |
          set -euo pipefail
          [[ "$WAND_PROOF_EXPECTED_SOURCE" =~ ^[0-9a-f]{40}$ ]]
          test "$WAND_PROOF_EXPECTED_SOURCE" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_WORKFLOW_SHA" = "$GITHUB_SHA"
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_REPOSITORY_ID" = 1371485649
          test "$(git rev-parse HEAD:crates/ddv-save-core)" = 681177d588b7bfba04f2497dff81e36163a3350e
          test "$(git rev-parse HEAD:scripts/wasm-distribution/build-scoped-collection-candidate.mjs)" = 0f8d9d8e00ea8531e7bac51a0b2c62afbd468292
          test "$(git rev-parse HEAD:scripts/readonly-release/seal-scoped-collection-private.mjs)" = 9dc1d8fa5c2f422814a20fd8368e4f3516a6c79a
          test "$(git rev-parse HEAD:scripts/readonly-release/seal.mjs)" = 5b86ff1cf2dc009ba1733bf213e4cb979bf500ec
          test "$(git rev-parse HEAD:src/lib/ddv/core/save/product-scoped-collection-release-anchor.mjs)" = fd4368ece7d36d39382cb9b21bfef8ad3da267b8
          test "$(git rev-parse HEAD:src/lib/ddv/core/save/product-scoped-collection-release.mjs)" = c0a5cd7afe68269de4c48a479a1ec685cbb4dc12
          test "$(git rev-parse HEAD:src/lib/ddv/core/save/product-rust-wasm-candidate-loader.mjs)" = 959d0ef46c220ed6a402499ca3587b00275d8244
          test "$(git rev-parse HEAD:src/lib/collection/CollectionExact1Dev.svelte)" = 59ab5f644b64c0db3bb27d5b84499b3f19e1fcfe
          test "$(git rev-parse HEAD:src/lib/collection/product-collection-client.mjs)" = cb4da049943eb8cad8ccba1b17f347a2d4c6fd50
          test "$(git rev-parse HEAD:src/lib/collection/product-collection.worker.mjs)" = 43d24307f016a85298cabd81c389215a83504f7b
          test "$(git rev-parse HEAD:src/routes/editor/collection/+page.svelte)" = e6bffa8987530a9a62444260e2105cd64fcd7aff
          test -z "$(git ls-files static/worker-wasm-scoped-collection)"
          test ! -e static/worker-wasm-scoped-collection
          test ! -e build/worker-wasm-scoped-collection
      - name: Require exact successful protected-main CI before proof build
        id: scoped_ci
        run: node scripts/int-protected-ci-gate.mjs build
      - name: Fixed approved Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
          targets: wasm32-unknown-unknown
      - name: Verify unchanged R22 approved inputs and generate scoped proof subjects
        run: |
          set -euo pipefail
          cp scripts/wasm-distribution/approved-Cargo.lock crates/ddv-save-core/Cargo.lock
          node scripts/wasm-distribution/verify-protected-release.mjs inputs
          cargo build --locked --manifest-path crates/ddv-save-core/Cargo.toml --release --target wasm32-unknown-unknown --no-default-features --features product-collection-scoped,semantic-writer-dev,worker-wasm
          cargo install wasm-bindgen-cli --version 0.2.105 --locked --root /tmp/wand-scoped-collection-proof-bindgen
          mkdir -p tests/stage-e/pkg
          "$WAND_BINDGEN_CLI" "$CARGO_TARGET_DIR/wasm32-unknown-unknown/release/ddv_save_core.wasm" --out-dir tests/stage-e/pkg --target web --no-typescript
          node scripts/wasm-distribution/build-scoped-collection-candidate.mjs
          test "$(find tests/wasm-distribution/fixtures/scoped-collection -maxdepth 1 -type f | wc -l)" -eq 3
          test ! -e static/worker-wasm-scoped-collection
          test ! -e build/worker-wasm-scoped-collection
      - name: Revalidate exact predecessor and live main immediately before signing
        env:
          WAND_CI_RECEIPT: ${{ steps.scoped_ci.outputs.ci_receipt }}
        run: node scripts/int-protected-ci-gate.mjs deploy
      - name: Attest only three scoped proof subjects with existing Pages issuer
        id: scoped_sigstore
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            tests/wasm-distribution/fixtures/scoped-collection/ddv_save_core.js
            tests/wasm-distribution/fixtures/scoped-collection/ddv_save_core_bg.wasm
            tests/wasm-distribution/fixtures/scoped-collection/manifest.json
      - name: Verify exact signer and subject bytes; stage only bundle and pins
        env:
          GH_TOKEN: ${{ github.token }}
          WAND_SCOPED_BUNDLE: ${{ steps.scoped_sigstore.outputs.bundle-path }}
          WAND_CI_RECEIPT: ${{ steps.scoped_ci.outputs.ci_receipt }}
        run: |
          set -euo pipefail
          test -s "$WAND_SCOPED_BUNDLE"
          mkdir "$RUNNER_TEMP/wand-scoped-proof"
          node scripts/readonly-release/seal-scoped-collection-private.mjs verify-protected-candidate "$GITHUB_SHA" tests/wasm-distribution/fixtures/scoped-collection "$WAND_SCOPED_BUNDLE" > "$RUNNER_TEMP/wand-scoped-verified.txt"
          node --input-type=module -e 'import fs from "node:fs"; import assert from "node:assert/strict"; const p=JSON.parse(fs.readFileSync("tests/wasm-distribution/fixtures/scoped-collection-pins.json","utf8")); const prefix="SCOPED_COLLECTION_PROTECTED_CANDIDATE_SIGNED_PROOF_ONLY "; const lines=fs.readFileSync(process.env.RUNNER_TEMP+"/wand-scoped-verified.txt","utf8").trim().split("\n").filter(l=>l.startsWith(prefix)); assert.equal(lines.length,1); assert.deepEqual(JSON.parse(lines[0].slice(prefix.length)),p); assert.equal(p.sourceHead,process.env.GITHUB_SHA); fs.writeFileSync(process.env.RUNNER_TEMP+"/wand-scoped-proof/pins.json",JSON.stringify(p)+"\n",{flag:"wx"});'
          cp "$WAND_SCOPED_BUNDLE" "$RUNNER_TEMP/wand-scoped-proof/attestation-bundle.jsonl"
          test "$(find "$RUNNER_TEMP/wand-scoped-proof" -maxdepth 1 -type f | wc -l)" -eq 2
          test ! -e static/worker-wasm-scoped-collection
          test ! -e build/worker-wasm-scoped-collection
          test -z "$(git diff --name-only HEAD -- src/lib/ddv/core/save/product-scoped-collection-release-anchor.mjs)"
          node scripts/int-protected-ci-gate.mjs deploy
      - name: Upload proof metadata only (never executable subjects)
        uses: actions/upload-artifact@v4
        with:
          name: scoped-collection-proof-${{ github.sha }}
          path: |
            ${{ runner.temp }}/wand-scoped-proof/pins.json
            ${{ runner.temp }}/wand-scoped-proof/attestation-bundle.jsonl
          if-no-files-found: error

  scoped_switch_chest_proof:
    if: github.event_name == 'workflow_dispatch' && inputs.scoped_switch_chest_proof_source != '' && inputs.scoped_collection_proof_source == '' && inputs.scoped_steam_chest_proof_source == '' && inputs.scoped_sr03_proof_source == '' && inputs.scoped_comp03_spatial_proof_source == '' && inputs.scoped_rm01_proof_source == '' && inputs.scoped_hair_proof_source == '' && inputs.scoped_skin_proof_source == '' && inputs.scoped_comp03_proof_source == '' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      WAND_SOURCE_HEAD: ${{ github.sha }}
      WAND_PROOF_EXPECTED_SOURCE: ${{ inputs.scoped_switch_chest_proof_source }}

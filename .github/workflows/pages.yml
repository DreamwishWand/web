name: Build and deploy Dreamwish Wand

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi
      - name: Type and component checks
        run: npm run check
      - name: Canonical baseline integrity
        run: npm run verify:canonical
      - name: Starter tests
        run: npm test
      - name: Build static site
        env:
          BASE_PATH: /web
        run: npm run build
      - name: Verify static routes
        run: |
          test -f build/index.html
          test -f build/editor/index.html
          test -f build/editor/items/index.html
          test -f build/explore/index.html
          test -f build/404.html
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

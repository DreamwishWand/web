name: Build and deploy Dreamwish Wand

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi
      - name: Type and component checks
        run: npm run check
      - name: Shared web accessibility/localization gates
        run: npm run verify:web-foundation
      - name: Canonical baseline integrity
        run: npm run verify:canonical
      - name: Community operations contract
        run: npm run verify:community-ops
      - name: Integrated production tree preflight
        run: npm run verify:community-integrated-tree -- --require-ready
      - name: Starter tests
        run: npm test
      - name: Build static site
        env:
          BASE_PATH: /web
          VITE_SUPABASE_URL: ${{ vars.DREAMWISH_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.DREAMWISH_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build
      - name: Verify static routes
        run: |
          test -f build/index.html
          test -f build/editor/index.html
          test -f build/editor/items/index.html
          test -f build/editor/world/index.html
          test -f build/explore/index.html
          test -f build/decorate/index.html
          test -f build/discover/index.html
          test -f build/presets/index.html
          test -f build/presets/publish/index.html
          test -f build/presets/detail/index.html
          test -f build/projects/index.html
          test -f build/help/index.html
          test -f build/gallery/index.html
          test -f build/gallery/publish/index.html
          test -f build/gallery/my/index.html
          test -f build/gallery/interact/index.html
          test -f build/gallery/dreamsnaps/index.html
          test -f build/qa/index.html
          test -f build/qa/ask/index.html
          test -f build/qa/participate/index.html
          test -f build/qa/tip/index.html
          test -f build/qa/my/index.html
          test -f build/creator/index.html
          test -f build/dreamsnaps/index.html
          test -f build/dreamsnaps/submit/index.html
          test -f build/dreamsnaps/judge/index.html
          test -f build/dreamsnaps/results/index.html
          test -f build/dreamsnaps/my/index.html
          test -f build/community-lab/index.html
          test -f build/community-lab/account/index.html
          test -f build/community-lab/profiles/index.html
          test -f build/community-lab/recovery/index.html
          test -f build/community-ops/index.html
          test -f build/404.html
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

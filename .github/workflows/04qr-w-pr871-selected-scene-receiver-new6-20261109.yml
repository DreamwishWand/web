name: "04 QR-W PR871 one-shot local Scene selected receiver independent QA"
on:
  push:
    branches: [qa/04qr-w-pr871-selected-scene-receiver-new6-20261109]
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/04qr-w-pr871-selected-scene-receiver-new6-20261109.yml"
      - "scripts/04qr-w-pr871-selected-scene-receiver-new6-20261109.mjs"
permissions:
  contents: read
jobs:
  selected-route-receiver:
    runs-on: ubuntu-24.04
    timeout-minutes: 33
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm install --no-save --package-lock=false playwright-core@1.55.0
      - name: "Actual Chrome synthetic fixed Source only, no Private Save"
        shell: bash
        run: |
          set -euo pipefail
          test -z "${DDV_PRIVATE_SAVE_PATH:-}"
          test -z "${WEP_PRIVATE_P1G_PATH:-}"
          BIN="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || true)"
          test -n "$BIN"
          "$BIN" --version
          echo "CHROME_BIN=$BIN" >> "$GITHUB_ENV"
          BASE_PATH='' npm run dev -- --host 127.0.0.1 --port 4354 >/tmp/qrw871.log 2>&1 &
          for i in $(seq 1 75); do
            if curl -fsS http://127.0.0.1:4354/editor/world/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/qrw871.log
          exit 1
      - name: "Independent new6 immutable Source and real Chrome receiver E2E"
        env:
          QRW871_ORIGIN: http://127.0.0.1:4354
        run: node scripts/04qr-w-pr871-selected-scene-receiver-new6-20261109.mjs
      - name: "QA gate"
        run: echo "QRW871_RECEIVER_ONLY_NO_PRODUCT_APPLY_WRITER_CLOUD_PROVIDER_COMMUNITY"

          git show c0e489a0f5e3866e6c688c567ac9cae9708bd333:crates/ddv-save-core/src/reference_span_walk.rs > 'crates/ddv-save-core/src/reference_span_walk.rs'
          test "$(git hash-object 'crates/ddv-save-core/src/reference_span_walk.rs')" = f12edf8eed2d6575bb0c581679e038658f126692
          test "$(git rev-parse HEAD:crates/ddv-save-core/src/wasm_worker.rs)" = 387afcb5bc151942fcc7f5848e3d9d5722b90de5
          test "$(git rev-parse c0e489a0f5e3866e6c688c567ac9cae9708bd333:crates/ddv-save-core/src/wasm_worker.rs)" = e76367efe988e733459a19519f00ec5bd8fa76d5
          git show c0e489a0f5e3866e6c688c567ac9cae9708bd333:crates/ddv-save-core/src/wasm_worker.rs > 'crates/ddv-save-core/src/wasm_worker.rs'
          test "$(git hash-object 'crates/ddv-save-core/src/wasm_worker.rs')" = e76367efe988e733459a19519f00ec5bd8fa76d5
          test "$(git rev-parse HEAD:crates/ddv-save-core/src/worker_session.rs)" = d84fcd08849c9eaae046aeaa16d217b77d0b3b0d

name: "04 QR-W PR837 changed-only opt-in legacy isolation Chrome"
on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/04qr-w-pr837-atomic-optin-newonly-20261109.yml"
      - "scripts/04qr-w-pr837-atomic-optin-newonly-20261109.mjs"
  push:
    branches: [qa/04qr-w-pr837-optin-legacy-isolation-46f0c7-20261109]
permissions:
  contents: read
jobs:
  independent-optin-legacy-isolation:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm install --no-save --package-lock=false playwright-core@1.55.0
      - name: "Disposable Vite origin + installed Chrome"
        shell: bash
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
          BASE_PATH='' npm run dev -- --host 127.0.0.1 --port 4311 >/tmp/qrw-pr837-local.log 2>&1 &
          for i in $(seq 1 75); do
            if curl -fsS http://127.0.0.1:4311/moodboards/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/qrw-pr837-local.log
          exit 1
      - name: "Independent exact 5 frozen Source + opt-in only Chrome negatives"
        env:
          QRW837_ORIGIN: http://127.0.0.1:4311
        run: node scripts/04qr-w-pr837-atomic-optin-newonly-20261109.mjs
      - name: "Owner-controlled global mixed-store migration and product writer are separate gates"
        run: echo "QRW837_GLOBAL_BOARDID_AUTHORITY_MIGRATION_REAL_SAVE_WRITER_NOT_RUN_OFF"

name: 05 QR-C PR1173 independent RM01 atomic
on:
  pull_request:
    paths:
      - 'tests/qa/05qrc-pr1173-rm01.py'
      - 'crates/ddv-save-core/tests/qa_pr1173_rm01.rs'
      - '.github/workflows/05qrc-pr1173-rm01.yml'
permissions:
  contents: read
jobs:
  independent:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
      - name: Exact Source and QA-only additions
        run: |
          source=0bd6c0ea9fb9cfd2995b1feccf2abde2cf117de6
          test "$(git merge-base "$source" HEAD)" = "$source"
          test "$(git diff --name-only "$source" HEAD | wc -l)" -eq 3
          test "$(git diff --diff-filter=A --name-only "$source" HEAD | wc -l)" -eq 3
          test "$(git rev-parse HEAD:crates/ddv-save-core/src/product_session.rs)" = 5d83e1e9bba68dd8a77987ed1bc52150c7ed6eaa
          test "$(git rev-parse HEAD:crates/ddv-save-core/src/semantic_writer.rs)" = 959ca45b17dae2d3a0a3f5180f9cd25abd8574ae
          test "$(git rev-parse HEAD:crates/ddv-save-core/src/bin/wand-local-rust-v2-noop.rs)" = f610421f723e8d0234398eaf9ec20f1581c0ff24
          test "$(git rev-parse HEAD:crates/ddv-save-core/src/switch624_road_rm01.rs)" = bdf66c3ce068896f3bf26473313bd1e13daf6cb5
      - name: Locked native exact lexical and concurrent CAS tests
        run: |
          git show 08fd6694ec95ad2c6d648722f8e8c204b6115f9d:scripts/wasm-distribution/approved-Cargo.lock > crates/ddv-save-core/Cargo.lock
          echo 'e58486d673df79bfe7e72b80449e39389e57010fe4051edcdcff9b53c2da898c  crates/ddv-save-core/Cargo.lock' | sha256sum -c -
          cargo build --locked --manifest-path crates/ddv-save-core/Cargo.toml --no-default-features --features private-native-v2,semantic-writer-dev --bin wand-local-rust-v2-noop
          python3 tests/qa/05qrc-pr1173-rm01.py crates/ddv-save-core/target/debug/wand-local-rust-v2-noop
          cargo test --locked --manifest-path crates/ddv-save-core/Cargo.toml --no-default-features --features semantic-writer-dev --test qa_pr1173_rm01 -- --nocapture

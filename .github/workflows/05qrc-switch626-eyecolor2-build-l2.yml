name: 05 QR-C Switch626 EyeColor2 Build exact1 L2 (QA ONLY NEVER MERGE)
on:
  pull_request:
    paths:
      - '.github/workflows/05qrc-switch626-eyecolor2-build-l2.yml'
      - 'crates/ddv-save-core/src/product_eyeball_color2.rs'
permissions:
  contents: read
jobs:
  qrc1920-switch626-eyecolor2:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CARGO_TARGET_DIR: /tmp/wand-qrc1920-cargo-target
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Frozen PR1920 Source and exactly two QA-only changed paths
        run: |
          set -euo pipefail
          git cat-file -e 5543d1291379c3ce2206fd25cfd9fe305f72fd5e^{commit}
          test "$(git merge-base 5543d1291379c3ce2206fd25cfd9fe305f72fd5e HEAD)" = 5543d1291379c3ce2206fd25cfd9fe305f72fd5e
          git diff --name-only 5543d1291379c3ce2206fd25cfd9fe305f72fd5e HEAD | LC_ALL=C sort > /tmp/qrc1920-current
          printf '%s\n' '.github/workflows/05qrc-switch626-eyecolor2-build-l2.yml' 'crates/ddv-save-core/src/product_eyeball_color2.rs' | LC_ALL=C sort > /tmp/qrc1920-expected
          diff -u /tmp/qrc1920-expected /tmp/qrc1920-current
          git diff --exit-code 5543d1291379c3ce2206fd25cfd9fe305f72fd5e HEAD -- crates/ddv-save-core/src/semantic_writer.rs crates/ddv-save-core/Cargo.toml crates/ddv-save-core/src/wasm_worker.rs .github/workflows/core-product-session-boundary.yml
          echo QRC1920_FIXED_SOURCE_QA_ONLY_BOUNDARY_PASS
      - name: Independent Switch626 scalar witness refutation and child decoded Reopen
        run: |
          set -euo pipefail
          cargo generate-lockfile --manifest-path crates/ddv-save-core/Cargo.toml
          sha256sum crates/ddv-save-core/Cargo.lock > /tmp/qrc1920-lock.sha
          cargo test --locked --manifest-path crates/ddv-save-core/Cargo.toml --features product-switch626-eyecolor2-internal --lib qa1920_switch626_eyecolor2_exact_witness_refutation -- --nocapture
          test -s /tmp/qrc1920-switch-eyecolor2-original.json
          test -s /tmp/qrc1920-switch-eyecolor2-edited.json
          cargo test --locked --manifest-path crates/ddv-save-core/Cargo.toml --features product-switch626-eyecolor2-internal --lib qa1920_switch626_eyecolor2_child_reopen -- --ignored --nocapture
          cargo check --locked --manifest-path crates/ddv-save-core/Cargo.toml --target wasm32-unknown-unknown --no-default-features --features worker-wasm,product-switch626-eyecolor2-internal
          cargo check --locked --manifest-path crates/ddv-save-core/Cargo.toml --target wasm32-unknown-unknown --no-default-features --features worker-wasm,product-switch626-eyecolor2-internal,product-steam626-hair-scoped,product-switch626-rm01-scoped
          sha256sum -c /tmp/qrc1920-lock.sha

name: WEB Owner candidate revalidation OFF contract (NEW ONLY)
on:
  push:
    branches: ['web/owner-source153-revalidation-off-*']
  pull_request:
    paths:
      - 'src/lib/dreamsnaps/owner-read-revalidation.js'
      - 'src/routes/dreamsnaps/my/manage/source153-e2/+page.svelte'
      - 'tests/web-owner-read-revalidation.test.mjs'
      - 'tests/web-source153-owner-browser-e2.test.mjs'
      - 'scripts/web-owner-revalidation-chrome.mjs'
      - 'scripts/web-owner-revalidation-fixture.py'
      - 'docs/web/owner-read-revalidation-invalidation-contract-20261102.md'
      - '.github/workflows/web-owner-revalidation-local-e2.yml'
permissions:
  contents: read
concurrency:
  group: web-owner-revalidation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - name: New-only Owner candidate state and lifecycle
        run: node --test tests/web-owner-read-revalidation.test.mjs
      - name: Svelte check
        run: npm run check
      - name: Production build with Owner flags OFF
        run: npm run build
      - name: Strict frozen PR290 ancestry, eight paths, and protected source parity
        shell: bash
        run: |
          set -euo pipefail
          BASE=1123bcca3e04c24e7dbd42a4c7de125881e92aca
          git merge-base --is-ancestor "$BASE" HEAD
          git diff --exit-code "$BASE" HEAD -- supabase/ src/lib/dreamsnaps/source153-owner-consumer-v2.js src/lib/dreamsnaps/source153-owner-browser-e2.js src/lib/dreamsnaps/owner-management.js src/routes/dreamsnaps/my/manage/+page.svelte src/lib/community/ src/routes/creator/ src/routes/qa/ src/routes/gallery/
          test "$(git hash-object src/lib/dreamsnaps/source153-owner-consumer-v2.js)" = f981b7596711b47bceb2fa79a2191e79e8f1b459
          test "$(git hash-object src/lib/dreamsnaps/source153-owner-browser-e2.js)" = 7468f9550e3e196d28b84c246ff529d2c5daa66e
          test "$(git hash-object src/lib/dreamsnaps/owner-management.js)" = baca9c6a5dce744536f6cf5cbd99c07e115f8544
          git diff --name-only "$BASE" HEAD > /tmp/owner-read-revalidation-paths
          test "$(wc -l < /tmp/owner-read-revalidation-paths)" -eq 8
          while IFS= read -r p; do
            case "$p" in
              src/lib/dreamsnaps/owner-read-revalidation.js|src/routes/dreamsnaps/my/manage/source153-e2/+page.svelte|tests/web-owner-read-revalidation.test.mjs|tests/web-source153-owner-browser-e2.test.mjs|scripts/web-owner-revalidation-chrome.mjs|scripts/web-owner-revalidation-fixture.py|docs/web/owner-read-revalidation-invalidation-contract-20261102.md|.github/workflows/web-owner-revalidation-local-e2.yml) ;;
              *) echo UNEXPECTED_REVALIDATION_DELTA >&2; exit 1 ;;
            esac
          done < /tmp/owner-read-revalidation-paths
  real-local-es256-chromium:
    needs: source-build
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      DDVRE_E2_LOCAL_DISPOSABLE: APPROVED
      DATABASE_URL: ''
      SUPABASE_ACCESS_TOKEN: ''
      SUPABASE_PROJECT_ID: ''
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm install --no-save --package-lock=false playwright-core@1.55.0
      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.0
      - name: Generate runner-private GoTrue ES256 signer (no artifacts)
        shell: bash
        run: |
          set -euo pipefail
          printf '\n[auth]\nsigning_keys_path = "./signing_keys.json"\n' >> supabase/config.toml
          printf '[]\n' > supabase/signing_keys.json
          supabase gen signing-key --algorithm ES256 --yes >/tmp/web-e2-keygen-private.log 2>&1
          python3 - <<'PY'
          import json
          keys=json.load(open('supabase/signing_keys.json'))
          assert any(k.get('kty')=='EC' and k.get('crv')=='P-256' and k.get('kid') and k.get('d') for k in keys)
          print('WEB_E2_PRIVATE_ES256_SIGNER_GENERATED')
          PY
      - name: Boot disposable FULL153 only (no Stage, Provider or Cloud)
        shell: bash
        run: |
          set -euo pipefail
          printf 'project_id = "ddvre_web_owner_e2_disposable_only"\n' | cat - supabase/config.toml >/tmp/web-e2-config.tmp
          mv /tmp/web-e2-config.tmp supabase/config.toml
          timeout 1800s supabase start >/tmp/web-e2-private-boot.log 2>&1 || { echo WEB_E2_DISPOSABLE_BOOT_FAILED; exit 1; }
          echo WEB_E2_DISPOSABLE_FULL153_BOOT_SUCCESS
      - name: Install local PostgreSQL driver
        run: python3 -m pip install --quiet 'psycopg[binary]==3.2.10'
      - name: Actual Chrome installed-system provenance
        shell: bash
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          "$CHROME_BIN" --version
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
      - name: New-only signed 403 manual recovery and revoked actor using disposable E2 setup
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/web-owner-revalidation-fixture.py > /tmp/web-e2-private-test-outcome.log 2>&1 || {
            sed -E 's/([A-Za-z0-9_-]{24,})/[REDACTED]/g' /tmp/web-e2-private-test-outcome.log | tail -n 30
            exit 1
          }
          grep -q 'WEB_OWNER_403_RECOVERY_NEW_ONLY' /tmp/web-e2-private-test-outcome.log
          grep -q '"case": "WEB_OWNER_403_RECOVERY_NEW_ONLY"' /tmp/web-e2-private-test-outcome.log
          grep -E '^WEB403_HTTP_STATUS_ONLY stale=[0-9]{3} fresh=[0-9]{3} revokedRead=[0-9]{3} revokedFresh=[0-9]{3}
      - name: Stop ephemeral stack and erase local signer and scratch
        if: always()
        shell: bash
        run: |
          supabase stop --no-backup >/dev/null 2>&1 || true
          rm -f supabase/signing_keys.json /tmp/web-e2-private-boot.log /tmp/web-e2-keygen-private.log /tmp/web-e2-config.tmp /tmp/web-e2-private-test-outcome.log
          echo WEB_E2_EPHEMERAL_TEARDOWN_ATTEMPTED
 /tmp/web-e2-private-test-outcome.log
          echo WEB_OWNER_403_SIGNED_RECOVERY_NEW_ONLY_PASS_LOCAL
      - name: Stop ephemeral stack and erase local signer and scratch
        if: always()
        shell: bash
        run: |
          supabase stop --no-backup >/dev/null 2>&1 || true
          rm -f supabase/signing_keys.json /tmp/web-e2-private-boot.log /tmp/web-e2-keygen-private.log /tmp/web-e2-config.tmp /tmp/web-e2-private-test-outcome.log
          echo WEB_E2_EPHEMERAL_TEARDOWN_ATTEMPTED

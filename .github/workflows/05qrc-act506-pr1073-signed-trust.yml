name: 05 QR-C ACT506 PR1073 signed trust
on:
  pull_request:
    paths:
      - 'tests/qa/05qrc-act506-pr1073-signed-trust.mjs'
      - '.github/workflows/05qrc-act506-pr1073-signed-trust.yml'
permissions:
  contents: read
  actions: read
  attestations: read
jobs:
  independent:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
      - name: Fixed original11 source and exact QA-only additions
        run: |
          set -euo pipefail
          source=ca38dbca655fcf5fd54a9193a7bd18fad2ec892d
          test "$(git merge-base "$source" HEAD)" = "$source"
          test "$(git diff --name-only "$source" HEAD | wc -l)" -eq 2
          git diff --quiet "$source" HEAD -- scripts src crates .github/workflows/pages.yml
          test "$(git rev-parse HEAD:src/lib/ddv/core/save/product-rust-wasm-release-trust.mjs)" = d5b167f35b10ecc5b16d40e84e9d9bb324288539
          test "$(git rev-parse HEAD:scripts/readonly-release/seal.mjs)" = 919b4275c4b9aaeeab0037e832ff5d9480b4e262
      - name: Exact accepted historical Pages artifact and authentic signature counterexamples
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source=51fde043e024e2d84fd1c4c28a0c787748b82277
          run=43524370136
          gh api "repos/DreamwishWand/web/actions/runs/$run" | jq -e --arg source "$source" '.head_sha==$source and .head_repository.id==1371485649 and .head_repository.full_name=="DreamwishWand/web" and .head_branch=="main" and .conclusion=="success"'
          dir="$(mktemp -d)"
          mkdir -p "$dir/site"
          gh run download "$run" --repo DreamwishWand/web --name github-pages --dir "$dir"
          archive="$(find "$dir" -maxdepth 1 -type f -name '*.tar*' -print -quit)"
          test -n "$archive"
          tar -xf "$archive" -C "$dir/site"
          assets="$dir/site/worker-wasm"
          mkdir "$dir/bundles"
          for name in manifest.json ddv_save_core.js ddv_save_core_bg.wasm; do
            (cd "$dir/bundles"; gh attestation download "$assets/$name" --repo DreamwishWand/web)
          done
          cat "$dir/bundles/"*.jsonl > "$dir/bundle.jsonl"
          node scripts/readonly-release/seal.mjs verify-only "$source" "$assets" "$dir/bundle.jsonl"
          # Actual signed bytes, valid bundle, change only one cryptographic verification constraint.
          deny() {
            local label="$1"; shift
            if gh attestation verify "$assets/manifest.json" --bundle "$dir/bundle.jsonl" --repo DreamwishWand/web --deny-self-hosted-runners --predicate-type https://slsa.dev/provenance/v1 "$@" >"$dir/$label.log" 2>&1; then
              echo "FALSE_ACCEPT $label"; exit 1
            fi
            cat "$dir/$label.log"
            echo "ACT506_AUTHENTIC_SIGNATURE_DENIED $label"
          }
          gh attestation verify "$assets/manifest.json" --bundle "$dir/bundle.jsonl" --repo DreamwishWand/web --deny-self-hosted-runners --predicate-type https://slsa.dev/provenance/v1 --signer-workflow DreamwishWand/web/.github/workflows/pages.yml --source-ref refs/heads/main --source-digest "$source"
          deny wrong-workflow --signer-workflow DreamwishWand/web/.github/workflows/01a-protected-main-signed-wasm-release-off.yml --source-ref refs/heads/main --source-digest "$source"
          deny wrong-ref --signer-workflow DreamwishWand/web/.github/workflows/pages.yml --source-ref refs/heads/dev --source-digest "$source"
          deny wrong-source --signer-workflow DreamwishWand/web/.github/workflows/pages.yml --source-ref refs/heads/main --source-digest ca38dbca655fcf5fd54a9193a7bd18fad2ec892d
          deny successor-workflow --signer-workflow DreamwishWand/site/.github/workflows/pages.yml --source-ref refs/heads/main --source-digest "$source"
          echo "QA_LEGACY_ASSET_DIR=$assets" >> "$GITHUB_ENV"
      - name: Actual CLI boundaries and historical manifest identity
        run: node --test tests/qa/05qrc-act506-pr1073-signed-trust.mjs
      - name: No anchor or tracked mutation
        run: |
          grep -Fx 'export const PROTECTED_READONLY_RELEASE_ANCHOR=null;' src/lib/ddv/core/save/product-rust-wasm-release-anchor.mjs
          git diff --quiet

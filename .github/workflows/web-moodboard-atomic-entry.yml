name: WEB optional isolated Moodboard entry eight-locale Chrome
on:
  pull_request:
    paths:
      - 'src/lib/moodboards/copy.js'
      - 'src/routes/moodboards/+page.svelte'
      - 'tests/web-moodboard-atomic-entry.test.mjs'
      - 'scripts/web-moodboard-atomic-entry-chrome.mjs'
      - '.github/workflows/web-moodboard-atomic-entry.yml'
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - name: Exact two modified and three added new-link files, no Store or protected layout changes
        shell: bash
        run: |
          set -euo pipefail
          EVENT_BASE="${{ github.event.pull_request.base.sha }}"
          SOURCE="${{ github.event.pull_request.head.sha }}"
          # Checkout is the actual PR merge commit. A queued event base can be
          # older than its first parent after a protected-main integration.
          # Verify both parents; scope the integrated tree against its actual base.
          if test "$(git rev-parse HEAD)" = "$SOURCE"; then
            BASE="$EVENT_BASE"
          else
            test "$(git rev-parse HEAD^2)" = "$SOURCE"
            BASE="$(git rev-parse HEAD^1)"
            git merge-base --is-ancestor "$EVENT_BASE" "$BASE"
          fi
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"
          cat >/tmp/atomic-entry-scope <<'SCOPE'
          .github/workflows/web-moodboard-atomic-entry.yml
          scripts/web-moodboard-atomic-entry-chrome.mjs
          src/lib/moodboards/copy.js
          src/routes/moodboards/+page.svelte
          tests/web-moodboard-atomic-entry.test.mjs
          SCOPE
          git diff --name-only "$BASE" HEAD | LC_ALL=C sort >/tmp/atomic-entry-actual
          LC_ALL=C sort /tmp/atomic-entry-scope >/tmp/atomic-entry-expected
          if cmp -s /tmp/atomic-entry-expected /tmp/atomic-entry-actual; then
            diff -u /tmp/atomic-entry-expected /tmp/atomic-entry-actual
            for p in src/lib/moodboards/copy.js src/routes/moodboards/+page.svelte; do
              test "$(git diff --name-status "$BASE" HEAD -- "$p" | cut -f1)" = M
            done
            for p in scripts/web-moodboard-atomic-entry-chrome.mjs tests/web-moodboard-atomic-entry.test.mjs .github/workflows/web-moodboard-atomic-entry.yml; do
              test "$(git diff --name-status "$BASE" HEAD -- "$p" | cut -f1)" = A
            done
          elif test "$(git rev-parse HEAD:src/lib/moodboards/cover-preview.mjs)" = 0ef6b9515d79dc252823643f80cf0bd84c3b9b14 && \
               test "$(git rev-parse HEAD:src/routes/moodboards/+page.svelte)" = 64a448995c0cdd5dce5c54b54b9d5727f2449a4a && \
               test "$(git rev-parse HEAD:src/lib/moodboards/copy.js)" = 9c20f3a06d580af6d290e6b8498b6a1bf6f9d831 && \
               test "$(git rev-parse HEAD:tests/web-moodboard-cover-preview.test.mjs)" = f563d0580cd429461ad5f2767821cdca594a7171 && \
               test "$(git rev-parse HEAD:scripts/web-moodboard-cover-preview-chrome.mjs)" = 6f0ed52e669f85094836b57640377d151f1ae951 && \
               test "$(git rev-parse HEAD:.github/workflows/08web-decux43-moodboard-cover.yml)" = 9ae826c801d16c43e7ea5ea13a37346f086f2844; then
            # DEC-UX-43 is a separately frozen exact7 Source+test change.
            # Previous optional-entry and portability Scope tests remain unchanged.
            cat >/tmp/atomic-entry-decux43-scope <<'SCOPE'
          .github/workflows/web-moodboard-atomic-entry.yml
          .github/workflows/08web-decux43-moodboard-cover.yml
          scripts/web-moodboard-cover-preview-chrome.mjs
          src/lib/moodboards/copy.js
          src/lib/moodboards/cover-preview.mjs
          src/routes/moodboards/+page.svelte
          tests/web-moodboard-cover-preview.test.mjs
          SCOPE
            LC_ALL=C sort /tmp/atomic-entry-decux43-scope >/tmp/atomic-entry-decux43-expected
            diff -u /tmp/atomic-entry-decux43-expected /tmp/atomic-entry-actual
            for p in .github/workflows/web-moodboard-atomic-entry.yml src/lib/moodboards/copy.js src/routes/moodboards/+page.svelte; do
              test "$(git diff --name-status "$BASE" HEAD -- "$p" | cut -f1)" = M
            done
            for p in .github/workflows/08web-decux43-moodboard-cover.yml scripts/web-moodboard-cover-preview-chrome.mjs src/lib/moodboards/cover-preview.mjs tests/web-moodboard-cover-preview.test.mjs; do
              test "$(git diff --name-status "$BASE" HEAD -- "$p" | cut -f1)" = A
            done
            for p in .github/workflows/web-moodboard-atomic-entry.yml .github/workflows/08web-decux43-moodboard-cover.yml scripts/web-moodboard-cover-preview-chrome.mjs src/lib/moodboards/copy.js src/lib/moodboards/cover-preview.mjs src/routes/moodboards/+page.svelte tests/web-moodboard-cover-preview.test.mjs; do
              test "$(git ls-tree HEAD "$p" | awk '{print $1}')" = 100644
            done
          elif test "$(git rev-parse HEAD:src/routes/moodboards/+page.svelte)" = 8372377fbbd07a0f6ef2ab6e2c127d5260ccc24d && \
               test "$(git rev-parse HEAD:tests/web-moodboard-decux24-root-grid.test.mjs)" = 11debb8682f76467026cd1e49baf9cc825184425 && \
               test "$(git rev-parse HEAD:scripts/web-moodboard-decux24-root-grid-chrome.mjs)" = c051a58972fa76d1ccb44e49efb010d3e1d5e4fb && \
               test "$(git rev-parse HEAD:.github/workflows/08web-decux24-moodboard-root.yml)" = 79cf3bc96288b116613a0806f638b25767968dbf && \
               test "$(git rev-parse HEAD:src/lib/moodboards/copy.js)" = 9c20f3a06d580af6d290e6b8498b6a1bf6f9d831 && \
               test "$(git rev-parse HEAD:src/lib/moodboards/cover-preview.mjs)" = 0ef6b9515d79dc252823643f80cf0bd84c3b9b14; then
            # DEC-UX-24: exact five-file responsive root presentation, no Store changes.
            # Original atomic, migration and DEC-UX-43 scopes remain identical.
            cat >/tmp/atomic-entry-decux24-scope <<'SCOPE'
          .github/workflows/08web-decux24-moodboard-root.yml
          .github/workflows/web-moodboard-atomic-entry.yml
          scripts/web-moodboard-decux24-root-grid-chrome.mjs
          src/routes/moodboards/+page.svelte
          tests/web-moodboard-decux24-root-grid.test.mjs
          SCOPE
            LC_ALL=C sort /tmp/atomic-entry-decux24-scope >/tmp/atomic-entry-decux24-expected
            diff -u /tmp/atomic-entry-decux24-expected /tmp/atomic-entry-actual
            for p in .github/workflows/web-moodboard-atomic-entry.yml src/routes/moodboards/+page.svelte; do
              test "$(git diff --name-status "$BASE" HEAD -- "$p" | cut -f1)" = M
            done
            for p in .github/workflows/08web-decux24-moodboard-root.yml scripts/web-moodboard-decux24-root-grid-chrome.mjs tests/web-moodboard-decux24-root-grid.test.mjs; do
              test "$(git diff --name-status "$BASE" HEAD -- "$p" | cut -f1)" = A
            done
            for p in .github/workflows/08web-decux24-moodboard-root.yml .github/workflows/web-moodboard-atomic-entry.yml scripts/web-moodboard-decux24-root-grid-chrome.mjs src/routes/moodboards/+page.svelte tests/web-moodboard-decux24-root-grid.test.mjs; do
              test "$(git ls-tree HEAD "$p" | awk '{print $1}')" = 100644
            done
          else
            # Explicit ACT519 migration successor scope, not a general path-filter bypass.
            cat >/tmp/atomic-entry-migration-scope <<'SCOPE'
          .github/workflows/web-moodboard-atomic-entry.yml
          .github/workflows/web-moodboard-origin-portability.yml
          scripts/web-moodboard-origin-portability-chrome.mjs
          src/lib/moodboards/copy.js
          src/lib/moodboards/origin-portability.mjs
          src/routes/moodboards/+page.svelte
          tests/web-moodboard-origin-portability.test.mjs
          SCOPE
            LC_ALL=C sort /tmp/atomic-entry-migration-scope >/tmp/atomic-entry-migration-expected
            diff -u /tmp/atomic-entry-migration-expected /tmp/atomic-entry-actual
            for p in .github/workflows/web-moodboard-atomic-entry.yml src/lib/moodboards/copy.js src/routes/moodboards/+page.svelte; do
              test "$(git diff --name-status "$BASE" HEAD -- "$p" | cut -f1)" = M
            done
            for p in .github/workflows/web-moodboard-origin-portability.yml scripts/web-moodboard-origin-portability-chrome.mjs src/lib/moodboards/origin-portability.mjs tests/web-moodboard-origin-portability.test.mjs; do
              test "$(git diff --name-status "$BASE" HEAD -- "$p" | cut -f1)" = A
            done
          fi
          git diff --exit-code "$BASE" HEAD -- \
            src/lib/moodboards/store.js src/lib/moodboards/atomic-first-board.mjs \
            src/routes/moodboards/atomic/+page.svelte src/lib/collection/ src/routes/collection/ \
            src/lib/community/ src/routes/+layout.svelte src/routes/+layout.ts \
            src/routes/+layout.server.js .github/workflows/pages.yml supabase/ static/
          echo WEB_ATOMIC_ENTRY_EXACT_SCOPE_NO_LEGACY_OR_CORE_MUTATION_PASS
      - name: New link contract, Svelte type and static base-path bundle
        env:
          BASE_PATH: /web
        run: |
          node --test tests/web-moodboard-atomic-entry.test.mjs
          npm run check
          npm run build
          test -f build/moodboards/index.html
          test -f build/moodboards/atomic/index.html
          test -f build/404.html
          echo WEB_ATOMIC_ENTRY_STATIC_PAGES_WITH_PRIVATE_PREVIEW_NOINDEX_PASS
  chrome:
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm install --no-save --package-lock=false playwright-core@1.55.0
      - name: Start disposable local browser and installed Chrome
        shell: bash
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
          BASE_PATH='' npm run dev -- --host 127.0.0.1 --port 4299 >/tmp/web-moodboard-atomic-entry.log 2>&1 &
          for i in $(seq 1 75); do
            if curl -fsS http://127.0.0.1:4299/moodboards/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/web-moodboard-atomic-entry.log
          exit 1
      - name: Actual eight locales 320 CSS zoom 200 keyboard and opt-in backup/reopen
        env:
          MOODBOARD_ATOMIC_ENTRY_ORIGIN: http://127.0.0.1:4299
        run: node scripts/web-moodboard-atomic-entry-chrome.mjs

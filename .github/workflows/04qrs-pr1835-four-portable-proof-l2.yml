name: 04 QR-S PR1835 four Portable proof adapter (QA ONLY)
on:
  pull_request:
    paths:
      - '.github/workflows/04qrs-pr1835-four-portable-proof-l2.yml'
permissions:
  contents: read
jobs:
  proof-subjects:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_TARGET_DIR: /tmp/wand-qrs-portable-target
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 9af59b6f7024bf69db7a42ebd2309840108129e5
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
          targets: wasm32-unknown-unknown
      - name: Four isolated actual generated proof subjects and reciprocal denial
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "9af59b6f7024bf69db7a42ebd2309840108129e5"
          test "$(git rev-parse HEAD:scripts/readonly-release/scoped-placement-proof.mjs)" = "c45efecc79738d1a19d25fc7308ef93446c6c615"
          test "$(git rev-parse HEAD:scripts/wasm-distribution/approved-Cargo.lock)" = b667b42cfef2032c2925be7b2aa9b7142bff4b52
          cargo install wasm-bindgen-cli --version 0.2.105 --locked --root /tmp/wand-qrs-bindgen
          mkdir -p /tmp/wand-qrs-portable
          while read -r key source cargo_pin; do
            d="/tmp/wand-qrs-portable/$key"
            mkdir -p "$d"
            test "$(git rev-parse "$source:crates/ddv-save-core/Cargo.toml")" = "$cargo_pin"
            test "$(git rev-parse "$source:scripts/wasm-distribution/approved-Cargo.lock")" = b667b42cfef2032c2925be7b2aa9b7142bff4b52
            git archive "$source" crates/ddv-save-core | tar -x -C "$d"
            cp scripts/wasm-distribution/approved-Cargo.lock "$d/crates/ddv-save-core/Cargo.lock"
            cargo build --locked --manifest-path "$d/crates/ddv-save-core/Cargo.toml" --release --target wasm32-unknown-unknown --no-default-features --features "product-$key,worker-wasm"
            /tmp/wand-qrs-bindgen/bin/wasm-bindgen "$CARGO_TARGET_DIR/wasm32-unknown-unknown/release/ddv_save_core.wasm" --out-dir "$d" --target web --no-typescript
          done <<'INPUT'
          steam626-catalog0-portable-restore 62bb6343825d363aef9429e471901d41a0e9cdcd 3986df0a7ec1fce7945ae971d0af8341f744f355
          steam626-chest-portable-restore 62bb6343825d363aef9429e471901d41a0e9cdcd 3986df0a7ec1fce7945ae971d0af8341f744f355
          switch626-catalog0-portable-restore 0fbdacae2f5494c8ccf315b82f37f3dfd874e249 953bfd28b856b6eb6c1b7a0496d0536cc4ff65cd
          switch626-chest-portable-restore b03bfd56b35e41d841c565b63284a3c7df0d4490 d0deaba8d2445de6ed841e6329d709bf4318dc07
          INPUT
          cat > qa-portable-proof.mjs <<'EOF'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          import {ACTIVE_RELEASE_TUPLE as tuple} from './src/lib/ddv/core/save/product-rust-wasm-release-trust.mjs';
          import * as scopes from './src/lib/ddv/core/save/product-scoped-placement-release.mjs';
          import {fixedPlacementProofScope as fixed,inspectPlacementSubjects as inspect,privatePlacementIdentity as identity,replacePrivatePlacementAnchor as replace} from './scripts/readonly-release/scoped-placement-proof.mjs';
          const sha=b=>createHash('sha256').update(b).digest('hex');
          const inputs=[['steam626-catalog0-portable-restore','62bb6343825d363aef9429e471901d41a0e9cdcd'],['steam626-chest-portable-restore','62bb6343825d363aef9429e471901d41a0e9cdcd'],['switch626-catalog0-portable-restore','0fbdacae2f5494c8ccf315b82f37f3dfd874e249'],['switch626-chest-portable-restore','b03bfd56b35e41d841c565b63284a3c7df0d4490']];
          const own=inputs.map(([key,source])=>{const d='/tmp/wand-qrs-portable/'+key+'/';return {s:fixed(key),source,j:readFileSync(d+'ddv_save_core.js'),w:readFileSync(d+'ddv_save_core_bg.wasm'),cargo:readFileSync(d+'crates/ddv-save-core/Cargo.toml'),lock:readFileSync(d+'crates/ddv-save-core/Cargo.lock')}});
          const prior=readFileSync('src/lib/ddv/core/save/product-scoped-portable-release-anchor.mjs','utf8');
          const markers=['CATALOG0','CHEST','SWITCH_CATALOG0','SWITCH_CHEST'].map(n=>'export const PROTECTED_'+n+'_PORTABLE_RELEASE_ANCHOR=null;');
          assert.ok(markers.every(m=>prior.split(m).length===2));
          const outcomes=[];
          for(let i=0;i<own.length;i++){
            const {s,source,j,w,cargo,lock}=own[i];
            assert.equal(sha(lock),'e58486d673df79bfe7e72b80449e39389e57010fe4051edcdcff9b53c2da898c');
            const mk=(s,js,w,patch={})=>[Buffer.from(JSON.stringify({contract:s.prefix+'.runtime@1',operation:s.operation,source:{repository:tuple.repository,commit:source,cargoTomlSha256:sha(cargo),cargoLockSha256:sha(lock),cargoLockOrigin:'approved-repository-lock',wasmBindgen:'0.2.105',wasmTarget:'wasm32-unknown-unknown',profile:'release',features:s.features,defaultFeatures:false,toolchain:'rustc 1.99.1 (qa)'},assets:{js:{path:'ddv_save_core.js',sizeBytes:js.length,sha256:sha(js)},wasm:{path:'ddv_save_core_bg.wasm',sizeBytes:w.length,sha256:sha(w)}},abi:{exportClass:'WorkerWasmSource',methods:s.methods,writerAuthorized:false,originalOverwriteAuthorized:false},release:{productConsumerEnabled:false,writerAuthorized:false,autoUpload:false,originalOverwriteAuthorized:false},...patch})),js,w];
            let pos=0,neg=0;const no=f=>{assert.throws(f);neg++};
            assert.equal(s.methods.length,14);assert.equal(s.exports.length,23);
            assert.equal(new WebAssembly.Module(w) instanceof WebAssembly.Module,true);
            assert.equal(s.platform,i<2?'steam-windows':'switch');if(i>=2)assert.equal(s.buildId,'9A239D3DB569756D');
            const b=mk(s,j,w),p=inspect(s,b,source),a=identity(s,p,'http://127.0.0.1:4188');
            assert.equal(await scopes.validatePlacementAnchor(s,a),true);assert.equal(a.builds[0].productV2EvidenceSha256,null);assert.equal(a.builds[0].buildId,s.buildId);pos++;
            const out=replace(s,prior,a);assert.ok(!out.includes(markers[i]));for(let k=0;k<markers.length;k++)if(k!==i)assert.ok(out.includes(markers[k]));pos++;
            no(()=>replace(s,out,a));no(()=>identity(s,p,tuple.origin));no(()=>inspect(s,b,'f'.repeat(40)));no(()=>inspect(s,mk(s,j,w,{operation:'foreign'}),source));no(()=>inspect(s,mk(s,j,w,{release:{productConsumerEnabled:true,writerAuthorized:true,autoUpload:false,originalOverwriteAuthorized:false}}),source));no(()=>inspect(s,b.slice(0,2),source));no(()=>inspect(s,[...b,b[0]],source));
            for(const t of own.filter(x=>x.s!==s)){
              no(()=>inspect(t.s,b,source));no(()=>inspect(s,mk(s,j,t.w),source));no(()=>inspect(s,mk(s,t.j,w),source));
              for(const symbol of t.s.methods.filter(n=>n.includes('_portable_')))no(()=>inspect(s,mk(s,Buffer.concat([j,Buffer.from('\n// '+symbol)]),w),source));
              no(()=>replace(t.s,out,a));
            }
            for(const symbol of ['preview_switch626_hair','stage_switch626_skin','preview_switch626_r01','stage_switch626_r02','preview_switch626_fm01','stage_steam626_comp03','preview_switch626_catalog0','stage_switch626_chest'])no(()=>inspect(s,mk(s,Buffer.concat([j,Buffer.from('\n// '+symbol)]),w),source));
            for(const t of [scopes.COMP03_RELEASE,scopes.COMP03_SPATIAL_RELEASE,scopes.VASE_ADD_RELEASE,scopes.SR03_RELEASE,scopes.RM01_RELEASE])no(()=>inspect(t,b,source));
            const result={key:s.key,source,js:sha(j),wasm:sha(w),manifest:sha(b[0]),methods:s.methods.length,exports:s.exports.length,platform:s.platform,build:s.buildId,pos,neg};
            outcomes.push(result);console.log('QRS_PR1835_PORTABLE_PROOF_SCOPE_PASS',JSON.stringify(result));
          }
          assert.equal(outcomes.length,4);
          console.log('QRS_PR1835_FOUR_PORTABLE_PROOF_ADAPTER_L2_PASS',JSON.stringify({scopes:4,actualGenerated:true,actualSignature:false,productV2:false}));
          EOF
          node qa-portable-proof.mjs
          node --test tests/scoped-placement-proof.test.mjs

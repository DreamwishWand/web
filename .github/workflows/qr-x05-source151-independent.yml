name: QR Source151 Independent Full151 Two-PG PreGrant
on:
  push:
    branches: ['qr/x05-source151-independent-20261028']
  pull_request:
    branches: ['feature/03comm-x05-source151-pregrant-bootstrap-20261028']
permissions:
  contents: read
jobs:
  independent-source151:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DDVRE_PRIVACY_ISOLATED_LOCAL: CONFIRMED
      DATABASE_URL: ''
      SUPABASE_ACCESS_TOKEN: ''
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pin Owner byte identity, source-only strict delta, syntax and new-only tests
        run: |
          set -euo pipefail
          test -z "$DATABASE_URL" && test -z "$SUPABASE_ACCESS_TOKEN"
          git merge-base --is-ancestor 9c96de3e1f003c160beffc0395dfbe35314dff3d HEAD
          test "$(git hash-object supabase/migrations/20261028000040_x05_private_pregrant_policy_receipt_v1.sql)" = 451735e05b6a18c826851a51000909c40c42bb9f
          test -z "$(git diff --name-only 9c96de3e1f003c160beffc0395dfbe35314dff3d HEAD -- supabase src)"
          python3 -m py_compile tests/qr-x05-source151-two-pg-independent.py
          node --test tests/qr-x05-source151-independent.test.mjs
      - uses: supabase/setup-cli@v1
        with:
          version: 2.81.3
      - name: Full151 disposable local SQL DB, no Stage credentials
        run: |
          set -euo pipefail
          printf 'project_id = "ddvre_qr151_independent_disposable"\n' | cat - supabase/config.toml > /tmp/qr151-config.toml
          mv /tmp/qr151-config.toml supabase/config.toml
          timeout 1500s supabase start -x edge-runtime --debug >/tmp/qr151-start.log 2>&1 || { tail -140 /tmp/qr151-start.log; exit 1; }
      - run: python3 -m pip install --quiet 'psycopg[binary]==3.2.10'
      - name: Independent actual two-backend CAS and policy immutable source contract
        run: |
          set -euo pipefail
          python3 tests/qr-x05-source151-two-pg-independent.py 2>&1 | tee /tmp/qr151-independent.log
          grep -q QR151_INDEPENDENT_FULL151_LOCAL_DONE /tmp/qr151-independent.log
      - name: Evidence strictly synthetic and local
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qr151-independent-disposable-pg
          path: /tmp/qr151-independent.log
          if-no-files-found: warn
      - name: Debug bootstrap only
        if: failure()
        run: tail -120 /tmp/qr151-start.log || true

name: QA ONLY PR1824 Portable Restore and affected Steam Appearance (never merge)
on:
  pull_request:
    paths:
      - '.github/workflows/qa-qrw-pr1824-portable.yml'
permissions:
  contents: read
jobs:
  catalog0-actual:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 91909a1a771d2aa93370515d247bbf8215842aa1
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Fixed Web Source and accepted dedicated artifact
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '91909a1a771d2aa93370515d247bbf8215842aa1'
          test "$(git rev-parse HEAD^{tree})" = 'ead4610020ca98a37e4f6b73c1a6f52d91a2f860'
          test "$(git diff --name-only '50afe1a403f0fd9e64143181b0d0b0758c5208c4' HEAD | wc -l)" = 24
          git diff --name-only '50afe1a403f0fd9e64143181b0d0b0758c5208c4' HEAD | sort >/tmp/qrw-paths.actual
          cat >/tmp/qrw-paths.expected <<'PATHS'

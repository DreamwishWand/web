          diff -u /tmp/qrw-paths.expected /tmp/qrw-paths.actual
          git diff --raw '50afe1a403f0fd9e64143181b0d0b0758c5208c4' HEAD
          test "$(git rev-parse HEAD:src/lib/dev/PortableRestoreProductRoute.svelte)" = '45a29bbb72e7cebc24cbfd31fdfd455e9fc00a90'
          git cat-file -e 65896ead46701469ef4b0d70c1fa2e5421043721^{commit} || git fetch --no-tags origin 65896ead46701469ef4b0d70c1fa2e5421043721
          git worktree add --detach /tmp/qrw-core 65896ead46701469ef4b0d70c1fa2e5421043721

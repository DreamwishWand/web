          git diff --raw '50afe1a403f0fd9e64143181b0d0b0758c5208c4' HEAD
          test "$(git rev-parse HEAD:src/lib/dev/PortableRestoreProductRoute.svelte)" = '45a29bbb72e7cebc24cbfd31fdfd455e9fc00a90'

          src/lib/dev/PortableRestoreProductRoute.svelte
          src/lib/dev/local-placement-workflow.mjs
          src/lib/dev/local-scoped-edit-worker-port.mjs
          src/lib/dev/product-catalog0-portable.worker.mjs
          src/lib/dev/product-chest-portable.worker.mjs
          src/lib/dev/product-placement-client.mjs
          src/lib/dev/product-switch-catalog0-portable.worker.mjs
          src/lib/dev/product-switch-chest-portable.worker.mjs
          src/routes/editor/backup/catalog0/steam/+page.svelte
          src/routes/editor/backup/catalog0/switch/+page.svelte
          src/routes/editor/backup/chest/steam/+page.svelte
          src/routes/editor/backup/chest/switch/+page.svelte
          tests/product-portable-restore-web.test.mjs
          tests/stage-e/chrome-smoke.mjs
          tests/stage-f/chrome-smoke.mjs
          tests/wasm-distribution/chrome-smoke.mjs
          tools/owner-local-steam-v1/server.mjs

name: 08 WEB DEC-UX-07 Explore secondary Search responsive L1
on:
  pull_request:
    paths:
      - 'src/routes/explore/+page.svelte'
      - 'tests/web-explore-secondary-search.test.mjs'
      - 'scripts/web-explore-secondary-search-chrome.mjs'
      - '.github/workflows/08web-decux07-explore-search.yml'
permissions:
  contents: read
jobs:
  explore-search:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - name: Changed-only Source contract and no-hidden-filter negative
        run: node --test tests/web-explore-secondary-search.test.mjs
      - name: Svelte types and production output
        env:
          BASE_PATH: /web
        run: npm run check && npm run build
      - name: Existing verified catalog, true browser responsive Search and Escape restoration
        shell: bash
        env:
          BASE_PATH: /web
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false playwright-core@1.55.0
          CHROME_BIN="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium)"
          test -n "$CHROME_BIN"
          export CHROME_BIN
          npm run preview -- --host 127.0.0.1 --port 4298 --strictPort >/tmp/08web-decux07-preview.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4298/web/explore/ >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4298/web/explore/ >/dev/null
          node scripts/web-explore-secondary-search-chrome.mjs

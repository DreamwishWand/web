name: 04 QR-S ACT1774 PR2328 exact Rust2 Gate L2 QA ONLY
on:
  push:
    branches:
      - '04qrs/act1774-pr2328-gate8-rust2-trust-l2'
    paths:
      - '.github/workflows/04qrs-act1774-pr2328-gate8-rust2-trust-l2.yml'
permissions:
  contents: read
jobs:
  exact-rust2-gate-negative:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Frozen source and independent Rust2 Gate negative L2
        run: |
          set -euo pipefail
          node --input-type=module <<'QRS_R22_GATE'
          import assert from 'node:assert/strict';
          import {spawnSync} from 'node:child_process';
          import {mkdtempSync,rmSync} from 'node:fs';
          import {tmpdir} from 'node:os';
          import {join} from 'node:path';
          import {verifyAcceptedRustScope} from './scripts/wasm-distribution/r22-accepted-rust-scope.mjs';
          const gate='386fc842e0149aea028730889fcc253cec0689ef';
          const main='a7a293100b3f36634f4c41e67c1435316249ec88';
          const original='040e1eabfab0251b214514399a53517102c03c6b';
          const rust='crates/ddv-save-core/src/wasm_worker.rs';
          const guard='tests/01a-wasm-pending-decoded-buffer-wipe.test.mjs';
          const expectedCore='7ce60a4e95988cc9d8f33ed54453882e4198e7c5';
          const rustBlob='6432275d2909e6bc6d39265ae70cc7176fc37106';
          const guardBlob='8fb7d761d145a4f64ea1b97470c57cf16db5bb79';
          const temp=mkdtempSync(join(tmpdir(),'qrs2328-rust-gate-')),cwd=join(temp,'repo');
          const env={...process.env,GIT_NO_REPLACE_OBJECTS:'1',GIT_CONFIG_GLOBAL:'/dev/null',GIT_CONFIG_NOSYSTEM:'1',GIT_TERMINAL_PROMPT:'0',
           GIT_AUTHOR_NAME:'04 QR-S negative QA',GIT_AUTHOR_EMAIL:'qrs@example.invalid',
           GIT_COMMITTER_NAME:'04 QR-S negative QA',GIT_COMMITTER_EMAIL:'qrs@example.invalid'};
          function call(args,opt={}){
           return spawnSync('git',args,{cwd,env:{...env,...(opt.env||{})},input:opt.input,
           encoding:'utf8',maxBuffer:12*1024*1024,timeout:90000});
          }
          function git(...args){
           const r=call(args);assert.equal(r.status,0,args.join(' ')+' : '+String(r.stderr).slice(-650));return r.stdout.trim();
          }
          function blob(data){const r=call(['hash-object','-w','--stdin'],{input:data});
           assert.equal(r.status,0,r.stderr);return r.stdout.trim();}
          let seq=0;
          function child(changes){
           const idx=join(temp,'idx'+(++seq));
           const x=args=>{const r=call(args,{env:{GIT_INDEX_FILE:idx}});
            assert.equal(r.status,0,args.join(' ')+' '+r.stderr);return r.stdout.trim();};
           x(['read-tree',gate+'^{tree}']);
           for(const [p,sha,mode='100644'] of changes) {
            if(sha===null)x(['update-index','--force-remove','--',p]);
            else x(['update-index','--add','--cacheinfo',mode,sha,p]);
           }
           const tree=x(['write-tree']);
           return x(['commit-tree',tree,'-p',gate,'-m','04QRS ephemeral exact negative GitTree']);
          }
          function matchGate(src){
           const r=verifyAcceptedRustScope(cwd,gate,src);
           assert.equal(r.status,'R22_EXACT_ACCEPTED_SOURCE_SCOPE_MATCH_ONLY');
           assert.equal(r.entryCount,2);
           assert.equal(r.sourcePr,2318);
           assert.equal(r.writerAuthorized,false);
           assert.equal(r.mergeAuthorized,false);
           assert.equal(r.coreAfter,expectedCore);
          }
          try{
           const c=spawnSync('git',['clone','--no-hardlinks','--no-checkout','-q',process.cwd(),cwd],
            {cwd:process.cwd(),env,encoding:'utf8',timeout:90000});
           assert.equal(c.status,0,c.stderr);
           assert.equal(git('rev-parse',gate+'^'),main);
           assert.equal(git('rev-parse','HEAD^'),gate);
           assert.equal(git('rev-parse',gate+':scripts/wasm-distribution/r22-accepted-rust-scope.mjs'),
            'd3997b2d4460109562489c6afa2c5d5e51fa2b5a');
           assert.deepEqual(git('diff','--name-only',gate,'HEAD').split('\n'),[
            '.github/workflows/04qrs-act1774-pr2328-gate8-rust2-trust-l2.yml']);
           const changedGate=git('diff','--name-only',main,gate).split('\n');
           assert.equal(changedGate.length,8);
           assert.ok(changedGate.includes('scripts/wasm-distribution/r22-accepted-rust-scope.mjs'));
           for(const p of changedGate){assert.match(git('ls-tree',gate,'--',p),/^100644 blob [a-f0-9]{40}\t/);}
           const unmodified=[
            '.github/workflows/pages.yml',
            'scripts/wasm-distribution/verify-protected-release.mjs',
            'scripts/wasm-distribution/r22-trusted-before-candidate.mjs',
            'scripts/wasm-distribution/r22-raw-rust-checkout.mjs',
            'scripts/wasm-distribution/approved-Cargo.lock',
            'scripts/wasm-distribution/protected-release-inputs.json',
            'crates/ddv-save-core/Cargo.toml',
            'src/lib/ddv/core/save/product-rust-wasm-release-trust.mjs'
           ];
           for(const p of unmodified)assert.equal(git('rev-parse',gate+':'+p),git('rev-parse',main+':'+p),'UNTOUCHED_'+p);
           const originalRust=git('show',original+':'+rust);
           const originalTest=git('show',original+':'+guard);
           assert.equal(blob(originalRust),rustBlob);
           assert.equal(blob(originalTest),guardBlob);
           assert.equal(git('ls-tree',main,'--',rust),'100644 blob 5fbb1f3d393df127da67f1eafe9796fbb7ce3a56\t'+rust);
           assert.equal(git('ls-tree',main,'--',guard),'');
           const edits=[[rust,rustBlob],[guard,guardBlob]];
           const candidate=child(edits);
           assert.equal(git('rev-parse',candidate+':crates/ddv-save-core'),expectedCore);
           assert.deepEqual(git('diff','--name-only',gate,candidate).split('\n'),[rust,guard]);
           matchGate(candidate);
           console.log('QRS_ACT1774_PR2328_ACTUAL_GATE_EXACT2_CORETREE_POS_PASS');
           const corrupt=[
            ['WRONG_RUST_BLOB',[[rust,blob(originalRust+'\n// synthetic unauthorized tail\n')],[guard,guardBlob]]],
            ['RUST_EXECUTABLE',[[rust,rustBlob,'100755'],[guard,guardBlob]]],
            ['RUST_SYMLINK',[[rust,blob('./not-reviewed.rs'),'120000'],[guard,guardBlob]]],
            ['RUST_MISSING',[[rust,null],[guard,guardBlob]]],
            ['TEST_TAMPER',[[rust,rustBlob],[guard,blob(originalTest+'\n// change\n')]]],
            ['TEST_EXECUTABLE',[[rust,rustBlob],[guard,guardBlob,'100755']]],
            ['TEST_MISSING',[[rust,rustBlob]]],
            ['EXTRA_CORE',[[rust,rustBlob],[guard,guardBlob],['crates/ddv-save-core/src/unauthorized_qa.rs',blob('unreviewed')]]],
            ['CARGO_CHANGED',[[rust,rustBlob],[guard,guardBlob],['crates/ddv-save-core/Cargo.toml',blob('changed Cargo wrong')]]],
            ['LOCK_CHANGED',[[rust,rustBlob],[guard,guardBlob],['scripts/wasm-distribution/approved-Cargo.lock',blob('changed Lock wrong')]]],
            ['R22_CONFIG_CHANGED',[[rust,rustBlob],[guard,guardBlob],['scripts/wasm-distribution/protected-release-inputs.json',blob('changed config wrong')]]],
            ['SELECTOR_SELF_AUTH',[[rust,rustBlob],[guard,guardBlob],['scripts/wasm-distribution/r22-accepted-rust-scope.mjs',blob('unreviewed issuer selector')]]],
            ['VERIFIER_SELF_AUTH',[[rust,rustBlob],[guard,guardBlob],['scripts/wasm-distribution/verify-protected-release.mjs',blob('unreviewed verifier')]]],
            ['TRUSTED_PRECHECK_SELF_AUTH',[[rust,rustBlob],[guard,guardBlob],['scripts/int-selection-preflight.mjs',blob('unreviewed preflight')]]]
           ];
           for(const [name,items] of corrupt){
            const c=child(items);
            assert.throws(()=>verifyAcceptedRustScope(cwd,gate,c),'candidate must DENY '+name);
            console.log('QRS_ACT1774_PR2328_REJECT_'+name);
           }
           const tested=git('show',gate+':scripts/wasm-distribution/r22-accepted-rust-scope.mjs');
           assert.ok(tested.includes('protectedGateOnlyAcceptanceRequired:true'));
           assert.ok(tested.includes('independentSecurityL2Required:true'));
           assert.ok(tested.includes('mergeAuthorized:false,writerAuthorized:false'));
           console.log('QRS_ACT1774_PR2328_CHANGED_GATE_L2_PASS',JSON.stringify({
            fixedGate:gate,protectedMain:main,independentSource:original,
            authorizedPaths:2,sourceGateFiles:8,negativeDenials:corrupt.length,
            previousHistoryPreserved:true,proofIssued:false,ownerProductV2:'NOT_RUN',
            publicWriterOpOn:false,qaOnlyNeverMerge:true
           }));
          } finally{rmSync(temp,{recursive:true,force:true})}
          QRS_R22_GATE
      - name: QA-only no merge, official Save or Product ON
        run: |
          echo 'QRS_ACT1774_PR2328_QAONLY_SOURCE_UNCHANGED_NEVER_MERGE'

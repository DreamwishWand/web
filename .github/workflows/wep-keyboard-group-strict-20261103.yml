name: WEP new-only strict keyboard group move
on:
  push:
    branches: ['wep/strict-keyboard-group-move-20261103']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Assert exact source checkout
        run: |
          echo "EXACT_SOURCE_HEAD=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - name: New-only keyboard strict source tests
        run: node --test tests/wep-keyboard-strict-local.test.mjs tests/wep-world-editor-localization-inventory.test.mjs
      - name: Typecheck and static build
        run: |
          npm run check
          npm run build
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Assert exact browser code checkout
        run: |
          echo "EXACT_BROWSER_HEAD=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - name: Install actual Chromium and native tab zoom API
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install chromium
      - name: Start isolated synthetic Editor
        run: |
          npm run dev -- --host 127.0.0.1 --port 4195 >/tmp/wep-keyboard-new.log 2>&1 &
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:4195/editor/world/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/wep-keyboard-new.log
          exit 1
      - name: New-only keyboard pointer-independent Chrome cases 100 and real 200
        env:
          WEP_KEYBOARD_RC_BASE_URL: http://127.0.0.1:4195/editor/world/
        run: node scripts/wep-keyboard-strict-browser.mjs
      - name: Upload source-pinned browser report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wep-keyboard-atomic-100-200
          path: .artifacts/wep-keyboard-strict/
          if-no-files-found: error

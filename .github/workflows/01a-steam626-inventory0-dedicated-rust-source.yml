name: 01A Steam626 Inventory0 isolated product Rust/WASM source validation (OFF)
on:
  pull_request:
    paths:
      - '.github/workflows/01a-steam626-inventory0-dedicated-rust-source.yml'
permissions:
  contents: read
jobs:
  inventory0-actual-rust-wasm:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CARGO_TARGET_DIR: /tmp/01a-inv0-only-target
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fixed Inventory0 Rust plus one Worker product port and independent shared Security source leaf
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY_ID" = 1371485649
          test "$(git merge-base 0e57c6b8585002b1baff91e6de573a835bed6577 HEAD)" = 0e57c6b8585002b1baff91e6de573a835bed6577
          git diff --name-only 0e57c6b8585002b1baff91e6de573a835bed6577 HEAD | sort > /tmp/01a-inv0-actual-paths
          printf '%s\n' '.github/workflows/01a-steam626-inventory0-dedicated-rust-source.yml' 'crates/ddv-save-core/Cargo.toml' 'crates/ddv-save-core/src/wasm_worker.rs' 'crates/ddv-save-core/src/product_session.rs' 'crates/ddv-save-core/src/wasm_steam626_eyecolor2.rs' 'crates/ddv-save-core/src/wasm_steam626_makeup_color1.rs' 'crates/ddv-save-core/src/wasm_switch624_frp01.rs' 'crates/ddv-save-core/src/wasm_switch626_fd01.rs' 'crates/ddv-save-core/src/wasm_switch626_fe01.rs' 'crates/ddv-save-core/src/wasm_switch626_fixed_fence_add.rs' 'crates/ddv-save-core/src/wasm_switch626_makeup_color1.rs' 'tests/01a-steam626-inventory0-exclusive-rust-feature.test.mjs' 'tests/01a-steam626-catalog0-product-worker-port.test.mjs' 'tests/product-steam626-catalog0-local-adapter.test.mjs' 'src/lib/ddv/core/save/product-scoped-amount-transport.mjs' 'src/lib/ddv/core/save/product-wasm-read-owner.mjs' 'src/lib/ddv/core/save/p1g-rust-worker-readonly-bridge.mjs' 'src/lib/ddv/core/save/product-scoped-amount-local-adapter.mjs' | sort > /tmp/01a-inv0-expected-paths
          diff -u /tmp/01a-inv0-expected-paths /tmp/01a-inv0-actual-paths
          for f in $(cat /tmp/01a-inv0-actual-paths); do test "$(git ls-tree HEAD -- "$f" | awk '{print $1}')" = 100644; done
          test "$(git rev-parse HEAD:crates/ddv-save-core/src/product_amount_scoped.rs)" = 522e8e8d6beec597b2e5e176cfbe8a6d8e38a124
          test "$(git rev-parse HEAD:crates/ddv-save-core/src/semantic_writer.rs)" = f11c68ca214853c762788ae032710fc4683dd472
          test "$(git rev-parse HEAD:crates/ddv-save-core/Cargo.toml)" = b3455c36d9d60b4a0e415026a095e47fe577644d
          test "$(git rev-parse HEAD:crates/ddv-save-core/src/wasm_worker.rs)" = f4cf9d66f857a2e20b597de9f697a458b6ab550c
          test "$(git rev-parse HEAD:crates/ddv-save-core/src/wasm_steam626_eyecolor2.rs)" = 1f31facb11f54d0e52f5b2188393a9d488c1fb35
          test "$(git rev-parse HEAD:crates/ddv-save-core/src/wasm_steam626_makeup_color1.rs)" = afc6290a286adc8ad68b6cc9c8f0267c64a27106
          test "$(git rev-parse HEAD:crates/ddv-save-core/src/wasm_switch624_frp01.rs)" = fdd5e85bff63fe0d147c604586e38654cb49d8ed
          test "$(git rev-parse HEAD:crates/ddv-save-core/src/wasm_switch626_fd01.rs)" = 478c950cecbeb89387a555ce1ac56a10f53f30ac
          test "$(git rev-parse HEAD:crates/ddv-save-core/src/wasm_switch626_fe01.rs)" = 242641a0cabb49029df40f1ea27dc4985ffb40db
          test "$(git rev-parse HEAD:crates/ddv-save-core/src/wasm_switch626_fixed_fence_add.rs)" = ee9fbf6af12ca9ceb6cd9eae1e4814259e770d36
          test "$(git rev-parse HEAD:crates/ddv-save-core/src/wasm_switch626_makeup_color1.rs)" = 1dae83f8c56c6ab6ecb9d6dc8e00c8965d646dc2
          # Exact latest independently refutable 01A security Source includes both
          # moved-input Vec, last-owned decoded Arc and returned scoped-chunk scrub.
          test "$(git rev-parse HEAD:crates/ddv-save-core/src/product_session.rs)" = e53c4930a84f729ea245f38a1b301c7178146ced
          test "$(git rev-parse HEAD:src/lib/ddv/core/save/product-scoped-amount-transport.mjs)" = 0312afdd91cb07d377a233f454ff07894de6eec5
          test "$(git rev-parse HEAD:src/lib/ddv/core/save/product-wasm-read-owner.mjs)" = 81cd04b906f6cab7b1ea1749fb7fc981003a3b03
          test "$(git rev-parse HEAD:src/lib/ddv/core/save/p1g-rust-worker-readonly-bridge.mjs)" = 3b61beb6288826c57ab9d029b214cee614dfafc5
          test "$(git rev-parse HEAD:src/lib/ddv/core/save/product-scoped-amount-local-adapter.mjs)" = 5a9ae08833f11d03fe1986bd679438591842b76e
          test "$(git rev-parse f7e5ef6d70cdd2d297d0c8f0ed6fec6b6633d236:crates/ddv-save-core/src/product_session.rs)" = e53c4930a84f729ea245f38a1b301c7178146ced
          test -z "$(git ls-files '*.p1g')"
          cp scripts/wasm-distribution/approved-Cargo.lock crates/ddv-save-core/Cargo.lock
          echo 'e58486d673df79bfe7e72b80449e39389e57010fe4051edcdcff9b53c2da898c  crates/ddv-save-core/Cargo.lock' | sha256sum -c -
          node --test tests/01a-steam626-inventory0-exclusive-rust-feature.test.mjs tests/01a-steam626-catalog0-product-worker-port.test.mjs tests/product-steam626-catalog0-local-adapter.test.mjs
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
          targets: wasm32-unknown-unknown
      - name: Compile new exact Steam626 Inventory0-only Rust WASM
        shell: bash
        run: |
          set -euo pipefail
          test "$(rustc --version | cut -d' ' -f2)" = 1.99.1
          cargo build --locked --release --manifest-path crates/ddv-save-core/Cargo.toml --target wasm32-unknown-unknown --no-default-features --features worker-wasm,product-steam626-catalog0-scoped
          cargo install wasm-bindgen-cli --version 0.2.105 --locked --root /tmp/01a-inv0-only-bindgen
          mkdir -p /tmp/01a-inv0-only-wasm
          /tmp/01a-inv0-only-bindgen/bin/wasm-bindgen "$CARGO_TARGET_DIR/wasm32-unknown-unknown/release/ddv_save_core.wasm" --out-dir /tmp/01a-inv0-only-wasm --target nodejs --no-typescript
          test -s /tmp/01a-inv0-only-wasm/ddv_save_core_bg.wasm
      - name: Validate scoped output ABI closure (11 wrappers + 8 dependent Rust profiles)
        shell: bash
        run: |
          set -euo pipefail
          # One common Session and one changed return type: compile every
          # previously accepted feature-cfg caller, not all unrelated tests.
          for feature in \
            product-switch626-fd01-scoped \
            product-switch626-fe01-scoped \
            product-steam626-eyecolor2-scoped \
            product-steam626-makeup-color1-scoped \
            product-switch626-makeup-color1-scoped \
            product-switch624-frp01-scoped \
            product-switch626-fd02-scoped \
            product-switch626-fd03-scoped \
            product-switch626-ortho-l-scoped \
            product-switch626-diagonal90-scoped \
            product-switch626-ortho-t-scoped \
            product-steam626-chest-scoped \
            product-switch626-chest-scoped \
            product-steam626-comp03-scoped \
            product-steam626-sr03-scoped \
            product-switch626-rm01-scoped \
            product-steam626-hair-scoped \
            product-steam626-skin-scoped \
            product-collection-scoped
          do
            cargo check --locked --manifest-path crates/ddv-save-core/Cargo.toml \
              --target wasm32-unknown-unknown --no-default-features \
              --features "worker-wasm,$feature"
          done
          echo 01A_SCOPED_OUTPUT_RETURN_ABI_19_FEATURE_CFG_COMPILED
      - name: Actual generated Rust-WASM Steam Inventory0 single-amount and denied domains
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFile} from 'node:fs/promises';
          import {createRequire} from 'node:module';
          import {createHash} from 'node:crypto';
          const {WorkerWasmSource}=createRequire(import.meta.url)('/tmp/01a-inv0-only-wasm/ddv_save_core.js');
          const wasmRaw=await readFile('/tmp/01a-inv0-only-wasm/ddv_save_core_bg.wasm');
          const ex=Object.getOwnPropertyNames(WorkerWasmSource.prototype);
          const methods=[
            'append_chunk','finish','read_core_version_witness','issue_typed_cursor','read_typed_page',
            'issue_saved_diffgrids_typed_cursor','read_saved_diffgrids_typed_page',
            'discover_scoped_amount','preview_scoped_amount','stage_scoped_amount',
            'toggle_scoped_edit','begin_scoped_edit_output','next_scoped_edit_output_chunk',
            'toggle_scoped_amount','begin_scoped_amount_output','next_scoped_amount_output_chunk','close'
          ];
          for(const n of methods)assert.equal(typeof WorkerWasmSource.prototype[n],'function','missing required ABI '+n);
          for(const n of ['discover_switch626_chest','preview_switch626_chest','stage_switch626_chest',
            'preview_steam626_comp03','stage_steam626_comp03','read_steam626_bamboo_single_target',
            'stage_steam626_skin','stage_steam626_hair','stage_switch626_rm01'])
            assert.equal(typeof WorkerWasmSource.prototype[n],'undefined','foreign Rust ABI '+n);
          assert.deepEqual(ex.sort(),['constructor','__destroy_into_raw','free',...methods].sort());
          const empty=()=>({ItemID:0,Amount:0,State:null});
          const source={GameInfo:{Version:626},ConditionalEventHistory:{ActiveEvents:{}},
            World:{GridCollection:{Grids:{'7':{ID:7,GridDefaultLayoutPath:'',
              Objects:{'4':{ID:4,ItemID:40001680,State:{Storage:{
                ContainerInventoryID:12,DefaultContainerInventoryData:'',
                UnlockKeyItemID:0,UnlockLocId:'',DesignID:null}}}}}},DiffGrids:{}},
              MissionSlots:{},Villages:[{Areas:{'2':{GridIDs:[7],Unlocked:true}}}]},
            Player:{ListInventories:{
              '0':{ID:0,CompatibleItemType:'ItemType_Furniture',
                CompatibleFurnitureTypes:{List:['FurnitureItemType_Default']},
                Inventory:{'40000048':{Amount:3,Marker:'ItemMarker_None'}}},
              '2':{ID:2,CompatibleItemType:'ItemType_ActivityItem',
                Inventory:{'30200000':{Amount:2}}}},
              ContainerInventories:{'12':{ID:12,ParentItemID:40001680,BelongsToPlayer:true,
                BlockMoveTo:false,Size:48,ExtraSize:0,
                Inventory:[{ItemID:30200000,Amount:50,State:null,Unknown:7},...Array.from({length:47},empty)]}},
              BackpackOverflow:{Items:[]},AchievementsData:[],EvolveStatesProfile:{EvolveProgressState:{}},
              DutySlots:{},BattlePassStates:{Progress:{},FtueProgress:{TasksProgress:[],WeeklyTasksProgress:[]}}},
            Unknown:{neverOverwrite:true}};
          const encoded=new TextEncoder().encode(JSON.stringify(source));
          const hash=bytes=>createHash('sha256').update(bytes).digest('hex');
          const inputSha=hash(encoded);
          const BUILD='releases_1.25-v1.25.3-44-g0b41250d9ac0-incremental-22';
          const w=new WorkerWasmSource('steam-windows','steam-full-version',BUILD,626,true,new Uint8Array(32).fill(19));
          for(let i=0;i<encoded.length;i+=1024*1024)w.append_chunk(encoded.slice(i,i+1024*1024));
          const session=JSON.parse(w.finish());
          assert.equal(session.fullDocumentJsonValidated,true);
          assert.equal(session.writerAuthorized,false);
          const a=[session.sessionId,BigInt(session.revision),BigInt(session.indexGeneration),session.decodedSha256];
          const d=JSON.parse(w.discover_scoped_amount('catalog0-furniture',0,...a));
          assert.equal(d.writerAuthorized,false);assert.equal(d.editedCopyAuthorized,false);
          const inv=d.rows.find(r=>r.profile==='catalog0-furniture'&&r.id===0&&r.selector===40000048&&r.oldAmount===3);
          assert.ok(inv,'real Rust must mint eligible existing 40000048 amount3');
          assert.throws(()=>w.discover_scoped_amount('linked-crop-chest48',0,...a));
          assert.throws(()=>w.preview_scoped_amount('linked-crop-chest48',12,0,49,...a));
          assert.throws(()=>w.preview_scoped_amount('catalog0-furniture',12,40000048,2,...a));
          assert.throws(()=>w.stage_scoped_amount('linked-crop-chest48',12,0,50,49,'b'.repeat(64),...a));
          assert.throws(()=>w.stage_scoped_amount('catalog0-furniture',0,40000048,3,3,'b'.repeat(64),...a));
          const preview=JSON.parse(w.preview_scoped_amount('catalog0-furniture',0,40000048,2,...a));
          assert.equal(preview.itemId,40000048);assert.equal(preview.oldAmount,3);assert.equal(preview.newAmount,2);
          assert.equal(preview.writerAuthorized,false);
          const staged=JSON.parse(w.stage_scoped_amount('catalog0-furniture',0,40000048,3,2,preview.entrySha256,...a));
          assert.equal(staged.exactFieldChangedCount,1);
          assert.equal(staged.applied,true);assert.equal(staged.writerAuthorized,false);
          const next=[staged.sessionId,BigInt(staged.revision),BigInt(staged.indexGeneration),staged.decodedSha256];
          const out=JSON.parse(w.begin_scoped_edit_output(...next));
          assert.equal(out.writerAuthorized,false);assert.equal(out.originalOverwriteAuthorized,false);
          const chunks=[];let consumed=0;
          do{const c=w.next_scoped_edit_output_chunk();chunks.push(c);consumed+=c.length;if(consumed>32*1024*1024)throw Error('output too large');}while(consumed<out.decodedBytes);
          const merged=new Uint8Array(consumed);let pos=0;for(const c of chunks){merged.set(c,pos);pos+=c.length;}
          const wanted=structuredClone(source);wanted.Player.ListInventories['0'].Inventory['40000048'].Amount=2;
          assert.equal(new TextDecoder().decode(merged),JSON.stringify(wanted),'exact one lexical field; unknowns unchanged');
          assert.equal(hash(encoded),inputSha);
          assert.throws(()=>w.begin_scoped_edit_output(...next),'no double Export');
          w.close();
          const foreign=new WorkerWasmSource('switch','switch-bid','9A239D3DB569756D',626,true,new Uint8Array(32).fill(8));
          foreign.append_chunk(encoded);const fr=JSON.parse(foreign.finish());
          assert.throws(()=>foreign.discover_scoped_amount('catalog0-furniture',0,fr.sessionId,BigInt(fr.revision),BigInt(fr.indexGeneration),fr.decodedSha256));
          foreign.close();
          // Exercise the actual generated Rust WASM through the product Worker
          // owner, not a mock or JS edit. No file/storage/rights granted.
          const {createProductWasmReadOwner}=await import('./src/lib/ddv/core/save/product-wasm-read-owner.mjs');
          const owner=createProductWasmReadOwner(async()=>({WorkerWasmSource}),{allowSteam626Catalog0Source:true});
          const opened=await owner.openDecoded({
            build:{platform:'steam-windows',buildKind:'steam-full-version',buildId:BUILD,schema:626,externallyConfirmed:true},
            decodedChunks:(async function*(){yield encoded})()
          });
          assert.equal(opened.writerAuthorized,false);
          const ownerRows=owner.discoverScopedTargets('catalog0-furniture');
          assert.ok(ownerRows.some(t=>t.id===0&&t.selector===40000048&&t.itemId===40000048&&t.oldAmount===3));
          const candidate=owner.previewScopedAmount({profile:'catalog0-furniture',id:0,selector:40000048,newAmount:2});
          assert.equal(candidate.itemId,40000048);
          assert.equal(candidate.oldAmount,3);
          assert.equal(candidate.newAmount,2);
          assert.equal(candidate.writerAuthorized,false);
          assert.equal(owner.close().writerAuthorized,false);
          await assert.rejects(()=>owner.openDecoded({
            build:{platform:'switch',buildKind:'switch-bid',buildId:'9A239D3DB569756D',schema:626,externallyConfirmed:true},
            decodedChunks:(async function*(){yield encoded})()
          }),/PRODUCT_WORKER_SCOPED_SOURCE_OFF/);
          // End-to-end synthetic encrypted P1G -> real generated Rust -> one
          // typed mutation -> distinct encrypted copy, without mocking Rust.
          // Local directory emulates OPFS API: NOT evidence of physical disk,
          // Owner real encrypted Save, or signed public route eligibility.
          const {makeSyntheticP1gProfile}=await import('./tests/helpers/p1g-fixture.mjs');
          const {p1gPackagedProfileCodec}=await import('./src/lib/ddv/core/save/p1g-packaged-profile-codec.js');
          const {createProductSteam626Catalog0LocalAdapter}=await import('./src/lib/ddv/core/save/product-scoped-amount-local-adapter.mjs');
          const {spawnSync}=await import('node:child_process');
          const {mkdtemp,writeFile,readFile:readPhysicalFile,rm}=await import('node:fs/promises');
          const {tmpdir}=await import('node:os');
          const {join}=await import('node:path');
          const originalEncrypted=makeSyntheticP1gProfile(source);
          const originalEncryptedSha=hash(originalEncrypted);
          const originalFile=new File([originalEncrypted],'synthetic-steam626-inventory0.p1g');
          const stored=new Map();
          const directory={
            async getFileHandle(name,options){
              if(!stored.has(name)){
                if(!options?.create)throw Object.assign(new Error('no existing entry'),{name:'NotFoundError'});
                stored.set(name,new Uint8Array());
              }
              return {
                async getFile(){return new File([stored.get(name)],name)},
                async createWritable(){let pending=null;return{
                  async write(bytes){pending=new Uint8Array(bytes)},
                  async close(){stored.set(name,pending);pending=null},
                  async abort(){if(pending)pending.fill(0);pending=null}
                }}
              };
            },
            async removeEntry(name){stored.delete(name)}
          };
          const previousLocks=Object.getOwnPropertyDescriptor(navigator,'locks');
          Object.defineProperty(navigator,'locks',{configurable:true,
            value:{request:async(_name,action)=>action()}});
          // Real filesystem boundary for synthetic fixture only: files are
          // local private 0600, never the Owner's installed game or browser OPFS.
          const temporary=await mkdtemp(join(tmpdir(),'wand-inv0-synthetic-v2-'));
          const originalPath=join(temporary,'encrypted-original.p1g');
          const backupPath=join(temporary,'encrypted-original-backup.p1g');
          const editedPath=join(temporary,'encrypted-edited-copy.p1g');
          let synthetic=null,backed=null,edited=null;
          try{
            synthetic=createProductSteam626Catalog0LocalAdapter({
              wasmFactory:async()=>({WorkerWasmSource}),
              getDirectory:async()=>directory,
              freshCodecReopen:async(bytes,expectedSha)=>{
                const decoded=await p1gPackagedProfileCodec.loadProfile(bytes);
                return hash(new TextEncoder().encode(decoded.jsonText))===expectedSha;
              }
            });
            const selectedBuild={platform:'steam-windows',
              buildKind:'steam-full-version',buildId:BUILD,schema:626,externallyConfirmed:true};
            await assert.rejects(synthetic.open({
              file:originalFile,originalSha256:originalEncryptedSha,
              build:{...selectedBuild,platform:'switch'}
            }));
            await synthetic.open({file:originalFile,originalSha256:originalEncryptedSha,build:selectedBuild});
            await synthetic.backupOriginal();
            const available=await synthetic.listVerifiedTargets();
            const target=available.targets.find(t=>t.kind==='InventoryExistingAmountDecrease'&&
              t.targetId===0&&t.itemId===40000048&&t.oldAmount===3);
            assert.ok(target,'Core-minted inventory0 item eligible through real encrypted P1G');
            await synthetic.stageTyped([{kind:'InventoryExistingAmountDecrease',inventoryId:0,
              canonicalItemId:40000048,compatibleItemType:'ItemType_Furniture',
              expectedOldAmount:3,newAmount:2}]);
            await synthetic.undo();
            await synthetic.redo();
            const receipt=await synthetic.exportEditedCopy();
            assert.equal(receipt.editedCiphertextVerified,true);
            assert.equal(receipt.freshWorkerReopenVerified,true);
            assert.equal(receipt.independentProcessReopenVerified,false);
            assert.equal(receipt.originalUnchanged,true);
            backed=await synthetic.downloadVerifiedCopy('backup');
            edited=await synthetic.downloadVerifiedCopy('edited');
            assert.equal(hash(backed.encryptedBytes),originalEncryptedSha);
            assert.notEqual(backed.name,edited.name);
            assert.notEqual(edited.name,originalFile.name);
            assert.equal(hash(new Uint8Array(await originalFile.arrayBuffer())),originalEncryptedSha);
            const reopened=await p1gPackagedProfileCodec.loadProfile(edited.encryptedBytes);
            assert.equal(reopened.jsonText,JSON.stringify(wanted));
            // Persist each synthetic encrypted artifact as a distinct physical
            // file, then independently reopen the EDITED FILE by path in a
            // fresh Node OS process with no plaintext or edited bytes on stdin.
            await writeFile(originalPath,originalEncrypted,{flag:'wx',mode:0o600});
            await writeFile(backupPath,backed.encryptedBytes,{flag:'wx',mode:0o600});
            await writeFile(editedPath,edited.encryptedBytes,{flag:'wx',mode:0o600});
            assert.equal(hash(new Uint8Array(await readPhysicalFile(originalPath))),originalEncryptedSha);
            assert.equal(hash(new Uint8Array(await readPhysicalFile(backupPath))),originalEncryptedSha);
            assert.equal(hash(new Uint8Array(await readPhysicalFile(editedPath))),hash(edited.encryptedBytes));
            assert.notEqual(hash(new Uint8Array(await readPhysicalFile(editedPath))),originalEncryptedSha);
            await assert.rejects(writeFile(originalPath,new Uint8Array([0]),{flag:'wx',mode:0o600}),
              {code:'EEXIST'},'encrypted original must never be overwritten');
            // Synthetic-only physical file reopen is stronger than stdin
            // handoff, but is NOT the private Owner P1G Product V2 or OPFS.
            const childCode=`
              import {p1gPackagedProfileCodec} from './src/lib/ddv/core/save/p1g-packaged-profile-codec.js';
              import {createHash} from 'node:crypto';
              import {readFile} from 'node:fs/promises';
              const encryptedFilePath=process.argv[2];
              if(!encryptedFilePath)process.exit(32);
              const opened=await p1gPackagedProfileCodec.loadProfile(
                new Uint8Array(await readFile(encryptedFilePath)));
              const sha=createHash('sha256').update(opened.jsonText).digest('hex');
              if(sha!==process.argv[1])process.exit(30);
              const body=JSON.parse(opened.jsonText);
              if(body.Player.ListInventories['0'].Inventory['40000048'].Amount!==2||
                 body.Unknown.neverOverwrite!==true)process.exit(31);
              process.stdout.write('01A_SYNTHETIC_FRESH_OS_PROCESS_ENCRYPTED_FILE_CODEC_REOPEN_PASS');
            `;
            const separate=spawnSync(process.execPath,
              ['--input-type=module','--eval',childCode,
                hash(new TextEncoder().encode(JSON.stringify(wanted))),editedPath],
              {cwd:process.cwd(),encoding:'utf8',timeout:30000,maxBuffer:16384});
            assert.equal(separate.status,0,'synthetic encrypted file child Codec reopen failed: '+separate.stderr);
            assert.equal(separate.stdout,'01A_SYNTHETIC_FRESH_OS_PROCESS_ENCRYPTED_FILE_CODEC_REOPEN_PASS');
            assert.equal(hash(new Uint8Array(await readPhysicalFile(originalPath))),originalEncryptedSha);
            assert.equal(hash(new Uint8Array(await readPhysicalFile(backupPath))),originalEncryptedSha);
            console.log('01A_STEAM626_CATALOG0_SYNTHETIC_PHYSICAL_ENCRYPTED_FILE_CHILD_REOPEN_PASS');
            await synthetic.close();
            assert.equal(hash(new Uint8Array(await originalFile.arrayBuffer())),originalEncryptedSha);
            console.log('01A_STEAM626_CATALOG0_ACTUAL_RUST_SYNTHETIC_ENCRYPTED_BACKUP_EDITED_AND_CHILD_CODEC_PASS');
          }finally{
            if(backed?.encryptedBytes)backed.encryptedBytes.fill(0);
            if(edited?.encryptedBytes)edited.encryptedBytes.fill(0);
            if(synthetic)await synthetic.close();
            await rm(temporary,{recursive:true,force:true});

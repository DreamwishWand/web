name: 04 QR PR445 repaired Source independent immutable Native ID provenance
on:
  push:
    branches: [qa/pr445-source-grid-provenance-repair-20261104]
  pull_request:
    branches: [wep/local-spatial-source-main-20261104]
permissions:
  contents: read
jobs:
  source-native-id:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false,fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Freeze exact Source and two QA-only paths
        shell: bash
        run: |
          set -euo pipefail
          SRC=19f0db3b07651ec5734c2918e550413af3c160aa
          MAIN=a6c69b441463431baa5333b07b952bddc62b843b
          git merge-base --is-ancestor "$SRC" HEAD
          git merge-base --is-ancestor "$MAIN" HEAD
          git diff --name-only "$SRC" HEAD | sort >/tmp/qr445-delta
          printf '%s\n' .github/workflows/qr-pr445-native-id-independent.yml tests/qr-pr445-source-native-id-independent.test.mjs | sort >/tmp/qr445-qaonly
          diff -u /tmp/qr445-qaonly /tmp/qr445-delta
          test "$(git hash-object src/lib/wep/real-save-spatial-read.ts)" = 48b32c3bd3132c6e48a47d7b8f017a35642d2623
          test "$(git hash-object tests/wep-real-save-spatial-read.test.mjs)" = b0cd84bee24c3262af36606118f6288483652af1
          test -z "$(git diff --name-only "$SRC" HEAD -- src supabase docs static)"
          echo QR445_PINNED_SOURCE_P1G_SHAPED_QA_ONLY_PASS
      - run: npm ci --no-audit --no-fund
      - name: New independent Native source forged immutable ID negatives
        run: node --experimental-strip-types --test tests/qr-pr445-source-native-id-independent.test.mjs
      - run: npm run check

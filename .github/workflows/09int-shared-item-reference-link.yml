name: 09 INT Shared Collection Decorate Item Reference (source only)
on:
  pull_request:
    paths:
      - 'src/lib/collection/shared-item-reference.js'
      - 'src/lib/collection/shared-item-link-copy.js'
      - 'src/routes/collection/+page.svelte'
      - 'src/routes/explore/+page.svelte'
      - 'tests/09int-shared-item-reference-link.test.mjs'
      - '.github/workflows/09int-shared-item-reference-link.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Shared Item ID target, related edges and Guide publication fail-closed
        run: node --test tests/09int-shared-item-reference-link.test.mjs
      - name: Svelte and static application integration
        run: |
          npm ci
          npm run check
          npm run build

name: 04 QR-W PR1066 independent eligible60
on:
  pull_request:
    paths:
      - 'scripts/04qr-w-pr1066-eligible60-independent-20261114.mjs'
      - '.github/workflows/04qr-w-pr1066-eligible60-20261114.yml'
permissions:
  contents: read
jobs:
  independent:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm install --no-save --package-lock=false playwright-core@1.55.0
      - name: Independent source and actual compiled Chrome 60
        run: |
          set -euo pipefail
          export CHROME_BIN="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium)"
          "$CHROME_BIN" --version
          node scripts/04qr-w-pr1066-eligible60-independent-20261114.mjs

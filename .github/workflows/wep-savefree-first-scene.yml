name: WEP F-P04 Save-free first nonempty Scene from verified Catalog
on:
  pull_request:
    paths:
      - 'src/routes/editor/world/+page.svelte'
      - 'src/lib/wep/SaveFreeFirstScene.svelte'
      - 'src/lib/wep/savefree-first-scene.ts'
      - 'docs/wep/world-editor-localization-inventory-20261002.json'
      - 'tests/wep-savefree-first-scene.test.mjs'
      - 'scripts/wep-savefree-first-scene-chrome.mjs'
      - '.github/workflows/wep-savefree-first-scene.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - name: New source-bound real pinned Switch1250 Catalog and geometry Node negatives
        run: node --test tests/wep-savefree-first-scene.test.mjs
      - name: Svelte check and static /web build
        env:
          BASE_PATH: /web
        run: |
          npm run check
          npm run build
          test -f build/editor/world/index.html
  real-chrome:
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm install --no-save --package-lock=false playwright-core@1.55.0
      - name: Installed Chrome no private Save, no native Apply
        shell: bash
        run: |
          set -euo pipefail
          test -z "${WEP_PRIVATE_P1G_PATH:-}"
          test -z "${DDV_PRIVATE_SAVE_PATH:-}"
          BIN="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || true)"
          test -n "$BIN"
          "$BIN" --version
          export CHROME_BIN="$BIN"
          BASE_PATH='' npm run dev -- --host 127.0.0.1 --port 4358 >/tmp/wep-savefree-first-scene.log 2>&1 &
          for i in $(seq 1 75); do
            if curl -fsS http://127.0.0.1:4358/editor/world/ >/dev/null; then break; fi
            sleep 1
          done
          node scripts/wep-savefree-first-scene-chrome.mjs

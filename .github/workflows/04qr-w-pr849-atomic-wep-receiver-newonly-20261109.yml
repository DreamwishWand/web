name: "04 QR-W PR849 IDB World Editor readonly Draft receiver independent"
on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/04qr-w-pr849-atomic-wep-receiver-newonly-20261109.yml"
      - "scripts/04qr-w-pr849-atomic-wep-receiver-newonly-20261109.mjs"
  push:
    branches: [qa/04qr-w-pr849-atomic-wep-receiver-fb503b-20261109]
permissions:
  contents: read
jobs:
  independent-wep-idb:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm install --no-save --package-lock=false playwright-core@1.55.0
      - name: "Local browser with no private P1G"
        shell: bash
        run: |
          set -euo pipefail
          test -z "${WEP_PRIVATE_P1G_PATH:-}"
          test -z "${DDV_PRIVATE_SAVE_PATH:-}"
          BIN="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || true)"
          test -n "$BIN"
          echo "CHROME_BIN=$BIN" >> "$GITHUB_ENV"
          BASE_PATH='' npm run dev -- --host 127.0.0.1 --port 4321 >/tmp/qrw849.log 2>&1 &
          for i in $(seq 1 75); do
            if curl -fsS http://127.0.0.1:4321/editor/world/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/qrw849.log
          exit 1
      - name: "Changed-eight WEP source immutable and independent Chrome negatives"
        env:
          QRW849_ORIGIN: http://127.0.0.1:4321
        run: node scripts/04qr-w-pr849-atomic-wep-receiver-newonly-20261109.mjs
      - name: "No Native Writer, real P1G or Store Migration accepted"
        run: echo "QRW849_SYNTHETIC_READ_ONLY_DRAFT_WRITER_APPLY_CLOUD_OFF"

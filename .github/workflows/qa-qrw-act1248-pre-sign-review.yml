name: QA ONLY ACT1248 pre-sign Review lifecycle (never merge)
on:
  pull_request:
    paths:
      - '.github/workflows/qa-qrw-act1248-pre-sign-review.yml'
permissions:
  contents: read
jobs:
  spatial-review-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e910d4551ab336983f868b88febb50cf36b490db
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pin actual source and keep production anchor null
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = e910d4551ab336983f868b88febb50cf36b490db
          test "$(git rev-parse HEAD:src/lib/dev/LocalPlacementEditorDev.svelte)" = 1624ce84b68c0256015eb5c9ddf67b76d7b7d72a
          test "$(git rev-parse HEAD:src/lib/dev/local-placement-workflow.mjs)" = c9b0f0ed818cec691a7735bccda8e10b908e0def
          test "$(git rev-parse HEAD:src/lib/dev/PlacementProductRoute.svelte)" = fd2d3fde1bc0863f0303b91f7b3aa005547df18a
          test "$(git rev-parse HEAD:src/lib/dev/comp03-product-route-port.mjs)" = 6f3c3fe4c01c1ed0bcc196f20af015929fe4ab6f
          test "$(git rev-parse HEAD:src/lib/ddv/core/save/product-scoped-comp03-spatial-release-anchor.mjs)" = 3dbd5b6bd2268a3a42589364fa06ab09da84565b
          test "$(git rev-parse HEAD:src/lib/dev/product-placement-client.mjs)" = 85d258ab428ad1eb72e2c7cf9d52f956f607b8cb
          test "$(git rev-parse HEAD:src/lib/wep/comp03-spatial-preview.ts)" = c147c8d84ad9f0b9ca240208bd3679418fe133a0
          test "$(git rev-parse HEAD:src/lib/wep/Comp03ReferencePattern.svelte)" = af6861ca808e7e44ab3e419c146a36090d63fb7f
          grep -Fx 'export const PROTECTED_COMP03_SPATIAL_RELEASE_ANCHOR=null;' src/lib/ddv/core/save/product-scoped-comp03-spatial-release-anchor.mjs
      - run: npm ci --no-audit --no-fund
      - run: npm install --no-save --package-lock=false playwright-core@1.55.0
      - name: Actual production static OFF and isolated selector rejection
        run: |
          set -euo pipefail
          BASE_PATH='' npm run build
          cat > tests/.qa-1248-static.mjs <<'NODE'
          import assert from 'node:assert/strict';import {readFileSync} from 'node:fs';import {spawn,spawnSync} from 'node:child_process';import {chromium} from 'playwright-core';
          const src=readFileSync('src/lib/dev/comp03-product-route-port.mjs','utf8');
          const anchor="import {PROTECTED_COMP03_SPATIAL_RELEASE_ANCHOR} from '../ddv/core/save/product-scoped-comp03-spatial-release-anchor.mjs';";
          const client="import {createProductComp03Port,createProductComp03SpatialPort} from './product-placement-client.mjs';";
          for(const [label,value,expected] of [['null','null','legacy'],['invalid','{}','spatial'],['false','false','spatial'],['undefined','undefined','spatial']]){
           const a='const PROTECTED_COMP03_SPATIAL_RELEASE_ANCHOR='+value+';',c="const createProductComp03Port=()=>{globalThis.__qaCalls.push('legacy');return Promise.resolve('legacy')};const createProductComp03SpatialPort=()=>{globalThis.__qaCalls.push('spatial');return Promise.reject(Error('DENIED'))};";
           assert.equal(src.split(anchor).length,2);assert.equal(src.split(client).length,2);const code=src.replace(anchor,a).replace(client,c);assert.equal(code.replace(a,anchor).replace(c,client),src);
           globalThis.__qaCalls=[];const mod=await import('data:text/javascript;base64,'+Buffer.from(code+'//'+label).toString('base64'));if(expected==='legacy')assert.equal(await mod.createComp03ReviewPort({}),'legacy');else await assert.rejects(mod.createComp03ReviewPort({}),/DENIED/);assert.deepEqual(globalThis.__qaCalls,[expected]);
          }
          const origin='http://127.0.0.1:4187',server=spawn('python3',['-m','http.server','4187','--bind','127.0.0.1','--directory','build'],{stdio:'inherit'});let browser;
          try{
           for(let i=0;i<80;i++){try{if((await fetch(origin+'/editor/world/comp03/')).ok)break}catch{}await new Promise(r=>setTimeout(r,250))}
           const bin=['google-chrome-stable','google-chrome','chromium'].find(x=>spawnSync('which',[x]).status===0);assert.ok(bin);browser=await chromium.launch({headless:true,executablePath:spawnSync('which',[bin],{encoding:'utf8'}).stdout.trim(),args:['--no-sandbox','--disable-dev-shm-usage']});
           const page=await browser.newPage(),requests=[],errors=[];page.on('request',r=>requests.push(r.url()));page.on('pageerror',e=>errors.push(String(e)));
           await page.addInitScript(()=>{const w=window.Worker;window.__qaWorkers=[];window.Worker=new Proxy(w,{construct(t,a,n){window.__qaWorkers.push(String(a[0]));return Reflect.construct(t,a,n)}})});
           for(const suffix of ['?spatial=1&mode=public-accepted','?release=steam626-comp03-spatial','']){
            const response=await page.goto(origin+'/editor/world/comp03/'+suffix);assert.equal(response.status(),200);const r=page.locator('[data-placement-product-route="comp03"]');await r.waitFor();await page.waitForLoadState('networkidle');assert.equal(await r.getAttribute('data-placement-scope'),'off');assert.equal(await r.locator('input[type=file],[data-comp03-spatial-review]').count(),0);assert.equal(await page.evaluate(()=>window.__qaWorkers.length),0);
           }
           assert.equal(requests.filter(x=>/worker-wasm-scoped-steam626-comp03|ddv_save_core_bg.wasm/.test(x)).length,0);assert.deepEqual(errors,[]);
           console.log('ACT1248_STATIC_OFF_SELECTOR_PASS '+JSON.stringify({staticRoutes:3,worker:0,scopedRequests:0,selectorCases:4,actualSignature:false}));
          }finally{await browser?.close();server.kill()}
          NODE
          node tests/.qa-1248-static.mjs
      - name: Isolated source DOM unmount while spatial pending
        run: |
          set -euo pipefail
          mkdir -p src/routes/test-wep-spatial-review
          node --input-type=module <<'NODE'
          import {readFileSync,writeFileSync} from 'node:fs';
          import assert from 'node:assert/strict';
          const source=readFileSync('src/lib/dev/LocalPlacementEditorDev.svelte','utf8');
          const a="import {productPlacementPortScope} from './product-placement-client.mjs';";
          const b="import {productPlacementPortScope} from './.qa-wep-review-scope.mjs';";
          assert.equal(source.split(a).length,2);
          const copy=source.replace(a,b);assert.equal(copy.replace(b,a),source);
          writeFileSync('src/lib/dev/QaWepReview.svelte',copy);
          NODE
          cat > src/lib/dev/.qa-wep-review-scope.mjs <<'NODE'
          // TEST ONLY: this module is never imported by the real product route.
          // No real product brand, signature, Worker or editing authority.
          const scopes=new WeakMap();
          export const productPlacementPortScope=p=>scopes.get(p)||null;
          export const fixtureScope=(p,enabled)=>{scopes.set(p,Object.freeze({uiOperation:'comp03',mode:'private-product-v2',...(enabled?{spatialPreviewEnabled:true}:{})}));return p};
          NODE
          cat > src/routes/test-wep-spatial-review/+page.svelte <<'SVELTE'
          <script>
          import {onMount} from 'svelte';
          import {setLocale} from '$lib/i18n/runtime.js';
          import {localPlacementCopy} from '$lib/dev/local-placement-copy.mjs';
          import QaWepReview from '$lib/dev/QaWepReview.svelte';
          import {fixtureScope} from '$lib/dev/.qa-wep-review-scope.mjs';
          let mode='spatial',adapter=null,generation=0;
          const safe=(kind,extra={})=>({kind,ok:true,writerAuthorized:false,nativeV3Verified:false,originalOverwriteAuthorized:false,...extra});
          const coords=[[16,24],[20,24],[24,24],[16,28],[20,28],[24,28],[16,32],[20,32],[24,32]];
          const state={calls:[],hold:false,invalid:false,release:null};
          function make(which){
           let input=null,seed=82;
           const a={
            async open(r){input=r;state.calls.push('open');return safe('OPEN')},
            async backupOriginal(){state.calls.push('backup');return {backupReadbackVerified:true,originalUnchanged:true,shaMatched:true,sizeMatched:true,separateName:true,originalName:input.file.name,originalSha256:input.originalSha256,originalSizeBytes:input.file.size,backupName:'synthetic-backup.p1g'}},
            async previewPlacement(s){seed=s.seedId;state.calls.push('preview:'+seed);return {itemId:40100038,gridId:301,seedId:seed,nextObjectId:92,oldAmount:99,newAmount:99,inventoryDelta:0,retainSeed:1,addObjects:8,exactFieldChangedCount:9,scopedCandidate:true,writerAuthorized:false,editedCopyAuthorized:false}},
            async spatialPreview(...args){if(args.length)throw Error('fixture args');state.calls.push('spatial');if(state.hold)await new Promise(r=>state.release=r);return {rootSceneItemId:1540000150,gridId:state.invalid?999:301,seedId:seed,nextObjectId:92,anchors:coords.map(([x,y],i)=>({objectId:i===0?seed:91+i,x,y,role:i===0?'retained':'proposed'})),writerAuthorized:false,editedCopyAuthorized:false}},
            async stagePlacement(){state.calls.push('stage');return safe('STAGED',{exactFieldChangedCount:9})},
            async undo(){return safe('UNDONE')},async redo(){return safe('REDONE')},async exportEditedCopy(){throw Error('fixture never exports')},async downloadVerifiedCopy(){throw Error('fixture never downloads')},
            async close(){state.calls.push('close');input=null;return safe('CLOSED')}
           };
           return fixtureScope(Object.freeze(a),which==='spatial');
          }
          function change(which){mode=which;state.hold=false;state.invalid=false;state.release?.();state.release=null;adapter=make(which);generation++}
          function replacePending(){const old=state.release;state.release=null;state.hold=false;state.invalid=false;adapter=make('spatial');generation++;return old}
          onMount(()=>{setLocale('en');window.__wepReview={state,change,replacePending,words:localPlacementCopy('en')};change('spatial')});
          </script>
          <div data-qa-review-shell>
           {#if adapter}{#key generation}<QaWepReview trustedWorkerAdapter={adapter} fixedOperation="comp03"/>{/key}{/if}
          </div>
          SVELTE
          cat > tests/.qa-wep-spatial-review-browser.mjs <<'NODE'
          import assert from 'node:assert/strict';
          import {chromium} from 'playwright-core';
          import {spawn,spawnSync} from 'node:child_process';
          const origin='http://127.0.0.1:4186';
          const server=spawn('npm',['run','dev','--','--host','127.0.0.1','--port','4186','--strictPort'],{env:{...process.env,BASE_PATH:''},stdio:'inherit'});
          let browser;
          try{
           let ready=false;for(let i=0;i<100;i++){try{if((await fetch(origin+'/test-wep-spatial-review/')).ok){ready=true;break}}catch{}await new Promise(r=>setTimeout(r,250))}assert.ok(ready,'server ready');
           const bin=['google-chrome-stable','google-chrome','chromium'].find(x=>spawnSync('which',[x]).status===0);assert.ok(bin);
           browser=await chromium.launch({headless:true,executablePath:spawnSync('which',[bin],{encoding:'utf8'}).stdout.trim(),args:['--no-sandbox','--disable-dev-shm-usage']});
           const page=await browser.newPage({viewport:{width:390,height:844}}),errors=[];
           page.on('pageerror',e=>errors.push(String(e)));
           // Real unmodified product route; query cannot grant optional scope.
           await page.addInitScript(()=>{const w=window.Worker;window.__wepWorkers=[];window.Worker=new Proxy(w,{construct(t,a,n){window.__wepWorkers.push(String(a[0]));return Reflect.construct(t,a,n)}})});
           await page.goto(origin+'/editor/world/comp03/?spatial=1&mode=public-accepted');
           const off=page.locator('[data-placement-product-route="comp03"]');await off.waitFor();
           assert.equal(await off.getAttribute('data-placement-scope'),'off');assert.equal(await off.locator('input[type=file]').count(),0);assert.equal(await off.locator('[data-comp03-spatial-review]').count(),0);
           assert.equal(await page.evaluate(()=>window.__wepWorkers.filter(x=>/comp03|placement/i.test(x)).length),0);
           await page.goto(origin+'/test-wep-spatial-review/');
           await page.waitForFunction(()=>!!window.__wepReview);
           const w=await page.evaluate(()=>window.__wepReview.words);
           const shell=page.locator('[data-qa-review-shell]'),ed=shell.locator('[data-dev-placement]'),plot=ed.locator('[data-comp03-spatial-review]');
           const button=k=>ed.getByRole('button',{name:w[k],exact:true});
           const waitHidden=async()=>{await plot.waitFor({state:'detached'});assert.equal(await plot.count(),0)};
           async function prepare(){
            const file=ed.locator('input[type=file]');await file.waitFor();
            await file.setInputFiles({name:'synthetic.p1g',mimeType:'application/octet-stream',buffer:Buffer.alloc(16)});
            await ed.locator('input[type=checkbox]').check();
            await button('openFile').click();await button('backup').click();
            await ed.locator('input[type=number]').fill('82');
           }
           // Distinct independent counterexample: destroy old component while companion awaits.
           await prepare();await page.evaluate(()=>window.__wepReview.state.hold=true);await button('review').click();await page.waitForFunction(()=>!!window.__wepReview.state.release);await waitHidden();
           await page.evaluate(()=>{window.__oldRelease=window.__wepReview.replacePending()});
           await ed.locator('input[type=file]').waitFor();await waitHidden();
           await page.evaluate(()=>{window.__oldRelease();delete window.__oldRelease});
           await page.waitForTimeout(150);await waitHidden();assert.equal(await button('stagePlacement').count(),0);
           // New independent component is not poisoned by the delayed prior receipt.
           await prepare();await button('review').click();await plot.waitFor();assert.equal(await plot.locator('[data-comp03-anchor]').count(),9);
           assert.equal(await plot.locator('[data-comp03-anchor="retained"]').count(),1);
           await button('close').click();await ed.locator('input[type=file]').waitFor();await waitHidden();
           assert.equal(errors.length,0,errors.join('\n'));
           console.log('ACT1248_UNMOUNT_LATE_RECEIPT_PASS '+JSON.stringify({oldPendingUnmount:true,lateReceiptHidden:true,newGenerationAnchors:9,closeHidden:true,actualSigned:false,productV2:false}));
          }finally{await browser?.close();server.kill('SIGTERM')}
          NODE
          node tests/.qa-wep-spatial-review-browser.mjs
          git diff --exit-code -- src/lib/dev/LocalPlacementEditorDev.svelte src/lib/dev/local-placement-workflow.mjs src/lib/dev/PlacementProductRoute.svelte src/lib/dev/comp03-product-route-port.mjs src/lib/ddv/core/save/product-scoped-comp03-spatial-release-anchor.mjs

name: 04 QR-S Switch626 Catalog0 proof adapter (QA ONLY)
on:
  pull_request:
    paths:
      - '.github/workflows/04qrs-act1152-switch-catalog0-proof.yml'
permissions:
  contents: read
jobs:
  focus:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 49648bdd5f80285fcf6ec3adf23a5d626a62ce86
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fixed original blobs and independent boundary cases
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "49648bdd5f80285fcf6ec3adf23a5d626a62ce86"
          test "$(git rev-parse HEAD:scripts/readonly-release/seal-scoped-switch-catalog0-private.mjs)" = "f3556a3c26e1ad9983d44401fc4fb69149779de0"
          test "$(git rev-parse HEAD:scripts/readonly-release/seal.mjs)" = "5b86ff1cf2dc009ba1733bf213e4cb979bf500ec"
          test "$(git rev-parse HEAD:scripts/wasm-distribution/build-scoped-switch-catalog0-candidate.mjs)" = "b9375fe594e9b95a9b71b37696753058d64c2edb"
          test "$(git rev-parse HEAD:src/lib/ddv/core/save/product-scoped-switch-catalog0-release.mjs)" = "27c7769cca317146dd6da5e31f7e46109413e228"
          test "$(git rev-parse HEAD:tests/scoped-switch-catalog0-proof.test.mjs)" = "55047f66a0a930c704caa905a6f0ecc403e4d271"
          cat > tests/qa-switch-catalog0-proof-l2.mjs <<'EOF'
          import test from 'node:test';
          import assert from 'node:assert/strict';
          import {createHash} from 'node:crypto';
          import {ACTIVE_RELEASE_TUPLE as tuple} from '../src/lib/ddv/core/save/product-rust-wasm-release-trust.mjs';
          import {SCOPED_SWITCH_CATALOG0_RELEASE_OP as op,SCOPED_SWITCH_CATALOG0_FEATURES as features,SCOPED_SWITCH_CATALOG0_METHODS as methods,SCOPED_SWITCH_CATALOG0_WASM_EXPORTS as exports,validateScopedSwitchCatalog0Anchor} from '../src/lib/ddv/core/save/product-scoped-switch-catalog0-release.mjs';
          import {inspectScopedSwitchCatalog0Subjects,privateScopedSwitchCatalog0Identity} from '../scripts/readonly-release/seal-scoped-switch-catalog0-private.mjs';
          const source='a'.repeat(40),sha=b=>createHash('sha256').update(b).digest('hex');
          const u=n=>{const a=[];do{let v=n&127;n>>>=7;a.push(v|(n?128:0))}while(n);return a};
          const str=s=>[...u(Buffer.byteLength(s)),...Buffer.from(s)],sec=(id,b)=>[id,...u(b.length),...b];
          function wasm(names=exports){
           const e=names.flatMap(n=>[...str(n),n==='memory'?2:n==='__wbindgen_externrefs'?1:0,0]);
           return Buffer.from([0,97,115,109,1,0,0,0,...sec(1,[1,96,0,0]),...sec(3,[1,0]),...sec(4,[1,111,0,1]),...sec(5,[1,0,1]),...sec(7,[...u(names.length),...e]),...sec(10,[1,2,0,11])]);
          }
          function bytes(w=wasm(),js=Buffer.from('export default function(){}'),patch={}){
           const m={contract:'wand.scoped-switch-catalog0.runtime@1',operation:op,source:{repository:tuple.repository,commit:source,cargoTomlSha256:'b'.repeat(64),cargoLockSha256:'e58486d673df79bfe7e72b80449e39389e57010fe4051edcdcff9b53c2da898c',cargoLockOrigin:'approved-repository-lock',wasmBindgen:'0.2.105',wasmTarget:'wasm32-unknown-unknown',profile:'release',features,defaultFeatures:false,toolchain:'rustc 1.99.1 (test)'},assets:{js:{path:'ddv_save_core.js',sizeBytes:js.length,sha256:sha(js)},wasm:{path:'ddv_save_core_bg.wasm',sizeBytes:w.length,sha256:sha(w)}},abi:{exportClass:'WorkerWasmSource',methods,writerAuthorized:false,originalOverwriteAuthorized:false},release:{productConsumerEnabled:false,writerAuthorized:false,autoUpload:false,originalOverwriteAuthorized:false},...patch};
           return [Buffer.from(JSON.stringify(m)),js,w];
          }
          
          let pos=0,neg=0;
          const no=(name,f)=>{assert.throws(f,undefined,name);neg++};
          const yes=(name,f)=>{f();pos++};
          const b=bytes(),p=inspectScopedSwitchCatalog0Subjects(b,source),m=JSON.parse(b[0]);
          yes('exact three bytes and all pins',()=>{assert.equal(p.manifestSha256,sha(b[0]));assert.equal(p.jsSha256,sha(b[1]));assert.equal(p.wasmSha256,sha(b[2]));assert.equal(p.manifestSizeBytes,b[0].length);assert.equal(p.jsSizeBytes,b[1].length);assert.equal(p.wasmSizeBytes,b[2].length);assert.equal(exports.length,23);assert.equal(methods.length,14)});
          yes('Catalog0 three methods and neutral lifecycle accepted',()=>{const js=Buffer.from(methods.filter(n=>n.includes('switch626_catalog0')||n.includes('scoped_edit')).join(' '));assert.equal(inspectScopedSwitchCatalog0Subjects(bytes(wasm(),js),source).jsSha256,sha(js))});
          for(const [name,x] of [['missing subject',b.slice(0,2)],['extra subject',[...b,b[0]]],['wrong order',[b[1],b[0],b[2]]],['malformed JSON',[Buffer.from('{'),...b.slice(1)]],['invalid UTF8 manifest',[Buffer.from([255]),...b.slice(1)]],['empty JS',[b[0],Buffer.alloc(0),b[2]]],['over-limit manifest',[Buffer.alloc(65537),...b.slice(1)]],['over-limit JS',[b[0],Buffer.alloc(2*1024*1024+1),b[2]]],['over-limit WASM',[b[0],b[1],Buffer.alloc(20*1024*1024+1)]],['changed JS',[b[0],Buffer.from('different'),b[2]]],['changed WASM',[b[0],b[1],Buffer.from([0])]]])no(name,()=>inspectScopedSwitchCatalog0Subjects(x,source));
          for(const name of ['discover_switch626_chest','stage_scoped_amount','preview_scoped_collection_candidate','stage_fixed_collection','stage_steam626_comp03','stage_steam626_vase_add','toggle_scoped_amount','begin_scoped_amount_output','next_scoped_amount_output_chunk','private_native','dev_stage']){
           no('foreign JS '+name,()=>inspectScopedSwitchCatalog0Subjects(bytes(wasm(),Buffer.from(name)),source));
           no('foreign export '+name,()=>inspectScopedSwitchCatalog0Subjects(bytes(wasm([...exports,'workerwasmsource_'+name])),source));
          }
          no('missing export',()=>inspectScopedSwitchCatalog0Subjects(bytes(wasm(exports.slice(1))),source));
          for(const patch of [{operation:'switch626.chest.exact1'},{source:{...m.source,features:['product-amount-scoped','worker-wasm']}},{source:{...m.source,cargoLockSha256:'0'.repeat(64)}},{source:{...m.source,repository:'foreign/repo'}},{source:{...m.source,defaultFeatures:true}},{abi:{...m.abi,writerAuthorized:true}},{abi:{...m.abi,methods:methods.slice(1)}},{release:{...m.release,autoUpload:true}},{release:{...m.release,originalOverwriteAuthorized:true}},{extra:true}])no('manifest shape',()=>inspectScopedSwitchCatalog0Subjects(bytes(wasm(),undefined,patch),source));
          no('wrong source',()=>inspectScopedSwitchCatalog0Subjects(b,'c'.repeat(40)));
          const a=privateScopedSwitchCatalog0Identity(p,'http://127.0.0.1:4188',['switch']);
          assert.equal(await validateScopedSwitchCatalog0Anchor(a),true);assert.equal(a.builds[0].productV2EvidenceSha256,null);assert.equal(a.builds[0].buildId,'9A239D3DB569756D');pos++;
          for(const origin of ['https://127.0.0.1:4188','http://localhost:4188','http://127.0.0.1:65536','http://127.0.0.1:4188/x',tuple.origin])no('origin',()=>privateScopedSwitchCatalog0Identity(p,origin,['steam-windows']));
          for(const platforms of [[],['steam-windows'],['steam-windows','switch'],['switch','switch']])no('platform',()=>privateScopedSwitchCatalog0Identity(p,'http://127.0.0.1:4188',platforms));
          for(const change of [{...tuple,signerWorkflow:'foreign/workflow'},{...tuple,sourceRef:'refs/heads/other'},{...tuple,repository:'foreign/repo'}])no('issuer tuple',()=>privateScopedSwitchCatalog0Identity(p,'http://127.0.0.1:4188',['switch'],change));
          const {PROTECTED_SCOPED_SWITCH_CATALOG0_RELEASE_ANCHOR:anchor}=await import('../src/lib/ddv/core/save/product-scoped-switch-catalog0-release-anchor.mjs');assert.equal(anchor,null);pos++;
          console.log('SWITCH_CATALOG0_PROOF_ADAPTER_L2_PASS',JSON.stringify({pos,neg,actualWasmModule:true,syntheticSubjects:true,actualSignature:false,publicGrant:false}));
          EOF
          node tests/qa-switch-catalog0-proof-l2.mjs

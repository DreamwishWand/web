name: "04 QR-W PR801 repaired93ec rasterStatus independent Chrome changed-only"
on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/04qr-w-pr801-repaired93ec-rasterstatus-newonly-20261108.yml"
      - "scripts/04qr-w-pr801-repaired93ec-rasterstatus-newonly-20261108.mjs"
permissions:
  contents: read
jobs:
  independent-rasterstatus-repaired:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --no-audit --no-fund
      - run: npm install --no-save --package-lock=false playwright-core@1.55.0
      - name: Installed Chrome with local synthetic fixture only, no private P1G/ROM
        shell: bash
        run: |
          set -euo pipefail
          test -z "${WEP_PRIVATE_P1G_PATH:-}"
          test -z "${DDV_PRIVATE_SAVE_PATH:-}"
          BIN="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || true)"
          test -n "$BIN" || { echo "NOT_RUN: Chrome missing"; exit 1; }
          "$BIN" --version
          echo "CHROME_BIN=$BIN" >> "$GITHUB_ENV"
          BASE_PATH='' npm run dev -- --host 127.0.0.1 --port 4315 >/tmp/qrw801-fixed.log 2>&1 &
          for i in $(seq 1 75); do
            if curl -fsS http://127.0.0.1:4315/en/40006096/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/qrw801-fixed.log
          exit 1
      - name: Source6 and repaired2 pinned, synthetic failclosed plus Chrome OFF smoke
        env:
          QRW801_FIXED_ORIGIN: http://127.0.0.1:4315
        run: node scripts/04qr-w-pr801-repaired93ec-rasterstatus-newonly-20261108.mjs

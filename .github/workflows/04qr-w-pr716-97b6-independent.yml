name: "04 QR-W PR716 97b6 ancestry independent new-only"
on:
  pull_request:
    paths:
      - ".github/workflows/04qr-w-pr716-97b6-independent.yml"
      - "scripts/04qr-w-pr716-97b6-chrome.mjs"
      - "tests/04qr-w-pr716-97b6-independent.test.mjs"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  independent-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --no-audit --no-fund
      - name: Pin three owner Source blobs, reverse-order invalid ancestry and no mutation
        run: node --test tests/04qr-w-pr716-97b6-independent.test.mjs
  independent-chrome:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --no-audit --no-fund
      - name: Install actual Chromium with Native tab zoom API
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install chromium
      - name: Start synthetic only WEP World Editor
        shell: bash
        run: |
          set -euo pipefail
          BASE_PATH="" npm run dev -- --host 127.0.0.1 --port 4195 >/tmp/qr716-independent.log 2>&1 &
          for i in $(seq 1 75); do
            if curl -fsS http://127.0.0.1:4195/editor/world/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/qr716-independent.log
          exit 1
      - name: Independently assert untrusted second object excluded and atomic preview/MOVE at real tab zoom 100 and 200
        env:
          QR716_URL: http://127.0.0.1:4195/editor/world/
        run: node scripts/04qr-w-pr716-97b6-chrome.mjs

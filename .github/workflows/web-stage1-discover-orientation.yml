name: WEB Stage1 Discover the Wand seven-product orientation
on:
  push:
    branches:
      - 'web/stage1-discover-orientation-*'
  pull_request:
    paths:
      - 'src/routes/discover/+page.svelte'
      - 'src/lib/product-home/orientation-stage1-copy.mjs'
      - 'tests/web-stage1-discover-orientation.test.mjs'
      - 'scripts/web-stage1-discover-orientation-chrome.mjs'
      - '.github/workflows/web-stage1-discover-orientation.yml'
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - name: Exact latest-main five-file Discover UI scope; no Core, public Rights or Provider
        shell: bash
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha || '058ac652b06fdc62ff85559186375c5b7a1e62a4' }}"
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"
          git diff --name-only "$BASE" HEAD >/tmp/stage1-discover
          test "$(wc -l </tmp/stage1-discover)" -eq 5
          while IFS= read -r f; do
            case "$f" in
              src/routes/discover/+page.svelte|src/lib/product-home/orientation-stage1-copy.mjs|tests/web-stage1-discover-orientation.test.mjs|scripts/web-stage1-discover-orientation-chrome.mjs|.github/workflows/web-stage1-discover-orientation.yml) ;;
              *) echo "OUTSIDE_DISCOVER_SCOPE:$f"; exit 1 ;;
            esac
          done </tmp/stage1-discover
          git diff --exit-code "$BASE" HEAD -- src/routes/+page.svelte src/lib/product-home/copy.js src/lib/SiteHeader.svelte src/routes/help/ src/routes/guide/ src/lib/community/ src/lib/ddv/ src/lib/wep/ supabase/ static/ .github/workflows/pages.yml
          echo WEB_STAGE1_DISCOVER_FIVE_FILES_SCOPE_ONLY_PASS
      - name: Seven Product purposes and first steps across eight locales and optional Save/Account
        run: node --test tests/web-stage1-discover-orientation.test.mjs
      - name: Full Node, Svelte typecheck and static Pages
        env:
          BASE_PATH: /web
        run: |
          npm test
          npm run check
          npm run build
      - name: Orientation is a real static route without unauthorized public entity page
        shell: bash
        run: |
          test -f build/discover/index.html
          test -f build/rc-status/index.html
          test ! -f build/ja/entity/quest/12345/index.html
          echo WEB_STAGE1_DISCOVER_NO_UNVERIFIED_PUBLIC_ENTITY_PASS
  chrome:
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm install --no-save --package-lock=false playwright-core@1.55.0
      - name: Start disposable localhost Discover
        shell: bash
        env:
          BASE_PATH: /web
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
          npm run build
          BASE_PATH='' npm run dev -- --host 127.0.0.1 --port 4296 >/tmp/stage1-discover.log 2>&1 &
          for i in $(seq 1 75); do
            if curl -fsS http://127.0.0.1:4296/discover/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/stage1-discover.log
          exit 1
      - name: Actual Chromium all 8 locales×7 purposes, Help route, 320px, 200pct and no Provider
        env:
          STAGE1_DISCOVER_URL: http://127.0.0.1:4296
        run: node scripts/web-stage1-discover-orientation-chrome.mjs

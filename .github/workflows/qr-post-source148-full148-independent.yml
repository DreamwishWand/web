name: 04 QR Post-Source148 independently accepted private STAGED full148
on:
  push:
    branches: ['qr/post-source148-x05-independent-20261028']
  pull_request:
    branches: ['fix/03comm-x05-shared-metadata-staged-20261028']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  full148-source148-newonly:
    name: QR independent exact Source148 five fixes, two real local PostgreSQL backends
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_ACCESS_TOKEN: ''
      DATABASE_URL: ''
      DDVRE_PRIVACY_ISOLATED_LOCAL: CONFIRMED
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Frozen Owner HEAD/Source148 Blob and unchanged previous SQL/Edge
        run: |
          set -euo pipefail
          test -z "$DATABASE_URL" && test -z "$SUPABASE_ACCESS_TOKEN"
          git merge-base --is-ancestor 8d678b53275204fa964cfdbe3de74a61fee8cad0 HEAD
          test "$(git hash-object supabase/migrations/20261028000010_x05_post_event_staged_liveness_immutable_guard.sql)" = f6438fe596ed2eaca88bdb034173431f6bd511aa
          test "$(git hash-object supabase/migrations/20261028000000_x05_shared_dreamsnap_metadata_staged_v1.sql)" = 5c2b1b85b07821d7e60a84de40d933d59c4cc19d
          test -z "$(git diff --name-only 23a12dac9cbe11898ecc167977f71e4f6a090636 HEAD -- supabase/functions src)"
          # Exhaustive SQL ancestry: prior 147 source files must remain byte-identical.
          test "$(git diff --name-only 23a12dac9cbe11898ecc167977f71e4f6a090636 8d678b53275204fa964cfdbe3de74a61fee8cad0 -- supabase/migrations)" = "supabase/migrations/20261028000010_x05_post_event_staged_liveness_immutable_guard.sql"
          test -z "$(git diff --name-only 8d678b53275204fa964cfdbe3de74a61fee8cad0 HEAD -- supabase/migrations supabase/functions src)"
          python3 - <<'PY'
          from pathlib import Path
          paths=sorted(Path('supabase/migrations').glob('*.sql'))
          assert len(paths)==148,len(paths)
          assert len(set(p.name.split('_')[0] for p in paths))==148
          assert paths[-1].name=="20261028000010_x05_post_event_staged_liveness_immutable_guard.sql"
          edge=Path('supabase/functions/community-public-query/index.ts').read_text()
          assert 'dreamsnap_post_event_staged_v1' not in edge
          assert 'dreamsnap_shared_public_work_metadata_v1' not in edge
          print('QR148_EXACT_NEW_ONLY_SOURCE_BLOBS_AND_UNROUTED_PIN_PASS')
          PY
      - uses: supabase/setup-cli@v1
        with:
          version: 2.81.3
      - name: Create local disposable Supabase project with unique isolation ID
        run: |
          set -euo pipefail
          docker version
          printf 'project_id = "ddvre_qr148_independent_ephemeral_20261028"\n' | cat - supabase/config.toml >/tmp/qr148-config
          mv /tmp/qr148-config supabase/config.toml
          echo QR148_NO_LINK_NO_STAGE_NO_REMOTE_BACKEND
      - name: Apply all 148 genuine migration files on empty local PostgreSQL
        run: |
          set -euo pipefail
          timeout 1500s supabase start --debug >/tmp/qr148-local-bootstrap.log 2>&1 || { tail -65 /tmp/qr148-local-bootstrap.log; exit 1; }
          echo QR148_REAL_FULL148_EMPTY_LOCAL_DB_BOOTSTRAP_PASS
      - name: Install isolated PostgreSQL Python driver
        run: python3 -m pip install --quiet 'psycopg[binary]==3.2.10'
      - name: Distinct writer/reader actual PostgreSQL Source148 new-only regression
        run: |
          set -euo pipefail
          python3 tests/qr-post-source148-x05-full148-independent.py 2>&1 | tee /tmp/qr148-real-local-proof.log
          grep -q QR148_FOUR_OLD_QR239_INSERT_AND_UPDATE_REDS_CLOSED /tmp/qr148-real-local-proof.log
          grep -q QR148_OLD_IMMUTABLE_PHOTO_MEDIA_RED_CLOSED /tmp/qr148-real-local-proof.log
          grep -q QR148_LEGAL_PRIVATE_STAGED_NO_OVERDENY_FULL148_PASS /tmp/qr148-real-local-proof.log
          grep -q QR148_INDEPENDENT_FULL148_PRIVATE_SOURCE_LOCAL_PASS /tmp/qr148-real-local-proof.log
      - name: Retain synthetic-only local SQL evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qr-post-source148-real-full148-local-2pg
          path: /tmp/qr148-real-local-proof.log
          if-no-files-found: warn
      - name: Local bootstrap-only diagnostic on failure
        if: failure()
        run: tail -75 /tmp/qr148-local-bootstrap.log || true

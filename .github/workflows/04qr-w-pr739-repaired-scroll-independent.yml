name: "04 QR-W PR739 new-head scroll instant independent changed-only"
on:
  pull_request:
    paths:
      - ".github/workflows/04qr-w-pr739-repaired-scroll-independent.yml"
      - "tests/04qr-w-pr739-repaired-scroll-independent.test.mjs"
      - "scripts/04qr-w-pr739-repaired-scroll-chrome.mjs"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  independent-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Strict Source new head Git blob pins, exactly changed3 since accepted QA740 and instant scroll negative
        run: node --test tests/04qr-w-pr739-repaired-scroll-independent.test.mjs
  independent-chrome:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --no-audit --no-fund
      - run: npm install --no-save --package-lock=false playwright-core@1.55.0
      - name: Boot localhost Collection with fake public Catalog only
        shell: bash
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
          BASE_PATH="" npm run dev -- --host 127.0.0.1 --port 4298 >/tmp/qr739r-collection.log 2>&1 &
          for i in $(seq 1 75); do
            if curl -fsS http://127.0.0.1:4298/collection/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/qr739r-collection.log
          exit 1
      - name: Actual Chrome forced focus-to-click delta and pre-close gap; click-time instant restoration never delayed
        env:
          QR739R_URL: http://127.0.0.1:4298
        run: node scripts/04qr-w-pr739-repaired-scroll-chrome.mjs

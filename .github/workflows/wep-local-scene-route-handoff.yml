name: WEP F-P04 selected local Scene route receiver
on:
  pull_request:
    paths:
      - 'src/lib/wep/local-scene-route-handoff.mjs'
      - 'src/routes/editor/world/+page.svelte'
      - 'tests/wep-local-scene-route-handoff.test.mjs'
      - 'scripts/wep-local-scene-route-handoff-chrome.mjs'
      - '.github/workflows/wep-local-scene-route-handoff.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  selected-route-readonly:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - name: F-P04 route hint one-shot sender contract and negative tests
        run: node --test tests/wep-local-scene-route-handoff.test.mjs
      - name: Svelte check and /web build
        env:
          BASE_PATH: /web
        run: |
          npm run check
          npm run build
      - run: npm install --no-save --package-lock=false playwright-core@1.55.0
      - name: Real installed Chrome, disposable synthetic Scene, no Private Save
        shell: bash
        run: |
          set -euo pipefail
          test -z "${WEP_PRIVATE_P1G_PATH:-}"
          test -z "${DDV_PRIVATE_SAVE_PATH:-}"
          BIN="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || true)"
          test -n "$BIN"
          "$BIN" --version
          export CHROME_BIN="$BIN"
          BASE_PATH='' npm run dev -- --host 127.0.0.1 --port 4353 >/tmp/wep-scene-route-handoff.log 2>&1 &
          for i in $(seq 1 75); do
            if curl -fsS http://127.0.0.1:4353/editor/world/ >/dev/null; then break; fi
            sleep 1
          done
          node scripts/wep-local-scene-route-handoff-chrome.mjs

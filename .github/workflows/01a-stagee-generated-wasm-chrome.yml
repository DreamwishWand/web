name: 01A Stage E Genuine Generated Rust WASM Chrome Worker (Writer OFF)
on:
  pull_request:
    paths:
      - 'tests/stage-e/**'
      - 'scripts/wasm-distribution/**'
      - 'src/lib/ddv/core/save/product-rust-wasm-candidate-loader.mjs'
      - '.github/workflows/01a-stagee-generated-wasm-chrome.yml'
      - 'crates/ddv-save-core/**'
      - 'src/lib/ddv/core/save/product-wasm-read-owner.mjs'
  push:
    branches:
      - 'core/real-wasm-browser-smoke-stagee-*'
permissions:
  contents: read
jobs:
  genuine-wasm-chrome-worker:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_TARGET_DIR: /tmp/wand-stagee-cargo-target
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Verify real Chrome and exact pinned wasm-bindgen crate
        run: |
          set -euo pipefail
          command -v google-chrome || command -v chromium
          grep -Fx 'wasm-bindgen = { version = "=0.2.105", optional = true }' crates/ddv-save-core/Cargo.toml
          grep -Fx 'worker-wasm = ["dep:wasm-bindgen"]' crates/ddv-save-core/Cargo.toml
          grep -Fx 'indexed-read = []' crates/ddv-save-core/Cargo.toml
      - name: Compile REAL cdylib with opt-in Worker and indexed metadata
        run: |
          cargo build --manifest-path crates/ddv-save-core/Cargo.toml --release --target wasm32-unknown-unknown --features worker-wasm,indexed-read
          test -s "$CARGO_TARGET_DIR/wasm32-unknown-unknown/release/ddv_save_core.wasm"
      - name: Install exactly matching wasm-bindgen CLI 0.2.105 (not generated or mocked JS)
        run: |
          cargo install wasm-bindgen-cli --version 0.2.105 --locked --root /tmp/wand-stagee-wasm-tools
          /tmp/wand-stagee-wasm-tools/bin/wasm-bindgen --version | grep -F '0.2.105'
      - name: Generate true wasm-bindgen Browser Worker ESM glue
        run: |
          mkdir -p tests/stage-e/pkg
          /tmp/wand-stagee-wasm-tools/bin/wasm-bindgen "$CARGO_TARGET_DIR/wasm32-unknown-unknown/release/ddv_save_core.wasm" --out-dir tests/stage-e/pkg --target web --no-typescript
          test -s tests/stage-e/pkg/ddv_save_core.js
          test -s tests/stage-e/pkg/ddv_save_core_bg.wasm
          ! grep -R -E 'STEAM_SAVE_OWNER_PRIVATE|include_bytes!|writerAuthorized: *true|applyAuthorized: *true' tests/stage-e
      - name: Actual browser CDP + module Worker + Rust WASM positive and negatives
        run: node tests/stage-e/chrome-smoke.mjs
      - name: Confirm Stage E never changed product Writer or public worker route
        run: |
          ! git diff --name-only "$GITHUB_BASE_REF" 2>/dev/null | grep -E 'local-timing-read.worker|community|provider|p1g' || true
          test -f src/lib/ddv/core/save/product-wasm-read-owner.mjs
          test -f crates/ddv-save-core/src/wasm_worker.rs

      - name: QA ONLY ACT1170 dual Build Wardrobe exact1
        run: |
          set -euo pipefail
          B=/tmp/wand-stagee-wasm-tools/bin/wasm-bindgen
          W="$CARGO_TARGET_DIR/wasm32-unknown-unknown/release/ddv_save_core.wasm"
          "$B" "$W" --out-dir /tmp/wr-off --target nodejs --no-typescript
          cargo build --locked --manifest-path crates/ddv-save-core/Cargo.toml --release --target wasm32-unknown-unknown --no-default-features --features worker-wasm,product-wardrobe-scoped,product-collection-scoped
          "$B" "$W" --out-dir /tmp/wr-on --target nodejs --no-typescript
          node <<'JS'
          const assert=require('node:assert/strict'),fs=require('node:fs'),{createHash}=require('node:crypto');
          const C=require('/tmp/wr-on/ddv_save_core.js').WorkerWasmSource,O=require('/tmp/wr-off/ddv_save_core.js').WorkerWasmSource;
          const builds=[['steam-windows','steam-full-version','releases_1.25-v1.25.3-44-g0b41250d9ac0-incremental-22',626,true],['switch','switch-bid','9A239D3DB569756D',626,true]],names=['steam626','switch626'],old=50000352,newId=50000214;
          const sha=b=>createHash('sha256').update(b).digest('hex'),raw=d=>Buffer.from(JSON.stringify(d,null,2));
          const pack=fs.readFileSync('crates/ddv-save-core/data/wardrobe-clothing-compat-v1.json');assert.equal(sha(pack),'9bcf2cf489238074df8ea0b385a6675c8efcd51bb009cac37d8e107ec1a5d0b2');
          const rows=JSON.parse(pack).rows, map=new Map(rows.map(x=>[x[0],x]));assert.equal(map.size,1898);
          const conflict=(a,b)=>{const x=map.get(a),y=map.get(b);return !!(x[3]&(1<<y[2]))||x[4].includes(b)||(x[2]===9&&[0,1,7,15].includes(y[2]))||(y[2]===9&&[0,1,7,15].includes(x[2]));};
          const bottom=rows.find(x=>x[2]===1&&!conflict(old,x[0])&&!conflict(x[0],old)&&!conflict(newId,x[0])&&!conflict(x[0],newId))[0];
          const stock=n=>({Amount:n,Marker:'ItemMarker_None'}),avatar=()=>({Clothes:{},IncompatibleClothes:{},ClothingCustomization:{},Makeup:{}});
          function doc(){const m=avatar();m.Clothes={0:old,1:bottom};return {GameInfo:{Version:626},ConditionalEventHistory:{ActiveEvents:{}},World:{Unknown:{keep:1}},Player:{AvatarIsMale:true,FemaleAvatar:avatar(),MaleAvatar:m,MaleClothingDesigns:[],FemaleClothingDesigns:[],OutfitPresets:[],ListInventories:{1:{ID:1,CompatibleItemType:'ItemType_Clothing',Inventory:{[old]:stock(8),[newId]:stock(9),[bottom]:stock(1)}},3:{ID:3,CompatibleItemType:'ItemType_Makeup',Inventory:{}}},CollectionSets:[{CollectionDefinitionID:2120000001,GroupData:[{GroupsCollectionItems:{[old]:true,[newId]:true}}]}]},Opaque:{escaped:'\\u0000',pad:'x'.repeat(1100000)}}}
          let nonce=0,pos=0,neg=0,red=[];
          function open(d,b){const w=new C(...b,new Uint8Array(32).fill(++nonce)),x=raw(d);for(let i=0;i<x.length;i+=1048576)w.append_chunk(x.subarray(i,i+1048576));const r=JSON.parse(w.finish());assert.equal(r.decodedSha256,sha(x));return [w,r]}
          const sc=r=>[r.sessionId,BigInt(r.revision),BigInt(r.indexGeneration),r.decodedSha256],parse=JSON.parse;
          const pv=(w,r,i)=>parse(w['preview_'+names[i]+'_wardrobe'](...sc(r))),st=(w,r,i,p,a=old,b=newId)=>parse(w['stage_'+names[i]+'_wardrobe'](a,b,p.witnessSha256,p.projectedDecodedSha256,...sc(r)));
          const deny=f=>{assert.throws(f);neg++};
          for(const n of names){assert.equal(typeof O.prototype['preview_'+n+'_wardrobe'],'undefined');assert.equal(typeof O.prototype['stage_'+n+'_wardrobe'],'undefined');}
          for(let i=0;i<2;i++){const d=doc(),[w,r]=open(d,builds[i]),p=pv(w,r,i),want=structuredClone(d);want.Player.MaleAvatar.Clothes[0]=newId;assert.equal(p.projectedDecodedSha256,sha(raw(want)));assert.equal(p.writerAuthorized,false);assert.equal(p.definitionPackSha256,sha(pack));deny(()=>pv(w,r,1-i));deny(()=>st(w,r,i,p,newId,old));deny(()=>st(w,r,i,{...p,witnessSha256:'0'.repeat(64)}));deny(()=>st(w,r,i,{...p,projectedDecodedSha256:'1'.repeat(64)}));const [other,rr]=open(d,builds[i]);deny(()=>st(other,rr,i,p));other.close();other.free();const t=st(w,r,i,p);assert.equal(t.exactFieldChangedCount,1);assert.equal(t.stagedDecodedSha256,sha(raw(want)));deny(()=>st(w,r,i,p));const u=parse(w.toggle_scoped_edit(false,...sc(t)));deny(()=>w.begin_scoped_edit_output(...sc(u)));const v=parse(w.toggle_scoped_edit(true,...sc(u)));w.begin_scoped_edit_output(...sc(v));assert.deepEqual(Buffer.concat([Buffer.from(w.next_scoped_edit_output_chunk()),Buffer.from(w.next_scoped_edit_output_chunk())]),raw(want));deny(()=>w.next_scoped_edit_output_chunk());w.close();w.free();pos++;}
          const p=d=>d.Player,m=d=>p(d).MaleAvatar,inv=d=>p(d).ListInventories[1].Inventory;
          const cases=[['female',d=>p(d).AvatarIsMale=false],['new-unowned',d=>inv(d)[newId].Amount=0],['old-unowned',d=>inv(d)[old].Amount=0],['old-marker',d=>inv(d)[old].Marker='Unknown'],['wrong-slot',d=>m(d).Clothes[0]=newId],['unknown-retained',d=>m(d).Clothes[1]=59999999],['excluded-retained',d=>m(d).Clothes[1]=50800150],['inadequate',d=>delete m(d).Clothes[1]],['wrong-map-slot',d=>m(d).Clothes[2]=bottom],['overlap',d=>m(d).IncompatibleClothes[0]=newId],['preset',d=>p(d).OutfitPresets=[{}]],['design',d=>p(d).MaleClothingDesigns=[{}]],['unknown-item-ref',d=>d.World.Unknown={ItemID:newId}],['unknown-item-key',d=>d.Opaque[newId]=true],['female-old-ref',d=>p(d).FemaleAvatar.Clothes[0]=old],['collection-string',d=>p(d).CollectionSets[0].GroupData[0].GroupsCollectionItems[old]='true'],['unknown-event',d=>d.ConditionalEventHistory.ActiveEvents[1]={Unknown:{}}]];
          for(let i=0;i<2;i++){const [w0,r0]=open(doc(),builds[i]),proof=pv(w0,r0,i);w0.close();w0.free();for(const [label,mut] of cases){const d=doc();d.Opaque={};mut(d);let w;try{let r;[w,r]=open(d,builds[i]);let a=false,b=false;try{pv(w,r,i);a=true}catch{}try{st(w,r,i,proof);b=true}catch{}if(a||b)red.push({i,label,a,b});else neg++;}catch(e){red.push({i,label,error:String(e)})}finally{if(w){w.close();w.free();}}}}
          console.log('ACT1170_WARDROBE_PRODUCT '+pos+'POS '+neg+'NEG RED='+JSON.stringify(red));assert.equal(pos,2);assert.equal(neg,50);assert.deepEqual(red,[]);
          JS

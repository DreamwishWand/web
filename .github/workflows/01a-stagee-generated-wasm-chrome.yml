          for(const c of configs){const C=cls(c.mode),m=Object.getOwnPropertyNames(C.prototype).filter(n=>!['constructor','free','__destroy_into_raw'].includes(n)).sort(),x=expected(c.expect).slice().sort(),bin=fs.readFileSync('/tmp/cumulative-'+c.mode+'/ddv_save_core_bg.wasm'),ex=WebAssembly.Module.exports(new WebAssembly.Module(bin)).map(x=>x.name);assert.deepEqual(m,x,c.mode);assert.equal(ex.length,x.length+9,c.mode);for(const n of x)assert.ok(ex.includes('workerwasmsource_'+n),c.mode+':'+n);console.log('QRC1573_CENSUS '+c.mode+' '+m.length+'/'+ex.length+' '+sha(bin));}

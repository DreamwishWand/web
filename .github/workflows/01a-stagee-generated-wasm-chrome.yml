name: 01A Stage E Genuine Generated Rust WASM Chrome Worker (Writer OFF)
on:
  pull_request:
    paths:
      - '.github/workflows/01a-stagee-generated-wasm-chrome.yml'
permissions:
  contents: read
jobs:
  genuine-wasm-chrome-worker:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_TARGET_DIR: /tmp/wand-stagee-cargo-target
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: QA ONLY FD01 generated ABI
        run: |
          set -euo pipefail
          cargo generate-lockfile --manifest-path crates/ddv-save-core/Cargo.toml
          sha256sum crates/ddv-save-core/Cargo.lock | tee /tmp/qrc-lock.sha
          cargo test --locked --manifest-path crates/ddv-save-core/Cargo.toml --features product-switch626-fd01-scoped --lib qa1837_synthetic_fixture
          cargo install wasm-bindgen-cli --version 0.2.105 --locked --root /tmp/wand-stagee-wasm-tools
          for m in off own collection steamchest switchchest comp spatial sr03 rm; do
            case "$m" in
              off) f=indexed-read ;;
              own) f=product-switch626-fd01-scoped ;;
              collection) f=product-switch626-fd01-scoped,product-collection-scoped ;;
              steamchest) f=product-switch626-fd01-scoped,product-steam626-chest-scoped ;;
              switchchest) f=product-switch626-fd01-scoped,product-switch626-chest-scoped ;;
              comp) f=product-switch626-fd01-scoped,product-steam626-comp03-scoped ;;
              spatial) f=product-switch626-fd01-scoped,product-steam626-comp03-spatial-preview ;;
              sr03) f=product-switch626-fd01-scoped,product-steam626-sr03-scoped ;;
              rm) f=product-switch626-fd01-scoped,product-switch626-rm01-scoped ;;
            esac
            cargo build --locked --manifest-path crates/ddv-save-core/Cargo.toml --release --target wasm32-unknown-unknown --no-default-features --features "worker-wasm,$f"
            /tmp/wand-stagee-wasm-tools/bin/wasm-bindgen "$CARGO_TARGET_DIR/wasm32-unknown-unknown/release/ddv_save_core.wasm" --out-dir "/tmp/fm-$m" --target nodejs --no-typescript
          done
          sha256sum -c /tmp/qrc-lock.sha
          node --input-type=commonjs <<'JS'
          const assert=require('node:assert/strict'),fs=require('node:fs'),{createHash}=require('node:crypto');
          const sha=b=>createHash('sha256').update(b).digest('hex'),cls=m=>require('/tmp/fm-'+m+'/ddv_save_core.js').WorkerWasmSource;
          const readers=['append_chunk','finish','read_core_version_witness','issue_typed_cursor','read_typed_page','issue_saved_diffgrids_typed_cursor','read_saved_diffgrids_typed_page','close'],names=['preview_switch626_fd01','stage_switch626_fd01','toggle_switch626_fd01','begin_switch626_fd01_output','next_switch626_fd01_output_chunk'];
          for(const m of ['off','own','collection','steamchest','switchchest','comp','spatial','sr03','rm']){const n=Object.getOwnPropertyNames(cls(m).prototype).filter(k=>!['constructor','free','__destroy_into_raw'].includes(k)).sort(),b=fs.readFileSync('/tmp/fm-'+m+'/ddv_save_core_bg.wasm'),ex=WebAssembly.Module.exports(new WebAssembly.Module(b)).map(x=>x.name);assert.deepEqual(n,[...readers,...(m==='own'?names:[])].sort(),m);assert.equal(ex.length,n.length+9);for(const k of n)assert.ok(ex.includes('workerwasmsource_'+k));console.log('QRC1837_CENSUS '+m+' '+n.length+'/'+ex.length+' '+sha(b));}
          const raw=fs.readFileSync('/tmp/qrc1837-input.json'),d=JSON.parse(raw),[x,y]=JSON.parse(fs.readFileSync('/tmp/qrc1837-xy.json')),g=d.World.GridCollection.Grids[90001],ids=new Uint32Array([10,11,12,13]);
          const hash=v=>sha(Buffer.from(JSON.stringify(v))),rows='',expected=structuredClone(d),eg=expected.World.GridCollection.Grids[90001];
          eg.NextGridObjectID=53;
          const rec=(ID,ItemID,X,Y,left,diag)=>({ID,ItemID,Orientation:left?'GridOrientation_Left':'GridOrientation_Down',State:diag?{FenceMode:{Diagonal:true}}:null,X,Y});
          for(let k=0;k<3;k++)eg.Objects[50+k]=rec(50+k,k===1?40700253:40700246,x+2*k,y+2*k,false,true);
          const outExpected=Buffer.from(JSON.stringify(expected).replace('"escaped":"keep"','"escaped":"\\u006beep"'));
          const sw=['switch','switch-bid','9A239D3DB569756D',626,true],steam=['steam-windows','steam-full-version','releases_1.25-v1.25.3-44-g0b41250d9ac0-incremental-22',626,true];let nonce=0,neg=0;
          function open(b=sw){const w=new(cls('own'))(...b,new Uint8Array(32).fill(++nonce));w.append_chunk(raw);return[w,JSON.parse(w.finish())]}
          const sc=r=>[r.sessionId,BigInt(r.revision),BigInt(r.indexGeneration),r.decodedSha256],deny=f=>{assert.throws(f);neg++},[w,r]=open(),p=JSON.parse(w.preview_switch626_fd01(90001,x,y,...sc(r)));
          assert.equal(p.projectedDecodedSha256,sha(outExpected));assert.equal(p.exactFieldChangedCount,4);assert.equal(p.inventoryDelta,0);
          const args=[90001,x,y,50,hash(d.World.Villages[0].Areas[2]),hash(g),sha(Buffer.from('50')),sha(Buffer.from('[]')),10,hash(d.Player.ListInventories[0].Inventory[40700246]),sha(outExpected)];
          const st=(a=args,r0=r,w0=w)=>JSON.parse(w0.stage_switch626_fd01(...a,...sc(r0)));
          deny(()=>w.preview_switch626_fd01(90001,x+1,y,...sc(r)));deny(()=>w.preview_switch626_fd01(90001,x,y+1,...sc(r)));
          for(const i of [4,5,6,7,9,10]){const a=args.slice();a[i]='0'.repeat(64);deny(()=>st(a));}
          for(const i of [3,8]){const a=args.slice();a[i]++;deny(()=>st(a));}
          deny(()=>st(args,{...r,revision:1}));deny(()=>st(args,{...r,indexGeneration:2}));deny(()=>st(args,{...r,decodedSha256:'0'.repeat(64)}));
          const [f,fr]=open();deny(()=>st(args,r,f));f.close();f.free();const [z,zr]=open(steam);deny(()=>z.preview_switch626_fd01(90001,x,y,...sc(zr)));z.close();z.free();
          deny(()=>w.begin_switch626_fd01_output(...sc(r)));const t=st();assert.equal(t.exactFieldChangedCount,4);assert.equal(t.stagedDecodedSha256,sha(outExpected));deny(()=>st());const u=JSON.parse(w.toggle_switch626_fd01(false,...sc(t)));deny(()=>w.begin_switch626_fd01_output(...sc(u)));const v=JSON.parse(w.toggle_switch626_fd01(true,...sc(u)));w.begin_switch626_fd01_output(...sc(v));const out=Buffer.from(w.next_switch626_fd01_output_chunk());assert.deepEqual(out,outExpected);deny(()=>w.next_switch626_fd01_output_chunk());w.close();w.free();

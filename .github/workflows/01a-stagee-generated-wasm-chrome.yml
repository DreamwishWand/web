          assert.equal(p.contract,'wand.worker.switch626.'+op+'-portable-restore@1');assert.equal(p.oldAmount,old);assert.equal(p.newAmount,next);assert.equal(p.backupSha256,sha(backup));assert.equal(p.entrySha256,sha(Buffer.from(JSON.stringify(entry(d)))));assert.equal(p.projectedSha256,sha(raw(prior)));assert.equal(p.writerAuthorized,false);

name: 01A Stage E Genuine Generated Rust WASM Chrome Worker (Writer OFF)
on:
  pull_request:
    paths:
      - '.github/workflows/01a-stagee-generated-wasm-chrome.yml'
permissions:
  contents: read
jobs:
  genuine-wasm-chrome-worker:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_TARGET_DIR: /tmp/wand-stagee-cargo-target
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: QA ONLY five generated fixed Fence ABI
        run: |
          set -euo pipefail
          cargo generate-lockfile --manifest-path crates/ddv-save-core/Cargo.toml
          sha256sum crates/ddv-save-core/Cargo.lock | tee /tmp/qrc-lock.sha
          cargo test --locked --manifest-path crates/ddv-save-core/Cargo.toml --features product-switch626-fence-add-stage-internal --lib qa1888_current_five_fixtures
          cargo install wasm-bindgen-cli --version 0.2.105 --locked --root /tmp/wand-stagee-wasm-tools
          for m in off fd02 fd03 ortho_l diagonal90 ortho_t internal all fd02_rm fd03_rm ortho_l_rm diagonal90_rm ortho_t_rm fd02_collection fd03_collection ortho_l_collection diagonal90_collection ortho_t_collection fd01 fe01 hair skin fd02_fd01 fd02_fe01 fd02_hair fd03_fd01 fd03_fe01 fd03_hair ortho_l_fd01 ortho_l_fe01 ortho_l_hair diagonal90_fd01 diagonal90_fe01 diagonal90_hair ortho_t_fd01 ortho_t_fe01 ortho_t_hair; do
            case "$m" in
              off) f=indexed-read ;;
              fd02) f=product-switch626-fd02-scoped ;;
              fd03) f=product-switch626-fd03-scoped ;;
              ortho_l) f=product-switch626-ortho-l-scoped ;;
              diagonal90) f=product-switch626-diagonal90-scoped ;;
              ortho_t) f=product-switch626-ortho-t-scoped ;;
              internal) f=product-switch626-fence-add-stage-internal ;;
              all) f=product-switch626-fd02-scoped,product-switch626-fd03-scoped,product-switch626-ortho-l-scoped,product-switch626-diagonal90-scoped,product-switch626-ortho-t-scoped ;;
              fd02_rm) f=product-switch626-fd02-scoped,product-switch626-rm01-scoped ;;
              fd03_rm) f=product-switch626-fd03-scoped,product-switch626-rm01-scoped ;;
              ortho_l_rm) f=product-switch626-ortho-l-scoped,product-switch626-rm01-scoped ;;
              diagonal90_rm) f=product-switch626-diagonal90-scoped,product-switch626-rm01-scoped ;;
              ortho_t_rm) f=product-switch626-ortho-t-scoped,product-switch626-rm01-scoped ;;
              fd02_collection) f=product-switch626-fd02-scoped,product-collection-scoped ;;
              fd03_collection) f=product-switch626-fd03-scoped,product-collection-scoped ;;
              ortho_l_collection) f=product-switch626-ortho-l-scoped,product-collection-scoped ;;
              diagonal90_collection) f=product-switch626-diagonal90-scoped,product-collection-scoped ;;
              ortho_t_collection) f=product-switch626-ortho-t-scoped,product-collection-scoped ;;
              fd01) f=product-switch626-fd01-scoped ;;
              fe01) f=product-switch626-fe01-scoped ;;
              hair) f=product-steam626-hair-scoped ;;
              skin) f=product-steam626-skin-scoped ;;
              fd02_fd01) f=product-switch626-fd02-scoped,product-switch626-fd01-scoped ;;
              fd02_fe01) f=product-switch626-fd02-scoped,product-switch626-fe01-scoped ;;
              fd02_hair) f=product-switch626-fd02-scoped,product-steam626-hair-scoped ;;
              fd03_fd01) f=product-switch626-fd03-scoped,product-switch626-fd01-scoped ;;
              fd03_fe01) f=product-switch626-fd03-scoped,product-switch626-fe01-scoped ;;
              fd03_hair) f=product-switch626-fd03-scoped,product-steam626-hair-scoped ;;
              ortho_l_fd01) f=product-switch626-ortho-l-scoped,product-switch626-fd01-scoped ;;
              ortho_l_fe01) f=product-switch626-ortho-l-scoped,product-switch626-fe01-scoped ;;
              ortho_l_hair) f=product-switch626-ortho-l-scoped,product-steam626-hair-scoped ;;
              diagonal90_fd01) f=product-switch626-diagonal90-scoped,product-switch626-fd01-scoped ;;
              diagonal90_fe01) f=product-switch626-diagonal90-scoped,product-switch626-fe01-scoped ;;
              diagonal90_hair) f=product-switch626-diagonal90-scoped,product-steam626-hair-scoped ;;
              ortho_t_fd01) f=product-switch626-ortho-t-scoped,product-switch626-fd01-scoped ;;
              ortho_t_fe01) f=product-switch626-ortho-t-scoped,product-switch626-fe01-scoped ;;
              ortho_t_hair) f=product-switch626-ortho-t-scoped,product-steam626-hair-scoped ;;
            esac
            cargo build --locked --manifest-path crates/ddv-save-core/Cargo.toml --release --target wasm32-unknown-unknown --no-default-features --features "worker-wasm,$f"
            /tmp/wand-stagee-wasm-tools/bin/wasm-bindgen "$CARGO_TARGET_DIR/wasm32-unknown-unknown/release/ddv_save_core.wasm" --out-dir "/tmp/fence-$m" --target nodejs --no-typescript

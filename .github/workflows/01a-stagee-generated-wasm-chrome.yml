name: 01A Stage E Genuine Generated Rust WASM Chrome Worker (Writer OFF)
on:
  pull_request:
    paths:
      - 'tests/stage-e/**'
      - 'scripts/wasm-distribution/**'
      - 'src/lib/ddv/core/save/product-rust-wasm-candidate-loader.mjs'
      - '.github/workflows/01a-stagee-generated-wasm-chrome.yml'
      - 'crates/ddv-save-core/**'
      - 'src/lib/ddv/core/save/product-wasm-read-owner.mjs'
  push:
    branches:
      - 'core/real-wasm-browser-smoke-stagee-*'
permissions:
  contents: read
jobs:
  genuine-wasm-chrome-worker:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_TARGET_DIR: /tmp/wand-stagee-cargo-target
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Verify real Chrome and exact pinned wasm-bindgen crate
        run: |
          set -euo pipefail
          command -v google-chrome || command -v chromium
          grep -Fx 'wasm-bindgen = { version = "=0.2.105", optional = true }' crates/ddv-save-core/Cargo.toml
          grep -Fx 'worker-wasm = ["dep:wasm-bindgen"]' crates/ddv-save-core/Cargo.toml
          grep -Fx 'indexed-read = []' crates/ddv-save-core/Cargo.toml
      - name: Compile REAL cdylib with opt-in Worker and indexed metadata
        run: |
          cargo build --manifest-path crates/ddv-save-core/Cargo.toml --release --target wasm32-unknown-unknown --features worker-wasm,indexed-read
          test -s "$CARGO_TARGET_DIR/wasm32-unknown-unknown/release/ddv_save_core.wasm"
      - name: Install exactly matching wasm-bindgen CLI 0.2.105 (not generated or mocked JS)
        run: |
          cargo install wasm-bindgen-cli --version 0.2.105 --locked --root /tmp/wand-stagee-wasm-tools
          /tmp/wand-stagee-wasm-tools/bin/wasm-bindgen --version | grep -F '0.2.105'
      - name: Generate true wasm-bindgen Browser Worker ESM glue
        run: |
          mkdir -p tests/stage-e/pkg
          /tmp/wand-stagee-wasm-tools/bin/wasm-bindgen "$CARGO_TARGET_DIR/wasm32-unknown-unknown/release/ddv_save_core.wasm" --out-dir tests/stage-e/pkg --target web --no-typescript
          test -s tests/stage-e/pkg/ddv_save_core.js
          test -s tests/stage-e/pkg/ddv_save_core_bg.wasm
          ! grep -R -E 'STEAM_SAVE_OWNER_PRIVATE|include_bytes!|writerAuthorized: *true|applyAuthorized: *true' tests/stage-e
      - name: Actual browser CDP + module Worker + Rust WASM positive and negatives
        run: node tests/stage-e/chrome-smoke.mjs
      - name: Confirm Stage E never changed product Writer or public worker route
        run: |
          ! git diff --name-only "$GITHUB_BASE_REF" 2>/dev/null | grep -E 'local-timing-read.worker|community|provider|p1g' || true
          test -f src/lib/ddv/core/save/product-wasm-read-owner.mjs
          test -f crates/ddv-save-core/src/wasm_worker.rs

      - name: QA ONLY ACT1097 changed Steam Chest static provider
        run: |
          set -euo pipefail
          B=/tmp/wand-stagee-wasm-tools/bin/wasm-bindgen
          W="$CARGO_TARGET_DIR/wasm32-unknown-unknown/release/ddv_save_core.wasm"
          "$B" "$W" --out-dir /tmp/chest-off --target nodejs --no-typescript
          for mode in amount both; do
            features=worker-wasm,product-amount-scoped
            if [ "$mode" = both ]; then features="$features,product-collection-scoped"; fi
            cargo build --locked --manifest-path crates/ddv-save-core/Cargo.toml --release --target wasm32-unknown-unknown --no-default-features --features "$features"
            "$B" "$W" --out-dir "/tmp/chest-$mode" --target nodejs --no-typescript
          done
          node --input-type=commonjs <<'JS'
          const assert=require('node:assert/strict'),{createHash}=require('node:crypto'),fs=require('node:fs');
          const cls=m=>require('/tmp/chest-'+m+'/ddv_save_core.js').WorkerWasmSource;
          const sw=['switch','switch-bid','9A239D3DB569756D',626,true],steam=['steam-windows','steam-full-version','releases_1.25-v1.25.3-44-g0b41250d9ac0-incremental-22',626,true];
          const sha=b=>createHash('sha256').update(b).digest('hex'),enc=d=>Buffer.from(JSON.stringify(d,null,2));
          const lines=fs.readFileSync('crates/ddv-save-core/data/steam626-amount-layout-reference.jsonl','utf8').trim().split('\n').slice(1).map(JSON.parse);
          const a=lines.find(x=>!x[0].includes('OogieBoogieHouse')&&x[4].every(g=>g[2].length===0)),ex=lines.find(x=>x[0].includes('OogieBoogieHouse'));
          const overlay=x=>({ID:19,GridDefaultLayoutPath:x[0],GridDefaultLayoutType:x[1],DefaultLayoutGridID:x[4][0][0],DefaultGridHashCode:-4,DefaultGridDataHashCode:6,ModifiedObjects:{},RemovedObjects:[]});
          function doc(){const slots=Array.from({length:48},()=>({ItemID:0,Amount:0,State:null}));slots[0]={ItemID:30200000,Amount:50,State:null,Unknown:7};return {GameInfo:{Version:626},ConditionalEventHistory:{ActiveEvents:{}},World:{GridCollection:{Grids:{7:{ID:7,GridDefaultLayoutPath:'',Objects:{4:{ID:4,ItemID:40001680,State:{Storage:{ContainerInventoryID:12,DefaultContainerInventoryData:'',UnlockKeyItemID:0,UnlockLocId:'',DesignID:null}}}}}},DiffGrids:{19:overlay(a)}},MissionSlots:{},Villages:[{Areas:{2:{GridIDs:[7],Unlocked:true}}}]},Player:{ListInventories:{0:{ID:0,CompatibleItemType:'ItemType_Furniture',CompatibleFurnitureTypes:{List:['FurnitureItemType_Default']},Inventory:{40000048:{Amount:3,Marker:'ItemMarker_None'}}},2:{ID:2,CompatibleItemType:'ItemType_ActivityItem',Inventory:{30200000:{Amount:2}}}},ContainerInventories:{0:{ID:0,BelongsToPlayer:true,Size:1,ExtraSize:0,Inventory:[{ItemID:30200000,Amount:5,State:{}}]},1:{ID:1,BelongsToPlayer:true,Size:1,ExtraSize:0,Inventory:[{ItemID:0,Amount:0,State:null}]},12:{ID:12,ParentItemID:40001680,BelongsToPlayer:true,BlockMoveTo:false,Size:48,ExtraSize:0,Inventory:slots}},BackpackOverflow:{Items:[]},AchievementsData:[],EvolveStatesProfile:{EvolveProgressState:{}},DutySlots:{},BattlePassStates:{Progress:{},FtueProgress:{TasksProgress:[],WeeklyTasksProgress:[]}}},Opaque:{keep:'x'.repeat(1100000),n:7}};}
          let nonce=0,pos=0,neg=0;const deny=f=>{assert.throws(f);neg++};
          function open(m,d,b=steam){const raw=enc(d),w=new (cls(m))(...b,new Uint8Array(32).fill(++nonce));for(let i=0;i<raw.length;i+=1048576)w.append_chunk(raw.subarray(i,i+1048576));const r=JSON.parse(w.finish());assert.equal(r.decodedSha256,sha(raw));return [w,r]}
          const sc=r=>[r.sessionId,BigInt(r.revision),BigInt(r.indexGeneration),r.decodedSha256],parse=JSON.parse;

          const profile='linked-crop-chest48';
          const preview=(w,r,n=49,id=12,slot=0)=>parse(w.preview_scoped_amount(profile,id,slot,n,...sc(r)));
          const stage=(w,r,h,old=50,n=49)=>parse(w.stage_scoped_amount(profile,12,0,old,n,h,...sc(r)));
          for(const [m,asset] of [['amount',a],['both',ex]]){
            const d=doc();d.World.GridCollection.DiffGrids[19]=overlay(asset);
            if(m==='both')d.World.GridCollection.DiffGrids[19].GridDefaultLayoutPath=asset[0].replaceAll('/','\\');
            const [w,r]=open(m,d),p=preview(w,r),want=structuredClone(d);want.Player.ContainerInventories[12].Inventory[0].Amount=49;
            assert.equal(p.contract,'wand.worker.steam626.scoped-amount@1');assert.equal(p.oldAmount,50);assert.equal(p.newAmount,49);assert.equal(p.writerAuthorized,false);
            const ds=parse(w.discover_scoped_amount(profile,0,...sc(r)));assert.equal(ds.rows.length,1);assert.equal(ds.rows[0].id,12);assert.equal(ds.rows[0].selector,0);
            deny(()=>w.preview_switch626_chest(12,0,49,...sc(r)));
            deny(()=>w.preview_scoped_amount('catalog0-furniture',0,40000048,2,...sc(r)));
            deny(()=>stage(w,r,'00'.repeat(32)));deny(()=>stage(w,r,p.entrySha256,49));
            const [foreign,fr]=open(m,d);deny(()=>stage(foreign,r,p.entrySha256));foreign.close();foreign.free();
            const s=stage(w,r,p.entrySha256);assert.equal(s.exactFieldChangedCount,1);assert.equal(s.operationCount,1);assert.equal(s.writerAuthorized,false);assert.equal(s.originalOverwriteAuthorized,false);assert.equal(s.stagedDecodedSha256,sha(enc(want)));
            deny(()=>stage(w,r,p.entrySha256));
            const u=parse(w.toggle_scoped_amount(false,...sc(s)));assert.equal(u.applied,false);deny(()=>w.begin_scoped_edit_output(...sc(u)));
            const v=parse(w.toggle_scoped_edit(true,...sc(u)));assert.equal(v.applied,true);
            const o=parse(w.begin_scoped_amount_output(...sc(v)));assert.equal(o.decodedSha256,sha(enc(want)));
            const x=Buffer.from(w.next_scoped_amount_output_chunk()),y=Buffer.from(w.next_scoped_edit_output_chunk());assert.equal(x.length,1048576);assert.deepEqual(Buffer.concat([x,y]),enc(want));deny(()=>w.next_scoped_edit_output_chunk());deny(()=>w.begin_scoped_amount_output(...sc(v)));w.close();w.free();pos++;
          }
          for(const mutate of [
            d=>d.World.GridCollection.DiffGrids[19].GridDefaultLayoutPath='SceneLayouts/Unknown.json',
            d=>d.World.GridCollection.DiffGrids[19].GridDefaultLayoutPath='SceneLayouts/../Unknown.json',
            d=>d.World.GridCollection.DiffGrids[19].GridDefaultLayoutType='Meta.Other, Meta',
            d=>d.World.GridCollection.DiffGrids[19].DefaultLayoutGridID=4294967295,
            d=>d.World.GridCollection.DiffGrids[19].DefaultGridHashCode='-4',
            d=>d.World.GridCollection.DiffGrids[19].RemovedObjects=[1,1],
            d=>d.World.GridCollection.DiffGrids[19].ModifiedObjects[9]={ID:9,ItemID:40001680,State:{Storage:{ContainerInventoryID:12,DefaultContainerInventoryData:'',DesignID:null,UnlockKeyItemID:0,UnlockLocId:''}}},
            d=>d.World.GridCollection.DiffGrids[19].ModifiedObjects[9]={ID:9,ItemID:40001680,State:{Storage:{ContainerInventoryID:0,DefaultContainerInventoryData:'template',DesignID:null,UnlockKeyItemID:0,UnlockLocId:''}}},
            d=>d.Player.ContainerInventories[12].Inventory[0].State={},
            d=>d.Player.ContainerInventories[12].Inventory[0].Amount=49,
            d=>d.World.GridCollection.Grids[7].GridDefaultLayoutPath=a[0]
          ]){
            const d=doc();mutate(d);const [w,r]=open('both',d);deny(()=>preview(w,r));w.close();w.free();
          }
          {const d=doc();d.World.GridCollection.DiffGrids[19]=overlay(ex);const [w,r]=open('both',d,sw);deny(()=>w.preview_switch626_chest(12,0,49,...sc(r)));deny(()=>preview(w,r));w.close();w.free();}
          console.log('ACT1097_STEAM_CHEST_STATIC_GENERATED '+pos+'POS '+neg+'NEG PASS');assert.equal(pos,2);assert.equal(neg,31);
          JS

name: 01A Stage E Genuine Generated Rust WASM Chrome Worker (Writer OFF)
on:
  pull_request:
    paths:
      - '.github/workflows/01a-stagee-generated-wasm-chrome.yml'
permissions:
  contents: read
jobs:
  genuine-wasm-chrome-worker:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_TARGET_DIR: /tmp/wand-stagee-cargo-target
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: QA ONLY cumulative Steam Chest dedicated isolation / current shared ledger
        run: |
          set -euo pipefail
          cargo generate-lockfile --manifest-path crates/ddv-save-core/Cargo.toml
          sha256sum crates/ddv-save-core/Cargo.lock | tee /tmp/qrc1639-lock.sha
          cargo install wasm-bindgen-cli --version 0.2.105 --locked --root /tmp/wand-stagee-wasm-tools
          B=/tmp/wand-stagee-wasm-tools/bin/wasm-bindgen
          W="$CARGO_TARGET_DIR/wasm32-unknown-unknown/release/ddv_save_core.wasm"
          for mode in off legacy legacy-mixed chest chest-mixed comp comp-mixed spatial spatial-mixed dual dual-spatial sr03 sr03-mixed chest-sr03 comp-sr03 spatial-sr03 all steam steam-mixed steam-switch steam-comp steam-spatial steam-sr03 steam-triple steam-all; do
            case "$mode" in
              off) f=indexed-read ;;
              legacy) f=product-amount-scoped ;;
              legacy-mixed) f=product-amount-scoped,product-collection-scoped ;;
              chest) f=product-switch626-chest-scoped ;;
              chest-mixed) f=product-switch626-chest-scoped,product-collection-scoped ;;
              comp) f=product-steam626-comp03-scoped ;;
              comp-mixed) f=product-steam626-comp03-scoped,product-collection-scoped ;;
              spatial) f=product-steam626-comp03-spatial-preview ;;
              spatial-mixed) f=product-steam626-comp03-spatial-preview,product-collection-scoped ;;
              dual) f=product-switch626-chest-scoped,product-steam626-comp03-scoped ;;
              dual-spatial) f=product-switch626-chest-scoped,product-steam626-comp03-spatial-preview,product-collection-scoped ;;
              sr03) f=product-steam626-sr03-scoped ;;
              sr03-mixed) f=product-steam626-sr03-scoped,product-collection-scoped ;;
              chest-sr03) f=product-switch626-chest-scoped,product-steam626-sr03-scoped ;;
              comp-sr03) f=product-steam626-comp03-scoped,product-steam626-sr03-scoped ;;
              spatial-sr03) f=product-steam626-comp03-spatial-preview,product-steam626-sr03-scoped,product-collection-scoped ;;
              all) f=product-switch626-chest-scoped,product-steam626-comp03-spatial-preview,product-steam626-sr03-scoped,product-collection-scoped ;;
              steam) f=product-steam626-chest-scoped ;;
              steam-mixed) f=product-steam626-chest-scoped,product-collection-scoped ;;
              steam-switch) f=product-steam626-chest-scoped,product-switch626-chest-scoped ;;
              steam-comp) f=product-steam626-chest-scoped,product-steam626-comp03-scoped ;;
              steam-spatial) f=product-steam626-chest-scoped,product-steam626-comp03-spatial-preview,product-collection-scoped ;;
              steam-sr03) f=product-steam626-chest-scoped,product-steam626-sr03-scoped ;;
              steam-triple) f=product-steam626-chest-scoped,product-switch626-chest-scoped,product-steam626-sr03-scoped ;;
              steam-all) f=product-steam626-chest-scoped,product-switch626-chest-scoped,product-steam626-comp03-spatial-preview,product-steam626-sr03-scoped,product-collection-scoped ;;
            esac
            cargo build --locked --manifest-path crates/ddv-save-core/Cargo.toml --release --target wasm32-unknown-unknown --no-default-features --features "worker-wasm,$f"
            "$B" "$W" --out-dir "/tmp/comp-$mode" --target nodejs --no-typescript
          done
          sha256sum -c /tmp/qrc1639-lock.sha
          node --input-type=commonjs <<'JS'
          const assert=require('node:assert/strict'),fs=require('node:fs'),{createHash}=require('node:crypto');

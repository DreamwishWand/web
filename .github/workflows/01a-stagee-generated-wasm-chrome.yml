name: 01A Stage E Genuine Generated Rust WASM Chrome Worker (Writer OFF)
on:
  pull_request:
    paths:
      - 'tests/stage-e/**'
      - 'scripts/wasm-distribution/**'
      - 'src/lib/ddv/core/save/product-rust-wasm-candidate-loader.mjs'
      - '.github/workflows/01a-stagee-generated-wasm-chrome.yml'
      - 'crates/ddv-save-core/**'
      - 'src/lib/ddv/core/save/product-wasm-read-owner.mjs'
  push:
    branches:
      - 'core/real-wasm-browser-smoke-stagee-*'
permissions:
  contents: read
jobs:
  genuine-wasm-chrome-worker:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_TARGET_DIR: /tmp/wand-stagee-cargo-target
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Verify real Chrome and exact pinned wasm-bindgen crate
        run: |
          set -euo pipefail
          command -v google-chrome || command -v chromium
          grep -Fx 'wasm-bindgen = { version = "=0.2.105", optional = true }' crates/ddv-save-core/Cargo.toml
          grep -Fx 'worker-wasm = ["dep:wasm-bindgen"]' crates/ddv-save-core/Cargo.toml
          grep -Fx 'indexed-read = []' crates/ddv-save-core/Cargo.toml
      - name: Compile REAL cdylib with opt-in Worker and indexed metadata
        run: |
          cargo build --manifest-path crates/ddv-save-core/Cargo.toml --release --target wasm32-unknown-unknown --features worker-wasm,indexed-read
          test -s "$CARGO_TARGET_DIR/wasm32-unknown-unknown/release/ddv_save_core.wasm"
      - name: Install exactly matching wasm-bindgen CLI 0.2.105 (not generated or mocked JS)
        run: |
          cargo install wasm-bindgen-cli --version 0.2.105 --locked --root /tmp/wand-stagee-wasm-tools
          /tmp/wand-stagee-wasm-tools/bin/wasm-bindgen --version | grep -F '0.2.105'
      - name: Generate true wasm-bindgen Browser Worker ESM glue
        run: |
          mkdir -p tests/stage-e/pkg
          /tmp/wand-stagee-wasm-tools/bin/wasm-bindgen "$CARGO_TARGET_DIR/wasm32-unknown-unknown/release/ddv_save_core.wasm" --out-dir tests/stage-e/pkg --target web --no-typescript
          test -s tests/stage-e/pkg/ddv_save_core.js
          test -s tests/stage-e/pkg/ddv_save_core_bg.wasm
          ! grep -R -E 'STEAM_SAVE_OWNER_PRIVATE|include_bytes!|writerAuthorized: *true|applyAuthorized: *true' tests/stage-e
      - name: Actual browser CDP + module Worker + Rust WASM positive and negatives
        run: node tests/stage-e/chrome-smoke.mjs
      - name: Confirm Stage E never changed product Writer or public worker route
        run: |
          ! git diff --name-only "$GITHUB_BASE_REF" 2>/dev/null | grep -E 'local-timing-read.worker|community|provider|p1g' || true
          test -f src/lib/ddv/core/save/product-wasm-read-owner.mjs
          test -f crates/ddv-save-core/src/wasm_worker.rs

      - name: QA ONLY ACT1156 dedicated Catalog0 feature
        run: |
          set -euo pipefail
          B=/tmp/wand-stagee-wasm-tools/bin/wasm-bindgen
          W="$CARGO_TARGET_DIR/wasm32-unknown-unknown/release/ddv_save_core.wasm"
          for mode in release mixed; do
          features=worker-wasm,product-switch626-catalog0-scoped
          if [ "$mode" = mixed ]; then features="$features,product-collection-scoped,product-amount-scoped"; fi
          cargo build --locked --manifest-path crates/ddv-save-core/Cargo.toml --release --target wasm32-unknown-unknown --no-default-features --features "$features"
          "$B" "$W" --out-dir "/tmp/catalog-$mode" --target nodejs --no-typescript
          done
          node --input-type=commonjs <<'JS'
          const assert=require('node:assert/strict'),fs=require('node:fs'),{createHash}=require('node:crypto');
          let Cls;
          const sw=['switch','switch-bid','9A239D3DB569756D',626,true],item=40000076;
          const sha=b=>createHash('sha256').update(b).digest('hex'),enc=d=>Buffer.from(JSON.stringify(d,null,2));
          const layout=fs.readFileSync('crates/ddv-save-core/data/steam626-amount-layout-reference.jsonl','utf8').trim().split('\n').slice(1).map(JSON.parse);
          const a=layout.find(x=>x[0].includes('AliceHouse')),ex=layout.find(x=>x[0].includes('OogieBoogieHouse'));
          const overlay=x=>({ID:19,GridDefaultLayoutPath:x[0],GridDefaultLayoutType:x[1],DefaultLayoutGridID:x[4][0][0],DefaultGridHashCode:-4,DefaultGridDataHashCode:6,ModifiedObjects:{},RemovedObjects:[]});
          const date='2024-02-29T23:59:59.123456789Z';
          // Independent representative IDs for all 12 existing typed variants from ACT1084/ACT1103 public 508-ID census.
          const reps=[[2010000003,'ItemSpawning'],[2010200014,'FishSpawningInVillage'],[2010400001,'WildCropsSpawningInVillage'],[2010500008,'FlowerSpawningInVillage'],[2010600000,'FlowerDryingInVillage'],[2010700000,'ChooseVillageArea'],[2010800000,'MiningRockTurningSpecial'],[2010900000,'PendingFishUpgrade'],[2011000000,'TimeLostTreasureSpawning'],[2011100000,'ChooseItem'],[2011200000,'MakeCharacterEager'],[2011300000,'SnippetSpawning']];
          const event=(id,kind)=>({[kind]:{RecurringEventItemID:id,NextOccurrence:date,EndDate:null,...(kind==='ItemSpawning'?{LastOccurrence:null}:{}),...(kind==='ChooseVillageArea'?{ChosenVillageArea:'VillageAreaType_Meadow'}:{}),...(kind==='ChooseItem'?{ChosenItemID:30200001}:{}),...(kind==='SnippetSpawning'?{Tokens:0,Snippets:[]}: {})}});
          const filter=()=>({Data:{Type:'ItemType_ActivityItem',ActivityItemType:'ActivityItemType_Crop',Item:0,ItemList:[],AnyActivityItem:false}});
          const duty=id=>({State:'DutySlotState_OnGoing',DutyId:id,DifficultyLayer:0,ItemsUsed:[],StepData:{ItemFilter:filter()}});
          function doc(asset=a){return {GameInfo:{Version:626},ConditionalEventHistory:{ActiveEvents:{}},World:{GridCollection:{Grids:{},DiffGrids:{19:overlay(asset)}},MissionSlots:{},RecurringEvents:{1:event(...reps[0])},Villages:[]},Player:{ListInventories:{0:{ID:0,CompatibleItemType:'ItemType_Furniture',CompatibleFurnitureTypes:{List:['FurnitureItemType_Default']},Inventory:{[item]:{Amount:999,Marker:'ItemMarker_None',Unknown:'keep'}}}},ContainerInventories:{},BackpackOverflow:{Items:[]},AchievementsData:[],EvolveStatesProfile:{EvolveProgressState:{}},DutySlots:{0:{Slots:[duty(2110000038),duty(2110000161)]}},BattlePassStates:{Progress:{},FtueProgress:{TasksProgress:[],WeeklyTasksProgress:[]}}},Opaque:{keep:'x'.repeat(1100000),n:7}};}
          const crop=d=>d.Player.DutySlots[0].Slots[0].StepData.ItemFilter.Data,body=d=>d.World.RecurringEvents[1].ItemSpawning;
          const inactive=(k,v)=>({UseField:false,Random:false,ShowRandomCheckbox:false,[k]:v});
          function full(d){Object.assign(crop(d),{SubType:'',Set:0,Complexity:inactive('Complexity','Complexity_Lavish'),Mood:inactive('Mood','Mood_Calm'),Sturdiness:inactive('Sturdiness','Sturdiness_Strong'),Normality:inactive('Normality','Normality_Wondrous'),MinRarity:0,MaxRarity:0,FishLocation:inactive('VillageAreas',{AreaList:[]}),FishRarity:inactive('FishRarities',{FishRarities:[]}),Constraint:'',FishIncludeTrash:false,FishWeather:'',TagCondition:'TagFilterCondition_AllTags',Tags:[],CropType:'CropTypeCondition_Any',SeedType:'SeedTypeCondition_Any',FlowerRarity:'FlowerRarityCondition_Any',IngredientsType:[],MinMealStarRating:0,MinUnlockLevel:0,MaxUnlockLevel:0,MineralRoughness:'MineralRoughness_Any',EphemeralType:'EphemeralTypeCondition_Any',Profession:0,OnlySeedCrop:false});}
          let nonce=0,pos=0,neg=0,red=[];
          function open(d){const raw=enc(d),w=new Cls(...sw,new Uint8Array(32).fill(++nonce));for(let i=0;i<raw.length;i+=1048576)w.append_chunk(raw.subarray(i,i+1048576));const r=JSON.parse(w.finish());assert.equal(r.decodedSha256,sha(raw));return [w,r]}
          const sc=r=>[r.sessionId,BigInt(r.revision),BigInt(r.indexGeneration),r.decodedSha256],parse=JSON.parse;
          const preview=(w,r)=>parse(w.preview_switch626_catalog0(0,item,998,...sc(r)));
          const stage=(w,r,h)=>parse(w.stage_switch626_catalog0(0,item,999,998,h,...sc(r)));
          const discover=(w,r)=>parse(w.discover_switch626_catalog0(0,...sc(r))).rows;
          const names=['discover_switch626_catalog0','preview_switch626_catalog0','stage_switch626_catalog0','toggle_scoped_edit','begin_scoped_edit_output','next_scoped_edit_output_chunk'];
          const hidden=['discover_scoped_amount','preview_scoped_amount','stage_scoped_amount','toggle_scoped_amount','begin_scoped_amount_output','next_scoped_amount_output_chunk','discover_switch626_chest','preview_switch626_chest','stage_switch626_chest','preview_scoped_collection_candidate','preview_fixed_collection','stage_fixed_collection'];
          for(const mode of ['release','mixed']){Cls=require('/tmp/catalog-'+mode+'/ddv_save_core.js').WorkerWasmSource;const proto=Object.getOwnPropertyNames(Cls.prototype).filter(n=>!['constructor','free','__destroy_into_raw'].includes(n));const exps=WebAssembly.Module.exports(new WebAssembly.Module(fs.readFileSync('/tmp/catalog-'+mode+'/ddv_save_core_bg.wasm')));assert.equal(proto.length,14);assert.equal(exps.length,23);for(const n of names)assert.ok(proto.includes(n),n);for(const n of hidden)assert.ok(!proto.includes(n),n);
            const d=doc(mode==='release'?a:ex);full(d);Object.assign(crop(d),{CropType:'CropTypeCondition_Fruit',MaxUnlockLevel:100});const [w,r]=open(d),p=preview(w,r),want=structuredClone(d);want.Player.ListInventories[0].Inventory[item].Amount=998;assert.equal(discover(w,r).length,1);
            const deny=f=>{assert.throws(f);neg++};deny(()=>stage(w,r,'0'.repeat(64)));deny(()=>w.preview_switch626_catalog0(0,item,997,...sc(r)));deny(()=>w.preview_switch626_catalog0(0,40000048,998,...sc(r)));const t=stage(w,r,p.entrySha256);assert.equal(t.exactFieldChangedCount,1);assert.equal(t.stagedDecodedSha256,sha(enc(want)));deny(()=>stage(w,r,p.entrySha256));const u=parse(w.toggle_scoped_edit(false,...sc(t)));deny(()=>w.begin_scoped_edit_output(...sc(u)));const v=parse(w.toggle_scoped_edit(true,...sc(u)));w.begin_scoped_edit_output(...sc(v));assert.deepEqual(Buffer.concat([Buffer.from(w.next_scoped_edit_output_chunk()),Buffer.from(w.next_scoped_edit_output_chunk())]),enc(want));deny(()=>w.next_scoped_edit_output_chunk());w.close();w.free();pos++;
          }console.log('ACT1156_CATALOG0_FEATURE '+pos+'POS '+neg+'NEG 14METHODS23EXPORTS');assert.equal(pos,2);assert.equal(neg,12);
          JS

name: 01A Stage E Genuine Generated Rust WASM Chrome Worker (Writer OFF)
on:
  pull_request:
    paths:
      - '.github/workflows/01a-stagee-generated-wasm-chrome.yml'
permissions:
  contents: read
jobs:
  genuine-wasm-chrome-worker:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_TARGET_DIR: /tmp/wand-stagee-cargo-target
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: QA ONLY FM01 generated ABI
        run: |
          set -euo pipefail
          cargo generate-lockfile --manifest-path crates/ddv-save-core/Cargo.toml
          sha256sum crates/ddv-save-core/Cargo.lock | tee /tmp/qrc-lock.sha
          cargo test --locked --manifest-path crates/ddv-save-core/Cargo.toml --features product-switch626-fm01-scoped --lib qa1836_synthetic_fixture
          cargo install wasm-bindgen-cli --version 0.2.105 --locked --root /tmp/wand-stagee-wasm-tools
          for m in own collection; do
            case "$m" in
              own) f=product-switch626-fm01-scoped ;;
              collection) f=product-switch626-fm01-scoped,product-collection-scoped ;;
            esac
            cargo build --locked --manifest-path crates/ddv-save-core/Cargo.toml --release --target wasm32-unknown-unknown --no-default-features --features "worker-wasm,$f"
            /tmp/wand-stagee-wasm-tools/bin/wasm-bindgen "$CARGO_TARGET_DIR/wasm32-unknown-unknown/release/ddv_save_core.wasm" --out-dir "/tmp/fm-$m" --target nodejs --no-typescript
          done
          sha256sum -c /tmp/qrc-lock.sha
          node --input-type=commonjs <<'JS'
          const assert=require('node:assert/strict'),fs=require('node:fs'),{createHash}=require('node:crypto');
          const sha=b=>createHash('sha256').update(b).digest('hex'),cls=m=>require('/tmp/fm-'+m+'/ddv_save_core.js').WorkerWasmSource;
          const readers=['append_chunk','finish','read_core_version_witness','issue_typed_cursor','read_typed_page','issue_saved_diffgrids_typed_cursor','read_saved_diffgrids_typed_page','close'],names=['preview_switch626_fm01','stage_switch626_fm01','toggle_switch626_fm01','begin_switch626_fm01_output','next_switch626_fm01_output_chunk'];
          for(const m of ['collection']){const n=Object.getOwnPropertyNames(cls(m).prototype).filter(k=>!['constructor','free','__destroy_into_raw'].includes(k)).sort(),b=fs.readFileSync('/tmp/fm-'+m+'/ddv_save_core_bg.wasm'),ex=WebAssembly.Module.exports(new WebAssembly.Module(b)).map(x=>x.name);assert.deepEqual(n,[...readers,...(m==='own'?names:m==='hair'||m==='skin'?['preview_steam626_'+m,'stage_steam626_'+m,'toggle_scoped_edit','begin_scoped_edit_output','next_scoped_edit_output_chunk']:[])].sort(),m);assert.equal(ex.length,n.length+9);for(const k of n)assert.ok(ex.includes('workerwasmsource_'+k));console.log('QRC1836_SUPPLEMENTAL_CENSUS '+m+' '+n.length+'/'+ex.length+' '+sha(b));}
          const raw=fs.readFileSync('/tmp/qrc1836-input.json'),d=JSON.parse(raw),ids=new Uint32Array([10,11,12,13,14]),g=d.World.GridCollection.Grids[90001],x=g.Objects[10].X,y=g.Objects[10].Y;
          const sw=['switch','switch-bid','9A239D3DB569756D',626,true];let nonce=0,neg=0;
          const read=doc=>{const b=Buffer.from(JSON.stringify(doc)),w=new(cls('own'))(...sw,new Uint8Array(32).fill(++nonce));w.append_chunk(b);const r=JSON.parse(w.finish());return[w,r]};
          const sc=r=>[r.sessionId,BigInt(r.revision),BigInt(r.indexGeneration),r.decodedSha256];
          function deny(doc){const [w,r]=read(doc);assert.throws(()=>w.preview_switch626_fm01(90001,ids,...sc(r)));w.close();w.free();neg++}
          for(const id of [11,12,13,14,50,51,52]){const q=structuredClone(d);q.Opaque.ref={GridID:90001,ObjectID:id};deny(q);}
          const occupied=structuredClone(d);occupied.World.GridCollection.Grids[90001].Objects[15]={ID:15,ItemID:40700246,Orientation:'GridOrientation_Down',State:null,X:x,Y:y+2};deny(occupied);
          const duplicate=structuredClone(d);duplicate.World.Villages[0].Areas[2].GridIDs=[90001,90001];deny(duplicate);
          assert.equal(neg,9);console.log('QRC1836_SUPPLEMENTAL_TARGET_ACTUAL 9NEG COLLECTION_MIXED_8_17');
          JS

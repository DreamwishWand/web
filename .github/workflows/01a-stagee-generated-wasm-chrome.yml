          const stock=n=>({Amount:n,Marker:'ItemMarker_None'}),avatar=()=>({Clothes:{},IncompatibleClothes:{},ClothingCustomization:{},Makeup:{}});
          function wardrobeDoc(){const m=avatar();m.Clothes={0:old,1:bottom};return {GameInfo:{Version:626},ConditionalEventHistory:{ActiveEvents:{}},World:{Unknown:{keep:1}},Player:{AvatarIsMale:true,FemaleAvatar:avatar(),MaleAvatar:m,MaleClothingDesigns:[],FemaleClothingDesigns:[],OutfitPresets:[],ListInventories:{1:{ID:1,CompatibleItemType:'ItemType_Clothing',Inventory:{[old]:stock(8),[newId]:stock(9),[bottom]:stock(1)}},3:{ID:3,CompatibleItemType:'ItemType_Makeup',Inventory:{}}},CollectionSets:[{CollectionDefinitionID:2120000001,GroupData:[{GroupsCollectionItems:{[old]:true,[newId]:true}}]}]},Opaque:{escaped:'\\u0000',pad:'fixed-cumulative'}}}

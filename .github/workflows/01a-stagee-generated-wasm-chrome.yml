          const [f,fr]=open(d);deny(()=>st(f,r,p));f.close();f.free();
          const [foreign,fo]=open(d,steam);deny(()=>call(foreign,1,...args,backup,...sc(fo)));foreign.close();foreign.free();
          const t=st(w,r,p);assert.equal(t.exactFieldChangedCount,1);assert.equal(t.stagedDecodedSha256,sha(raw(prior)));assert.equal(t.writerAuthorized,false);deny(()=>st(w,r,p));const u=JSON.parse(call(w,3,false,...sc(t)));deny(()=>call(w,4,...sc(u)));const v=JSON.parse(call(w,3,true,...sc(u)));call(w,4,...sc(v));const out=Buffer.from(call(w,5));assert.deepEqual(out,raw(prior));deny(()=>call(w,5));w.close();w.free();a.close();a.free();const file='/tmp/qrc1793-export-decoded.json';fs.writeFileSync(file,out,{flag:'wx',mode:0o600});const child="const assert=require('node:assert/strict'),fs=require('node:fs'),{createHash}=require('node:crypto');const bytes=fs.readFileSync(process.argv[1]),expected=process.argv[2];const {WorkerWasmSource}=require('/tmp/restore-own/ddv_save_core.js');const w=new WorkerWasmSource('switch','switch-bid','9A239D3DB569756D',626,true,new Uint8Array(32).fill(97));w.append_chunk(bytes);const r=JSON.parse(w.finish());assert.equal(r.decodedSha256,expected);assert.equal(createHash('sha256').update(bytes).digest('hex'),expected);assert.equal(JSON.parse(bytes).Player.ContainerInventories[12].Inventory[0].Amount,49);assert.equal(r.revision,0);const b=Buffer.from(w.capture_switch626_chest_portable_backup(12,0,r.sessionId,BigInt(r.revision),BigInt(r.indexGeneration),r.decodedSha256));assert.ok(b.length>0);w.close();w.free();console.log('QRC1793_REOPEN_CHILD_PASS '+r.decodedSha256);";const result=require('node:child_process').execFileSync(process.execPath,['-e',child,file,sha(out)],{encoding:'utf8'});process.stdout.write(result);assert.ok(result.includes('QRC1793_REOPEN_CHILD_PASS '+sha(out)));assert.equal(neg,10);console.log('QRC1793_PORTABLE_ABI_ACTUAL 1POS '+neg+'NEG 14CENSUS');

name: 01A Stage E Genuine Generated Rust WASM Chrome Worker (Writer OFF)
on:
  pull_request:
    paths:
      - '.github/workflows/01a-stagee-generated-wasm-chrome.yml'
permissions:
  contents: read
jobs:
  genuine-wasm-chrome-worker:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_TARGET_DIR: /tmp/wand-stagee-cargo-target
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: QRC1590 actual generated SR03 exact8 and applicable pack3
        run: |
          set -euo pipefail
          cargo generate-lockfile --manifest-path crates/ddv-save-core/Cargo.toml
          sha256sum crates/ddv-save-core/Cargo.lock | tee /tmp/qrc1590-lock.sha
          cargo install wasm-bindgen-cli --version 0.2.105 --locked --root /tmp/wand-stagee-wasm-tools
          B=/tmp/wand-stagee-wasm-tools/bin/wasm-bindgen
          W="$CARGO_TARGET_DIR/wasm32-unknown-unknown/release/ddv_save_core.wasm"
          for mode in off legacy legacy-mixed release mixed; do
            case "$mode" in
              off) feat=indexed-read ;;
              legacy) feat=product-amount-scoped ;;
              legacy-mixed) feat=product-amount-scoped,product-collection-scoped ;;
              release) feat=product-steam626-sr03-scoped ;;
              mixed) feat=product-steam626-sr03-scoped,product-collection-scoped ;;
            esac
            cargo build --locked --manifest-path crates/ddv-save-core/Cargo.toml --release --target wasm32-unknown-unknown --no-default-features --features "worker-wasm,$feat"
            "$B" "$W" --out-dir "/tmp/sr03-$mode" --target nodejs --no-typescript
          done
          sha256sum -c /tmp/qrc1590-lock.sha
          node --input-type=commonjs <<'JS'
          const assert=require('node:assert/strict'),fs=require('node:fs'),{createHash}=require('node:crypto');
          const sha=b=>createHash('sha256').update(b).digest('hex'),cls=m=>require('/tmp/sr03-'+m+'/ddv_save_core.js').WorkerWasmSource;
          const steam=['steam-windows','steam-full-version','releases_1.25-v1.25.3-44-g0b41250d9ac0-incremental-22',626,true],sw=['switch','switch-bid','9A239D3DB569756D',626,true];
          const G=90001,K=10,M=11,N=50,R=40100068,X=204,Y=116,ts='2026-01-01T00:00:00Z',Z='0'.repeat(64);
          const obj=(ID,X,Y,diag=false)=>({ID,ItemID:R,Orientation:'GridOrientation_Down',State:diag?{FenceMode:{Diagonal:true}}:null,X,Y});
          const grid=d=>d.World.GridCollection.Grids[G],entry=d=>d.Player.ListInventories[0].Inventory[R];
          const duty=id=>({State:'DutySlotState_OnGoing',DutyId:id,DifficultyLayer:0,ItemsUsed:[],StepData:{ItemFilter:{Data:{Type:'ItemType_Furniture',Item:0,ItemList:[],AnyActivityItem:false,Tags:[],MinRarity:1,MaxRarity:5}}}});
          const choice=id=>({ChooseItem:{RecurringEventItemID:2011100000,NextOccurrence:ts,EndDate:null,ChosenItemID:id}});
          const task=()=>({TaskState:'BattlePassTaskState_NotStarted',Objective:{CurAmount:0,TargetAmount:5,ItemIdsCollected:[],ItemFilter:{Data:{Item:0,ItemList:[],AnyActivityItem:false,Type:'ItemType_Clothing'}}}});
          function doc(){return {GameInfo:{Version:626},World:{Villages:[{Areas:{2:{Unlocked:true,GridIDs:[G]}}}],PlayerHouses:[],GridCollection:{Grids:{[G]:{ID:G,GridDataPath:'GridData/Villages/Village04-MeadowLevel-GridData.json',GridDefaultLayoutPath:'',TessellationFactor:2,NextGridObjectID:N,Objects:{[K]:obj(K,X,Y),[M]:obj(M,X+4,Y)}}},DiffGrids:{}},MissionSlots:{},RecurringEvents:{1:choice(31700067)},TimeLostTreasures:{},NextTimeLostTreasureID:1,Snippets:{},NextSnippetID:0},Player:{ListInventories:{0:{ID:0,CompatibleItemType:'ItemType_Furniture',CompatibleFurnitureTypes:{List:['FurnitureItemType_GroundAlteration']},Inventory:{[R]:{Amount:10,Marker:'ItemMarker_Favorite'}}}},ContainerInventories:{},AchievementsData:[],DutySlots:{0:{Slots:[duty(2110000201),duty(2110000208)]}},EvolveStatesProfile:{EvolveProgressState:{}},BattlePassStates:{Progress:{},FtueProgress:{TasksProgress:[task()],WeeklyTasksProgress:[]}}},ConditionalEventHistory:{ActiveEvents:{}},Opaque:{escaped:'keep',other:[1,2,3]}}}
          const raw=d=>Buffer.from(JSON.stringify(d).replace('"escaped":"keep"','"escaped":"\\u006beep"'));
          function oracle(d){
           const gr=grid(d),o=gr.Objects,old=JSON.stringify(gr),moved=JSON.stringify(o[M]),nextObj=obj(M,X+8,Y+4,true);
           const tail=[[N,X+4,Y],[N+1,X+4,Y+4],[N+2,X+8,Y]].map(([i,x,y])=>',"'+i+'":'+JSON.stringify(obj(i,x,y,true))).join('');
           const oldObjects=JSON.stringify(o),newObjects=oldObjects.replace(moved,JSON.stringify(nextObj)).slice(0,-1)+tail+'}';
           const newGrid=old.replace('"Objects":'+oldObjects,'"Objects":'+newObjects).replace('"NextGridObjectID":50','"NextGridObjectID":53');
           const want=Buffer.from(raw(d).toString().replace(old,newGrid).replace('"Amount":10,"Marker":"ItemMarker_Favorite"','"Amount":7,"Marker":"ItemMarker_Favorite"'));
           const expected=structuredClone(d);grid(expected).Objects[M]=nextObj;for(const [i,x,y] of [[N,X+4,Y],[N+1,X+4,Y+4],[N+2,X+8,Y]])grid(expected).Objects[i]=obj(i,x,y,true);
           grid(expected).NextGridObjectID=53;entry(expected).Amount=7;
           assert.deepEqual(JSON.parse(want),expected);assert.equal(JSON.stringify(grid(expected).Objects[K]),JSON.stringify(o[K]));
           return {want,p:{gridId:G,retainedId:K,movedId:M,expectedNextId:N,oldAmount:10,gridSha256:sha(Buffer.from(old)),inventoryEntrySha256:sha(Buffer.from(JSON.stringify(entry(d)))),projectedDecodedSha256:sha(want)}};
          }
          let nonce=0,pos=0,neg=0;const deny=(f,label)=>{assert.throws(f,undefined,label);neg++};
          const parse=JSON.parse,sc=r=>[r.sessionId,BigInt(r.revision),BigInt(r.indexGeneration),r.decodedSha256];
          function open(m,d,b=steam){const w=new(cls(m))(...b,new Uint8Array(32).fill(++nonce%254+1)),a=raw(d);for(let i=0;i<a.length;i+=1048576)w.append_chunk(a.subarray(i,i+1048576));const r=parse(w.finish());assert.equal(r.decodedSha256,sha(a));return[w,r]}
          const preview=(w,r)=>parse(w.preview_steam626_sr03(G,K,M,...sc(r)));
          const stage=(w,r,p)=>parse(w.stage_steam626_sr03(p.gridId,p.retainedId,p.movedId,p.expectedNextId,p.oldAmount,p.gridSha256,p.inventoryEntrySha256,p.projectedDecodedSha256,...sc(r)));
          const readers=['append_chunk','finish','read_core_version_witness','issue_typed_cursor','read_typed_page','issue_saved_diffgrids_typed_cursor','read_saved_diffgrids_typed_page','close'],neutral=['toggle_scoped_edit','begin_scoped_edit_output','next_scoped_edit_output_chunk'],legacy=['discover_scoped_amount','preview_scoped_amount','stage_scoped_amount','toggle_scoped_amount','begin_scoped_amount_output','next_scoped_amount_output_chunk','preview_steam626_comp03','stage_steam626_comp03'],coll=['preview_scoped_collection_candidate','preview_fixed_collection','stage_fixed_collection'],pair=['preview_steam626_sr03','stage_steam626_sr03'];
          for(const [m,expect] of [['off',readers],['legacy',[...readers,...neutral,...legacy]],['legacy-mixed',[...readers,...neutral,...legacy,...coll]],['release',[...readers,...neutral,...pair]],['mixed',[...readers,...neutral,...pair]]]){
           const n=Object.getOwnPropertyNames(cls(m).prototype).filter(k=>!['constructor','free','__destroy_into_raw'].includes(k)).sort();
           const wasm=fs.readFileSync('/tmp/sr03-'+m+'/ddv_save_core_bg.wasm'),ex=WebAssembly.Module.exports(new WebAssembly.Module(wasm)).map(x=>x.name);
           assert.deepEqual(n,expect.slice().sort(),m);assert.equal(ex.length,n.length+9,m);for(const k of n)assert.ok(ex.includes('workerwasmsource_'+k),k);
           console.log('QRC1590_CENSUS '+m+' '+n.length+'/'+ex.length+' '+sha(wasm));
          }
          const edits=[
           ['unknown-choice',d=>d.World.RecurringEvents[1].ChooseItem.ChosenItemID=31700077],
           ['road-choice',d=>d.World.RecurringEvents[1].ChooseItem.ChosenItemID=R],
           ['wrong-choice-id',d=>d.World.RecurringEvents[1].ChooseItem.RecurringEventItemID=2011100001],
           ['unknown-road-event',d=>d.World.RecurringEvents[1]={ItemSpawning:{RecurringEventItemID:2010000009,NextOccurrence:ts,EndDate:null,LastOccurrence:null}}],
           ['wrong-choice-shape',d=>d.World.RecurringEvents[1].ChooseItem.Extra=1],
           ['bad-choice-time',d=>d.World.RecurringEvents[1].ChooseItem.NextOccurrence=null],
           ['unproved-duty-area',d=>d.Player.DutySlots[0].Slots[0].DutyId=2110000200],
           ['third-duty',d=>d.Player.DutySlots[0].Slots.push(duty(2110000201))],
           ['duty-literal',d=>d.Player.DutySlots[0].Slots[0].StepData.ItemFilter.Data.Item=R],
           ['duty-tag',d=>d.Player.DutySlots[0].Slots[0].StepData.ItemFilter.Data.Tags=['unknown']],
           ['duty-list',d=>d.Player.DutySlots[0].Slots[0].StepData.ItemFilter.Data.ItemList=[R]],
           ['duty-rarity',d=>d.Player.DutySlots[0].Slots[0].StepData.ItemFilter.Data.MaxRarity=4],
           ['duty-used',d=>d.Player.DutySlots[0].Slots[0].ItemsUsed=[R]],
           ['bp-active',d=>d.Player.BattlePassStates.FtueProgress.TasksProgress[0].TaskState='BattlePassTaskState_OnGoing'],
           ['bp-progress',d=>d.Player.BattlePassStates.FtueProgress.TasksProgress[0].Objective.CurAmount=1],
           ['bp-item',d=>d.Player.BattlePassStates.FtueProgress.TasksProgress[0].Objective.ItemFilter.Data.Item=R],
           ['bp-broad-furniture',d=>d.Player.BattlePassStates.FtueProgress.TasksProgress[0].Objective.ItemFilter.Data.Type='ItemType_Furniture'],
           ['bp-collected',d=>d.Player.BattlePassStates.FtueProgress.TasksProgress[0].Objective.ItemIdsCollected=[R]],
           ['snippet-live',d=>d.World.Snippets={1:{ID:1}}],
           ['stock-underflow',d=>entry(d).Amount=3],
           ['stale-moved',d=>grid(d).Objects[M].State={FenceMode:{Diagonal:true}}],
           ['fresh-ref',d=>d.Opaque.Ref={GridID:G,GridObjectID:N+2}]
          ];
          for(const mode of ['release','mixed']){
           const d=doc(),o=oracle(d),[w,r]=open(mode,d),p=preview(w,r);
           assert.equal(p.contract,'wand.worker.steam626.scoped-sr03-mixed-q5@1');
           for(const [k,v] of Object.entries(o.p))assert.equal(p[k],v,k);
           assert.equal(p.exactFieldChangedCount,8);assert.equal(p.inventoryDelta,-3);assert.equal(p.newAmount,7);assert.equal(p.productWriterAuthorized,false);
           for(const [k,v] of Object.entries({gridId:G+1,retainedId:M,movedId:K,expectedNextId:51,oldAmount:9,gridSha256:Z,inventoryEntrySha256:Z,projectedDecodedSha256:Z}))deny(()=>stage(w,r,{...o.p,[k]:v}),k);
           for(const bad of [{...r,revision:1},{...r,indexGeneration:2},{...r,decodedSha256:Z},{...r,sessionId:Z}])deny(()=>stage(w,bad,o.p),'epoch');
           assert.deepEqual(preview(w,r),p);
           const [foreign,fr]=open(mode,d);deny(()=>stage(foreign,r,o.p),'foreign');foreign.close();foreign.free();
           const t=stage(w,r,o.p);assert.equal(t.exactFieldChangedCount,8);assert.equal(t.stagedDecodedSha256,sha(o.want));assert.equal(t.productWriterAuthorized,false);
           deny(()=>stage(w,r,o.p),'replay');deny(()=>preview(w,t),'poststage preview');
           const u=parse(w.toggle_scoped_edit(false,...sc(t)));deny(()=>w.begin_scoped_edit_output(...sc(u)),'undone export');
           deny(()=>w.toggle_scoped_edit(false,...sc(t)),'stale toggle');const v=parse(w.toggle_scoped_edit(true,...sc(u)));
           deny(()=>stage(w,v,o.p),'ABA stage');
           const out=parse(w.begin_scoped_edit_output(...sc(v)));assert.equal(out.decodedSha256,sha(o.want));assert.equal(out.decodedBytes,o.want.length);
           assert.deepEqual(Buffer.from(w.next_scoped_edit_output_chunk()),o.want);
           deny(()=>w.next_scoped_edit_output_chunk(),'once chunk');deny(()=>w.begin_scoped_edit_output(...sc(v)),'once export');
           w.close();w.free();pos++;
           for(const [label,edit] of edits){const q=doc();edit(q);const [a,b]=open(mode,q);deny(()=>preview(a,b),label);deny(()=>stage(a,b,o.p),label+' stage');a.close();a.free();console.log('QRC1590_DENIED '+mode+' '+label)}
           deny(()=>{const [a,b]=open(mode,d,sw);try{preview(a,b)}finally{a.close();a.free()}},'foreign Build');
          }
          const ids=[31700067,31700068,31700069,31700070,31700071,31700072,31700073,31700074,31700075,31700076,31700093,31700094,31700095,31700096,31700097,31700098];
          for(const id of ids){const d=doc();d.World.RecurringEvents[1]=choice(id);const [w,r]=open('release',d);assert.equal(preview(w,r).projectedDecodedSha256,sha(oracle(d).want));w.close();w.free();pos++;}
          assert.equal(pos,18);assert.equal(neg,130);console.log('QRC1590_SR03_ACTUAL '+pos+'POS '+neg+'NEG 5CENSUS');
          JS

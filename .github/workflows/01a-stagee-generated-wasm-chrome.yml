name: 01A Stage E Genuine Generated Rust WASM Chrome Worker (Writer OFF)
on:
  pull_request:
    paths:
      - '.github/workflows/01a-stagee-generated-wasm-chrome.yml'
permissions:
  contents: read
jobs:
  genuine-wasm-chrome-worker:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_TARGET_DIR: /tmp/wand-stagee-cargo-target
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: QA ONLY current cumulative COMP03 Spatial and Switch Chest ABI
        run: |
          set -euo pipefail
          cargo generate-lockfile --manifest-path crates/ddv-save-core/Cargo.toml
          sha256sum crates/ddv-save-core/Cargo.lock | tee /tmp/qrc1604-lock.sha
          cargo install wasm-bindgen-cli --version 0.2.105 --locked --root /tmp/wand-stagee-wasm-tools
          B=/tmp/wand-stagee-wasm-tools/bin/wasm-bindgen
          W="$CARGO_TARGET_DIR/wasm32-unknown-unknown/release/ddv_save_core.wasm"
          for mode in off legacy legacy-mixed chest chest-mixed comp comp-mixed spatial spatial-mixed dual dual-spatial; do
            case "$mode" in
              off) f=indexed-read ;;
              legacy) f=product-amount-scoped ;;
              legacy-mixed) f=product-amount-scoped,product-collection-scoped ;;
              chest) f=product-switch626-chest-scoped ;;
              chest-mixed) f=product-switch626-chest-scoped,product-collection-scoped ;;
              comp) f=product-steam626-comp03-scoped ;;
              comp-mixed) f=product-steam626-comp03-scoped,product-collection-scoped ;;
              spatial) f=product-steam626-comp03-spatial-preview ;;
              spatial-mixed) f=product-steam626-comp03-spatial-preview,product-collection-scoped ;;
              dual) f=product-switch626-chest-scoped,product-steam626-comp03-scoped ;;
              dual-spatial) f=product-switch626-chest-scoped,product-steam626-comp03-spatial-preview,product-collection-scoped ;;
            esac
            cargo build --locked --manifest-path crates/ddv-save-core/Cargo.toml --release --target wasm32-unknown-unknown --no-default-features --features "worker-wasm,$f"
            "$B" "$W" --out-dir "/tmp/comp-$mode" --target nodejs --no-typescript
          done
          sha256sum -c /tmp/qrc1604-lock.sha
          node --input-type=commonjs <<'JS'
          const assert=require('node:assert/strict'),fs=require('node:fs'),{createHash}=require('node:crypto');
          const cls=m=>require('/tmp/comp-'+m+'/ddv_save_core.js').WorkerWasmSource,sha=b=>createHash('sha256').update(b).digest('hex'),parse=JSON.parse;
          const steam=['steam-windows','steam-full-version','releases_1.25-v1.25.3-44-g0b41250d9ac0-incremental-22',626,true],sw=['switch','switch-bid','9A239D3DB569756D',626,true],item=40100038;
          const readers=['append_chunk','finish','read_core_version_witness','issue_typed_cursor','read_typed_page','issue_saved_diffgrids_typed_cursor','read_saved_diffgrids_typed_page','close'];
          const neutral=['toggle_scoped_edit','begin_scoped_edit_output','next_scoped_edit_output_chunk'],legacy=['discover_scoped_amount','preview_scoped_amount','stage_scoped_amount','toggle_scoped_amount','begin_scoped_amount_output','next_scoped_amount_output_chunk'],coll=['preview_scoped_collection_candidate','preview_fixed_collection','stage_fixed_collection'],comp=['preview_steam626_comp03','stage_steam626_comp03'],chest=['discover_switch626_chest','preview_switch626_chest','stage_switch626_chest'],sp=['preview_steam626_comp03_spatial'];
          const modes=[['off',readers],['legacy',[...readers,...neutral,...legacy,...comp,...chest]],['legacy-mixed',[...readers,...neutral,...legacy,...comp,...chest,...coll]],['chest',[...readers,...neutral,...chest]],['chest-mixed',[...readers,...neutral,...chest]],['comp',[...readers,...neutral,...comp]],['comp-mixed',[...readers,...neutral,...comp]],['spatial',[...readers,...neutral,...comp,...sp]],['spatial-mixed',[...readers,...neutral,...comp,...sp]],['dual',readers],['dual-spatial',readers]];
          for(const [m,expect] of modes){
           const n=Object.getOwnPropertyNames(cls(m).prototype).filter(k=>!['constructor','free','__destroy_into_raw'].includes(k)).sort(),bytes=fs.readFileSync('/tmp/comp-'+m+'/ddv_save_core_bg.wasm'),ex=WebAssembly.Module.exports(new WebAssembly.Module(bytes)).map(v=>v.name);
           assert.deepEqual(n,expect.slice().sort(),m);assert.equal(ex.length,n.length+9,m);for(const k of n)assert.ok(ex.includes('workerwasmsource_'+k),m+' '+k);
           console.log('QRC1604_CENSUS '+m+' '+n.length+'/'+ex.length+' '+sha(bytes));
          }
          const root=(name,id,g)=>({SceneItemId:id,Unlocked:true,GridIDs:[g],CustomLocationPositionsPath:'SceneLayouts/FloatingIslands/FloatingIsland_'+name+'/CustomLocations.json'});
          const grid=(name,id,next,objects)=>({ID:id,GridDefaultLayoutPath:'',GridDataPath:'GridData/FloatingIslands/FloatingIsland_'+name+'/FloatingIsland_'+name+'Grid-GridData.json',TessellationFactor:2,NextGridObjectID:next,Objects:objects});
          const well={ID:0,ItemID:20300048,X:120,Y:120,Orientation:'GridOrientation_Down',State:{BuildingWithSkinData:{UpgradeState:{Level:1},CurrentSkinItemID:170200005}}};
          function doc(g=301,s=742,seed=82){return {GameInfo:{Version:626},World:{Villages:[],FloatingIslands:{1540000150:root('Snow',1540000150,g),1540000153:root('Savannah',1540000153,s)},GridCollection:{Grids:{[g]:grid('Snow',g,seed+10,{0:structuredClone(well),[seed]:{ID:seed,ItemID:item,X:16,Y:24,Orientation:'GridOrientation_Down',State:null}}),[s]:grid('Savannah',s,12,{0:structuredClone(well)})},DiffGrids:{}},MissionSlots:{},RecurringEvents:{}},Player:{ListInventories:{0:{ID:0,CompatibleItemType:'ItemType_Furniture',CompatibleFurnitureTypes:{List:['FurnitureItemType_GroundAlteration']},Inventory:{[item]:{Amount:99,Marker:'ItemMarker_None'}}}},AchievementsData:[],DutySlots:{},EvolveStatesProfile:{EvolveProgressState:{}},BattlePassStates:{Progress:{},FtueProgress:{TasksProgress:[],WeeklyTasksProgress:[]}}},ConditionalEventHistory:{ActiveEvents:{}},Opaque:{escaped:'keep'}};}
          function chestDoc(){const slots=Array.from({length:48},()=>({ItemID:0,Amount:0,State:null}));slots[0]={ItemID:30200000,Amount:50,State:null,Unknown:7};return {GameInfo:{Version:626},ConditionalEventHistory:{ActiveEvents:{}},World:{GridCollection:{Grids:{7:{ID:7,GridDefaultLayoutPath:'',Objects:{4:{ID:4,ItemID:40001680,State:{Storage:{ContainerInventoryID:12,DefaultContainerInventoryData:'',UnlockKeyItemID:0,UnlockLocId:'',DesignID:null}}}}}},DiffGrids:{}},MissionSlots:{},Villages:[{Areas:{2:{GridIDs:[7],Unlocked:true}}}]},Player:{ListInventories:{0:{ID:0,CompatibleItemType:'ItemType_Furniture',CompatibleFurnitureTypes:{List:['FurnitureItemType_Default']},Inventory:{40000048:{Amount:3,Marker:'ItemMarker_None'}}},2:{ID:2,CompatibleItemType:'ItemType_ActivityItem',Inventory:{30200000:{Amount:2}}}},ContainerInventories:{0:{ID:0,BelongsToPlayer:true,Size:1,ExtraSize:0,Inventory:[{ItemID:30200000,Amount:5,State:{}}]},1:{ID:1,BelongsToPlayer:true,Size:1,ExtraSize:0,Inventory:[{ItemID:0,Amount:0,State:null}]},12:{ID:12,ParentItemID:40001680,BelongsToPlayer:true,BlockMoveTo:false,Size:48,ExtraSize:0,Inventory:slots}},BackpackOverflow:{Items:[]},AchievementsData:[],EvolveStatesProfile:{EvolveProgressState:{}},DutySlots:{},BattlePassStates:{Progress:{},FtueProgress:{TasksProgress:[],WeeklyTasksProgress:[]}}},Opaque:{escaped:'keep'}};}
          const raw=d=>Buffer.from(JSON.stringify(d).replace('"escaped":"keep"','"escaped":"\\u006beep"'));
          let nonce=0,pos=0,neg=0;const deny=(f,label)=>{assert.throws(f,undefined,label);neg++};
          function open(m,d,b=steam){const a=raw(d),w=new(cls(m))(...b,new Uint8Array(32).fill(++nonce));for(let i=0;i<a.length;i+=1048576)w.append_chunk(a.subarray(i,i+1048576));const r=parse(w.finish());assert.equal(r.decodedSha256,sha(a));return[w,r]}
          const sc=r=>[r.sessionId,BigInt(r.revision),BigInt(r.indexGeneration),r.decodedSha256];
          const pv=(w,r)=>parse(w.preview_steam626_comp03(82,...sc(r)));
          const stage=(w,r,p)=>parse(w.stage_steam626_comp03(p.seedId,p.gridId,p.nextObjectId,p.oldAmount,p.gridSha256,p.seedSha256,p.inventoryEntrySha256,p.projectedDecodedSha256,...sc(r)));
          const spatial=(w,r,p)=>parse(w.preview_steam626_comp03_spatial(82,p.projectedDecodedSha256,...sc(r)));
          const strip=p=>{const q={...p};delete q.sessionId;return q};
          function oracle(d){const gr=d.World.GridCollection.Grids[301],obj=JSON.stringify(gr.Objects),coords=[[20,24],[24,24],[16,28],[20,28],[24,28],[16,32],[20,32],[24,32]],tail=coords.map(([X,Y],i)=>',"'+(92+i)+'":'+JSON.stringify({ID:92+i,ItemID:item,Orientation:'GridOrientation_Down',State:null,X,Y})).join('');
          const old=JSON.stringify(gr),next=old.replace('"Objects":'+obj,'"Objects":'+obj.slice(0,-1)+tail+'}').replace('"NextGridObjectID":92','"NextGridObjectID":100');
          const want=Buffer.from(raw(d).toString().replace(old,next));const expected=structuredClone(d);for(const [i,[X,Y]] of coords.entries())expected.World.GridCollection.Grids[301].Objects[92+i]={ID:92+i,ItemID:item,Orientation:'GridOrientation_Down',State:null,X,Y};expected.World.GridCollection.Grids[301].NextGridObjectID=100;assert.deepEqual(parse(want.toString()),expected);return want;}
          for(const m of ['comp','comp-mixed','spatial','spatial-mixed','legacy']){
           const d=doc(),want=oracle(d),[w,r]=open(m,d),p=pv(w,r);assert.equal(p.projectedDecodedSha256,sha(want));
           if(m.startsWith('spatial')){
             const a=spatial(w,r,p);assert.equal(a.contract,'wand.worker.steam626.comp03-spatial-preview@1');assert.equal(a.anchors.length,9);assert.deepEqual(a.anchors.map(x=>[x.x,x.y]),[[16,24],[20,24],[24,24],[16,28],[20,28],[24,28],[16,32],[20,32],[24,32]]);
             assert.equal(a.writerAuthorized,false);assert.equal(a.editedCopyAuthorized,false);assert.deepEqual(pv(w,r),p);
             deny(()=>spatial(w,r,{...p,projectedDecodedSha256:'0'.repeat(64)}),'spatial-sha');
           }
           deny(()=>stage(w,r,{...p,gridSha256:'0'.repeat(64)}),'stage-sha');const t=stage(w,r,p);assert.equal(t.exactFieldChangedCount,9);assert.equal(t.stagedDecodedSha256,sha(want));deny(()=>stage(w,r,p),'replay');
           const u=parse(w.toggle_scoped_edit(false,...sc(t)));deny(()=>w.begin_scoped_edit_output(...sc(u)),'undone');const v=parse(w.toggle_scoped_edit(true,...sc(u)));w.begin_scoped_edit_output(...sc(v));assert.deepEqual(Buffer.from(w.next_scoped_edit_output_chunk()),want);deny(()=>w.next_scoped_edit_output_chunk(),'once');w.close();w.free();
           const [x,y]=open(m,d,sw);deny(()=>pv(x,y),'wrong-build-comp');x.close();x.free();pos++;
          }
          for(const m of ['chest','chest-mixed','legacy-mixed']){
           const d=chestDoc(),want=structuredClone(d);want.Player.ContainerInventories[12].Inventory[0].Amount=49;const [w,r]=open(m,d,sw),p=parse(w.preview_switch626_chest(12,0,49,...sc(r)));
           const st=(z,b,c)=>parse(z.stage_switch626_chest(12,0,50,49,c.entrySha256,...sc(b)));
           deny(()=>st(w,r,{...p,entrySha256:'0'.repeat(64)}),'chest-sha');const t=st(w,r,p);assert.equal(t.exactFieldChangedCount,1);assert.equal(t.stagedDecodedSha256,sha(raw(want)));deny(()=>st(w,r,p),'replay');
           const u=parse(w.toggle_scoped_edit(false,...sc(t)));deny(()=>w.begin_scoped_edit_output(...sc(u)),'undone');const v=parse(w.toggle_scoped_edit(true,...sc(u)));w.begin_scoped_edit_output(...sc(v));assert.deepEqual(Buffer.from(w.next_scoped_edit_output_chunk()),raw(want));deny(()=>w.next_scoped_edit_output_chunk(),'once');w.close();w.free();
           const [a,b]=open(m,d,steam);deny(()=>a.preview_switch626_chest(12,0,49,...sc(b)),'wrong-build-chest');a.close();a.free();pos++;
          }
          for(const m of ['dual','dual-spatial'])for(const b of [steam,sw]){const [w,r]=open(m,doc(),b);assert.equal(typeof w.stage_steam626_comp03,'undefined');assert.equal(typeof w.stage_switch626_chest,'undefined');assert.equal(typeof w.preview_steam626_comp03_spatial,'undefined');assert.equal(typeof w.begin_scoped_edit_output,'undefined');w.close();w.free();}
          assert.equal(pos,8);assert.equal(neg,42);console.log('QRC1604_CUMULATIVE_ACTUAL '+pos+'POS '+neg+'NEG 11CENSUS');
          JS

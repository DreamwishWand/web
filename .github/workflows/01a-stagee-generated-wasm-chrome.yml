name: 01A Stage E Genuine Generated Rust WASM Chrome Worker (Writer OFF)
on:
  pull_request:
    paths:
      - '.github/workflows/01a-stagee-generated-wasm-chrome.yml'
permissions:
  contents: read
jobs:
  genuine-wasm-chrome-worker:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_TARGET_DIR: /tmp/wand-stagee-cargo-target
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: QA ONLY Switch626 R01 exact4 / layout only / dedicated ABI
        run: |
          set -euo pipefail
          cargo generate-lockfile --manifest-path crates/ddv-save-core/Cargo.toml
          sha256sum crates/ddv-save-core/Cargo.lock | tee /tmp/qrc1711-lock.sha
          cargo install wasm-bindgen-cli --version 0.2.105 --locked --root /tmp/wand-stagee-wasm-tools
          B=/tmp/wand-stagee-wasm-tools/bin/wasm-bindgen
          W="$CARGO_TARGET_DIR/wasm32-unknown-unknown/release/ddv_save_core.wasm"
          for mode in off legacy legacy-mixed r01 r01-mixed r01-rm r01-steam r01-chest r01-comp r01-spatial r01-sr03 all; do
            case "$mode" in
              off) f=indexed-read ;;
              legacy) f=product-amount-scoped ;;
              legacy-mixed) f=product-amount-scoped,product-collection-scoped ;;
              r01) f=product-switch626-r01-scoped ;;
              r01-mixed) f=product-switch626-r01-scoped,product-collection-scoped ;;
              r01-rm) f=product-switch626-r01-scoped,product-switch626-rm01-scoped,product-collection-scoped ;;
              r01-steam) f=product-switch626-r01-scoped,product-steam626-chest-scoped,product-collection-scoped ;;
              r01-chest) f=product-switch626-r01-scoped,product-switch626-chest-scoped,product-collection-scoped ;;
              r01-comp) f=product-switch626-r01-scoped,product-steam626-comp03-scoped,product-collection-scoped ;;
              r01-spatial) f=product-switch626-r01-scoped,product-steam626-comp03-spatial-preview,product-collection-scoped ;;
              r01-sr03) f=product-switch626-r01-scoped,product-steam626-sr03-scoped,product-collection-scoped ;;
              all) f=product-switch626-r01-scoped,product-switch626-rm01-scoped,product-steam626-chest-scoped,product-switch626-chest-scoped,product-steam626-comp03-spatial-preview,product-steam626-sr03-scoped,product-collection-scoped ;;
            esac
            cargo build --locked --manifest-path crates/ddv-save-core/Cargo.toml --release --target wasm32-unknown-unknown --no-default-features --features "worker-wasm,$f"
            "$B" "$W" --out-dir "/tmp/comp-$mode" --target nodejs --no-typescript
          done
          sha256sum -c /tmp/qrc1711-lock.sha
          node --input-type=commonjs <<'JS'
          const assert=require('node:assert/strict'),fs=require('node:fs'),{createHash}=require('node:crypto');
          const cls=m=>require('/tmp/comp-'+m+'/ddv_save_core.js').WorkerWasmSource,sha=b=>createHash('sha256').update(b).digest('hex'),parse=JSON.parse;
          const steam=['steam-windows','steam-full-version','releases_1.25-v1.25.3-44-g0b41250d9ac0-incremental-22',626,true],sw=['switch','switch-bid','9A239D3DB569756D',626,true],item=40100038;
          const readers=['append_chunk','finish','read_core_version_witness','issue_typed_cursor','read_typed_page','issue_saved_diffgrids_typed_cursor','read_saved_diffgrids_typed_page','close'];
          const neutral=['toggle_scoped_edit','begin_scoped_edit_output','next_scoped_edit_output_chunk'],legacy=['discover_scoped_amount','preview_scoped_amount','stage_scoped_amount','toggle_scoped_amount','begin_scoped_amount_output','next_scoped_amount_output_chunk'],coll=['preview_scoped_collection_candidate','preview_fixed_collection','stage_fixed_collection'],comp=['preview_steam626_comp03','stage_steam626_comp03'],chest=['discover_switch626_chest','preview_switch626_chest','stage_switch626_chest'],sp=['preview_steam626_comp03_spatial'];
          const sr03=['preview_steam626_sr03','stage_steam626_sr03'];
          const rm=['preview_switch626_rm01','stage_switch626_rm01'];
          const r01=['preview_switch626_r01','stage_switch626_r01'];
          const modes=[['off',readers],['legacy',[...readers,...neutral,...legacy,...comp,...chest]],['legacy-mixed',[...readers,...neutral,...legacy,...comp,...chest,...coll]],['r01',[...readers,...neutral,...r01]],['r01-mixed',[...readers,...neutral,...r01]],...['r01-rm','r01-steam','r01-chest','r01-comp','r01-spatial','r01-sr03','all'].map(m=>[m,readers])];
          for(const [m,expect] of modes){
           const n=Object.getOwnPropertyNames(cls(m).prototype).filter(k=>!['constructor','free','__destroy_into_raw'].includes(k)).sort(),bytes=fs.readFileSync('/tmp/comp-'+m+'/ddv_save_core_bg.wasm'),ex=WebAssembly.Module.exports(new WebAssembly.Module(bytes)).map(v=>v.name);
           assert.deepEqual(n,expect.slice().sort(),m);assert.equal(ex.length,n.length+9,m);for(const k of n)assert.ok(ex.includes('workerwasmsource_'+k),m+' '+k);
           console.log('QRC1711_CENSUS '+m+' '+n.length+'/'+ex.length+' '+sha(bytes));
          }
          const raw=d=>Buffer.from(JSON.stringify(d).replace('"escaped":"keep"','"escaped":"\\u006beep"'));
          let nonce=0,pos=0,neg=0;const deny=(f,label)=>{assert.throws(f,undefined,label);neg++};
          function open(m,d,b=steam){const a=raw(d),w=new(cls(m))(...b,new Uint8Array(32).fill(++nonce));for(let i=0;i<a.length;i+=1048576)w.append_chunk(a.subarray(i,i+1048576));const r=parse(w.finish());assert.equal(r.decodedSha256,sha(a));return[w,r]}
          const sc=r=>[r.sessionId,BigInt(r.revision),BigInt(r.indexGeneration),r.decodedSha256];
          const G=90001,K=10,M=11,N=50,R=40100068,X=204,Y=116,ts='2026-01-01T00:00:00Z',Z='0'.repeat(64);
          const obj=(ID,X,Y,diag=false)=>({ID,ItemID:R,Orientation:'GridOrientation_Down',State:diag?{FenceMode:{Diagonal:true}}:null,X,Y});
          const grid=d=>d.World.GridCollection.Grids[G],entry=d=>d.Player.ListInventories[0].Inventory[R];
          const duty=id=>({State:'DutySlotState_OnGoing',DutyId:id,DifficultyLayer:0,ItemsUsed:[],StepData:{ItemFilter:{Data:{Type:'ItemType_Furniture',Item:0,ItemList:[],AnyActivityItem:false,Tags:[],MinRarity:1,MaxRarity:5}}}});
          const choice=id=>({ChooseItem:{RecurringEventItemID:2011100000,NextOccurrence:ts,EndDate:null,ChosenItemID:id}});
          const task=()=>({TaskState:'BattlePassTaskState_NotStarted',Objective:{CurAmount:0,TargetAmount:5,ItemIdsCollected:[],ItemFilter:{Data:{Item:0,ItemList:[],AnyActivityItem:false,Type:'ItemType_Clothing'}}}});
          function doc(){return {GameInfo:{Version:626},World:{Villages:[{Areas:{2:{Unlocked:true,GridIDs:[G]}}}],PlayerHouses:[],GridCollection:{Grids:{[G]:{ID:G,GridDataPath:'GridData/Villages/Village04-MeadowLevel-GridData.json',GridDefaultLayoutPath:'',TessellationFactor:2,NextGridObjectID:N,Objects:{[K]:obj(K,X,Y),[M]:obj(M,X+4,Y)}}},DiffGrids:{}},MissionSlots:{},RecurringEvents:{1:choice(31700067)},TimeLostTreasures:{},NextTimeLostTreasureID:1,Snippets:{},NextSnippetID:0},Player:{ListInventories:{0:{ID:0,CompatibleItemType:'ItemType_Furniture',CompatibleFurnitureTypes:{List:['FurnitureItemType_GroundAlteration']},Inventory:{[R]:{Amount:10,Marker:'ItemMarker_Favorite'}}}},ContainerInventories:{},AchievementsData:[],DutySlots:{0:{Slots:[duty(2110000201),duty(2110000208)]}},EvolveStatesProfile:{EvolveProgressState:{}},BattlePassStates:{Progress:{},FtueProgress:{TasksProgress:[task()],WeeklyTasksProgress:[]}}},ConditionalEventHistory:{ActiveEvents:{}},Opaque:{escaped:'keep',other:[1,2,3]}}}
          const scene=id=>({ItemSpawning:{RecurringEventItemID:id,NextOccurrence:ts,EndDate:null,LastOccurrence:null}});
          const crop=(id,fruit=false)=>({State:'DutySlotState_OnGoing',DutyId:id,DifficultyLayer:0,ItemsUsed:[],StepData:{ItemFilter:{Data:{Item:0,ItemList:[],Type:'ItemType_ActivityItem',ActivityItemType:'ActivityItemType_Crop',AnyActivityItem:false,...(fruit?{MaxUnlockLevel:100,CropType:'CropTypeCondition_Fruit'}:{})}}}});
          function rmDoc(id=2010000176,c=2110000038){const d=doc();d.World.RecurringEvents={1:scene(id)};d.Player.DutySlots={0:{Slots:[crop(c,c===2110000038)]}};return d}
          function rDoc(active){
           const d=rmDoc();const g=grid(d);delete g.Objects[M];g.Objects[K].X=0;g.Objects[K].Y=0;
           if(!active){d.World.RecurringEvents={};d.Player.DutySlots={};d.Player.BattlePassStates.FtueProgress.TasksProgress=[]}
           return d;
          }
          function oracle(d){
           const g=grid(d),old=JSON.stringify(g),o=JSON.stringify(g.Objects),tail=[0,4,8].map((dx,i)=>',"'+(N+i)+'":'+JSON.stringify(obj(N+i,X+dx,Y))).join('');
           const next=old.replace('"Objects":'+o,'"Objects":'+o.slice(0,-1)+tail+'}').replace('"NextGridObjectID":50','"NextGridObjectID":53');
           const want=Buffer.from(raw(d).toString().replace(old,next));
           const expected=structuredClone(d);for(const [i,dx] of [0,4,8].entries())grid(expected).Objects[N+i]=obj(N+i,X+dx,Y);
           grid(expected).NextGridObjectID=53;assert.deepEqual(JSON.parse(want),expected);assert.deepEqual(entry(expected),entry(d));
           return {want,p:{gridId:G,x:X,y:Y,expectedNextId:N,oldAmount:10,gridSha256:sha(Buffer.from(old)),inventoryEntrySha256:sha(Buffer.from(JSON.stringify(entry(d)))),projectedDecodedSha256:sha(want)}};
          }
          const rp=(w,r)=>parse(w.preview_switch626_r01(G,X,Y,...sc(r)));
          const rs=(w,r,p)=>parse(w.stage_switch626_r01(p.gridId,p.x,p.y,p.expectedNextId,p.oldAmount,p.gridSha256,p.inventoryEntrySha256,p.projectedDecodedSha256,...sc(r)));
          for(const mode of ['r01','r01-mixed']){
           for(const active of [false,true]){
            const d=rDoc(active),o=oracle(d),[w,r]=open(mode,d,sw),p=rp(w,r);
            assert.equal(p.contract,'wand.worker.switch626.scoped-r01-orthogonal-q3@1');for(const [k,v] of Object.entries(o.p))assert.equal(p[k],v,k);
            assert.equal(p.exactFieldChangedCount,4);assert.equal(p.inventoryDelta,0);assert.equal(p.newAmount,10);assert.equal(p.productWriterAuthorized,false);assert.equal(p.originalOverwriteAuthorized,false);
            if(!active){for(const [k,v] of [['gridSha256',Z],['inventoryEntrySha256',Z],['projectedDecodedSha256',Z],['oldAmount',9],['expectedNextId',51],['x',X+1],['y',Y+1]])deny(()=>rs(w,r,{...o.p,[k]:v}),'CAS '+k);
             deny(()=>rs(w,{...r,revision:1},o.p),'stale rev');deny(()=>rs(w,{...r,indexGeneration:2},o.p),'stale gen');
             const [f,fr]=open(mode,d,sw);deny(()=>rs(f,r,o.p),'foreign session');f.close();f.free();
             deny(()=>w.begin_scoped_edit_output(...sc(r)),'before stage');
            }
            const t=rs(w,r,o.p);assert.equal(t.exactFieldChangedCount,4);assert.equal(t.stagedDecodedSha256,sha(o.want));assert.equal(t.writerAuthorized,false);
            deny(()=>rs(w,r,o.p),'replay');const u=parse(w.toggle_scoped_edit(false,...sc(t)));deny(()=>w.begin_scoped_edit_output(...sc(u)),'undone');const v=parse(w.toggle_scoped_edit(true,...sc(u)));w.begin_scoped_edit_output(...sc(v));assert.deepEqual(Buffer.from(w.next_scoped_edit_output_chunk()),o.want);deny(()=>w.next_scoped_edit_output_chunk(),'once');w.close();w.free();pos++;
           }
           for(const [label,mut] of [
            ['existing seed',q=>{grid(q).Objects[K].X=X;grid(q).Objects[K].Y=Y}],
            ['fresh id',q=>q.Opaque.Ref={GridID:G,GridObjectID:N+2}],
            ['foreign grid',q=>q.World.Villages[0].Areas[2].Unlocked=false],
            ['unknown recurring',q=>q.World.RecurringEvents={1:{Unknown:{}}}],
            ['wrong stock marker',q=>entry(q).Marker='ItemMarker_None'],
            ['stock zero',q=>entry(q).Amount=0],
            ['active BP',q=>q.Player.BattlePassStates.FtueProgress.TasksProgress=[{...task(),TaskState:'BattlePassTaskState_OnGoing'}]]
           ]){const q=rDoc(false);mut(q);const [w,r]=open(mode,q,sw);deny(()=>rp(w,r),label);w.close();w.free()}
           const [w,r]=open(mode,rDoc(false),steam);deny(()=>rp(w,r),'foreign Steam');w.close();w.free();
          }
          for(const m of ['r01-rm','r01-steam','r01-chest','r01-comp','r01-spatial','r01-sr03','all'])for(const b of [steam,sw]){
           const [w,r]=open(m,rDoc(false),b);assert.equal(typeof w.stage_switch626_r01,'undefined');assert.equal(typeof w.stage_switch626_rm01,'undefined');assert.equal(typeof w.begin_scoped_edit_output,'undefined');w.close();w.free();
          }
          assert.equal(pos,4);assert.equal(neg,50);console.log('QRC1711_R01_ACTUAL '+pos+'POS '+neg+'NEG 12CENSUS');
          JS

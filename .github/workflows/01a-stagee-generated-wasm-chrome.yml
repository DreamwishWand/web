name: 01A Stage E Genuine Generated Rust WASM Chrome Worker (Writer OFF)
on:
  pull_request:
    paths:
      - '.github/workflows/01a-stagee-generated-wasm-chrome.yml'
permissions:
  contents: read
jobs:
  genuine-wasm-chrome-worker:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_TARGET_DIR: /tmp/wand-stagee-cargo-target
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: QA ONLY FRP624 changed internal Stage independent exact7
        run: |
          set -euo pipefail
          cargo generate-lockfile --manifest-path crates/ddv-save-core/Cargo.toml
          sha256sum crates/ddv-save-core/Cargo.lock > /tmp/qrc1885-lock.sha
          cargo test --locked --manifest-path crates/ddv-save-core/Cargo.toml --features product-switch624-frp01-stage-internal --lib qa1885_counter51_exact7_lexical_cas -- --nocapture
          cargo test --locked --manifest-path crates/ddv-save-core/Cargo.toml --features product-switch624-frp01-stage-internal --lib qa1885_reopen_child_independent -- --nocapture
          cargo test --locked --manifest-path crates/ddv-save-core/Cargo.toml --features product-switch624-frp01-stage-internal --lib qa1885_counter_unsafe_negatives -- --nocapture
          sha256sum -c /tmp/qrc1885-lock.sha

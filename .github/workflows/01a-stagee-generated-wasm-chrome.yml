name: 01A Stage E Genuine Generated Rust WASM Chrome Worker (Writer OFF)
on:
  pull_request:
    paths:
      - 'tests/stage-e/**'
      - 'scripts/wasm-distribution/**'
      - 'src/lib/ddv/core/save/product-rust-wasm-candidate-loader.mjs'
      - '.github/workflows/01a-stagee-generated-wasm-chrome.yml'
      - 'crates/ddv-save-core/**'
      - 'src/lib/ddv/core/save/product-wasm-read-owner.mjs'
  push:
    branches:
      - 'core/real-wasm-browser-smoke-stagee-*'
permissions:
  contents: read
jobs:
  genuine-wasm-chrome-worker:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_TARGET_DIR: /tmp/wand-stagee-cargo-target
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Verify real Chrome and exact pinned wasm-bindgen crate
        run: |
          set -euo pipefail
          command -v google-chrome || command -v chromium
          grep -Fx 'wasm-bindgen = { version = "=0.2.105", optional = true }' crates/ddv-save-core/Cargo.toml
          grep -Fx 'worker-wasm = ["dep:wasm-bindgen"]' crates/ddv-save-core/Cargo.toml
          grep -Fx 'indexed-read = []' crates/ddv-save-core/Cargo.toml
      - name: Compile REAL cdylib with opt-in Worker and indexed metadata
        run: |
          cargo build --manifest-path crates/ddv-save-core/Cargo.toml --release --target wasm32-unknown-unknown --features worker-wasm,indexed-read
          test -s "$CARGO_TARGET_DIR/wasm32-unknown-unknown/release/ddv_save_core.wasm"
      - name: Install exactly matching wasm-bindgen CLI 0.2.105 (not generated or mocked JS)
        run: |
          cargo install wasm-bindgen-cli --version 0.2.105 --locked --root /tmp/wand-stagee-wasm-tools
          /tmp/wand-stagee-wasm-tools/bin/wasm-bindgen --version | grep -F '0.2.105'
      - name: Generate true wasm-bindgen Browser Worker ESM glue
        run: |
          mkdir -p tests/stage-e/pkg
          /tmp/wand-stagee-wasm-tools/bin/wasm-bindgen "$CARGO_TARGET_DIR/wasm32-unknown-unknown/release/ddv_save_core.wasm" --out-dir tests/stage-e/pkg --target web --no-typescript
          test -s tests/stage-e/pkg/ddv_save_core.js
          test -s tests/stage-e/pkg/ddv_save_core_bg.wasm
          ! grep -R -E 'STEAM_SAVE_OWNER_PRIVATE|include_bytes!|writerAuthorized: *true|applyAuthorized: *true' tests/stage-e
      - name: Actual browser CDP + module Worker + Rust WASM positive and negatives
        run: node tests/stage-e/chrome-smoke.mjs
      - name: Confirm Stage E never changed product Writer or public worker route
        run: |
          ! git diff --name-only "$GITHUB_BASE_REF" 2>/dev/null | grep -E 'local-timing-read.worker|community|provider|p1g' || true
          test -f src/lib/ddv/core/save/product-wasm-read-owner.mjs
          test -f crates/ddv-save-core/src/wasm_worker.rs

      - name: QA ONLY ACT1155 dual Build backpack exact3
        run: |
          set -euo pipefail
          B=/tmp/wand-stagee-wasm-tools/bin/wasm-bindgen
          W="$CARGO_TARGET_DIR/wasm32-unknown-unknown/release/ddv_save_core.wasm"
          "$B" "$W" --out-dir /tmp/bp-off --target nodejs --no-typescript
          cargo build --locked --manifest-path crates/ddv-save-core/Cargo.toml --release --target wasm32-unknown-unknown --no-default-features --features worker-wasm,product-backpack-scoped,product-collection-scoped
          "$B" "$W" --out-dir /tmp/bp-on --target nodejs --no-typescript
          node <<'JS'
          const assert=require('node:assert/strict'),{createHash}=require('node:crypto');
          const C=require('/tmp/bp-on/ddv_save_core.js').WorkerWasmSource,Off=require('/tmp/bp-off/ddv_save_core.js').WorkerWasmSource;
          const builds=[['steam-windows','steam-full-version','releases_1.25-v1.25.3-44-g0b41250d9ac0-incremental-22',626,true],['switch','switch-bid','9A239D3DB569756D',626,true]];
          const names=['steam626','switch626'],sha=b=>createHash('sha256').update(b).digest('hex'),raw=d=>Buffer.from(JSON.stringify(d,null,2)),item=30200001;
          const doc=(old=4)=>({GameInfo:{Version:626},World:{Unknown:{keep:1}},Player:{ContainerInventories:{0:{ID:0,Size:4,ExtraSize:1,BelongsToPlayer:true,BlockMoveTo:false,ParentItemID:null,Inventory:[{ItemID:item,Amount:old,State:null,Unknown:'keep'},{ItemID:0,Amount:0,State:null},{ItemID:0,Amount:0,State:null},{ItemID:0,Amount:0,State:null}]}}},Opaque:{escaped:'\\u0000',pad:'x'.repeat(1100000)}});
          let nonce=0,pos=0,neg=0,red=[];
          function open(d,b){const w=new C(...b,new Uint8Array(32).fill(++nonce)),x=raw(d);for(let i=0;i<x.length;i+=1048576)w.append_chunk(x.subarray(i,i+1048576));const r=JSON.parse(w.finish());assert.equal(r.decodedSha256,sha(x));return [w,r]}
          const sc=r=>[r.sessionId,BigInt(r.revision),BigInt(r.indexGeneration),r.decodedSha256],parse=JSON.parse;
          const pv=(w,r,i,s=0,d=1)=>parse(w['preview_'+names[i]+'_backpack_split'](s,d,...sc(r)));
          const st=(w,r,i,p,s=0,d=1,old=p.oldAmount)=>parse(w['stage_'+names[i]+'_backpack_split'](s,d,old,p.witnessSha256,p.projectedDecodedSha256,...sc(r)));
          const inv=d=>d.Player.ContainerInventories[0].Inventory,rec=d=>d.Player.ContainerInventories[0];
          const deny=f=>{assert.throws(f);neg++};
          for(const n of names){assert.equal(typeof Off.prototype['preview_'+n+'_backpack_split'],'undefined');assert.equal(typeof Off.prototype['stage_'+n+'_backpack_split'],'undefined');}
          for(let i=0;i<2;i++){
            const d=doc(i?50:4),dst=i?2:1,[w,r]=open(d,builds[i]),p=pv(w,r,i,0,dst),want=structuredClone(d);
            inv(want)[0].Amount--;inv(want)[dst].ItemID=item;inv(want)[dst].Amount=1;
            assert.equal(p.projectedDecodedSha256,sha(raw(want)));assert.equal(p.oldAmount,inv(d)[0].Amount);assert.equal(p.writerAuthorized,false);
            deny(()=>pv(w,r,1-i));deny(()=>pv(w,r,i,0,0));deny(()=>pv(w,r,i,0,3));deny(()=>st(w,r,i,p,0,dst,p.oldAmount-1));
            deny(()=>st(w,r,i,{...p,witnessSha256:'0'.repeat(64)},0,dst));deny(()=>st(w,r,i,{...p,projectedDecodedSha256:'1'.repeat(64)},0,dst));
            const [other,rr]=open(d,builds[i]);deny(()=>st(other,rr,i,p,0,dst));other.close();other.free();
            const t=st(w,r,i,p,0,dst);assert.equal(t.exactFieldChangedCount,3);assert.equal(t.stagedDecodedSha256,sha(raw(want)));assert.equal(t.originalOverwriteAuthorized,false);
            deny(()=>st(w,r,i,p,0,dst));deny(()=>w.toggle_scoped_amount(false,...sc(t)));const u=parse(w.toggle_scoped_edit(false,...sc(t)));deny(()=>w.begin_scoped_edit_output(...sc(u)));const v=parse(w.toggle_scoped_edit(true,...sc(u)));deny(()=>w.begin_scoped_amount_output(...sc(v)));
            const o=parse(w.begin_scoped_edit_output(...sc(v)));assert.equal(o.decodedSha256,sha(raw(want)));assert.deepEqual(Buffer.concat([Buffer.from(w.next_scoped_edit_output_chunk()),Buffer.from(w.next_scoped_edit_output_chunk())]),raw(want));deny(()=>w.next_scoped_edit_output_chunk());w.close();w.free();pos++;
          }
          const cases=[
            ['source-one',d=>inv(d)[0].Amount=1],['source-over-cap',d=>inv(d)[0].Amount=51],['wrong-fruit',d=>inv(d)[0].ItemID=30200000],
            ['occupied-dest',d=>{inv(d)[1].ItemID=item;inv(d)[1].Amount=1}],['nonzero-empty',d=>inv(d)[1].Amount=1],
            ['source-state',d=>inv(d)[0].State={}],['dest-state',d=>delete inv(d)[1].State],['parent',d=>rec(d).ParentItemID=40000001],
            ['block',d=>rec(d).BlockMoveTo=true],['owner',d=>rec(d).BelongsToPlayer=false],['size',d=>rec(d).Size=3],['reserved',d=>rec(d).ExtraSize=3],
            ['alias',d=>{d.Player.ContainerInventories['00']=rec(d)}],['id',d=>rec(d).ID=1],
            ['container-ref',d=>d.Opaque.ref={ContainerInventoryID:0}],['slot-index',d=>d.Opaque.ref={SlotIndex:1}],['inventory-position',d=>d.Opaque.ref={InventoryPosition:1}]
          ];
          for(let i=0;i<2;i++){const [good,gr]=open(doc(),builds[i]),p=pv(good,gr,i);good.close();good.free();for(const [label,mut] of cases){const d=doc();d.Opaque={};mut(d);let w;try{let r;[w,r]=open(d,builds[i]);let a=false,b=false;try{pv(w,r,i);a=true}catch{}try{st(w,r,i,p);b=true}catch{}if(a||b)red.push({i,label,a,b});else neg++;}catch(e){red.push({i,label,error:String(e)})}finally{if(w){w.close();w.free()}}}}
          console.log('ACT1155_BACKPACK_PRODUCT '+pos+'POS '+neg+'NEG RED='+JSON.stringify(red));assert.equal(pos,2);assert.equal(neg,58);assert.deepEqual(red,[]);
          JS

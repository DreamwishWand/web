name: 01A Stage E Genuine Generated Rust WASM Chrome Worker (Writer OFF)
on:
  pull_request:
    paths:
      - '.github/workflows/01a-stagee-generated-wasm-chrome.yml'
permissions:
  contents: read
jobs:
  genuine-wasm-chrome-worker:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_TARGET_DIR: /tmp/wand-stagee-cargo-target
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: QRC1573 changed cumulative generated ABI and domain routing
        run: |
          set -euo pipefail
          cargo generate-lockfile --manifest-path crates/ddv-save-core/Cargo.toml
          sha256sum crates/ddv-save-core/Cargo.lock | tee /tmp/cumulative-lock.sha
          cargo install wasm-bindgen-cli --version 0.2.105 --locked --root /tmp/wand-stagee-wasm-tools
          B=/tmp/wand-stagee-wasm-tools/bin/wasm-bindgen
          W="$CARGO_TARGET_DIR/wasm32-unknown-unknown/release/ddv_save_core.wasm"
          build_mode() {
            cargo build --locked --manifest-path crates/ddv-save-core/Cargo.toml --release --target wasm32-unknown-unknown --no-default-features --features "worker-wasm,$2"
            "$B" "$W" --out-dir "/tmp/cumulative-$1" --target nodejs --no-typescript
          }
          build_mode 'off' 'indexed-read'
          build_mode 'legacy-amount' 'product-amount-scoped'
          build_mode 'legacy-collection' 'product-amount-scoped,product-collection-scoped'
          build_mode 'steam626-chest' 'product-steam626-chest-scoped'
          build_mode 'steam626-chest-mixed' 'product-steam626-chest-scoped,product-collection-scoped,product-backpack-scoped,product-wardrobe-scoped'
          build_mode 'switch626-chest' 'product-switch626-chest-scoped'
          build_mode 'switch626-chest-mixed' 'product-switch626-chest-scoped,product-collection-scoped,product-backpack-scoped,product-wardrobe-scoped'
          build_mode 'steam626-backpack' 'product-steam626-backpack-scoped'
          build_mode 'steam626-backpack-mixed' 'product-steam626-backpack-scoped,product-collection-scoped,product-backpack-scoped,product-wardrobe-scoped'
          build_mode 'switch626-backpack' 'product-switch626-backpack-scoped'
          build_mode 'switch626-backpack-mixed' 'product-switch626-backpack-scoped,product-collection-scoped,product-backpack-scoped,product-wardrobe-scoped'
          build_mode 'steam626-wardrobe' 'product-steam626-wardrobe-scoped'
          build_mode 'steam626-wardrobe-mixed' 'product-steam626-wardrobe-scoped,product-collection-scoped,product-backpack-scoped,product-wardrobe-scoped'
          build_mode 'switch626-wardrobe' 'product-switch626-wardrobe-scoped'
          build_mode 'switch626-wardrobe-mixed' 'product-switch626-wardrobe-scoped,product-collection-scoped,product-backpack-scoped,product-wardrobe-scoped'
          build_mode 'pair-0-1' 'product-steam626-chest-scoped,product-switch626-chest-scoped'
          build_mode 'pair-0-2' 'product-steam626-chest-scoped,product-steam626-backpack-scoped'
          build_mode 'pair-0-3' 'product-steam626-chest-scoped,product-switch626-backpack-scoped'
          build_mode 'pair-0-4' 'product-steam626-chest-scoped,product-steam626-wardrobe-scoped'
          build_mode 'pair-0-5' 'product-steam626-chest-scoped,product-switch626-wardrobe-scoped'
          build_mode 'pair-1-2' 'product-switch626-chest-scoped,product-steam626-backpack-scoped'
          build_mode 'pair-1-3' 'product-switch626-chest-scoped,product-switch626-backpack-scoped'
          build_mode 'pair-1-4' 'product-switch626-chest-scoped,product-steam626-wardrobe-scoped'
          build_mode 'pair-1-5' 'product-switch626-chest-scoped,product-switch626-wardrobe-scoped'
          build_mode 'pair-2-3' 'product-steam626-backpack-scoped,product-switch626-backpack-scoped'
          build_mode 'pair-2-4' 'product-steam626-backpack-scoped,product-steam626-wardrobe-scoped'
          build_mode 'pair-2-5' 'product-steam626-backpack-scoped,product-switch626-wardrobe-scoped'
          build_mode 'pair-3-4' 'product-switch626-backpack-scoped,product-steam626-wardrobe-scoped'
          build_mode 'pair-3-5' 'product-switch626-backpack-scoped,product-switch626-wardrobe-scoped'

            const oldGrid=JSON.stringify(gr),newGrid=oldGrid.replace('"Objects":'+obj,'"Objects":'+obj.slice(0,-1)+tail+'}').replace('"NextGridObjectID":'+N,'"NextGridObjectID":'+(N+coords.length));
            let want=raw(d).toString().replace(oldGrid,newGrid);if(isVase)want=want.replace('"Amount":3,"Marker":"ItemMarker_None"','"Amount":2,"Marker":"ItemMarker_None"');
            const p=isVase?{gridId:G,x:pv[0],y:pv[1],oldAmount:3,nextObjectId:N,entrySha256:sha(Buffer.from(JSON.stringify(entry))),gridSha256:sha(Buffer.from(oldGrid)),projectedDecodedSha256:sha(Buffer.from(want))}:{gridId:G,seedId:82,oldAmount:99,nextObjectId:N,gridSha256:sha(Buffer.from(oldGrid)),seedSha256:sha(Buffer.from(JSON.stringify(gr.Objects[82]))),inventoryEntrySha256:sha(Buffer.from(JSON.stringify(entry))),projectedDecodedSha256:sha(Buffer.from(want))};
            const expected=structuredClone(d);coords.forEach(([X,Y],i)=>expected.World.GridCollection.Grids[G].Objects[N+i]={ID:N+i,ItemID:item,Orientation:isVase?'GridOrientation_Up':'GridOrientation_Down',State:null,X,Y});expected.World.GridCollection.Grids[G].NextGridObjectID+=coords.length;if(isVase)expected.Player.ListInventories[0].Inventory[item].Amount--;
            assert.deepEqual(JSON.parse(want),expected);return {p,want:Buffer.from(want)};}
          const realm='Worlds!InsideOut!DreamProductions',layout='SceneLayouts/Realms/InsideOut/DreamProductions/InsideOut-DreamProductions-DefaultLayout.json';
          const p1='GridData/Worlds/InsideOut_DreamProductions_Stage-GridData.json',p2='GridData/Worlds/InsideOut_DreamProductions_Puzzle02-GridData.json';
          const row=(m,s,u,g,a)=>({MissionItemID:m,StepID:s,SubStepID:u,GridIDs:[g],AnswerGridIDs:[a]});
          function puzzle(d){const c=d.World.GridCollection;c.Grids[7701]={...aux(7701),GridDataPath:p1};c.Grids[7702]={...aux(7702),GridDataPath:p2};c.DiffGrids[7703]={ID:7703,GridDefaultLayoutPath:layout};d.World.Realms={[realm]:{GridIDs:[7701,7703,7702],SceneryPuzzles:[row(2070001289,2,1,0,0),row(2070001290,13,0,2,2)]}};d.World.SceneryPuzzles=[row(2070001289,2,1,7701,0),row(2070001290,13,0,7702,2)];}
          const methods=['preview_steam626_comp03','stage_steam626_comp03','toggle_scoped_edit','begin_scoped_edit_output','next_scoped_edit_output_chunk'];
          const hidden=['discover_scoped_amount','preview_scoped_amount','stage_scoped_amount','toggle_scoped_amount','begin_scoped_amount_output','next_scoped_amount_output_chunk','preview_scoped_collection_candidate','preview_fixed_collection','stage_fixed_collection'];
          let yes=0,no=0;for(const mode of ['release','mixed']){const names=Object.getOwnPropertyNames(cls(mode).prototype).filter(n=>!['constructor','free','__destroy_into_raw'].includes(n));const exps=WebAssembly.Module.exports(new WebAssembly.Module(fs.readFileSync('/tmp/comp-'+mode+'/ddv_save_core_bg.wasm')));assert.equal(names.length,13);assert.equal(exps.length,22);for(const n of methods)assert.ok(names.includes(n),n);for(const n of hidden)assert.ok(!names.includes(n),n);const d=base();d.Opaque={escaped:'keep'};puzzle(d);const o=oracle(d),[w,r]=open(mode,d),p=actualPreview(w,r),deny=f=>{assert.throws(f);no++};assert.equal(p.projectedDecodedSha256,sha(o.want));deny(()=>stage(w,r,{...o.p,gridSha256:'0'.repeat(64)}));deny(()=>stage(w,r,{...o.p,oldAmount:98}));const t=stage(w,r,o.p);assert.equal(t.exactFieldChangedCount,9);deny(()=>stage(w,r,o.p));const u=parse(w.toggle_scoped_edit(false,...sc(t)));deny(()=>w.begin_scoped_edit_output(...sc(u)));const v=parse(w.toggle_scoped_edit(true,...sc(u)));w.begin_scoped_edit_output(...sc(v));assert.deepEqual(Buffer.from(w.next_scoped_edit_output_chunk()),o.want);deny(()=>w.next_scoped_edit_output_chunk());w.close();w.free();const [x,y]=open(mode,d,sw);deny(()=>actualPreview(x,y));x.close();x.free();yes++;}

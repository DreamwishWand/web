name: 01A Stage E Genuine Generated Rust WASM Chrome Worker (Writer OFF)
on:
  pull_request:
    paths:
      - '.github/workflows/01a-stagee-generated-wasm-chrome.yml'
permissions:
  contents: read
jobs:
  genuine-wasm-chrome-worker:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_TARGET_DIR: /tmp/wand-stagee-cargo-target
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: QA ONLY generated FRP01 read-only admission
        run: |
          set -euo pipefail
          cargo generate-lockfile --manifest-path crates/ddv-save-core/Cargo.toml
          sha256sum crates/ddv-save-core/Cargo.lock | tee /tmp/qrc-lock.sha
          cargo test --locked --manifest-path crates/ddv-save-core/Cargo.toml --features product-switch624-frp01-readonly --lib qa1852_synthetic_fixture
          cargo install wasm-bindgen-cli --version 0.2.105 --locked --root /tmp/wand-stagee-wasm-tools
          for m in off legacy own rm mixed; do
            case "$m" in
              off) f=indexed-read ;;
              legacy) f=product-amount-scoped ;;
              own) f=product-switch624-frp01-readonly ;;
              rm) f=product-switch626-rm01-scoped ;;
              mixed) f=product-switch624-frp01-readonly,product-switch626-rm01-scoped ;;
            esac
            cargo build --locked --manifest-path crates/ddv-save-core/Cargo.toml --release --target wasm32-unknown-unknown --no-default-features --features "worker-wasm,$f"
            /tmp/wand-stagee-wasm-tools/bin/wasm-bindgen "$CARGO_TARGET_DIR/wasm32-unknown-unknown/release/ddv_save_core.wasm" --out-dir "/tmp/frp-$m" --target nodejs --no-typescript
          done
          sha256sum -c /tmp/qrc-lock.sha
          node --input-type=commonjs <<'JS'
          const a=require('node:assert/strict'),fs=require('node:fs'),{createHash}=require('node:crypto');
          const sha=b=>createHash('sha256').update(b).digest('hex'),cls=m=>require('/tmp/frp-'+m+'/ddv_save_core.js').WorkerWasmSource,methods=m=>Object.getOwnPropertyNames(cls(m).prototype).filter(k=>!['constructor','free','__destroy_into_raw'].includes(k)).sort();
          const readers=['append_chunk','finish','read_core_version_witness','issue_typed_cursor','read_typed_page','issue_saved_diffgrids_typed_cursor','read_saved_diffgrids_typed_page','close'],extra=['finish_switch624_frp01_readonly','read_switch624_frp01_target'];
          a.deepEqual(methods('off'),readers.sort());a.deepEqual(methods('own'),[...methods('legacy'),...extra].sort());a.deepEqual(methods('mixed'),[...methods('rm'),...extra].sort());
          for(const m of ['off','legacy','own','rm','mixed']){const n=methods(m),b=fs.readFileSync('/tmp/frp-'+m+'/ddv_save_core_bg.wasm'),ex=WebAssembly.Module.exports(new WebAssembly.Module(b)).map(x=>x.name);a.equal(ex.length,n.length+9);for(const k of n)a.ok(ex.includes('workerwasmsource_'+k));console.log('QRC1852_CENSUS '+m+' '+n.length+'/'+ex.length+' '+sha(b));}
          const raw=fs.readFileSync('/tmp/qrc1852-input.json'),d=JSON.parse(raw),sw=['switch','switch-bid','52BD625D9B4E0053',624,true],sw626=['switch','switch-bid','9A239D3DB569756D',626,true],steam=['steam-windows','steam-full-version','releases_1.25-v1.25.3-44-g0b41250d9ac0-incremental-22',626,true];let seed=0,neg=0;
          function open(m,b=sw,bytes=raw){const w=new(cls(m))(...b,new Uint8Array(32).fill(++seed));w.append_chunk(bytes);return w}
          const sc=r=>[r.sessionId,BigInt(r.revision),BigInt(r.indexGeneration),r.decodedSha256],deny=f=>{a.throws(f);neg++},hash=v=>sha(Buffer.from(JSON.stringify(v)));
          for(const m of ['own','mixed']){
            const w=open(m),r=JSON.parse(w.finish_switch624_frp01_readonly());a.equal(r.schema,624);a.equal(r.operation,'switch624-frp01-readonly');a.equal(r.decodedSha256,sha(raw));a.equal(r.productWorkerBound,true);for(const k of ['writerAuthorized','editedCopyAuthorized','applyAuthorized','productReadAccepted'])a.equal(r[k],false);
            const read=(r0=r,ids=[10,11,12],w0=w)=>JSON.parse(w0.read_switch624_frp01_target(90001,...ids,...sc(r0))),t=read(),g=d.World.GridCollection.Grids[90001];
            a.equal(t.nextGridObjectId,50);a.deepEqual(t.oldIds,[10,11,12]);a.equal(t.oldStock,10);a.equal(t.newStock,20);a.equal(t.gridSha256,hash(g));a.equal(t.rootSha256,hash(d.World.Villages[0].Areas[2]));a.deepEqual(t.oldRowsSha256,[10,11,12].map(i=>hash(g.Objects[i])));a.equal(t.writerAuthorized,false);
            deny(()=>w.finish());deny(()=>w.finish_switch624_frp01_readonly());deny(()=>w.append_chunk(raw));deny(()=>w.read_core_version_witness(...sc(r)));deny(()=>read({...r,revision:1}));deny(()=>read({...r,indexGeneration:2}));deny(()=>read({...r,decodedSha256:'0'.repeat(64)}));deny(()=>read(r,[10,11,11]));
            const f=open(m),fr=JSON.parse(f.finish_switch624_frp01_readonly());a.notEqual(r.sessionId,fr.sessionId);deny(()=>read(r,[10,11,12],f));f.close();f.free();
            if(m==='own'){deny(()=>w.preview_scoped_amount('catalog0Furniture',0,40700246,9,...sc(r)));deny(()=>w.stage_scoped_amount('catalog0Furniture',0,40700246,10,9,'0'.repeat(64),...sc(r)));deny(()=>w.begin_scoped_edit_output(...sc(r)));}
            else{deny(()=>w.preview_switch626_rm01(90001,10,11,...sc(r)));deny(()=>w.stage_switch626_rm01(90001,10,11,50,10,'0'.repeat(64),'0'.repeat(64),'0'.repeat(64),...sc(r)));deny(()=>w.begin_switch626_rm01_output(...sc(r)));}
            w.close();deny(()=>read());w.free();
          }
          for(const b of [sw626,steam,['switch','switch-bid','52BD625D9B4E0053',624,false],['switch','switch-bid','0000000000000000',624,true],['switch','switch-bid','52BD625D9B4E0053',626,true]]){const w=open('own',b);deny(()=>w.finish_switch624_frp01_readonly());deny(()=>w.append_chunk(raw));w.free();}
          const wrong=structuredClone(d);wrong.GameInfo.Version=626;const dup=Buffer.from('{"GameInfo":{"Version":624,"Version":624},"Player":{},"World":{}}');for(const b of [Buffer.from(JSON.stringify(wrong)),dup]){const w=open('own',sw,b);deny(()=>w.finish_switch624_frp01_readonly());w.free();}
          const generic=open('own');deny(()=>generic.finish());deny(()=>generic.finish_switch624_frp01_readonly());generic.free();
          const b626=Buffer.from(JSON.stringify(wrong)),w626=open('mixed',sw626,b626),r626=JSON.parse(w626.finish());a.equal(r626.schema,626);a.equal(r626.decodedSha256,sha(b626));deny(()=>w626.finish_switch624_frp01_readonly());deny(()=>w626.read_switch624_frp01_target(90001,10,11,12,...sc(r626)));w626.close();w626.free();
          console.log('QRC1852_FRP624_ADMISSION_ACTUAL 3POS '+neg+'NEG 5CENSUS READONLY');a.equal(neg,42);
          JS

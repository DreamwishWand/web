name: 01A Stage E Genuine Generated Rust WASM Chrome Worker (Writer OFF)
on:
  pull_request:
    paths:
      - 'tests/stage-e/**'
      - 'scripts/wasm-distribution/**'
      - 'src/lib/ddv/core/save/product-rust-wasm-candidate-loader.mjs'
      - '.github/workflows/01a-stagee-generated-wasm-chrome.yml'
      - 'crates/ddv-save-core/**'
      - 'src/lib/ddv/core/save/product-wasm-read-owner.mjs'
  push:
    branches:
      - 'core/real-wasm-browser-smoke-stagee-*'
permissions:
  contents: read
jobs:
  genuine-wasm-chrome-worker:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_TARGET_DIR: /tmp/wand-stagee-cargo-target
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Verify real Chrome and exact pinned wasm-bindgen crate
        run: |
          set -euo pipefail
          command -v google-chrome || command -v chromium
          grep -Fx 'wasm-bindgen = { version = "=0.2.105", optional = true }' crates/ddv-save-core/Cargo.toml
          grep -Fx 'worker-wasm = ["dep:wasm-bindgen"]' crates/ddv-save-core/Cargo.toml
          grep -Fx 'indexed-read = []' crates/ddv-save-core/Cargo.toml
      - name: Compile REAL cdylib with opt-in Worker and indexed metadata
        run: |
          cargo build --manifest-path crates/ddv-save-core/Cargo.toml --release --target wasm32-unknown-unknown --features worker-wasm,indexed-read
          test -s "$CARGO_TARGET_DIR/wasm32-unknown-unknown/release/ddv_save_core.wasm"
      - name: Install exactly matching wasm-bindgen CLI 0.2.105 (not generated or mocked JS)
        run: |
          cargo install wasm-bindgen-cli --version 0.2.105 --locked --root /tmp/wand-stagee-wasm-tools
          /tmp/wand-stagee-wasm-tools/bin/wasm-bindgen --version | grep -F '0.2.105'
      - name: Generate true wasm-bindgen Browser Worker ESM glue
        run: |
          mkdir -p tests/stage-e/pkg
          /tmp/wand-stagee-wasm-tools/bin/wasm-bindgen "$CARGO_TARGET_DIR/wasm32-unknown-unknown/release/ddv_save_core.wasm" --out-dir tests/stage-e/pkg --target web --no-typescript
          test -s tests/stage-e/pkg/ddv_save_core.js
          test -s tests/stage-e/pkg/ddv_save_core_bg.wasm
          ! grep -R -E 'STEAM_SAVE_OWNER_PRIVATE|include_bytes!|writerAuthorized: *true|applyAuthorized: *true' tests/stage-e
      - name: Actual browser CDP + module Worker + Rust WASM positive and negatives
        run: node tests/stage-e/chrome-smoke.mjs
      - name: Confirm Stage E never changed product Writer or public worker route
        run: |
          ! git diff --name-only "$GITHUB_BASE_REF" 2>/dev/null | grep -E 'local-timing-read.worker|community|provider|p1g' || true
          test -f src/lib/ddv/core/save/product-wasm-read-owner.mjs
          test -f crates/ddv-save-core/src/wasm_worker.rs
      - name: QA ONLY repaired placement typed reference scope ACT1108
        run: |
          set -euo pipefail
          B=/tmp/wand-stagee-wasm-tools/bin/wasm-bindgen
          W="$CARGO_TARGET_DIR/wasm32-unknown-unknown/release/ddv_save_core.wasm"
          "$B" "$W" --out-dir /tmp/vase-off --target nodejs --no-typescript
          for mode in both; do
            features=worker-wasm,product-amount-scoped
            if [ "$mode" = both ]; then features="$features,product-collection-scoped"; fi
            cargo build --locked --manifest-path crates/ddv-save-core/Cargo.toml --release --target wasm32-unknown-unknown --no-default-features --features "$features"
            "$B" "$W" --out-dir "/tmp/vase-$mode" --target nodejs --no-typescript
          done
          node --input-type=commonjs <<'JS'
          const assert=require('node:assert/strict'),fs=require('node:fs'),{createHash}=require('node:crypto');
          const cls=m=>require('/tmp/vase-'+m+'/ddv_save_core.js').WorkerWasmSource,sha=b=>createHash('sha256').update(b).digest('hex');
          const steam=['steam-windows','steam-full-version','releases_1.25-v1.25.3-44-g0b41250d9ac0-incremental-22',626,true],sw=['switch','switch-bid','9A239D3DB569756D',626,true],item=40000066;
          const data=fs.readFileSync('crates/ddv-save-core/data/steam626-vase-geometry-quota.jsonl','utf8').trim().split('\n').slice(1).map(JSON.parse);
          const bits=Buffer.concat(data.filter(x=>x[0]==='floor').map(x=>Buffer.from(x[2],'hex')));
          const floor=(x,y)=>{if(x<2||x+4>250||y<2||y+4>175)return false;for(let i=x-2;i<x+4;i++)for(let j=y-2;j<y+4;j++){const n=i*175+j;if(!(bits[n>>3]&(1<<(n%8))))return false;}return true};
          let poses=[];for(let x=2;x<247;x++)for(let y=2;y<172;y++)if(floor(x,y))poses.push([x*2,y*2]);assert.equal(poses.length,9299);
          const [x,y]=poses[0], [x2,y2]=poses[poses.length-1];
          const sup=JSON.parse(fs.readFileSync('crates/ddv-save-core/data/steam626-placement-applicable-supplement.json','utf8'));
          const [eventId]=Object.entries(sup.recurring).find(([k,v])=>v[0]==='ItemSpawning'&&v[2]==='offline-preserve');
          function doc(gid=7,next=9,x=x2,y=y2){
            const ox=x<250?480:2,oy=y<175?330:2;
            return {GameInfo:{Version:626},World:{Villages:[{Areas:{6:{Unlocked:true,GridIDs:[gid]}},VillageObjectLimitName:'Village04ObjectLimit',HighEndVillageObjectLimitName:'HighEndVillageObjectLimit',BoughtObjectLimit:{UniqueLimit:0,InstanceLimit:0,Exclusions:[],SpecificItemLimits:[]}}],FloatingIslands:{},ExtraLimitObject:false,GridCollection:{Grids:{[gid]:{ID:gid,GridDataPath:'GridData/Villages/Village04-DarkLevel-GridData.json',GridDefaultLayoutPath:'',TessellationFactor:2,NextGridObjectID:next,Objects:{4:{ID:4,ItemID:item,X:ox,Y:oy,Orientation:'GridOrientation_Up',State:null}}}},DiffGrids:{}},MissionSlots:{},RecurringEvents:{},TimeLostTreasures:{},NextTimeLostTreasureID:1,Snippets:{},NextSnippetID:0},Player:{ListInventories:{0:{ID:0,CompatibleItemType:'ItemType_Furniture',CompatibleFurnitureTypes:{List:['FurnitureItemType_Default']},Inventory:{[item]:{Amount:3,Marker:'ItemMarker_None'}}}},ContainerInventories:{},AchievementsData:[],EvolveStatesProfile:{EvolveProgressState:{}},DutySlots:{},BattlePassStates:{Progress:{},FtueProgress:{TasksProgress:[],WeeklyTasksProgress:[]}}},ConditionalEventHistory:{ActiveEvents:{}},Opaque:{keep:'x'.repeat(1100000),escaped:'keep'}};
          }
          const raw=d=>Buffer.from(JSON.stringify(d).replace('"escaped":"keep"','"escaped":"\\u006beep"'));
          let pos=0,neg=0,nonce=0;const deny=f=>{assert.throws(f);neg++};
          function open(m,d,b=steam){const a=raw(d),w=new(cls(m))(...b,new Uint8Array(32).fill(++nonce));for(let i=0;i<a.length;i+=1048576)w.append_chunk(a.subarray(i,i+1048576));const r=JSON.parse(w.finish());assert.equal(r.decodedSha256,sha(a));return[w,r]}
          const sc=r=>[r.sessionId,BigInt(r.revision),BigInt(r.indexGeneration),r.decodedSha256],parse=JSON.parse;
          const preview=(w,r,gid,x,y)=>parse(w.preview_steam626_vase_add(gid,x,y,...sc(r)));
          const stage=(w,r,p)=>parse(w.stage_steam626_vase_add(p.gridId,p.x,p.y,p.oldAmount,p.nextObjectId,p.entrySha256,p.gridSha256,p.projectedDecodedSha256,...sc(r)));

          const G=7,N=9,isVase=true,pv=[x,y];
          const base=()=>doc(7,9,x,y);
          const aux=id=>({ID:id,GridDefaultLayoutPath:'',GridDataPath:'GridData/Villages/Village04-DarkLevel-GridData.json',TessellationFactor:2,NextGridObjectID:1,Objects:{}});
          const wrappers=d=>{d.World.GridCollection.Grids[8801]=aux(8801);d.World.GridCollection.Grids[8802]=aux(8802);d.World.BuildingInfos={901:{GridIDs:{List:[8801,8802]}}};};
          const preset=d=>{const a=aux(G),b=aux(9901);b.NextGridObjectID=45;b.Objects[44]={ID:44,ItemID:40000066,X:2,Y:2,Orientation:'GridOrientation_Up',State:{SubGrid:{GridID:G,DesignID:null}}};d.World.DecorationPresets=[{GridCollection:{Grids:{[G]:a,9901:b},DiffGrids:{}}}];};
          const room=d=>{for(const id of [8811,8812,8813,8814,8815,8816])d.World.GridCollection.Grids[id]=aux(id);d.World.PlayerHouses=[{Floors:[{Rooms:{0:{FloorGridID:8811,WallGridIDs:{0:8812,1:8813,2:8814,3:8815}}}}]}];d.World.BuildingInfos={...(d.World.BuildingInfos||{}),902:{Room:{FloorGridID:8816,WallGridIDs:{}}}};};
          const combine=d=>{wrappers(d);preset(d);room(d);};
          const actualPreview=(w,r)=>preview(w,r,G,...pv);
          function oracle(d){const gr=d.World.GridCollection.Grids[G],obj=JSON.stringify(gr.Objects),entry=d.Player.ListInventories[0].Inventory[item],coords=isVase?[pv]:[[20,24],[24,24],[16,28],[20,28],[24,28],[16,32],[20,32],[24,32]];
            const tail=coords.map(([X,Y],i)=>',"'+(N+i)+'":'+JSON.stringify({ID:N+i,ItemID:item,Orientation:isVase?'GridOrientation_Up':'GridOrientation_Down',State:null,X,Y})).join('');
            const oldGrid=JSON.stringify(gr),newGrid=oldGrid.replace('"Objects":'+obj,'"Objects":'+obj.slice(0,-1)+tail+'}').replace('"NextGridObjectID":'+N,'"NextGridObjectID":'+(N+coords.length));
            let want=raw(d).toString().replace(oldGrid,newGrid);if(isVase)want=want.replace('"Amount":3,"Marker":"ItemMarker_None"','"Amount":2,"Marker":"ItemMarker_None"');
            const p=isVase?{gridId:G,x:pv[0],y:pv[1],oldAmount:3,nextObjectId:N,entrySha256:sha(Buffer.from(JSON.stringify(entry))),gridSha256:sha(Buffer.from(oldGrid)),projectedDecodedSha256:sha(Buffer.from(want))}:{gridId:G,seedId:82,oldAmount:99,nextObjectId:N,gridSha256:sha(Buffer.from(oldGrid)),seedSha256:sha(Buffer.from(JSON.stringify(gr.Objects[82]))),inventoryEntrySha256:sha(Buffer.from(JSON.stringify(entry))),projectedDecodedSha256:sha(Buffer.from(want))};
            const expected=structuredClone(d);coords.forEach(([X,Y],i)=>expected.World.GridCollection.Grids[G].Objects[N+i]={ID:N+i,ItemID:item,Orientation:isVase?'GridOrientation_Up':'GridOrientation_Down',State:null,X,Y});expected.World.GridCollection.Grids[G].NextGridObjectID+=coords.length;if(isVase)expected.Player.ListInventories[0].Inventory[item].Amount--;
            assert.deepEqual(JSON.parse(want),expected);return {p,want:Buffer.from(want)};}
          const positive=isVase?[['wrapper',wrappers],['local-collision',preset],['rooms',room],['combined',combine]]:[['combined',combine],['local-plus-outside-range',d=>{combine(d);d.Opaque.ref={GridID:G,GridObjectID:N+8};}]];
          const common=[
            ['unknown-top-gridids',d=>d.Opaque.GridIDs=[G]],['unknown-top-subgrid',d=>d.Opaque.SubGrid={GridID:G}],
            ['world-gridids',d=>d.World.Extra={GridIDs:[G]}],['world-subgrid',d=>d.World.Extra={SubGrid:{GridID:G}}],
            ['wrapper-alias',d=>{wrappers(d);d.World.BuildingInfos[901].GridIDs.List.push(G);}],
            ['wrapper-malformed',d=>{wrappers(d);d.World.BuildingInfos[901].GridIDs.List='bad';}],
            ['wrapper-extra-key',d=>{wrappers(d);d.World.BuildingInfos[901].GridIDs.Other=0;}],
            ['wrapper-wrong-owner',d=>d.Opaque.GridIDs={List:[G]}],
            ['building-both-oneof',d=>{combine(d);d.World.BuildingInfos[901].Room={FloorGridID:8811,WallGridIDs:{}};}],
            ['building-missing-oneof',d=>{wrappers(d);d.World.BuildingInfos[903]={};}],
            ['building-room-noncanonical-key',d=>{room(d);d.World.BuildingInfos['0902']=d.World.BuildingInfos[902];delete d.World.BuildingInfos[902];}],
            ['local-missing-endpoint',d=>{preset(d);delete d.World.DecorationPresets[0].GridCollection.Grids[G];}],
            ['local-id-mismatch',d=>{preset(d);d.World.DecorationPresets[0].GridCollection.Grids[G].ID=G+1;}],
            ['local-object-id-mismatch',d=>{preset(d);d.World.DecorationPresets[0].GridCollection.Grids[9901].Objects[44].ID=45;}],
            ['local-overlay',d=>{preset(d);d.World.DecorationPresets[0].GridCollection.DiffGrids[G]={ID:G};}],
            ['local-wrong-owner',d=>{preset(d);d.Opaque.Preset=d.World.DecorationPresets[0];delete d.World.DecorationPresets;}],
            ['local-fake-array-segment',d=>{preset(d);d.World.DecorationPresets={'[]':d.World.DecorationPresets[0]};}],
            ['local-extra-state',d=>{preset(d);d.World.DecorationPresets[0].GridCollection.Grids[9901].Objects[44].State.Other={};}],
            ['local-missing-design',d=>{preset(d);delete d.World.DecorationPresets[0].GridCollection.Grids[9901].Objects[44].State.SubGrid.DesignID;}],
            ['room-floor-alias',d=>{room(d);d.World.PlayerHouses[0].Floors[0].Rooms[0].FloorGridID=G;}],
            ['room-wall-alias',d=>{room(d);d.World.PlayerHouses[0].Floors[0].Rooms[0].WallGridIDs[2]=G;}],
            ['room-key-noncanonical',d=>{room(d);const a=d.World.PlayerHouses[0].Floors[0].Rooms;a['00']=a[0];delete a[0];}],
            ['room-wall-malformed',d=>{room(d);d.World.PlayerHouses[0].Floors[0].Rooms[0].WallGridIDs[2]='301';}],
            ['future-object-reference',d=>d.Opaque.ref={GridID:G,GridObjectID:N}]
          ];
          // Shared exact Blob tested fully on Vase. COMP03 independently tests its distinct target/sibling/range binder and historical two false accepts.
          const negative=isVase?common:[common[0],common[1],common[4],common[11],common[16],common[23],
            ['sibling-root-alias',d=>d.Opaque.GridIDs=[742]],['sibling-parent-alias',d=>d.Opaque.SubGrid={GridID:742}],
            ['seed-reference',d=>d.Opaque.ref={GridID:G,GridObjectID:82}],['last-future-reference',d=>d.Opaque.ref={GridID:G,GridObjectID:N+7}]];
          const pr=[],nr=[];let yes=0,no=0;
          for(const [label,mut] of positive){const d=base();d.Opaque={escaped:'keep'};mut(d);const o=oracle(d);let w;try{let r;[w,r]=open('both',d);const p=actualPreview(w,r);assert.equal(p.projectedDecodedSha256,sha(o.want));const t=stage(w,r,o.p);assert.equal(t.exactFieldChangedCount,isVase?3:9);assert.equal(t.stagedDecodedSha256,sha(o.want));assert.equal(t.originalOverwriteAuthorized,false);w.begin_scoped_edit_output(...sc(t));assert.deepEqual(Buffer.from(w.next_scoped_edit_output_chunk()),o.want);assert.throws(()=>w.next_scoped_edit_output_chunk());yes++;}catch(e){pr.push({label,error:String(e).slice(0,220)});}finally{if(w){w.close();w.free();}}}
          for(const [label,mut] of negative){const d=base();d.Opaque={};mut(d);const o=oracle(d);let w;try{let r;[w,r]=open('both',d);let p=false,s=false;try{actualPreview(w,r);p=true;}catch{}try{stage(w,r,o.p);s=true;}catch{}if(p||s)nr.push({label,preview:p,stage:s});else no++;}catch(e){nr.push({label,unexpected:String(e).slice(0,220)});}finally{if(w){w.close();w.free();}}}
          console.log('ACT1108_REF_REPAIR '+yes+'POS '+no+'NEG POS_RED='+JSON.stringify(pr)+' NEG_RED='+JSON.stringify(nr));assert.deepEqual(pr,[]);assert.deepEqual(nr,[]);assert.equal(yes,positive.length);assert.equal(no,negative.length);
          JS

name: 01A Stage E Genuine Generated Rust WASM Chrome Worker (Writer OFF)
on:
  pull_request:
    paths:
      - '.github/workflows/01a-stagee-generated-wasm-chrome.yml'
permissions:
  contents: read
jobs:
  genuine-wasm-chrome-worker:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_TARGET_DIR: /tmp/wand-stagee-cargo-target
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: QRC1572 changed Switch626 Vase actual generated product ABI
        run: |
          set -euo pipefail
          cargo generate-lockfile --manifest-path crates/ddv-save-core/Cargo.toml
          sha256sum crates/ddv-save-core/Cargo.lock | tee /tmp/qrc1572-lock.sha
          cargo install wasm-bindgen-cli --version 0.2.105 --locked --root /tmp/wand-stagee-wasm-tools
          B=/tmp/wand-stagee-wasm-tools/bin/wasm-bindgen
          W="$CARGO_TARGET_DIR/wasm32-unknown-unknown/release/ddv_save_core.wasm"
          for mode in off legacy legacy-mixed release mixed; do
            case "$mode" in
              off) feat=indexed-read ;;
              legacy) feat=product-amount-scoped ;;
              legacy-mixed) feat=product-amount-scoped,product-collection-scoped ;;
              release) feat=product-switch626-vase-add-scoped ;;
              mixed) feat=product-switch626-vase-add-scoped,product-collection-scoped ;;
            esac
            cargo build --locked --manifest-path crates/ddv-save-core/Cargo.toml --release --target wasm32-unknown-unknown --no-default-features --features "worker-wasm,$feat"
            "$B" "$W" --out-dir "/tmp/swvase-$mode" --target nodejs --no-typescript
          done
          sha256sum -c /tmp/qrc1572-lock.sha
          node --input-type=commonjs <<'JS'
          const assert=require('node:assert/strict'),fs=require('node:fs'),{createHash}=require('node:crypto');
          const cls=m=>require('/tmp/swvase-'+m+'/ddv_save_core.js').WorkerWasmSource,sha=b=>createHash('sha256').update(b).digest('hex');
          const steam=['steam-windows','steam-full-version','releases_1.25-v1.25.3-44-g0b41250d9ac0-incremental-22',626,true],sw=['switch','switch-bid','9A239D3DB569756D',626,true],item=40000066;
          const data=fs.readFileSync('crates/ddv-save-core/data/steam626-vase-geometry-quota.jsonl','utf8').trim().split('\n').slice(1).map(JSON.parse);
          const bits=Buffer.concat(data.filter(x=>x[0]==='floor').map(x=>Buffer.from(x[2],'hex')));
          const floor=(x,y)=>{if(x<2||x+4>250||y<2||y+4>175)return false;for(let i=x-2;i<x+4;i++)for(let j=y-2;j<y+4;j++){const n=i*175+j;if(!(bits[n>>3]&(1<<(n%8))))return false;}return true};
          let poses=[];for(let x=2;x<247;x++)for(let y=2;y<172;y++)if(floor(x,y))poses.push([x*2,y*2]);assert.equal(poses.length,9299);
          const [x,y]=poses[0], [x2,y2]=poses[poses.length-1];
          const sup=JSON.parse(fs.readFileSync('crates/ddv-save-core/data/steam626-placement-applicable-supplement.json','utf8'));
          const [eventId]=Object.entries(sup.recurring).find(([k,v])=>v[0]==='ItemSpawning'&&v[2]==='offline-preserve');
          function doc(gid=7,next=9,x=x2,y=y2){
          const ox=x<250?480:2,oy=y<175?330:2;
          return {GameInfo:{Version:626},World:{Villages:[{Areas:{6:{Unlocked:true,GridIDs:[gid]}},VillageObjectLimitName:'Village04ObjectLimit',HighEndVillageObjectLimitName:'HighEndVillageObjectLimit',BoughtObjectLimit:{UniqueLimit:0,InstanceLimit:0,Exclusions:[],SpecificItemLimits:[]}}],FloatingIslands:{},ExtraLimitObject:false,GridCollection:{Grids:{[gid]:{ID:gid,GridDataPath:'GridData/Villages/Village04-DarkLevel-GridData.json',GridDefaultLayoutPath:'',TessellationFactor:2,NextGridObjectID:next,Objects:{4:{ID:4,ItemID:item,X:ox,Y:oy,Orientation:'GridOrientation_Up',State:null}}}},DiffGrids:{}},MissionSlots:{},RecurringEvents:{},TimeLostTreasures:{},NextTimeLostTreasureID:1,Snippets:{},NextSnippetID:0},Player:{ListInventories:{0:{ID:0,CompatibleItemType:'ItemType_Furniture',CompatibleFurnitureTypes:{List:['FurnitureItemType_Default']},Inventory:{[item]:{Amount:3,Marker:'ItemMarker_None'}}}},ContainerInventories:{},AchievementsData:[],EvolveStatesProfile:{EvolveProgressState:{}},DutySlots:{},BattlePassStates:{Progress:{},FtueProgress:{TasksProgress:[],WeeklyTasksProgress:[]}}},ConditionalEventHistory:{ActiveEvents:{}},Opaque:{keep:'x'.repeat(1100000),escaped:'keep'}};
          }
          const raw=d=>Buffer.from(JSON.stringify(d).replace('"escaped":"keep"','"escaped":"\\u006beep"'));
          let pos=0,neg=0,nonce=0;const deny=f=>{assert.throws(f);neg++};
          function open(m,d,b=sw){const a=raw(d),w=new(cls(m))(...b,new Uint8Array(32).fill(++nonce));for(let i=0;i<a.length;i+=1048576)w.append_chunk(a.subarray(i,i+1048576));const r=JSON.parse(w.finish());assert.equal(r.decodedSha256,sha(a));return[w,r]}
          const sc=r=>[r.sessionId,BigInt(r.revision),BigInt(r.indexGeneration),r.decodedSha256],parse=JSON.parse;
          const preview=(w,r,gid,x,y)=>parse(w.preview_switch626_vase_add(gid,x,y,...sc(r)));
          const stage=(w,r,p)=>parse(w.stage_switch626_vase_add(p.gridId,p.x,p.y,p.oldAmount,p.nextObjectId,p.entrySha256,p.gridSha256,p.projectedDecodedSha256,...sc(r)));
          
          
          const G=7,N=9,isVase=true,pv=[x,y];
          function oracle(d){const gr=d.World.GridCollection.Grids[G],obj=JSON.stringify(gr.Objects),entry=d.Player.ListInventories[0].Inventory[item],coords=isVase?[pv]:[[20,24],[24,24],[16,28],[20,28],[24,28],[16,32],[20,32],[24,32]];
          const tail=coords.map(([X,Y],i)=>',"'+(N+i)+'":'+JSON.stringify({ID:N+i,ItemID:item,Orientation:isVase?'GridOrientation_Up':'GridOrientation_Down',State:null,X,Y})).join('');
          const oldGrid=JSON.stringify(gr),newGrid=oldGrid.replace('"Objects":'+obj,'"Objects":'+obj.slice(0,-1)+tail+'}').replace('"NextGridObjectID":'+N,'"NextGridObjectID":'+(N+coords.length));
          let want=raw(d).toString().replace(oldGrid,newGrid);if(isVase)want=want.replace('"Amount":3,"Marker":"ItemMarker_None"','"Amount":2,"Marker":"ItemMarker_None"');
          const p=isVase?{gridId:G,x:pv[0],y:pv[1],oldAmount:3,nextObjectId:N,entrySha256:sha(Buffer.from(JSON.stringify(entry))),gridSha256:sha(Buffer.from(oldGrid)),projectedDecodedSha256:sha(Buffer.from(want))}:{gridId:G,seedId:82,oldAmount:99,nextObjectId:N,gridSha256:sha(Buffer.from(oldGrid)),seedSha256:sha(Buffer.from(JSON.stringify(gr.Objects[82]))),inventoryEntrySha256:sha(Buffer.from(JSON.stringify(entry))),projectedDecodedSha256:sha(Buffer.from(want))};
          const expected=structuredClone(d);coords.forEach(([X,Y],i)=>expected.World.GridCollection.Grids[G].Objects[N+i]={ID:N+i,ItemID:item,Orientation:isVase?'GridOrientation_Up':'GridOrientation_Down',State:null,X,Y});expected.World.GridCollection.Grids[G].NextGridObjectID+=coords.length;if(isVase)expected.Player.ListInventories[0].Inventory[item].Amount--;
          assert.deepEqual(JSON.parse(want),expected);return {p,want:Buffer.from(want)};}
          
          const base=()=>{const d=doc(7,9,x,y);d.Opaque={escaped:'keep'};return d};
          const ts='2026-01-01T00:00:00Z';
          const event=id=>({ItemSpawning:{RecurringEventItemID:id,NextOccurrence:ts,EndDate:null,LastOccurrence:null}});
          const duty=(id,fruit=false)=>({State:'DutySlotState_OnGoing',DutyId:id,DifficultyLayer:0,ItemsUsed:[],StepData:{ItemFilter:{Data:{Type:'ItemType_ActivityItem',ActivityItemType:'ActivityItemType_Crop',Item:0,ItemList:[],AnyActivityItem:false,...(fruit?{MaxUnlockLevel:100,CropType:'CropTypeCondition_Fruit'}:{})}}}});
          function decorated(){const d=base();d.World.RecurringEvents={'1':event(2010000176),'2':event(2010000177),'3':event(2010000178)};d.Player.DutySlots={'0':{Slots:[duty(2110000038,true),duty(2110000161)]}};return d}
          const readers=['append_chunk','finish','read_core_version_witness','issue_typed_cursor','read_typed_page','issue_saved_diffgrids_typed_cursor','read_saved_diffgrids_typed_page','close'];
          const neutral=['toggle_scoped_edit','begin_scoped_edit_output','next_scoped_edit_output_chunk'];
          const legacy=['discover_scoped_amount','preview_scoped_amount','stage_scoped_amount','toggle_scoped_amount','begin_scoped_amount_output','next_scoped_amount_output_chunk'];
          const collection=['preview_scoped_collection_candidate','preview_fixed_collection','stage_fixed_collection'];
          const steamMethods=['preview_steam626_vase_add','stage_steam626_vase_add'];
          const switchMethods=['preview_switch626_vase_add','stage_switch626_vase_add'];
          for(const [m,expect] of [['off',readers],['legacy',[...readers,...neutral,...legacy,...steamMethods]],['legacy-mixed',[...readers,...neutral,...legacy,...steamMethods,...collection]],['release',[...readers,...neutral,...switchMethods]],['mixed',[...readers,...neutral,...switchMethods]]]){
           const n=Object.getOwnPropertyNames(cls(m).prototype).filter(k=>!['constructor','free','__destroy_into_raw'].includes(k)).sort();
           const wasm=fs.readFileSync('/tmp/swvase-'+m+'/ddv_save_core_bg.wasm'),ex=WebAssembly.Module.exports(new WebAssembly.Module(wasm)).map(x=>x.name);
           assert.deepEqual(n,expect.slice().sort(),m);assert.equal(ex.length,n.length+9,m);for(const k of n)assert.ok(ex.includes('workerwasmsource_'+k),k);
           console.log('QRC1572_CENSUS '+m+' '+n.length+'/'+ex.length+' '+sha(wasm));
          }
          const cases=[
           ['unknown-event',q=>q.World.RecurringEvents['1'].ItemSpawning.RecurringEventItemID=2010000179],
           ['event-reference',q=>q.World.RecurringEvents['1'].ItemSpawning.GridID=G],
           ['wrong-kind',q=>q.World.RecurringEvents['1']={Other:q.World.RecurringEvents['1'].ItemSpawning}],
           ['wrong-duty',q=>q.Player.DutySlots['0'].Slots[0].DutyId=1],
           ['wrong-layer',q=>q.Player.DutySlots['0'].Slots[0].DifficultyLayer=1],
           ['items-used',q=>q.Player.DutySlots['0'].Slots[0].ItemsUsed=[item]],
           ['bad-crop-type',q=>q.Player.DutySlots['0'].Slots[0].StepData.ItemFilter.Data.CropType='CropTypeCondition_Any'],
           ['wrong-unlock',q=>q.Player.DutySlots['0'].Slots[0].StepData.ItemFilter.Data.MaxUnlockLevel=99],
           ['fruit-pair-wrong-duty',q=>Object.assign(q.Player.DutySlots['0'].Slots[1].StepData.ItemFilter.Data,{MaxUnlockLevel:100,CropType:'CropTypeCondition_Fruit'})],
           ['furniture-literal',q=>q.Player.DutySlots['0'].Slots[0].StepData.ItemFilter.Data.Item=item],
           ['unknown-filter',q=>q.Player.DutySlots['0'].Slots[0].StepData.ItemFilter.Data.UnknownSelector=true],
           ['ambiguous-literal-list',q=>Object.assign(q.Player.DutySlots['0'].Slots[0].StepData.ItemFilter.Data,{Item:30200001,ItemList:[30200002]})],
           ['typed-false',q=>q.Player.DutySlots['0'].Slots[0].StepData.ItemFilter.Data.AnyActivityItem='false'],
           ['floor-out',q=>q.World.GridCollection.Grids[G].TessellationFactor=1],
           ['stock-zero',q=>q.Player.ListInventories[0].Inventory[item].Amount=0],
           ['counter-collision',q=>q.World.GridCollection.Grids[G].NextGridObjectID=4]
          ];
          for(const mode of ['release','mixed']){
           const d=decorated(),o=oracle(d),[w,r]=open(mode,d),p=preview(w,r,G,x,y);
           assert.equal(p.contract,'wand.worker.switch626.scoped-vase-add@1');assert.equal(p.projectedDecodedSha256,sha(o.want));
           deny(()=>stage(w,r,{...o.p,gridSha256:'0'.repeat(64)}));deny(()=>stage(w,r,{...o.p,entrySha256:'0'.repeat(64)}));deny(()=>stage(w,r,{...o.p,projectedDecodedSha256:'0'.repeat(64)}));deny(()=>stage(w,r,{...o.p,oldAmount:2}));deny(()=>stage(w,r,{...o.p,nextObjectId:10}));
           const t=stage(w,r,o.p);assert.equal(t.exactFieldChangedCount,3);assert.equal(t.stagedDecodedSha256,sha(o.want));deny(()=>stage(w,r,o.p));const u=parse(w.toggle_scoped_edit(false,...sc(t)));deny(()=>w.begin_scoped_edit_output(...sc(u)));const v=parse(w.toggle_scoped_edit(true,...sc(u)));w.begin_scoped_edit_output(...sc(v));assert.deepEqual(Buffer.from(w.next_scoped_edit_output_chunk()),o.want);deny(()=>w.next_scoped_edit_output_chunk());w.close();w.free();pos++;
           for(const [label,edit] of cases){const q=decorated();edit(q);const [a,b]=open(mode,q);let failed=false;try{preview(a,b,G,x,y)}catch{failed=true}assert.ok(failed,label+' preview');deny(()=>stage(a,b,o.p));a.close();a.free();console.log('QRC1572_DENIED '+mode+' '+label);}
           const [f,fr]=open(mode,d,steam);deny(()=>preview(f,fr,G,x,y));f.close();f.free();
          }
          const legacyDoc=base(),oldOracle=oracle(legacyDoc),[l,lr]=open('legacy',legacyDoc,steam);
          const lp=parse(l.preview_steam626_vase_add(G,x,y,...sc(lr)));assert.equal(lp.contract,'wand.worker.steam626.scoped-vase-add@1');assert.equal(lp.projectedDecodedSha256,sha(oldOracle.want));const lt=parse(l.stage_steam626_vase_add(G,x,y,3,9,lp.entrySha256,lp.gridSha256,lp.projectedDecodedSha256,...sc(lr)));assert.equal(lt.exactFieldChangedCount,3);l.begin_scoped_edit_output(...sc(lt));assert.deepEqual(Buffer.from(l.next_scoped_edit_output_chunk()),oldOracle.want);l.close();l.free();pos++;
          const [s,sr]=open('legacy',decorated(),steam);deny(()=>s.preview_steam626_vase_add(G,x,y,...sc(sr)));s.close();s.free();
          assert.equal(pos,3);assert.equal(neg,51);console.log('QRC1572_SWITCH_VASE_ACTUAL '+pos+'POS '+neg+'NEG 5CENSUS');
                    JS

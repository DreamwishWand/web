name: 03 COMM Source166 Unsave Entity Genuine Signed OFF (Disposable)
on:
  push:
    branches: [comm/w-comm-006-source166-unsave-entity-off-20261106]
permissions:
  contents: read
jobs:
  unsave-off:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      DDVRE_E2_LOCAL_DISPOSABLE: APPROVED
      DATABASE_URL: ''
      SUPABASE_ACCESS_TOKEN: ''
      SUPABASE_PROJECT_ID: ''
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.0
      - name: Pin 166 forward unique SQL and prior Source164/165
        run: |
          set -euo pipefail
          test "$(find supabase/migrations -name '*.sql' | wc -l)" -eq 166
          test "$(git hash-object supabase/migrations/20261105010000_community_source164_reaction_add_service_execute_off.sql)" = 8a272688b3f85e999e43cb772736dba6bc305606
          test "$(git hash-object supabase/migrations/20261104050000_community_source163_help_answer_service_execute_off.sql)" = c02bf514abf51951c19e05f8ca7ef7383f071c70
          python3 -m py_compile tests/comm-source166-unsave-entity-signed-off-disposable.py
          test -z "$DATABASE_URL" && test -z "$SUPABASE_ACCESS_TOKEN" && test -z "$SUPABASE_PROJECT_ID"
      - name: Local genuine ES256 FULL166 + two independent PostgreSQL
        run: |
          set -euo pipefail
          printf '\n[auth]\nsigning_keys_path = "./signing_keys.json"\n' >> supabase/config.toml
          printf '[]\n' > supabase/signing_keys.json
          supabase gen signing-key --algorithm ES256 --yes >/tmp/source166-key.log 2>&1
          printf 'project_id = "ddvre_unsave166_local"\n' | cat - supabase/config.toml > /tmp/source166-config
          mv /tmp/source166-config supabase/config.toml
          printf 'COMMUNITY_MEDIA_BUCKET=ddvre-unsave166-media\nWEP_PRESET_ARTIFACT_BUCKET=ddvre-unsave166-preset\n' > supabase/functions/.env
          timeout 1800s supabase start >/tmp/source166-start.log 2>&1 || { echo SOURCE166_LOCAL_START_NOT_RUN; tail -n 12 /tmp/source166-start.log; exit 1; }
          timeout 900s supabase db reset --no-seed >/tmp/source166-reset.log 2>&1 || { echo SOURCE166_LOCAL_RESET_NOT_RUN; tail -n 12 /tmp/source166-reset.log; exit 1; }
          echo SOURCE166_LOCAL_BOOTSTRAP_PASS
      - run: python3 -m pip install --quiet 'psycopg[binary]==3.2.10'
      - name: Signed eligible409 revoked401 SQL42501 five-replay and two PG rollback
        run: |
          set -euo pipefail
          python3 tests/comm-source166-unsave-entity-signed-off-disposable.py | tee /tmp/source166-result.log
          grep -q '"case": "SOURCE166_UNSAVE_ENTITY_THREE_ROLE_SQL_EXECUTE_OFF"' /tmp/source166-result.log
          grep -q '"case": "SOURCE166_ELIGIBLE_SIGNED_A2_EDGE409_SQL42501_NO_DIFF"' /tmp/source166-result.log
          grep -q '"case": "SOURCE166_REVOKED_A1_ORIGINAL_REFRESH401_TWO_PG_REPLAY_NO_DIFF"' /tmp/source166-result.log
          grep -q '"case": "SOURCE166_TEMP_GRANT_TWO_PG_ROLLBACK_DENIED"' /tmp/source166-result.log
          echo SOURCE166_OWNER_SIGNED_LOCAL_PASS_ONLY_QR_NOT_RUN
      - name: Destroy disposable signer and DB
        if: always()
        run: |
          supabase stop --no-backup >/dev/null 2>&1 || true
          rm -f supabase/signing_keys.json supabase/functions/.env /tmp/source166-*

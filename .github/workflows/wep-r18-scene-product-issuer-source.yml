name: WEP R18-work Scene Product Issuer Source Fail-closed

on:
  push:
    branches: ['wep/r18-scene-product-issuer-failclosed-20261026']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.1.4
      - name: Typecheck alternate Scene Product Edge
        run: deno check --node-modules-dir=auto supabase/functions/wep-scene-preset-product/index.ts
      - name: Test alternate actual TypeScript Edge with synthetic Storage and RPC
        run: node --test tests/wep-r18-scene-product-issuer-edge-handler.test.mjs
      - name: Existing Node contract suite
        run: npm test
      - name: Svelte and shared type checks
        run: npm run check
      - name: Static build
        env:
          BASE_PATH: /web
        run: npm run build

name: 04 QR-S PR758 independent synthetic ES256 actor no-grant negatives
on:
  push:
    branches: [qa/pr758-local-es256-actor-independent-20261107]
permissions:
  contents: read
jobs:
  qr-signed-actor:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DATABASE_URL: ''
      SUPABASE_ACCESS_TOKEN: ''
      SUPABASE_PROJECT_ID: ''
      SUPABASE_DB_PASSWORD: ''
      PGPASSWORD: ''
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Frozen Source PR758 and only two QA-file additions
        shell: bash
        run: |
          set -euo pipefail
          SOURCE=1eb2ad96b46bf9ad10a722455307636769b4da6a
          PARENT=069b47d4fc32fe947ca652328de8cbba72421504
          git merge-base --is-ancestor "$SOURCE" HEAD
          git diff --name-only "$SOURCE" HEAD | sort >/tmp/qr758-actual
          printf '%s\n' \
            .github/workflows/qr-pr758-local-es256-independent.yml \
            tests/qr-pr758-local-es256-independent.test.mjs | sort >/tmp/qr758-expected
          diff -u /tmp/qr758-expected /tmp/qr758-actual
          git diff --name-only "$PARENT" "$SOURCE" | sort >/tmp/qr758-sourceactual
          printf '%s\n' tests/comm-users-signed-actor-readonly-local.test.mjs >/tmp/qr758-sourceexpected
          diff -u /tmp/qr758-sourceexpected /tmp/qr758-sourceactual
          test "$(git hash-object tests/comm-users-signed-actor-readonly-local.test.mjs)" = 20074b19832ef8e142c44107691601f60996301d
          test "$(git hash-object src/lib/community/public-profile-handle-syntax.mjs)" = 48009ce9b52ad568b9759b1d9158e4b1f4ccffb1
          test "$(git hash-object supabase/migrations/20260930025132_community_core_v0_server_rpc.sql)" = bbf9bc830440d964c5da8b3c3cac7e926d281881
          test -z "$(git diff --name-only "$SOURCE" HEAD -- src supabase scripts docs)"
          test -z "$DATABASE_URL" && test -z "$SUPABASE_ACCESS_TOKEN" && test -z "$SUPABASE_PROJECT_ID" && test -z "$SUPABASE_DB_PASSWORD" && test -z "$PGPASSWORD"
          echo QR758_FROZEN_SOURCE_ONE_QA_ONLY_TWO_NO_PROD_CHANGE_PASS
      - name: Independently challenge actual local synthetic verifier, session and alias negatives
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/qr-pr758-local-es256-independent.test.mjs | tee /tmp/qr758-results.log
          for marker in \
            QR758_ONE_TEST_ONLY_SHA_AND_PRODUCTION_UNTOUCHED_PASS \
            QR758_SIGNED_A_B_OTHER_ACCOUNT_HISTORIC_ALIAS_NO_POSITIVE_GRANT_PASS \
            QR758_UNTRUSTED_EC_KEY_MALFORMED_JWT_TIME_ALG_KID_AUD_DENIED_PASS \
            QR758_SESSION_CUTOFF_REFRESH_CLAIM_FORGERY_NO_DB_AUTH_PASS \
            QR758_DUPLICATE_ALIAS_TOMBSTONE_MINORS_CONSENT_FAIL_CLOSED_PASS \
            QR758_RAW_HANDLE_ENCODING_PRIVATE_ID_LEAK_NO_RUNTIME_AUTH_PASS; do
            grep -q "$marker" /tmp/qr758-results.log
          done
          echo QR758_INDEPENDENT_SIX_HOSTILE_ES256_LOCAL_ONLY_PASS
      - name: Delete transient synthetic output; leave public and writer flags OFF
        if: always()
        shell: bash
        run: |
          rm -f /tmp/qr758-actual /tmp/qr758-expected /tmp/qr758-sourceactual /tmp/qr758-sourceexpected /tmp/qr758-results.log
          echo QR758_SYNTHETIC_TEST_CLEANUP_PASS

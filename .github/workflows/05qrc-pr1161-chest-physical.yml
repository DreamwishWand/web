name: 05 QR-C PR1161 independent Chest physical dependency receipt
on:
  pull_request:
    paths:
      - 'tests/qa/05qrc-pr1161-chest-physical.py'
      - '.github/workflows/05qrc-pr1161-chest-physical.yml'
permissions:
  contents: read
jobs:
  independent:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
      - name: Exact fixed child2 and QA-only2
        run: |
          source=5cd1633511e66c199e18788de80116a0a30eaaa8
          test "$(git merge-base "$source" HEAD)" = "$source"
          test "$(git diff --name-only "$source" HEAD | wc -l)" -eq 2
          test "$(git diff --diff-filter=A --name-only "$source" HEAD | wc -l)" -eq 2
          test "$(git rev-parse HEAD:crates/ddv-save-core/src/indexed_read.rs)" = 5dc51c22dd8b9b62239ce0dfbd59a42f6785bbd1
          test "$(git rev-parse HEAD:crates/ddv-save-core/examples/wand-private-furniture-amount-dependencies.rs)" = 5f8def7665a4cd4e5fa326a897ee92ad92d723c8
      - name: Locked actual native example and independent CLI tests
        run: |
          git show d9608e16820d067caf4fecaa0624dcfbf0d1a8c0:scripts/wasm-distribution/approved-Cargo.lock > crates/ddv-save-core/Cargo.lock
          echo 'e58486d673df79bfe7e72b80449e39389e57010fe4051edcdcff9b53c2da898c  crates/ddv-save-core/Cargo.lock' | sha256sum -c -
          cargo build --locked --manifest-path crates/ddv-save-core/Cargo.toml --no-default-features --features private-native-v1,semantic-writer-dev --example wand-private-furniture-amount-dependencies
          python3 tests/qa/05qrc-pr1161-chest-physical.py crates/ddv-save-core/target/debug/examples/wand-private-furniture-amount-dependencies
          cargo test --locked --manifest-path crates/ddv-save-core/Cargo.toml --no-default-features --features private-native-v1,semantic-writer-dev --example wand-private-furniture-amount-dependencies

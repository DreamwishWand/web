name: CORE Product Single SaveSession ABI Boundary (Writer OFF)
on:
  pull_request:
    paths:
      - 'crates/ddv-save-core/**'
      - 'src/lib/ddv/core/save/product-wasm-read-owner.mjs'
      - 'src/lib/ddv/core/save/product-rust-wasm-candidate-loader.mjs'
      - 'scripts/wasm-distribution/**'
      - 'tests/product-wasm-read-owner.test.mjs'
      - 'tests/product-wasm-typed-read-owner.test.mjs'
      - 'src/lib/ddv/core/save/product-wasm-read-owner.d.mts'
      - '.github/workflows/core-product-session-boundary.yml'
  push:
    branches:
      - 'core/product-single-session-abi-*'
      - 'core/product-worker-wasm-read-boundary-*'
      - 'core/product-stageb-synthetic-cas-*'
      - 'core/product-indexed-lazy-typed-stagec-*'
      - 'core/product-worker-indexed-read-staged-*'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rust-product-abi:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
          targets: wasm32-unknown-unknown
      - name: Parse and format temporary CI workspace only
        run: cargo fmt --manifest-path crates/ddv-save-core/Cargo.toml --all
      - name: Rust native negative and lifecycle tests
        run: cargo test --manifest-path crates/ddv-save-core/Cargo.toml --all-targets --verbose
      - name: Synthetic-only CAS/Atomic/Undo/Backup/EditedCopy/fresh-process Reopen negatives
        run: cargo test --manifest-path crates/ddv-save-core/Cargo.toml --features synthetic-stage-b --all-targets --verbose
      - name: Stage C bounded lazy indexed typed ReadSet native regression
        run: cargo test --manifest-path crates/ddv-save-core/Cargo.toml --features indexed-read --all-targets --verbose
      - name: Stage C new-readset versus Stage B old-value CAS stale cursor
        run: cargo test --manifest-path crates/ddv-save-core/Cargo.toml --features indexed-read,synthetic-stage-b --test indexed_read_stagec --verbose
      - name: One ProductSession true semantic batch DEV-only feature native compile and tests
        run: cargo test --manifest-path crates/ddv-save-core/Cargo.toml --features semantic-writer-dev --test semantic_inventory_writer_dev --verbose
      - name: Prove one typed Rust Writer module typechecks in wasm32 without public ABI export
        run: |
          set -euo pipefail
          grep -Fx 'semantic-writer-dev = ["indexed-read"]' crates/ddv-save-core/Cargo.toml
          cargo check --manifest-path crates/ddv-save-core/Cargo.toml \
            --target wasm32-unknown-unknown --no-default-features \
            --features worker-wasm,indexed-read,semantic-writer-dev
          # Public Pages feature set is strictly worker-wasm,indexed-read.
          grep -Fq -- '--features worker-wasm,indexed-read' .github/workflows/pages.yml
      - name: Compile WASM Worker plus opt-in indexed-read types without binding to UI
        run: cargo check --manifest-path crates/ddv-save-core/Cargo.toml --target wasm32-unknown-unknown --features worker-wasm,indexed-read
      - name: Rust wasm32 ABI compilation (no UI/bundle assumption)
        run: cargo check --manifest-path crates/ddv-save-core/Cargo.toml --target wasm32-unknown-unknown --features worker-wasm
      - name: Worker-side mock WASM read-only negative tests
        run: node --test tests/product-wasm-read-owner.test.mjs
      - name: Stage D trusted Worker typed metadata and entropy negative tests
        run: node --test tests/product-wasm-typed-read-owner.test.mjs
      - name: Reject embedded private files or Writer promotion
        shell: bash
        run: |
          test -f crates/ddv-save-core/src/product_session.rs
          test -f crates/ddv-save-core/src/strict_document.rs
          ! grep -R -E 'include_(bytes|str)!|STEAM_SAVE_OWNER_PRIVATE|writer_authorized: *true|apply_authorized: *true' crates/ddv-save-core/src

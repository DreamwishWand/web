name: CORE Product Single SaveSession ABI Boundary (Writer OFF)
on:
  pull_request:
    paths:
      - 'crates/ddv-save-core/**'
      - 'src/lib/ddv/core/save/product-wasm-read-owner.mjs'
      - 'src/lib/ddv/core/save/product-rust-wasm-candidate-loader.mjs'
      - 'scripts/wasm-distribution/**'
      - 'tests/product-wasm-read-owner.test.mjs'
      - 'tests/product-wasm-typed-read-owner.test.mjs'
      - 'src/lib/ddv/core/save/product-wasm-read-owner.d.mts'
      - '.github/workflows/core-product-session-boundary.yml'
  push:
    branches:
      - 'core/product-single-session-abi-*'
      - 'core/product-worker-wasm-read-boundary-*'
      - 'core/product-stageb-synthetic-cas-*'
      - 'core/product-indexed-lazy-typed-stagec-*'
      - 'core/product-worker-indexed-read-staged-*'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rust-product-abi:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
          targets: wasm32-unknown-unknown
      - name: Parse and format temporary CI workspace only
        run: cargo fmt --manifest-path crates/ddv-save-core/Cargo.toml --all
      - name: Rust native negative and lifecycle tests
        run: cargo test --manifest-path crates/ddv-save-core/Cargo.toml --all-targets --verbose
      - name: Synthetic-only CAS/Atomic/Undo/Backup/EditedCopy/fresh-process Reopen negatives
        run: cargo test --manifest-path crates/ddv-save-core/Cargo.toml --features synthetic-stage-b --all-targets --verbose
      - name: Stage C bounded lazy indexed typed ReadSet native regression
        run: cargo test --manifest-path crates/ddv-save-core/Cargo.toml --features indexed-read --all-targets --verbose
      - name: Stage C new-readset versus Stage B old-value CAS stale cursor
        run: cargo test --manifest-path crates/ddv-save-core/Cargo.toml --features indexed-read,synthetic-stage-b --test indexed_read_stagec --verbose
      - name: One ProductSession true semantic batch DEV-only feature native compile and tests
        run: cargo test --manifest-path crates/ddv-save-core/Cargo.toml --features semantic-writer-dev --test semantic_inventory_writer_dev --verbose
      - name: Hair and Skin fixed exact1 internal shared-ledger candidate tests
        run: |
          cargo test --locked --manifest-path crates/ddv-save-core/Cargo.toml --features semantic-writer-dev --lib product_hair_fixed_exact1_shared_ledger_candidate --verbose
          cargo test --locked --manifest-path crates/ddv-save-core/Cargo.toml --features semantic-writer-dev --lib product_skin_fixed_exact1_shared_ledger_candidate --verbose
          cargo test --locked --manifest-path crates/ddv-save-core/Cargo.toml --features semantic-writer-dev --lib appearance_producer_bound_stage_recomputes_readset --verbose
      - name: Prove one typed Rust Writer module typechecks in wasm32 without public ABI export
        run: |
          set -euo pipefail
          grep -Fx 'semantic-writer-dev = ["indexed-read"]' crates/ddv-save-core/Cargo.toml
          cargo check --manifest-path crates/ddv-save-core/Cargo.toml \
            --target wasm32-unknown-unknown --no-default-features \
            --features worker-wasm,indexed-read,semantic-writer-dev
          # Public Pages feature set is strictly worker-wasm,indexed-read.
          grep -Fq -- '--features worker-wasm,indexed-read' .github/workflows/pages.yml
      - name: ACT916 scoped amount candidate native and opt-in Worker compile
        run: |
          cargo test --manifest-path crates/ddv-save-core/Cargo.toml --features product-amount-scoped --lib product_amount_scoped --verbose
          cargo check --manifest-path crates/ddv-save-core/Cargo.toml --target wasm32-unknown-unknown --no-default-features --features worker-wasm,product-amount-scoped
      - name: ACT1427/1430/1439/1442/1445 fixed Fence ADD internal Stage
        run: |
          cargo test --locked --manifest-path crates/ddv-save-core/Cargo.toml --features product-switch626-fence-add-stage-internal --lib fixed_add_tests --verbose
          cargo check --locked --manifest-path crates/ddv-save-core/Cargo.toml --target wasm32-unknown-unknown --no-default-features --features worker-wasm,product-switch626-fence-add-stage-internal
      - name: ACT1186 S-R03 scoped exact8 native and dedicated Worker ABI
        run: |
          cargo test --locked --manifest-path crates/ddv-save-core/Cargo.toml --features product-steam626-sr03-scoped --lib sr03_product_exact8_atomic_cas_and_lifecycle --verbose
          cargo test --locked --manifest-path crates/ddv-save-core/Cargo.toml --features product-steam626-sr03-scoped --lib sr03_shared_typed_collector_matches_native_exact8_bytes --verbose
          cargo check --locked --manifest-path crates/ddv-save-core/Cargo.toml --target wasm32-unknown-unknown --no-default-features --features worker-wasm,product-steam626-sr03-scoped
          cargo check --locked --manifest-path crates/ddv-save-core/Cargo.toml --target wasm32-unknown-unknown --no-default-features --features worker-wasm,product-steam626-sr03-scoped,product-collection-scoped
      - name: Steam Chest and placement cumulative dedicated Worker compile
        run: |
          cargo check --locked --manifest-path crates/ddv-save-core/Cargo.toml --target wasm32-unknown-unknown --no-default-features --features worker-wasm,product-steam626-chest-scoped
          cargo check --locked --manifest-path crates/ddv-save-core/Cargo.toml --target wasm32-unknown-unknown --no-default-features --features worker-wasm,product-steam626-chest-scoped,product-switch626-chest-scoped,product-steam626-comp03-spatial-preview,product-steam626-sr03-scoped,product-collection-scoped
      - name: Steam626 Hair and Skin separate fixed Worker ABI source
        run: |
          cargo test --locked --manifest-path crates/ddv-save-core/Cargo.toml --features product-steam626-hair-scoped --lib appearance_dedicated_hair_worker_exact1 --verbose
          cargo test --locked --manifest-path crates/ddv-save-core/Cargo.toml --features product-steam626-skin-scoped --lib appearance_dedicated_skin_worker_exact1 --verbose
          cargo check --locked --manifest-path crates/ddv-save-core/Cargo.toml --target wasm32-unknown-unknown --no-default-features --features worker-wasm,product-steam626-hair-scoped
          cargo check --locked --manifest-path crates/ddv-save-core/Cargo.toml --target wasm32-unknown-unknown --no-default-features --features worker-wasm,product-steam626-skin-scoped
          cargo check --locked --manifest-path crates/ddv-save-core/Cargo.toml --target wasm32-unknown-unknown --no-default-features --features worker-wasm,product-steam626-hair-scoped,product-steam626-skin-scoped,product-switch626-rm01-scoped,product-steam626-sr03-scoped,product-steam626-chest-scoped,product-switch626-chest-scoped,product-steam626-comp03-scoped,product-collection-scoped
      - name: Switch626 RM01 exact8 and isolated Worker compile
        run: |
          cargo test --locked --manifest-path crates/ddv-save-core/Cargo.toml --features product-switch626-rm01-scoped --lib switch626_rm01_product_exact8_build_delta_and_lifecycle --verbose
          cargo check --locked --manifest-path crates/ddv-save-core/Cargo.toml --target wasm32-unknown-unknown --no-default-features --features worker-wasm,product-switch626-rm01-scoped
          cargo check --locked --manifest-path crates/ddv-save-core/Cargo.toml --target wasm32-unknown-unknown --no-default-features --features worker-wasm,product-switch626-rm01-scoped,product-steam626-sr03-scoped,product-steam626-chest-scoped,product-switch626-chest-scoped,product-steam626-comp03-spatial-preview,product-collection-scoped
      - name: ACT1491/1493 current FD01 FE01 compatible typed ABI
        run: |
          cargo test --locked --manifest-path crates/ddv-save-core/Cargo.toml --features product-switch626-fd01-scoped,product-switch626-fe01-scoped --lib switch626_fd01_worker_guard_boundary --verbose
          cargo test --locked --manifest-path crates/ddv-save-core/Cargo.toml --features product-switch626-fd01-scoped,product-switch626-fe01-scoped --lib switch626_fe01_worker_guard_boundary --verbose
          cargo test --locked --manifest-path crates/ddv-save-core/Cargo.toml --features product-switch626-fd01-scoped,product-switch626-fe01-scoped --lib current_typed_collector --verbose
          cargo check --locked --manifest-path crates/ddv-save-core/Cargo.toml --target wasm32-unknown-unknown --no-default-features --features worker-wasm,product-switch626-fd01-scoped
          cargo check --locked --manifest-path crates/ddv-save-core/Cargo.toml --target wasm32-unknown-unknown --no-default-features --features worker-wasm,product-switch626-fe01-scoped
          cargo check --locked --manifest-path crates/ddv-save-core/Cargo.toml --target wasm32-unknown-unknown --no-default-features --features worker-wasm,product-switch626-fd01-scoped,product-switch626-fe01-scoped,product-steam626-hair-scoped,product-steam626-skin-scoped,product-switch626-rm01-scoped,product-collection-scoped
      - name: Compile WASM Worker plus opt-in indexed-read types without binding to UI
        run: cargo check --manifest-path crates/ddv-save-core/Cargo.toml --target wasm32-unknown-unknown --features worker-wasm,indexed-read
      - name: ACT1486 Steam626 exact1 fixed Makeup Color1 source (Writer OFF)
        run: |
          cargo test --locked --manifest-path crates/ddv-save-core/Cargo.toml --features semantic-writer-dev --lib makeup_color1_ --verbose
          cargo check --locked --manifest-path crates/ddv-save-core/Cargo.toml --target wasm32-unknown-unknown --no-default-features --features worker-wasm,semantic-writer-dev,product-switch626-rm01-scoped
      - name: ACT1487 Switch626 fixed Makeup Color1 Build-only adapter (OFF)
        run: |
          cargo test --locked --manifest-path crates/ddv-save-core/Cargo.toml --features product-switch626-makeup-color1-internal --lib switch626_makeup_color1_build_adapter_ --verbose
          cargo test --locked --manifest-path crates/ddv-save-core/Cargo.toml --features product-switch626-makeup-color1-internal --lib makeup_color1_exact1_product_ --verbose
          cargo check --locked --manifest-path crates/ddv-save-core/Cargo.toml --target wasm32-unknown-unknown --no-default-features --features worker-wasm,product-switch626-makeup-color1-internal
          cargo check --locked --manifest-path crates/ddv-save-core/Cargo.toml --target wasm32-unknown-unknown --no-default-features --features worker-wasm,product-switch626-makeup-color1-internal,product-steam626-hair-scoped,product-switch626-rm01-scoped
      - name: ACT1507 Steam626 fixed Eyeball ColorIndex2 exact1 shared ledger (OFF)
        run: |
          cargo test --locked --manifest-path crates/ddv-save-core/Cargo.toml --features semantic-writer-dev --lib steam626_eyecolor2_ --verbose
          cargo check --locked --manifest-path crates/ddv-save-core/Cargo.toml --target wasm32-unknown-unknown --no-default-features --features worker-wasm,semantic-writer-dev
          cargo check --locked --manifest-path crates/ddv-save-core/Cargo.toml --target wasm32-unknown-unknown --no-default-features --features worker-wasm,semantic-writer-dev,product-steam626-hair-scoped,product-steam626-skin-scoped
      - name: ACT1508 Switch626 Eyeball ColorIndex2 exact Build-only adapter (OFF)
        run: |
          cargo test --locked --manifest-path crates/ddv-save-core/Cargo.toml --features product-switch626-eyecolor2-internal --lib switch626_eyecolor2_build_delta_ --verbose
          cargo test --locked --manifest-path crates/ddv-save-core/Cargo.toml --features product-switch626-eyecolor2-internal --lib steam626_eyecolor2_ --verbose
          cargo check --locked --manifest-path crates/ddv-save-core/Cargo.toml --target wasm32-unknown-unknown --no-default-features --features worker-wasm,product-switch626-eyecolor2-internal
          cargo check --locked --manifest-path crates/ddv-save-core/Cargo.toml --target wasm32-unknown-unknown --no-default-features --features worker-wasm,product-switch626-eyecolor2-internal,product-steam626-hair-scoped,product-switch626-rm01-scoped
      - name: 01A fixed Makeup and Eyeball Steam+Switch opt-in combination (no public Worker ABI)
        run: |
          cargo test --locked --manifest-path crates/ddv-save-core/Cargo.toml --features product-switch626-makeup-color1-internal,product-switch626-eyecolor2-internal --lib switch626_makeup_color1_build_adapter_ --verbose
          cargo test --locked --manifest-path crates/ddv-save-core/Cargo.toml --features product-switch626-makeup-color1-internal,product-switch626-eyecolor2-internal --lib switch626_eyecolor2_build_delta_ --verbose
          cargo test --locked --manifest-path crates/ddv-save-core/Cargo.toml --features product-switch626-makeup-color1-internal,product-switch626-eyecolor2-internal --lib makeup_color1_actual_saved_distinct_female_item_zero_channels --verbose
          cargo test --locked --manifest-path crates/ddv-save-core/Cargo.toml --features product-switch626-makeup-color1-internal,product-switch626-eyecolor2-internal --lib steam626_eyecolor2_exact1_ --verbose
          cargo check --locked --manifest-path crates/ddv-save-core/Cargo.toml --target wasm32-unknown-unknown --no-default-features --features worker-wasm,product-switch626-makeup-color1-internal,product-switch626-eyecolor2-internal,product-steam626-hair-scoped,product-steam626-skin-scoped,product-switch626-rm01-scoped
      - name: Rust wasm32 ABI compilation (no UI/bundle assumption)
        run: cargo check --manifest-path crates/ddv-save-core/Cargo.toml --target wasm32-unknown-unknown --features worker-wasm
      - name: Worker-side mock WASM read-only negative tests
        run: node --test tests/product-wasm-read-owner.test.mjs
      - name: Stage D trusted Worker typed metadata and entropy negative tests
        run: node --test tests/product-wasm-typed-read-owner.test.mjs
      - name: Collection product candidate only (dual Build native and WASM typecheck)
        run: |
          cargo test --manifest-path crates/ddv-save-core/Cargo.toml --features product-collection-scoped --lib product_collection_source_tests --verbose
          cargo check --manifest-path crates/ddv-save-core/Cargo.toml --target wasm32-unknown-unknown --no-default-features --features worker-wasm,product-collection-scoped
      - name: Collection fixed effective Stage (same ledger, both Build scopes, no public ABI)
        run: |
          cargo test --manifest-path crates/ddv-save-core/Cargo.toml --features product-collection-scoped,semantic-writer-dev --lib product_collection_source_tests --verbose
          cargo check --manifest-path crates/ddv-save-core/Cargo.toml --target wasm32-unknown-unknown --no-default-features --features worker-wasm,product-collection-scoped,semantic-writer-dev
      - name: Combined scoped Amount and Collection feature compile
        run: |
          cargo test --manifest-path crates/ddv-save-core/Cargo.toml --features product-amount-scoped,product-collection-scoped --lib product_amount_scoped --verbose
          cargo test --manifest-path crates/ddv-save-core/Cargo.toml --features product-amount-scoped,product-collection-scoped --lib product_collection_source_tests --verbose
          cargo check --manifest-path crates/ddv-save-core/Cargo.toml --target wasm32-unknown-unknown --no-default-features --features worker-wasm,product-amount-scoped,product-collection-scoped
      - name: ACT1181 exact COMP03 spatial projection and opt-in WASM compile
        shell: bash
        run: |
          cargo test --manifest-path crates/ddv-save-core/Cargo.toml --locked --features product-steam626-comp03-spatial-preview --lib comp03_spatial_projection_current_bound_exact9 --verbose
          cargo check --manifest-path crates/ddv-save-core/Cargo.toml --locked --target wasm32-unknown-unknown --no-default-features --features worker-wasm,product-steam626-comp03-spatial-preview
      - name: Reject embedded private files or Writer promotion
        shell: bash
        run: |
          test -f crates/ddv-save-core/src/product_session.rs
          test -f crates/ddv-save-core/src/strict_document.rs
          ! grep -R -E 'STEAM_SAVE_OWNER_PRIVATE|writer_authorized: *true|apply_authorized: *true' crates/ddv-save-core/src
          # Exact path + literal allowlist, SHA-pinned public-derived metadata only.
          includes="$(git grep -n -E 'include_(bytes|str)!' HEAD -- crates/ddv-save-core/src | cut -d: -f1,2,4-)"
          expected="$(printf '%s\n' 'HEAD:crates/ddv-save-core/src/appearance_applicable.rs:const APPEARANCE_DEFINITIONS:&[u8]=include_bytes!("../data/steam626-appearance-definition-join.json");' 'HEAD:crates/ddv-save-core/src/appearance_applicable.rs:const SKIN_PACK:&[u8]=include_bytes!("../data/steam626-fixed-skin-catalog-projection.json");' 'HEAD:crates/ddv-save-core/src/comp03_product_target.rs:const SUPPLEMENT:&[u8]=include_bytes!("../data/steam626-placement-applicable-supplement.json");' 'HEAD:crates/ddv-save-core/src/private_collection_read.rs:const PRODUCT_PACK:&[u8]=include_bytes!("../data/collection-furniture-626.json");' 'HEAD:crates/ddv-save-core/src/product_amount_scoped.rs:const ELIG:&str=include_str!("../data/steam626-amount-packaged-candidates.json");' 'HEAD:crates/ddv-save-core/src/product_amount_scoped.rs:const DEP:&str=include_str!("../data/steam626-amount-dependency-projection.json");' 'HEAD:crates/ddv-save-core/src/product_amount_scoped.rs:const LAYOUT:&str=include_str!("../data/steam626-amount-layout-reference.jsonl");')"
          test "$includes" = "$expected"
          printf '%s\n' 'e2f53a1fef5a4fb59f47b60437d06000202a9db1ed2bd01dd718d15155c5562f  crates/ddv-save-core/data/steam626-appearance-definition-join.json' '440e120ed4555240de2dce30c40544ceba8bcfc21c151ce9106626d28fc2ffc5  crates/ddv-save-core/data/steam626-fixed-skin-catalog-projection.json' 'b9ebc7bebf2c3e1df274b9a98a7b7276896270faa303a41657ecc6c56db84f4f  crates/ddv-save-core/data/collection-furniture-626.json' '05a6bea5582232b27569dbb71f8666d7d60c11a35515d844d2f21b2ae557b23d  crates/ddv-save-core/data/steam626-amount-packaged-candidates.json' '78a1ba539b2e6f43182cea2c2ea35c9d10e51f27d4adbb8d4dbc6cce7f7dcd65  crates/ddv-save-core/data/steam626-amount-dependency-projection.json' '501ba50d0a6f02ff09080357424f3ae5b3f17644ed64d7830566586baf6fce6f  crates/ddv-save-core/data/steam626-amount-layout-reference.jsonl' '90b2461f3a923b7a8680bdda60a78a13055c4f9d4befc0bca4b1b90da711a581  crates/ddv-save-core/data/steam626-placement-applicable-supplement.json' | sha256sum -c -

name: CORE Product Single SaveSession ABI Boundary (Writer OFF)
on:
  pull_request:
    paths:
      - 'crates/ddv-save-core/**'
      - 'src/lib/ddv/core/save/product-wasm-read-owner.mjs'
      - 'tests/product-wasm-read-owner.test.mjs'
      - '.github/workflows/core-product-session-boundary.yml'
  push:
    branches:
      - 'core/product-single-session-abi-*'
      - 'core/product-worker-wasm-read-boundary-*'
      - 'core/product-stageb-synthetic-cas-*'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rust-product-abi:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
          targets: wasm32-unknown-unknown
      - name: Parse and format temporary CI workspace only
        run: cargo fmt --manifest-path crates/ddv-save-core/Cargo.toml --all
      - name: Rust native negative and lifecycle tests
        run: cargo test --manifest-path crates/ddv-save-core/Cargo.toml --all-targets --verbose
      - name: Synthetic-only CAS/Atomic/Undo/Backup/EditedCopy/fresh-process Reopen negatives
        run: cargo test --manifest-path crates/ddv-save-core/Cargo.toml --features synthetic-stage-b --all-targets --verbose
      - name: Rust wasm32 ABI compilation (no UI/bundle assumption)
        run: cargo check --manifest-path crates/ddv-save-core/Cargo.toml --target wasm32-unknown-unknown --features worker-wasm
      - name: Worker-side mock WASM read-only negative tests
        run: node --test tests/product-wasm-read-owner.test.mjs
      - name: Reject embedded private files or Writer promotion
        shell: bash
        run: |
          test -f crates/ddv-save-core/src/product_session.rs
          test -f crates/ddv-save-core/src/strict_document.rs
          ! grep -R -E 'include_(bytes|str)!|STEAM_SAVE_OWNER_PRIVATE|writer_authorized: *true|apply_authorized: *true' crates/ddv-save-core/src

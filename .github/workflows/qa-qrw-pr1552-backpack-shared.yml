            /tmp/qrw1507-tools/bin/wasm-bindgen "$CARGO_TARGET_DIR/wasm32-unknown-unknown/release/ddv_save_core.wasm" --out-dir tests/qa1507/$m --target web --no-typescript
            cp tests/qa1507/$m/ddv_save_core_bg.wasm static/qa1507/$m/
          done

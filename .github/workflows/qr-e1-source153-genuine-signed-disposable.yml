name: QR E1 Genuine Signed Source153 Disposable No Provider
on:
  push:
    branches:
      - qa/ctrl-e1-source153-real-signed-disposable-20261101
permissions:
  contents: read
jobs:
  signed-source153-r1-r2-disposable:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      DDVRE_E1_LOCAL_DISPOSABLE: APPROVED
      DDVRE_E1_EFFECTIVE_ENV_ONLY: '0'
      DATABASE_URL: ''
      SUPABASE_ACCESS_TOKEN: ''
      SUPABASE_PROJECT_ID: ''
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify frozen FULL153 product source and zero production edits
        shell: bash
        run: |
          set -euo pipefail
          OWNER=67300f2e3841d4e4161a9caf24a4d3058b3da330
          git merge-base --is-ancestor "$OWNER" HEAD
          test -z "$(git diff --name-only "$OWNER" HEAD -- src supabase package.json package-lock.json)"
          test "$(git hash-object supabase/migrations/20261028000060_x05_authoritative_owner_projection_v2.sql)" = 356cc10138cd351674fde8dd943acc968e26fbbc
          test "$(git hash-object supabase/functions/community-dreamsnap-owner/index.ts)" = 38f6830b88eb37dc612cbc11901812a90b406146
          test "$(find supabase/migrations -name '*.sql' | wc -l)" -eq 153
          test -z "$DATABASE_URL" && test -z "$SUPABASE_ACCESS_TOKEN" && test -z "$SUPABASE_PROJECT_ID"
          python3 -m py_compile tests/qr-e1-source153-genuine-signed-disposable.py
          echo E1_FULL153_FROZEN_QA_ONLY_NO_REMOTE_CONFIG_PASS
      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.0
      - name: Create ephemeral real asymmetric GoTrue signing keys in runner only
        shell: bash
        run: |
          set -euo pipefail
          cat >> supabase/config.toml <<'EOF'
          [auth]
          signing_keys_path = "./signing_keys.json"
          EOF
          printf '[]\n' > supabase/signing_keys.json
          if ! supabase gen signing-key --algorithm ES256 --yes > /tmp/e1-keygen-private.log 2>&1; then
            echo E1_CLI_ASYMMETRIC_SIGNING_KEY_GENERATION_FAILED
            exit 1
          fi
          python3 - <<'PY'
          import json
          with open('supabase/signing_keys.json', encoding='utf-8') as f:
              keys=json.load(f)
          assert isinstance(keys,list) and any(k.get('kty')=='EC' and k.get('d') and k.get('kid') for k in keys), 'NO_REAL_ASYMMETRIC_SIGNING_KEY'
          # CLI >=2.109 injects public JWKS into the Edge isolate natively.
          # Deliberately do NOT create a reserved SUPABASE_JWKS .env override.
          print('E1_EPHEMERAL_GOTRUE_ES256_PRIVATE_KEY_PRESENT_ONLY_IN_RUNNER')
          PY
      - name: Generate local-only JWT-protected Edge isolate env probe (no product edit)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p supabase/functions/e1-jwks-env-probe
          cat > supabase/functions/e1-jwks-env-probe/index.ts <<'TS'
          // Disposable same-Edge-container isolate probe. No state changes.
          Deno.serve(async (req) => {
            if (req.method !== 'POST') return Response.json({ok:false},{status:405});
            const raw=Deno.env.get('SUPABASE_JWKS');
            const url=Deno.env.get('SUPABASE_JWKS_URL');
            const publicUrl=Deno.env.get('SUPABASE_PUBLIC_URL');
            const internalUrl=Deno.env.get('SUPABASE_URL');
            let parsed:any=null, syntax=false;
            if(raw) { try { parsed=JSON.parse(raw); syntax=true; } catch {} }
            const keys=Array.isArray(parsed)?parsed:Array.isArray(parsed?.keys)?parsed.keys:[];
            const expected=String((await req.json().catch(()=>null))?.expectedKid??'');
            const hostKind=(value:string|undefined) => {
              if(!value) return 'missing';
              try {
                const u=new URL(value);
                if(u.protocol==='https:') return 'https';
                if(u.protocol==='http:' && (u.hostname==='localhost'||u.hostname.endsWith('.localhost')||
                   u.hostname==='[::1]'||/^127\.\d{1,3}\.\d{1,3}\.\d{1,3}$/.test(u.hostname))) return 'loopback_http';
                return u.protocol==='http:'?'non_loopback_http':'other_scheme';
              } catch { return 'invalid'; }
            };
            const noPrivate=keys.every((k:any)=>k && typeof k==='object' && !('d' in k));
            const exactKid=keys.filter((k:any)=>k && k.kid===expected && k.kty==='EC' && k.crv==='P-256').length;
            return Response.json({
              ok:true,edgeIsolate:true,inlinePresent:Boolean(raw),inlineJsonValid:syntax,
              inlineJwksShapeValid:syntax && keys.length>0,publicKeyOnly:noPrivate,
              publicKeyCount:keys.length,matchingKidCount:exactKid,
              jwksUrlPresent:Boolean(url),jwksUrlKind:hostKind(url),
              publicUrlKind:hostKind(publicUrl),internalUrlKind:hostKind(internalUrl)
            },{headers:{'Cache-Control':'private, no-store','CDN-Cache-Control':'no-store',
                 'Surrogate-Control':'no-store','Vary':'Authorization, Origin'}});
          });
          TS
          printf '\n[functions.e1-jwks-env-probe]\nverify_jwt = true\n' >> supabase/config.toml
          echo E1_LOCAL_PROBE_VERIFY_JWT_TRUE_READY
      - name: Boot clean, isolated local FULL153 GoTrue PostgREST Edge, no Stage keys
        shell: bash
        run: |
          set -euo pipefail
          printf 'project_id = "ddvre_e1_real_signed_disposable_only"\n' | cat - supabase/config.toml > /tmp/e1-local-config.toml
          mv /tmp/e1-local-config.toml supabase/config.toml
          timeout 1800s supabase start --debug > /tmp/e1-local-bootstrap.log 2>&1 || {
            echo E1_LOCAL_BOOT_FAILED
            grep -E 'error|Error|failed|Failed|health|timeout' /tmp/e1-local-bootstrap.log | tail -35 | cut -c1-180 || true
            exit 1
          }
          echo E1_CLEAN_DISPOSABLE_GOTRUE_EDGE_PG_BOOT_PASS
          python3 - <<'PY'
          import re
          s=open('/tmp/e1-local-bootstrap.log',encoding='utf-8',errors='replace').read()
          versions=sorted(set(re.findall(r'@supabase/server/(\\d+\\.\\d+\\.\\d+)',s)))
          print('E1_ACTUAL_RESOLVED_SUPABASE_SERVER_VERSION',','.join(versions) if versions else 'NOT_EMITTED_BY_CLI')
          PY
      - name: Install isolated PG client
        run: python3 -m pip install --quiet 'psycopg[binary]==3.2.10'
      - name: Run genuine ES256 Owner and non-owner Edge to PostgREST RLS after effective JWKS proof
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/qr-e1-source153-genuine-signed-disposable.py 2>&1 | tee /tmp/e1-local-only-sanitized.log
          grep -q '"case": "E1_SOURCE153_GENUINE_SIGNED_R1_R2_POSTGREST"' /tmp/e1-local-only-sanitized.log
          echo E1_GENUINE_ES256_EDGE_POSTGREST_RLS_VERIFIED
      - name: Sanitized local Edge diagnostic on signed test failure
        if: failure()
        shell: bash
        run: |
          python3 - <<'PY'
          import re,subprocess
          names=subprocess.check_output(["docker","ps","--format","{{.Names}}"],text=True).splitlines()
          for name in names:
              if "edge" not in name.lower():continue
              proc=subprocess.run(["docker","logs","--tail","120",name],
                  capture_output=True,text=True)
              candidates=[x for x in (proc.stderr+"\n"+proc.stdout).splitlines()
                  if re.search(r'error|exception|module|npm|failed|uncaught',x,re.I)]
              for line in candidates[-22:]:
                  line=re.sub(r'Bearer\s+\S+','Bearer [REDACTED]',line,flags=re.I)
                  line=re.sub(r'(?<!\w)[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+(?!\w)','[JWT_REDACTED]',line)
                  line=re.sub(r'[\w.+-]+@[\w.-]+','[EMAIL]',line)
                  line=re.sub(r'[0-9a-f]{8}-[0-9a-f-]{27,36}','[UUID]',line,flags=re.I)
                  print("E1_EDGE_DIAG",line[:250])
          PY
      - name: Stop and remove disposable local Supabase storage
        if: always()
        shell: bash
        run: |
          supabase stop --no-backup > /dev/null 2>&1 || true
          rm -rf supabase/functions/e1-jwks-env-probe
          rm -f /tmp/e1-local-config.toml /tmp/e1-local-bootstrap.log /tmp/e1-keygen-private.log supabase/signing_keys.json supabase/functions/.env
          echo E1_DISPOSABLE_RUNNER_TEARDOWN_ATTEMPTED
      - name: Upload sanitized case markers only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qr-e1-source153-signed-no-secrets-local-cases
          path: /tmp/e1-local-only-sanitized.log
          if-no-files-found: ignore
          retention-days: 1

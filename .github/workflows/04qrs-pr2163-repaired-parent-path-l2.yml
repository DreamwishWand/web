name: 04 QR-S ACT1743 PR2163 repaired signed media path L2 (QA ONLY)
on:
  pull_request:
    paths:
      - '.github/workflows/04qrs-pr2163-repaired-parent-path-l2.yml'
permissions:
  contents: read
jobs:
  genuine-file-exact-ancestors:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Freeze repaired product source, existing signed Pages and QA-only one file
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 1b23b17634b9fb345b1fce70f4d7a0f1ba549bad
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/04qrs-pr2163-repaired-parent-path-l2.yml"
          test "$(git rev-parse HEAD:scripts/int-steam-public-media-signed-batch.mjs)" = e5323b1ee8f6a46d55e69b7fcc9ae2858e7147d1
          test "$(git rev-parse HEAD:tests/int-steam-public-media-signed-batch.test.mjs)" = 2edeeafd46e7a4332687740963af5be119fb57bb
          test "$(git rev-parse HEAD:.github/workflows/pages.yml)" = ed8aabff1dc8c8b426054c7dff0d88faa2b02da4
          test "$(git rev-parse HEAD:ops/ddv-steam-public-media-signed-batch.json)" = 2bea495c05e378c3cc2300e23a4a35be1fb94e72
          test "$(git rev-parse HEAD:src/lib/ddv/core/save/product-steam626-bamboo-readonly-anchor.mjs)" = 6fc525e975de9db68544d1feaff5ec9cd0011348
          echo QRS_ACT1743_FIXED_PRODUCT_SOURCE_AND_SIGNER_PATHS_VERIFIED
      - name: Falsify repaired original source and built path confinement with actual WebP
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync,mkdtempSync,mkdirSync,copyFileSync,symlinkSync,rmSync,existsSync} from 'node:fs';
          import {tmpdir} from 'node:os';
          import {join,dirname} from 'node:path';
          import {ROOT,readBatch,verifyLocal,pathFor,digest,VARIANT} from './scripts/int-steam-public-media-signed-batch.mjs';
          const plan=readBatch();
          assert.equal(plan.items.length,1);
          const item=plan.items[0],rel=pathFor(item.sha256);
          const original=join(ROOT,'static',rel);
          const raw=readFileSync(original);
          assert.equal(digest(raw),item.sha256);
          const pins={
            [item.itemId]:{
              webpSha256:item.sha256,rgba160Sha256:item.rgba160Sha256,
              bytes:item.bytes,width:item.width,height:item.height,visibility:item.visibility
            }
          };
          const temp=mkdtempSync(join(tmpdir(),'04qrs-accepted-media-path-'));
          const put=(p)=>{mkdirSync(dirname(p),{recursive:true});copyFileSync(original,p);};
          let positives=0,negative=0;
          try {
            for(const kind of ['source','built']){
              const root=join(temp,kind+'-positive');
              put(join(root,kind==='source'?'static':'build',rel));
              const verified=await verifyLocal(plan,{kind,root,pins});
              assert.deepEqual(verified,{count:1,hashes:[item.sha256]});
              positives++;
              for(const target of ['base','ddv','item-images','subject']){
                const checkout=join(temp,kind+'-'+target);
                const base=join(checkout,kind==='source'?'static':'build');
                const external=join(temp,kind+'-outside-'+target);
                if(target==='base'){
                  put(join(external,rel));
                  mkdirSync(checkout,{recursive:true});
                  symlinkSync(external,base,'dir');
                } else if(target==='ddv'){
                  put(join(external,rel.slice('ddv/'.length)));
                  mkdirSync(base,{recursive:true});
                  symlinkSync(external,join(base,'ddv'),'dir');
                } else if(target==='item-images'){
                  put(join(external,rel.slice('ddv/item-images/'.length)));
                  mkdirSync(join(base,'ddv'),{recursive:true});
                  symlinkSync(external,join(base,'ddv','item-images'),'dir');
                } else {
                  put(join(external,'approved.webp'));
                  const subject=join(base,rel);
                  mkdirSync(dirname(subject),{recursive:true});
                  symlinkSync(join(external,'approved.webp'),subject);
                }
                assert.equal(existsSync(join(base,rel)),true,'Target must be a real valid same-bytes image');
                await assert.rejects(
                  verifyLocal(plan,{kind,root:checkout,pins}),
                  /MEDIA_SYMLINK|MEDIA_REALPATH|MEDIA_PARENT|MEDIA_BOUNDARY/,
                  'must reject '+kind+'/'+target+' even with exact image'
                );
                negative++;
              }
            }
            assert.equal(positives,2);
            assert.equal(negative,8);
            console.log('QRS_ACT1743_FIXED_SOURCE_REAL_WEBP_2POS8NEG_SYMLINK_CONTAINMENT_PASS');
          } finally {
            rmSync(temp,{recursive:true,force:true});
          }
          NODE
      - name: Preserve no signing, product flag, private byte or public asset side effect
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git diff --name-only -- src/lib/ddv/core/save/product-steam626-bamboo-readonly-anchor.mjs)"
          grep -Fx 'export const PROTECTED_BAMBOO40700007_READONLY_ANCHOR=null;' src/lib/ddv/core/save/product-steam626-bamboo-readonly-anchor.mjs
          echo QRS_ACT1743_QA_ONLY_NEVER_MERGE_MEDIA_PUBLIC_ON_NOT_AUTHORIZED

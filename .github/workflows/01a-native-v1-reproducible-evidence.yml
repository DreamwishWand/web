name: 01A Native V1 reproducible evidence (synthetic only; no executable upload)
on:
  pull_request:
    paths:
      - '.github/workflows/01a-native-v1-reproducible-evidence.yml'
permissions:
  contents: read
  actions: read
jobs:
  reproduce-v1:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CARGO_TARGET_DIR: /tmp/wand-native-private-v1-target
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: '1c6d4720c956349346c4ab6689d54a4c1f273768'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.100.0'
      - name: Reproduce exact candidate from reference lock; no Save or Writer
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '1c6d4720c956349346c4ab6689d54a4c1f273768'
          test "$(git rev-parse HEAD:crates/ddv-save-core)" = '6c1a2af9a46a256538dd96f0179133e29d4ed16d'
          rustc -vV
          rustc -vV | grep -Fx 'release: 1.100.0'
          rustc -vV | grep -Fx 'host: x86_64-unknown-linux-gnu'
          dir="$(mktemp -d)"
          gh run download 43336554801 --repo DreamwishWand/web --name r22-source-pinned-rust-wasm-js-and-binary-candidate-unsigned --dir "$dir"
          lock="$dir/static/worker-wasm/Cargo.lock"
          echo 'e58486d673df79bfe7e72b80449e39389e57010fe4051edcdcff9b53c2da898c  '"$lock" | sha256sum -c -
          cp "$lock" crates/ddv-save-core/Cargo.lock
          cargo build --locked --manifest-path crates/ddv-save-core/Cargo.toml --features private-native-v1 --bin wand-local-rust-v1 --release
          cmp "$lock" crates/ddv-save-core/Cargo.lock
          exe="$CARGO_TARGET_DIR/release/wand-local-rust-v1"
          sha256sum "$exe"
          stat -c 'V1_REPRODUCED_SIZE=%s' "$exe"
          test "$(stat -c %s "$exe")" = 840288
          echo '0f198595158b7476efa7a0e429e1790b416cdfdb0ee980257102a6481c9fb4a9  '"$exe" | sha256sum -c -
          echo V1_REFERENCE_LOCK_EXACT_BINARY_REPRODUCED
          node tests/private-active-avatar-read.mjs "$exe"
          node tests/private-character-skin-read.mjs "$exe"
          WAND_TEST_NATIVE_RUST_V1="$exe" node tests/native-owner-rust-v1.test.mjs
          WAND_TEST_NATIVE_RUST_V1="$exe" node tests/native-owner-area-grid-slice.test.mjs
          if "$exe" --stage-typed-amounts </dev/null >"$dir/stdout" 2>"$dir/stderr"; then exit 1; fi
          test ! -s "$dir/stdout"
          grep -Fx 'LOCAL_RUST_V1_DENIED:UNTRUSTED_CLI_ARGS' "$dir/stderr"
          echo V1_SYNTHETIC_READONLY_ABI_PASS_NO_BINARY_UPLOAD
          rm -rf "$dir"

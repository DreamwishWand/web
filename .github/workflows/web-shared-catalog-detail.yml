name: WEB shared Item detail and catalog local E2E
on:
  push:
    branches: ['web/shared-detail-catalog-consumer-*', 'web/switch1253-itemthumb-*']
  pull_request:
    paths:
      - 'src/lib/item-media/switch1253-public-item-images.mjs'
      - 'src/lib/item-media/steam1253-hold10-pins.mjs'
      - 'src/lib/item-media/steam1253-hold5-chest2-pins.mjs'
      - 'src/lib/ui/ItemThumb.svelte'
      - 'src/lib/ui/ItemImagePreferences.svelte'
      - 'tests/web-switch1253-item-thumb-contract.test.mjs'
      - 'tests/web-steam1253-door-primary-contract.test.mjs'
      - 'scripts/web-steam1253-door-collection-chrome.mjs'
      - 'scripts/web-switch1253-private-preview-build.mjs'
      - 'src/lib/entity/shared-catalog-directory.mjs'
      - 'src/lib/entity/SharedCatalogDiscovery.svelte'
      - 'tests/web-item-detail-static-link-gate.test.mjs'
      - 'src/lib/entity/SharedEntityDetail.svelte'
      - 'src/routes/editor/items/+page.svelte'
      - 'tests/shared-catalog-directory-foundation.test.mjs'
      - 'tests/scaffold.test.mjs'
      - 'scripts/web-shared-catalog-e2e-chrome.mjs'
      - '.github/workflows/web-shared-catalog-detail.yml'
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - name: Current-main bounded Item regression, not fixed old PR380 eight-path diff
        shell: bash
        run: |
          set -euo pipefail
          BASE="$(git merge-base origin/main HEAD)"
          test -n "$BASE"
          git diff --name-only "$BASE" HEAD -- \
            src/lib/entity/shared-catalog-directory.mjs \
            src/lib/entity/SharedCatalogDiscovery.svelte \
            src/lib/entity/SharedEntityDetail.svelte \
            src/routes/editor/items/+page.svelte \
            tests/shared-catalog-directory-foundation.test.mjs \
            tests/scaffold.test.mjs \
            scripts/web-shared-catalog-e2e-chrome.mjs > /tmp/item-scope
          while IFS= read -r file; do
            case "$file" in
              src/lib/entity/shared-catalog-directory.mjs|src/lib/entity/SharedCatalogDiscovery.svelte|src/lib/entity/SharedEntityDetail.svelte|src/routes/editor/items/+page.svelte|tests/shared-catalog-directory-foundation.test.mjs|tests/scaffold.test.mjs|scripts/web-shared-catalog-e2e-chrome.mjs) ;;
              *) echo "ITEM_OUT_OF_SCOPE:$file"; exit 1 ;;
            esac
          done </tmp/item-scope
          # New CurrentVersion ItemThumb scope is EXACTLY six fixed paths:
          # no edits to Collection/Explore/Entity routes, old R39 resolver,
          # or non-media flows. Reject accidental sibling/legacy PR mixing.
          if git diff --name-only "$BASE" HEAD | grep -qxF 'src/lib/item-media/switch1253-public-item-images.mjs'; then
            cat > /tmp/switch1253-approved <<'CURRENT_IMAGE_SCOPE'
          .github/workflows/web-shared-catalog-detail.yml
          scripts/web-shared-catalog-e2e-chrome.mjs
          src/lib/item-media/switch1253-public-item-images.mjs
          src/lib/ui/ItemImagePreferences.svelte
          src/lib/ui/ItemThumb.svelte
          tests/web-switch1253-item-thumb-contract.test.mjs
          CURRENT_IMAGE_SCOPE
            git diff --name-only "$BASE" HEAD | LC_ALL=C sort > /tmp/switch1253-actual
            LC_ALL=C sort /tmp/switch1253-approved > /tmp/switch1253-expected
            cat > /tmp/switch1253-policy-expected <<'CURRENT_IMAGE_POLICY_SCOPE'
          .github/workflows/web-shared-catalog-detail.yml
          src/lib/item-media/switch1253-public-item-images.mjs
          tests/web-switch1253-item-thumb-contract.test.mjs
          CURRENT_IMAGE_POLICY_SCOPE
            cat > /tmp/switch1253-prep-expected <<'CURRENT_IMAGE_PREP_SCOPE'
          .github/workflows/web-shared-catalog-detail.yml
          scripts/web-switch1253-private-preview-build.mjs
          src/lib/item-media/switch1253-public-item-images.mjs
          src/lib/ui/ItemThumb.svelte
          tests/web-switch1253-item-thumb-contract.test.mjs
          CURRENT_IMAGE_PREP_SCOPE
            cat > /tmp/steam1253-exact1-expected <<'STEAM_EXACT1_SCOPE'
          .github/workflows/web-shared-catalog-detail.yml
          scripts/web-steam1253-door-collection-chrome.mjs
          src/lib/item-media/switch1253-public-item-images.mjs
          tests/web-steam1253-door-primary-contract.test.mjs
          STEAM_EXACT1_SCOPE
            cat > /tmp/steam1253-extension-expected <<'STEAM_EXTENSION_SCOPE'
          .github/workflows/web-shared-catalog-detail.yml
          src/lib/item-media/switch1253-public-item-images.mjs
          tests/web-steam1253-door-primary-contract.test.mjs
          STEAM_EXTENSION_SCOPE
            cat > /tmp/steam1253-tree-quarantine-expected <<'TREE_QUARANTINE_SCOPE'
          .github/workflows/web-shared-catalog-detail.yml
          scripts/web-steam1253-door-collection-chrome.mjs
          scripts/web-switch1253-private-preview-build.mjs
          src/lib/item-media/switch1253-public-item-images.mjs
          tests/web-steam1253-door-primary-contract.test.mjs
          tests/web-switch1253-item-thumb-contract.test.mjs
          TREE_QUARANTINE_SCOPE
            cat > /tmp/steam1253-furniture146-expected <<'STEAM_FURNITURE_SCOPE'
          .github/workflows/web-shared-catalog-detail.yml
          scripts/web-steam1253-door-collection-chrome.mjs
          scripts/web-switch1253-private-preview-build.mjs
          src/lib/item-media/steam1253-furniture146-pins.mjs
          src/lib/item-media/switch1253-public-item-images.mjs
          tests/web-steam1253-door-primary-contract.test.mjs
          tests/web-switch1253-item-thumb-contract.test.mjs
          STEAM_FURNITURE_SCOPE
            cat > /tmp/steam1253-other36-expected <<'STEAM_OTHER_SCOPE'
          .github/workflows/web-shared-catalog-detail.yml
          scripts/web-steam1253-door-collection-chrome.mjs
          scripts/web-switch1253-private-preview-build.mjs
          src/lib/item-media/steam1253-furniture146-pins.mjs
          src/lib/item-media/steam1253-other36-pins.mjs
          src/lib/item-media/switch1253-public-item-images.mjs
          tests/web-steam1253-door-primary-contract.test.mjs
          tests/web-switch1253-item-thumb-contract.test.mjs
          STEAM_OTHER_SCOPE
            cat > /tmp/steam1253-hold10-expected <<'STEAM_HOLD_SCOPE'
          .github/workflows/web-shared-catalog-detail.yml
          scripts/web-steam1253-door-collection-chrome.mjs
          scripts/web-switch1253-private-preview-build.mjs
          src/lib/item-media/steam1253-furniture146-pins.mjs
          src/lib/item-media/steam1253-hold10-pins.mjs
          src/lib/item-media/steam1253-other36-pins.mjs
          src/lib/item-media/switch1253-public-item-images.mjs
          tests/web-steam1253-door-primary-contract.test.mjs
          tests/web-switch1253-item-thumb-contract.test.mjs
          STEAM_HOLD_SCOPE
            cat > /tmp/steam1253-hold10-child-expected <<'STEAM_HOLD_CHILD_SCOPE'
          .github/workflows/web-shared-catalog-detail.yml
          src/lib/item-media/steam1253-hold10-pins.mjs
          src/lib/item-media/switch1253-public-item-images.mjs
          tests/web-steam1253-door-primary-contract.test.mjs
          STEAM_HOLD_CHILD_SCOPE
            cat > /tmp/steam1253-hold5-chest2-expected <<'STEAM_HOLD5_CHEST2_SCOPE'
          .github/workflows/web-shared-catalog-detail.yml
          scripts/web-steam1253-door-collection-chrome.mjs
          scripts/web-switch1253-private-preview-build.mjs
          src/lib/item-media/steam1253-furniture146-pins.mjs
          src/lib/item-media/steam1253-hold10-pins.mjs
          src/lib/item-media/steam1253-hold5-chest2-pins.mjs
          src/lib/item-media/steam1253-other36-pins.mjs
          src/lib/item-media/switch1253-public-item-images.mjs
          tests/web-steam1253-door-primary-contract.test.mjs
          tests/web-switch1253-item-thumb-contract.test.mjs
          STEAM_HOLD5_CHEST2_SCOPE
            cat > /tmp/steam1253-hold5-chest2-child-expected <<'STEAM_HOLD5_CHEST2_CHILD_SCOPE'
          .github/workflows/web-shared-catalog-detail.yml
          src/lib/item-media/steam1253-hold5-chest2-pins.mjs
          src/lib/item-media/switch1253-public-item-images.mjs
          tests/web-steam1253-door-primary-contract.test.mjs
          STEAM_HOLD5_CHEST2_CHILD_SCOPE
            if diff -q /tmp/steam1253-hold5-chest2-expected /tmp/switch1253-actual >/dev/null || diff -q /tmp/steam1253-hold5-chest2-child-expected /tmp/switch1253-actual >/dev/null; then
              node --test tests/web-steam1253-door-primary-contract.test.mjs
              echo WEB_STEAM1253_HOLD5_CHEST2_EXACT_SCOPE_PASS
            elif diff -q /tmp/steam1253-hold10-expected /tmp/switch1253-actual >/dev/null || diff -q /tmp/steam1253-hold10-child-expected /tmp/switch1253-actual >/dev/null; then
              node --test tests/web-steam1253-door-primary-contract.test.mjs
              echo WEB_STEAM1253_HOLD10_EXACT_SCOPE_PASS
            elif diff -q /tmp/steam1253-other36-expected /tmp/switch1253-actual >/dev/null; then
              node --test tests/web-steam1253-door-primary-contract.test.mjs
              echo WEB_STEAM1253_OTHER36_EXACT8_SCOPE_PASS
            elif diff -q /tmp/steam1253-furniture146-expected /tmp/switch1253-actual >/dev/null; then
              node --test tests/web-steam1253-door-primary-contract.test.mjs
              echo WEB_STEAM1253_FURNITURE146_EXACT7_SCOPE_PASS
            elif diff -q /tmp/steam1253-tree-quarantine-expected /tmp/switch1253-actual >/dev/null; then
              node --test tests/web-steam1253-door-primary-contract.test.mjs
              echo WEB_STEAM1253_SHARED_TREE_QUARANTINE_EXACT6_SCOPE_PASS
            elif diff -q /tmp/steam1253-extension-expected /tmp/switch1253-actual >/dev/null; then
              node --test tests/web-steam1253-door-primary-contract.test.mjs
              echo WEB_STEAM1253_EXACT3_EXTENSION_SCOPE_PASS
            elif diff -q /tmp/steam1253-exact1-expected /tmp/switch1253-actual >/dev/null; then
              node --test tests/web-steam1253-door-primary-contract.test.mjs
              echo WEB_STEAM1253_DOOR_EXACT4_SCOPE_PASS
            elif diff -q /tmp/switch1253-expected /tmp/switch1253-actual >/dev/null; then
              echo WEB_CURRENT_SWITCH1253_ITEM_IMAGE_EXACT6_OFF_SCOPE_PASS
            elif diff -q /tmp/switch1253-policy-expected /tmp/switch1253-actual >/dev/null; then
              echo WEB_CURRENT_SWITCH1253_ISSUE604_POLICY_EXACT3_SCOPE_PASS
            elif diff -q /tmp/switch1253-prep-expected /tmp/switch1253-actual >/dev/null; then
              echo WEB_CURRENT_SWITCH1253_ELIGIBLE2_PREP_EXACT5_SCOPE_PASS
              node scripts/web-switch1253-private-preview-build.mjs
            else
              diff -u /tmp/switch1253-policy-expected /tmp/switch1253-actual || true
              exit 1
            fi
            node --test tests/web-switch1253-item-thumb-contract.test.mjs
          fi
          # The original Item gate protected Collection/Explore against unrelated edits.
          # The only exception is the exact nine-path Stage1 public ItemThumb change,
          # including this workflow. Never suppress the inherited functional tests.
          if ! git diff --quiet "$BASE" HEAD -- src/routes/explore/ src/routes/collection/; then
            cat > /tmp/item-image-approved-paths <<'ITEM_IMAGE_APPROVED_PATHS'
          .github/workflows/web-shared-catalog-detail.yml
          src/lib/entity/SharedEntityDetail.svelte
          src/lib/entity/shared-catalog-detail.mjs
          src/lib/item-media/public-item-images.mjs
          src/lib/ui/ItemImagePreferences.svelte
          src/lib/ui/ItemThumb.svelte
          src/routes/collection/+page.svelte
          src/routes/explore/+page.svelte
          tests/web-stage1-public-item-thumb-contract.test.mjs
          ITEM_IMAGE_APPROVED_PATHS
            git diff --name-only "$BASE" HEAD | LC_ALL=C sort > /tmp/item-image-actual-paths
            LC_ALL=C sort /tmp/item-image-approved-paths > /tmp/item-image-approved-sorted
            # Only the original exact9 ItemThumb Source OR this exact5-route fix is accepted.
            # No broad glob, no bypass of inherited Catalog or Chrome tests.
            cat > /tmp/item-detail-static-approved-paths <<'DETAIL_ROUTE_APPROVED_PATHS'
          .github/workflows/web-shared-catalog-detail.yml
          src/lib/entity/SharedCatalogDiscovery.svelte
          src/routes/collection/+page.svelte
          src/routes/explore/+page.svelte
          tests/web-item-detail-static-link-gate.test.mjs
          DETAIL_ROUTE_APPROVED_PATHS
            LC_ALL=C sort /tmp/item-detail-static-approved-paths > /tmp/item-detail-static-approved-sorted
            if diff -q /tmp/item-image-approved-sorted /tmp/item-image-actual-paths > /dev/null; then
              node --test tests/web-stage1-public-item-thumb-contract.test.mjs
              echo WEB_ITEM_IMAGE_EXACT9_SCOPED_REGRESSION_PASS
            elif diff -q /tmp/item-detail-static-approved-sorted /tmp/item-image-actual-paths > /dev/null; then
              node --test tests/web-item-detail-static-link-gate.test.mjs tests/web-stage1-collection-root.test.mjs
              echo WEB_ITEM_DETAIL_STATIC_HTTP404_LINK_EXACT5_SCOPED_PASS
            else
              echo WEB_ITEM_ROUTE_UNAUTHORIZED_SCOPE
              diff -u /tmp/item-detail-static-approved-sorted /tmp/item-image-actual-paths || true
              exit 1
            fi
          fi
          git diff --exit-code "$BASE" HEAD -- supabase/ src/lib/community/ src/lib/moodboards/store.js src/lib/entity/entity-moodboard-action.mjs src/lib/wep/ src/lib/timing/ src/routes/dreamsnaps/
          echo WEB_ITEM_ORIGINAL_ACCEPTED_BEHAVIOR_REGRESSION_PASS
      - name: Source/version, duplicate and rights OFF assertions
        run: node --test tests/shared-catalog-directory-foundation.test.mjs tests/shared-entity-detail-contract.test.mjs tests/shared-detail-moodboard.test.mjs tests/web-item-detail-static-link-gate.test.mjs
      - name: Svelte checks and static Pages build
        env:
          BASE_PATH: /web
        run: npm run check && npm run build
      - name: no dynamic detail path falsely shipped as HTTP 200
        shell: bash
        run: |
          set -euo pipefail
          test -f build/404.html
          test ! -f build/en/40000047/index.html
          test -f build/editor/items/index.html
          echo WEB_ENTITY_NO_SEO_FALLBACK_PROMOTION_PASS
  browser:
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm install --no-save --package-lock=false playwright-core@1.55.0
      - name: Resolve real Chrome
        shell: bash
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          "$CHROME_BIN" --version
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
      - name: Build static fallback and start local Vite
        env:
          BASE_PATH: /web
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          BASE_PATH='' npm run dev -- --host 127.0.0.1 --port 4194 > /tmp/entity-local-vite.log 2>&1 &
          for i in $(seq 1 75); do
            if curl -fsS http://127.0.0.1:4194/collection/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/entity-local-vite.log
          exit 1
      - name: Real Chrome Collection and Explore → Shared detail → Moodboard reload
        env:
          SHARED_DETAIL_E2E_URL: http://127.0.0.1:4194
        run: node scripts/web-shared-catalog-e2e-chrome.mjs
      - name: Actual shared ItemThumb isolated synthetic-only positive and negative UX
        run: node scripts/web-switch1253-private-preview-build.mjs --synthetic-browser

      - name: Steam exact1 actual Collection shared ItemThumb synthetic fixture (no game pixels)
        if: ${{ hashFiles('scripts/web-steam1253-door-collection-chrome.mjs') != '' }}
        env:
          SHARED_DETAIL_E2E_URL: http://127.0.0.1:4194
        run: node scripts/web-steam1253-door-collection-chrome.mjs

  # Source-only isolated preview: real WebP supplied ONLY to local loopback.
  act628-private-preview:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == '08web/act628-steam-door-exact1'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - name: Build isolated source-only preview with temporary test hook
        env:
          BASE_PATH: ''
        shell: bash
        run: |
          set -euo pipefail
          src=src/lib/item-media/switch1253-public-item-images.mjs
          cp "$src" /tmp/act628-original.mjs
          trap 'cp /tmp/act628-original.mjs "$src"' EXIT
          cat >> "$src" <<'PRIVATE_TEST_HOOK'
          // TEMPORARY LOCAL PREVIEW ONLY — never deployed to Pages.
          if(typeof window!=='undefined' && ['127.0.0.1','localhost'].includes(window.location.hostname)){
            window.__wandAct628PrivateTest=(withdraw=false)=>{
              const m=prepareSteam1253ItemImageManifest(),id=STEAM1253_DOOR_ID;
              const release={...STEAM1253_REVIEWED_RELEASE,mediaPublic:true,
                rightsReview:'OPERATOR_ACCEPTED',receivingContact:'MANAGED_VERIFIED',
                takedown:'MANAGED_TESTED',managedHttps:'MANAGED_VERIFIED',
                attribution:'EIGHT_LOCALES_REVIEWED',oldUrlAndCache:'MANAGED_TESTED',
                rollback:'MANAGED_TESTED',operatorReceiptSha256:'b'.repeat(64),items:{}};
              m.items[id].publicationDecision='OWNER_SCOPED_PUBLICATION_ACCEPTED';
              release.items[id]=Object.fromEntries(['originalNativeStreamSha256','sourcePngSha256',
                'webpSha256','rightsStatus','publicationDecision','visibility'].map(k=>[k,m.items[id][k]]));
              const {mediaPublic,items,...publication}=release;
              m.publication={gate:'MEDIA_PUBLIC_SCOPED_ON',...publication};
              if(withdraw)m.items={};
              const catalog=validateSteam1253ItemImageCatalog(m,release);
              switch1253PublicItemImageSource.set({status:'VERIFIED',catalog,reason:''});
              return catalog.count;
            };
          }
          PRIVATE_TEST_HOOK
          npm run build
          cp /tmp/act628-original.mjs "$src"
          git diff --exit-code
          test -f build/collection/index.html
          test -f build/explore/index.html
          test -f build/404.html
          test ! -d build/ddv/item-images/steam-1.25.3-schema626-lossless160-v1
          grep -Rl '__wandAct628PrivateTest' build/_app > /tmp/act628-test-hook-paths
          test -s /tmp/act628-test-hook-paths
          git rev-parse HEAD > build/ACT628_SOURCE_HEAD.txt
          sha256sum "$src" > build/ACT628_SOURCE_SHA256.txt
          echo ACT628_SOURCE_ONLY_PRIVATE_PREVIEW_BUILD_PASS
      - uses: actions/upload-artifact@v4
        with:
          name: act628-source-only-private-preview
          path: build/
          retention-days: 1
          if-no-files-found: error

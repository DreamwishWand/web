name: 05 QR-C PR1198 independent nonstraight Fence
on:
  pull_request:
    paths:
      - 'tests/qa/05qrc-pr1198-nonstraight.py'
      - '.github/workflows/05qrc-pr1198-nonstraight.yml'
permissions:
  contents: read
jobs:
  independent:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
      - name: Exact child2 and QA-only2
        run: |
          source=19dd05642f2ccc709628f3b6b1373e16ea90481f
          test "$(git merge-base "$source" HEAD)" = "$source"
          test "$(git diff --name-only "$source" HEAD | wc -l)" -eq 2
          test "$(git diff --diff-filter=A --name-only "$source" HEAD | wc -l)" -eq 2
          test "$(git rev-parse HEAD:crates/ddv-save-core/src/bin/wand-local-rust-v2-noop.rs)" = 59f57e4dc29bf70a76621e6fc5098b609aebcfd0
          test "$(git rev-parse HEAD:crates/ddv-save-core/src/switch624_fence_fe01.rs)" = ebd2ebe20298388caec729a2b28945a456384917
          test "$(git rev-parse HEAD:tests/qa/05qrc-pr1198-nonstraight.py)" = c7a1d44322f17944aa4824d6321d7c009b5e36cc
      - name: Locked native independent lexical and affected regressions
        run: |
          git show 08fd6694ec95ad2c6d648722f8e8c204b6115f9d:scripts/wasm-distribution/approved-Cargo.lock > crates/ddv-save-core/Cargo.lock
          echo 'e58486d673df79bfe7e72b80449e39389e57010fe4051edcdcff9b53c2da898c  crates/ddv-save-core/Cargo.lock' | sha256sum -c -
          cargo build --locked --manifest-path crates/ddv-save-core/Cargo.toml --no-default-features --features private-native-v2,semantic-writer-dev --bin wand-local-rust-v2-noop
          python3 tests/qa/05qrc-pr1198-nonstraight.py crates/ddv-save-core/target/debug/wand-local-rust-v2-noop
          cargo test --locked --manifest-path crates/ddv-save-core/Cargo.toml --no-default-features --features semantic-writer-dev --lib switch624_fence_fe01

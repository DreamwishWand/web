name: 09 INT R15 independent actual owner Source116 atomic and historical graph negatives
on:
  push:
    branches:
      - validation/09int-r15-actual-owner116-20261025

permissions:
  contents: read

jobs:
  r14-gallery-first-scoped-atomic:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SUPABASE_ACCESS_TOKEN: ''
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install two-session PostgreSQL driver
        run: python -m pip install --disable-pip-version-check 'psycopg[binary]>=3,<4'
      - uses: supabase/setup-cli@v1
        with:
          version: 2.81.3
      - name: Pin local-only independent Supabase project
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('supabase/config.toml')
          s=p.read_text()
          # The canonical config intentionally omits project_id, so prepend a
          # unique local-only identifier exactly as the 03 COMM clean-bootstrap gate does.
          assert not any(line.strip().startswith('project_id =') for line in s.splitlines())
          p.write_text('project_id = "ddvre_09int_r15_owner116"\n'+s)
          migrations=list(Path('supabase/migrations').glob('*.sql'))
          assert len(migrations)==116,(len(migrations),'EXPECTED_PR134_OWNER_SCOPED_ATOMIC_SOURCE116')
          PY
          echo 'NO supabase link, NO remote secrets, NO Staging/Production access'
      - name: Start isolated owner PR134 Supabase Postgres and apply 116 Source migrations
        shell: bash
        run: |
          set -euo pipefail
          timeout 1500s supabase start > /tmp/r8-supabase-start.log 2>&1 || { tail -n 80 /tmp/r8-supabase-start.log; exit 1; }
          echo 'LOCAL_SUPABASE_116_OWNER_SOURCE_MIGRATIONS_APPLIED'
      - name: Seed synthetic local account and minimal reference corpus
        shell: bash
        run: |
          set -euo pipefail
          db_container=$(docker ps --format '{{.Names}}' | grep '^supabase_db_' | head -1)
          test -n "$db_container"
          docker exec -i "$db_container" psql -X -v ON_ERROR_STOP=1 -U postgres -d postgres < supabase/staging/acceptance/local-clean-bootstrap-synthetic-seed-v1.sql > /tmp/r8-seed.log 2>&1 || { tail -n 60 /tmp/r8-seed.log; exit 1; }
          echo 'ONLY_EPHEMERAL_SYNTHETIC_ACCOUNT_SEEDED'
      - name: Call actual 03COMM Source116 Gallery v4, test Artifact Account stale historical and multi-Artifact failclosed
        env:
          DDVRE_R8_ISOLATED_LOCAL: CONFIRMED
          DDVRE_R8_POSTGRES_DSN: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: python -u tests/09int-r15-actual-owner116-independent.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 09int-r15-owner116-actual-rpc-evidence
          path: |
            /tmp/r8-supabase-start.log
            /tmp/r8-seed.log
          if-no-files-found: warn
          retention-days: 7
      - name: Discard only the ephemeral local DB, no backup
        if: always()
        run: supabase stop --no-backup || true

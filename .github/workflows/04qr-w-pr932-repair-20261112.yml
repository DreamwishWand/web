name: "04 QR-W PR932 repair independent Node and real MOCK Chrome"
on:
  pull_request:
    paths:
      - 'scripts/04qr-w-pr932-repair-*.mjs'
      - '.github/workflows/04qr-w-pr932-repair-20261112.yml'
permissions:
  contents: read
jobs:
  node:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --experimental-test-module-mocks --test scripts/04qr-w-pr932-repair-node-20261112.mjs scripts/04qr-w-pr932-repair-adapter-20261112.mjs
  chrome:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: |
          npm ci --no-audit --no-fund
          npm install --no-save --package-lock=false playwright-core@1.55.0
      - run: |
          export CHROME_BIN="$(command -v google-chrome)"
          node scripts/04qr-w-pr932-repair-chrome-20261112.mjs
      - if: always()
        run: |
          test ! -e src/routes/test-04qrw-pr932-repair
          test ! -e src/routes/test-dev-amount-ui
          test -z "$(git ls-files src/routes/test-04qrw-pr932-repair src/routes/test-dev-amount-ui)"
          ! git grep -n LocalAmountEditorDev -- src/routes
          echo QRW932_REPAIR_ROUTE_CLEAN_MOCK_ONLY

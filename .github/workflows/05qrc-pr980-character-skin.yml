name: 05 QR-C PR980 independent Character Skin receipt
on:
  pull_request:
    paths:
      - 'tests/qa/05qrc-pr980-character-skin.mjs'
      - 'crates/ddv-save-core/tests/qa_pr980_character_skin.rs'
      - '.github/workflows/05qrc-pr980-character-skin.yml'
permissions:
  contents: read
jobs:
  independent:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
          targets: wasm32-unknown-unknown
      - name: Exact source ancestor and original4 immutable
        run: |
          git merge-base --is-ancestor 1c2224fbc8a60b51e55670033ad76e304cde6649 HEAD
          test "$(git diff --name-only 1c2224fbc8a60b51e55670033ad76e304cde6649 HEAD | wc -l)" -eq 3
          test "$(git rev-parse HEAD:crates/ddv-save-core/src/indexed_read.rs)" = cc4b5f4b98f3687964b72070707491a8f8fb9c0a
          test "$(git rev-parse HEAD:crates/ddv-save-core/src/bin/wand-local-rust-v1.rs)" = a8c5b0b38ef9fa6dcd9c041edacfd9c54af43068
          test "$(git rev-parse HEAD:tests/private-character-skin-read.mjs)" = 3bb525dc534758e496421b621ed432952de2f514
          test "$(git rev-parse HEAD:.github/workflows/01a-private-character-skin-read.yml)" = e4f2cda59687e3514150f9b707bae7f8ab4fa444
      - name: Independent native Rust and actual CLI
        run: |
          cargo test --manifest-path crates/ddv-save-core/Cargo.toml --no-default-features --features private-native-v1 --test qa_pr980_character_skin
          cargo build --manifest-path crates/ddv-save-core/Cargo.toml --no-default-features --features private-native-v1 --bin wand-local-rust-v1
          node tests/qa/05qrc-pr980-character-skin.mjs crates/ddv-save-core/target/debug/wand-local-rust-v1
      - name: Public WASM isolation and expected forbidden feature
        run: |
          cargo check --manifest-path crates/ddv-save-core/Cargo.toml --target wasm32-unknown-unknown --no-default-features --features worker-wasm,indexed-read
          if cargo check --manifest-path crates/ddv-save-core/Cargo.toml --target wasm32-unknown-unknown --no-default-features --features worker-wasm,indexed-read,private-native-v1 > /tmp/qac980-native.log 2>&1; then exit 1; fi
          grep -F 'private-native-v1 is native-only and cannot enter WASM' /tmp/qac980-native.log
          test -z "$(git ls-files crates/ddv-save-core/target)"

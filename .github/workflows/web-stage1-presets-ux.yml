name: WEB Stage1 Presets four-card UX no Native writer
on:
  push:
    branches:
      - 'web/stage1-presets-four-card-root-*'
  pull_request:
    paths:
      - '.github/workflows/web-stage1-presets-ux.yml'
      - 'scripts/web-stage1-presets-chrome.mjs'
      - 'src/lib/presets/stage1-root.mjs'
      - 'src/routes/presets/+page.svelte'
      - 'src/lib/presets/my-presets-router.mjs'
      - 'tests/web-my-presets-internal-router.test.mjs'
      - 'scripts/web-my-presets-internal-chrome.mjs'
      - 'tests/scaffold.test.mjs'
      - 'tests/web-stage1-presets-root.test.mjs'
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - name: Exact five UI/test files from single main and no Native/Core writes
        shell: bash
        run: |
          set -euo pipefail
          BASE="$(git merge-base origin/main HEAD)"
          git diff --name-only "$BASE" HEAD | LC_ALL=C sort >/tmp/stage1-presets
          cat >/tmp/old-presets <<'OLD_PATHS'
          .github/workflows/web-stage1-presets-ux.yml
          scripts/web-stage1-presets-chrome.mjs
          src/lib/presets/stage1-root.mjs
          src/routes/presets/+page.svelte
          tests/scaffold.test.mjs
          tests/web-stage1-presets-root.test.mjs
          OLD_PATHS
          cat >/tmp/my-presets <<'MY_PATHS'
          .github/workflows/web-stage1-presets-ux.yml
          scripts/web-my-presets-internal-chrome.mjs
          src/lib/presets/my-presets-router.mjs
          src/routes/presets/+page.svelte
          tests/web-my-presets-internal-router.test.mjs
          MY_PATHS
          LC_ALL=C sort /tmp/old-presets >/tmp/old-presets-sorted
          LC_ALL=C sort /tmp/my-presets >/tmp/my-presets-sorted
          if diff -q /tmp/stage1-presets /tmp/old-presets-sorted >/dev/null; then
            echo WEB_STAGE1_PRESETS_ORIGINAL_EXACT6_SCOPE_PASS
          elif diff -q /tmp/stage1-presets /tmp/my-presets-sorted >/dev/null; then
            echo WEB_MY_PRESETS_EXACT5_SCOPE_PASS
          else
            echo OUTSIDE_P0_SCOPE
            diff -u /tmp/my-presets-sorted /tmp/stage1-presets || true
            exit 1
          fi
          git diff --exit-code "$BASE" HEAD -- src/lib/presets/NativePresetManager.svelte src/lib/wep/ src/lib/ddv/ src/lib/community/ src/routes/gallery/ src/routes/dreamsnaps/ supabase/ static/ .github/workflows/pages.yml
          echo WEB_STAGE1_PRESETS_UI_ONLY_SCOPE_PASS
      - name: Four root two InGame, eight locale and Native/Provider OFF assertions
        run: |
          node --test tests/web-stage1-presets-root.test.mjs
          if test -f tests/web-my-presets-internal-router.test.mjs; then
            node --test tests/web-my-presets-internal-router.test.mjs
          fi
      - name: Full Node, typecheck and static Pages
        env:
          BASE_PATH: /web
        run: |
          npm test
          npm run check
          npm run build
      - name: No unintended generated positive entity or premium publication
        shell: bash
        run: |
          test -f build/presets/index.html
          test -f build/404.html
          test ! -f build/ja/entity/quest/12345/index.html
          echo WEB_STAGE1_PRESETS_PUBLIC_AUTHORITY_OFF_PASS
  chrome:
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm install --no-save --package-lock=false playwright-core@1.55.0
      - name: Build and localhost gated Presets
        shell: bash
        env:
          BASE_PATH: /web
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
          npm run build
          BASE_PATH='' npm run dev -- --host 127.0.0.1 --port 4289 >/tmp/stage1-presets.log 2>&1 &
          for i in $(seq 1 75); do
            if curl -fsS http://127.0.0.1:4289/presets/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/stage1-presets.log
          exit 1
      - name: Actual Chrome 8 locale root/InGame, 320px/200% keyboard + no provider
        env:
          STAGE1_PRESETS_URL: http://127.0.0.1:4289
          MY_PRESETS_E2E_URL: http://127.0.0.1:4289
        run: |
          node scripts/web-stage1-presets-chrome.mjs
          if test -f scripts/web-my-presets-internal-chrome.mjs; then
            node scripts/web-my-presets-internal-chrome.mjs
          fi

name: 05 QR-C PR1968 Steam626 Bamboo40700007 read-only Target L2 (QA ONLY NEVER MERGE)
on:
  pull_request:
    paths:
      - '.github/workflows/05qrc-pr1968-bamboo40700007-readonly-target-l2.yml'
      - 'crates/ddv-save-core/src/steam_bamboo_single_product_target.rs'
permissions:
  contents: read
jobs:
  qrc1968-steam-bamboo-readonly:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_TARGET_DIR: /tmp/wand-qrc1968-cargo-target
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Fixed exact4 source and QA-only exact2 paths
        run: |
          set -euo pipefail
          SOURCE=5a644332554168642dce5081eff848eda01167b0
          git cat-file -e "$SOURCE^{commit}"
          test "$(git merge-base "$SOURCE" HEAD)" = "$SOURCE"
          git diff --name-only "$SOURCE" HEAD | LC_ALL=C sort >/tmp/qrc1968-actual
          printf '%s\n' '.github/workflows/05qrc-pr1968-bamboo40700007-readonly-target-l2.yml' 'crates/ddv-save-core/src/steam_bamboo_single_product_target.rs' | LC_ALL=C sort >/tmp/qrc1968-expected
          diff -u /tmp/qrc1968-expected /tmp/qrc1968-actual
          git diff --exit-code "$SOURCE" HEAD -- crates/ddv-save-core/src/sr03_installed_geometry.rs crates/ddv-save-core/src/sr03_product_target.rs crates/ddv-save-core/src/steam_single_fence_product_target.rs crates/ddv-save-core/Cargo.toml crates/ddv-save-core/src/semantic_writer.rs crates/ddv-save-core/src/wasm_worker.rs
          echo QRC1968_FIXED_SOURCE_QA_ONLY_BOUNDARY_PASS
      - name: Changed Bamboo Item/stock/geometry/refs synthetic negatives and fresh independent read-only Reopen
        run: |
          set -euo pipefail
          cargo generate-lockfile --manifest-path crates/ddv-save-core/Cargo.toml
          sha256sum crates/ddv-save-core/Cargo.lock >/tmp/qrc1968-lock.sha
          cargo test --locked --manifest-path crates/ddv-save-core/Cargo.toml --features product-steam626-sr03-scoped --lib qa1968_bamboo_changed_target_readonly_contract -- --nocapture
          test -s /tmp/qrc1968-bamboo-fixture.json
          test -s /tmp/qrc1968-bamboo-xy.txt
          cargo test --locked --manifest-path crates/ddv-save-core/Cargo.toml --features product-steam626-sr03-scoped --lib qa1968_bamboo_child_readonly_reopen -- --ignored --nocapture
          cargo test --locked --manifest-path crates/ddv-save-core/Cargo.toml --features product-steam626-sr03-scoped --lib steam626_single_fence_target_exact1_no_debit -- --nocapture
          cargo check --locked --manifest-path crates/ddv-save-core/Cargo.toml --target wasm32-unknown-unknown --no-default-features --features worker-wasm,product-steam626-sr03-scoped
          cargo check --locked --manifest-path crates/ddv-save-core/Cargo.toml --target wasm32-unknown-unknown --no-default-features --features worker-wasm,product-steam626-sr03-scoped,product-switch626-rm01-scoped
          sha256sum -c /tmp/qrc1968-lock.sha
          echo QRC1968_SYNTHETIC_CHANGED_L2_COMPLETE_REAL_PRIVATE_SAVE_TARGET_NOT_RUN

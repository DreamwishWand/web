name: WEB canonical domain BASE_PATH and direct HTTP preflight (NO DNS)
on:
  push:
    branches:
      - 'web/canonical-domain-preflight-*'
  pull_request:
    paths:
      - 'src/routes/+layout.svelte'
      - 'src/lib/foundation/canonical-domain-preview.mjs'
      - 'tests/web-canonical-domain-preflight.test.mjs'
      - 'scripts/web-canonical-domain-preflight-chrome.mjs'
      - '.github/workflows/web-canonical-domain-preflight.yml'
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - name: Exactly five URL/Host preview-only source paths and no existing Pages change
        shell: bash
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha || '' }}"
          if test -z "$BASE"; then BASE="$(git merge-base origin/main HEAD)"; fi
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"
          git diff --name-only "$BASE" HEAD >/tmp/wand-canonical-paths
          test "$(wc -l </tmp/wand-canonical-paths)" -eq 5
          for required in src/routes/+layout.svelte src/lib/foundation/canonical-domain-preview.mjs tests/web-canonical-domain-preflight.test.mjs scripts/web-canonical-domain-preflight-chrome.mjs .github/workflows/web-canonical-domain-preflight.yml; do
            grep -qxF "$required" /tmp/wand-canonical-paths
          done
          git diff --exit-code "$BASE" HEAD -- svelte.config.js .github/workflows/pages.yml static/ src/routes/collection/ src/routes/community-lab/ src/routes/users/ src/lib/community/ src/lib/ddv/ src/lib/wep/ src/lib/collection/ supabase/
          test ! -e static/CNAME
          echo WEB_CANONICAL_SOURCE5_NO_DNS_PAGES_AUTH_WRITER_DIFF_PASS
      - name: Absolute canonical allowlist, status contracts and 8locale static-denial tests
        run: node --test tests/web-canonical-domain-preflight.test.mjs
      - name: Normal regression, Svelte and existing Pages build
        env:
          BASE_PATH: /web
        run: |
          npm test
          npm run check
          npm run build
          test -f build/index.html
          test -f build/collection/index.html
          test -f build/404.html
          test ! -f build/40000047/index.html
          test ! -f build/ja/40000047/index.html
          test ! -f build/users/example_123/index.html
          test ! -e build/CNAME
          echo WEB_EXISTING_PUBLIC_PAGES_WEB_PRESERVED_PASS
  chrome:
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm install --no-save --package-lock=false playwright-core@1.55.0
      - name: Resolve actual installed Chrome
        shell: bash
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          "$CHROME_BIN" --version
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
      - name: Static custom-root domain opt-in only and actual local HTTP 200 404 no fabricated 301
        env:
          BASE_PATH: ''
          VITE_WAND_CANONICAL_ORIGIN: https://dreamwishwand.com
          WAND_HOST_TEST_BASE_PATH: ''
        run: |
          npm run build
          node scripts/web-canonical-domain-preflight-chrome.mjs
      - name: Static current /web Pages retained even if custom-origin env accidentally supplied
        env:
          BASE_PATH: /web
          VITE_WAND_CANONICAL_ORIGIN: https://dreamwishwand.com
          WAND_HOST_TEST_BASE_PATH: /web
        run: |
          npm run build
          node scripts/web-canonical-domain-preflight-chrome.mjs
      - name: No claimed managed HTTPS DNS or account/rights acceptance
        run: echo WEB_CANONICAL_REAL_HTTPS_DNS_CNAME_ALIAS301_AUTH_RIGHTS_NOT_RUN

name: 03 COMM Preset Legacy Privileged SQL Probe FULL162
on:
  push:
    branches: [comm/w-comm-006-post162-preset-envelope-signed-sql-probe-20261104]
permissions:
  contents: read
jobs:
  test-local-auth:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      DDVRE_E2_LOCAL_DISPOSABLE: APPROVED
      DATABASE_URL: ''
      SUPABASE_ACCESS_TOKEN: ''
      SUPABASE_PROJECT_ID: ''
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.0
      - name: Check frozen Source162 and safety
        run: |
          set -euo pipefail
          test "$(find supabase/migrations -name '*.sql' | wc -l)" -eq 162
          test "$(git hash-object supabase/migrations/20261104040000_community_source162_gallery_photo_parent_service_execute_off.sql)" = 6d8ec394b1773c65db88e9b459afc59d6427b5b9
          python3 -m py_compile tests/comm-source162-preset-envelope-postrevoke-probe-disposable.py
          test -z "$DATABASE_URL" && test -z "$SUPABASE_ACCESS_TOKEN" && test -z "$SUPABASE_PROJECT_ID"
      - name: Start local signed ES256 Supabase
        run: |
          set -euo pipefail
          printf '\n[auth]\nsigning_keys_path = "./signing_keys.json"\n' >> supabase/config.toml
          printf '[]\n' > supabase/signing_keys.json
          supabase gen signing-key --algorithm ES256 --yes >/tmp/preset-key.log 2>&1
          printf 'project_id = "ddvre_preset_local_probe_20261104"\n' | cat - supabase/config.toml > /tmp/preset-config
          mv /tmp/preset-config supabase/config.toml
          printf 'COMMUNITY_MEDIA_BUCKET=ddvre-local-media\nWEP_PRESET_ARTIFACT_BUCKET=ddvre-local-artifact\n' > supabase/functions/.env
          timeout 1800s supabase start >/tmp/preset-start.log 2>&1 || { tail -n 10 /tmp/preset-start.log; exit 1; }
          timeout 900s supabase db reset --no-seed >/tmp/preset-reset.log 2>&1 || { tail -n 10 /tmp/preset-reset.log; exit 1; }
      - run: python3 -m pip install --quiet 'psycopg[binary]==3.2.10'
      - name: Real signed 2PG isolated SQL test
        run: |
          set -euo pipefail
          python3 tests/comm-source162-preset-envelope-postrevoke-probe-disposable.py | tee /tmp/preset-probe.log
          grep -q '"case": "PRESET_ENVELOPE_VALID_A2_DIRECT_SQL_FAILCLOSED_NO_DIFF"' /tmp/preset-probe.log
          grep -q '"case": "PRESET_ENVELOPE_POSTREVOKE_R18_FAILCLOSED_TWO_PG_NO_DIFF"' /tmp/preset-probe.log
      - name: Destroy local DB and signer
        if: always()
        run: |
          supabase stop --no-backup >/dev/null 2>&1 || true
          rm -f supabase/signing_keys.json supabase/functions/.env /tmp/preset-*.log /tmp/preset-config

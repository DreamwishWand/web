name: QA ONLY 04 QR-W PR2279 Worker-local encrypted Amount P1G SHA-failure L2 NEVER MERGE
on:
  pull_request:
    paths:
      - '.github/workflows/qa-qrw-pr2279-worker-amount-crypto-fault-l2.yml'
permissions:
  contents: read
jobs:
  actual-worker-local-amount-encrypted-download-zeroization:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 04qrw/pr2279-d4c-worker-amount-crypto-reject-zeroize-l2
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pin original Source2 GitBlobs and independent QA-only2 paths
        shell: bash
        run: |
          set -euxo pipefail
          base=a9a87c578c8bc2a9c64284b15d3ed2c5eb39f817
          source=d4c5e30878d57d3c4e136328df5e32d3881b0c07
          git merge-base --is-ancestor "$base" HEAD
          test "$(git rev-parse "$base:src/lib/dev/local-amount-worker-adapter.mjs")" = 7e2a6fc8250cd5d6ca5cceb0f95e83e06d2d4bd6
          test "$(git rev-parse 'HEAD:src/lib/dev/local-amount-worker-adapter.mjs')" = 3469316b24acc09a8565b8ee57d031315e524e84
          if git cat-file -e "$base:tests/01a-local-amount-download-failure-zeroize.test.mjs" 2>/dev/null; then exit 1; fi
          test "$(git rev-parse 'HEAD:tests/01a-local-amount-download-failure-zeroize.test.mjs')" = f8aa2f7c28b5ef31692478d1bfdaf2a649e0e104
          test "$(git rev-parse 'HEAD:tests/qa-qrw-pr2279-worker-amount-crypto-digest-failure-zeroize-l2.test.mjs')" = 895991dcc854c7cec89e88c8f8484f21819472ea
          for f in src/lib/dev/local-amount-worker-adapter.mjs tests/01a-local-amount-download-failure-zeroize.test.mjs tests/qa-qrw-pr2279-worker-amount-crypto-digest-failure-zeroize-l2.test.mjs .github/workflows/qa-qrw-pr2279-worker-amount-crypto-fault-l2.yml; do
            test "$(git ls-tree HEAD "$f" | awk '{print $1}')" = 100644
          done
          printf '%s\n' src/lib/dev/local-amount-worker-adapter.mjs tests/01a-local-amount-download-failure-zeroize.test.mjs | LC_ALL=C sort >/tmp/src
          printf '%s\n' .github/workflows/qa-qrw-pr2279-worker-amount-crypto-fault-l2.yml tests/qa-qrw-pr2279-worker-amount-crypto-digest-failure-zeroize-l2.test.mjs | LC_ALL=C sort >/tmp/qa
          git diff --name-only "$base" "$source" | LC_ALL=C sort | diff -u /tmp/src -
          git diff --name-only "$source" HEAD | LC_ALL=C sort | diff -u /tmp/qa -
          git diff --quiet "$source" HEAD -- src/ scripts/ ops/ crates/ static/ package-lock.json
          echo QRW2279_ORIGINAL2_QAONLY2_EXACT_BLOBS_PASS
      - name: Exercise actual Worker-local readBoundEncryptedCopy and independent digest/OPFS failure buffer wipe
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/01a-local-amount-download-failure-zeroize.test.mjs tests/qa-qrw-pr2279-worker-amount-crypto-digest-failure-zeroize-l2.test.mjs
          echo QRW2279_WORKER_LOCAL_AMOUNT_CIPHERTEXT_THROW_PATH_ZEROIZE_L2_PASS

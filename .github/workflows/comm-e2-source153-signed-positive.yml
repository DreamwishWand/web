name: COMM Source153 REAL Server Session Revocation ES256 Disposable
on:
  pull_request:
    branches:
      - fix/03comm-pr286-sdk-early-401-private-cache-20261101
permissions:
  contents: read
jobs:
  source153-server-session-revocation:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      DDVRE_E2_LOCAL_DISPOSABLE: APPROVED
      DATABASE_URL: ''
      SUPABASE_ACCESS_TOKEN: ''
      SUPABASE_PROJECT_ID: ''
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Strict isolated PR288 lineage and exactly five source test files
        shell: bash
        run: |
          set -euo pipefail
          BASE=1755d2f37f08bb93604d1839245f8565cf603916
          git merge-base --is-ancestor "$BASE" HEAD
          test -z "$(git diff --name-only "$BASE" HEAD -- src package.json package-lock.json)"
          test "$(find supabase/migrations -name '*.sql' | wc -l)" -eq 154
          test "$(git hash-object supabase/migrations/20261028000060_x05_authoritative_owner_projection_v2.sql)" = 356cc10138cd351674fde8dd943acc968e26fbbc
          test "$(git hash-object tests/comm-e2-source153-signed-positive.py)" = 85fc3ea98e3df3f872ecab634fc76e0427e3b4da
          test "$(git hash-object src/lib/dreamsnaps/source153-owner-consumer-v2.js)" = f981b7596711b47bceb2fa79a2191e79e8f1b459
          test "$(git hash-object docs/community/policy/dreamsnap-image-grant-v1.candidate.txt)" = d9a26a2159e2a671ba6a213bf259df42aaaeb61f
          test "$(git hash-object docs/community/policy/dreamsnap-image-grant-v1.candidate.json)" = e416bb7671226a669cfa81729ca0ed14f47bc049
          test -z "$DATABASE_URL" && test -z "$SUPABASE_ACCESS_TOKEN" && test -z "$SUPABASE_PROJECT_ID"
          python3 -m py_compile tests/comm-e2-source153-signed-positive.py tests/comm-source153-server-session-signed-e2.py
          git diff --name-only "$BASE" HEAD > /tmp/source153-session-diff-paths
          test "$(wc -l </tmp/source153-session-diff-paths)" -eq 5
          for p in supabase/migrations/20261102000000_community_source153_signed_session_lineage_v2.sql supabase/functions/community-dreamsnap-owner/index.ts tests/comm-source153-server-session-signed-e2.py docs/community/source153-verified-session-enforcement-v2-20261102.md .github/workflows/comm-e2-source153-signed-positive.yml; do
            grep -Fxq "$p" /tmp/source153-session-diff-paths
          done
          echo SOURCE153_SESSION_EXACT_PR288_PARENT_FIVE_FILE_GUARD
      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.0
      - name: Ephemeral real GoTrue ES256 private signer (runner only)
        shell: bash
        run: |
          set -euo pipefail
          printf '\n[auth]\nsigning_keys_path = "./signing_keys.json"\n' >> supabase/config.toml
          printf '[]\n' > supabase/signing_keys.json
          supabase gen signing-key --algorithm ES256 --yes >/tmp/e2-keygen-private.log 2>&1
          python3 - <<'PY'
          import json
          keys=json.load(open('supabase/signing_keys.json'))
          assert isinstance(keys,list) and any(k.get('kty')=='EC' and k.get('crv')=='P-256' and k.get('kid') and k.get('d') for k in keys)
          print('E2_GENUINE_LOCAL_ES256_PRIVATE_SIGNER_READY')
          PY
      - name: Boot clean isolated FULL153 without managed Stage or external Provider
        shell: bash
        run: |
          set -euo pipefail
          printf 'project_id = "ddvre_e2_genuine_positive_disposable_only"\n' | cat - supabase/config.toml >/tmp/e2-config.tmp
          mv /tmp/e2-config.tmp supabase/config.toml
          timeout 1800s supabase start >/tmp/e2-private-boot.log 2>&1 || { echo E2_DISPOSABLE_BOOT_FAILED; exit 1; }
          echo E2_DISPOSABLE_FULL153_BOOT_SUCCESS
      - name: Install isolated local PostgreSQL driver
        run: python3 -m pip install --quiet 'psycopg[binary]==3.2.10'
      - name: Execute signed A1 A2 Local Global Source153 actual HTTP 401 200
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/comm-source153-server-session-signed-e2.py 2>&1 | tee /tmp/session-sanitized-markers.log
          grep -q '"case": "SOURCE153_SERVER_ENFORCED_SIGNED_SESSION_PASS"' /tmp/session-sanitized-markers.log
          echo SOURCE153_REAL_ES256_SERVER_SESSION_TARGETED_TEST_ONLY_PASS
      - name: Stop disposable stack and remove synthetic credentials
        if: always()
        shell: bash
        run: |
          supabase stop --no-backup >/dev/null 2>&1 || true
          rm -f supabase/signing_keys.json /tmp/e2-private-boot.log /tmp/e2-keygen-private.log /tmp/e2-config.tmp /tmp/session-sanitized-markers.log /tmp/source153-session-diff-paths
          echo E2_LOCAL_TEARDOWN_ATTEMPTED_NOT_REMOTE_PURGE

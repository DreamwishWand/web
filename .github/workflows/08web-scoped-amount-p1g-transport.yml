name: 08 WEB scoped amount opt-in actual P1G transport
on:
  pull_request:
    paths:
      - 'src/lib/ddv/core/save/product-scoped-amount-transport.mjs'
      - 'src/lib/ddv/core/save/product-wasm-read-owner.mjs'
      - 'src/lib/ddv/core/save/p1g-rust-worker-readonly-bridge.mjs'
      - 'tests/product-scoped-amount-transport.test.mjs'
      - 'tests/product-scoped-amount-actual.mjs'
      - '.github/workflows/08web-scoped-amount-p1g-transport.yml'
permissions:
  contents: read
jobs:
  actual-synthetic:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CARGO_TARGET_DIR: /tmp/wand-scoped-amount-target
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Existing Worker boundary and new receipt negatives
        run: node --test tests/product-scoped-amount-transport.test.mjs tests/product-wasm-read-owner.test.mjs tests/product-wasm-typed-read-owner.test.mjs
      - name: Build opt-in ACT916 generated WASM only (no product artifact or Save)
        run: |
          set -euo pipefail
          grep -Fx 'wasm-bindgen = { version = "=0.2.105", optional = true }' crates/ddv-save-core/Cargo.toml
          cargo build --locked --manifest-path crates/ddv-save-core/Cargo.toml --release --target wasm32-unknown-unknown --no-default-features --features worker-wasm,product-amount-scoped
          cargo install wasm-bindgen-cli --version 0.2.105 --locked --root /tmp/wand-scoped-amount-tools
          mkdir -p /tmp/wand-scoped-amount-pkg
          /tmp/wand-scoped-amount-tools/bin/wasm-bindgen "$CARGO_TARGET_DIR/wasm32-unknown-unknown/release/ddv_save_core.wasm" --out-dir /tmp/wand-scoped-amount-pkg --target nodejs --no-typescript
          WAND_SCOPED_WASM_MODULE=/tmp/wand-scoped-amount-pkg/ddv_save_core.js node tests/product-scoped-amount-actual.mjs
      - name: Public Writer remains OFF
        run: |
          grep -Fq -- '--features worker-wasm,indexed-read' .github/workflows/pages.yml
          ! git grep -n 'allowScopedAmountSource:true' -- src/routes src/lib/wep
          test -z "$(git ls-files '*.p1g')"

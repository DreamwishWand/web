name: "04 QR-W PR879 independent new7 verified first NONEMPTY local Scene"
on:
  push:
    branches: [qa/04qr-w-pr879-savefree-first-nonempty-new7-20261110]
  pull_request:
    paths:
      - ".github/workflows/04qr-w-pr879-savefree-first-nonempty-new7-20261110.yml"
      - "scripts/04qr-w-pr879-savefree-first-nonempty-new7-20261110.mjs"
permissions:
  contents: read
jobs:
  true-catalog-installed-chrome:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm install --no-save --package-lock=false playwright-core@1.55.0
      - name: "Start isolated application with no Private Save"
        shell: bash
        run: |
          set -euo pipefail
          test -z "${DDV_PRIVATE_SAVE_PATH:-}"
          test -z "${WEP_PRIVATE_P1G_PATH:-}"
          test -z "${P1G_PATH:-}"
          BIN="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || true)"
          test -n "$BIN"
          "$BIN" --version
          echo "CHROME_BIN=$BIN" >> "$GITHUB_ENV"
          BASE_PATH='' npm run dev -- --host 127.0.0.1 --port 4362 >/tmp/qrw879.log 2>&1 &
          for i in $(seq 1 85); do
            if curl -fsS http://127.0.0.1:4362/editor/world/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/qrw879.log
          exit 1
      - name: "New-seven independent real SHAs Node negatives and installed Chrome"
        env:
          QRW879_ORIGIN: http://127.0.0.1:4362
        run: node scripts/04qr-w-pr879-savefree-first-nonempty-new7-20261110.mjs
      - name: "QA only Gate: never merge"
        run: echo "QRW879_QA_ONLY_NO_MERGE_NATIVEV3_WRITER_APPLY_CLOUD_PROVIDER_COMMUNITY_OFF"

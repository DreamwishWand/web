name: 04 QR-S ACT1140 exact3 (QA ONLY)
on:
  pull_request:
    paths:
      - '.github/workflows/04qrs-act1140-r22-exact3.yml'
permissions:
  contents: read
jobs:
  r22-exact3:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2bdc42a7e41dee697e1d0d905e4e474e431859b5
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Actual fixed exact3 gate, isolated Git composition
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:scripts/wasm-distribution/r22-accepted-rust-scope.mjs)" = 0a08a765d3b16b82d951d67b2d6b55b5705713a9
          git fetch --no-tags origin f0f1b3441c0b5507818797a5e74441a6400f9a68 5a5ce7eab0e5922d15e50b9ed699c44570c23f30 eaeafb84b55d522f1f6eab6e84d879780fc1d031 2ec84d06a24d5fe964c7e8b8186a6b442650593b d2f903e43f84bb11e1133c2e3933fce9977dc122
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {execFileSync} from 'node:child_process';
          import fs from 'node:fs';import os from 'node:os';import path from 'node:path';
          import {verifyAcceptedRustScope} from './scripts/wasm-distribution/r22-accepted-rust-scope.mjs';
          const gate='scripts/wasm-distribution/r22-accepted-rust-scope.mjs',core='crates/ddv-save-core';
          const old='2ec84d06a24d5fe964c7e8b8186a6b442650593b',oldPost='eaeafb84b55d522f1f6eab6e84d879780fc1d031',main='f0f1b3441c0b5507818797a5e74441a6400f9a68',child='5a5ce7eab0e5922d15e50b9ed699c44570c23f30',fixed='2bdc42a7e41dee697e1d0d905e4e474e431859b5';
          const dir=fs.mkdtempSync(path.join(os.tmpdir(),'act1140-')),repo=path.join(dir,'repo'),idx=path.join(dir,'index');
          const env={...process.env,GIT_CONFIG_NOSYSTEM:'1',GIT_CONFIG_GLOBAL:'/dev/null',GIT_NO_REPLACE_OBJECTS:'1',GIT_AUTHOR_NAME:'QA',GIT_AUTHOR_EMAIL:'qa@example.invalid',GIT_COMMITTER_NAME:'QA',GIT_COMMITTER_EMAIL:'qa@example.invalid'};
          const run=(cwd,args,more={},input)=>execFileSync('git',args,{cwd,env:{...env,...more},input,encoding:'utf8',stdio:['pipe','pipe','pipe'],maxBuffer:16*1024*1024}).trim();
          const g=(...a)=>run(repo,a),ix=(...a)=>run(repo,a,{GIT_INDEX_FILE:idx});
          const get=(rev,p)=>{const m=/^(100644|100755) blob ([0-9a-f]{40})\t(.+)$/.exec(g('ls-tree',rev,'--',p));assert(m&&m[3]===p);return [m[1],m[2]]};
          const set=(p,m,b)=>ix('update-index','--add','--cacheinfo',m+','+b+','+p);
          const blob=s=>run(repo,['hash-object','-w','--stdin'],{},s);
          const make=(base,from,paths,edit=()=>{})=>{fs.rmSync(idx,{force:true});ix('read-tree',base);for(const p of paths)set(p,...get(from,p));edit();return run(repo,['commit-tree',ix('write-tree'),'-p',base],{},'isolated model\n')};
          const check=(base,candidate,count)=>{const r=verifyAcceptedRustScope(repo,base,candidate);assert.equal(r.entryCount,count);assert.equal(r.mergeAuthorized,false);assert.equal(r.writerAuthorized,false)};
          let pos=0,neg=0;const yes=(name,fn)=>{fn();pos++;console.log('POS',name)},no=(name,fn)=>{assert.throws(fn,undefined,name);neg++;console.log('NEG',name)};
          try{
            run(process.cwd(),['clone','--no-hardlinks','--no-checkout',process.cwd(),repo]);
            const oldPaths=g('diff','--name-only',old,oldPost).split('\n');assert.equal(oldPaths.length,15);
            const gates=['scripts/wasm-distribution/verify-protected-release.mjs',gate,'scripts/int-selection-preflight.mjs'];
            const base15=make(old,fixed,gates);const candidate15=make(base15,oldPost,oldPaths);
            yes('historical exact15 preserved',()=>check(base15,candidate15,15));
            const base4=make(main,fixed,[gate]);const paths=['product_amount_scoped.rs','product_switch626_chest.rs','wasm_worker.rs','worker_session.rs'].map(p=>core+'/src/'+p);
            const exact=make(base4,child,paths);
            assert.equal(g('rev-parse',base4+':'+core),'ca1ef1772b53ff535618fc8263cd647f757f3dad');
            assert.equal(g('rev-parse',exact+':'+core),'2b50d1208e830433bd86bb9506b8cf67228d518d');
            yes('actual exact4 on modeled accepted gate',()=>check(base4,exact,4));
            const noncore=make(base4,child,[],()=>set('qa-noncore','100644',blob('synthetic')));
            yes('non-Core drift retains exact4',()=>check(noncore,make(noncore,child,paths),4));
            no('self introducing gate',()=>check(main,exact,4));
            no('missing path',()=>check(base4,make(base4,child,paths.slice(1)),4));
            no('extra non-Core path',()=>check(base4,make(base4,child,paths,()=>set('qa-extra','100644',blob('extra'))),4));
            no('changed Core blob',()=>check(base4,make(base4,child,paths,()=>set(paths[0],'100644',blob('changed'))),4));
            no('changed mode',()=>check(base4,make(base4,child,paths,()=>set(paths[0],'100755',get(child,paths[0])[1])),4));
            no('gate change',()=>check(base4,make(base4,child,paths,()=>set(gate,'100644',blob('changed'))),4));
            const drift=make(base4,child,[],()=>set(core+'/src/qa-drift.rs','100644',blob('synthetic')));
            no('base Core drift',()=>check(drift,make(drift,child,paths),4));
            no('mixed old/new pair',()=>check(base15,make(base15,child,paths),4));
            no('wrong ancestor',()=>check(base4,base15,4));
            const feature='d2f903e43f84bb11e1133c2e3933fce9977dc122';
            const cargo=core+'/Cargo.toml',worker=core+'/src/wasm_worker.rs',config='scripts/wasm-distribution/protected-release-inputs.json';
            const oldCargo='0939c989984ff49aff466da35e427289758d8d4f',newCargo='70e9a9b32ff4cafc2efa9f2dc7caada82224b8b7';
            const raw=execFileSync('git',['show',exact+':'+config],{cwd:repo,env,encoding:'utf8'});
            assert.equal(get(exact,config)[1],'d5e20db31ce4302964989d65355d1e26a61e22ec');
            assert.equal(raw.split(oldCargo).length,2);
            const updated=raw.replace(oldCargo,newCargo);
            assert.equal(blob(updated),'502fd7b446c04b943ce624e830a846428d1ec213');
            const oldConfig=JSON.parse(raw),newConfig=JSON.parse(updated);
            assert.deepEqual(newConfig,{...oldConfig,cargoTomlGitBlob:newCargo});
            assert.equal(get(feature,cargo)[1],newCargo);
            assert.equal(get(feature,worker)[1],'cd141f4eff59d92333026316a5cb6f144ddfaa19');
            const compose=(base,parts,extra=()=>{})=>make(base,feature,parts,extra);
            const cfg=()=>set(config,'100644',blob(updated));
            const target=compose(exact,[cargo,worker],cfg);
            assert.equal(g('rev-parse',target+':'+core),'aceda9d906c3137d717824a3079e84165ab5f62e');
            yes('exact3 atomic positive',()=>{check(exact,target,3);const r=verifyAcceptedRustScope(repo,exact,target);assert.equal(r.sourcePr,1458);assert.equal(r.sourceHead,feature);assert.equal(r.sourceTree,'9b0b7dacdd40ddcfd5f86aa1143b6b795cede583')});
            yes('unrelated non-Core base drift',()=>{const b=compose(exact,[],()=>set('qa-noncore','100644',blob('note')));check(b,compose(b,[cargo,worker],cfg),3)});
            no('config only',()=>check(exact,compose(exact,[],cfg),3));
            no('Cargo only',()=>check(exact,compose(exact,[cargo]),3));
            no('missing config',()=>check(exact,compose(exact,[cargo,worker]),3));
            no('missing worker',()=>check(exact,compose(exact,[cargo],cfg),3));
            no('extra non-Core',()=>check(exact,compose(exact,[cargo,worker],()=>{cfg();set('qa-extra','100644',blob('extra'))}),3));
            no('wrong config blob',()=>check(exact,compose(exact,[cargo,worker],()=>set(config,'100644',blob(updated+'\n'))),3));
            no('wrong config mode',()=>check(exact,compose(exact,[cargo,worker],()=>set(config,'100755',blob(updated))),3));
            no('wrong Core',()=>check(exact,compose(exact,[cargo,worker],()=>{cfg();set(core+'/src/qa-drift.rs','100644',blob('drift'))}),3));
            no('mixed exact4/3',()=>check(base4,compose(base4,[cargo,worker],cfg),3));
            no('self authorize',()=>{const prior=make(exact,'f6300643dddfeac0abc5dd7954edd3904821bde2',[gate]);check(prior,target,3)});
            no('zero Rust cannot use exact3 exception',()=>check(exact,compose(exact,[]),3));
            assert.equal(g('rev-parse',fixed+':scripts/wasm-distribution/verify-protected-release.mjs'),g('rev-parse','f6300643dddfeac0abc5dd7954edd3904821bde2:scripts/wasm-distribution/verify-protected-release.mjs'));
            console.log('ACT1140_EXACT3_PASS',JSON.stringify({pos,neg,actualGit:true,actualProtectedApproval:false,authority:false}));
          }finally{fs.rmSync(dir,{recursive:true,force:true})}
          JS

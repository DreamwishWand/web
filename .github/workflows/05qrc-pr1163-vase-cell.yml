name: 05 QR-C PR1163 independent exact vase local cell
on:
  pull_request:
    paths:
      - 'crates/ddv-save-core/tests/qa_pr1163_vase_cell.rs'
      - '.github/workflows/05qrc-pr1163-vase-cell.yml'
permissions:
  contents: read
jobs:
  independent:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
      - name: Exact Source2 QA-only2
        run: |
          source=c4e892744dd7892f6fc16af86d75138bc265aa18
          test "$(git merge-base "$source" HEAD)" = "$source"
          test "$(git diff --name-only "$source" HEAD | wc -l)" -eq 2
          test "$(git diff --diff-filter=A --name-only "$source" HEAD | wc -l)" -eq 2
          test "$(git rev-parse HEAD:crates/ddv-save-core/src/spatial_reference_index.rs)" = 50ed4f2834fb83ee4fb58dd8e72f8bec66897bf5
          test "$(git rev-parse HEAD:crates/ddv-save-core/tests/steam_native_vase_layer_scope.rs)" = d09043b735498179542d28f2b9f9cc55107ac5a3
      - name: Locked independent exact local predicate
        run: |
          cp scripts/wasm-distribution/approved-Cargo.lock crates/ddv-save-core/Cargo.lock
          echo 'e58486d673df79bfe7e72b80449e39389e57010fe4051edcdcff9b53c2da898c  crates/ddv-save-core/Cargo.lock' | sha256sum -c -
          cargo test --locked --manifest-path crates/ddv-save-core/Cargo.toml --no-default-features --features indexed-read --test qa_pr1163_vase_cell -- --nocapture
          cargo test --locked --manifest-path crates/ddv-save-core/Cargo.toml --no-default-features --features indexed-read --test steam_native_vase_layer_scope --test steam_native_cardinal_layer_cells

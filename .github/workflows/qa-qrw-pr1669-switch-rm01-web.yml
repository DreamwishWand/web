name: QA ONLY PR1669 Switch626 RM01 exact8 Web boundary (never merge)
on:
  pull_request:
    paths:
      - '.github/workflows/qa-qrw-pr1669-switch-rm01-web.yml'
permissions:
  contents: read
jobs:
  actual-connection:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_TARGET_DIR: /tmp/qrw-rm01-target
    steps:
      - uses: actions/checkout@v4

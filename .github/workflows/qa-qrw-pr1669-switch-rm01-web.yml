          <script>
          import {onMount} from 'svelte';import {setLocale} from '$lib/i18n/runtime.js';
          import LocalPlacementEditorDev from '$lib/dev/LocalPlacementEditorDev.svelte';import {localPlacementCopy} from '$lib/dev/local-placement-copy.mjs';
          let adapter=null,generation=0;
          const trace={open:[],preview:[],stage:0,close:0,patch:{}};
          const safe=(kind,extra={})=>({kind,ok:true,writerAuthorized:false,nativeV3Verified:false,originalOverwriteAuthorized:false,...extra});
          function make(){
           let input=null;return {async open(a){input=a;trace.open.push(a.build.buildId);return safe('OPEN')},
           async close(){trace.close++;input=null;return safe('CLOSED')},
           async backupOriginal(){return {backupReadbackVerified:true,originalUnchanged:true,shaMatched:true,sizeMatched:true,separateName:true,originalName:input.file.name,originalSha256:input.originalSha256,originalSizeBytes:input.file.size,backupName:'synthetic-backup.p1g'}},

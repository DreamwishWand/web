           async stagePlacement(){trace.stage++;return safe('STAGED',{exactFieldChangedCount:8})},async undo(){return safe('UNDONE')},async redo(){return safe('REDONE')},async exportEditedCopy(){throw Error('QA no export')},async downloadVerifiedCopy(){throw Error('QA no download')}};

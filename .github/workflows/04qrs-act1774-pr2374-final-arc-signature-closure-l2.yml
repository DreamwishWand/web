            assert.ok(bambooSource.includes("git('ls-tree','HEAD','--',path)"));
            assert.ok(bambooSource.includes("git('hash-object','--no-filters','--',path)"));
            assert.ok(bambooSource.includes("protectedPagesContextMatches(env,head,head)"));

            const missing={...new15};delete missing[delta[0]];
            assert.equal(pinOk(missing),false);negatives++;
            assert.equal(pinOk({...new15,'crates/ddv-save-core/src/unapproved_writer.rs':'0'.repeat(40)}),false);
            negatives++;
            const [bambooSource,bambooOld]=[

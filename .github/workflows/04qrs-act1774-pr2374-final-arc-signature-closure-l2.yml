            git(work,'commit','-qm','QA-only intermediate unzeroed Arc regression');
            assert.equal(at(work,'HEAD',product),'34286a10bc726d9195d806b15273792614c99fa6');
            assert.equal(await signer.bambooAcceptedRustCheckoutOk(),false,'INTERMEDIATE_UNZEROED_ARC_PRODUCT_DENIED');negatives++;
            git(work,'checkout','--force','--detach',SOURCE);

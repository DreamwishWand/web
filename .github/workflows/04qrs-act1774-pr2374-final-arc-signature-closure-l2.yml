              assert.equal(new15[path],sha,'PIN_CURRENT_'+path);
              assert.equal(mode(cwd,SOURCE,path),'100644','PIN_MODE_'+path);
            }
            const delta=Object.keys(new15).filter(path=>old15[path]!==new15[path]);
            assert.deepEqual(delta,['crates/ddv-save-core/src/product_session.rs']);
            assert.equal(old15[delta[0]],OLD_SESSION);
            assert.equal(new15[delta[0]],NEW_SESSION);
            assert.equal(pinOk(new15),true);
            assert.equal(pinOk(old15),false);negatives++;
            assert.equal(pinOk({...new15,[delta[0]]:OLD_SESSION}),false);negatives++;
            assert.equal(pinOk({...new15,[delta[0]]:'34286a10bc726d9195d806b15273792614c99fa6'}),false,'FORMER_UNZEROED_ARC_SHA_DENIED');negatives++;
            for(const path of Object.keys(pins)){
              assert.equal(pinOk({...new15,[path]:'f'.repeat(40)}),false,'WRONG_SHA_DENIED_'+path);
              negatives++;

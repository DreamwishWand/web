name: 04 QR-W PR1196 exact Steam HOLD10 independent
on:
  pull_request:
    paths:
      - '.github/workflows/04qr-w-pr1196-steam-hold10-independent.yml'
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          set -euo pipefail
          test "$(git merge-base HEAD '827fec84f60e9fa6fb8ccbde014b3fe4b46081a3')" = '827fec84f60e9fa6fb8ccbde014b3fe4b46081a3'
          test "$(git diff --name-only '827fec84f60e9fa6fb8ccbde014b3fe4b46081a3' HEAD)" = '.github/workflows/04qr-w-pr1196-steam-hold10-independent.yml'
          test "$(git diff --name-only '2f4044e9f4258398fb7fe2ec00e00cf0fb199dff' '827fec84f60e9fa6fb8ccbde014b3fe4b46081a3' | wc -l)" = 4
          test "$(git rev-parse HEAD:.github/workflows/web-shared-catalog-detail.yml)" = 'a6aa95901a73ecf6e2a876c476ac717240f61f94'
          test "$(git rev-parse HEAD:src/lib/item-media/steam1253-hold10-pins.mjs)" = '279c8ee344246c839a44136caa75bd3cebe9d996'
          test "$(git rev-parse HEAD:src/lib/item-media/switch1253-public-item-images.mjs)" = '730ac39005ec39fd9d653510c6a1b28d580479a5'
          test "$(git rev-parse HEAD:tests/web-steam1253-door-primary-contract.test.mjs)" = 'a23b95bb0307b2c7a82346dd9c6afb0dc93f63c3'
          npm ci --no-audit --no-fund
          npm install --no-save --package-lock=false playwright-core@1.55.0
          git show 2f4044e9f4258398fb7fe2ec00e00cf0fb199dff:src/lib/item-media/switch1253-public-item-images.mjs > src/lib/item-media/qa-parent.mjs
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';import {createHash} from 'node:crypto';import * as M from './src/lib/item-media/switch1253-public-item-images.mjs';import * as P from './src/lib/item-media/qa-parent.mjs';
          const review=o=>({...o,mediaPublic:true,rightsReview:'OPERATOR_ACCEPTED',receivingContact:'MANAGED_VERIFIED',takedown:'MANAGED_TESTED',managedHttps:'MANAGED_VERIFIED',attribution:'EIGHT_LOCALES_REVIEWED',oldUrlAndCache:'MANAGED_TESTED',rollback:'MANAGED_TESTED',operatorReceiptSha256:'c'.repeat(64),items:{}});
          const fields=['originalNativeStreamSha256','sourcePngSha256','webpSha256','rightsStatus','publicationDecision','visibility'];
          function bind(m,r){for(const [id,e] of Object.entries(m.items)){e.publicationDecision='OWNER_SCOPED_PUBLICATION_ACCEPTED';r.items[id]=Object.fromEntries(fields.map(k=>[k,e[k]]))}const {mediaPublic,items,...p}=r;m.publication={gate:'MEDIA_PUBLIC_SCOPED_ON',...p};return m}
          const sr=review(M.STEAM1253_REVIEWED_RELEASE),wr=review(M.SWITCH1253_REVIEWED_RELEASE),wm=M.prepareSwitch1253ItemImageManifest();wm.items['40006096']={...wm.items['40000047'],...M.SWITCH1253_NATIVE_PINS['40006096']};bind(wm,wr);
          const urlFor=id=>{const p=M.STEAM1253_NATIVE_PINS[id];return '/ddv/item-images/'+M.STEAM1253_ITEM_IMAGE_VARIANT+'/'+p.webpSha256.slice(0,2)+'/'+p.webpSha256+'.webp'};
          
          const pins=M.STEAM1253_NATIVE_PINS,prior=P.STEAM1253_NATIVE_PINS,ids=Object.keys(pins).filter(id=>!Object.hasOwn(prior,id)).sort();assert.equal(ids.length,10);assert.deepEqual(ids,['40000074','40000162','40001327','40001755','40001771','40003776','40004576','40006509','40006540','40006573']);assert.equal(Object.keys(pins).length,197);for(const id of Object.keys(prior))assert.deepEqual(pins[id],prior[id]);assert.deepEqual(M.SWITCH1253_NATIVE_PINS,P.SWITCH1253_NATIVE_PINS);assert.deepEqual(M.SWITCH1253_VISUAL_QUARANTINE,P.SWITCH1253_VISUAL_QUARANTINE);assert.deepEqual(M.STEAM1253_REVIEWED_RELEASE,P.STEAM1253_REVIEWED_RELEASE);assert.equal(M.STEAM1253_REVIEWED_RELEASE.mediaPublic,false);
          const rows=ids.map(id=>{const p=pins[id];return [id,p.iconGuid,p.originalNativeStreamSha256,p.sourcePngSha256,p.webpSha256,p.rgba160Sha256]});
          assert.equal(createHash('sha256').update(JSON.stringify(rows)).digest('hex'),'1b14c9b233930c7c7493bf6f5531aa3af3d7b66b84031656a5b2d72c889ab5c7');
          assert.equal(new Set(Object.values(pins).map(p=>p.iconGuid)).size,197);assert.equal(new Set(Object.values(pins).map(p=>p.webpSha256)).size,197);
          const sm=bind(M.prepareSteam1253ItemImageManifest(Object.keys(pins)),sr);sm.switch=wm;const cat=M.validateSteam1253ItemImageCatalog(sm,sr,wr);assert.equal(cat.count,197);const hide=['40002422','40006077','40002400','40003299','40300001'];for(const id of hide){assert.equal(M.scopedSwitch1253ItemImageHref('',id,cat),null);const x=structuredClone(sm);x.items[id]={...x.items[ids[0]]};const rr=structuredClone(sr);rr.items[id]={...rr.items[ids[0]]};assert.throws(()=>M.validateSteam1253ItemImageCatalog(x,rr,wr));}
          for(const id of ids){const p=pins[id];assert.ok(Object.isFrozen(p));assert.equal(p.platform,'Steam Windows');assert.equal(p.gameVersion,'1.25.3');assert.equal(p.schema,626);assert.equal(p.visibility,'RELEASED_PLAYER_FACING');assert.equal(p.codec,'WEBP_LOSSLESS_RGBA_EXACT');assert.equal(p.fallbackPolicy,'NO_FALLBACK_SWITCH_HISTORICAL_HOLD');for(const k of ['fallbackPlatform','fallbackBuildID','fallbackBundleSha256','fallbackNativeStreamSha256'])assert.equal(p[k],null);assert.equal(p.width,160);assert.equal(p.height,160);assert.equal(M.scopedSwitch1253ItemImageHref('/web',id,cat),'/web'+urlFor(id));const single=bind(M.prepareSteam1253ItemImageManifest([id]),sr);single.switch=wm;assert.equal(M.validateSteam1253ItemImageCatalog(single,sr,wr).count,1);const removed=structuredClone(sm);delete removed.items[id];const w=M.validateSteam1253ItemImageCatalog(removed,sr,wr);assert.equal(w.count,196);assert.equal(M.scopedSwitch1253ItemImageHref('',id,w),null);
          for(const f of ['iconGuid','originalNativeStreamSha256','sourcePngSha256','webpSha256','rgba160Sha256','fallbackNativeStreamSha256','fallbackPlatform','fallbackBuildID','fallbackBundleSha256','fallbackPolicy','visibility','rightsStatus','publicationDecision','fullVersion']){const x=structuredClone(single);x.items[id][f]='FORGED';assert.throws(()=>M.validateSteam1253ItemImageCatalog(x,sr,wr))}
          const x=structuredClone(single);x.items[id]=structuredClone(sm.items[ids.find(i=>i!==id)]);assert.throws(()=>M.validateSteam1253ItemImageCatalog(x,sr,wr));assert.equal(M.scopedSwitch1253ItemImageHref('',p.iconGuid,cat),null);}
          assert.throws(()=>M.validateSteam1253ItemImageCatalog(sm));assert.equal(M.scopedSwitch1253ItemImageHref('', '40006096', {target:M.SWITCH1253_TARGET,assetVariant:M.SWITCH1253_ITEM_IMAGE_VARIANT,codec:'WEBP_LOSSLESS_RGBA_EXACT',items:{'40006096':M.SWITCH1253_NATIVE_PINS['40006096']}}),null);console.log('QA738_EXACT_10_INDEPENDENT_PIN_DIGEST_PARENT_IMMUTABLE_ALL_WITHDRAW_DENY_PASS');
          JS
          rm src/lib/item-media/qa-parent.mjs
          export CHROME_BIN="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium)"
          BASE_PATH='' npm run dev -- --host 127.0.0.1 --port 4375 --strictPort >/tmp/qa.log 2>&1 &
          for i in $(seq 1 75); do if curl -fsS http://127.0.0.1:4375/collection/ >/dev/null; then break; fi; sleep 1; done
          curl -fsS http://127.0.0.1:4375/collection/ >/dev/null
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';import {chromium} from 'playwright-core';
          const root='http://127.0.0.1:4375',browser=await chromium.launch({headless:true,executablePath:process.env.CHROME_BIN,args:['--no-sandbox','--disable-dev-shm-usage']});
          try{const ctx=await browser.newContext({serviceWorkers:'block',viewport:{width:1280,height:900}}),p=await ctx.newPage(),hits=[],errs=[],bad=[];p.setDefaultTimeout(45000);p.on('pageerror',e=>errs.push(e.message));ctx.on('request',r=>{if(!r.url().startsWith(root+'/')||!['GET','HEAD'].includes(r.method()))bad.push(r.method())});
          const ids=["40000074","40006509"];await p.goto(root+'/collection/',{waitUntil:'domcontentloaded'});await p.locator('[data-stage1-category-grid] .category-card').first().waitFor();const cfg=await p.evaluate(async ids=>{const M=await import('/src/lib/item-media/switch1253-public-item-images.mjs');const review=o=>({...o,mediaPublic:true,rightsReview:'OPERATOR_ACCEPTED',receivingContact:'MANAGED_VERIFIED',takedown:'MANAGED_TESTED',managedHttps:'MANAGED_VERIFIED',attribution:'EIGHT_LOCALES_REVIEWED',oldUrlAndCache:'MANAGED_TESTED',rollback:'MANAGED_TESTED',operatorReceiptSha256:'c'.repeat(64),items:{}});
          const fields=['originalNativeStreamSha256','sourcePngSha256','webpSha256','rightsStatus','publicationDecision','visibility'];
          function bind(m,r){for(const [id,e] of Object.entries(m.items)){e.publicationDecision='OWNER_SCOPED_PUBLICATION_ACCEPTED';r.items[id]=Object.fromEntries(fields.map(k=>[k,e[k]]))}const {mediaPublic,items,...p}=r;m.publication={gate:'MEDIA_PUBLIC_SCOPED_ON',...p};return m}
          const sr=review(M.STEAM1253_REVIEWED_RELEASE),wr=review(M.SWITCH1253_REVIEWED_RELEASE),wm=M.prepareSwitch1253ItemImageManifest();wm.items['40006096']={...wm.items['40000047'],...M.SWITCH1253_NATIVE_PINS['40006096']};bind(wm,wr);
          const urlFor=id=>{const p=M.STEAM1253_NATIVE_PINS[id];return '/ddv/item-images/'+M.STEAM1253_ITEM_IMAGE_VARIANT+'/'+p.webpSha256.slice(0,2)+'/'+p.webpSha256+'.webp'};
          
          const paths=Object.fromEntries(ids.map(id=>[id,urlFor(id)]));const cv=document.createElement('canvas');cv.width=cv.height=160;const g=cv.getContext('2d');g.fillStyle='#6376aa';g.fillRect(0,0,160,160);return {paths,swatch:cv.toDataURL('image/webp').split(',')[1]};},ids);
          await ctx.route('**/ddv/item-images/**',r=>{const path=new URL(r.request().url()).pathname;hits.push(path);return Object.values(cfg.paths).includes(path)?r.fulfill({status:200,contentType:'image/webp',body:Buffer.from(cfg.swatch,'base64')}):r.fulfill({status:404,body:'denied'})});
          async function inject(id,withdraw=false){await p.evaluate(async({id,withdraw})=>{const M=await import('/src/lib/item-media/switch1253-public-item-images.mjs');const review=o=>({...o,mediaPublic:true,rightsReview:'OPERATOR_ACCEPTED',receivingContact:'MANAGED_VERIFIED',takedown:'MANAGED_TESTED',managedHttps:'MANAGED_VERIFIED',attribution:'EIGHT_LOCALES_REVIEWED',oldUrlAndCache:'MANAGED_TESTED',rollback:'MANAGED_TESTED',operatorReceiptSha256:'c'.repeat(64),items:{}});
          const fields=['originalNativeStreamSha256','sourcePngSha256','webpSha256','rightsStatus','publicationDecision','visibility'];
          function bind(m,r){for(const [id,e] of Object.entries(m.items)){e.publicationDecision='OWNER_SCOPED_PUBLICATION_ACCEPTED';r.items[id]=Object.fromEntries(fields.map(k=>[k,e[k]]))}const {mediaPublic,items,...p}=r;m.publication={gate:'MEDIA_PUBLIC_SCOPED_ON',...p};return m}
          const sr=review(M.STEAM1253_REVIEWED_RELEASE),wr=review(M.SWITCH1253_REVIEWED_RELEASE),wm=M.prepareSwitch1253ItemImageManifest();wm.items['40006096']={...wm.items['40000047'],...M.SWITCH1253_NATIVE_PINS['40006096']};bind(wm,wr);
          const urlFor=id=>{const p=M.STEAM1253_NATIVE_PINS[id];return '/ddv/item-images/'+M.STEAM1253_ITEM_IMAGE_VARIANT+'/'+p.webpSha256.slice(0,2)+'/'+p.webpSha256+'.webp'};
          
          const m=bind(M.prepareSteam1253ItemImageManifest([id]),sr);m.switch=wm;if(withdraw)delete m.items[id];const c=M.validateSteam1253ItemImageCatalog(m,sr,wr);M.switch1253PublicItemImageSource.set({status:'VERIFIED',catalog:c,reason:''});},{id,withdraw});}
          async function rendered(id,scope){const selector=scope+' [data-item-thumb-id="'+id+'"]';const t=p.locator(selector).first();await t.waitFor();await inject(id);await t.scrollIntoViewIfNeeded();await t.locator('img').waitFor();assert.equal(await t.locator('img').getAttribute('src'),cfg.paths[id]);await p.waitForFunction(s=>{const el=document.querySelector(s);return el?.complete&&el.naturalWidth===160&&el.naturalHeight===160},selector+' img');}
          for(const id of ids){await p.goto(root+'/collection/',{waitUntil:'domcontentloaded'});await p.locator('[data-stage1-category-grid] .category-card').first().waitFor();await p.locator('[data-stage1-search]').fill(id);await p.locator('[data-stage1-search-groups] [data-item-thumb-id="'+id+'"]').first().waitFor();assert.equal(await p.locator('[data-item-thumb-id="'+id+'"] img').count(),0);await rendered(id,'[data-stage1-search-groups]');await p.locator('[data-stage1-search-groups] .item-card').first().click();await rendered(id,'[data-stage1-item-info]');await p.locator('[data-stage1-item-info] .info-actions > a').click();await p.locator('[data-shared-discovery="READY"]').waitFor();await rendered(id,'[data-shared-entity-detail]');await inject(id,true);await p.waitForFunction(id=>!document.querySelector('[data-item-thumb-id="'+id+'"] img'),id);
          await p.goto(root+'/explore/',{waitUntil:'domcontentloaded'});await p.locator('.grid .card').first().waitFor();await p.locator('.controls input[type="search"]').fill(id);await rendered(id,'.grid');console.log('QA738_REAL_CHROME_ID',id,'4_CONSUMERS_WITHDRAW_PASS');}
          assert.ok(ids.every(id=>hits.includes(cfg.paths[id])));assert.ok(hits.every(x=>Object.values(cfg.paths).includes(x)));assert.deepEqual(errs,[]);assert.deepEqual(bad,[]);console.log('QA738_REAL_CHROME_2_SAMPLES_ALL_PASS');await ctx.close();
          }finally{await browser.close()}
          JS

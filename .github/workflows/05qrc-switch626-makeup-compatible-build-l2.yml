name: 05 QR-C Switch626 Makeup compatible Build exact1 L2 (QA ONLY NEVER MERGE)
on:
  pull_request:
    paths:
      - '.github/workflows/05qrc-switch626-makeup-compatible-build-l2.yml'
      - 'crates/ddv-save-core/src/product_makeup_color1.rs'
permissions:
  contents: read
jobs:
  qrc1545-switch-makeup:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CARGO_TARGET_DIR: /tmp/wand-qrc1545-cargo-target
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Fixed corrected Switch Source and QA-only exact2 paths
        run: |
          set -euo pipefail
          git cat-file -e 34df36f6b095983ec0411727a98ea53c0de1fca7^{commit}
          test "$(git merge-base 34df36f6b095983ec0411727a98ea53c0de1fca7 HEAD)" = 34df36f6b095983ec0411727a98ea53c0de1fca7
          git diff --name-only 34df36f6b095983ec0411727a98ea53c0de1fca7 HEAD | LC_ALL=C sort >/tmp/qrc1545-actual
          printf '%s\n' '.github/workflows/05qrc-switch626-makeup-compatible-build-l2.yml' 'crates/ddv-save-core/src/product_makeup_color1.rs' | LC_ALL=C sort >/tmp/qrc1545-expected
          diff -u /tmp/qrc1545-expected /tmp/qrc1545-actual
          git diff --exit-code 34df36f6b095983ec0411727a98ea53c0de1fca7 HEAD -- crates/ddv-save-core/src/semantic_writer.rs crates/ddv-save-core/Cargo.toml crates/ddv-save-core/src/wasm_worker.rs
          echo QRC1545_FIXED_SOURCE_QA_ONLY_BOUNDARY_PASS
      - name: Independent Switch Build CAS and physically saved Makeup real-shape child Reopen
        run: |
          set -euo pipefail
          cargo generate-lockfile --manifest-path crates/ddv-save-core/Cargo.toml
          sha256sum crates/ddv-save-core/Cargo.lock >/tmp/qrc1545-lock.sha
          cargo test --locked --manifest-path crates/ddv-save-core/Cargo.toml --features product-switch626-makeup-color1-internal --lib qa1545_switch626_makeup_real_shape_compatible_build -- --nocapture
          test -s /tmp/qrc1545-switch-makeup-original.json
          test -s /tmp/qrc1545-switch-makeup-edited.json
          cargo test --locked --manifest-path crates/ddv-save-core/Cargo.toml --features product-switch626-makeup-color1-internal --lib qa1545_switch626_makeup_child_reopen -- --ignored --nocapture
          cargo check --locked --manifest-path crates/ddv-save-core/Cargo.toml --target wasm32-unknown-unknown --no-default-features --features worker-wasm,product-switch626-makeup-color1-internal
          cargo check --locked --manifest-path crates/ddv-save-core/Cargo.toml --target wasm32-unknown-unknown --no-default-features --features worker-wasm,product-switch626-makeup-color1-internal,product-steam626-hair-scoped
          sha256sum -c /tmp/qrc1545-lock.sha

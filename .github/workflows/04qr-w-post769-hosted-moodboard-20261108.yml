name: "04 QR-W postPR769 live TEST Pages Moodboard real Chrome new-risk"
on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/04qr-w-post769-hosted-moodboard-20261108.yml"
      - "scripts/04qr-w-post769-hosted-moodboard-20261108.mjs"
permissions:
  contents: read
jobs:
  hosted-readonly-moodboard-new-risk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --no-audit --no-fund
      - run: npm install --no-save --package-lock=false playwright-core@1.55.0
      - name: Enforce actual installed Chrome / no private Owner Save
        shell: bash
        run: |
          set -euo pipefail
          test -z "${WEP_PRIVATE_P1G_PATH:-}"
          test -z "${WEP_PRIVATE_LOCAL_ONLY_ACK:-}"
          test -z "${DDV_PRIVATE_SAVE_PATH:-}"
          BIN="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || true)"
          test -n "$BIN" || { echo "NOT_RUN: actual installed Chrome missing"; exit 1; }
          "$BIN" --version
          echo "CHROME_BIN=$BIN" >> "$GITHUB_ENV"
      - name: Live deployed Pages GET and Chrome Collection ItemInfo to Moodboard
        run: node scripts/04qr-w-post769-hosted-moodboard-20261108.mjs

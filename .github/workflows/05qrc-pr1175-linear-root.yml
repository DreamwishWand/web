name: 05 QR-C PR1175 independent linear root
on:
  pull_request:
    paths:
      - 'crates/ddv-save-core/tests/qa_pr1175_linear_root.rs'
      - '.github/workflows/05qrc-pr1175-linear-root.yml'
permissions:
  contents: read
jobs:
  independent:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
      - name: Exact Source2 and QA-only2
        run: |
          source=fe170cd4d18337046e3a61e2efae6be22740ad64
          test "$(git merge-base "$source" HEAD)" = "$source"
          test "$(git diff --name-only "$source" HEAD | wc -l)" -eq 2
          test "$(git diff --diff-filter=A --name-only "$source" HEAD | wc -l)" -eq 2
          test "$(git rev-parse HEAD:crates/ddv-save-core/src/spatial_reference_index.rs)" = 282314ca7be04432768baf6853abe3d16fdb2eb6
          test "$(git rev-parse HEAD:crates/ddv-save-core/tests/spatial_reference_index.rs)" = 67d9c3725f542101d3e6618ad1ff414294d4b544
      - name: Locked independent graph tests and old-source parity
        run: |
          git show 08fd6694ec95ad2c6d648722f8e8c204b6115f9d:scripts/wasm-distribution/approved-Cargo.lock > crates/ddv-save-core/Cargo.lock
          echo 'e58486d673df79bfe7e72b80449e39389e57010fe4051edcdcff9b53c2da898c  crates/ddv-save-core/Cargo.lock' | sha256sum -c -
          cargo test --locked --release --manifest-path crates/ddv-save-core/Cargo.toml --no-default-features --features indexed-read --test qa_pr1175_linear_root -- --nocapture
          git worktree add --detach /tmp/qa1175-old 979418fb6810b8ca06b508e6322142df8a3a99fb
          cp crates/ddv-save-core/Cargo.lock /tmp/qa1175-old/crates/ddv-save-core/Cargo.lock
          cp crates/ddv-save-core/tests/qa_pr1175_linear_root.rs /tmp/qa1175-old/crates/ddv-save-core/tests/
          cargo test --locked --release --manifest-path /tmp/qa1175-old/crates/ddv-save-core/Cargo.toml --no-default-features --features indexed-read --test qa_pr1175_linear_root -- --nocapture

name: 04 QR-S Source168 independent genuine ES256 two PG Unfollow OFF
on:
  push:
    branches: [qa/pr646-source168-unfollow-independent-20261106]
  pull_request:
    branches: [comm/w-comm-006-source168-unfollow-creator-off-20261106]
permissions:
  contents: read
jobs:
  qr-source168:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      DDVRE_E2_LOCAL_DISPOSABLE: APPROVED
      DATABASE_URL: ''
      SUPABASE_ACCESS_TOKEN: ''
      SUPABASE_PROJECT_ID: ''
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - name: Exact Source168 SHA and two new independent QA paths only
        shell: bash
        run: |
          set -euo pipefail
          SOURCE=dc0dd30c6a8953e79343d52e51bf470179883ee5
          git merge-base --is-ancestor "$SOURCE" HEAD
          git diff --name-only "$SOURCE" HEAD | sort > /tmp/qr168-actual
          printf '%s\n' .github/workflows/qr-pr646-source168-unfollow-independent.yml tests/qr-pr646-source168-unfollow-independent.py | sort > /tmp/qr168-expected
          diff -u /tmp/qr168-expected /tmp/qr168-actual
          test -z "$(git diff --name-only "$SOURCE" HEAD -- supabase src docs static)"
          test "$(find supabase/migrations -name '*.sql' | wc -l)" -eq 168
          test "$(git hash-object supabase/migrations/20261104050000_community_source163_help_answer_service_execute_off.sql)" = c02bf514abf51951c19e05f8ca7ef7383f071c70
          test "$(git hash-object supabase/migrations/20261105010000_community_source164_reaction_add_service_execute_off.sql)" = 8a272688b3f85e999e43cb772736dba6bc305606
          test "$(git hash-object supabase/migrations/20261105020000_community_source165_save_entity_service_execute_off.sql)" = 7412435be16b73e97da46a8c387a2a116b7f5a6c
          test "$(git hash-object supabase/migrations/20261105030000_community_source166_unsave_entity_service_execute_off.sql)" = 18a8a7b822840075bc7e9602ed2341ac9be325e0
          test "$(git hash-object supabase/migrations/20261105040000_community_source167_remove_reaction_service_execute_off.sql)" = e14010ede368e0203faa7739acfe2837e2c025f8
          test "$(git hash-object supabase/migrations/20261106010000_community_source168_unfollow_creator_service_execute_off.sql)" = 76a9a11e29f27cb171628e2ebc830180a8af3cc6
          test "$(git hash-object supabase/functions/community-command/index.ts)" = 9ca987a78e4513d59bbe898e902bd63cd7c114b8
          python3 -m py_compile tests/qr-pr646-source168-unfollow-independent.py
          test -z "$DATABASE_URL" && test -z "$SUPABASE_ACCESS_TOKEN" && test -z "$SUPABASE_PROJECT_ID"
          echo QR168_FROZEN_SOURCE_SHA_QA_ONLY_TWO_FILES_PASS
      - uses: supabase/setup-cli@v1
        with: {version: 2.109.0}
      - name: Disposable genuine FULL168 GoTrue ES256 sign and reset two PG
        shell: bash
        run: |
          set -euo pipefail
          printf '\n[auth]\nsigning_keys_path = "./signing_keys.json"\n' >>supabase/config.toml
          printf '[]\n' >supabase/signing_keys.json
          supabase gen signing-key --algorithm ES256 --yes >/tmp/qr168-signer.log 2>&1
          printf 'project_id = "ddvre_qr168_unfollow_independent_20261106"\n' | cat - supabase/config.toml >/tmp/qr168-config
          mv /tmp/qr168-config supabase/config.toml
          printf 'COMMUNITY_MEDIA_BUCKET=qr168-local-only\nWEP_PRESET_ARTIFACT_BUCKET=qr168-local-only\n' >supabase/functions/.env
          timeout 1800s supabase start >/tmp/qr168-start.log 2>&1 || { echo QR168_LOCAL_START_NOT_RUN; tail -n 10 /tmp/qr168-start.log | sed -E 's/(token|secret|key)[=:][^ ]+/\1=[REDACTED]/Ig'; exit 1; }
          timeout 900s supabase db reset --no-seed >/tmp/qr168-reset.log 2>&1 || { echo QR168_LOCAL_RESET_NOT_RUN; tail -n 10 /tmp/qr168-reset.log | sed -E 's/(token|secret|key)[=:][^ ]+/\1=[REDACTED]/Ig'; exit 1; }
          echo QR168_GENUINE_ES256_FULL168_LOCAL_RESET_PASS
      - run: python3 -m pip install --quiet 'psycopg[binary]==3.2.10'
      - name: Independent revoked A1 refresh401 and unfollow SQL42501 twoPG denial
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/qr-pr646-source168-unfollow-independent.py | tee /tmp/qr168-run.log
          for marker in \
            QR168_PUBLIC_THREE_ROLE_ACL_OFF_SIGNED_AND_FOLLOW_POSITIVE_RETAINED_PASS \
            QR168_VALID_A2_409_THREE_SQL42501_FOLLOW_OUTBOX_NO_DIFF_PASS \
            QR168_REVOKED_A1_REAL_REFRESH401_SIBLING200_FIVE_SQL_REPLAYS_NO_DIFF_PASS \
            QR168_TWO_PG_UNCOMMITTED_GRANT_INVISIBLE_ROLLBACK_DENIED_PASS \
            QR168_INDEPENDENT_SIGNED_ES256_SOURCE168_UNFOLLOW_ONLY_SCOPED_PASS; do
            grep -q "$marker" /tmp/qr168-run.log
          done
          echo QR168_INDEPENDENT_LOCAL_SIGNED_SOURCE168_ONLY_NOT_CUMULATIVE_MANAGED_PASS
      - name: Dispose local signer and PostgreSQL DB
        if: always()
        shell: bash
        run: |
          supabase stop --no-backup >/dev/null 2>&1 || true
          rm -f supabase/signing_keys.json supabase/functions/.env /tmp/qr168-*
          echo QR168_DISPOSABLE_CLEANUP_ATTEMPTED

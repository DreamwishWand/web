name: "04 QR-S ACT1721 Bamboo public Reader cross-Build Stage repair Security L2 (QA ONLY)"
on:
  pull_request:
    paths:
      - ".github/workflows/04qrs-act1721-pr2137-bamboo-public-crossbuild-repair-l2.yml"
permissions:
  contents: read
jobs:
  changed-only-security:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 85e35d08693faafb1eba047a58de56f212de161f
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Original Source tests and independent cross-build issuer / anchor / proof-OFF refutation
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/steam626-bamboo-readonly-public-delivery.test.mjs
          cat > qrs-act1721-fixed.mjs <<'NODE'
          import assert from 'node:assert/strict';
          import {execFileSync} from 'node:child_process';
          import {readFileSync} from 'node:fs';
          import {
            BAMBOO_METHODS,BAMBOO_FEATURES,bambooReadJsSymbolsOk,bambooReadPinsOk,
            bambooReadAnchorOk,bambooWasmExportsOk,validateBambooReadAnchor,
            loadProtectedBambooReadonlyWorker,bambooReadDeliveryOk
          } from './src/lib/ddv/core/save/product-steam626-bamboo-readonly-release.mjs';
          import {PROTECTED_BAMBOO40700007_READONLY_ANCHOR as anchor}
            from './src/lib/ddv/core/save/product-steam626-bamboo-readonly-anchor.mjs';
          const head='85e35d08693faafb1eba047a58de56f212de161f';
          const main='5f01861d4d0a27733ecf24067f592abc7165e8d7';
          const paths=[
            '.github/workflows/09p-steam626-bamboo-readonly-delivery.yml',
            'scripts/wasm-distribution/build-bamboo40700007-readonly-candidate.mjs',
            'src/lib/ddv/core/save/product-steam626-bamboo-readonly-anchor.mjs',
            'src/lib/ddv/core/save/product-steam626-bamboo-readonly-release.mjs',
            'tests/steam626-bamboo-readonly-public-delivery.test.mjs'
          ];
          const expected=[
            '9fc484f2bf4b5e0a3bec073397c23d56aa932d75',
            '7fc74f392e0febd66fa562ff07e93d28071efee9',
            '6fc525e975de9db68544d1feaff5ec9cd0011348',
            'ab33ddcb2c69a2576b146704b5a11af9c1911bda',
            '6404168e2206fe12086199fadd8fc66caa056fab'
          ];
          const git=(...args)=>execFileSync('git',args,{encoding:'utf8',
            env:{...process.env,GIT_NO_REPLACE_OBJECTS:'1'}}).trim();
          const blob=(ref,path)=>{
            const m=/^(100644|100755|120000) blob ([0-9a-f]{40})\t(.+)$/
              .exec(git('ls-tree',ref,'--',path));
            assert.ok(m&&m[3]===path,'real Git Blob '+path);
            return {mode:m[1],sha:m[2]};
          };
          let positive=0,negative=0;
          assert.equal(git('rev-parse','HEAD'),head);
          assert.deepEqual(git('rev-list','--parents','-n','1',head).split(/\s+/),[head,main]);
          assert.deepEqual(git('diff','--name-only','--no-renames',main,head).split('\n').sort(),paths.slice().sort());
          paths.forEach((p,i)=>assert.deepEqual(blob(head,p),{mode:'100644',sha:expected[i]}));
          for(const p of [
            '.github/workflows/pages.yml','.github/workflows/ci.yml',
            'scripts/readonly-release/seal.mjs',
            'scripts/wasm-distribution/approved-Cargo.lock',
            'scripts/wasm-distribution/protected-release-inputs.json',
            'src/lib/ddv/core/save/product-rust-wasm-release-trust.mjs',
            'crates/ddv-save-core/Cargo.toml',
            'crates/ddv-save-core/src/wasm_steam_bamboo_readonly.rs',
            'crates/ddv-save-core/src/worker_steam_bamboo_readonly.rs'
          ])assert.deepEqual(blob(main,p),blob(head,p),'protected signer/Engine/Lock invariant '+p);
          positive++;

          const jsSource=readFileSync(paths[3],'utf8');
          const buildSource=readFileSync(paths[1],'utf8');
          const workflow=readFileSync(paths[0],'utf8');
          const anchorSource=readFileSync(paths[2],'utf8');
          assert.match(jsSource,/\(\?:steam\|switch\)\[0-9\]\{3,4\}/);
          assert.match(jsSource,/bambooWasmExportsOk\(new WebAssembly\.Module\(wasm\)\)/);
          assert.match(jsSource,/compileVerifiedWorker\(js,wasm,/);
          assert.match(jsSource,/exactPrototype:true,exactWasmExports:BAMBOO_WASM_EXPORTS/);
          assert.match(jsSource,/bambooReadManifestOk\(manifest,pins,t\)/);
          assert.match(jsSource,/checkedFetch\(url\('manifest\.json'\)/);
          assert.match(jsSource,/where\.protocol!=='https:'/);
          assert.match(buildSource,/!bambooReadJsSymbolsOk\(new TextDecoder\('utf8',\{fatal:true\}\)\.decode\(js\)\)/);
          assert.match(buildSource,/bambooWasmExportsOk\(new WebAssembly\.Module\(wasm\)\)/);
          assert.match(buildSource,/writeFile\(join\(out,names\[i\]\),\[raw,js,wasm\]\[i\],\{flag:'wx',mode:0o600\}\)/);
          assert.match(buildSource,/realpath\(parent\)!==parent/);
          assert.match(anchorSource,/PROTECTED_BAMBOO40700007_READONLY_ANCHOR=null/);
          assert.match(workflow,/GITHUB_EVENT_NAME/);
          assert.doesNotMatch(workflow,/deploy-pages@|upload-pages-artifact@|actions\/attest-build-provenance@/);
          assert.doesNotMatch(workflow,/id-token: write|pages: write/);
          assert.doesNotMatch(jsSource,/productConsumerEnabled:true|writerAuthorized:true|stageAuthorized:true/);
          positive++;

          const reader="export function read_steam626_bamboo_single_target(){return 0;}\n";
          assert.equal(bambooReadJsSymbolsOk(reader),true);
          assert.deepEqual(BAMBOO_FEATURES,['product-steam626-bamboo-readonly','worker-wasm']);
          assert.ok(BAMBOO_METHODS.includes('read_steam626_bamboo_single_target'));
          assert.equal(BAMBOO_METHODS.some(x=>/stage|export|write|undo/.test(x)),false);
          positive++;
          const deny=(name)=>{
            const actual=bambooReadJsSymbolsOk(reader+"export function "+name+"() {}\n");
            if(actual!==false)throw Error("TRUE_RED_BAMBOO_PUBLIC_READER_FOREIGN_MUTATION_ACCEPTED:"+name);
            negative++;
          };
          for(const name of [
            'dev_stage','stage_steam626_chest','export_steam626_chest',
            'stage_switch624_frp01','export_switch624_frp01','write_switch624_frp01',
            'apply_switch624_frp01','undo_switch624_frp01','redo_switch624_frp01',
            'stage_switch626_hair','export_switch626_hair','stage_steam625_foreign',
            'export_steam625_foreign','switch624_stage','switch624_export',
            'write_steam626_inventory','preview_steam626_chest','semantic_writer'
          ])deny(name);
          positive++;

          assert.equal(anchor,null);
          assert.equal(bambooReadAnchorOk(null),false);
          await assert.rejects(validateBambooReadAnchor(null),/BAMBOO40700007_READONLY_DELIVERY_DENIED/);
          await assert.rejects(loadProtectedBambooReadonlyWorker(),/BAMBOO40700007_READONLY_DELIVERY_DENIED/);
          const fabricated={contract:'wand.bamboo40700007.pinned-digests@1',
            sourceHead:head,manifestSha256:'0'.repeat(64),manifestSizeBytes:100,
            jsSha256:'0'.repeat(64),jsSizeBytes:500,
            wasmSha256:'0'.repeat(64),wasmSizeBytes:600};
          assert.equal(bambooReadPinsOk(fabricated),true,'syntactically valid untrusted pins alone cannot turn on anchor');
          assert.equal(bambooReadAnchorOk(fabricated),false);
          positive++;
          console.log('QRS_ACT1721_FIXED_BAMBOO_PUBLIC_READONLY_CROSSBUILD_L2_PASS',JSON.stringify({
            positive,negative,sourceHead:head,protectedMain:main,
            exactOneCommitFiveBlobs:true,
            historicalSwitch624StageRefuted:true,
            originalRustWasmSourceCisInherited:true,
            realProtectedPublicSigned3:false,
            publicBambooReader:false,writer:false,operationOn:false,
            actualEncryptedOwnerSave:false
          }));
          NODE
          node qrs-act1721-fixed.mjs

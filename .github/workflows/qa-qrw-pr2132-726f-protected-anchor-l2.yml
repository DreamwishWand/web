name: QA ONLY 04 QR-W PR2132 726F protected ON provenance L2 NEVER MERGE
on:
  pull_request:
    paths:
      - '.github/workflows/qa-qrw-pr2132-726f-protected-anchor-l2.yml'
permissions:
  contents: read
jobs:
  image-previous-on-origin:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 726f0d719b597456a27849b37366ff530b7f01b5
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pin exact THREE product Source additions and protected trust default OFF
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 726f0d719b597456a27849b37366ff530b7f01b5
          test "$(git merge-base HEAD 3b87b852ec827179587c9853d4560ae755d750f1)" = 3b87b852ec827179587c9853d4560ae755d750f1
          cat > /tmp/qrw2132-pins <<'PINS'
          f98220c006a0f1ed0c182d3a79321f54b3c9e836 scripts/07dbk-steam-image-live-receipt.mjs
          2e99fa94728d430b8d468fe07caba629b50f339c scripts/07dbk-steam-image-trusted-on-anchors.json
          140d21f301d4b28b0de9dcbb6cb9f75c78dc5be8 tests/07dbk-steam-image-live-receipt.test.mjs
          PINS
          while read -r blob path; do
            test "$(git rev-parse "HEAD:$path")" = "$blob"
            test "$(git ls-tree HEAD "$path" | awk '{print $1}')" = 100644
            test "$(git diff --name-status 3b87b852ec827179587c9853d4560ae755d750f1 HEAD -- "$path" | cut -f1)" = A
          done < /tmp/qrw2132-pins
          awk '{print $2}' /tmp/qrw2132-pins | LC_ALL=C sort > /tmp/qrw2132-expected
          git diff --name-only 3b87b852ec827179587c9853d4560ae755d750f1 HEAD | LC_ALL=C sort > /tmp/qrw2132-actual
          diff -u /tmp/qrw2132-expected /tmp/qrw2132-actual
          git diff --quiet 3b87b852ec827179587c9853d4560ae755d750f1 HEAD -- src/lib/item-media/ ops/ddv-item-image-operator-gate.mjs .github/workflows/pages.yml src/lib/ddv/ supabase/
          echo QRW2132_FIXED_3_BLOBS_PRODUCT_DEFAULT_EMPTY_NO_MEDIA_DEPLOY_PASS
      - name: Inherit fixed Source canonical ON withdrawal HTTP fixture
        run: node --test tests/07dbk-steam-image-live-receipt.test.mjs
      - name: Independent external ON trust provenance and duplicate registry refutation
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {createHash} from 'node:crypto';
          import {mkdtempSync,readFileSync,writeFileSync,rmSync} from 'node:fs';
          import {join} from 'node:path';
          import {tmpdir} from 'node:os';
          import {pathToFileURL} from 'node:url';
          import {
            liveTargets,receiptDigest,verifySteamLiveImagePhase
          } from './scripts/07dbk-steam-image-live-receipt.mjs';
          const sha=b=>createHash('sha256').update(b).digest('hex');
          const bytes=Buffer.concat([Buffer.from('RIFF','ascii'),Buffer.alloc(4),Buffer.from('WEBPVP8L','ascii'),Buffer.alloc(14,0x53)]);
          const id='40300045',variant='steam-1.25.3-schema626-lossless160-v1',
           base='https://dreamwishwand.github.io/web/',manifestPath='ddv/item-images/'+variant+'/manifest.json';
          const pins={[id]:{webpSha256:sha(bytes),rgba160Sha256:'a'.repeat(64),
            bytes:bytes.length,width:160,height:160,codec:'WEBP_LOSSLESS_RGBA_EXACT',
            visibility:'RELEASED_PLAYER_FACING'}};
          const opts={baseUrl:base,ids:[id],pins,variant,manifestPath,clock:()=>'2026-11-18T12:00:00.000Z'};
          const urls=liveTargets(opts);
          const onHttp=async(url,{method}={})=>{
           if(url===urls.manifestUrl)return new Response(JSON.stringify({
            schema:'wand.item-images.steam-primary-release@1',assetVariant:variant,
            publication:{gate:'MEDIA_PUBLIC_SCOPED_ON'},items:{[id]:{webpSha256:sha(bytes)}}
           }),{status:200,headers:{'content-type':'application/json'}});
           if(method==='HEAD')return new Response(null,{status:200,
            headers:{'content-type':'image/webp','content-length':String(bytes.length)}});
           return new Response(bytes,{status:200,headers:{'content-type':'image/webp'}});
          };
          const simulatedOn=await verifySteamLiveImagePhase({...opts,phase:'ON',fetchImpl:onHttp});
          assert.deepEqual(simulatedOn.receipt.checks.map(c=>c.method),['GET','GET','HEAD']);
          const trusted={
            scope:'STEAM_ITEM_IMAGES_LIVE_HTTP',receiptSha256:simulatedOn.sha256,
            targetSetSha256:receiptDigest(urls.targets),base:urls.base,manifestUrl:urls.manifestUrl,
            releaseState:'SIGNED_PAGES_ON_OBSERVED',recordedBy:'09_INT_PROTECTED_MAIN',
            protectedReleaseCommit:'a'.repeat(40),protectedPagesRunId:1,liveObserverRunId:2,
            signedArtifactAttestationSha256:'b'.repeat(64)
          };
          const product=JSON.parse(readFileSync('scripts/07dbk-steam-image-trusted-on-anchors.json','utf8'));
          assert.deepEqual(product,{schema:'wand.dbk.protected-on-origin@1',records:[]},
            'real protected product registry MUST remain empty before real hosted signed publication');
          const newHttp=()=>{
           const calls=[];
           const fetchImpl=async(url,{method,redirect}={})=>{
            calls.push({url,method,redirect});
            if(url===urls.manifestUrl)return new Response(JSON.stringify({
             schema:'wand.item-images.steam-primary-release@1',assetVariant:variant,
             items:{}
            }),{status:200,headers:{'content-type':'application/json'}});
            return new Response(method==='HEAD'?null:'not found',{status:404});
           };
           return {calls,fetchImpl};
          };
          const args=fetchImpl=>({...opts,phase:'WITHDRAW',
            priorOnReceipt:simulatedOn.receipt,expectedOnReceiptSha256:simulatedOn.sha256,fetchImpl});
          let positives=0,negatives=0;
          {
           const f=newHttp();
           await assert.rejects(verifySteamLiveImagePhase(args(f.fetchImpl)),/SIGNED_ON_ORIGIN_PROVENANCE_REQUIRED/);
           assert.equal(f.calls.length,0,'self-hashed fake ON without independent trusted registry must fail before HTTP');
           negatives++;
          }
          let serial=0;
          async function isolated(records,fn,schema='wand.dbk.protected-on-origin@1'){
           const dir=mkdtempSync(join(tmpdir(),'qrw-anchor-'));
           try{
            writeFileSync(join(dir,'verifier.mjs'),readFileSync('scripts/07dbk-steam-image-live-receipt.mjs'));
            writeFileSync(join(dir,'07dbk-steam-image-trusted-on-anchors.json'),JSON.stringify({schema,records}));
            const url=pathToFileURL(join(dir,'verifier.mjs')).href+'?qa='+serial++;
            const mod=await import(url);
            return await fn(mod.verifySteamLiveImagePhase);
           }finally{rmSync(dir,{recursive:true,force:true})}
          }
          {
           const f=newHttp();
           const r=await isolated([trusted],verify=>verify(args(f.fetchImpl)));
           assert.equal(r.receipt.result,'SCOPED_PASS');
           assert.deepEqual(r.receipt.checks.map(x=>x.status),[200,404,404,404,404]);
           assert.equal(r.receipt.fullGlobalCdnPurge,'NOT_PROVED');
           assert.equal(f.calls.length,5);
           positives++;
          }
          for(const invalid of [
            [{...trusted,recordedBy:'CALLER_SELF_ASSERTED'}],
            [{...trusted,targetSetSha256:'c'.repeat(64)}],
            [{...trusted,receiptSha256:'d'.repeat(64)}],
            [{...trusted,protectedPagesRunId:0}],
            [{...trusted,liveObserverRunId:0}],
            [{...trusted,signedArtifactAttestationSha256:'not-hex'}],
            [{...trusted,manifestUrl:'https://foreign.example/manifest.json'}]
          ]){
           const f=newHttp();
           await isolated(invalid,verify=>assert.rejects(verify(args(f.fetchImpl)),
            /SIGNED_ON_ORIGIN_PROVENANCE_REQUIRED|PROTECTED_ON_ANCHOR_REGISTRY_INVALID/));
           assert.equal(f.calls.length,0,'foreign or incomplete trusted anchor must fail before network');
           negatives++;
          }
          {
           const f=newHttp();
           await assert.rejects(isolated([trusted],()=>Promise.resolve(), 'wrong.schema'),
            /PROTECTED_ON_ANCHOR_REGISTRY_INVALID/);
           assert.equal(f.calls.length,0);
           negatives++;
          }
          {
           const f=newHttp();
           await assert.rejects(isolated(Array.from({length:26},()=>trusted),()=>Promise.resolve()),
            /PROTECTED_ON_ANCHOR_REGISTRY_INVALID/);
           assert.equal(f.calls.length,0);
           negatives++;
          }
          // Key invariant: a trusted receipt digest must have exactly one coherent
          // independently pinned origin record. A duplicate/conflicting same-receipt
          // record cannot make protected-publication history unambiguous.
          for(const second of [trusted,{...trusted,recordedBy:'CALLER_SELF_ASSERTED'}]){
           const f=newHttp();
           await isolated([trusted,second],verify=>assert.rejects(verify(args(f.fetchImpl)),
            /PROTECTED_ON_ANCHOR_REGISTRY_INVALID|SIGNED_ON_ORIGIN_PROVENANCE_REQUIRED|DUPLICATE/));
           assert.equal(f.calls.length,0,'ambiguous duplicate ON anchors must be rejected BEFORE withdrawal HTTP');
           negatives++;
          }
          console.log('QRW_PR2132_726F_PROTECTED_ON_ANCHOR_CHANGED_L2',JSON.stringify({
           positives,negatives,syntheticOnOnly:true,realHostedOnNotRun:true,mediaPublic:false,
           globalCdnPurgeProven:false}));
          
          NODE

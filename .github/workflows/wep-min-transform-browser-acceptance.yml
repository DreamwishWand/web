name: WEP minimum transform browser acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/wep-min-transform-browser-acceptance.yml'
      - 'src/lib/wep/min-verified-transform-export-v1.ts'
      - 'tests/wep-min-verified-transform-export-v1.test.mjs'
      - 'scripts/wep-primary-job-browser-acceptance.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install app dependencies
        run: npm ci --no-audit --no-fund

      - name: Install browser driver library only
        run: npm install --no-save --package-lock=false playwright-core@1.55.0

      - name: Install CJK fonts for visual acceptance
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-cache -f

      - name: Resolve system Chrome
        id: chrome
        shell: bash
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          echo "path=$CHROME_BIN" >> "$GITHUB_OUTPUT"
          "$CHROME_BIN" --version

      - name: Start local World Editor
        shell: bash
        run: |
          set -euo pipefail
          npm run dev -- --host 127.0.0.1 --port 4173 > /tmp/wep-vite.log 2>&1 &
          echo $! > /tmp/wep-vite.pid
          for i in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:4173/editor/world/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/wep-vite.log
          exit 1

      - name: Run primary-job browser acceptance
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.path }}
          WEP_BASE_URL: http://127.0.0.1:4173/editor/world/
          WEP_VERIFIED_TRANSFORM_ONLY: '1'
        run: node scripts/wep-primary-job-browser-acceptance.mjs

      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wep-min-transform-browser-acceptance
          path: .artifacts/wep-browser/
          if-no-files-found: error

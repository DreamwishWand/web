name: 05 QR-C PR933 independent orientation identity repair
on:
  pull_request:
    paths:
      - '.github/workflows/05qr-c-pr933-orientation-identity-repair.yml'
      - 'crates/ddv-save-core/qa/qa05qrc_pr933_repair.rs'
permissions:
  contents: read
jobs:
  qac933repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CARGO_TARGET_DIR: /tmp/qac933-repair-target
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
          targets: wasm32-unknown-unknown
      - name: Exact Source original1 and QA-only2 immutable
        shell: bash
        run: |
          set -euo pipefail
          s=9309a0bcb340900b2fe623abee263984a1468c74
          o=27ae34a2f45542fe7b97c80d706e537ca45654cc
          q=ed4d87530b570abdd184a779b68b3ceeb2dee304
          base=61f0a1c00b87ae35dede4d3dbc2430a77e8196e1
          p=crates/ddv-save-core/src/native_reference_slice.rs
          test "$(git merge-base "$s" HEAD)" = "$s"
          test "$(git diff --name-only "$base" "$s")" = "$p"
          test "$(git rev-parse "$base:$p")" = 6d31c593c282932b8ca266e392a5be6f47aac5e2
          test "$(git rev-parse "$o:$p")" = ae1f2e9f0a92f0644bdc0c71e4f15f9d1fa17630
          test "$(git rev-parse "$q:$p")" = ae1f2e9f0a92f0644bdc0c71e4f15f9d1fa17630
          test "$(git rev-parse "$q:crates/ddv-save-core/qa/qa05qrc_pr933_stored_transform.rs")" = 9aebb4d0283dfc318536e05dc2685e268f5ee745
          test "$(git rev-parse "$s:$p")" = 2d67fc495da056ab498f53fbb07caa6b43cb0d12
          test "$(git rev-parse "HEAD:$p")" = 2d67fc495da056ab498f53fbb07caa6b43cb0d12
          test "$(git diff --name-only "$s" HEAD | sort)" = "$(printf '%s\n' .github/workflows/05qr-c-pr933-orientation-identity-repair.yml crates/ddv-save-core/qa/qa05qrc_pr933_repair.rs | sort)"
          test -z "$(git ls-files | grep -Ei '\.p1g$|OWNER_PRIVATE|PRIVATE_DECODED' || true)"
          echo QAC933_REPAIR_SOURCE1_QA2_OLD_PROVENANCE_PASS
      - name: Reproduce only old two failures on frozen old Source then execute repaired String tests
        shell: bash
        run: |
          set -euo pipefail
          d="$(mktemp -d)"
          cp -a crates/ddv-save-core "$d/core"
          m="$d/core/Cargo.toml"
          p="$d/core/src/native_reference_slice.rs"
          git show 27ae34a2f45542fe7b97c80d706e537ca45654cc:crates/ddv-save-core/src/native_reference_slice.rs > "$p"
          git show ed4d87530b570abdd184a779b68b3ceeb2dee304:crates/ddv-save-core/qa/qa05qrc_pr933_stored_transform.rs > "$d/core/qa/old.rs"
          printf '\n#[cfg(test)] mod qa933_old_repro { include!(concat!(env!("CARGO_MANIFEST_DIR"), "/qa/old.rs")); }\n' >> "$p"
          cargo generate-lockfile --manifest-path "$m"
          test "$(sha256sum "$d/core/Cargo.lock" | cut -d' ' -f1)" = e58486d673df79bfe7e72b80449e39389e57010fe4051edcdcff9b53c2da898c
          set +e
          cargo test --locked --manifest-path "$m" --no-default-features --features private-native-v1 --lib qac933_selected_ -- --nocapture > /tmp/qac933-old.log 2>&1
          code=$?
          set -e
          cat /tmp/qac933-old.log
          test "$code" = 101
          grep -F 'selected ObjectID29 alias via key30 incorrectly certified' /tmp/qac933-old.log
          grep -F 'selected GridID17 alias via key18 incorrectly certified' /tmp/qac933-old.log
          grep -F '0 passed; 2 failed;' /tmp/qac933-old.log
          echo QAC933_OLD_EXACT_TWO_ALIAS_FAILURES_REPRODUCED
          cp crates/ddv-save-core/src/native_reference_slice.rs "$p"
          rm "$d/core/qa/old.rs"
          printf '\n#[cfg(test)] mod qa933_repair { include!(concat!(env!("CARGO_MANIFEST_DIR"), "/qa/qa05qrc_pr933_repair.rs")); }\n' >> "$p"
          cargo test --locked --manifest-path "$m" --no-default-features --features private-native-v1 --lib qac933repair_ -- --nocapture
          cargo test --locked --manifest-path "$m" --no-default-features --features private-native-v1,semantic-writer-dev --lib qac933repair_ -- --nocapture
          test -z "$(git diff --name-only)"
          test "$(git hash-object crates/ddv-save-core/src/native_reference_slice.rs)" = 2d67fc495da056ab498f53fbb07caa6b43cb0d12
          echo QAC933_REPAIR_NATIVE_STRING_IDENTITY_CAS_PASS
      - name: Public ABI and private-native guard
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          m=crates/ddv-save-core/Cargo.toml
          cargo check --manifest-path "$m" --no-default-features --features worker-wasm,indexed-read --target wasm32-unknown-unknown
          if cargo check --manifest-path "$m" --no-default-features --features private-native-v1,worker-wasm --target wasm32-unknown-unknown >/tmp/qac933-repair-guard.log 2>&1; then
            echo 'private native leaked into wasm'; exit 1
          fi
          grep -F 'private-native-v1 is native-only and cannot enter WASM' /tmp/qac933-repair-guard.log
          echo QAC933_REPAIR_PUBLIC_ABI_PRIVATE_GUARD_PASS

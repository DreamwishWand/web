name: QR WEP R6 exact-save portable build

on:
  push:
    branches:
      - 'qr/wep-r6-exact-acceptance-r2-20261003'

permissions:
  contents: read

jobs:
  portable-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Syntax-check exact private acceptance harness
        run: node --check scripts/qr-wep-r6-exact-private-acceptance.mjs
      - name: Build static World Editor
        env:
          BASE_PATH: /web
        run: npm run build
      - name: Upload static build
        uses: actions/upload-artifact@v4
        with:
          name: qr-wep-r6-exact-static-build
          path: build/
          if-no-files-found: error
          retention-days: 7

name: QA ONLY 04 QR-W ACT1736 PR2132 live game image ON WITHDRAW past-proof integrity L2 NEVER MERGE
on:
  pull_request:
    paths:
      - '.github/workflows/qa-qrw-act1736-pr2132-live-image-withdraw-l2.yml'
permissions:
  contents: read
jobs:
  image-on-withdraw-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 8d127652034200193492be33fd25e3e97a884281
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pin exact two original Source additions, no public Media/Provider/Pages mutation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 8d127652034200193492be33fd25e3e97a884281
          test "$(git merge-base HEAD 3b87b852ec827179587c9853d4560ae755d750f1)" = 3b87b852ec827179587c9853d4560ae755d750f1
          cat >/tmp/qrw2132-blobs <<'PINS'
          780eec282d80cd9925a24ba3cf96aabfef0c9833 scripts/07dbk-steam-image-live-receipt.mjs
          8fa99a7df97768bdc42d94f23a53d16b66475683 tests/07dbk-steam-image-live-receipt.test.mjs
          PINS
          while read -r blob path; do
            test "$(git rev-parse "HEAD:$path")" = "$blob"
            test "$(git ls-tree HEAD "$path" | awk '{print $1}')" = 100644
            test "$(git diff --name-status 3b87b852ec827179587c9853d4560ae755d750f1 HEAD -- "$path" | cut -f1)" = A
          done </tmp/qrw2132-blobs
          awk '{print $2}' /tmp/qrw2132-blobs | LC_ALL=C sort >/tmp/qrw2132-expected
          git diff --name-only 3b87b852ec827179587c9853d4560ae755d750f1 HEAD | LC_ALL=C sort >/tmp/qrw2132-actual
          diff -u /tmp/qrw2132-expected /tmp/qrw2132-actual
          git diff --quiet 3b87b852ec827179587c9853d4560ae755d750f1 HEAD -- \
            ops/ddv-item-image-operator-gate.mjs src/lib/item-media/ \
            src/routes/ .github/workflows/pages.yml scripts/wasm-distribution/
          echo QRW2132_ORIGINAL_EXACT2_SOURCE_NO_IMAGE_BYTES_OR_MEDIA_FLAG_PASS
      - name: Inherit focused live image SHA HTTP and prior receipt 7 source tests
        run: node --test tests/07dbk-steam-image-live-receipt.test.mjs
      - name: Independent forged prior ON proof, foreign URL/method and wrong mutable manifest denial
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {createHash} from 'node:crypto';
          import {liveTargets,receiptDigest,verifySteamLiveImagePhase}
            from './scripts/07dbk-steam-image-live-receipt.mjs';
          const d=b=>createHash('sha256').update(b).digest('hex');
          const bytes=Buffer.concat([Buffer.from('RIFF','ascii'),Buffer.alloc(4),
            Buffer.from('WEBPVP8L','ascii'),Buffer.alloc(14,0x42)]);
          const id='40300045',variant='steam-1.25.3-schema626-lossless160-v1',
            base='https://dreamwishwand.github.io/web/',
            manifestPath='ddv/item-images/'+variant+'/manifest.json',
            pins={[id]:{webpSha256:d(bytes),rgba160Sha256:'a'.repeat(64),
              bytes:bytes.length,width:160,height:160,
              codec:'WEBP_LOSSLESS_RGBA_EXACT',visibility:'RELEASED_PLAYER_FACING'}};
          const opts={baseUrl:base,ids:[id],pins,variant,manifestPath,
            clock:()=> '2026-11-18T00:00:00.000Z'};
          const urls=liveTargets(opts);
          const calls=[];
          const ON=async (url,{method,redirect}={})=>{
            calls.push({url,method,redirect});
            if(url===urls.manifestUrl)return new Response(JSON.stringify({
              schema:'wand.item-images.steam-primary-release@1',assetVariant:variant,
              publication:{gate:'MEDIA_PUBLIC_SCOPED_ON'},
              items:{[id]:{webpSha256:d(bytes)}}}),{status:200,headers:{'content-type':'application/json'}});
            if(method==='HEAD')return new Response(null,{status:200,
              headers:{'content-type':'image/webp','content-length':String(bytes.length)}});
            return new Response(bytes,{status:200,headers:{'content-type':'image/webp'}});
          };
          const published=await verifySteamLiveImagePhase({...opts,phase:'ON',fetchImpl:ON});
          assert.deepEqual(published.receipt.checks.map(x=>x.method),['GET','GET','HEAD']);
          assert.equal(published.receipt.fullGlobalCdnPurge,'NOT_PROVED');
          let positives=1,negatives=0,withdrawCalls=[];
          const withdrawMock=(manifest)=>{
            withdrawCalls=[];
            return async (url,{method,redirect}={})=>{
              withdrawCalls.push({url,method,redirect});
              if(url===urls.manifestUrl)return new Response(JSON.stringify(manifest),{
                status:200,headers:{'content-type':'application/json'}});
              return new Response(method==='HEAD'?null:'not found',{status:404,
                headers:{'content-type':'text/plain'}});
            };
          };
          const validManifest={schema:'wand.item-images.steam-primary-release@1',
            assetVariant:variant,publication:{gate:'MEDIA_PUBLIC_SCOPED_ON'},items:{}};
          const withdrawArgs=(prior,fetchImpl)=>({...opts,phase:'WITHDRAW',fetchImpl,
            priorOnReceipt:prior,expectedOnReceiptSha256:receiptDigest(prior)});
          const withdrawn=await verifySteamLiveImagePhase(withdrawArgs(published.receipt,withdrawMock(validManifest)));
          assert.equal(withdrawn.receipt.checks.length,5);
          assert.equal(withdrawn.receipt.fullGlobalCdnPurge,'NOT_PROVED');
          positives++;
          // An ON receipt can be pinned by its hash but checks must ALSO prove the
          // canonical URLs and actual GET/HEAD methods; status 200 alone is insufficient.
          for(const forged of [
            {...published.receipt,checks:published.receipt.checks.map((c,i)=>
              i===1?{...c,url:'https://foreign.example/forged.webp'}:c)},
            {...published.receipt,checks:published.receipt.checks.map((c,i)=>
              i===2?{...c,method:'GET'}:c)},
            {...published.receipt,checks:published.receipt.checks.map((c,i)=>
              i===0?{...c,url:urls.targets[0].url}:c)}
          ]){
            withdrawCalls=[];
            const result=verifySteamLiveImagePhase(withdrawArgs(forged,withdrawMock(validManifest)));
            await assert.rejects(result,/PRIOR_PUBLIC_URL_SET_MISMATCH|PRIOR_ON_EVIDENCE_NOT_COMPLETE|PINNED_PRIOR_REAL_ON_RECEIPT_REQUIRED/,
              'prior ON proof with unrelated URL or wrong method is NOT an independently proven successful ON');
            assert.equal(withdrawCalls.length,0,'reject forged prior evidence BEFORE live HTTP');
            negatives++;
          }
          // Mutable 200 manifest must be authenticated by exact schema and variant.
          // An arbitrary {} response may NOT count as removal of a real item.
          for(const wrongManifest of [
            {},{items:{}},{schema:'foreign-manifest',assetVariant:variant,items:{}},
            {schema:'wand.item-images.steam-primary-release@1',assetVariant:'wrong-variant',items:{}}
          ]){
            await assert.rejects(verifySteamLiveImagePhase(withdrawArgs(
              published.receipt,withdrawMock(wrongManifest))),
              /WITHDRAW_MANIFEST_/, 'untrusted 200 manifest cannot prove canonical item removal');
            negatives++;
          }
          console.log('QRW2132_PRIOR_REAL_ON_CANONICAL_URLS_METHODS_AND_MUTABLE_MANIFEST_PASS',
            JSON.stringify({positives,negatives,syntheticHttpOnly:true,realHostedNotRun:true,
              pubOff:true,globalCdnPurgeNotProved:true}));
          NODE

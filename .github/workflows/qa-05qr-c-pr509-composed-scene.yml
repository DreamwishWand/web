name: 05 QR-C PR509 current-main W1 Scene Area / Spatial / Worker composition
on:
  push:
    branches: [qa/05qr-c-pr509-current-main-w1-scene-compose-20261105]
  pull_request:
    paths:
      - '.github/workflows/qa-05qr-c-pr509-composed-scene.yml'
      - 'tests/qa-05qr-c-pr509-composed-w1-scene-area-newonly.test.mjs'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  fixed-main-source-composition:
    runs-on: ubuntu-24.04
    timeout-minutes: 19
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Freeze latest protected main, 3 accepted PR480 Source blobs, and prior main W1 Spatial and Worker
        run: |
          set -eu
          MAIN=24a6c9515ae2a80c8ea39cc4d0ec7c17f455e8ba
          SOURCE=f1d986fba2819da5352f954088a6d844f97c1512
          test "$(git merge-base "$MAIN" "$SOURCE")" = "$MAIN"
          test "$(git merge-base "$SOURCE" HEAD)" = "$SOURCE"
          test "$(git diff --name-only "$MAIN" "$SOURCE" | wc -l | tr -d ' ')" = 3
          test "$(git diff --name-only "$MAIN" "$SOURCE" | sort)" = "$(printf '%s\n' docs/core/01e-w1-scene-area-reference-readonly-20261104.md src/lib/ddv/timing/w1-scene-area-reference-readonly.mjs tests/01e-w1-scene-area-reference-readonly.test.mjs | sort)"
          git diff --quiet "$SOURCE" HEAD -- src/ crates/ docs/ static/ supabase/ tests/01e-w1-scene-area-reference-readonly.test.mjs
          test "$(git rev-parse HEAD:docs/core/01e-w1-scene-area-reference-readonly-20261104.md)" = 20b819f42508681bd9349054d9f3dc1e3f2b0d01
          test "$(git rev-parse HEAD:src/lib/ddv/timing/w1-scene-area-reference-readonly.mjs)" = f8b6d87d17690a283088feaa38df8064dc0bc4b3
          test "$(git rev-parse HEAD:tests/01e-w1-scene-area-reference-readonly.test.mjs)" = c9845f19b1724e1e2c52c20c8de1bb8eb9b033ee
          for p in src/lib/ddv/timing/w1-wetland-area-grid-candidate-probe.mjs src/lib/ddv/timing/w1-native-v3-source-evidence.mjs src/lib/wep/real-save-spatial-source.ts src/lib/ddv/core/save/local-save-session-bridge.mjs scripts/wep-private-real-save-e2e-safety-20261104.mjs; do
            test "$(git rev-parse "$MAIN:$p")" = "$(git rev-parse "HEAD:$p")"
          done
          echo ACCEPTED_QA497_QA492_QA498_REUSED_NO_RETEST
          echo PR509_EXACT_MAIN_AND_3_ACCEPTED_BLOBS_PASS
          echo ACTUAL_ENCRYPTED_PRIVATE_SAVE=NOT_RUN
          echo NATIVE_WETLAND_AREA_GRID_TREE_CLOCK_V3=UNKNOWN
          echo PRODUCT_WRITER_EDITEDCOPY_APPLY_OVERWRITE=OFF
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm ci --no-audit --no-fund
      - name: Five NEW composition-only 626 Scene Wetland / Grid / Worker negative tests
        run: node --experimental-strip-types --test tests/qa-05qr-c-pr509-composed-w1-scene-area-newonly.test.mjs
      - name: Svelte and TypeScript cumulative main boundary
        run: npm run check

name: 05 QR-C PR500 native encrypted and decoded Arc current HEAD QA
on:
  push:
    branches: [qa/05qr-c-pr500-native-shared-cipher-and-decoded-20261105]
  pull_request:
    paths:
      - '.github/workflows/qa-05qr-c-pr500-shared-arc.yml'
      - 'crates/ddv-save-core/tests/qa_05qr_c_pr500_shared_decoded_arc_newonly.rs'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  source-frozen-native-arc:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Pin PR500 exact latest source, accepted parent and six delta files
        run: |
          set -eu
          PARENT=9fd8c8a87c8a64cf8065c52f56d011d27a1d7a64
          SOURCE=8586fd8b79426e7574f39a998a55a4c3e82e341f
          test "$(git merge-base "$SOURCE" HEAD)" = "$SOURCE"
          test "$(git merge-base "$PARENT" "$SOURCE")" = "$PARENT"
          test "$(git diff --name-only "$PARENT" "$SOURCE" | wc -l | tr -d ' ')" = 6
          test "$(git diff --name-only "$PARENT" "$SOURCE" | sort)" = "$(printf '%s\n' crates/ddv-save-core/examples/w1_private_v2_local.rs crates/ddv-save-core/src/offline_w1_v2.rs crates/ddv-save-core/src/session.rs crates/ddv-save-core/src/trusted_read.rs crates/ddv-save-core/tests/w1_private_operation_v2.rs docs/core/01a-shared-native-decoded-source-arc-20261104.md | sort)"
          git diff --quiet "$SOURCE" HEAD -- src/ static/ supabase/ docs/ crates/ddv-save-core/src/ crates/ddv-save-core/tests/w1_private_operation_v2.rs
          for p in crates/ddv-save-core/examples/w1_private_v2_local.rs crates/ddv-save-core/src/offline_w1_v2.rs crates/ddv-save-core/src/session.rs crates/ddv-save-core/src/trusted_read.rs crates/ddv-save-core/tests/w1_private_operation_v2.rs docs/core/01a-shared-native-decoded-source-arc-20261104.md; do
            test "$(git rev-parse "$SOURCE:$p")" = "$(git rev-parse "HEAD:$p")"
          done
          test "$(git rev-parse HEAD:crates/ddv-save-core/src/offline_w1_v2.rs)" = 8d3622e0e94b8700c8f80d2e853c5b964404797c
          echo PR500_PARENT_QA490_REUSED_NO_ANCESTOR_RETEST
          echo PR500_SOURCE_SIX_FILE_EXACT_PROVENANCE_PASS
          echo PRIVATE_OWNER_P1G=NOT_RUN
          echo PRODUCT_RUST_WASM_SINGLE_SESSION=NOT_ACCEPTED
          echo NATIVE_W1_V3=UNKNOWN
          echo PRODUCT_WRITER_EDITEDCOPY_APPLY_OVERWRITE=OFF
      - name: New-only independent synthetic encrypted fixture tests (no private Save)
        run: cargo test --manifest-path crates/ddv-save-core/Cargo.toml --test qa_05qr_c_pr500_shared_decoded_arc_newonly -- --nocapture
      - name: Rust native ABI/compile check
        run: cargo check --manifest-path crates/ddv-save-core/Cargo.toml
      - name: Product Rust copy gate remains explicitly disabled
        run: |
          grep -Fq PRODUCT_P1G_ENCODE_COPY_NOT_AUTHORIZED crates/ddv-save-core/src/session.rs
          grep -Fq PRODUCT_ENCODE_COPY_NOT_AUTHORIZED crates/ddv-save-core/src/trusted_read.rs

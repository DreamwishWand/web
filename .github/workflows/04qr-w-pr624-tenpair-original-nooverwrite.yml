name: "04 QR-W PR624 ten-pair synthetic original-source no-overwrite"
on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/04qr-w-pr624-tenpair-original-nooverwrite.yml"
      - "scripts/04qr-w-pr624-tenpair-original-nooverwrite.py"
permissions:
  contents: read
jobs:
  independent-tenpair-source-guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install real Pillow and libwebp, no game art in shared CI
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input Pillow==11.3.0
          python -c "from PIL import Image,features; assert features.check('webp'); print('Pillow',Image.__version__,'real libwebp')"
      - name: Independent original-source immutability and ten-pair metrics negative
        shell: bash
        run: |
          set -euo pipefail
          test -z "${WEP_PRIVATE_P1G_PATH:-}"
          test -z "${WEP_PRIVATE_LOCAL_ONLY_ACK:-}"
          test -z "${WEP_PRIVATE_EXTERNAL_BUILD_CONFIRMED:-}"
          python -m py_compile scripts/04qr-w-pr624-tenpair-original-nooverwrite.py
          python scripts/04qr-w-pr624-tenpair-original-nooverwrite.py

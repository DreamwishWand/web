name: 04 QR PR195 Mineral Original-Source Attestation QA (new-only)
on:
  pull_request:
    paths:
      - 'docs/qa/qr-pr195-mineral-original-source-independent-20261027.md'
      - 'static/ddv/qa/qr-pr195-mineral-original-independent-v125.json'
      - 'tests/qr-pr195-mineral-original-source-independent.test.mjs'
      - '.github/workflows/qr-pr195-mineral-original-attestation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bounded-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      DATABASE_URL: ''
      SUPABASE_ACCESS_TOKEN: ''
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pin exact QA commit, Owner original evidence and no provider privileges
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          test -z "$DATABASE_URL" && test -z "$SUPABASE_ACCESS_TOKEN"
          test "$(git hash-object static/ddv/core/collection/v1.25/native-activity-mineral-original-predicate-v125.json)" = 'cff621bc97fa1e63f23de9c92909b1228acc5021'
      - name: Six new independent ORIGINAL-SOURCE attestation checks (no private asset upload)
        run: node --test tests/qr-pr195-mineral-original-source-independent.test.mjs
      - name: Scope statement
        run: echo 'The original NSO, metadata, dump.cs, lossless ItemDB, and Support bytes were independently rehashed and replayed OFFLINE in QA; this public CI checks recorded provenance and safety, not proprietary raw binaries.'

name: 05 QR-C PR943 affected Build binding repair independent
on:
  pull_request:
    paths:
      - '.github/workflows/05qr-c-pr943-build-binding-repair.yml'
      - 'tests/qa05qrc-pr943-build-binding-repair.test.mjs'
permissions:
  contents: read
jobs:
  independent:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact original5 repair2 and prior unaffected blobs
        run: |
          set -euo pipefail
          s=ac66a1f2efbf7b0caf5104b7a9c3b368e92f91ba
          old=1cda27549550929ee83df34a01be86059456e796
          base=a6c7447943529ee7e3532b4c2cd6596c802550d1
          test "$(git merge-base "$s" HEAD)" = "$s"
          while read -r p before after; do
            test "$(git rev-parse "$old:$p")" = "$before"
            test "$(git rev-parse "$s:$p")" = "$after"
            test "$(git rev-parse "HEAD:$p")" = "$after"
          done <<'EOF'
          src/lib/ddv/native/operation-native-static-gate.mjs 088ea3c94a9bfdbf227694636c6df2cbc6754da0 cdb030864a244c347176e444034b33cbecf51b67
          tests/01e-native-operation-static-gate.test.mjs ecee16599ebbe298cf051c511085ec6ddea0226c 57693f9efef90a550dbddd6ff7613343f4d66ed9
          src/lib/ddv/native/operation-native-static-gate.d.mts 3ffdab4d7bf36a4414f4ef656ede8651640ab4b9 3ffdab4d7bf36a4414f4ef656ede8651640ab4b9
          tests/01e-steam626-native-amount-witness.test.mjs d15270cdd81800d257356fe0c4a74ff4a0e4fe89 d15270cdd81800d257356fe0c4a74ff4a0e4fe89
          docs/core/01e-steam626-native-inventory-chest-consumer-producer-20261112.md 22c567e2e3971a0270cf60f1750c3f460b725557 22c567e2e3971a0270cf60f1750c3f460b725557
          EOF
          test "$(git diff --name-only "$base" "$s" | wc -l)" = 5
          test "$(git diff --name-only "$old" "$s" | sort)" = "$(printf '%s\n' src/lib/ddv/native/operation-native-static-gate.mjs tests/01e-native-operation-static-gate.test.mjs | sort)"
          test "$(git diff --name-only "$s" HEAD | sort)" = "$(printf '%s\n' .github/workflows/05qr-c-pr943-build-binding-repair.yml tests/qa05qrc-pr943-build-binding-repair.test.mjs | sort)"
          test -z "$(git ls-files | grep -Ei '\.p1g$|GameAssembly\.dll$|global-metadata\.dat$|dump\.cs$|OWNER_PRIVATE' || true)"
          echo QAC943_REPAIR2_ORIGINAL5_QA_ONLY2_PASS
      - name: Historical repro and affected independent runtime
        run: node --test tests/qa05qrc-pr943-build-binding-repair.test.mjs

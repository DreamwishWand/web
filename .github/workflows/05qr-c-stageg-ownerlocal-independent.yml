name: 05 QR-C Stage G owner-local Steam V1 independent real Chrome new-only
on:
  pull_request:
    paths:
      - 'tests/owner-local-steam-v1-qa-independent.test.mjs'
      - 'tests/stage-g/qa-independent-page.mjs'
      - '.github/workflows/05qr-c-stageg-ownerlocal-independent.yml'
  push:
    branches:
      - 'qa/05qrc-stageg-ownerlocal-pr766-4ec0c403-20261108'
permissions:
  contents: read
jobs:
  independent-owner-local-stage-g:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CARGO_TARGET_DIR: /tmp/wand-05qrc-stageg-target
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Pin immutable original 14 StageG Source Git blobs and exact QA-only 3 added files
        shell: bash
        run: |
          set -euo pipefail
          source=4ec0c403900ab26e543a814aa7c017037b44efaf
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            qa_tip="$(git rev-parse HEAD^2)"
          else
            qa_tip="$(git rev-parse HEAD)"
          fi
          git merge-base --is-ancestor "$source" "$qa_tip"
          test "$(git rev-parse "$qa_tip":.github/workflows/01a-owner-local-steam-v1.yml)" = 69fa4875fab58b562406f33135b22b221c78f711
          test "$(git rev-parse "$qa_tip":.gitignore)" = 05a24a1a58df466828637ed098055f5954fb83a2
          test "$(git rev-parse "$qa_tip":tests/owner-local-steam-v1-attestation.test.mjs)" = 6f28f071c24609f9c31dc77a7d49752bd722fcbc
          test "$(git rev-parse "$qa_tip":tests/stage-g/chrome-smoke.mjs)" = 47f246a7ffc54636e378dc5d087f672a3b82b695
          test "$(git rev-parse "$qa_tip":tests/stage-g/index.html)" = d9ebb2c62e09a964261a5e92dd91c2d3ad0f92c6
          test "$(git rev-parse "$qa_tip":tests/stage-g/page.mjs)" = f297c67bbd3a183a9b123b82196f06e19306c3b5
          test "$(git rev-parse "$qa_tip":tests/stage-g/worker.mjs)" = 5e13dd40e9480b7c935e49e11b4060dcaafaef73
          test "$(git rev-parse "$qa_tip":tools/owner-local-steam-v1/README.md)" = 98dd3f40d71dcba7513e0a371ce145d994a1a337
          test "$(git rev-parse "$qa_tip":tools/owner-local-steam-v1/attestation.mjs)" = 854bdf1ce201ed4431165c4f219f730263dab8b7
          test "$(git rev-parse "$qa_tip":tools/owner-local-steam-v1/index.html)" = fd5d749ada7f9928419b270e28b7d3a9b5133604
          test "$(git rev-parse "$qa_tip":tools/owner-local-steam-v1/page.mjs)" = 2a8f4e573f69d0d75c716aa2814cfc5b3f0b37b9
          test "$(git rev-parse "$qa_tip":tools/owner-local-steam-v1/server.mjs)" = 7a44216f0a12dec91f4dedc47e345e04cba4e538
          test "$(git rev-parse "$qa_tip":tools/owner-local-steam-v1/worker-core.mjs)" = 4bf1098119a8c34dc454163f431aba620579019d
          test "$(git rev-parse "$qa_tip":tools/owner-local-steam-v1/worker.mjs)" = 1aaebb9eb4044649d1334609fa9646120b1853b4
          actual="$(git diff --name-only "$source" "$qa_tip" | sort)"
          expected="$(printf '%s\n' .github/workflows/05qr-c-stageg-ownerlocal-independent.yml tests/owner-local-steam-v1-qa-independent.test.mjs tests/stage-g/qa-independent-page.mjs | sort)"
          test "$actual" = "$expected"
          node --check tests/owner-local-steam-v1-qa-independent.test.mjs
          node --check tests/stage-g/qa-independent-page.mjs
          grep -Fx 'wasm-bindgen = { version = "=0.2.105", optional = true }' crates/ddv-save-core/Cargo.toml
          grep -Fx 'worker-wasm = ["dep:wasm-bindgen"]' crates/ddv-save-core/Cargo.toml
          grep -Fx 'indexed-read = []' crates/ddv-save-core/Cargo.toml
          command -v google-chrome
      - name: Rust accepted wasm32 exact feature-on single Worker, Writer OFF
        shell: bash
        run: |
          set -euo pipefail
          cargo build --manifest-path crates/ddv-save-core/Cargo.toml --release --target wasm32-unknown-unknown --features worker-wasm,indexed-read
          test -s "$CARGO_TARGET_DIR/wasm32-unknown-unknown/release/ddv_save_core.wasm"
      - name: Generate real wasm-bindgen 0.2.105 ESM+WASM without commit
        shell: bash
        run: |
          set -euo pipefail
          cargo install wasm-bindgen-cli --version 0.2.105 --locked --root /tmp/wand-05qrc-stageg-bindgen
          /tmp/wand-05qrc-stageg-bindgen/bin/wasm-bindgen --version | grep -F '0.2.105'
          mkdir -p tests/stage-e/pkg
          /tmp/wand-05qrc-stageg-bindgen/bin/wasm-bindgen "$CARGO_TARGET_DIR/wasm32-unknown-unknown/release/ddv_save_core.wasm" --out-dir tests/stage-e/pkg --target web --no-typescript
          test -s tests/stage-e/pkg/ddv_save_core.js
          test -s tests/stage-e/pkg/ddv_save_core_bg.wasm
          test -z "$(git ls-files tests/stage-e/pkg)"
      - name: Public CI synthetic encrypted P1G fixture only
        shell: bash
        run: |
          set -euo pipefail
          node tests/stage-f/generate-fixture.mjs
          test -s tests/stage-f/fixtures/synthetic626.p1g
          test -s tests/stage-f/fixtures/expected.json
          test -z "$(git ls-files tests/stage-f/fixtures)"
      - name: Independent strict localhost HTTP and Build/SHA attestation negative matrix
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/owner-local-steam-v1-qa-independent.test.mjs
      - name: Real Chrome independent local file/attestation/session/Close worker race
        shell: bash
        run: |
          set -euo pipefail
          grep -F "./page.mjs" tests/stage-g/index.html
          cp tests/stage-g/qa-independent-page.mjs tests/stage-g/page.mjs
          trap 'git restore -- tests/stage-g/page.mjs' EXIT
          node tests/stage-g/chrome-smoke.mjs
          git restore -- tests/stage-g/page.mjs
          test -z "$(git diff --name-only -- tests/stage-g/page.mjs)"
      - name: No real owner Save, no QA-only merge or new production Writer/route
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git ls-files tests/stage-f/fixtures tests/stage-e/pkg)"
          test "$(git diff --name-only 4ec0c403900ab26e543a814aa7c017037b44efaf HEAD | wc -l)" -eq 3
          ! git grep -n -E 'STEAM_SAVE_OWNER_PRIVATE|include_bytes!|writerAuthorized: *true|applyAuthorized: *true' HEAD -- tests/stage-g/qa-independent-page.mjs tests/owner-local-steam-v1-qa-independent.test.mjs

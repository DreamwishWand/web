name: ACT1463 fixed FRP624 private-lab executable transport (NO SAVE)
on:
  pull_request:
    paths:
      - '.github/workflows/frp624-native-bound-private-lab-build.yml'
permissions:
  contents: read
jobs:
  build-only:
    if: github.head_ref == '01b/frp624-native-bound-private-lab' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2d95f7d849a4b978f2647e193526006c57a276e9
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Fixed source and approved Lock; add ignored transport-only test in temporary checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 2d95f7d849a4b978f2647e193526006c57a276e9
          p=crates/ddv-save-core/src/frp624_product_target.rs
          test "$(git hash-object "$p")" = aef06e21edb37f9e5ce48ecd59a1e27eca400861
          test "$(git hash-object crates/ddv-save-core/src/sr03_installed_geometry.rs)" = eed2a4c2d2086dbf9a08cf4dffbc0e676b3c721e
          test "$(git hash-object crates/ddv-save-core/src/frp624_product_geometry.rs)" = 6b676bf797e45825f6fd86dd69b9b92812db24af
          test "$(git hash-object crates/ddv-save-core/src/worker_session.rs)" = 244d3043a45ca684036d9a35607d2aa8f42b4dae
          test "$(git hash-object scripts/wasm-distribution/approved-Cargo.lock)" = b667b42cfef2032c2925be7b2aa9b7142bff4b52
          cp scripts/wasm-distribution/approved-Cargo.lock crates/ddv-save-core/Cargo.lock
          cat >> "$p" <<'RS'

          #[cfg(all(test,not(target_arch="wasm32"),feature="product-switch624-frp01-readonly"))]
          mod private_frp624_lab {
              use super::*;
              use std::{env,fs};
              use crate::worker_session::WorkerSessionGuard;
              fn hex32(v:&[u8;32])->String{v.iter().map(|x|format!("{x:02x}")).collect()}
              fn num(v:&Value)->u32{v.as_u64().and_then(|n|u32::try_from(n).ok()).unwrap()}
              fn ids(v:&Value)->[u32;3]{[num(&v[0]),num(&v[1]),num(&v[2])]}
              #[test]
              #[ignore="authorized local input only; never execute in CI"]
              fn genuine_frp624_worker_target(){
                  let path=env::var("WAND_FRP624_PRIVATE_DECODED").unwrap();
                  let bytes=fs::read(&path).unwrap();
                  let plan:Value=serde_json::from_slice(&fs::read(env::var("WAND_FRP624_PRIVATE_EXPECT").unwrap()).unwrap()).unwrap();
                  let want=&plan["target"];let bad=plan["blocked"].as_array().unwrap();
                  assert_eq!(hex32(&sha(&bytes)),want["decodedSha256"].as_str().unwrap());
                  let mut entropy=[0u8;32];getrandom::getrandom(&mut entropy).unwrap();
                  let s=ProductSession::open_switch624_frp01_in_worker(bytes,crate::BuildIdentity{
                      platform:Platform::Switch,build_kind:BuildKind::SwitchBid,
                      build_id:"52BD625D9B4E0053".into(),schema:624,externally_attested:true},entropy).unwrap();
                  let mut g=WorkerSessionGuard::attach(s);let before=g.receipt().unwrap();
                  let e=WorkerEnvelope{contract:PRODUCT_WORKER_CONTRACT,session_id:before.session_id,expected_revision:before.revision,expected_index_generation:before.index_generation,expected_decoded_sha256:before.decoded_sha256,action:WorkerAction::ReadDomain};
                  let mut got=g.read_switch624_frp01_target(e,num(&want["gridId"]),ids(&want["oldIds"])).expect("actual fixed target");
                  assert_eq!(got["sessionId"],before.session_id.iter().map(|x|format!("{x:02x}")).collect::<String>());
                  got.as_object_mut().unwrap().remove("sessionId");
                  assert_eq!(&got,want);
                  for v in bad{assert_eq!(g.read_switch624_frp01_target(e,num(&want["gridId"]),ids(v)).unwrap_err().0,"FRP01_TARGET_GEOMETRY");}
                  assert!(g.read_switch624_frp01_target(WorkerEnvelope{expected_revision:1,..e},num(&want["gridId"]),ids(&want["oldIds"])).is_err());
                  assert!(g.read_switch624_frp01_target(WorkerEnvelope{action:WorkerAction::Stage,..e},num(&want["gridId"]),ids(&want["oldIds"])).is_err());
                  assert_eq!(g.receipt().unwrap(),before);
                  assert_eq!(hex32(&sha(&fs::read(path).unwrap())),want["decodedSha256"].as_str().unwrap());
                  g.close().unwrap();assert!(g.read_switch624_frp01_target(e,num(&want["gridId"]),ids(&want["oldIds"])).is_err());
                  println!("FRP624_PRIVATE_WORKER_TARGET_ACTUAL_PASS 1POS{}GEOMETRY_NEG 3CAS_LIFECYCLE_NEG 19FIELDS",bad.len());
              }
          }
          RS
          # The only tracked workspace delta is the ignored transport harness.
          test "$(git diff --name-only)" = "$p"
          cargo test --locked --manifest-path crates/ddv-save-core/Cargo.toml --features product-switch624-frp01-readonly --lib --no-run --message-format=json > "$RUNNER_TEMP/frp624-build.jsonl"
          mkdir -p "$RUNNER_TEMP/frp624-lab"
          python3 - "$RUNNER_TEMP" <<'PY'
          import json, pathlib, shutil, sys, hashlib, subprocess
          p=pathlib.Path(sys.argv[1]); a=[json.loads(l) for l in (p/'frp624-build.jsonl').read_text().splitlines()]
          ex=[v['executable'] for v in a if v.get('reason')=='compiler-artifact' and v.get('executable') and v.get('profile',{}).get('test') and v.get('target',{}).get('name') in ('ddv_save_core','ddv-save-core')]
          assert len(ex)==1, len(ex)
          out=p/'frp624-lab'; exe=out/'frp624-private-target-test';shutil.copy2(ex[0],exe)
          h=lambda q:hashlib.sha256(pathlib.Path(q).read_bytes()).hexdigest()
          m={'source':'2d95f7d849a4b978f2647e193526006c57a276e9','binder':'aef06e21edb37f9e5ce48ecd59a1e27eca400861','geometry':'eed2a4c2d2086dbf9a08cf4dffbc0e676b3c721e','feature':'product-switch624-frp01-readonly','lockGit':'b667b42cfef2032c2925be7b2aa9b7142bff4b52','lockSha256':h('crates/ddv-save-core/Cargo.lock'),'harnessSha256':h('crates/ddv-save-core/src/frp624_product_target.rs'),'executableSha256':h(exe),'compiler':subprocess.check_output(['rustc','-Vv'],text=True),'purpose':'build-only local ignored test; no actual save in CI'}
          (out/'manifest.json').write_text(json.dumps(m,sort_keys=True,separators=(',',':'))+'\n')
          print('FRP624_LAB_BUILD_ONLY',m['source'],m['executableSha256'],m['lockSha256'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: frp624-fixed-private-target-test
          path: ${{ runner.temp }}/frp624-lab/
          if-no-files-found: error
          retention-days: 1

name: 04 QR-S Source167 independent genuine ES256 two PG Remove Reaction OFF
on:
  push:
    branches: [qa/pr639-source167-remove-reaction-independent-20261106]
  pull_request:
    branches: [comm/w-comm-006-source167-remove-reaction-off-20261106]
permissions:
  contents: read
jobs:
  qr-source167:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      DDVRE_E2_LOCAL_DISPOSABLE: APPROVED
      DATABASE_URL: ''
      SUPABASE_ACCESS_TOKEN: ''
      SUPABASE_PROJECT_ID: ''
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - name: Exact Source167 SHA and only two independent QA files
        shell: bash
        run: |
          set -euo pipefail
          SOURCE=5c52dd829c241c32d70ecaadfb88c2e51388d67c
          git merge-base --is-ancestor "$SOURCE" HEAD
          git diff --name-only "$SOURCE" HEAD | sort >/tmp/qr167-actual
          printf '%s\n' .github/workflows/qr-pr639-source167-remove-reaction-independent.yml tests/qr-pr639-source167-remove-reaction-independent.py | sort >/tmp/qr167-expected
          diff -u /tmp/qr167-expected /tmp/qr167-actual
          test -z "$(git diff --name-only "$SOURCE" HEAD -- supabase src docs static)"
          test "$(find supabase/migrations -name '*.sql' | wc -l)" -eq 167
          test "$(git hash-object supabase/migrations/20261104050000_community_source163_help_answer_service_execute_off.sql)" = c02bf514abf51951c19e05f8ca7ef7383f071c70
          test "$(git hash-object supabase/migrations/20261105010000_community_source164_reaction_add_service_execute_off.sql)" = 8a272688b3f85e999e43cb772736dba6bc305606
          test "$(git hash-object supabase/migrations/20261105020000_community_source165_save_entity_service_execute_off.sql)" = 7412435be16b73e97da46a8c387a2a116b7f5a6c
          test "$(git hash-object supabase/migrations/20261105030000_community_source166_unsave_entity_service_execute_off.sql)" = 18a8a7b822840075bc7e9602ed2341ac9be325e0
          test "$(git hash-object supabase/migrations/20261105040000_community_source167_remove_reaction_service_execute_off.sql)" = e14010ede368e0203faa7739acfe2837e2c025f8
          test "$(git hash-object supabase/functions/community-command/index.ts)" = 98c766be61a13a07e11388488355641b6142f052
          python3 -m py_compile tests/qr-pr639-source167-remove-reaction-independent.py
          test -z "$DATABASE_URL" && test -z "$SUPABASE_ACCESS_TOKEN" && test -z "$SUPABASE_PROJECT_ID"
          echo QR167_FROZEN_SOURCE_QA_ONLY_TWO_FILES_PASS
      - uses: supabase/setup-cli@v1
        with: {version: 2.109.0}
      - name: Disposable genuine ES256 GoTrue full167 start and reset
        shell: bash
        run: |
          set -euo pipefail
          printf '\n[auth]\nsigning_keys_path = "./signing_keys.json"\n' >>supabase/config.toml
          printf '[]\n' >supabase/signing_keys.json
          supabase gen signing-key --algorithm ES256 --yes >/tmp/qr167-signer.log 2>&1
          printf 'project_id = "ddvre_qr167_remove_independent_20261106"\n' | cat - supabase/config.toml >/tmp/qr167-config
          mv /tmp/qr167-config supabase/config.toml
          printf 'COMMUNITY_MEDIA_BUCKET=qr167-local-only\nWEP_PRESET_ARTIFACT_BUCKET=qr167-local-only\n' >supabase/functions/.env
          timeout 1800s supabase start >/tmp/qr167-start.log 2>&1 || { echo QR167_LOCAL_START_NOT_RUN; tail -n 10 /tmp/qr167-start.log | sed -E 's/(token|secret|key)[=:][^ ]+/\1=[REDACTED]/Ig'; exit 1; }
          timeout 900s supabase db reset --no-seed >/tmp/qr167-reset.log 2>&1 || { echo QR167_LOCAL_RESET_NOT_RUN; tail -n 10 /tmp/qr167-reset.log | sed -E 's/(token|secret|key)[=:][^ ]+/\1=[REDACTED]/Ig'; exit 1; }
          echo QR167_GENUINE_ES256_FULL167_LOCAL_RESET_PASS
      - run: python3 -m pip install --quiet 'psycopg[binary]==3.2.10'
      - name: Independent revoked and refreshed A1 removeReaction SQL 42501 two PG rollback
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/qr-pr639-source167-remove-reaction-independent.py | tee /tmp/qr167-run.log
          for marker in \
            QR167_PUBLIC_THREE_ROLE_ACL_DENIED_ANCESTOR_SIGNED_INTACT_PASS \
            QR167_ELIGIBLE_A2_409_DIRECT_SQL42501_REACTION_OUTBOX_NO_DIFF_PASS \
            QR167_REVOKED_A1_ORIGINAL_REFRESHED401_SIBLING200_FIVE_REPLAY_NO_DIFF_PASS \
            QR167_TWO_POSTGRES_BACKENDS_TEMP_GRANT_INVISIBLE_ROLLBACK_DENIED_PASS \
            QR167_INDEPENDENT_LOCAL_ES256_SOURCE167_REMOVE_ONLY_SCOPED_PASS; do
            grep -q "$marker" /tmp/qr167-run.log
          done
          echo QR167_INDEPENDENT_SIGNED_LOCAL_NEW_ONLY_NOT_CUMULATIVE_MANAGED_PASS
      - name: Dispose genuine local signer and ephemeral PostgreSQL
        if: always()
        shell: bash
        run: |
          supabase stop --no-backup >/dev/null 2>&1 || true
          rm -f supabase/signing_keys.json supabase/functions/.env /tmp/qr167-*
          echo QR167_LOCAL_CLEANUP_ATTEMPTED

<!doctype html>
<html lang="en" data-locale-runtime="shared-v1">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#141d37" />
    <script>
      // Theme remains independently persisted. Locale selection is runtime-managed and intentionally not persisted until Product defines preference semantics.
      try {
        const savedTheme = localStorage.getItem('dreamwishwand-theme');
        document.documentElement.dataset.theme = savedTheme === 'day' ? 'day' : 'night';
      } catch {
        document.documentElement.dataset.theme = 'night';
      }
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>

<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="robots" content="noindex,nofollow">
<title>01A DEV-only genuine Rust P1G Codec Worker synthetic CI</title>
<output id="test">RUNNING</output>
<script type="module">
window.__stageI=new Promise((resolve,reject)=>{
 const worker=new Worker('./worker.mjs',{type:'module'});
 let done=false;
 worker.onerror=e=>{if(!done){done=true;worker.terminate();reject(Error('STAGE_I_WORKER_ERROR:'+e.message))}};
 worker.onmessage=e=>{
   if(done)return;done=true;worker.terminate();
   if(e.data?.status==='PASS'){document.getElementById('test').textContent='PASS';resolve(e.data.summary)}
   else{document.getElementById('test').textContent='FAIL';reject(Error(String(e.data?.error||'unknown')))}
 };
 worker.postMessage({kind:'RUN_STAGE_I'});
});
</script></html>

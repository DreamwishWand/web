[package]
name = "ddv-save-core"
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
publish = false
description = "Dreamwish Wand single-owner product SaveSession ABI boundary; no Writer"

[features]
default = []
worker-wasm = ["dep:wasm-bindgen"]
# Explicit native-only fixture lab. NEVER compiled in production Worker.
synthetic-stage-b = []
# Opt-in typed metadata ReadSet; never product/UI enabled by default.
indexed-read = []
# Native-only Owner-private genuine P1G Rust V1 structural/index proof.
private-native-v1 = ["indexed-read"]
# Native-only exact 1-byte semantic-NOOP private edit proof; Writer remains OFF.
private-native-v2 = ["private-native-v1"]
# DEV/Owner-private semantic existing-field V2, excluded from Pages WASM release.
semantic-writer-dev = ["indexed-read"]
# Source-only product candidate; no Writer or Pages feature grant.
product-collection-scoped = ["indexed-read"]

# ACT916 scoped product candidate, explicitly excluded from current Pages.
product-amount-scoped = ["semantic-writer-dev"]
# 09P current one-Session Steam626 Makeup slot1 exact1 generated ABI; no Pages/Writer grant.
product-steam626-makeup-color1-scoped = ["semantic-writer-dev"]
# ACT1555: dedicated Steam626 Eyeball ColorIndex2 exact1, OFF unless per-Op release Gate.
product-steam626-eyecolor2-scoped = ["semantic-writer-dev"]
# ACT1630: one exact Steam626 Fence Reader. No generic semantic Writer or Stage.
product-steam626-singlefence-readonly = ["indexed-read"]
# ACT1685: exact Steam626 Item40700007 read-only target; no Writer/Pages grant.
product-steam626-bamboo-readonly = ["indexed-read"]
# Exact Switch626 Chest-only WASM delivery surface; reuse existing Core.
# Exact Steam626 linked crop Chest release surface, no public grant.
product-steam626-chest-scoped = ["product-amount-scoped"]
product-switch626-chest-scoped = ["product-amount-scoped"]

# Exact Steam626 COMP03 product release and optional read-only spatial companion.
product-steam626-comp03-scoped = ["product-amount-scoped"]
product-steam626-comp03-spatial-preview = ["product-steam626-comp03-scoped"]
product-steam626-sr03-scoped = ["product-amount-scoped"]
# Exact Switch626 mixed Road RM01; independent of Steam SR03.
product-switch626-rm01-scoped = ["product-amount-scoped"]
# Separate fixed Steam626 appearance product scopes; no generic appearance writer.
product-steam626-hair-scoped = ["product-amount-scoped"]
product-steam626-skin-scoped = ["product-amount-scoped"]
# 01A accepted isolated Switch626 Makeup Color1 Source only.
product-switch626-makeup-color1-internal = ["semantic-writer-dev"]
# 01A accepted isolated Switch626 Eyeball Color2 Source only.
product-switch626-eyecolor2-internal = ["semantic-writer-dev"]

product-switch626-fd01-scoped = ["product-amount-scoped"]
product-switch626-fe01-scoped = ["product-amount-scoped"]

# Internal fixed five ADD stages only; no generated public ABI or Writer authority.
product-switch626-fence-add-stage-internal = ["product-amount-scoped"]

product-switch626-fd02-scoped = ["product-switch626-fence-add-stage-internal"]
product-switch626-fd03-scoped = ["product-switch626-fence-add-stage-internal"]
product-switch626-ortho-l-scoped = ["product-switch626-fence-add-stage-internal"]
product-switch626-diagonal90-scoped = ["product-switch626-fence-add-stage-internal"]
product-switch626-ortho-t-scoped = ["product-switch626-fence-add-stage-internal"]

# Switch624 FRP01 exact-BID opt-in. Public Writer OFF.
product-switch624-frp01-readonly = ["semantic-writer-dev"]
product-switch624-frp01-stage-internal = ["product-switch624-frp01-readonly"]
product-switch624-frp01-scoped = ["product-switch624-frp01-stage-internal"]

[dependencies]
wasm-bindgen = { version = "=0.2.105", optional = true }
sha2 = "=0.10.8"
serde = { version = "=1.0.228", default-features = false, features = ["std"] }
serde_json = "=1.0.145"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
getrandom = "=0.2.16"

[lib]
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "wand-stageb-synthetic-reopen"
path = "src/bin/wand-stageb-synthetic-reopen.rs"
required-features = ["synthetic-stage-b"]

[[bin]]
name = "wand-local-rust-v1"
path = "src/bin/wand-local-rust-v1.rs"
required-features = ["private-native-v1"]

[[bin]]
name = "wand-local-rust-v2-noop"
path = "src/bin/wand-local-rust-v2-noop.rs"
required-features = ["private-native-v2"]

[package]
name = "ddv-save-core"
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
publish = false
description = "Dreamwish Wand single-owner product SaveSession ABI boundary; no Writer"

[features]
default = []
worker-wasm = ["dep:wasm-bindgen"]
# Explicit native-only fixture lab. NEVER compiled in production Worker.
synthetic-stage-b = []
# Opt-in typed metadata ReadSet; never product/UI enabled by default.
indexed-read = []
# Native-only Owner-private genuine P1G Rust V1 structural/index proof.
private-native-v1 = ["indexed-read"]
# Native-only exact 1-byte semantic-NOOP private edit proof; Writer remains OFF.
private-native-v2 = ["private-native-v1"]

[dependencies]
wasm-bindgen = { version = "=0.2.105", optional = true }
sha2 = "=0.10.8"
serde = { version = "=1.0.228", default-features = false, features = ["std"] }
serde_json = "=1.0.145"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
getrandom = "=0.2.16"

[lib]
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "wand-stageb-synthetic-reopen"
path = "src/bin/wand-stageb-synthetic-reopen.rs"
required-features = ["synthetic-stage-b"]

[[bin]]
name = "wand-local-rust-v1"
path = "src/bin/wand-local-rust-v1.rs"
required-features = ["private-native-v1"]

[[bin]]
name = "wand-local-rust-v2-noop"
path = "src/bin/wand-local-rust-v2-noop.rs"
required-features = ["private-native-v2"]
